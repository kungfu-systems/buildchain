schema = 1

[project]
type = "infra-contract"
name = "infra-terraform-shaped"

[infra]
adapter = "terraform"
adoption_mode = "observe-only"
apply = "disabled"
environment = "preview"
desired = ["desired/main.tf.json"]
contract = ["outputs/terraform-output.json"]

[[consumers]]
repo = "kungfu-systems/site-example"
path = "infra/outputs.json"
source = "outputs/terraform-output.json"
