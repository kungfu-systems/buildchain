schema = 1

[project]
type = "infra-contract"
name = "infra-cloudformation-shaped"

[infra]
adapter = "aws-cloudformation"
adoption_mode = "observe-only"
apply = "disabled"
environment = "preview"
desired = ["desired/site-stack.template.json"]
contract = ["outputs/stack-outputs.json"]

[[consumers]]
repo = "kungfu-systems/site-cloudformation-example"
path = "infra/outputs.json"
source = "outputs/stack-outputs.json"
