schema = 1

[project]
type = "infra-contract"
name = "infra-aws-cli-shaped"

[infra]
adapter = "aws-cli"
adoption_mode = "observe-only"
apply = "disabled"
environment = "preview"
desired = ["desired/request.json"]
contract = ["outputs/describe-response.json"]

[[consumers]]
repo = "kungfu-systems/site-aws-cli-example"
path = "infra/outputs.json"
source = "outputs/describe-response.json"
