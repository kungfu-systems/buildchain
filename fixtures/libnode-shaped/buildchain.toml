schema = 1

[version]
required = true
strategy = "anchored"
next = "manual"
manifest = "libnode.release.json"

[[version.files]]
type = "json"
path = "package.json"
key = "version"

[lifecycle.install]
command = "node scripts/install.mjs"

[lifecycle.build]
command = "node scripts/build.mjs"

[lifecycle.verify]
command = "node scripts/verify.mjs"
