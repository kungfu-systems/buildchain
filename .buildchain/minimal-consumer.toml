# Prepared product contract for the protected consumer migration.
# Inactive until the published entry and single-writer cutover are qualified.
schema = 2

[[products]]
id = "buildchain"
type = "npm"
platforms = [ "linux-x64" ]
install = [ "corepack enable pnpm", "corepack pnpm@11.7.0 install --frozen-lockfile", "rustup component add --toolchain 1.96.0 rustfmt clippy", "rustup target add --toolchain 1.96.0 wasm32-unknown-unknown" ]
build = [ "corepack pnpm@11.7.0 run build", "corepack pnpm@11.7.0 run generate:site" ]
verify = [ "corepack pnpm@11.7.0 run check" ]

[[products.artifacts]]
id = "package"
path = "."
kind = "npm-package"

[[products.targets]]
provider = "npm"
access = "public"
artifacts = [ "package" ]

[[products]]
id = "buildchain-linux"
type = "binary"
platforms = [ "linux-x64" ]
install = [ "corepack enable pnpm", "corepack pnpm@11.7.0 install --frozen-lockfile" ]
build = [ "node scripts/build-standalone-binary.mjs" ]
verify = [ "node scripts/verify-standalone-product.mjs" ]

[[products.artifacts]]
id = "binary"
path = "dist/binary/buildchain-x86_64-unknown-linux-gnu.tar.gz"
kind = "archive"
filename = "buildchain-x86_64-unknown-linux-gnu.tar.gz"

[[products.targets]]
provider = "github-release"
artifacts = [ "binary" ]

[[products]]
id = "buildchain-macos"
type = "binary"
platforms = [ "macos-arm64" ]
install = [ "corepack enable pnpm", "corepack pnpm@11.7.0 install --frozen-lockfile" ]
build = [ "node scripts/build-standalone-binary.mjs" ]
verify = [ "node scripts/verify-standalone-product.mjs" ]

[[products.artifacts]]
id = "binary"
path = "dist/binary/buildchain-aarch64-apple-darwin.tar.gz"
kind = "archive"
filename = "buildchain-aarch64-apple-darwin.tar.gz"

[[products.targets]]
provider = "github-release"
artifacts = [ "binary" ]

[[products]]
id = "buildchain-windows"
type = "binary"
platforms = [ "windows-x64" ]
install = [ "corepack enable pnpm", "corepack pnpm@11.7.0 install --frozen-lockfile" ]
build = [ "node scripts/build-standalone-binary.mjs" ]
verify = [ "node scripts/verify-standalone-product.mjs" ]

[[products.artifacts]]
id = "binary"
path = "dist/binary/buildchain-x86_64-pc-windows-msvc.zip"
kind = "archive"
filename = "buildchain-x86_64-pc-windows-msvc.zip"

[[products.targets]]
provider = "github-release"
artifacts = [ "binary" ]

[version]
strategy = "semver"
derived_files = [ "dist/site/kfd-claims.json", "dist/site/public-surface-audit.json", "dist/site/workflow-registry.json" ]

[[version.files]]
path = "package.json"
key = "version"
format = "json"

[[version.files]]
path = ".buildchain/release-impact.json"
key = "release.version"
format = "json"

[[version.files]]
path = "dist/site/buildchain-contract.json"
key = "product.version"
format = "json"

[[version.files]]
path = "dist/site/buildchain-site.json"
key = "package.version"
format = "json"

[[version.files]]
path = "dist/site/site-manifest.json"
key = "package.version"
format = "json"

[[version.files]]
path = "dist/site/publication-registry.json"
key = "package.version"
format = "json"

[[version.files]]
path = "dist/site/kfd-upstream-aggregate.json"
key = "product.version"
format = "json"

[[channels]]
from = "feature/*"
to = "dev/v4/v4.1"
operation = "develop"

[[channels]]
from = "dev/v4/v4.1"
to = "alpha/v4/v4.1"
operation = "alpha"

[[channels]]
from = "alpha/v4/v4.1"
to = "release/v4/v4.1"
operation = "stable"

[[channels]]
from = "release/v4/v4.1"
to = "publish-gate/major"
operation = "major"

[review]
minimum_approvals = 1
code_owners = true
merge_queue = true

[stable]
minimum_interval_seconds = 86400
minimum_soak_seconds = 3600
product_paths = [ ".buildchain/stable-release-policy.json", ".github/workflows/", "actions/", "packages/", "scripts/" ]
impact_file = ".buildchain/release-impact.json"
require_published_entry = true
