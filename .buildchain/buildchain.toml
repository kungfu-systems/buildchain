schema = 1

[version]
required = true

[[version.files]]
type = "json"
path = "package.json"
key = "version"

[[version.files]]
type = "json"
path = ".buildchain/release-impact.json"
key = "release.version"

[[version.files]]
type = "json"
path = "dist/site/buildchain-contract.json"
key = "product.version"

[[version.files]]
type = "json"
path = "dist/site/buildchain-site.json"
key = "package.version"

[[version.files]]
type = "json"
path = "dist/site/site-manifest.json"
key = "package.version"

[[version.files]]
type = "json"
path = "dist/site/publication-registry.json"
key = "package.version"

[[version.files]]
type = "json"
path = "dist/site/kfd-upstream-aggregate.json"
key = "product.version"

[lifecycle.install]
command = "corepack pnpm@11.7.0 install --frozen-lockfile"

[lifecycle.verify]
commands = [
  "corepack pnpm@11.7.0 run check",
]

[lifecycle.version-state]
command = "node scripts/generate-site-bundle.mjs"

[lifecycle.publish]
command = "node scripts/npm-publish-transaction.mjs"

[governance.dev.merge_queue]
mode = "enabled"
required_workflows = [".github/workflows/verify.yml"]
check_response_timeout_minutes = 120
max_entries_to_build = 1
bypass_users = ["dongkeren"]

[release.stable]
strategy = "latest-qualified-alpha"
timezone = "Asia/Shanghai"
publish_at = "03:00"
minimum_soak_seconds = 3600
required_checks = [
  "alpha-release",
  "workflow:Build Surface Fixture",
  "status:buildchain-canary/site-libkungfu-dev",
]
auto_promote = true
auto_merge = true

[[facts.version_sources]]
id = "package"
type = "json"
path = "package.json"
key = "version"

[[facts.modules]]
id = "buildchain-core"
root = "packages/core"
scope = "node-api"
version_source = "package"
lifecycle = "version-state"
outputs = [
  "dist/site/buildchain-site.json",
  "dist/site/manual-registry.json",
  "dist/site/node-api-registry.json",
]

[[facts.products]]
id = "buildchain"
module_facts = [".buildchain/facts/buildchain-core.json"]
artifacts = [
  "dist/site/buildchain-site.json",
  "dist/site/site-manifest.json",
]

[badges]
release_passport = "https://github.com/kungfu-systems/buildchain/releases/latest/download/buildchain.release.json"
kfd_1 = "declared"
kfd_2 = "declared"
kfd_3 = "declared"
kfd_4 = "declared"
platforms = ["macOS", "Linux", "Windows"]
workflows = ["verify.yml", "buildchain-ref-promotion.yml", "binary-distribution.yml"]

[kfd.upstream]
auto_discover = false

[[kfd.upstream.components]]
id = "kfd"
package = "@kungfu-tech/kfd"
repository = "kungfu-systems/kfd"
kfd_1 = "exported-witness"
kfd_2 = "exported-claim"
kfd_3 = "exported-collaboration-interface"
kfd_4 = "schema-metadata"
evidence = [
  "package:kfd.release.json",
  "package:.buildchain/kfd-1/contract-world.witness.json",
  "package:.buildchain/kfd-2/public-release-trust.claim.json",
  "package:.buildchain/kfd-2/kfd-foundation.trust-claims.json",
  "package:.buildchain/kfd-2/kfd-foundation.trust-assessment.json",
  "package:.buildchain/kfd-3/collaboration-interface.json",
  "package:standards.json",
]
