name: build-agent-hub-evidence
description: "Shared build steps owned by Buildchain verification maintainers"
inputs:
  plan-json:
    description: "Resolved plan-json; supplied by the build backbone"
    required: true
  platform-json:
    description: "Resolved platform-json; supplied by the build backbone"
    required: true
  source-json:
    description: "Resolved source-json; supplied by the build backbone"
    required: true
runs:
  using: composite
  steps:
    - name: Run KFD Agent Hub conformance
      if: ${{ fromJSON(inputs.plan-json).environment.tools.kfd_agent_hub == 'auto' }}
      shell: bash
      run: >-
        node .buildchain/runtime/bin/buildchain.mjs kfd hub test
        --cwd "${{ fromJSON(inputs.plan-json).project.cwd }}"
        --output-dir ".buildchain/artifacts/kfd-agent-hub/${{ fromJSON(inputs.platform-json).id }}"
        --for agent

    - name: Upload KFD Agent Hub evidence
      if: ${{ fromJSON(inputs.plan-json).environment.tools.kfd_agent_hub == 'auto' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ fromJSON(inputs.plan-json).artifacts.name }}-kfd-agent-hub-${{ fromJSON(inputs.platform-json).id }}-${{ fromJSON(inputs.source-json).publish-source-sha }}
        path: ${{ fromJSON(inputs.plan-json).project.cwd }}/.buildchain/artifacts/kfd-agent-hub/${{ fromJSON(inputs.platform-json).id }}
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.plan-json).build.artifacts.retention_days }}
