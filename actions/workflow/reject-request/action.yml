name: reject-request
description: Fail a request already rejected by its workflow admission condition.
inputs:
  reason:
    description: Reason this request cannot be executed.
    required: true
runs:
  using: composite
  steps:
    - name: Report rejected request
      shell: bash
      env:
        BUILDCHAIN_REJECTION: ${{ inputs.reason }}
      run: |
        printf "::error::%s\n" "$BUILDCHAIN_REJECTION"
        exit 1
