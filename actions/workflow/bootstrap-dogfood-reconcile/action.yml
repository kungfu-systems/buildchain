name: bootstrap-dogfood-reconcile
description: Execute the bootstrap-dogfood reconcile capability within its caller job boundary.
inputs:
  needs-prepare-outputs-candidate-sha:
    description: Caller needs.prepare.outputs.candidate-sha value.
    required: true
  needs-primary-conformance-outputs-result-json:
    description: Caller needs.primary-conformance.outputs.result-json value.
    required: true
  needs-recovery-conformance-outputs-result-json:
    description: Caller needs.recovery-conformance.outputs.result-json value.
    required: true
  needs-primary-alpha-outputs-result-json:
    description: Caller needs.primary-alpha.outputs.result-json value.
    required: true
  needs-recovery-alpha-outputs-result-json:
    description: Caller needs.recovery-alpha.outputs.result-json value.
    required: true
  needs-primary-stable-outputs-result-json:
    description: Caller needs.primary-stable.outputs.result-json value.
    required: true
  needs-recovery-stable-outputs-result-json:
    description: Caller needs.recovery-stable.outputs.result-json value.
    required: true
runs:
  using: composite
  steps:
    - name: Checkout exact candidate verifier
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ fromJSON(inputs.needs-prepare-outputs-candidate-sha) }}
        path: .buildchain/candidate
        persist-credentials: false
    - name: Prepare independently reviewed verifier
      id: core-node
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/candidate
    - name: Verify all three execution pairs
      shell: bash
      env:
        CANDIDATE_SHA: ${{ fromJSON(inputs.needs-prepare-outputs-candidate-sha) }}
        CONFORMANCE_PRIMARY: ${{ fromJSON(inputs.needs-primary-conformance-outputs-result-json) }}
        CONFORMANCE_RECOVERY: ${{ fromJSON(inputs.needs-recovery-conformance-outputs-result-json) }}
        ALPHA_PRIMARY: ${{ fromJSON(inputs.needs-primary-alpha-outputs-result-json) }}
        ALPHA_RECOVERY: ${{ fromJSON(inputs.needs-recovery-alpha-outputs-result-json) }}
        STABLE_PRIMARY: ${{ fromJSON(inputs.needs-primary-stable-outputs-result-json) }}
        STABLE_RECOVERY: ${{ fromJSON(inputs.needs-recovery-stable-outputs-result-json) }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/candidate/packages/core/workflow/nodes/self-dogfood.mjs" reconcile
    - name: Retain Exact-candidate self-dogfood evidence
      uses: actions/upload-artifact@v7.0.0
      with:
        name: universal-train-self-dogfood-${{ fromJSON(inputs.needs-prepare-outputs-candidate-sha) }}
        path: .buildchain/self-dogfood
        if-no-files-found: error
        retention-days: 30
