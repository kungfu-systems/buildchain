name: bootstrap-dogfood-prepare
description: Execute the bootstrap-dogfood prepare capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
outputs:
  ready:
    description: ready node result.
    value: ${{ steps.readiness.outputs.ready }}
  candidate-sha:
    description: candidate-sha node result.
    value: ${{ steps.coordinates.outputs.candidate-sha }}
  conformance-request:
    description: conformance-request node result.
    value: ${{ steps.requests.outputs.conformance-request }}
  alpha-request:
    description: alpha-request node result.
    value: ${{ steps.requests.outputs.alpha-request }}
  stable-request:
    description: stable-request node result.
    value: ${{ steps.requests.outputs.stable-request }}
runs:
  using: composite
  steps:
    - name: Prepare workflow implementation
      id: core-node
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    - name: Resolve immutable self-consumer coordinates
      id: coordinates
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_PULL_REQUEST: ${{ github.event.pull_request.number }}
        DISPATCH_CANDIDATE_SHA: ${{ fromJSON(inputs.request-json).candidate-sha }}
        DISPATCH_PULL_REQUEST: ${{ fromJSON(inputs.request-json).pull-request }}
        DISPATCH_CONSUMER_SHA: ${{ fromJSON(inputs.request-json).consumer-sha }}
        EVENT_CONSUMER_SHA: ${{ github.sha }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_ACTION_PATH/../../../packages/core/workflow/nodes/self-dogfood.mjs" coordinates
    - name: Require current independent review and exact successful check
      id: readiness
      uses: actions/github-script@v8
      env:
        CANDIDATE_SHA: ${{ steps.coordinates.outputs.candidate-sha }}
        REVIEW_PR: ${{ steps.coordinates.outputs.pull-request }}
        BUILDCHAIN_ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const { pathToFileURL } = require("node:url");
          const entry = new URL("../../../packages/core/workflow/nodes/self-dogfood-readiness.mjs", pathToFileURL(process.env.BUILDCHAIN_ACTION_PATH + "/"));
          await (await import(entry.href)).default({ github, core });
    - name: Checkout exact candidate request generator
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ steps.coordinates.outputs.candidate-sha }}
        path: .buildchain/candidate
        persist-credentials: false
      if: ${{ steps.readiness.outputs.ready == 'true' }}
    - name: Prepare independently reviewed candidate
      if: ${{ steps.readiness.outputs.ready == 'true' }}
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/candidate
    - name: Generate closed requests after exact review readiness
      id: requests
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_SHA: ${{ steps.coordinates.outputs.candidate-sha }}
        CONSUMER_SHA: ${{ steps.coordinates.outputs.consumer-sha }}
        REVIEW_PR: ${{ steps.coordinates.outputs.pull-request }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/candidate/packages/core/workflow/nodes/self-dogfood.mjs" requests
      if: ${{ steps.readiness.outputs.ready == 'true' }}
