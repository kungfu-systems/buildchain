name: admit universal workflow admission
description: Coordinate exact request, review and terminal evidence through a
  named workflow authority API.
inputs:
  request-json:
    description: request-json exact workflow authority input.
    required: true
  review-json:
    description: review-json exact workflow authority input.
    required: true
outputs:
  runtime-sha:
    description: runtime-sha rooted workflow evidence.
  request-root:
    description: request-root rooted workflow evidence.
  admission-root:
    description: admission-root rooted workflow evidence.
  admission-json:
    description: admission-json rooted workflow evidence.
runs:
  using: node24
  main: dist/index.js
