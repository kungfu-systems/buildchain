name: inspect universal workflow admission
description: Coordinate exact request, review and terminal evidence through a
  named workflow authority API.
inputs:
  request-json:
    description: request-json exact workflow authority input.
    required: true
  recovery:
    description: Require a closed Train recovery request before any candidate code.
    default: "false"
outputs:
  mode:
    description: mode rooted workflow evidence.
  repository:
    description: repository rooted workflow evidence.
  discovery-ref:
    description: discovery-ref rooted workflow evidence.
  expected-sha:
    description: expected-sha rooted workflow evidence.
  review-pr:
    description: review-pr rooted workflow evidence.
  capability-id:
    description: capability-id rooted workflow evidence.
  request-root:
    description: request-root rooted workflow evidence.
runs:
  using: node24
  main: dist/index.js
