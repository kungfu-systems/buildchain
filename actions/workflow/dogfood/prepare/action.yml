name: bootstrap-dogfood-prepare
description: Execute the bootstrap-dogfood prepare capability within its caller
  job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
outputs:
  ready:
    description: ready node result.
    value: ${{ steps.readiness.outputs.ready }}
  candidate-sha:
    description: candidate-sha node result.
    value: ${{ steps.readiness.outputs.candidate-sha }}
  conformance-request:
    description: conformance-request node result.
    value: ${{ steps.requests.outputs.conformance-request }}
  alpha-request:
    description: alpha-request node result.
    value: ${{ steps.requests.outputs.alpha-request }}
  stable-request:
    description: stable-request node result.
    value: ${{ steps.requests.outputs.stable-request }}
runs:
  using: composite
  steps:
    - name: Admit exact self-dogfood coordinates and readiness
      id: readiness
      uses: ./.buildchain/runtime/actions/workflow/dogfood/admit
      with:
        request-json: ${{ inputs.request-json }}
        token: ${{ github.token }}
    - name: Generate closed requests after exact review readiness
      id: requests
      if: ${{ steps.readiness.outputs.ready == 'true' }}
      uses: ./.buildchain/runtime/actions/workflow/dogfood/generate
      with:
        coordinates-json: ${{ toJSON(steps.readiness.outputs) }}
