name: backflow universal workflow settlement
description: Coordinate exact request, review and terminal evidence through a
  named workflow authority API.
inputs:
  request-json:
    description: request-json exact workflow authority input.
    required: true
  receipt-json:
    description: receipt-json exact workflow authority input.
    required: true
  token:
    description: token exact workflow authority input.
    required: true
outputs:
  backflow-root:
    description: backflow-root rooted workflow evidence.
runs:
  using: node24
  main: dist/index.js
