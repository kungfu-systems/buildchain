name: bootstrap-admit
description: Execute the bootstrap admit capability within its caller job boundary.
inputs:
  job-workflow-sha:
    description: Caller job.workflow_sha value.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
outputs:
  runtime-sha:
    description: runtime-sha node result.
    value: ${{ steps.admit.outputs.runtime-sha }}
  capability-id:
    description: capability-id node result.
    value: ${{ steps.inspect.outputs.capability-id }}
  request-root:
    description: request-root node result.
    value: ${{ steps.admit.outputs.request-root }}
  admission-root:
    description: admission-root node result.
    value: ${{ steps.admit.outputs.admission-root }}
  admission-json:
    description: admission-json node result.
    value: ${{ steps.admit.outputs.admission-json }}
runs:
  using: composite
  steps:
  - uses: actions/setup-node@v6.4.0
    with:
      node-version: '24'
  - name: Checkout immutable Bootstrap shell
    uses: actions/checkout@v7.0.0
    with:
      repository: kungfu-systems/buildchain
      ref: ${{ fromJSON(inputs.job-workflow-sha) }}
      path: .buildchain/bootstrap
      persist-credentials: false
  - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    with:
      directory: .buildchain/bootstrap
  - name: Inspect the closed request envelope
    id: inspect
    shell: bash
    env:
      BUILDCHAIN_UNIVERSAL_REQUEST_JSON: ${{ fromJSON(inputs.request-json).request-json }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/workflow/nodes/bootstrap.mjs" inspect
  - name: Checkout candidate without persisted credentials
    uses: actions/checkout@v7.0.0
    with:
      repository: ${{ steps.inspect.outputs.repository }}
      ref: ${{ steps.inspect.outputs.discovery-ref }}
      path: .buildchain/candidate
      persist-credentials: false
  - name: Read back independent review and exact-head checks
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_MODE: ${{ steps.inspect.outputs.mode }}
      CANDIDATE_REPOSITORY: ${{ steps.inspect.outputs.repository }}
      CANDIDATE_EXPECTED_SHA: ${{ steps.inspect.outputs.expected-sha }}
      CANDIDATE_REVIEW_PR: ${{ steps.inspect.outputs.review-pr }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/workflow/nodes/bootstrap.mjs" review
  - name: Admit the exact reviewed candidate
    id: admit
    shell: bash
    env:
      BUILDCHAIN_UNIVERSAL_REQUEST_JSON: ${{ fromJSON(inputs.request-json).request-json }}
      BUILDCHAIN_UNIVERSAL_CONSUMER_REPOSITORY: ${{ github.repository }}
      BUILDCHAIN_UNIVERSAL_CONSUMER_SHA: ${{ github.sha }}
      BUILDCHAIN_UNIVERSAL_CONSUMER_WORKFLOW_REF: ${{ github.workflow_ref }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/workflow/nodes/bootstrap.mjs" admit
