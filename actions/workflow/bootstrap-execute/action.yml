name: bootstrap-execute
description: Execute the bootstrap execute capability within its caller job boundary.
inputs:
  needs-admit-outputs-runtime-sha:
    description: Caller needs.admit.outputs.runtime-sha value.
    required: true
  needs-admit-outputs-capability-id:
    description: Caller needs.admit.outputs.capability-id value.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  needs-admit-outputs-admission-json:
    description: Caller needs.admit.outputs.admission-json value.
    required: true
  secrets-buildchain-promotion-token:
    description: Explicit scoped provider credential.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
outputs:
  result-json:
    description: result-json node result.
    value: ${{ steps.execute.outputs.result-json }}
  result-root:
    description: result-root node result.
    value: ${{ steps.execute.outputs.result-root }}
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Checkout exact admitted candidate
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ fromJSON(inputs.needs-admit-outputs-runtime-sha) }}
        path: .buildchain/candidate
        persist-credentials: false
    - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/candidate
    - name: Set up release-promotion Node.js
      if: ${{ fromJSON(inputs.needs-admit-outputs-capability-id) == 'release-candidate-promote' }}
      uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Install release-promotion consumer dependencies
      if: ${{ fromJSON(inputs.needs-admit-outputs-capability-id) == 'release-candidate-promote' }}
      shell: bash
      run: |
        set -euo pipefail
        corepack prepare pnpm@11.7.0 --activate
        corepack pnpm@11.7.0 install --frozen-lockfile --ignore-scripts
    - name: Execute candidate engine
      id: execute
      shell: bash
      env:
        BUILDCHAIN_UNIVERSAL_REQUEST_JSON: ${{ fromJSON(inputs.request-json).request-json }}
        BUILDCHAIN_UNIVERSAL_ADMISSION_JSON: ${{ fromJSON(inputs.needs-admit-outputs-admission-json) }}
        BUILDCHAIN_UNIVERSAL_ENGINE_SHA: ${{ fromJSON(inputs.needs-admit-outputs-runtime-sha) }}
        BUILDCHAIN_PROMOTION_TOKEN: ${{ inputs.secrets-buildchain-promotion-token }}
        GH_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/../../../packages/core/workflow/nodes/bootstrap.mjs" execute
