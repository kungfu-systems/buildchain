name: "Promote Buildchain Ref"
author: "Keren Dong"
description: "Promote verified buildchain release-line refs through source version commits"
inputs:
  token:
    description: "GitHub token with contents:write"
    required: true
  sha:
    description: "Verified commit SHA used as the source parent for promotion"
    required: true
  target-ref:
    description: "Buildchain channel branch that must currently point at sha"
    required: true
  tags:
    description: "Optional comma-separated ABV-style tags to update. Defaults from target-ref channel and release-line patch/prerelease sequence."
    default: ""
  dry-run:
    description: "Explain the release-line promotion plan and report planned ref updates without writing refs"
    default: "false"
  require-governance:
    description: "Require protected-channel PR lineage and release-from-alpha checks"
    default: "true"
  require-version-state:
    description: "Fail promotion when no package version state can be updated"
    default: "true"
  verification-command:
    description: "Command to run against each generated version-state tree before refs move"
    default: ""
  required-status-check:
    description: "Status check name fragment required by protected channel branches"
    default: "check"
  allow-repository:
    description: "Repository allowed to promote"
    default: "kungfu-systems/buildchain"
  publish-transaction:
    description: "Run lifecycle.publish or publish-command and require valid publish evidence before final refs move"
    default: "false"
  publish-command:
    description: "Explicit publish command. Overrides lifecycle.publish when set."
    default: ""
  publish-evidence-path:
    description: "Path to publish evidence JSON. Defaults to .buildchain/release-evidence/<tag>/evidence.json"
    default: ""
  transaction-state-path:
    description: "Path to release transaction state JSON. Defaults to .buildchain/release-state/<tag>.json"
    default: ""
  publish-required-artifacts-json:
    description: "JSON array of required artifacts whose evidence must exist before refs move"
    default: ""
  release-material-sha:
    description: "Material SHA that published artifacts must prove. Defaults to the generated release SHA."
    default: ""
  publish-tooling-sha:
    description: "Publish tooling SHA used for controlled repair. Defaults to the generated release SHA."
    default: ""
  publish-transaction-override:
    description: "Explicitly allow recovery from repair_required, abandoned, or failed_permanently transaction states"
    default: "false"
outputs:
  sha:
    description: "Final promoted release or alpha commit SHA"
  tags:
    description: "Comma-separated tags updated by the promotion"
  next-anchor-required:
    description: "true when anchored/manual strategy leaves next anchor creation to the repository"
  transaction-id:
    description: "Stable release transaction identity"
  transaction-state:
    description: "Final release transaction state"
  transaction-exact-tag:
    description: "Exact release or prerelease tag governed by the transaction"
  transaction-release-sha:
    description: "Release/version-state SHA governed by the transaction"
  transaction-state-ref:
    description: "Machine-managed durable release transaction ref"
  transaction-state-sha:
    description: "Commit SHA at the durable release transaction ref"
  transaction-state-path:
    description: "Release transaction state file path"
  publish-evidence-path:
    description: "Publish evidence file path"
  finalization-needed:
    description: "true when publish completed but protected ref finalization still needs a later run"
runs:
  using: "node24"
  main: "dist/index.js"
