name: "Promote Buildchain Ref"
author: "Keren Dong"
description: "Promote verified buildchain release-line refs through source version commits"
inputs:
  token:
    description: "GitHub token with contents:write"
    required: true
  sha:
    description: "Verified commit SHA used as the source parent for promotion"
    required: true
  target-ref:
    description: "Buildchain channel branch that must currently point at sha"
    required: true
  tags:
    description: "Optional comma-separated ABV-style tags to update. Defaults from target-ref channel and release-line patch/prerelease sequence."
    default: ""
  dry-run:
    description: "Only print planned ref updates"
    default: "false"
  require-governance:
    description: "Require protected-channel PR lineage and release-from-alpha checks"
    default: "true"
  require-version-state:
    description: "Fail promotion when no package version state can be updated"
    default: "true"
  verification-command:
    description: "Command to run against each generated version-state tree before refs move"
    default: ""
  required-status-check:
    description: "Status check name fragment required by protected channel branches"
    default: "check"
  allow-repository:
    description: "Repository allowed to promote"
    default: "kungfu-systems/buildchain"
outputs:
  sha:
    description: "Final promoted release or alpha commit SHA"
  tags:
    description: "Comma-separated tags updated by the promotion"
  next-anchor-required:
    description: "true when anchored/manual strategy leaves next anchor creation to the repository"
runs:
  using: "node24"
  main: "dist/index.js"
