name: "Promote Buildchain Ref"
author: "Keren Dong"
description: "Promote verified buildchain release-line refs through source version commits"
inputs:
  token:
    description: "GitHub token with contents:write"
    required: true
  sha:
    description: "Verified commit SHA used as the source parent for promotion"
    required: true
  target-ref:
    description: "Buildchain channel branch that must currently point at sha"
    required: true
  tags:
    description: "Optional comma-separated ABV-style tags to update. Defaults from target-ref channel and release-line patch/prerelease sequence."
    default: ""
  dry-run:
    description: "Explain the release-line promotion plan and report planned ref updates without writing refs"
    default: "false"
  require-governance:
    description: "Require protected-channel PR lineage and release-from-alpha checks"
    default: "true"
  require-version-state:
    description: "Fail promotion when no package version state can be updated"
    default: "true"
  verification-command:
    description: "Command to run against each generated version-state tree before refs move"
    default: ""
  required-status-check:
    description: "Status check name fragment required by protected channel branches"
    default: "check"
  allow-repository:
    description: "Repository allowed to promote"
    default: "kungfu-systems/buildchain"
  publish-transaction:
    description: "Run lifecycle.publish or publish-command and require valid publish evidence before final refs move"
    default: "false"
  publish-command:
    description: "Explicit publish command. Overrides lifecycle.publish when set."
    default: ""
  publish-evidence-path:
    description: "Path to publish evidence JSON. Defaults to .buildchain/release-evidence/<tag>/evidence.json"
    default: ""
  transaction-state-path:
    description: "Path to release transaction state JSON. Defaults to .buildchain/release-state/<tag>.json"
    default: ""
  publish-required-artifacts-json:
    description: "JSON array of required artifacts whose evidence must exist before refs move"
    default: ""
  publish-mode:
    description: "Publish mode: publish-final-version or promote-existing-version"
    default: ""
  publish-auth:
    description: "Publish auth model: trusted-publishing or npm-token"
    default: ""
  publish-dist-tag:
    description: "Expected npm dist-tag for publish or existing-version promotion"
    default: ""
  publish-package-set-order:
    description: "Package-set order: as-provided or platforms-first-main-last"
    default: ""
  publish-package-main:
    description: "Main npm package name for package-set visibility gating"
    default: ""
  require-publish-source-lock:
    description: "Require publish side effects to come from a resolved publish-gate source lock"
    default: "false"
  publish-source-ref:
    description: "Resolved publish-gate source ref from the reusable build workflow"
    default: ""
  publish-source-sha:
    description: "Resolved publish-gate source SHA from the reusable build workflow"
    default: ""
  publish-source-locked:
    description: "Whether the reusable build workflow locked the publish source ref"
    default: ""
  release-material-sha:
    description: "Material SHA that published artifacts must prove. Defaults to the generated release SHA."
    default: ""
  publish-tooling-sha:
    description: "Publish tooling SHA used for controlled repair. Defaults to the generated release SHA."
    default: ""
  publish-transaction-override:
    description: "Explicitly allow recovery from repair_required, abandoned, or failed_permanently transaction states"
    default: "false"
  release-passport:
    description: "Generate and persist the unified buildchain-release-passport after publish transaction completion"
    default: "true"
  release-passport-output-dir:
    description: "Directory where the generated buildchain-release-passport files are written"
    default: ".buildchain/release-passport"
  release-passport-build-summary-path:
    description: "Aggregate build summary JSON to include in buildchain.release.json when present"
    default: ".buildchain/artifacts/build-summary.json"
  release-passport-platform-manifest-paths:
    description: "Optional comma- or newline-separated platform artifact manifest JSON paths to include"
    default: ""
  promote-only-release-candidate:
    description: "Fail fast unless a verified PR-stage release-candidate passport matches the promotion source before publish-gate side effects run"
    default: "false"
  release-candidate-passport-path:
    description: "Path to the PR-stage release-candidate passport JSON used by promote-only-release-candidate"
    default: ".buildchain/artifacts/release-candidate-passport.json"
  release-candidate-build-summary-path:
    description: "Optional aggregate build summary JSON whose hash must match the release-candidate passport when present"
    default: ".buildchain/artifacts/build-summary.json"
  release-candidate-version:
    description: "Optional expected product version recorded in the release-candidate passport"
    default: ""
outputs:
  sha:
    description: "Final promoted release or alpha commit SHA"
  tags:
    description: "Comma-separated tags updated by the promotion"
  next-anchor-required:
    description: "true when anchored/manual strategy leaves next anchor creation to the repository"
  transaction-id:
    description: "Stable release transaction identity"
  transaction-state:
    description: "Final release transaction state"
  transaction-exact-tag:
    description: "Exact release or prerelease tag governed by the transaction"
  transaction-release-sha:
    description: "Release/version-state SHA governed by the transaction"
  transaction-state-ref:
    description: "Machine-managed durable release transaction ref"
  transaction-state-sha:
    description: "Commit SHA at the durable release transaction ref"
  transaction-state-path:
    description: "Release transaction state file path"
  publish-evidence-path:
    description: "Publish evidence file path"
  release-passport-path:
    description: "Generated buildchain.release.json path"
  release-passport-output-dir:
    description: "Generated buildchain-release-passport directory"
  release-passport-state-sha:
    description: "Durable release-state commit SHA after uploading passport files"
  finalization-needed:
    description: "true when publish completed but protected ref finalization still needs a later run"
runs:
  using: "node24"
  main: "dist/index.js"
