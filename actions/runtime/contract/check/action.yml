name: Inspect runtime contract
description: Evaluate the consumer contract lock against the selected runtime
  and emit drift evidence before rejection.
inputs:
  request-json:
    description: request-json
    required: true
  runtime-ref:
    description: runtime-ref
    required: true
  runtime-sha:
    description: runtime-sha
    required: true
  runtime-class:
    description: runtime-class
    required: true
  workflow-ref:
    description: workflow-ref
    required: true
  runtime-override:
    description: runtime-override
    required: true
outputs:
  contract-lock-status:
    description: contract-lock-status
  contract-lock-compatible:
    description: contract-lock-compatible
  contract-lock-drift:
    description: contract-lock-drift
  contract-lock-issue-needed:
    description: contract-lock-issue-needed
  contract-lock-issue-body-file:
    description: contract-lock-issue-body-file
  contract-digest:
    description: contract-digest
  contract-compatibility-digest:
    description: contract-compatibility-digest
  accepted-contract-digest:
    description: accepted-contract-digest
  accepted-buildchain-sha:
    description: accepted-buildchain-sha
  current-buildchain-sha:
    description: current-buildchain-sha
runs:
  using: node24
  main: dist/index.js
