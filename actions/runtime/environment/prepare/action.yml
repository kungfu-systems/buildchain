name: Prepare the selected execution runtime
description: The sole entry for acquiring and activating Buildchain execution code.
inputs:
  selection:
    description: Runtime identity selected once by the entry job.
    required: true
  token:
    description: Repository read credential.
    required: true
runs:
  using: composite
  steps:
    - name: Acquire the selected execution code
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.selection).repository }}
        ref: ${{ fromJSON(inputs.selection).sha }}
        path: .buildchain/runtime
        persist-credentials: false
        token: ${{ inputs.token }}
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - id: activate
      uses: $/actions/runtime/environment/activate
      with:
        selection: ${{ inputs.selection }}
outputs:
  directory:
    description: Prepared runtime directory.
    value: ${{ steps.activate.outputs.directory }}
  node-path:
    description: Exact Node 24 executable for Buildchain after the caller selects its own toolchain.
    value: ${{ steps.activate.outputs.node-path }}
