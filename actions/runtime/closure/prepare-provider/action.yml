name: provider-closure
description: Verify the admitted runtime commit and tree before installing and exposing its provider dependencies.
inputs:
  repository:
    description: Admitted runtime repository.
    required: true
  sha:
    description: Admitted immutable runtime commit.
    required: true
  tree:
    description: Admitted immutable runtime tree.
    required: true
runs:
  using: composite
  steps:
    - name: Checkout the admitted runtime only
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Activate admitted provider closure
      uses: ./.buildchain/workflow-shell/actions/runtime/closure/activate-provider
      with:
        sha: ${{ inputs.sha }}
        tree: ${{ inputs.tree }}
