name: Admit selected runtime
description: Resolve exact runtime identity under the declared publication, web
  or gate authority contract.
inputs:
  purpose:
    description: "Admission contract: publication, web or gate."
    required: true
  repository:
    description: Runtime repository.
    required: true
  ref:
    description: Requested runtime selector.
    default: ""
  workflow-sha:
    description: Immutable defining workflow commit.
    required: true
  workflow-ref:
    description: Defining workflow coordinate.
    default: ""
  token:
    description: Bounded GitHub read token.
    required: true
outputs:
  runtime-ref:
    description: "Admitted runtime coordinate: runtime-ref."
  runtime-sha:
    description: "Admitted runtime coordinate: runtime-sha."
  runtime-class:
    description: "Admitted runtime coordinate: runtime-class."
  runtime-override:
    description: "Admitted runtime coordinate: runtime-override."
  runtime-trust-decision:
    description: "Admitted runtime coordinate: runtime-trust-decision."
  runtime-full-ref:
    description: "Admitted runtime coordinate: runtime-full-ref."
  workflow-shell-ref:
    description: "Admitted runtime coordinate: workflow-shell-ref."
  rollback-ref:
    description: "Admitted runtime coordinate: rollback-ref."
runs:
  using: node24
  main: dist/index.js
