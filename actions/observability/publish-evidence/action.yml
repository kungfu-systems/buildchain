name: observed-evidence-publish
description: Execute the observed-evidence publish capability within its caller job boundary.
inputs:
  runtime-ref:
    description: Selected runtime ref with the caller precedence preserved.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  source-checkout-outcome:
    description: Actual admitted source checkout outcome.
    required: true
outputs:
  receipt-path:
    description: receipt-path node result.
    value: ${{ steps.publish.outputs.receipt-path }}
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ inputs.runtime-ref }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain runtime
      id: core-runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Checkout public evidence source
      if: ${{ fromJSON(inputs.request-json).evidence-source-repository != '' }}
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).evidence-source-repository }}
        ref: ${{ fromJSON(inputs.request-json).evidence-source-ref }}
        path: ${{ fromJSON(inputs.request-json).evidence-source-path }}
        persist-credentials: false
    - name: Generate observed evidence bundle
      shell: bash
      run: ${{ fromJSON(inputs.request-json).build-command }}
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Verify caller evidence semantics
      shell: bash
      run: ${{ fromJSON(inputs.request-json).verify-command }}
    - name: Verify Buildchain bundle contract
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/observability/nodes/publish-evidence.mjs" verify
      shell: bash
      env:
        BUILDCHAIN_EVIDENCE_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Configure scoped production authority
      uses: aws-actions/configure-aws-credentials@v5.1.0
      with:
        role-to-assume: ${{ fromJSON(inputs.request-json).production-aws-role-arn }}
        aws-region: us-east-1
    - name: Publish immutable snapshot then latest
      id: publish
      shell: bash
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/observability/nodes/publish-evidence.mjs" publish
      env:
        BUILDCHAIN_EVIDENCE_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Upload publication receipt
      uses: actions/upload-artifact@v7.0.1
      with:
        name: observed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.publish.outputs.receipt-path }}
        if-no-files-found: error
