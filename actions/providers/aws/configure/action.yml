name: Configure scoped AWS role
description: Require an explicit role before exchanging the job OIDC token for scoped AWS credentials.
inputs:
  role:
    description: Explicit role ARN.
    required: true
  region:
    description: AWS region.
    required: true
  session-name:
    description: Caller-bound role session name.
    required: true
runs:
  using: composite
  steps:
    - name: Require declared role
      if: ${{ inputs.role == '' }}
      uses: ./.buildchain/workflow-shell/actions/workflow/admission/reject
      with:
        reason: A declared AWS role is required before credential acquisition
    - name: Configure role credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ${{ inputs.region }}
        role-session-name: ${{ inputs.session-name }}
