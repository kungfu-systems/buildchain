name: Select scoped GitHub credential
description: Select the available credential and expose non-secret creation diagnostics.
inputs:
  client-configured:
    description: Whether the App client ID is configured.
    default: ""
  private-key-configured:
    description: Whether the private key is configured.
    default: ""
  app-outcome:
    description: App token action outcome.
    default: ""
  app-token:
    description: Created installation token.
    default: ""
  fallback-token:
    description: Explicit scoped fallback credential.
    default: ""
  workflow-token:
    description: Caller workflow credential.
    default: ""
  failure-policy:
    description: App creation failure policy.
    default: fallback
  require-token:
    description: Reject an empty credential selection.
    default: "false"
outputs:
  token:
    description: Selected masked credential.
  metadata-json:
    description: Non-secret selection and configuration evidence.
runs:
  using: node24
  main: dist/index.js
