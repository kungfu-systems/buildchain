name: authority-admit
description: "Publication authority: admit."
inputs:
  runtime-ref:
    description: Selected runtime ref with the caller precedence preserved.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  auditor-private-key:
    description: Explicit scoped provider credential.
    required: true
  governance-read-token:
    description: Explicit scoped provider credential.
    required: true
runs:
  using: composite
  steps:
    - name: Prepare workflow implementation
      id: core-node
      uses: ./.buildchain/workflow-shell/actions/runtime/environment/prepare
    - name: Admit immutable authority request and evidence requirements
      uses: ./.buildchain/workflow-shell/actions/publication/authority/inspect-request
      with:
        request-json: ${{ inputs.request-json }}
    - name: Checkout exact Buildchain authority runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ inputs.runtime-repository }}
        ref: ${{ inputs.runtime-ref }}
        path: .buildchain/authority-runtime
        persist-credentials: false
    - name: Prepare exact authority runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/environment/prepare
      with:
        directory: .buildchain/authority-runtime
    - name: Mint bounded governance auditor token
      if:
        ${{ !fromJSON(inputs.request-json).dry-run && vars.KUNGFU_GOVERNANCE_AUDITOR_APP_ID != '' && env.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY
        != '' }}
      id: governance-auditor
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      env:
        KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY: ${{ inputs.auditor-private-key }}
      with:
        app-id: ${{ vars.KUNGFU_GOVERNANCE_AUDITOR_APP_ID }}
        private-key: ${{ env.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
    - name: Collect and verify exact live GitHub governance authority
      if: ${{ !fromJSON(inputs.request-json).dry-run }}
      uses: ./.buildchain/authority-runtime/actions/publication/authority/verify-governance
      with:
        request-json: ${{ inputs.request-json }}
        token: ${{ steps.governance-auditor.outputs.token || inputs.governance-read-token || github.token }}
outputs:
  governance-auditor-token:
    description: Exact authority step result.
    value: ${{ steps.governance-auditor.outputs.token }}
