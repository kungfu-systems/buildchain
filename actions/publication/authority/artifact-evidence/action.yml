name: authority-artifact-evidence
description: "Publication authority: artifact evidence."
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
runs:
  using: composite
  steps:
    - name: Download exact publication artifact candidate
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission-kind == 'publication-artifact' }}
      uses: actions/download-artifact@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).evidence-repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        name: ${{ fromJSON(inputs.request-json).evidence-publication-artifact }}
        path: .buildchain/publication-evidence/artifact
    - name: Download exact publication controller receipt
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission-kind == 'publication-artifact' }}
      uses: actions/download-artifact@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).evidence-repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        name: ${{ fromJSON(inputs.request-json).evidence-controller-artifact }}
        path: .buildchain/publication-evidence/controller
    - name: Download exact binary release evidence bundle
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission-kind == 'binary-release-assets' }}
      uses: actions/download-artifact@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).evidence-repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        name: ${{ fromJSON(inputs.request-json).evidence-passport-artifact }}
        path: .buildchain/publication-evidence/binary-passport
    - name: Download exact binary distribution controller receipt
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission-kind == 'binary-release-assets' }}
      uses: actions/download-artifact@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).evidence-repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        name: ${{ fromJSON(inputs.request-json).evidence-controller-artifact }}
        path: .buildchain/publication-evidence/binary-controller
