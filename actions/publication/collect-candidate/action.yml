name: collect-candidate
description: Publication collect candidate.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  runtime-outcome:
    description: Admitted publication runtime result.
    required: true
  core-node-outputs-node-path:
    description: Exact preceding publication node result.
    required: true
  controller-plan-outcome:
    description: Exact preceding publication node result.
    required: true
  runtime-checkout-outcome:
    description: Exact preceding publication node result.
    required: true
  controller-identities-outcome:
    description: Exact preceding publication node result.
    required: true
  build-outcome:
    description: Exact preceding publication node result.
    required: true
  verify-outcome:
    description: Exact preceding publication node result.
    required: true
  manifest-outcome:
    description: Exact preceding publication node result.
    required: true
  package-outcome:
    description: Exact preceding publication node result.
    required: true
  manifest-outputs-manifest-path:
    description: Exact preceding publication node result.
    required: true
  manifest-outputs-passport-path:
    description: Exact preceding publication node result.
    required: true
  controller-identities-outputs-source-sha:
    description: Exact preceding publication node result.
    required: true
  predecessors-ok:
    description: Both planning and build succeeded.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful predecessor nodes
      if: ${{ inputs.predecessors-ok != 'true' }}
      shell: bash
      run: |
        exit 1
    - name: Resolve artifact name
      id: names
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/publication/nodes/build-candidate.mjs" names
      env:
        BUILDCHAIN_PUBLICATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.core-node-outputs-node-path }}
    - name: Upload publication artifact
      id: artifact-upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ steps.names.outputs.artifact-name }}
        path: |
          ${{ fromJSON(inputs.request-json).artifact-paths }}
          ${{ fromJSON(inputs.request-json).working-directory }}/.buildchain/publication/**
          ${{ fromJSON(inputs.request-json).working-directory }}/.buildchain/paper-release/**
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
        if-no-files-found: error
        include-hidden-files: true
    - name: Create publication-artifact controller receipt
      id: controller-receipt
      if: ${{ always() && inputs.controller-plan-outcome == 'success' }}
      run: '"$BUILDCHAIN_NODE_PATH" .buildchain/runtime/packages/core/observability/commands/controller-evidence.mjs --mode receipt'
      env:
        BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
        BUILDCHAIN_CONTROLLER_STAGES_JSON: "[{\"id\":\"resolve-runtime\",\"status\":\"${{ inputs.runtime-outcome == 'success' && inputs.runtime-checkout-outcome == 'success' && inputs.controller-identities-outcome == 'success' && 'success' || 'failure' }}\"},{\"id\":\"build\",\"status\":\"${{ inputs.build-outcome }}\"},{\"id\":\"verify\",\"status\":\"${{ inputs.verify-outcome }}\"},{\"id\":\"collect\",\"status\":\"${{ (inputs.manifest-outcome == 'success' && (!fromJSON(inputs.request-json).prepare-paper-package || inputs.package-outcome == 'success')) && 'success' || 'failure' }}\"},{\"id\":\"aggregate\",\"status\":\"${{ steps.artifact-upload.outcome }}\"}]"
        BUILDCHAIN_CONTROLLER_EVIDENCE_FILES_JSON: ${{ inputs.manifest-outcome == 'success' && format('[{{"kind":"publication-manifest","path":"{0}/{1}"}},{{"kind":"publication-passport","path":"{0}/{2}"}},{{"kind":"publication-reproducibility","path":"{0}/.buildchain/publication/reproducibility-receipt.json"}}]', fromJSON(inputs.request-json).working-directory, inputs.manifest-outputs-manifest-path, inputs.manifest-outputs-passport-path) || '[]' }}
        BUILDCHAIN_CONTROLLER_REASON_CODE: ${{ steps.artifact-upload.outcome == 'success' && '' || 'publication-incomplete' }}
        BUILDCHAIN_CONTROLLER_REASON_SUMMARY: Publication artifact did not complete successfully
        BUILDCHAIN_CONTROLLER_RECEIPT_ARTIFACT: buildchain-publication-controller-receipt-${{ inputs.controller-identities-outputs-source-sha }}
        BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json
        BUILDCHAIN_NODE_PATH: ${{ inputs.core-node-outputs-node-path }}
      shell: bash -e {0}
    - name: Upload publication-artifact controller receipt
      if: ${{ always() && steps.controller-receipt.outcome == 'success' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-publication-controller-receipt-${{ inputs.controller-identities-outputs-source-sha }}
        path: .buildchain/controller/receipt.json
        if-no-files-found: error
    - name: Enforce qualifying publication-artifact controller receipt
      if: ${{ always() && inputs.controller-plan-outcome == 'success' && steps.controller-receipt.outputs.controller-receipt-qualifying != 'true' }}
      run: |
        echo "::error::publication-artifact controller receipt is not qualifying: $BUILDCHAIN_RECEIPT_STATUS"
        exit 1
      shell: bash -e {0}
      env:
        BUILDCHAIN_NODE_PATH: ${{ inputs.core-node-outputs-node-path }}
        BUILDCHAIN_RECEIPT_STATUS: ${{ steps.controller-receipt.outputs.controller-receipt-status }}
outputs:
  publication-artifact-name:
    description: publication-artifact-name node result.
    value: ${{ steps.names.outputs.artifact-name }}
  controller-receipt-json:
    description: controller-receipt-json node result.
    value: ${{ steps.controller-receipt.outputs.controller-receipt-json }}
  controller-receipt-digest:
    description: controller-receipt-digest node result.
    value: ${{ steps.controller-receipt.outputs.controller-receipt-digest }}
  controller-receipt-status:
    description: controller-receipt-status node result.
    value: ${{ steps.controller-receipt.outputs.controller-receipt-status }}
