name: Pipeline product prepare
description: Execute the internal prepare product node.
inputs:
  authority-token:
    description: Scoped native signing readback credential for stable qualification.
    required: false
  attempt:
    description: Exact current business attempt.
    required: true
  definition-sha:
    description: Exact defining publisher workflow SHA.
    required: true
  token:
    description: Scoped provider credential.
    required: true
outputs:
  stable-wait:
    description: Retained time-only stable qualification recheck.
  operation:
    description: Internal operation result.
  context:
    description: Internal context result.
  matrix:
    description: Internal matrix result.
runs:
  using: node24
  main: dist/index.js
