name: npm-dry-run
description: Execute the npm-dry-run dry-run capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Setup Node
      uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
        registry-url: https://registry.npmjs.org/
    - name: Enable pnpm
      run: |
        corepack prepare pnpm@11.7.0 --activate
        corepack enable
        pnpm --version
        npm --version
      shell: bash -e {0}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash -e {0}
    - name: Verify package
      if: ${{ fromJSON(inputs.request-json).run-check }}
      run: pnpm run check
      shell: bash -e {0}
    - name: Dry-run npm publish
      run: node packages/core/publication/commands/npm-publish-dry-run.mjs --json
      shell: bash -e {0}
