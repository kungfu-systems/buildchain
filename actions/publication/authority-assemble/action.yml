name: authority-assemble
description: "Publication authority: assemble."
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-buildchain-governance-read-token:
    description: Explicit scoped provider credential.
    required: true
  governance-auditor-token:
    description: Exact preceding authority node result.
    required: true
  consumer-gate-gate-aggregate-json:
    description: Exact preceding authority node result.
    required: true
  node-path:
    description: Exact Buildchain Node executable.
    required: true
runs:
  using: composite
  steps:
    - name: Audit managed release-candidate publication control plane
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission && fromJSON(inputs.request-json).auto-admission-kind == 'release-candidate' }}
      env:
        GH_TOKEN: ${{ inputs.governance-auditor-token || inputs.secrets-buildchain-governance-read-token || github.token }}
        BUILDCHAIN_GITHUB_PUBLIC_READ_TOKEN: ${{ github.token }}
        BUILDCHAIN_PUBLICATION_TARGET: ${{ fromJSON(inputs.request-json).publication-target }}
        BUILDCHAIN_AUTHORITY_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/authority-runtime/packages/core/publication/nodes/authority.mjs" audit-candidate
    - name: Assemble managed release-candidate admission
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission && fromJSON(inputs.request-json).auto-admission-kind == 'release-candidate' }}
      id: auto-evidence
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BUILDCHAIN_REPOSITORY: ${{ fromJSON(inputs.request-json).evidence-repository }}
        BUILDCHAIN_SOURCE_SHA: ${{ fromJSON(inputs.request-json).source-sha }}
        BUILDCHAIN_AUTHORITY_WORKFLOW_PATH: ${{ fromJSON(inputs.request-json).authority-workflow-path || '.github/workflows/public-release-promote.yml' }}
        BUILDCHAIN_PUBLISHER_WORKFLOW_PATH: ${{ fromJSON(inputs.request-json).publisher-workflow-path }}
        BUILDCHAIN_CONTROL_PLANE_AUDIT_PATH: .buildchain/publication-authority/auto/control-plane.json
        BUILDCHAIN_PUBLICATION_ENVIRONMENT: none
        BUILDCHAIN_PUBLICATION_PRODUCT: ${{ fromJSON(inputs.request-json).product }}
        BUILDCHAIN_PUBLICATION_TARGET: ${{ fromJSON(inputs.request-json).publication-target }}
        BUILDCHAIN_PUBLICATION_VERSION: ${{ fromJSON(inputs.request-json).publication-version }}
        BUILDCHAIN_PUBLICATION_CHANNEL: ${{ startsWith(fromJSON(inputs.request-json).target-ref, 'release/') && 'release' || startsWith(fromJSON(inputs.request-json).target-ref, 'alpha/') && 'alpha' || 'major' }}
        BUILDCHAIN_GATE_AGGREGATE_JSON: ${{ inputs.consumer-gate-gate-aggregate-json || fromJSON(inputs.request-json).gate-aggregate-json }}
        BUILDCHAIN_ALLOW_NO_GATE: ${{ fromJSON(inputs.request-json).auto-no-gate }}
        BUILDCHAIN_CONSUMER_QUALIFICATION_REQUIRED: ${{ fromJSON(inputs.request-json).consumer-qualification-required }}
        BUILDCHAIN_CONSUMER_PREDICATE_ID: ${{ fromJSON(inputs.request-json).consumer-predicate-id }}
        BUILDCHAIN_CONSUMER_PREDICATE_DIGEST: ${{ fromJSON(inputs.request-json).consumer-predicate-digest }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.node-path }}
      shell: bash
      run: '"$BUILDCHAIN_NODE_PATH" .buildchain/authority-runtime/packages/core/release/commands/assemble-self-publication-admission.mjs'
    - name: Audit managed paper publication control plane
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission && fromJSON(inputs.request-json).auto-admission-kind == 'publication-artifact' }}
      env:
        GH_TOKEN: ${{ inputs.governance-auditor-token || inputs.secrets-buildchain-governance-read-token || github.token }}
        BUILDCHAIN_GITHUB_PUBLIC_READ_TOKEN: ${{ github.token }}
        BUILDCHAIN_AUTHORITY_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/authority-runtime/packages/core/publication/nodes/authority.mjs" audit-artifact
    - name: Assemble managed publication artifact admission
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission && fromJSON(inputs.request-json).auto-admission-kind == 'publication-artifact' }}
      id: paper-auto-evidence
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BUILDCHAIN_REPOSITORY: ${{ fromJSON(inputs.request-json).evidence-repository }}
        BUILDCHAIN_SOURCE_SHA: ${{ fromJSON(inputs.request-json).source-sha }}
        BUILDCHAIN_PUBLISHER_WORKFLOW_PATH: ${{ fromJSON(inputs.request-json).publisher-workflow-path }}
        BUILDCHAIN_AUTHORITY_WORKFLOW_PATH: ${{ fromJSON(inputs.request-json).authority-workflow-path || '.github/workflows/public-release-paper-sealed.yml' }}
        BUILDCHAIN_CONTROL_PLANE_AUDIT_PATH: .buildchain/publication-authority/auto/control-plane.json
        BUILDCHAIN_PUBLICATION_PRODUCT: ${{ fromJSON(inputs.request-json).product }}
        BUILDCHAIN_PUBLICATION_TARGET: ${{ fromJSON(inputs.request-json).publication-target }}
        BUILDCHAIN_PUBLICATION_VERSION: ${{ fromJSON(inputs.request-json).publication-version }}
        BUILDCHAIN_PUBLICATION_CHANNEL: ${{ startsWith(fromJSON(inputs.request-json).target-ref, 'release/') && 'release' || 'alpha' }}
        BUILDCHAIN_CONSUMER_QUALIFICATION_REQUIRED: ${{ fromJSON(inputs.request-json).consumer-qualification-required }}
        BUILDCHAIN_CONSUMER_PREDICATE_ID: ${{ fromJSON(inputs.request-json).consumer-predicate-id }}
        BUILDCHAIN_CONSUMER_PREDICATE_DIGEST: ${{ fromJSON(inputs.request-json).consumer-predicate-digest }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.node-path }}
      shell: bash
      run: '"$BUILDCHAIN_NODE_PATH" .buildchain/authority-runtime/packages/core/publication/commands/assemble-publication-artifact-admission.mjs'
    - name: Audit managed binary release publication control plane
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission && fromJSON(inputs.request-json).auto-admission-kind == 'binary-release-assets' }}
      env:
        GH_TOKEN: ${{ inputs.governance-auditor-token || inputs.secrets-buildchain-governance-read-token || github.token }}
        BUILDCHAIN_GITHUB_PUBLIC_READ_TOKEN: ${{ github.token }}
        BUILDCHAIN_AUTHORITY_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/authority-runtime/packages/core/publication/nodes/authority.mjs" audit-binary
    - name: Assemble managed binary release admission
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission && fromJSON(inputs.request-json).auto-admission-kind == 'binary-release-assets' }}
      id: binary-auto-evidence
      env:
        BUILDCHAIN_REPOSITORY: ${{ fromJSON(inputs.request-json).evidence-repository }}
        BUILDCHAIN_SOURCE_SHA: ${{ fromJSON(inputs.request-json).source-sha }}
        BUILDCHAIN_RELEASE_TAG: v${{ fromJSON(inputs.request-json).publication-version }}
        BUILDCHAIN_AUTHORITY_WORKFLOW_PATH: ${{ fromJSON(inputs.request-json).authority-workflow-path || '.github/workflows/.release-binary-assets.yml' }}
        BUILDCHAIN_PUBLISHER_WORKFLOW_PATH: ${{ fromJSON(inputs.request-json).publisher-workflow-path }}
        BUILDCHAIN_CONTROL_PLANE_AUDIT_PATH: .buildchain/publication-authority/auto/control-plane.json
        BUILDCHAIN_PUBLICATION_VERSION: ${{ fromJSON(inputs.request-json).publication-version }}
        BUILDCHAIN_GATE_AGGREGATE_JSON: ${{ fromJSON(inputs.request-json).gate-aggregate-json }}
        BUILDCHAIN_ALLOW_NO_GATE: ${{ fromJSON(inputs.request-json).auto-no-gate }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.node-path }}
      shell: bash
      run: '"$BUILDCHAIN_NODE_PATH" .buildchain/authority-runtime/packages/core/publication/commands/assemble-binary-release-admission.mjs'
outputs:
  auto-evidence-admission-json:
    description: Exact authority step result.
    value: ${{ steps.auto-evidence.outputs.admission-json }}
  paper-auto-evidence-admission-json:
    description: Exact authority step result.
    value: ${{ steps.paper-auto-evidence.outputs.admission-json }}
  binary-auto-evidence-admission-json:
    description: Exact authority step result.
    value: ${{ steps.binary-auto-evidence.outputs.admission-json }}
  auto-evidence-runner-provenance-json:
    description: Exact authority step result.
    value: ${{ steps.auto-evidence.outputs.runner-provenance-json }}
  paper-auto-evidence-runner-provenance-json:
    description: Exact authority step result.
    value: ${{ steps.paper-auto-evidence.outputs.runner-provenance-json }}
  binary-auto-evidence-runner-provenance-json:
    description: Exact authority step result.
    value: ${{ steps.binary-auto-evidence.outputs.runner-provenance-json }}
  auto-evidence-control-plane-audit-json:
    description: Exact authority step result.
    value: ${{ steps.auto-evidence.outputs.control-plane-audit-json }}
  paper-auto-evidence-control-plane-audit-json:
    description: Exact authority step result.
    value: ${{ steps.paper-auto-evidence.outputs.control-plane-audit-json }}
  binary-auto-evidence-control-plane-audit-json:
    description: Exact authority step result.
    value: ${{ steps.binary-auto-evidence.outputs.control-plane-audit-json }}
  auto-evidence-gate-aggregate-json:
    description: Exact authority step result.
    value: ${{ steps.auto-evidence.outputs.gate-aggregate-json }}
  paper-auto-evidence-gate-aggregate-json:
    description: Exact authority step result.
    value: ${{ steps.paper-auto-evidence.outputs.gate-aggregate-json }}
  binary-auto-evidence-gate-aggregate-json:
    description: Exact authority step result.
    value: ${{ steps.binary-auto-evidence.outputs.gate-aggregate-json }}
  auto-evidence-expected-json:
    description: Exact authority step result.
    value: ${{ steps.auto-evidence.outputs.expected-json }}
  paper-auto-evidence-expected-json:
    description: Exact authority step result.
    value: ${{ steps.paper-auto-evidence.outputs.expected-json }}
  binary-auto-evidence-expected-json:
    description: Exact authority step result.
    value: ${{ steps.binary-auto-evidence.outputs.expected-json }}
