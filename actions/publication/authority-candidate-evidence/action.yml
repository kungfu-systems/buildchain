name: authority-candidate-evidence
description: "Publication authority: candidate evidence."
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  node-path:
    description: Exact Buildchain Node executable.
    required: true
runs:
  using: composite
  steps:
    - name: Download exact release-candidate passport evidence
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission-kind == 'release-candidate' }}
      uses: actions/download-artifact@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).evidence-repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        name: ${{ fromJSON(inputs.request-json).evidence-passport-artifact }}
        path: .buildchain/publication-evidence/passport
    - name: Download exact build-summary evidence
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission-kind == 'release-candidate' }}
      uses: actions/download-artifact@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).evidence-repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        name: ${{ fromJSON(inputs.request-json).evidence-summary-artifact }}
        path: .buildchain/publication-evidence/summary
    - name: Resolve referenced controller evidence
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission-kind == 'release-candidate' }}
      id: controller-evidence
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/authority-runtime/packages/core/publication/nodes/authority.mjs" controller
      env:
        BUILDCHAIN_AUTHORITY_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.node-path }}
    - name: Download referenced controller receipt evidence
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission-kind == 'release-candidate' }}
      uses: actions/download-artifact@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).evidence-repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        name: ${{ steps.controller-evidence.outputs.controller-artifact }}
        path: .buildchain/publication-evidence/controller
    - name: Download exact artifact manifest evidence
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission-kind == 'release-candidate' }}
      uses: actions/download-artifact@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).evidence-repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        pattern: ${{ fromJSON(inputs.request-json).evidence-manifest-pattern }}
        path: .buildchain/publication-evidence/manifests
    - name: Download exact candidate payload evidence
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission-kind == 'release-candidate' }}
      uses: actions/download-artifact@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).evidence-repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        pattern: ${{ fromJSON(inputs.request-json).evidence-payload-pattern }}
        path: .buildchain/publication-evidence/payloads
    - name: Checkout exact consumer Gate subject
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission && fromJSON(inputs.request-json).auto-admission-kind == 'release-candidate' && fromJSON(inputs.request-json).consumer-gate-command != '' }}
      uses: actions/checkout@v7.0.0
      with:
        ref: ${{ fromJSON(inputs.request-json).source-sha }}
        path: .buildchain/publication-consumer-source
        clean: true
        persist-credentials: false
    - name: Checkout exact consumer Gate controller
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission && fromJSON(inputs.request-json).auto-admission-kind == 'release-candidate' && fromJSON(inputs.request-json).consumer-gate-command != '' && fromJSON(inputs.request-json).consumer-gate-controller-sha != '' }}
      uses: actions/checkout@v7.0.0
      with:
        ref: ${{ fromJSON(inputs.request-json).consumer-gate-controller-sha }}
        path: .buildchain/publication-consumer-controller
        clean: true
        persist-credentials: false
    - name: Assemble consumer Gate from exact downloaded evidence
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission && fromJSON(inputs.request-json).auto-admission-kind == 'release-candidate' && fromJSON(inputs.request-json).consumer-gate-command != '' }}
      id: consumer-gate
      working-directory: ${{ fromJSON(inputs.request-json).consumer-gate-controller-sha != '' && '.buildchain/publication-consumer-controller' || '.buildchain/publication-consumer-source' }}
      env:
        BUILDCHAIN_CONSUMER_GATE_COMMAND: ${{ fromJSON(inputs.request-json).consumer-gate-command }}
        BUILDCHAIN_PUBLICATION_CONSUMER_CONTROLLER_SHA: ${{ fromJSON(inputs.request-json).consumer-gate-controller-sha }}
        BUILDCHAIN_PUBLICATION_CONSUMER_CONTROLLER_REPOSITORY: ${{ github.repository }}
        BUILDCHAIN_PUBLICATION_SUBJECT_ROOT: ${{ github.workspace }}/.buildchain/publication-consumer-source
        BUILDCHAIN_PUBLICATION_EVIDENCE_ROOT: ${{ github.workspace }}/.buildchain/publication-evidence
        BUILDCHAIN_PUBLICATION_GATE_RESULT_PATH: ${{ github.workspace }}/.buildchain/publication-authority/consumer-gate-aggregate.json
        BUILDCHAIN_PUBLICATION_AUTHORITY_RUNTIME_ROOT: ${{ github.workspace }}/.buildchain/authority-runtime
        BUILDCHAIN_PUBLICATION_SOURCE_SHA: ${{ fromJSON(inputs.request-json).consumer-gate-evidence-source-sha || fromJSON(inputs.request-json).source-sha }}
        BUILDCHAIN_PUBLICATION_TARGET_SOURCE_SHA: ${{ fromJSON(inputs.request-json).source-sha }}
        BUILDCHAIN_PUBLICATION_EVIDENCE_SOURCE_TREE: ${{ fromJSON(inputs.request-json).consumer-gate-evidence-source-tree }}
        BUILDCHAIN_PUBLICATION_TARGET_REF: ${{ fromJSON(inputs.request-json).target-ref }}
        BUILDCHAIN_PUBLICATION_EVIDENCE_RUN_ID: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        BUILDCHAIN_AUTHORITY_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/authority-runtime/packages/core/publication/nodes/authority.mjs" consumer-gate
outputs:
  consumer-gate-gate-aggregate-json:
    description: Exact authority step result.
    value: ${{ steps.consumer-gate.outputs.gate-aggregate-json }}
