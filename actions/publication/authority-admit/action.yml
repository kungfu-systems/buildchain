name: authority-admit
description: "Publication authority: admit."
inputs:
  runtime-ref:
    description: Selected runtime ref with the caller precedence preserved.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-kungfu-governance-auditor-app-private-key:
    description: Explicit scoped provider credential.
    required: true
  secrets-buildchain-governance-read-token:
    description: Explicit scoped provider credential.
    required: true
runs:
  using: composite
  steps:
    - name: Prepare workflow implementation
      id: core-node
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    - name: Require an immutable authority runtime
      if: ${{ !fromJSON(inputs.request-json).dry-run }}
      env:
        BUILDCHAIN_AUTHORITY_REF: ${{ fromJSON(inputs.request-json).buildchain-ref }}
        BUILDCHAIN_AUTHORITY_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_ACTION_PATH/../../../packages/core/publication/nodes/authority.mjs" immutable
    - name: Require complete sealed publication evidence
      if: ${{ !fromJSON(inputs.request-json).dry-run && !fromJSON(inputs.request-json).auto-admission }}
      env:
        BUILDCHAIN_PUBLICATION_ADMISSION_JSON: ${{ fromJSON(inputs.request-json).admission-json }}
        BUILDCHAIN_RUNNER_PROVENANCE_JSON: ${{ fromJSON(inputs.request-json).runner-provenance-json }}
        BUILDCHAIN_CONTROL_PLANE_AUDIT_JSON: ${{ fromJSON(inputs.request-json).control-plane-audit-json }}
        BUILDCHAIN_GATE_AGGREGATE_JSON: ${{ fromJSON(inputs.request-json).gate-aggregate-json }}
        BUILDCHAIN_CONSUMER_GATE_COMMAND: ${{ fromJSON(inputs.request-json).consumer-gate-command }}
        BUILDCHAIN_PUBLICATION_EXPECTED_JSON: ${{ fromJSON(inputs.request-json).expected-json }}
        BUILDCHAIN_AUTHORITY_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_ACTION_PATH/../../../packages/core/publication/nodes/authority.mjs" sealed-inputs
    - name: Restrict automatic admission to declared managed publication surfaces
      if: ${{ !fromJSON(inputs.request-json).dry-run && fromJSON(inputs.request-json).auto-admission }}
      env:
        BUILDCHAIN_REPOSITORY: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        BUILDCHAIN_SOURCE_SHA: ${{ fromJSON(inputs.request-json).source-sha }}
        BUILDCHAIN_TARGET_REF: ${{ fromJSON(inputs.request-json).target-ref }}
        BUILDCHAIN_PUBLISHER_WORKFLOW_PATH: ${{ fromJSON(inputs.request-json).publisher-workflow-path }}
        BUILDCHAIN_PUBLICATION_VERSION: ${{ fromJSON(inputs.request-json).publication-version }}
        BUILDCHAIN_AUTO_ADMISSION_KIND: ${{ fromJSON(inputs.request-json).auto-admission-kind }}
        BUILDCHAIN_AUTO_NO_GATE: ${{ fromJSON(inputs.request-json).auto-no-gate }}
        BUILDCHAIN_EVIDENCE_REPOSITORY: ${{ fromJSON(inputs.request-json).evidence-repository }}
        BUILDCHAIN_GATE_AGGREGATE_JSON: ${{ fromJSON(inputs.request-json).gate-aggregate-json }}
        BUILDCHAIN_CONSUMER_GATE_COMMAND: ${{ fromJSON(inputs.request-json).consumer-gate-command }}
        BUILDCHAIN_CONSUMER_GATE_CONTROLLER_SHA: ${{ fromJSON(inputs.request-json).consumer-gate-controller-sha }}
        BUILDCHAIN_PUBLICATION_TARGET: ${{ fromJSON(inputs.request-json).publication-target }}
        BUILDCHAIN_PACKAGE_NAME: ${{ fromJSON(inputs.request-json).package-name }}
        BUILDCHAIN_CONSUMER_QUALIFICATION_REQUIRED: ${{ fromJSON(inputs.request-json).consumer-qualification-required }}
        BUILDCHAIN_CONSUMER_PREDICATE_ID: ${{ fromJSON(inputs.request-json).consumer-predicate-id }}
        BUILDCHAIN_CONSUMER_PREDICATE_DIGEST: ${{ fromJSON(inputs.request-json).consumer-predicate-digest }}
        BUILDCHAIN_AUTHORITY_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_ACTION_PATH/../../../packages/core/publication/nodes/authority.mjs" managed-inputs
    - name: Checkout exact Buildchain authority runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ inputs.runtime-repository }}
        ref: ${{ inputs.runtime-ref }}
        path: .buildchain/authority-runtime
        persist-credentials: false
    - name: Prepare exact authority runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/authority-runtime
    - name: Mint bounded governance auditor token
      if: ${{ !fromJSON(inputs.request-json).dry-run && vars.KUNGFU_GOVERNANCE_AUDITOR_APP_ID != '' && env.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY != '' }}
      id: governance-auditor
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      env:
        KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY: ${{ inputs.secrets-kungfu-governance-auditor-app-private-key }}
      with:
        app-id: ${{ vars.KUNGFU_GOVERNANCE_AUDITOR_APP_ID }}
        private-key: ${{ env.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
    - name: Collect and verify exact live GitHub governance authority
      if: ${{ !fromJSON(inputs.request-json).dry-run }}
      env:
        GH_TOKEN: ${{ steps.governance-auditor.outputs.token || inputs.secrets-buildchain-governance-read-token || github.token }}
        BUILDCHAIN_GITHUB_GOVERNANCE_EXPECTED_REPOSITORY: ${{ fromJSON(inputs.request-json).evidence-repository || github.repository }}
        BUILDCHAIN_GITHUB_GOVERNANCE_EXPECTED_TARGET_REF: ${{ fromJSON(inputs.request-json).target-ref }}
        BUILDCHAIN_AUTHORITY_REF: ${{ fromJSON(inputs.request-json).buildchain-ref }}
        BUILDCHAIN_AUTHORITY_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/authority-runtime/packages/core/publication/nodes/authority.mjs" governance
outputs:
  node-path:
    description: Buildchain Node executable.
    value: ${{ steps.core-node.outputs.node-path }}
  governance-auditor-token:
    description: Exact authority step result.
    value: ${{ steps.governance-auditor.outputs.token }}
