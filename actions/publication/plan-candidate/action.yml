name: plan-candidate
description: Publication plan candidate.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  job-workflow-sha:
    description: Caller job.workflow_sha value.
    required: true
  job-workflow-ref:
    description: Caller job.workflow_ref value.
    required: true
  runtime-sha:
    description: Admitted publication runtime result.
    required: true
  runtime-ref:
    description: Admitted publication runtime result.
    required: true
  runtime-class:
    description: Admitted publication runtime result.
    required: true
  runtime-override:
    description: Admitted publication runtime result.
    required: true
  source-checkout-outcome:
    description: Consumer source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: |
        exit 1
    - name: Checkout Buildchain runtime
      id: runtime-checkout
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ inputs.runtime-sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact publication runtime
      id: core-node
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Enforce v4 floating consumer policy
      id: v4-policy
      shell: bash
      env:
        BUILDCHAIN_CONSUMER_ROOT: .
        BUILDCHAIN_INVOKED_WORKFLOW: .github/workflows/public-build-publication.yml
        BUILDCHAIN_WORKFLOW_SHA: ${{ fromJSON(inputs.job-workflow-sha) }}
        BUILDCHAIN_RUNTIME_SHA: ${{ inputs.runtime-sha }}
        BUILDCHAIN_STABLE_CONTRACT_LOCK_PATH: ${{ fromJSON(inputs.request-json).buildchain-stable-contract-lock-path }}
        BUILDCHAIN_ALPHA_CONTRACT_LOCK_PATH: ${{ fromJSON(inputs.request-json).buildchain-alpha-contract-lock-path }}
        BUILDCHAIN_V4_POLICY_RECEIPT_PATH: .buildchain/evidence/consumer-policy-receipt.json
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      run: '"$BUILDCHAIN_NODE_PATH" .buildchain/runtime/packages/core/consumer/commands/consumer-policy.mjs scan'
    - name: Upload rooted v4 consumer policy receipt
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ fromJSON(inputs.request-json).artifact-name }}-v4-consumer-policy-${{ github.sha }}
        path: .buildchain/evidence/consumer-policy-receipt.json
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
    - name: Resolve controller identities
      id: controller-identities
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/publication/nodes/build-candidate.mjs" identities
      env:
        BUILDCHAIN_PUBLICATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
    - name: Create publication-artifact controller plan
      id: controller-plan
      run: '"$BUILDCHAIN_NODE_PATH" .buildchain/runtime/packages/core/observability/commands/controller-evidence.mjs --mode plan'
      env:
        BUILDCHAIN_CONTROLLER_ID: publication-artifact
        BUILDCHAIN_CONTROLLER_SOURCE_REPOSITORY: ${{ github.repository }}
        BUILDCHAIN_CONTROLLER_SOURCE_SHA: ${{ steps.controller-identities.outputs.source-sha }}
        BUILDCHAIN_CONTROLLER_RUNTIME_REF: ${{ inputs.runtime-ref }}
        BUILDCHAIN_CONTROLLER_RUNTIME_SHA: ${{ steps.controller-identities.outputs.runtime-sha }}
        BUILDCHAIN_CONTROLLER_CONTRACT_DIGEST: ${{ steps.controller-identities.outputs.contract-digest }}
        BUILDCHAIN_CONTROLLER_INPUTS_JSON: ${{ toJSON(fromJSON(inputs.request-json)) }}
        BUILDCHAIN_CONTROLLER_INPUT_BOUNDARY: workflow-call
        BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      shell: bash -e {0}
    - name: Upload publication-artifact controller plan
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-publication-controller-plan-${{ steps.controller-identities.outputs.source-sha }}
        path: .buildchain/controller/plan.json
        if-no-files-found: error
    - name: Check Buildchain contract lock
      id: contract-lock
      shell: bash
      run: '"$BUILDCHAIN_NODE_PATH" .buildchain/runtime/packages/core/contracts/commands/buildchain-contract-lock.mjs check'
      env:
        BUILDCHAIN_CONTRACT_LOCK_PATH: ${{ fromJSON(inputs.request-json).buildchain-contract-lock-path }}
        BUILDCHAIN_CONTRACT_COMPATIBILITY_POLICY: ${{ fromJSON(inputs.request-json).buildchain-contract-compatibility-policy }}
        BUILDCHAIN_CONTRACT_DRIFT_ISSUE_MODE: ${{ fromJSON(inputs.request-json).buildchain-contract-drift-issue-mode }}
        BUILDCHAIN_RUNTIME_ROOT: .buildchain/runtime
        BUILDCHAIN_RUNTIME_REF: ${{ inputs.runtime-ref }}
        BUILDCHAIN_RUNTIME_SHA: ${{ inputs.runtime-sha }}
        BUILDCHAIN_RUNTIME_CLASS: ${{ inputs.runtime-class }}
        BUILDCHAIN_WORKFLOW_SHELL_REF: ${{ fromJSON(inputs.job-workflow-ref) }}
        BUILDCHAIN_ALLOW_OPAQUE_RUNTIME: ${{ inputs.runtime-override }}
        BUILDCHAIN_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
    - name: Report consumer Buildchain contract drift
      if: ${{ always() && steps.contract-lock.outputs.contract-lock-issue-needed == 'true' }}
      uses: ./.buildchain/runtime/actions/governance/report-issue
      with:
        token: ${{ github.token }}
        target-repository: ${{ github.repository }}
        title: "[Buildchain contract] ${{ github.repository }} publication artifact drift on ${{ inputs.runtime-ref }}"
        failure-code: buildchain-contract-${{ steps.contract-lock.outputs.contract-lock-status }}
        buildchain-ref: ${{ inputs.runtime-ref }}
        buildchain-version: ${{ steps.contract-lock.outputs.contract-digest }}
        consumer-repository: ${{ github.repository }}
        consumer-ref: ${{ github.ref }}
        consumer-sha: ${{ github.sha }}
        workflow: ${{ github.workflow }}
        run-id: ${{ github.run_id }}
        run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        summary: "Buildchain floating runtime contract drift: ${{ steps.contract-lock.outputs.contract-lock-status }}"
        body-file: ${{ steps.contract-lock.outputs.contract-lock-issue-body-file }}
        labels: buildchain-contract-drift
        comment-cooldown-hours: "24"
        fail-on-error: "false"
outputs:
  core-node-outputs-node-path:
    description: Exact publication step result.
    value: ${{ steps.core-node.outputs.node-path }}
  controller-plan-outcome:
    description: Exact publication step result.
    value: ${{ steps.controller-plan.outcome }}
  runtime-checkout-outcome:
    description: Exact publication step result.
    value: ${{ steps.runtime-checkout.outcome }}
  controller-identities-outcome:
    description: Exact publication step result.
    value: ${{ steps.controller-identities.outcome }}
  controller-identities-outputs-source-sha:
    description: Exact publication step result.
    value: ${{ steps.controller-identities.outputs.source-sha }}
  controller-plan-artifact:
    description: controller-plan-artifact node result.
    value: buildchain-publication-controller-plan-${{ steps.controller-identities.outputs.source-sha }}
  controller-plan-json:
    description: controller-plan-json node result.
    value: ${{ steps.controller-plan.outputs.controller-plan-json }}
  controller-plan-digest:
    description: controller-plan-digest node result.
    value: ${{ steps.controller-plan.outputs.controller-plan-digest }}
  controller-receipt-artifact:
    description: controller-receipt-artifact node result.
    value: buildchain-publication-controller-receipt-${{ steps.controller-identities.outputs.source-sha }}
  runtime-sha:
    description: runtime-sha node result.
    value: ${{ steps.controller-identities.outputs.runtime-sha }}
