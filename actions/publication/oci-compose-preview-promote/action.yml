name: oci-compose-preview-promote
description: Execute the oci-compose-preview promote capability within its caller job boundary.
inputs:
  job-workflow-sha:
    description: Caller job.workflow_sha value.
    required: true
  secrets-buildchain-promotion-token:
    description: Explicit scoped provider credential.
    required: true
runs:
  using: composite
  steps:
  - name: Resolve called workflow runtime
    id: runtime
    env:
      WORKFLOW_SHA: ${{ fromJSON(inputs.job-workflow-sha) }}
    run: '[[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]

      printf ''sha=%s\n'' "${WORKFLOW_SHA}" >> "${GITHUB_OUTPUT}"

      '
    shell: bash -e {0}
  - uses: actions/checkout@v7.0.0
    with:
      repository: kungfu-systems/buildchain
      ref: ${{ steps.runtime.outputs.sha }}
      path: .buildchain/runtime
      persist-credentials: false
  - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    with:
      directory: .buildchain/runtime
  - name: Verify completed publication and exact qualification run
    id: qualified
    env:
      GH_TOKEN: ${{ github.token }}
    run: node .buildchain/runtime/packages/core/publication/commands/oci-compose-preview.mjs prepare
    shell: bash -e {0}
  - uses: actions/checkout@v7.0.0
    with:
      ref: ${{ steps.qualified.outputs.source-sha }}
      path: .buildchain/consumer
      persist-credentials: false
  - name: Enforce floating v4 consumer policy
    env:
      BUILDCHAIN_CONSUMER_ROOT: .buildchain/consumer
      BUILDCHAIN_INVOKED_WORKFLOW: .github/workflows/public-release-oci-compose-preview.yml
      BUILDCHAIN_WORKFLOW_SHA: ${{ fromJSON(inputs.job-workflow-sha) }}
      BUILDCHAIN_RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
      BUILDCHAIN_STABLE_CONTRACT_LOCK_PATH: .buildchain/contract-lock.json
      BUILDCHAIN_ALPHA_CONTRACT_LOCK_PATH: .buildchain/alpha-contract-lock.json
      BUILDCHAIN_V4_POLICY_RECEIPT_PATH: .buildchain/evidence/consumer-policy-receipt.json
    run: node .buildchain/runtime/packages/core/consumer/commands/consumer-policy.mjs scan
    shell: bash -e {0}
  - uses: actions/download-artifact@v7.0.0
    with:
      artifact-ids: ${{ steps.qualified.outputs.artifact-id }}
      run-id: ${{ steps.qualified.outputs.run-id }}
      github-token: ${{ github.token }}
      path: .buildchain/compose-preview/qualification
      merge-multiple: true
  - name: Reverify evidence and promote the declared preview
    env:
      GH_TOKEN: ${{ inputs.secrets-buildchain-promotion-token }}
      BUILDCHAIN_REGISTRY_TOKEN: ${{ github.token }}
    run: node .buildchain/runtime/packages/core/publication/commands/oci-compose-preview.mjs apply
    shell: bash -e {0}
  - uses: actions/upload-artifact@v7.0.1
    if: always()
    with:
      name: compose-preview-readback-${{ github.run_id }}-${{ github.run_attempt }}
      path: .buildchain/compose-preview/buildchain-compose-preview-*.json
      if-no-files-found: ignore
