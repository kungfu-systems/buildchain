name: oci-compose-preview-promote
description: Execute the oci-compose-preview promote capability within its caller job boundary.
inputs:
  workflow-sha:
    description: Caller job.workflow_sha value.
    required: true
  promotion-token:
    description: Explicit scoped provider credential.
    required: true
runs:
  using: composite
  steps:
    - name: Resolve called workflow runtime
      id: runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/selection/workflow
      with:
        workflow-sha: ${{ inputs.workflow-sha }}
    - uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ steps.runtime.outputs.sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - uses: ./.buildchain/workflow-shell/actions/runtime/environment/prepare
      with:
        directory: .buildchain/runtime
    - name: Verify completed publication and exact qualification run
      id: qualified
      uses: ./.buildchain/runtime/actions/publication/oci/admit-preview
      with:
        workflow-sha: ${{ inputs.workflow-sha }}
        token: ${{ github.token }}
    - uses: actions/checkout@v7.0.0
      with:
        ref: ${{ steps.qualified.outputs.source-sha }}
        path: .buildchain/consumer
        persist-credentials: false
    - name: Enforce floating v4 consumer policy
      uses: ./.buildchain/runtime/actions/consumer/policy/admit
      with:
        source-sha: ${{ steps.qualified.outputs.source-sha }}
        directory: .buildchain/consumer
        workflow: .github/workflows/public-release-oci-compose-preview.yml
        workflow-sha: ${{ inputs.workflow-sha }}
    - uses: actions/download-artifact@v7.0.0
      with:
        artifact-ids: ${{ steps.qualified.outputs.artifact-id }}
        run-id: ${{ steps.qualified.outputs.run-id }}
        github-token: ${{ github.token }}
        path: .buildchain/compose-preview/qualification
        merge-multiple: true
    - name: Reverify evidence and promote the declared preview
      uses: ./.buildchain/runtime/actions/publication/oci/apply-preview
      with:
        workflow-sha: ${{ inputs.workflow-sha }}
        token: ${{ inputs.promotion-token }}
        registry-token: ${{ github.token }}
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: compose-preview-readback-${{ github.run_id }}-${{ github.run_attempt }}
        path: .buildchain/compose-preview/buildchain-compose-preview-*.json
        if-no-files-found: ignore
