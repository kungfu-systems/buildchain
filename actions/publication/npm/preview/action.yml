name: npm-dry-run
description: Execute the npm-dry-run dry-run capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/runtime/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
    - name: Setup Node
      uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
        registry-url: https://registry.npmjs.org/
    - name: Install dependencies
      uses: ./.buildchain/runtime/actions/runtime/dependencies/install
      with:
        directory: .
        production: "false"
        ignore-scripts: "false"
    - name: Qualify package publication preview
      uses: ./.buildchain/runtime/actions/publication/npm/qualify-preview
      with:
        run-check: ${{ fromJSON(inputs.request-json).run-check }}
