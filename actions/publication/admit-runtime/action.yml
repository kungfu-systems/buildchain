name: admit-runtime
description: Admit the exact publication runtime.
inputs:
  repository:
    description: Buildchain runtime repository.
    required: true
  ref:
    description: Optional current runtime ref.
    default: ""
  workflow-sha:
    description: Defining workflow SHA.
    required: true
  workflow-ref:
    description: Defining workflow coordinate.
    required: true
outputs:
  runtime-ref:
    description: Selected runtime identity.
    value: ${{ steps.runtime.outputs.runtime-ref }}
  runtime-sha:
    description: Selected runtime identity.
    value: ${{ steps.runtime.outputs.runtime-sha }}
  runtime-class:
    description: Selected runtime identity.
    value: ${{ steps.runtime.outputs.runtime-class }}
  runtime-override:
    description: Selected runtime identity.
    value: ${{ steps.runtime.outputs.runtime-override }}
  runtime-trust-decision:
    description: Selected runtime identity.
    value: ${{ steps.runtime.outputs.runtime-trust-decision }}
runs:
  using: composite
  steps:
    - name: Resolve exact publication runtime
      id: runtime
      uses: actions/github-script@v8
      env:
        BUILDCHAIN_REPOSITORY: ${{ inputs.repository }}
        BUILDCHAIN_REQUESTED_REF: ${{ inputs.ref }}
        BUILDCHAIN_WORKFLOW_SHA: ${{ inputs.workflow-sha }}
        BUILDCHAIN_WORKFLOW_REF: ${{ inputs.workflow-ref }}
        BUILDCHAIN_ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const { pathToFileURL } = require("node:url");
          const entry = new URL("../../../packages/core/publication/nodes/runtime.mjs", pathToFileURL(process.env.BUILDCHAIN_ACTION_PATH + "/"));
          await (await import(entry.href)).resolvePublicationRuntime({ github, context, core });
