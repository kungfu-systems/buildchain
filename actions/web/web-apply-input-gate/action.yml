name: web-apply-input-gate
description: Execute the web apply-input-gate capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-release-intent-outputs-production-release-approved:
    description: Caller needs.release-intent.outputs.production-release-approved value.
    required: true
  needs-publication-decision-outputs-approved:
    description: Caller needs.publication-decision.outputs.approved value.
    required: true
outputs:
  web-surface-channel:
    description: web-surface-channel node result.
    value: ${{ steps.gate.outputs.web-surface-channel }}
  web-surface-alias:
    description: web-surface-alias node result.
    value: ${{ steps.gate.outputs.web-surface-alias }}
runs:
  using: composite
  steps:
    - name: Prepare Node for input admission
      uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Validate apply inputs before build
      id: gate
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        REF_NAME: ${{ github.ref_name }}
        PREVIEW_APPLY: ${{ fromJSON(inputs.request-json).preview-apply }}
        PREVIEW_CLEANUP_APPLY: ${{ fromJSON(inputs.request-json).preview-cleanup-apply }}
        PREVIEW_ROLE_ARN: ${{ fromJSON(inputs.request-json).preview-aws-role-arn }}
        STAGING_APPLY: ${{ fromJSON(inputs.request-json).staging-apply }}
        STAGING_ROLE_ARN: ${{ fromJSON(inputs.request-json).staging-aws-role-arn }}
        PRODUCTION_APPLY: ${{ fromJSON(inputs.request-json).production-apply }}
        PRODUCTION_APPROVED: ${{ fromJSON(inputs.request-json).production-approved }}
        PRODUCTION_RELEASE_ON_MAIN: ${{ fromJSON(inputs.request-json).production-release-on-main }}
        PRODUCTION_RELEASE_APPROVED: ${{ fromJSON(inputs.needs-release-intent-outputs-production-release-approved) }}
        PRODUCTION_DECISION_APPROVED: ${{ fromJSON(inputs.needs-publication-decision-outputs-approved) }}
        PRODUCTION_ROLE_ARN: ${{ fromJSON(inputs.request-json).production-aws-role-arn }}
        PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        node "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/apply-input-gate.mjs"
      shell: bash -e {0}
