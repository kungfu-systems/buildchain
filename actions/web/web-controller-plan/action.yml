name: web-controller-plan
description: Execute the web controller-plan capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-runtime-outputs-runtime-sha:
    description: Caller needs.runtime.outputs.runtime-sha value.
    required: true
  needs-release-intent-outputs-production-source-sha:
    description: Caller needs.release-intent.outputs.production-source-sha value.
    required: true
  needs-runtime-outputs-runtime-ref:
    description: Caller needs.runtime.outputs.runtime-ref value.
    required: true
outputs:
  controller-plan-artifact:
    description: controller-plan-artifact node result.
    value: buildchain-web-surface-controller-plan-${{ fromJSON(inputs.needs-release-intent-outputs-production-source-sha) }}
  controller-plan-json:
    description: controller-plan-json node result.
    value: ${{ steps.controller-plan.outputs.controller-plan-json }}
  controller-plan-digest:
    description: controller-plan-digest node result.
    value: ${{ steps.controller-plan.outputs.controller-plan-digest }}
runs:
  using: composite
  steps:
    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Resolve controller runtime contract
      id: controller-runtime
      shell: bash
      run: |
        contract_digest="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(".buildchain/runtime/dist/site/buildchain-contract.json","utf8")); process.stdout.write(value.contractDigest)')"
        echo "contract-digest=${contract_digest}" >> "$GITHUB_OUTPUT"
    - name: Create web-surface controller plan
      id: controller-plan
      run: node .buildchain/runtime/packages/core/observability/commands/controller-evidence.mjs --mode plan
      env:
        BUILDCHAIN_CONTROLLER_ID: web-surface
        BUILDCHAIN_CONTROLLER_SOURCE_REPOSITORY: ${{ github.repository }}
        BUILDCHAIN_CONTROLLER_SOURCE_SHA: ${{ fromJSON(inputs.needs-release-intent-outputs-production-source-sha) }}
        BUILDCHAIN_CONTROLLER_RUNTIME_REF: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-ref) }}
        BUILDCHAIN_CONTROLLER_RUNTIME_SHA: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        BUILDCHAIN_CONTROLLER_CONTRACT_DIGEST: ${{ steps.controller-runtime.outputs.contract-digest }}
        BUILDCHAIN_CONTROLLER_INPUTS_JSON: ${{ toJSON(fromJSON(inputs.request-json)) }}
        BUILDCHAIN_CONTROLLER_INPUT_BOUNDARY: workflow-call
        BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
      shell: bash -e {0}
    - name: Upload web-surface controller plan
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-web-surface-controller-plan-${{ fromJSON(inputs.needs-release-intent-outputs-production-source-sha) }}
        path: .buildchain/controller/plan.json
        if-no-files-found: error
