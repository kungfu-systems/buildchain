name: web-plan
description: Execute the web plan capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-runtime-outputs-runtime-sha:
    description: Caller needs.runtime.outputs.runtime-sha value.
    required: true
  needs-runtime-outputs-runtime-ref:
    description: Caller needs.runtime.outputs.runtime-ref value.
    required: true
  needs-runtime-outputs-runtime-class:
    description: Caller needs.runtime.outputs.runtime-class value.
    required: true
  job-workflow-ref:
    description: Caller job.workflow_ref value.
    required: true
  needs-runtime-outputs-runtime-override:
    description: Caller needs.runtime.outputs.runtime-override value.
    required: true
  needs-release-intent-outputs-production-source-sha:
    description: Caller needs.release-intent.outputs.production-source-sha value.
    required: true
  needs-apply-input-gate-outputs-web-surface-channel:
    description: Caller needs.apply-input-gate.outputs.web-surface-channel value.
    required: true
  needs-apply-input-gate-outputs-web-surface-alias:
    description: Caller needs.apply-input-gate.outputs.web-surface-alias value.
    required: true
  needs-runtime-outputs-rollback-ref:
    description: Caller needs.runtime.outputs.rollback-ref value.
    required: true
  needs-release-intent-outputs-production-release-approved:
    description: Caller needs.release-intent.outputs.production-release-approved value.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
outputs:
  web-surface-channel:
    description: web-surface-channel node result.
    value: ${{ steps.web.outputs.web-surface-channel }}
  web-surface-alias:
    description: web-surface-alias node result.
    value: ${{ steps.web.outputs.web-surface-alias }}
  web-surface-url:
    description: web-surface-url node result.
    value: ${{ steps.web.outputs.web-surface-url }}
  web-surface-urls-json:
    description: web-surface-urls-json node result.
    value: ${{ steps.web.outputs.web-surface-urls-json }}
  web-surface-manifest-json:
    description: web-surface-manifest-json node result.
    value: ${{ steps.web.outputs.web-surface-manifest-json }}
  web-surface-cleanup-plan-json:
    description: web-surface-cleanup-plan-json node result.
    value: ${{ steps.web.outputs.web-surface-cleanup-plan-json }}
  build-outcome:
    description: build-outcome node result.
    value: ${{ steps.build.outcome }}
  verify-outcome:
    description: verify-outcome node result.
    value: ${{ steps.verify.outcome }}
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain Node runtime
      id: core-runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Setup Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: ${{ fromJSON(inputs.request-json).node-version }}
    - name: Enable pnpm
      run: |
        corepack prepare pnpm@11.7.0 --activate
        corepack enable
        pnpm --version
      shell: bash -e {0}
    - name: Admit runtime contract
      uses: ./.buildchain/workflow-shell/actions/web/check-runtime-contract
      with:
        runtime-ref: ${{ inputs.needs-runtime-outputs-runtime-ref }}
        runtime-sha: ${{ inputs.needs-runtime-outputs-runtime-sha }}
        runtime-class: ${{ inputs.needs-runtime-outputs-runtime-class }}
        runtime-override: ${{ inputs.needs-runtime-outputs-runtime-override }}
        workflow-ref: ${{ inputs.job-workflow-ref }}
        source-sha: ${{ inputs.needs-release-intent-outputs-production-source-sha }}
        request-json: ${{ inputs.request-json }}
        core-node: ${{ steps.core-runtime.outputs.node-path }}
    - name: Run caller build
      id: build
      if: ${{ fromJSON(inputs.request-json).build-command != '' && fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-channel) != '' }}
      working-directory: ${{ fromJSON(inputs.request-json).working-directory }}
      env:
        BUILDCHAIN_WEB_SURFACE_CHANNEL: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-channel) }}
        BUILDCHAIN_SURFACE_CHANNEL: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-channel) }}
        BUILDCHAIN_PREVIEW_ALIAS: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-alias) }}
        BUILDCHAIN_WEB_SURFACE_ALIAS: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-alias) }}
        BUILDCHAIN_SITE_SOURCE_SHA: ${{ fromJSON(inputs.needs-release-intent-outputs-production-source-sha) }}
      run: ${{ fromJSON(inputs.request-json).build-command }}
      shell: bash -e {0}
    - name: Run caller verify
      id: verify
      if: ${{ fromJSON(inputs.request-json).verify-command != '' && fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-channel) != '' }}
      working-directory: ${{ fromJSON(inputs.request-json).working-directory }}
      env:
        BUILDCHAIN_WEB_SURFACE_CHANNEL: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-channel) }}
        BUILDCHAIN_SURFACE_CHANNEL: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-channel) }}
        BUILDCHAIN_PREVIEW_ALIAS: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-alias) }}
        BUILDCHAIN_WEB_SURFACE_ALIAS: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-alias) }}
        BUILDCHAIN_SITE_SOURCE_SHA: ${{ fromJSON(inputs.needs-release-intent-outputs-production-source-sha) }}
      run: ${{ fromJSON(inputs.request-json).verify-command }}
      shell: bash -e {0}
    - name: Validate web-surface config
      id: validate
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/web-surface.mjs --mode validate --cwd "${{ fromJSON(inputs.request-json).working-directory }}"'
      shell: bash -e {0}
      env:
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Plan pull request preview
      id: preview
      if: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-channel) == 'preview' && github.event.action != 'closed' }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/web-surface.mjs --mode deploy-plan --cwd "${{ fromJSON(inputs.request-json).working-directory }}" --channel preview --alias "${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-alias) }}" --source-sha "${{ github.event.pull_request.head.sha }}" --pull-number "${{ github.event.pull_request.number }}" --artifact-path "${{ fromJSON(inputs.request-json).artifact-path }}" --runtime-id "${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}" --rollback-pointer "${{ fromJSON(inputs.needs-runtime-outputs-rollback-ref) }}" --rollback-limitations "Buildchain runtime override changes cannot validate outer reusable workflow YAML topology." --output .buildchain/web-surface-preview-plan.json'
      shell: bash -e {0}
      env:
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Plan pull request preview cleanup
      id: cleanup
      if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && fromJSON(inputs.needs-release-intent-outputs-production-release-approved) != 'true' }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/web-surface.mjs --mode cleanup-plan --cwd "${{ fromJSON(inputs.request-json).working-directory }}" --channel preview --event pull-request-closed --source-sha "${{ github.event.pull_request.head.sha }}" --pull-number "${{ github.event.pull_request.number }}" --dry-run false --output .buildchain/web-surface-cleanup-plan.json'
      shell: bash -e {0}
      env:
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Plan main staging deploy
      id: staging
      if: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-channel) == 'staging' }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/web-surface.mjs --mode deploy-plan --cwd "${{ fromJSON(inputs.request-json).working-directory }}" --channel staging --source-sha "${{ fromJSON(inputs.needs-release-intent-outputs-production-source-sha) }}" --artifact-path "${{ fromJSON(inputs.request-json).artifact-path }}" --runtime-id "${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}" --rollback-pointer "${{ fromJSON(inputs.needs-runtime-outputs-rollback-ref) }}" --rollback-limitations "Buildchain runtime override changes cannot validate outer reusable workflow YAML topology." --output .buildchain/web-surface-staging-plan.json'
      shell: bash -e {0}
      env:
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Plan gated production deploy
      id: production
      if: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-channel) == 'production' }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/web-surface.mjs --mode deploy-plan --cwd "${{ fromJSON(inputs.request-json).working-directory }}" --channel production --source-sha "${{ fromJSON(inputs.needs-release-intent-outputs-production-source-sha) }}" --artifact-path "${{ fromJSON(inputs.request-json).artifact-path }}" --runtime-id "${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}" --rollback-pointer "${{ fromJSON(inputs.needs-runtime-outputs-rollback-ref) }}" --rollback-limitations "Buildchain runtime override changes cannot validate outer reusable workflow YAML topology." --output .buildchain/web-surface-production-plan.json'
      shell: bash -e {0}
      env:
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Upload web-surface plans
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-web-surface-plans
        path: .buildchain/web-surface-*-plan.json
        include-hidden-files: true
        if-no-files-found: ignore
    - name: Upload web-surface artifact
      if: ${{ fromJSON(inputs.needs-apply-input-gate-outputs-web-surface-channel) != '' && (github.event_name != 'pull_request' || github.event.action != 'closed') }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-web-surface-artifact
        path: ${{ fromJSON(inputs.request-json).working-directory }}/${{ fromJSON(inputs.request-json).artifact-path }}
        include-hidden-files: true
        if-no-files-found: error
    - name: Select web-surface outputs
      id: web
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" select
      shell: bash
      env:
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Comment release PR staging review URL
      if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && fromJSON(inputs.request-json).production-release-on-main }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_EVENT_ACTION: ${{ github.event.action }}
        PRODUCTION_RELEASE_ON_MAIN: ${{ fromJSON(inputs.request-json).production-release-on-main }}
        PRODUCTION_RELEASE_LABEL: ${{ fromJSON(inputs.request-json).production-release-label }}
        PRODUCTION_RELEASE_HEAD_PREFIX: ${{ fromJSON(inputs.request-json).production-release-head-prefix }}
        WORKING_DIRECTORY: ${{ fromJSON(inputs.request-json).working-directory }}
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/web-surface-release-pr-review.mjs'
      shell: bash -e {0}
