name: web-runtime
description: Execute the web runtime capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  job-workflow-ref:
    description: Caller job.workflow_ref value.
    required: true
  job-workflow-sha:
    description: Exact defining workflow commit.
    required: true
outputs:
  runtime-ref:
    description: runtime-ref node result.
    value: ${{ steps.runtime.outputs.runtime-ref }}
  runtime-full-ref:
    description: runtime-full-ref node result.
    value: ${{ steps.runtime.outputs.runtime-full-ref }}
  runtime-sha:
    description: runtime-sha node result.
    value: ${{ steps.runtime.outputs.runtime-sha }}
  runtime-class:
    description: runtime-class node result.
    value: ${{ steps.runtime.outputs.runtime-class }}
  runtime-override:
    description: runtime-override node result.
    value: ${{ steps.runtime.outputs.runtime-override }}
  runtime-trust-decision:
    description: runtime-trust-decision node result.
    value: ${{ steps.runtime.outputs.runtime-trust-decision }}
  workflow-shell-ref:
    description: workflow-shell-ref node result.
    value: ${{ steps.runtime.outputs.workflow-shell-ref }}
  rollback-ref:
    description: rollback-ref node result.
    value: ${{ steps.runtime.outputs.rollback-ref }}
runs:
  using: composite
  steps:
    - name: Resolve Buildchain runtime
      id: runtime
      uses: actions/github-script@v8
      env:
        BUILDCHAIN_REPOSITORY: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        BUILDCHAIN_REQUESTED_REF: ${{ fromJSON(inputs.request-json).buildchain-ref }}
        BUILDCHAIN_WORKFLOW_REF: ${{ fromJSON(inputs.job-workflow-ref) }}
        BUILDCHAIN_WORKFLOW_SHA: ${{ fromJSON(inputs.job-workflow-sha) }}
        BUILDCHAIN_ACTION_ROOT: ${{ github.action_path }}
      with:
        script: |
          const { pathToFileURL } = require("node:url");
          const { resolveWebRuntime } = await import(pathToFileURL(`${process.env.BUILDCHAIN_ACTION_ROOT}/../../../packages/core/web/nodes/runtime.mjs`).href);
          await resolveWebRuntime({ github, context, core });
