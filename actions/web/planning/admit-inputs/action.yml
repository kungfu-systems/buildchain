name: Admit Web apply request
description: Select the channel from the verified production decision and
  require deployment roles before any consumer build.
inputs:
  request-json:
    description: Typed public Web request.
    required: true
  decision-approved:
    description: Actual preceding publication decision.
    default: "false"
outputs:
  web-surface-channel:
    description: Admitted channel.
  web-surface-alias:
    description: Exact preview alias when applicable.
runs:
  using: node24
  main: dist/index.js
