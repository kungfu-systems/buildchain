name: web-publication-decision
description: Execute the web publication-decision capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public Web request.
    required: true
  runtime-json:
    description: Admitted runtime coordinates.
    required: true
  intent-json:
    description: Verified release intent.
    required: true
outputs:
  approved:
    description: approved node result.
    value: ${{ steps.decision.outputs.approved }}
  decision-json:
    description: decision-json node result.
    value: ${{ steps.decision.outputs.decision-json }}
runs:
  using: composite
  steps:
    - name: Resolve trusted production decision
      id: decision
      uses: ./.buildchain/runtime/actions/web/publication/authorize
      with:
        request-json: ${{ inputs.request-json }}
        intent-json: ${{ inputs.intent-json }}
        token: ${{ github.token }}
