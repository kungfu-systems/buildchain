name: web-publication-authority
description: Execute the web publication-authority capability within its caller job boundary.
inputs:
  request-json:
    description: Typed Web workflow request.
    required: true
  observations-json:
    description: Observed job results, runtime and decisions.
    required: true
outputs:
  capability-json:
    description: capability-json node result.
    value: ${{ steps.authority.outputs.capability-json }}
  capability-digest:
    description: capability-digest node result.
    value: ${{ steps.authority.outputs.capability-digest }}
  candidate-json:
    description: candidate-json node result.
    value: ${{ steps.authority.outputs.candidate-json }}
runs:
  using: composite
  steps:
    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.observations-json).runtime.outputs.runtime-sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain Node runtime
      id: core-runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/environment/prepare
      with:
        directory: .buildchain/runtime
    - name: Verify exact GitHub governance authority
      uses: ./.buildchain/runtime/actions/governance/repository/verify
      with:
        receipt-json: ${{ fromJSON(inputs.request-json).github-governance-receipt-json }}
        runtime-sha: ${{ fromJSON(inputs.observations-json).runtime.outputs.runtime-sha }}
    - name: Download web-surface controller plan
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ fromJSON(inputs.observations-json).controller-plan.outputs.controller-plan-artifact }}
        path: .buildchain/controller
    - name: Download web-surface production plan
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-web-surface-plans
        path: .buildchain/controller/web-plans
    - name: Seal Web publication admission
      id: authority
      uses: ./.buildchain/runtime/actions/web/publication/seal
      with:
        request-json: ${{ inputs.request-json }}
        observations-json: ${{ inputs.observations-json }}
        token: ${{ github.token }}
    - name: Upload managed web publication authority evidence
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-web-publication-authority-${{ github.run_id }}-${{ github.run_attempt }}
        path: .buildchain/web-publication-authority/*.json
        if-no-files-found: error
