name: web-publication-decision
description: Execute the web publication-decision capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-runtime-outputs-runtime-sha:
    description: Caller needs.runtime.outputs.runtime-sha value.
    required: true
  needs-release-intent-outputs-production-release-approved:
    description: Caller needs.release-intent.outputs.production-release-approved value.
    required: true
  needs-release-intent-outputs-production-release-pr:
    description: Caller needs.release-intent.outputs.production-release-pr value.
    required: true
  needs-release-intent-outputs-production-release-source:
    description: Caller needs.release-intent.outputs.production-release-source value.
    required: true
  needs-release-intent-outputs-production-source-sha:
    description: Caller needs.release-intent.outputs.production-source-sha value.
    required: true
outputs:
  approved:
    description: approved node result.
    value: ${{ steps.decision.outputs.approved }}
  decision-json:
    description: decision-json node result.
    value: ${{ steps.decision.outputs.decision-json }}
runs:
  using: composite
  steps:
    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Resolve trusted production decision
      id: decision
      run: node .buildchain/runtime/packages/core/web/commands/web-surface-production-decision.mjs
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BUILDCHAIN_PRODUCTION_APPLY: ${{ fromJSON(inputs.request-json).production-apply }}
        BUILDCHAIN_PRODUCTION_APPROVED: ${{ fromJSON(inputs.request-json).production-approved }}
        BUILDCHAIN_PRODUCTION_RELEASE_ON_MAIN: ${{ fromJSON(inputs.request-json).production-release-on-main }}
        BUILDCHAIN_PRODUCTION_RELEASE_APPROVED: ${{ fromJSON(inputs.needs-release-intent-outputs-production-release-approved) }}
        BUILDCHAIN_PRODUCTION_RELEASE_PR: ${{ fromJSON(inputs.needs-release-intent-outputs-production-release-pr) }}
        BUILDCHAIN_PRODUCTION_RELEASE_SOURCE: ${{ fromJSON(inputs.needs-release-intent-outputs-production-release-source) }}
        BUILDCHAIN_PRODUCTION_SOURCE_SHA: ${{ fromJSON(inputs.needs-release-intent-outputs-production-source-sha) }}
        GITHUB_EVENT_ACTION: ${{ github.event.action }}
      shell: bash -e {0}
