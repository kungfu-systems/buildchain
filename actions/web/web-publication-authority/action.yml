name: web-publication-authority
description: Execute the web publication-authority capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-runtime-outputs-runtime-sha:
    description: Caller needs.runtime.outputs.runtime-sha value.
    required: true
  needs-controller-plan-outputs-controller-plan-artifact:
    description: Caller needs.controller-plan.outputs.controller-plan-artifact value.
    required: true
  needs-runtime-result:
    description: Caller needs.runtime.result value.
    required: true
  needs-plan-result:
    description: Caller needs.plan.result value.
    required: true
  needs-plan-outputs-build-outcome:
    description: Caller needs.plan.outputs.build-outcome value.
    required: true
  needs-plan-outputs-verify-outcome:
    description: Caller needs.plan.outputs.verify-outcome value.
    required: true
  needs-release-intent-outputs-production-source-sha:
    description: Caller needs.release-intent.outputs.production-source-sha value.
    required: true
  needs-publication-decision-outputs-decision-json:
    description: Caller needs.publication-decision.outputs.decision-json value.
    required: true
outputs:
  capability-json:
    description: capability-json node result.
    value: ${{ steps.authority.outputs.capability-json }}
  capability-digest:
    description: capability-digest node result.
    value: ${{ steps.authority.outputs.capability-digest }}
  candidate-json:
    description: candidate-json node result.
    value: ${{ steps.authority.outputs.candidate-json }}
runs:
  using: composite
  steps:
    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain Node runtime
      id: core-runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Verify exact GitHub governance authority
      env:
        BUILDCHAIN_GITHUB_GOVERNANCE_RECEIPT_JSON: ${{ fromJSON(inputs.request-json).github-governance-receipt-json }}
        BUILDCHAIN_GITHUB_GOVERNANCE_EXPECTED_REPOSITORY: ${{ github.repository }}
        BUILDCHAIN_GITHUB_GOVERNANCE_EXPECTED_TARGET_REF: ${{ github.ref_name }}
        BUILDCHAIN_AUTHORITY_REF: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" governance
    - name: Download web-surface controller plan
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ fromJSON(inputs.needs-controller-plan-outputs-controller-plan-artifact) }}
        path: .buildchain/controller
    - name: Download web-surface production plan
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-web-surface-plans
        path: .buildchain/controller/web-plans
    - name: Select production plan evidence
      shell: bash
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" production-evidence
      env:
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Create qualifying pre-publication controller receipt
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/observability/commands/controller-evidence.mjs --mode receipt'
      env:
        BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
        BUILDCHAIN_CONTROLLER_STAGES_JSON: '[{"id":"resolve-runtime","status":"${{ fromJSON(inputs.needs-runtime-result) }}"},{"id":"plan","status":"${{ fromJSON(inputs.needs-plan-result) }}"},{"id":"build","status":"${{ fromJSON(inputs.needs-plan-outputs-build-outcome) || fromJSON(inputs.needs-plan-result) }}"},{"id":"verify","status":"${{ fromJSON(inputs.needs-plan-outputs-verify-outcome) || fromJSON(inputs.needs-plan-result) }}"},{"id":"publication-authority","status":"skipped"},{"id":"apply","status":"skipped"},{"id":"aggregate","status":"success"}]'
        BUILDCHAIN_CONTROLLER_EVIDENCE_FILES_JSON: '[{"kind":"web-surface-plan","path":".buildchain/controller/web-surface-plan.json"}]'
        BUILDCHAIN_CONTROLLER_RECEIPT_ARTIFACT: buildchain-web-surface-prepublication-receipt-${{ fromJSON(inputs.needs-release-intent-outputs-production-source-sha) }}
        BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
      shell: bash -e {0}
    - name: Assemble and verify managed web publication admission
      id: authority
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/assemble-web-surface-publication-admission.mjs'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BUILDCHAIN_REPOSITORY: ${{ github.repository }}
        BUILDCHAIN_SOURCE_SHA: ${{ fromJSON(inputs.needs-release-intent-outputs-production-source-sha) }}
        BUILDCHAIN_RUNTIME_ROOT: .buildchain/runtime
        BUILDCHAIN_WEB_SURFACE_PLAN_PATH: .buildchain/controller/web-surface-plan.json
        BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json
        BUILDCHAIN_PRODUCTION_DECISION_JSON: ${{ fromJSON(inputs.needs-publication-decision-outputs-decision-json) }}
        BUILDCHAIN_PUBLICATION_ENVIRONMENT: ${{ fromJSON(inputs.request-json).production-environment }}
        BUILDCHAIN_PRODUCTION_ROLE_ARN: ${{ fromJSON(inputs.request-json).production-aws-role-arn }}
        BUILDCHAIN_OUTPUT_DIR: .buildchain/web-publication-authority
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
      shell: bash -e {0}
    - name: Upload managed web publication authority evidence
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-web-publication-authority-${{ github.run_id }}-${{ github.run_attempt }}
        path: .buildchain/web-publication-authority/*.json
        if-no-files-found: error
