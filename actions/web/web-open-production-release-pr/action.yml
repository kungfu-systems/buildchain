name: web-open-production-release-pr
description: Execute the web open-production-release-pr capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-runtime-outputs-runtime-sha:
    description: Caller needs.runtime.outputs.runtime-sha value.
    required: true
  secrets-production-release-app-private-key:
    description: Explicit scoped provider credential.
    required: true
  secrets-production-release-pr-token:
    description: Explicit scoped provider credential.
    required: true
outputs:
  release-pr-status:
    description: release-pr-status node result.
    value: ${{ steps.open.outputs.release-pr-status }}
  production-release-pr-status:
    description: production-release-pr-status node result.
    value: ${{ steps.open.outputs.production-release-pr-status }}
  production-release-pr-url:
    description: production-release-pr-url node result.
    value: ${{ steps.open.outputs.production-release-pr-url }}
  production-release-pr:
    description: production-release-pr node result.
    value: ${{ steps.open.outputs.production-release-pr }}
  production-release-branch:
    description: production-release-branch node result.
    value: ${{ steps.open.outputs.production-release-branch }}
runs:
  using: composite
  steps:
  - name: Checkout Buildchain runtime
    uses: actions/checkout@v7.0.0
    with:
      repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
      ref: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
      path: .buildchain/runtime
      persist-credentials: false
  - name: Prepare exact Buildchain Node runtime
    id: core-runtime
    uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    with:
      directory: .buildchain/runtime
  - name: Download staging release PR summary
    uses: actions/download-artifact@v7.0.0
    with:
      name: buildchain-web-surface-staging-release-pr-summary
      path: .buildchain/staging-release-pr-summary
  - name: Download staging release passport
    uses: actions/download-artifact@v7.0.0
    with:
      name: buildchain-web-surface-staging-release-passport
      path: .buildchain/staging-release-passport
  - name: Resolve production release token config
    id: production-release-token-config
    env:
      PRODUCTION_RELEASE_APP_CLIENT_ID: ${{ fromJSON(inputs.request-json).production-release-app-client-id }}
      PRODUCTION_RELEASE_APP_PRIVATE_KEY_PRESENT: ${{ inputs.secrets-production-release-app-private-key != '' }}
      PRODUCTION_RELEASE_PR_TOKEN_PRESENT: ${{ inputs.secrets-production-release-pr-token != '' }}
      BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
      BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    run: '"$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" token-config

      '
    shell: bash
  - name: Create production release app token
    id: production-release-app-token
    if: ${{ steps.production-release-token-config.outputs.app-token-requested == 'true' }}
    uses: actions/create-github-app-token@v3.1.1
    continue-on-error: true
    with:
      client-id: ${{ fromJSON(inputs.request-json).production-release-app-client-id }}
      private-key: ${{ inputs.secrets-production-release-app-private-key }}
      owner: ${{ github.repository_owner }}
      repositories: ${{ github.event.repository.name }}
  - name: Resolve production release token source
    id: production-release-token
    env:
      APP_TOKEN_STATUS: ${{ steps.production-release-token-config.outputs.app-token-status }}
      APP_TOKEN_OUTCOME: ${{ steps.production-release-app-token.outcome }}
      APP_TOKEN_PRESENT: ${{ steps.production-release-app-token.outputs.token != '' }}
      PR_TOKEN_CONFIGURED: ${{ steps.production-release-token-config.outputs.pr-token-configured }}
      BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
      BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    run: '"$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" token-source

      '
    shell: bash
  - name: Open production release PR
    id: open
    env:
      GITHUB_TOKEN: ${{ steps.production-release-app-token.outputs.token || inputs.secrets-production-release-pr-token || github.token }}
      PRODUCTION_RELEASE_TOKEN_SOURCE: ${{ steps.production-release-token.outputs.token-source }}
      PRODUCTION_RELEASE_APP_TOKEN_STATUS: ${{ steps.production-release-token.outputs.app-token-status }}
      PRODUCTION_RELEASE_APP_TOKEN_UNAVAILABLE: ${{ steps.production-release-token.outputs.app-token-unavailable }}
      PRODUCTION_RELEASE_APP_CLIENT_ID_CONFIGURED: ${{ steps.production-release-token-config.outputs.app-client-id-configured }}
      PRODUCTION_RELEASE_APP_PRIVATE_KEY_CONFIGURED: ${{ steps.production-release-token-config.outputs.app-private-key-configured }}
      PRODUCTION_RELEASE_PR_TOKEN_CONFIGURED: ${{ steps.production-release-token-config.outputs.pr-token-configured }}
      STAGING_RELEASE_PR_SUMMARY_PATH: .buildchain/staging-release-pr-summary/web-surface-staging-release-pr-summary.json
      PRODUCTION_RELEASE_PR_SUMMARY_PATH: .buildchain/production-release-pr/handoff.json
      PRODUCTION_RELEASE_PR_BODY_PATH: .buildchain/production-release-pr/body.md
      PRODUCTION_RELEASE_PR_MODE: ${{ fromJSON(inputs.request-json).production-release-pr-mode }}
      FAIL_ON_RELEASE_PR_ERROR: ${{ fromJSON(inputs.request-json).fail-on-release-pr-error }}
      PRODUCTION_RELEASE_LABEL: ${{ fromJSON(inputs.request-json).production-release-label }}
      PRODUCTION_RELEASE_HEAD_PREFIX: ${{ fromJSON(inputs.request-json).production-release-head-prefix }}
      PRODUCTION_RELEASE_CHANNEL: ${{ fromJSON(inputs.request-json).production-release-branch-channel }}
      RELEASE_PASSPORT_ARTIFACT: buildchain-web-surface-staging-release-passport
      BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/web-surface-production-release-pr.mjs'
    shell: bash -e {0}
  - name: Upload production release PR handoff
    if: ${{ always() }}
    uses: actions/upload-artifact@v7.0.1
    with:
      name: buildchain-web-surface-production-release-pr-handoff
      path: '.buildchain/production-release-pr/handoff.json

        .buildchain/production-release-pr/body.md

        .buildchain/logs/events.jsonl

        .buildchain/staging-release-pr-summary/web-surface-staging-release-pr-summary.json

        .buildchain/staging-release-passport/web-surface-staging-release-passport.json

        '
      include-hidden-files: true
      if-no-files-found: warn
