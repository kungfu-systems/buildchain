name: check-runtime-contract
description: Verify the selected Web runtime contract and report observed consumer drift.
inputs:
  runtime-ref:
    description: needs-runtime-outputs-runtime-ref
    required: true
  runtime-sha:
    description: needs-runtime-outputs-runtime-sha
    required: true
  runtime-class:
    description: needs-runtime-outputs-runtime-class
    required: true
  runtime-override:
    description: needs-runtime-outputs-runtime-override
    required: true
  workflow-ref:
    description: job-workflow-ref
    required: true
  source-sha:
    description: needs-release-intent-outputs-production-source-sha
    required: true
  request-json:
    description: Public Web request.
    required: true
  core-node:
    description: Exact core Node executable.
    required: true
runs:
  using: composite
  steps:
    - name: Check Buildchain contract lock
      id: contract-lock
      shell: bash
      run: |
        "$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/contracts/commands/buildchain-contract-lock.mjs check
      env:
        BUILDCHAIN_CONTRACT_LOCK_PATH: ${{ fromJSON(inputs.request-json).buildchain-contract-lock-path }}
        BUILDCHAIN_CONTRACT_COMPATIBILITY_POLICY: ${{ fromJSON(inputs.request-json).buildchain-contract-compatibility-policy }}
        BUILDCHAIN_CONTRACT_DRIFT_ISSUE_MODE: ${{ fromJSON(inputs.request-json).buildchain-contract-drift-issue-mode }}
        BUILDCHAIN_RUNTIME_ROOT: .buildchain/runtime
        BUILDCHAIN_RUNTIME_REF: ${{ fromJSON(inputs.runtime-ref) }}
        BUILDCHAIN_RUNTIME_SHA: ${{ fromJSON(inputs.runtime-sha) }}
        BUILDCHAIN_RUNTIME_CLASS: ${{ fromJSON(inputs.runtime-class) }}
        BUILDCHAIN_WORKFLOW_SHELL_REF: ${{ fromJSON(inputs.workflow-ref) }}
        BUILDCHAIN_EXPECTED_CHANNEL: ${{ fromJSON(inputs.request-json).buildchain-contract-expected-channel }}
        BUILDCHAIN_EXPECTED_MAJOR: ${{ fromJSON(inputs.request-json).buildchain-contract-expected-major }}
        BUILDCHAIN_ALLOW_OPAQUE_RUNTIME: ${{ fromJSON(inputs.runtime-override) }}
        BUILDCHAIN_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BUILDCHAIN_NODE: ${{ inputs.core-node }}
    - name: Report consumer Buildchain contract drift
      if: ${{ always() && steps.contract-lock.outputs.contract-lock-issue-needed == 'true' }}
      uses: ./.buildchain/runtime/actions/governance/report-issue
      with:
        token: ${{ github.token }}
        target-repository: ${{ github.repository }}
        title: "[Buildchain contract] ${{ github.repository }} drift on ${{ fromJSON(inputs.runtime-ref) }}"
        failure-code: buildchain-contract-${{ steps.contract-lock.outputs.contract-lock-status }}
        buildchain-ref: ${{ fromJSON(inputs.runtime-ref) }}
        buildchain-version: ${{ steps.contract-lock.outputs.contract-digest }}
        consumer-repository: ${{ github.repository }}
        consumer-ref: ${{ github.ref }}
        consumer-sha: ${{ fromJSON(inputs.source-sha) }}
        workflow: ${{ github.workflow }}
        run-id: ${{ github.run_id }}
        run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        summary: "Buildchain floating runtime contract drift: ${{ steps.contract-lock.outputs.contract-lock-status }}"
        body-file: ${{ steps.contract-lock.outputs.contract-lock-issue-body-file }}
        labels: buildchain-contract-drift
        comment-cooldown-hours: "24"
        fail-on-error: "false"
