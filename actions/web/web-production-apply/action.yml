name: web-production-apply
description: Execute the web production-apply capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-runtime-outputs-runtime-sha:
    description: Caller needs.runtime.outputs.runtime-sha value.
    required: true
  needs-publication-authority-outputs-capability-json:
    description: Caller needs.publication-authority.outputs.capability-json value.
    required: true
  needs-external-publication-authority-outputs-capability-json:
    description: Caller needs.external-publication-authority.outputs.capability-json value.
    required: true
  needs-publication-authority-outputs-candidate-json:
    description: Caller needs.publication-authority.outputs.candidate-json value.
    required: true
  needs-release-intent-outputs-production-source-sha:
    description: Caller needs.release-intent.outputs.production-source-sha value.
    required: true
  needs-runtime-outputs-rollback-ref:
    description: Caller needs.runtime.outputs.rollback-ref value.
    required: true
  needs-release-intent-outputs-production-release-pr:
    description: Caller needs.release-intent.outputs.production-release-pr value.
    required: true
  needs-release-intent-outputs-production-release-source:
    description: Caller needs.release-intent.outputs.production-release-source value.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
outputs:
  production-apply-result-json:
    description: production-apply-result-json node result.
    value: ${{ steps.apply.outputs.web-surface-apply-result-json }}
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain Node runtime
      id: core-runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Download web-surface plan
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-web-surface-plans
        path: .buildchain/downloaded-plans
    - name: Verify sealed production capability before artifact download
      env:
        BUILDCHAIN_PUBLICATION_CAPABILITY_JSON: ${{ fromJSON(inputs.needs-publication-authority-outputs-capability-json) || fromJSON(inputs.needs-external-publication-authority-outputs-capability-json) }}
        BUILDCHAIN_WEB_SURFACE_CANDIDATE_JSON: ${{ fromJSON(inputs.needs-publication-authority-outputs-candidate-json) }}
        BUILDCHAIN_REPOSITORY: ${{ github.repository }}
        BUILDCHAIN_SOURCE_SHA: ${{ fromJSON(inputs.needs-release-intent-outputs-production-source-sha) }}
        BUILDCHAIN_RUNTIME_SHA: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        BUILDCHAIN_PUBLICATION_ENVIRONMENT: ${{ fromJSON(inputs.request-json).production-environment }}
        BUILDCHAIN_PRODUCTION_ROLE_ARN: ${{ fromJSON(inputs.request-json).production-aws-role-arn }}
        BUILDCHAIN_WEB_SURFACE_PLAN_PATH: .buildchain/downloaded-plans/web-surface-production-plan.json
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/verify-web-surface-publication-capability.mjs'
      shell: bash -e {0}
    - name: Download web-surface artifact
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-web-surface-artifact
        path: ${{ fromJSON(inputs.request-json).working-directory }}/${{ fromJSON(inputs.request-json).artifact-path }}
    - name: Validate production role
      env:
        ROLE_ARN: ${{ fromJSON(inputs.request-json).production-aws-role-arn }}
      run: |
        set -euo pipefail
        if [ -z "$ROLE_ARN" ]; then
          echo "::error::production-aws-role-arn is required when production-apply is true"
          exit 1
        fi
      shell: bash -e {0}
    - name: Configure production AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ fromJSON(inputs.request-json).production-aws-role-arn }}
        aws-region: ${{ fromJSON(inputs.request-json).aws-region }}
        role-session-name: buildchain-production-${{ github.run_id }}
    - name: Preflight production readiness
      id: preflight
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" preflight
      shell: bash
      env:
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_WEB_CHANNEL: production
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Apply production deploy
      id: apply
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" deploy
      shell: bash
      env:
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_WEB_CHANNEL: production
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Health check production deploy
      id: health
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" health
      shell: bash
      env:
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_WEB_CHANNEL: production
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Summarize production apply
      if: ${{ always() }}
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" summary
      shell: bash
      env:
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_WEB_CHANNEL: production
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Upload production apply diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-web-surface-production-diagnostics
        path: |
          .buildchain/web-surface-production-preflight.json
          .buildchain/web-surface-production-apply.json
          .buildchain/web-surface-production-health.json
        include-hidden-files: true
        if-no-files-found: warn
    - name: Comment production deploy feedback and write passport
      if: ${{ always() }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BUILDCHAIN_WEB_SURFACE_CHANNEL: production
        BUILDCHAIN_RUNTIME_SHA: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        BUILDCHAIN_ROLLBACK_POINTER: ${{ fromJSON(inputs.needs-runtime-outputs-rollback-ref) }}
        APPLY_RESULT_PATH: .buildchain/web-surface-production-apply.json
        PREFLIGHT_RESULT_PATH: .buildchain/web-surface-production-preflight.json
        HEALTH_RESULT_PATH: .buildchain/web-surface-production-health.json
        APPLY_STEP_OUTCOME: ${{ steps.apply.outcome }}
        JOB_STATUS: ${{ cancelled() && 'cancelled' || failure() && 'failure' || 'success' }}
        OUTPUT_PATH: .buildchain/web-surface-production-release-passport.json
        PASSPORT_ARTIFACT_NAME: buildchain-web-surface-production-release-passport
        RELEASE_FEEDBACK_ACTOR_PRIVACY: ${{ fromJSON(inputs.request-json).release-feedback-actor-privacy }}
        PRODUCTION_RELEASE_PR: ${{ fromJSON(inputs.needs-release-intent-outputs-production-release-pr) }}
        PRODUCTION_RELEASE_SOURCE: ${{ fromJSON(inputs.needs-release-intent-outputs-production-release-source) }}
        PRODUCTION_RELEASE_LABEL: ${{ fromJSON(inputs.request-json).production-release-label }}
        PRODUCTION_RELEASE_HEAD_PREFIX: ${{ fromJSON(inputs.request-json).production-release-head-prefix }}
        AWS_ROLE_ARN: ${{ fromJSON(inputs.request-json).production-aws-role-arn }}
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/web-surface-release-feedback.mjs'
      shell: bash -e {0}
    - name: Upload production release passport
      if: ${{ always() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-web-surface-production-release-passport
        path: .buildchain/web-surface-production-release-passport.json
        include-hidden-files: true
        if-no-files-found: error
