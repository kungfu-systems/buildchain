name: web-staging-apply
description: Execute the web staging-apply capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-runtime-outputs-runtime-sha:
    description: Caller needs.runtime.outputs.runtime-sha value.
    required: true
  needs-runtime-outputs-rollback-ref:
    description: Caller needs.runtime.outputs.rollback-ref value.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
outputs:
  staging-apply-result-json:
    description: staging-apply-result-json node result.
    value: ${{ steps.apply.outputs.web-surface-apply-result-json }}
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain Node runtime
      id: core-runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Download web-surface plan
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-web-surface-plans
        path: .buildchain/downloaded-plans
    - name: Download web-surface artifact
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-web-surface-artifact
        path: ${{ fromJSON(inputs.request-json).working-directory }}/${{ fromJSON(inputs.request-json).artifact-path }}
    - name: Validate staging role
      env:
        ROLE_ARN: ${{ fromJSON(inputs.request-json).staging-aws-role-arn }}
      run: |
        set -euo pipefail
        if [ -z "$ROLE_ARN" ]; then
          echo "::error::staging-aws-role-arn is required when staging-apply is true"
          exit 1
        fi
      shell: bash -e {0}
    - name: Configure staging AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ fromJSON(inputs.request-json).staging-aws-role-arn }}
        aws-region: ${{ fromJSON(inputs.request-json).aws-region }}
        role-session-name: buildchain-staging-${{ github.run_id }}
    - name: Apply staging deploy
      id: apply
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" deploy
      shell: bash
      env:
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_WEB_CHANNEL: staging
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Health check staging deploy
      id: health
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" health
      shell: bash
      env:
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_WEB_CHANNEL: staging
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Write staging release PR summary
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/web-surface-production-release-pr.mjs write-summary --input .buildchain/web-surface-staging-apply.json --output .buildchain/web-surface-staging-release-pr-summary.json'
      shell: bash -e {0}
      env:
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Summarize staging apply
      if: ${{ always() }}
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" summary
      shell: bash
      env:
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_WEB_CHANNEL: staging
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Upload staging apply diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-web-surface-staging-diagnostics
        path: |
          .buildchain/web-surface-staging-apply.json
          .buildchain/web-surface-staging-health.json
        include-hidden-files: true
        if-no-files-found: warn
    - name: Upload staging release PR summary
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-web-surface-staging-release-pr-summary
        path: .buildchain/web-surface-staging-release-pr-summary.json
        include-hidden-files: true
        if-no-files-found: error
    - name: Comment staging deploy feedback and write passport
      if: ${{ always() }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BUILDCHAIN_WEB_SURFACE_CHANNEL: staging
        BUILDCHAIN_RUNTIME_SHA: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        BUILDCHAIN_ROLLBACK_POINTER: ${{ fromJSON(inputs.needs-runtime-outputs-rollback-ref) }}
        APPLY_RESULT_PATH: .buildchain/web-surface-staging-apply.json
        HEALTH_RESULT_PATH: .buildchain/web-surface-staging-health.json
        APPLY_STEP_OUTCOME: ${{ steps.apply.outcome }}
        JOB_STATUS: ${{ cancelled() && 'cancelled' || failure() && 'failure' || 'success' }}
        OUTPUT_PATH: .buildchain/web-surface-staging-release-passport.json
        PASSPORT_ARTIFACT_NAME: buildchain-web-surface-staging-release-passport
        RELEASE_FEEDBACK_ACTOR_PRIVACY: ${{ fromJSON(inputs.request-json).release-feedback-actor-privacy }}
        AWS_ROLE_ARN: ${{ fromJSON(inputs.request-json).staging-aws-role-arn }}
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/web/commands/web-surface-release-feedback.mjs'
      shell: bash -e {0}
    - name: Upload staging release passport
      if: ${{ always() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-web-surface-staging-release-passport
        path: .buildchain/web-surface-staging-release-passport.json
        include-hidden-files: true
        if-no-files-found: error
