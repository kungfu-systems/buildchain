name: web-preview-cleanup
description: Execute the web preview-cleanup capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-runtime-outputs-runtime-sha:
    description: Caller needs.runtime.outputs.runtime-sha value.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
outputs:
  preview-cleanup-result-json:
    description: preview-cleanup-result-json node result.
    value: ${{ steps.apply.outputs.web-surface-cleanup-result-json }}
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-runtime-outputs-runtime-sha) }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain Node runtime
      id: core-runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Download web-surface plan
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-web-surface-plans
        path: .buildchain/downloaded-plans
    - name: Validate preview cleanup role
      env:
        ROLE_ARN: ${{ fromJSON(inputs.request-json).preview-aws-role-arn }}
      run: |
        set -euo pipefail
        if [ -z "$ROLE_ARN" ]; then
          echo "::error::preview-aws-role-arn is required when preview-cleanup-apply is true"
          exit 1
        fi
      shell: bash -e {0}
    - name: Configure preview AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ fromJSON(inputs.request-json).preview-aws-role-arn }}
        aws-region: ${{ fromJSON(inputs.request-json).aws-region }}
        role-session-name: buildchain-cleanup-${{ github.run_id }}
    - name: Apply preview cleanup
      id: apply
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" cleanup
      shell: bash
      env:
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_WEB_CHANNEL: cleanup
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
    - name: Comment preview cleanup
      if: ${{ fromJSON(inputs.request-json).preview-comment }}
      uses: actions/github-script@v8
      with:
        script: |
          const { pathToFileURL } = require("node:url");
          const { commentDeployment } = await import(pathToFileURL(`${process.env.BUILDCHAIN_ACTION_ROOT}/../../../packages/core/web/nodes/comment-preview-cleanup.mjs`).href);
          await commentDeployment({ github, context });
      env:
        BUILDCHAIN_ACTION_ROOT: ${{ github.action_path }}
    - name: Summarize preview cleanup
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/web/nodes/deployment.mjs" summary
      shell: bash
      env:
        BUILDCHAIN_WEB_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_WEB_CHANNEL: cleanup
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
