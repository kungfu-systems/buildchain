name: prepare-build-environment
description: Prepare runtime dependencies, exact source and declared toolchains.
inputs:
  plan:
    description: Rooted build plan
    required: true
  platform:
    description: Selected platform
    required: false
    default: ''
  checkout-source:
    description: Whether this instance consumes source
    required: false
    default: 'false'
  tools:
    description: Whether project toolchains are needed
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - name: Setup configured Node
    uses: actions/setup-node@v6.4.0
    with:
      node-version: ${{ inputs.tools == 'true' && fromJSON(inputs.plan).tools.node || '24' }}
  - name: Install exact runtime dependencies
    shell: bash
    run: corepack pnpm@11.7.0 install --dir "$GITHUB_ACTION_PATH/../../.." --prod --frozen-lockfile --ignore-scripts
  - name: Prepare exact source and runner evidence
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/build/commands/prepare.mjs"
    env:
      BUILDCHAIN_PLAN: ${{ inputs.plan }}
      GITHUB_TOKEN: ${{ github.token }}
      BUILDCHAIN_PLATFORM: ${{ inputs.platform }}
      BUILDCHAIN_PREPARE_TOOLS: ${{ inputs.tools }}
    if: ${{ inputs.checkout-source == 'true' }}
  - name: Setup configured Go
    if: ${{ inputs.tools == 'true' && fromJSON(inputs.plan).tools.setup_go }}
    uses: actions/setup-go@v6.5.0
    with:
      go-version: ${{ fromJSON(inputs.plan).tools.go }}
      cache: false
  - name: Setup configured Rust
    if: ${{ inputs.tools == 'true' && runner.os != 'Windows' && fromJSON(inputs.plan).tools.setup_rust }}
    uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
    with:
      toolchain: ${{ fromJSON(inputs.plan).tools.rust }}
    env:
      RUSTUP_DIST_SERVER: ${{ fromJSON(inputs.plan).environment.tools.rustup_dist_server || 'https://static.rust-lang.org' }}
      RUSTUP_UPDATE_ROOT: ${{ fromJSON(inputs.plan).environment.tools.rustup_update_root || 'https://static.rust-lang.org/rustup' }}
  - name: Install isolated Windows Rust toolchain
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/build/commands/prepare.mjs" windows-rust
    env:
      BUILDCHAIN_PLAN: ${{ inputs.plan }}
      GITHUB_TOKEN: ${{ github.token }}
      BUILDCHAIN_PLATFORM: ${{ inputs.platform }}
    if: ${{ inputs.tools == 'true' && runner.os == 'Windows' && fromJSON(inputs.plan).tools.setup_rust }}
