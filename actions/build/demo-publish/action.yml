name: demo-publish
description: Execute the demo publish capability within its caller job boundary.
inputs:
  secrets-demo-update-token:
    description: Explicit scoped provider credential.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  needs-capture-outputs-source-sha:
    description: Caller needs.capture.outputs.source-sha value.
    required: true
  job-workflow-sha:
    description: Caller job.workflow_sha value.
    required: true
  needs-capture-outputs-capture-artifact-name:
    description: Caller needs.capture.outputs.capture-artifact-name value.
    required: true
  needs-qualify-outputs-evidence-artifact-name:
    description: Caller needs.qualify.outputs.evidence-artifact-name value.
    required: true
outputs:
  pr-url:
    description: pr-url node result.
    value: ${{ steps.pr.outputs.url }}
runs:
  using: composite
  steps:
    - name: Require explicit publication capability
      shell: bash
      env:
        UPDATE_TOKEN: ${{ inputs.secrets-demo-update-token }}
        BASE_REF: ${{ fromJSON(inputs.request-json).materialize-base-ref }}
      run: |
        test -n "${UPDATE_TOKEN}" || { echo "DEMO_UPDATE_TOKEN is required for publication" >&2; exit 2; }
        test -n "${BASE_REF}" || { echo "materialize-base-ref is required for publication" >&2; exit 2; }
    - name: Check out exact source with bounded update capability
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ fromJSON(inputs.needs-capture-outputs-source-sha) }}
        fetch-depth: 0
        token: ${{ inputs.secrets-demo-update-token }}
        persist-credentials: true
        path: source
    - name: Check out exact Buildchain runtime
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.job-workflow-sha) }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain runtime
      id: core-node
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Establish the protected update branch
      shell: bash
      env:
        SOURCE_SHA: ${{ fromJSON(inputs.needs-capture-outputs-source-sha) }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/build/nodes/demo-workflow.mjs" branch
    - name: Download exact capture collection
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: ${{ fromJSON(inputs.needs-capture-outputs-capture-artifact-name) }}
        path: .demo-input/captures
    - name: Download exact qualified evidence
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: ${{ fromJSON(inputs.needs-qualify-outputs-evidence-artifact-name) }}
        path: .demo-input/qualified
    - name: Materialize every demo idempotently
      shell: bash
      env:
        SCENARIO_PATH: ${{ fromJSON(inputs.request-json).scenario-path }}
        RENDERER_IMAGE: ${{ fromJSON(inputs.request-json).renderer-image }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
        BUILDCHAIN_WORKFLOW_SHA: ${{ fromJSON(inputs.job-workflow-sha) }}
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/build/nodes/demo-workflow.mjs" materialize
    - name: Commit and open or update the protected pull request
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.secrets-demo-update-token }}
        SOURCE_SHA: ${{ fromJSON(inputs.needs-capture-outputs-source-sha) }}
        BASE_REF: ${{ fromJSON(inputs.request-json).materialize-base-ref }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
        SCENARIO_PATH: ${{ fromJSON(inputs.request-json).scenario-path }}
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/build/nodes/demo-workflow.mjs" publish
