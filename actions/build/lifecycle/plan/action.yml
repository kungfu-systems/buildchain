name: resolve-build-plan
description: Admit source and runtime, resolve TOML and produce the complete rooted build plan.
inputs:
  config-path:
    description: Optional project TOML locator
    required: false
    default: ""
  workflow-ref:
    description: GitHub called workflow identity
    required: true
  workflow-sha:
    description: Exact GitHub called workflow SHA
    required: true
  control-token:
    description: Runner inventory authority
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup control runtime
      uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Install exact runtime dependencies
      uses: ./.buildchain/runtime/actions/runtime/dependencies/install
      with:
        directory: .buildchain/runtime
    - name: Resolve admitted build plan
      id: plan
      uses: ./.buildchain/runtime/actions/build/plan/resolve
      with:
        config-path: ${{ inputs.config-path }}
        workflow-ref: ${{ inputs.workflow-ref }}
        workflow-sha: ${{ inputs.workflow-sha }}
        control-token: ${{ inputs.control-token }}
        token: ${{ github.token }}
outputs:
  plan:
    description: Rooted build plan
    value: ${{ steps.plan.outputs.plan }}
