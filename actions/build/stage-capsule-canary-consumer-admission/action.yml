name: stage-capsule-canary-consumer-admission
description: Execute the stage-capsule-canary consumer-admission capability within its caller job boundary.
inputs:
  job-workflow-sha:
    description: Caller job.workflow_sha value.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
outputs:
  receipt-root:
    description: receipt-root node result.
    value: ${{ steps.policy.outputs.v4-consumer-policy-receipt-root }}
  scanner-root:
    description: scanner-root node result.
    value: ${{ steps.policy.outputs.v4-consumer-policy-scanner-root }}
runs:
  using: composite
  steps:
    - name: Checkout exact consumer source
      uses: actions/checkout@v7.0.0
      with:
        path: .buildchain/consumer
        persist-credentials: false
    - name: Resolve exact called-workflow runtime
      id: runtime
      shell: bash
      env:
        BUILDCHAIN_WORKFLOW_SHA: ${{ fromJSON(inputs.job-workflow-sha) }}
      run: |
        set -euo pipefail
        if [[ ! "${BUILDCHAIN_WORKFLOW_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::job.workflow_sha is not an exact commit SHA"
          exit 1
        fi
        printf 'sha=%s\n' "$(printf '%s' "${BUILDCHAIN_WORKFLOW_SHA}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"
    - name: Checkout exact Buildchain policy runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ steps.runtime.outputs.sha }}
        path: .buildchain/policy-runtime
        persist-credentials: false
    - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/policy-runtime
    - name: Enforce v4 floating consumer policy
      id: policy
      shell: bash
      env:
        BUILDCHAIN_CONSUMER_ROOT: .buildchain/consumer
        BUILDCHAIN_INVOKED_WORKFLOW: .github/workflows/public-build-stage-capsule-canary.yml
        BUILDCHAIN_WORKFLOW_SHA: ${{ fromJSON(inputs.job-workflow-sha) }}
        BUILDCHAIN_RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
        BUILDCHAIN_STABLE_CONTRACT_LOCK_PATH: .buildchain/contract-lock.json
        BUILDCHAIN_ALPHA_CONTRACT_LOCK_PATH: .buildchain/alpha-contract-lock.json
        BUILDCHAIN_V4_POLICY_RECEIPT_PATH: .buildchain/evidence/consumer-policy-receipt.json
      run: node .buildchain/policy-runtime/packages/core/consumer/commands/consumer-policy.mjs scan
    - name: Upload rooted consumer admission receipt
      uses: actions/upload-artifact@v7.0.1
      with:
        name: v4-consumer-policy-${{ fromJSON(inputs.request-json).consumer }}-${{ github.sha }}
        path: .buildchain/consumer/.buildchain/evidence/consumer-policy-receipt.json
        if-no-files-found: error
