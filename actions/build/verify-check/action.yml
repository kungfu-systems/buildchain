name: verify-check
description: Execute the verify check capability within its caller job boundary.
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - uses: actions/setup-go@v6.5.0
      with:
        go-version: 1.25.x
    - name: Install the exact Rust/WASM build toolchain
      run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      shell: bash -e {0}
    - name: Enable package manager shims
      run: |
        corepack prepare pnpm@11.7.0 --activate
        corepack enable
        pnpm --version
      shell: bash -e {0}
    - name: Install Buildchain runtime dependencies
      run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts
      shell: bash -e {0}
    - name: Select full source, exact proof, or version-state validation
      id: source-verification
      env:
        GH_TOKEN: ${{ github.token }}
      run: node packages/core/build/commands/source-verification-evidence.mjs plan
      shell: bash -e {0}
    - name: Record full source verification identity
      if: ${{ github.event_name == 'merge_group' && steps.source-verification.outputs.decision == 'execute' }}
      run: node packages/core/build/commands/source-verification-evidence.mjs start
      shell: bash -e {0}
    - name: Validate declared check lifecycle
      if: ${{ steps.source-verification.outputs.decision == 'execute' }}
      run: node .buildchain/runtime/bin/buildchain.mjs validate --cwd . --require-version-state --require-lifecycle-stages install,verify
      shell: bash -e {0}
    - name: Run declared install lifecycle
      if: ${{ steps.source-verification.outputs.decision == 'execute' }}
      run: node .buildchain/runtime/bin/buildchain.mjs lifecycle run install --cwd . --required --artifact-name buildchain-check-install --manifest-path .buildchain/artifacts/check-install-manifest.json --summary-path .buildchain/artifacts/check-install-summary.json
      shell: bash -e {0}
    - name: Run declared verify lifecycle (full source tests and generated artifact checks)
      if: ${{ steps.source-verification.outputs.decision == 'execute' }}
      run: node .buildchain/runtime/bin/buildchain.mjs lifecycle run verify --cwd . --required --artifact-name buildchain-check --manifest-path .buildchain/artifacts/check-manifest.json --summary-path .buildchain/artifacts/check-summary.json
      shell: bash -e {0}
    - name: Seal successful full source verification evidence
      if: ${{ github.event_name == 'merge_group' && steps.source-verification.outputs.decision == 'execute' }}
      run: node packages/core/build/commands/source-verification-evidence.mjs seal
      shell: bash -e {0}
    - name: Upload immutable source verification proof
      if: ${{ github.event_name == 'merge_group' && steps.source-verification.outputs.decision == 'execute' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: source-verification-${{ github.sha }}-${{ github.run_attempt }}
        path: .buildchain/source-verification/evidence.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
    - name: Upload check evidence
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-check
        path: |
          .buildchain/artifacts/
          .buildchain/source-verification/decision.json
        include-hidden-files: true
        if-no-files-found: error
inputs:
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
