name: verify-checkouts
description: Verify source and runtime byte identity.
inputs:
  source-directory:
    default: .
    description: Explicit source-directory for the admitted operation.
  source-sha:
    required: true
    description: Explicit source-sha for the admitted operation.
  runtime-directory:
    default: .buildchain/runtime
    description: Explicit runtime-directory for the admitted operation.
  runtime-sha:
    required: true
    description: Explicit runtime-sha for the admitted operation.
runs:
  using: node24
  main: dist/index.js
