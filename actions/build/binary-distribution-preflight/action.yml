name: binary-distribution-preflight
description: Execute the binary-distribution preflight capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
runs:
  using: composite
  steps:
  - name: Prepare Node for coordinate validation
    uses: actions/setup-node@v6.4.0
    with:
      node-version: '24'
  - name: Validate binary distribution coordinates
    shell: bash
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.request-json).tag || github.ref_name }}
    run: 'node "$GITHUB_ACTION_PATH/../../../packages/core/build/nodes/binary-distribution.mjs" preflight

      '
