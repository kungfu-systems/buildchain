name: verify-build-backbone
description: Execute the verify build-backbone capability within its caller job boundary.
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/runtime/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
    - name: Prepare candidate test dependencies
      uses: ./.buildchain/runtime/actions/runtime/dependencies/install
      with:
        directory: .
        production: "false"
    - name: Qualify source lifecycle and artifact boundaries
      uses: ./.buildchain/runtime/actions/build/verification/qualify-backbone
inputs:
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
