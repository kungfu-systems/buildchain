name: Qualify a checked-in demo adapter through bounded renderer smoke
description: Qualify a checked-in demo adapter through bounded renderer smoke.
inputs:
  runtime-sha:
    description: Exact runtime-sha.
    required: true
  source-sha:
    description: Exact source-sha.
    required: true
  renderer-image:
    description: Exact renderer-image.
    required: true
  media-profile:
    description: Exact media-profile.
    required: true
