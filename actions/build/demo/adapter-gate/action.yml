name: demo-adapter-gate
description: Execute the demo-adapter gate capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  workflow-sha:
    description: Exact workflow-sha.
    required: true
outputs:
  source-sha:
    description: source-sha node result.
    value: ${{ steps.source.outputs.commit }}
  gate-artifact-name:
    description: gate-artifact-name node result.
    value: ${{ steps.finalize.outputs.gate-artifact-name }}
  gate-artifact-id:
    description: gate-artifact-id node result.
    value: ${{ steps.upload.outputs.artifact-id }}
  gate-artifact-digest:
    description: gate-artifact-digest node result.
    value: ${{ steps.upload.outputs.artifact-digest }}
  gate-artifact-url:
    description: gate-artifact-url node result.
    value: ${{ steps.upload.outputs.artifact-url }}
  gate-root:
    description: gate-root node result.
    value: ${{ steps.finalize.outputs.gate-root }}
runs:
  using: composite
  steps:
    - name: Admit consumer event trust
      id: trust
      uses: ./.buildchain/runtime/actions/workflow/event/admit
      with:
        head-repository: ${{ github.event.pull_request.head.repo.full_name }}
        require-trusted: ${{ fromJSON(inputs.request-json).require-trusted-event }}
        untrusted-policy: fail
    - name: Checkout exact consumer source
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ fromJSON(inputs.request-json).source-ref || github.sha }}
        path: source
        clean: true
        persist-credentials: false
      id: source
    - name: Resolve exact source artifact coordinate
      id: source-artifact
      uses: ./.buildchain/runtime/actions/build/artifact/resolve
      with:
        name: ${{ fromJSON(inputs.request-json).source-artifact-name }}
        digest: ${{ fromJSON(inputs.request-json).source-artifact-digest }}
        source-sha: ${{ steps.source.outputs.commit }}
        output: gate-work/source-artifact.json
        token: ${{ github.token }}
    - name: Download exact source artifact
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: ${{ fromJSON(inputs.request-json).source-artifact-name }}
        path: source-artifact
    - name: Qualify adapter and seal bounded Gate evidence
      id: finalize
      uses: ./.buildchain/runtime/actions/build/demo/run-adapter
      with:
        runtime-sha: ${{ inputs.workflow-sha }}
        source-sha: ${{ steps.source.outputs.commit }}
        renderer-image: ${{ fromJSON(inputs.request-json).renderer-image }}
        media-profile: ${{ fromJSON(inputs.request-json).media-profile }}
        adapter-path: ${{ fromJSON(inputs.request-json).adapter-path }}
        adapter-arguments-json: ${{ fromJSON(inputs.request-json).adapter-arguments-json }}
    - name: Upload content-addressed qualified Gate bundle
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.finalize.outputs.gate-artifact-name }}
        path: gate-bundle
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
        compression-level: 0
        overwrite: false
    - name: Upload Gate diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: auditable-demo-gate-diagnostics-${{ github.run_id }}-${{
          github.run_attempt }}
        path: |
          gate-diagnostics
          gate-work/source-artifact.json
        if-no-files-found: warn
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
        compression-level: 0
        overwrite: false
