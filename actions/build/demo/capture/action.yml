name: demo-capture
description: Execute the demo capture capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  workflow-sha:
    description: Exact workflow-sha.
    required: true
outputs:
  source-sha:
    description: source-sha node result.
    value: ${{ steps.source.outputs.commit }}
  capture-artifact-name:
    description: capture-artifact-name node result.
    value: ${{ steps.identity.outputs.name }}
  capture-artifact-digest:
    description: capture-artifact-digest node result.
    value: ${{ steps.upload.outputs.artifact-digest }}
runs:
  using: composite
  steps:
    - name: Check out exact consumer source
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ fromJSON(inputs.request-json).source-ref || github.sha }}
        path: source
        clean: true
        persist-credentials: false
      id: source
    - name: Check out exact Buildchain runtime
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ inputs.workflow-sha }}
        path: .buildchain/runtime
        clean: true
        persist-credentials: false
    - name: Prepare exact Buildchain runtime
      id: core-node
      uses: ./.buildchain/workflow-shell/actions/runtime/environment/prepare
      with:
        directory: .buildchain/runtime
    - name: Resolve exact same-run binary artifact
      uses: ./.buildchain/workflow-shell/actions/build/artifact/resolve
      with:
        name: ${{ fromJSON(inputs.request-json).binary-artifact-name }}
        digest: ${{ fromJSON(inputs.request-json).binary-artifact-digest }}
        source-sha: ${{ steps.source.outputs.commit }}
        output: binary-coordinate.json
        token: ${{ github.token }}
    - name: Download exact binary artifact
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: ${{ fromJSON(inputs.request-json).binary-artifact-name }}
        path: source-artifact
    - name: Capture and identify declared demo collection
      id: identity
      uses: ./.buildchain/runtime/actions/build/demo/capture-collection
      with:
        runtime-sha: ${{ inputs.workflow-sha }}
        source-sha: ${{ steps.source.outputs.commit }}
        renderer-image: ${{ fromJSON(inputs.request-json).renderer-image }}
        scenario-path: ${{ fromJSON(inputs.request-json).scenario-path }}
    - name: Upload exact capture collection
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.identity.outputs.name }}
        path: capture-collection
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
        compression-level: 0
        overwrite: false
