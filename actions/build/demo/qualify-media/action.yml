name: demo-media-qualification-qualify
description: Execute the demo-media-qualification qualify capability within its caller job boundary.
inputs:
  matrix-json:
    description: Declared platform matrix value.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/workflow-shell/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
    - name: Qualify exact media fixture
      uses: ./actions/build/demo/measure-media
      with:
        fixture-json: ${{ inputs.matrix-json }}
    - name: Upload qualification evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ fromJSON(inputs.matrix-json).artifactName }}-${{ github.sha }}
        path: |
          .buildchain/media-profile/evidence.json
          .buildchain/media-profile/inspection/media-inspection.json
          .buildchain/media-profile/render/manifest.json
        if-no-files-found: error
        retention-days: 14
