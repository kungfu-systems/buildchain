name: stage-capsule-canary-qualify
description: Execute the stage-capsule-canary qualify capability within its caller job boundary.
inputs:
  job-workflow-sha:
    description: Caller job.workflow_sha value.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  matrix-json:
    description: Declared platform matrix value.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Resolve exact called-workflow runtime
      id: runtime
      env:
        BUILDCHAIN_WORKFLOW_SHA: ${{ fromJSON(inputs.job-workflow-sha) }}
      run: |
        if [[ ! "${BUILDCHAIN_WORKFLOW_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::job.workflow_sha is not an exact commit SHA"
          exit 1
        fi
        printf 'sha=%s\n' "$(printf '%s' "${BUILDCHAIN_WORKFLOW_SHA}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"
      shell: bash
    - name: Checkout the exact Buildchain workflow runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ steps.runtime.outputs.sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Verify exact runtime binding
      run: test "$(git -C .buildchain/runtime rev-parse HEAD)" = "${{ steps.runtime.outputs.sha }}"
      shell: bash
    - id: buildchain-runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: ${{ fromJSON(inputs.request-json).node-version }}
    - uses: actions/setup-go@v6.5.0
      if: fromJSON(inputs.request-json).go-version != ''
      with:
        go-version: ${{ fromJSON(inputs.request-json).go-version }}
    - name: Run declared install lifecycle
      env:
        BUILDCHAIN_SOURCE_SHA: ${{ github.sha }}
        CANARY_ARTIFACT_PATH: ${{ fromJSON(inputs.request-json).install-artifact-path }}
        CANARY_CONSUMER: ${{ fromJSON(inputs.request-json).consumer }}
        CANARY_PLATFORM: ${{ fromJSON(inputs.matrix-json).platform }}
        BUILDCHAIN_NODE: ${{ steps.buildchain-runtime.outputs.node-path }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/bin/buildchain.mjs lifecycle run install --cwd . --required --platform-id "${CANARY_PLATFORM}" --artifact-name "${CANARY_CONSUMER}-v4-canary-install" --artifact-path "${CANARY_ARTIFACT_PATH}" --manifest-path .buildchain/artifacts/stage-capsule-canary/install-manifest.json --summary-path .buildchain/artifacts/stage-capsule-canary/install-summary.json'
      shell: bash
    - name: Run declared build lifecycle
      env:
        BUILDCHAIN_SOURCE_SHA: ${{ github.sha }}
        CANARY_ARTIFACT_PATH: ${{ fromJSON(inputs.request-json).build-artifact-path }}
        CANARY_CONSUMER: ${{ fromJSON(inputs.request-json).consumer }}
        CANARY_PLATFORM: ${{ fromJSON(inputs.matrix-json).platform }}
        BUILDCHAIN_NODE: ${{ steps.buildchain-runtime.outputs.node-path }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/bin/buildchain.mjs lifecycle run build --cwd . --required --platform-id "${CANARY_PLATFORM}" --artifact-name "${CANARY_CONSUMER}-v4-canary-build" --artifact-path "${CANARY_ARTIFACT_PATH}" --manifest-path .buildchain/artifacts/stage-capsule-canary/build-manifest.json --summary-path .buildchain/artifacts/stage-capsule-canary/build-summary.json'
      shell: bash
    - name: Run declared verify lifecycle
      env:
        BUILDCHAIN_SOURCE_SHA: ${{ github.sha }}
        CANARY_ARTIFACT_PATH: ${{ fromJSON(inputs.request-json).verify-artifact-path }}
        CANARY_CONSUMER: ${{ fromJSON(inputs.request-json).consumer }}
        CANARY_PLATFORM: ${{ fromJSON(inputs.matrix-json).platform }}
        BUILDCHAIN_NODE: ${{ steps.buildchain-runtime.outputs.node-path }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/bin/buildchain.mjs lifecycle run verify --cwd . --required --platform-id "${CANARY_PLATFORM}" --artifact-name "${CANARY_CONSUMER}-v4-canary-verify" --artifact-path "${CANARY_ARTIFACT_PATH}" --manifest-path .buildchain/artifacts/stage-capsule-canary/verify-manifest.json --summary-path .buildchain/artifacts/stage-capsule-canary/verify-summary.json'
      shell: bash
    - name: Run retained-failure and clean-process resume campaign
      env:
        BUILDCHAIN_RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
        CANARY_CONSUMER: ${{ fromJSON(inputs.request-json).consumer }}
        CANARY_PLATFORM: ${{ fromJSON(inputs.matrix-json).platform }}
        CONSUMER_SOURCE_SHA: ${{ github.sha }}
        BUILDCHAIN_NODE: ${{ steps.buildchain-runtime.outputs.node-path }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/build/commands/stage-capsule-qualification.mjs campaign --work-root ".buildchain/stage-capsule-canary/${CANARY_PLATFORM}" --platform "${CANARY_PLATFORM}" --consumer "${CANARY_CONSUMER}" --runtime-ref "${BUILDCHAIN_RUNTIME_SHA}" --consumer-source-revision "${CONSUMER_SOURCE_SHA}" --consumer-root . --lifecycle-evidence-root .buildchain/artifacts/stage-capsule-canary'
      shell: bash
    - name: Upload exact platform evidence
      uses: actions/upload-artifact@v7.0.1
      with:
        name: v4-stage-capsule-canary-${{ fromJSON(inputs.request-json).consumer }}-${{ fromJSON(inputs.matrix-json).platform }}-${{ github.sha }}
        path: |
          .buildchain/artifacts/stage-capsule-canary/*.json
          .buildchain/stage-capsule-canary/${{ fromJSON(inputs.matrix-json).platform }}/*.json
        if-no-files-found: error
