name: Verify and retain isolated credential results
description: Verify and retain isolated credential results.
inputs:
  plan:
    description: Rooted build plan
    required: true
  platform:
    description: Declared build platform
    required: true
  token:
    description: Scoped artifact read credential
    required: true
  manifest-path:
    description: Signed credential manifest
    required: true
  artifact-root:
    description: Signed credential artifact root
    required: true
runs:
  using: node24
  main: dist/index.js
