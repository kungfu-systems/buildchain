name: Admit sealed build input into the macOS credential instance
description: Admit sealed build input into the macOS credential instance.
inputs:
  plan:
    description: Rooted build plan
    required: true
  platform:
    description: Declared build platform
    required: true
  token:
    description: Scoped artifact read credential
    required: true
runs:
  using: node24
  main: dist/index.js
outputs:
  bundle-id:
    description: Validated sealed bundle identifier
