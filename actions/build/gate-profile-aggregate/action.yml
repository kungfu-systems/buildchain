name: gate-profile-aggregate
description: Execute the gate-profile aggregate capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-plan-outputs-buildchain-runtime-sha:
    description: Caller needs.plan.outputs.buildchain-runtime-sha value.
    required: true
  needs-plan-outputs-gate-matrix-artifact:
    description: Caller needs.plan.outputs.gate-matrix-artifact value.
    required: true
  needs-plan-outputs-controller-plan-artifact:
    description: Caller needs.plan.outputs.controller-plan-artifact value.
    required: true
  needs-plan-outputs-source-sha:
    description: Caller needs.plan.outputs.source-sha value.
    required: true
  needs-plan-result:
    description: Caller needs.plan.result value.
    required: true
  needs-run-gates-result:
    description: Caller needs.run-gates.result value.
    required: true
outputs:
  gate-aggregate-artifact:
    description: gate-aggregate-artifact node result.
    value: ${{ steps.names.outputs.gate-aggregate-artifact }}
  gate-aggregate-json:
    description: gate-aggregate-json node result.
    value: ${{ steps.aggregate.outputs.gate-aggregate-json }}
  gate-aggregate-digest:
    description: gate-aggregate-digest node result.
    value: ${{ steps.aggregate.outputs.gate-aggregate-digest }}
  gate-aggregate-status:
    description: gate-aggregate-status node result.
    value: ${{ steps.aggregate.outputs.gate-aggregate-status }}
  controller-receipt-artifact:
    description: controller-receipt-artifact node result.
    value: ${{ steps.controller-names.outputs.controller-receipt-artifact }}
  controller-receipt-json:
    description: controller-receipt-json node result.
    value: ${{ steps.controller-receipt.outputs.controller-receipt-json }}
  controller-receipt-digest:
    description: controller-receipt-digest node result.
    value: ${{ steps.controller-receipt.outputs.controller-receipt-digest }}
  controller-receipt-status:
    description: controller-receipt-status node result.
    value: ${{ steps.controller-receipt.outputs.controller-receipt-status }}
runs:
  using: composite
  steps:
    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-plan-outputs-buildchain-runtime-sha) }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain Node runtime
      id: core-runtime
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Setup Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: ${{ fromJSON(inputs.request-json).node-version }}
    - name: Download locked Gate plan
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ fromJSON(inputs.needs-plan-outputs-gate-matrix-artifact) }}
        path: .buildchain/gates/plan
    - name: Download Shifu profile envelope controller plan
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ fromJSON(inputs.needs-plan-outputs-controller-plan-artifact) }}
        path: .buildchain/controller
    - name: Download Shifu Gate receipts
      continue-on-error: true
      uses: actions/download-artifact@v7.0.0
      with:
        pattern: ${{ fromJSON(inputs.request-json).artifact-name }}-receipt-*-${{ fromJSON(inputs.needs-plan-outputs-source-sha) }}
        path: .buildchain/gates/downloaded-executions
        merge-multiple: false
    - name: Aggregate Shifu Gate receipts
      id: aggregate
      continue-on-error: true
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/build/commands/shifu-gate-profile.mjs --mode aggregate'
      env:
        BUILDCHAIN_GATE_MATRIX_PATH: .buildchain/gates/plan/matrix.json
        BUILDCHAIN_GATE_EXECUTION_INPUT: .buildchain/gates/downloaded-executions
        BUILDCHAIN_GATE_AGGREGATE_PATH: .buildchain/gates/gate-aggregate.json
        BUILDCHAIN_GATE_SOURCE_SHA: ${{ fromJSON(inputs.needs-plan-outputs-source-sha) }}
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
      shell: bash -e {0}
    - name: Resolve Gate aggregate artifact name
      id: names
      shell: bash
      run: echo "gate-aggregate-artifact=${ARTIFACT_NAME}-aggregate-${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
      env:
        ARTIFACT_NAME: ${{ fromJSON(inputs.request-json).artifact-name }}
        SOURCE_SHA: ${{ fromJSON(inputs.needs-plan-outputs-source-sha) }}
    - name: Upload Shifu Gate aggregate
      if: ${{ always() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ steps.names.outputs.gate-aggregate-artifact }}
        path: .buildchain/gates/gate-aggregate.json
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
        overwrite: true
    - name: Create Shifu profile envelope controller receipt
      id: controller-receipt
      if: ${{ always() }}
      run: '"$BUILDCHAIN_NODE" .buildchain/runtime/packages/core/observability/commands/controller-evidence.mjs --mode receipt'
      env:
        BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
        BUILDCHAIN_CONTROLLER_STAGES_JSON: '[{"id":"plan","status":"${{ fromJSON(inputs.needs-plan-result) }}"},{"id":"execute","status":"${{ fromJSON(inputs.needs-run-gates-result) }}"},{"id":"aggregate","status":"${{ steps.aggregate.outcome }}"}]'
        BUILDCHAIN_CONTROLLER_EVIDENCE_JSON: ${{ steps.aggregate.outputs.gate-aggregate-digest != '' && format('[{{"kind":"shifu-gate-aggregate","digest":"{0}"}}]', steps.aggregate.outputs.gate-aggregate-digest) || '[]' }}
        BUILDCHAIN_CONTROLLER_REASON_CODE: ${{ steps.aggregate.outcome == 'success' && '' || 'gate-aggregate-incomplete' }}
        BUILDCHAIN_CONTROLLER_REASON_SUMMARY: Shifu Gate aggregate did not qualify
        BUILDCHAIN_CONTROLLER_RECEIPT_ARTIFACT: ${{ fromJSON(inputs.request-json).artifact-name }}-controller-receipt-${{ fromJSON(inputs.needs-plan-outputs-source-sha) }}
        BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json
        BUILDCHAIN_NODE: ${{ steps.core-runtime.outputs.node-path }}
      shell: bash -e {0}
    - name: Resolve Shifu profile envelope controller receipt artifact
      id: controller-names
      if: ${{ always() && steps.controller-receipt.outcome == 'success' }}
      run: echo "controller-receipt-artifact=${ARTIFACT_NAME}-controller-receipt-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
      env:
        ARTIFACT_NAME: ${{ fromJSON(inputs.request-json).artifact-name }}
        SOURCE_SHA: ${{ fromJSON(inputs.needs-plan-outputs-source-sha) }}
      shell: bash -e {0}
    - name: Upload Shifu profile envelope controller receipt
      if: ${{ always() && steps.controller-receipt.outcome == 'success' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ steps.controller-names.outputs.controller-receipt-artifact }}
        path: .buildchain/controller/receipt.json
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
        overwrite: true
    - name: Enforce aggregate qualification
      if: ${{ steps.aggregate.outcome != 'success' || steps.controller-receipt.outputs.controller-receipt-qualifying != 'true' }}
      run: exit 1
      shell: bash -e {0}
