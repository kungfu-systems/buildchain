name: source-proof
description: Locate, download and verify an accepted source proof within the caller check.
inputs:
  request-json:
    description: request-json
    required: true
  runtime-ref:
    description: runtime-ref
    required: true
  identities-json:
    description: identities-json
    required: true
  core-node:
    description: core-node
    required: true
outputs:
  lookup-found:
    description: lookup-found proof result.
    value: ${{ steps.source-proof-lookup.outputs.found }}
  lookup-reason:
    description: lookup-reason proof result.
    value: ${{ steps.source-proof-lookup.outputs.reason }}
  lookup-run-id:
    description: lookup-run-id proof result.
    value: ${{ steps.source-proof-lookup.outputs.run-id }}
  lookup-source-head:
    description: lookup-source-head proof result.
    value: ${{ steps.source-proof-lookup.outputs.source-head }}
  lookup-artifact-name:
    description: lookup-artifact-name proof result.
    value: ${{ steps.source-proof-lookup.outputs.artifact-name }}
  lookup-workflow-path:
    description: lookup-workflow-path proof result.
    value: ${{ steps.source-proof-lookup.outputs.workflow-path }}
  verify-proof-root:
    description: verify-proof-root proof result.
    value: ${{ steps.source-proof-verify.outputs.proof-root }}
  verify-reuse:
    description: verify-reuse proof result.
    value: ${{ steps.source-proof-verify.outputs.reuse }}
  verify-reason:
    description: verify-reason proof result.
    value: ${{ steps.source-proof-verify.outputs.reason }}
  verify-decision-root:
    description: verify-decision-root proof result.
    value: ${{ steps.source-proof-verify.outputs.decision-root }}
runs:
  using: composite
  steps:
    - name: Locate exact accepted pull-request source proof
      id: source-proof-lookup
      if: ${{ fromJSON(inputs.request-json).mode == 'source' && fromJSON(inputs.request-json).source-proof-reuse && github.event_name == 'merge_group' }}
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        BUILDCHAIN_ACTION_ROOT: ${{ github.action_path }}
      with:
        script: |
          const { pathToFileURL } = require("node:url");
          const { lookupSourceProof } = await import(pathToFileURL(`${process.env.BUILDCHAIN_ACTION_ROOT}/../../../packages/core/build/nodes/source-proof-lookup.mjs`).href);
          await lookupSourceProof({ github, context, core });
    - name: Download exact accepted pull-request source proof
      id: source-proof-download
      if: ${{ steps.source-proof-lookup.outputs.found == 'true' }}
      continue-on-error: true
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ steps.source-proof-lookup.outputs.artifact-name }}
        path: .buildchain/source-proof
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ steps.source-proof-lookup.outputs.run-id }}
    - name: Verify exact source proof for this merge group
      id: source-proof-verify
      if: ${{ steps.source-proof-download.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        SOURCE_HEAD: ${{ steps.source-proof-lookup.outputs.source-head }}
        CURRENT_BASE: ${{ github.event.merge_group.base_sha }}
        PROTECTED_BASE: ${{ github.event.merge_group.base_ref }}
        MERGE_GROUP_HEAD: ${{ fromJSON(inputs.identities-json).source-sha }}
        SOURCE_WORKFLOW_RUN_ID: ${{ steps.source-proof-lookup.outputs.run-id }}
        RUNTIME_REF: ${{ inputs.runtime-ref }}
        RUNTIME_SHA: ${{ fromJSON(inputs.identities-json).runtime-sha }}
        CONTRACT_DIGEST: ${{ fromJSON(inputs.identities-json).contract-digest }}
        POLICY_PATHS_JSON: ${{ fromJSON(inputs.request-json).source-proof-policy-paths-json }}
        CLOSURE_PATHS_JSON: ${{ fromJSON(inputs.request-json).source-proof-closure-paths-json }}
        DEPENDENCY_PATHS_JSON: ${{ fromJSON(inputs.request-json).source-proof-dependency-paths-json }}
        REQUIRED_CONTEXTS_JSON: ${{ fromJSON(inputs.request-json).source-proof-required-contexts-json }}
        BUILDCHAIN_CHECK_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE: ${{ inputs.core-node }}
      run: |
        "$BUILDCHAIN_NODE" "$GITHUB_ACTION_PATH/../../../packages/core/build/nodes/source-check.mjs" verify-proof
