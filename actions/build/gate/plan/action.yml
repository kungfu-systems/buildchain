name: gate-profile-plan
description: Execute the gate-profile plan capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  workflow-sha:
    description: workflow sha contract input.
    required: true
outputs:
  trusted:
    description: trusted node result.
    value: ${{ steps.trust.outputs.trusted }}
  source-sha:
    description: source-sha node result.
    value: ${{ steps.plan.outputs.source-sha }}
  buildchain-runtime-ref:
    description: buildchain-runtime-ref node result.
    value: ${{ env.BUILDCHAIN_RUNTIME_REF }}
  buildchain-runtime-sha:
    description: buildchain-runtime-sha node result.
    value: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
  gate-matrix-json:
    description: gate-matrix-json node result.
    value: ${{ steps.plan.outputs.gate-matrix-json }}
  gate-matrix-digest:
    description: gate-matrix-digest node result.
    value: ${{ steps.plan.outputs.gate-matrix-digest }}
  gate-matrix-artifact:
    description: gate-matrix-artifact node result.
    value: ${{ steps.plan.outputs.gate-matrix-artifact }}
  controller-plan-artifact:
    description: controller-plan-artifact node result.
    value: ${{ steps.plan.outputs.controller-plan-artifact }}
  controller-plan-json:
    description: controller-plan-json node result.
    value: ${{ steps.plan.outputs.controller-plan-json }}
  controller-plan-digest:
    description: controller-plan-digest node result.
    value: ${{ steps.plan.outputs.controller-plan-digest }}
runs:
  using: composite
  steps:
    - name: Evaluate event trust
      id: trust
      uses: ./.buildchain/runtime/actions/workflow/event/admit
      with:
        require-trusted: ${{ fromJSON(inputs.request-json).require-trusted-event }}
        head-repository: ${{ github.event.pull_request.head.repo.full_name }}
        untrusted-policy: ${{ fromJSON(inputs.request-json).untrusted-policy }}
    - name: Checkout locked consumer source
      if: ${{ steps.trust.outputs.trusted == 'true' }}
      uses: actions/checkout@v7.0.0
      with:
        ref: ${{ fromJSON(inputs.request-json).source-ref || github.sha }}
        path: source
        clean: true
        persist-credentials: false
    - name: Setup Node.js
      if: ${{ steps.trust.outputs.trusted == 'true' }}
      uses: actions/setup-node@v6.4.0
      with:
        node-version: ${{ fromJSON(inputs.request-json).node-version }}
    - name: Resolve Shifu Gate plans and runner matrix
      id: plan
      if: ${{ steps.trust.outputs.trusted == 'true' }}
      continue-on-error: true
      uses: ./.buildchain/runtime/actions/build/gate/resolve
      with:
        request-json: ${{ inputs.request-json }}
        runtime-ref: ${{ env.BUILDCHAIN_RUNTIME_REF }}
        runtime-sha: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
    - name: Retain admitted controller plan
      if: ${{ always() && steps.plan.outputs.controller-plan-digest != '' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ steps.plan.outputs.controller-plan-artifact }}
        path: .buildchain/controller/plan.json
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
    - name: Upload Gate plans and matrix
      if: ${{ steps.plan.outcome == 'success' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ steps.plan.outputs.gate-matrix-artifact }}
        path: .buildchain/gates/plan
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
    - name: Require complete Gate planning
      if: ${{ steps.plan.outcome == 'failure' }}
      uses: ./.buildchain/runtime/actions/workflow/admission/reject
      with:
        reason: Gate planning did not qualify
