name: gate-profile-run-gates
description: Execute the gate-profile run-gates capability within its caller job boundary.
inputs:
  cache-reference-repository-template:
    description: Workflow checkout reference fallback.
  cache-mirror-url-template:
    description: Workflow checkout mirror fallback.
  request-json:
    description: Typed public workflow request.
    required: true
  matrix-json:
    description: Declared platform matrix value.
    required: true
  runtime-sha:
    description: runtime sha contract input.
    required: true
  source-sha:
    description: source sha contract input.
    required: true
  runtime-ref:
    description: runtime ref contract input.
    required: true
  plan-artifact:
    description: plan artifact contract input.
    required: true
runs:
  using: composite
  steps:
    - name: Checkout locked consumer source
      uses: ./.buildchain/runtime/actions/providers/source/checkout
      with:
        sha: ${{ inputs.source-sha }}
        ref: ${{ fromJSON(inputs.request-json).source-ref || github.ref }}
        cache-mode: ${{ fromJSON(inputs.request-json).checkout-cache-mode }}
        mirror-url-template: ${{
          fromJSON(inputs.request-json).checkout-cache-mirror-url-template ||
          inputs.cache-mirror-url-template }}
        reference-repository-template: ${{
          fromJSON(inputs.request-json).checkout-cache-reference-repository-template
          || inputs.cache-reference-repository-template }}
        fallback: ${{ fromJSON(inputs.request-json).checkout-cache-fallback }}
        cache-timeout-seconds: ${{ fromJSON(inputs.request-json).checkout-cache-timeout-seconds }}
        github-timeout-seconds: ${{
          fromJSON(inputs.request-json).checkout-cache-github-timeout-seconds }}
        fetch-attempts: ${{ fromJSON(inputs.request-json).checkout-cache-fetch-attempts }}
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        reset-working-tree: ${{ runner.os == 'Windows' }}
    - name: Checkout Buildchain runtime
      uses: ./.buildchain/runtime/actions/providers/source/checkout
      with:
        repository: kungfu-systems/buildchain
        sha: ${{ inputs.runtime-sha }}
        ref: ${{ inputs.runtime-ref }}
        directory: .buildchain/runtime
        cache-mode: ${{ fromJSON(inputs.request-json).checkout-cache-mode }}
        mirror-url-template: ${{
          fromJSON(inputs.request-json).checkout-cache-mirror-url-template ||
          inputs.cache-mirror-url-template }}
        reference-repository-template: ${{
          fromJSON(inputs.request-json).checkout-cache-reference-repository-template
          || inputs.cache-reference-repository-template }}
        fallback: ${{ fromJSON(inputs.request-json).checkout-cache-fallback }}
        cache-timeout-seconds: ${{ fromJSON(inputs.request-json).checkout-cache-timeout-seconds }}
        github-timeout-seconds: ${{
          fromJSON(inputs.request-json).checkout-cache-github-timeout-seconds }}
        fetch-attempts: ${{ fromJSON(inputs.request-json).checkout-cache-fetch-attempts }}
        diagnostics-path: .buildchain/diagnostics/runtime-checkout.json
        token: ${{ github.token }}
    - name: Upload locked checkout diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ fromJSON(inputs.request-json).artifact-name }}-checkout-${{
          fromJSON(inputs.matrix-json).gate.id }}-${{ inputs.source-sha }}
        path: .buildchain/diagnostics/*-checkout.json
        if-no-files-found: warn
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
        overwrite: true
    - name: Setup Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: ${{ fromJSON(inputs.request-json).node-version }}
    - name: Expose runner user toolchains
      uses: ./.buildchain/runtime/actions/runtime/toolchain/user-paths
    - name: Setup Rust toolchain on Windows
      if: ${{ contains(fromJSON(inputs.matrix-json).gate.capabilities, 'rust') &&
        runner.os == 'Windows' }}
      uses: ./.buildchain/runtime/actions/runtime/toolchain/windows-rust
      with:
        toolchain: ${{ fromJSON(inputs.request-json).rust-toolchain }}
        dist-server: ${{ fromJSON(inputs.request-json).rustup-dist-server }}
        update-root: ${{ fromJSON(inputs.request-json).rustup-update-root }}
    - name: Setup Rust toolchain
      if: ${{ contains(fromJSON(inputs.matrix-json).gate.capabilities, 'rust') &&
        runner.os != 'Windows' }}
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      env:
        RUSTUP_DIST_SERVER: ${{ fromJSON(inputs.request-json).rustup-dist-server ||
          'https://static.rust-lang.org' }}
        RUSTUP_UPDATE_ROOT: ${{ fromJSON(inputs.request-json).rustup-update-root ||
          'https://static.rust-lang.org/rustup' }}
      with:
        toolchain: ${{ fromJSON(inputs.request-json).rust-toolchain }}
    - name: Download locked Gate plan
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ inputs.plan-artifact }}
        path: .buildchain/gates/plan
    - name: Run and validate Shifu Gate profile
      id: gate
      continue-on-error: true
      uses: ./.buildchain/runtime/actions/build/gate/run-profile
      with:
        request-json: ${{ inputs.request-json }}
        entry-json: ${{ toJSON(fromJSON(inputs.matrix-json).gate) }}
    - name: Upload Shifu Gate receipt
      if: ${{ always() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ fromJSON(inputs.request-json).artifact-name }}-receipt-${{
          fromJSON(inputs.matrix-json).gate.id }}-${{ inputs.source-sha }}
        path: .buildchain/gates/executions/${{ fromJSON(inputs.matrix-json).gate.id }}
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
        overwrite: true
    - name: Enforce Shifu Gate qualification
      if: ${{ steps.gate.outcome != 'success' }}
      uses: ./.buildchain/runtime/actions/workflow/admission/reject
      with:
        reason: Enforce Shifu Gate qualification failed
