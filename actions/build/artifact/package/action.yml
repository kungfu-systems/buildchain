name: package-candidate
description: Execute the fixture buildchain-package-candidate capability within its caller job boundary.
inputs:
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
  passport-artifact:
    description: passport artifact contract input.
    required: true
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/workflow-shell/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
        registry-url: https://registry.npmjs.org/
    - name: Download exact Release Candidate Passport
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ inputs.passport-artifact }}
        path: .buildchain/buildchain-package-candidate/passport
    - uses: ./.buildchain/workflow-shell/actions/runtime/environment/prepare
      with:
        directory: .buildchain/workflow-shell
    - name: Pack Buildchain product bytes once and bind them to the candidate
      id: package
      uses: ./.buildchain/workflow-shell/actions/publication/candidate/package
    - name: Upload sealed Buildchain product payload
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ steps.package.outputs.artifact-name }}
        path: .buildchain/buildchain-package-candidate/payload/
        if-no-files-found: error
        retention-days: 30
