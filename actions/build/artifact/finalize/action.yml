name: finalize-build-result
description: Verify complete platform coverage, final bytes and provider coordinates, then seal the build result.
inputs:
  plan:
    description: Rooted build plan
    required: true
  jobs:
    description: GitHub prerequisite job results
    required: true
  token:
    description: Scoped credential for immutable artifact readback
    required: true
runs:
  using: node24
  main: dist/index.js
outputs:
  result:
    description: Rooted build result
