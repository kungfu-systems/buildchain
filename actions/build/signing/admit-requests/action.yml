name: admit-requests
description:
  Admit sealed signing requests, execute bounded providers and qualify
  immutable result evidence.
inputs:
  request-json:
    description: Explicit request-json.
    required: true
runs:
  using: node24
  main: dist/index.js
outputs:
  detached-matrix:
    description: Admitted detached-matrix.
  macos-matrix:
    description: Admitted macos-matrix.
  windows-matrix:
    description: Admitted windows-matrix.
  request-count:
    description: Admitted request-count.
