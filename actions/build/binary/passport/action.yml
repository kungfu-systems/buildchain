name: binary-distribution-passport
description: Execute the binary-distribution passport capability within its
  caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/workflow-shell/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
        expected-sha: ${{ github.sha }}
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Install dependencies
      uses: ./.buildchain/workflow-shell/actions/runtime/dependencies/install
      with:
        directory: .
        production: "false"
        ignore-scripts: "false"
    - name: Download binary artifacts
      uses: actions/download-artifact@v6.0.0
      with:
        pattern: buildchain-binary-*
        path: dist/binary
        merge-multiple: true
    - name: Qualify immutable binary release evidence
      uses: ./actions/build/binary/qualify
      with:
        tag: ${{ env.RELEASE_TAG }}
        token: ${{ github.token }}
    - name: Upload binary distribution controller receipt
      uses: actions/upload-artifact@v6.0.0
      with:
        name: buildchain-controller-binary-distribution
        path: |
          .buildchain/controller/plan.json
          .buildchain/controller/receipt.json
        if-no-files-found: error
    - name: Upload release passport artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: buildchain-release-passport
        path: .buildchain/release-passport/*
        if-no-files-found: error
