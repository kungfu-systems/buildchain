name: stage-capsule-canary-consumer-admission
description: Execute the stage-capsule-canary consumer-admission capability
  within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  workflow-sha:
    description: workflow sha contract input.
    required: true
outputs:
  receipt-root:
    description: receipt-root node result.
    value: ${{ steps.policy.outputs.v4-consumer-policy-receipt-root }}
  scanner-root:
    description: scanner-root node result.
    value: ${{ steps.policy.outputs.v4-consumer-policy-scanner-root }}
runs:
  using: composite
  steps:
    - name: Checkout exact consumer source
      uses: actions/checkout@v7.0.0
      with:
        path: .buildchain/consumer
        persist-credentials: false
    - name: Enforce v4 floating consumer policy
      id: policy
      uses: ./.buildchain/runtime/actions/consumer/policy/admit
      with:
        directory: .buildchain/consumer
        workflow: .github/workflows/public-build-stage-capsule-canary.yml
        workflow-sha: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
    - name: Upload rooted consumer admission receipt
      uses: actions/upload-artifact@v7.0.1
      with:
        name: v4-consumer-policy-${{ fromJSON(inputs.request-json).consumer }}-${{
          github.sha }}
        path: .buildchain/consumer/.buildchain/evidence/consumer-policy-receipt.json
        if-no-files-found: error
