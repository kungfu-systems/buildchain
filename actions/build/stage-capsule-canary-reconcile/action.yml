name: stage-capsule-canary-reconcile
description: Execute the stage-capsule-canary reconcile capability within its caller job boundary.
inputs:
  job-workflow-sha:
    description: Caller job.workflow_sha value.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
runs:
  using: composite
  steps:
    - name: Resolve exact called-workflow runtime
      id: runtime
      shell: bash
      env:
        BUILDCHAIN_WORKFLOW_SHA: ${{ fromJSON(inputs.job-workflow-sha) }}
      run: |
        if [[ ! "${BUILDCHAIN_WORKFLOW_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::job.workflow_sha is not an exact commit SHA"
          exit 1
        fi
        printf 'sha=%s\n' "$(printf '%s' "${BUILDCHAIN_WORKFLOW_SHA}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"
    - name: Checkout the exact Buildchain workflow runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ steps.runtime.outputs.sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Download exact platform evidence
      uses: actions/download-artifact@v7.0.0
      with:
        pattern: v4-stage-capsule-canary-${{ fromJSON(inputs.request-json).consumer }}-*-${{ github.sha }}
        path: .buildchain/stage-capsule-canary-inputs
    - name: Reconcile the consumer campaign
      env:
        CANARY_CONSUMER: ${{ fromJSON(inputs.request-json).consumer }}
      run: node .buildchain/runtime/packages/core/build/commands/stage-capsule-qualification.mjs aggregate --input-dir .buildchain/stage-capsule-canary-inputs --expected-consumers "${CANARY_CONSUMER}" --output .buildchain/stage-capsule-canary-qualification.json
      shell: bash -e {0}
    - name: Upload qualification and immutable authority contract
      uses: actions/upload-artifact@v7.0.1
      with:
        name: v4-stage-capsule-canary-${{ fromJSON(inputs.request-json).consumer }}-${{ github.sha }}
        path: |
          .buildchain/stage-capsule-canary-qualification.json
          .buildchain/runtime/architecture/stage-capsule-qualification.json
        if-no-files-found: error
