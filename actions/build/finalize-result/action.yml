name: finalize-build-result
description: Verify complete platform coverage, final bytes and provider coordinates, then seal the build result.
inputs:
  plan:
    description: Rooted build plan
    required: true
  jobs:
    description: GitHub prerequisite job results
    required: true
runs:
  using: composite
  steps:
  - name: Validate all results and deliver evidence
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/build/commands/finalize.mjs"
    env:
      BUILDCHAIN_PLAN: ${{ inputs.plan }}
      GITHUB_TOKEN: ${{ github.token }}
      BUILDCHAIN_JOBS: ${{ inputs.jobs }}
    id: final
outputs:
  result:
    description: Rooted build result
    value: ${{ steps.final.outputs.result }}
