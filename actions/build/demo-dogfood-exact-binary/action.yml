name: demo-dogfood-exact-binary
description: Execute the demo-dogfood exact-binary capability within its caller job boundary.
outputs:
  artifact-name:
    description: artifact-name node result.
    value: ${{ steps.identity.outputs.name }}
  artifact-digest:
    description: artifact-digest node result.
    value: ${{ steps.upload.outputs.artifact-digest }}
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: "24"
    - name: Enable pnpm
      shell: bash
      run: |
        corepack prepare pnpm@11.7.0 --activate
        corepack enable
    - name: Install exact dependencies
      run: pnpm install --frozen-lockfile
      shell: bash -e {0}
    - name: Build standalone binary
      run: pnpm binary:build -- --output-dir dist/auditable-demo-binary
      shell: bash -e {0}
    - name: Simulate artifact transport before upload
      run: node packages/core/build/commands/auditable-demo-transport-smoke.mjs --artifact-root dist/auditable-demo-binary --scenario .buildchain/auditable-demo.json
      shell: bash -e {0}
    - name: Bind artifact name
      id: identity
      shell: bash
      run: echo "name=buildchain-auditable-demo-binary-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
    - name: Upload exact binary and metadata
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.identity.outputs.name }}
        path: |
          dist/auditable-demo-binary/buildchain
          dist/auditable-demo-binary/buildchain-x86_64-unknown-linux-gnu.json
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        overwrite: false
inputs:
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
