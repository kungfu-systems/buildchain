name: binary-distribution-binary
description: Execute the binary-distribution binary capability within its caller job boundary.
inputs:
  matrix-json:
    description: Declared platform matrix value.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Resolve exact binary source
      shell: bash
      run: |
        source_sha="$(git rev-parse HEAD)"
        if [[ "$source_sha" != "$GITHUB_SHA" ]]; then
          echo "::error::Dispatch Binary Distribution at the exact release tag so workflow, runtime and source identities agree."
          exit 1
        fi
        echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Enable pnpm
      run: |
        corepack prepare pnpm@11.7.0 --activate
        corepack enable
        pnpm --version
      shell: bash -e {0}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash -e {0}
    - name: Mark binary matrix start
      run: node bin/buildchain.mjs mark --event binary.matrix.start --phase setup --component workflow --source buildchain --attribute platform=${{ fromJSON(inputs.matrix-json).platform }} --attribute runner=${{ fromJSON(inputs.matrix-json).os }}
      shell: bash -e {0}
    - name: Build standalone binary archive
      run: node bin/buildchain.mjs span --event binary.standalone-build --phase binary --component workflow --source buildchain --attribute platform=${{ fromJSON(inputs.matrix-json).platform }} -- node scripts/build-standalone-binary.mjs --version "${{ env.RELEASE_TAG }}" --output-dir dist/binary
      shell: bash -e {0}
    - name: Summarize binary observability
      shell: bash
      run: |
        node bin/buildchain.mjs mark --event binary.matrix.complete --phase evidence --component workflow --source buildchain --attribute platform=${{ fromJSON(inputs.matrix-json).platform }}
        node bin/buildchain.mjs verify observability-log "${BUILDCHAIN_LOG_PATH}" --min-events 8 --require-phase setup --require-phase binary --require-phase prepare --require-phase package --require-phase archive --require-phase evidence --require-component workflow --require-component standalone-binary --require-event binary.matrix.start --require-event binary.matrix.complete --require-event standalone.build.complete
        node bin/buildchain.mjs log summary --path "${BUILDCHAIN_LOG_PATH}" --json > "dist/binary/buildchain-log-summary-${BUILDCHAIN_PLATFORM}.json"
        node -e "import fs from 'node:fs'; fs.copyFileSync(process.env.BUILDCHAIN_LOG_PATH, 'dist/binary/buildchain-log-events-' + process.env.BUILDCHAIN_PLATFORM + '.jsonl');"
    - name: Upload binary artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: buildchain-binary-${{ fromJSON(inputs.matrix-json).platform }}
        path: |
          dist/binary/*
          !dist/binary/buildchain
          !dist/binary/buildchain.exe
        if-no-files-found: error
