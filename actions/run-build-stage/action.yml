name: run-build-stage
description: Execute one ordered TOML lifecycle stage and retain its actual result.
inputs:
  plan:
    description: Rooted build plan
    required: true
  platform:
    description: Selected platform
    required: true
  stage:
    description: install, build or verify
    required: true
runs:
  using: composite
  steps:
  - name: Run configured stage
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../scripts/build/stage.mjs"
    env:
      BUILDCHAIN_PLAN: ${{ inputs.plan }}
      GITHUB_TOKEN: ${{ github.token }}
      BUILDCHAIN_PLATFORM: ${{ inputs.platform }}
      BUILDCHAIN_STAGE: ${{ inputs.stage }}
