name: line-open-bootstrap
description: Execute the line-open bootstrap capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash -e {0}
    - name: Prepare defining workflow runtime
      uses: ./.buildchain/runtime/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Plan release line
      id: plan
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/line-open.mjs" plan
    - name: Summarize dry run
      if: ${{ fromJSON(inputs.request-json).apply != true }}
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/line-open.mjs" summary
    - name: Write initial version state
      if: ${{ fromJSON(inputs.request-json).apply == true }}
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/line-open.mjs" write
    - name: Commit and push release line refs
      if: ${{ fromJSON(inputs.request-json).apply == true }}
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/line-open.mjs" push
    - name: Protect release line branches
      if: ${{ fromJSON(inputs.request-json).apply == true }}
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/line-open.mjs" protect
    - name: Reconcile dev merge queue governance
      if: ${{ fromJSON(inputs.request-json).apply == true }}
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/line-open.mjs" queue
    - name: Set default branch
      if: ${{ fromJSON(inputs.request-json).apply == true && fromJSON(inputs.request-json).set-default-branch == true }}
      run: |
        node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/line-open.mjs" default
      shell: bash -e {0}
    - name: Open alpha channel PR
      if: ${{ fromJSON(inputs.request-json).apply == true && fromJSON(inputs.request-json).create-alpha-pr == true }}
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/line-open.mjs" alpha-pr
