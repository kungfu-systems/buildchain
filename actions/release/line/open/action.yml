name: line-open-bootstrap
description: Execute the line-open bootstrap capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
  token:
    description: Scoped release line governance credential; required only when applying.
  workflow-sha:
    description: Exact defining workflow commit.
    required: true
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/runtime/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: pnpm
    - name: Install source dependencies
      uses: ./.buildchain/runtime/actions/runtime/dependencies/install
      with:
        directory: .
        production: "false"
        ignore-scripts: "false"
    - name: Bootstrap release line
      uses: ./.buildchain/runtime/actions/release/line/bootstrap
      with:
        request-json: ${{ inputs.request-json }}
        token: ${{ inputs.token }}
        workflow-sha: ${{ inputs.workflow-sha }}
