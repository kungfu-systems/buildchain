name: Verify release lineage
description: Verify the source version and exact head/base release-line relationship.
runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        path: .buildchain/channel-source
        persist-credentials: false
    - name: Prepare Node
      uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Verify exact release lineage
      uses: ./.buildchain/runtime/actions/release/line/inspect
      with:
        directory: .buildchain/channel-source
