name: tail-reseal-plan
description: Execute the tail-reseal plan capability within its caller job boundary.
inputs:
  job-workflow-sha:
    description: Caller job.workflow_sha value.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-buildchain-evidence-read-token:
    description: Explicit scoped provider credential.
    required: true
outputs:
  request-artifact:
    description: request-artifact node result.
    value: ${{ steps.names.outputs.request-artifact }}
  platforms-json:
    description: platforms-json node result.
    value: ${{ steps.plan.outputs.platforms-json }}
  source-run-id:
    description: source-run-id node result.
    value: ${{ steps.plan.outputs.source-run-id }}
  source-run-attempt:
    description: source-run-attempt node result.
    value: ${{ steps.plan.outputs.source-run-attempt }}
  source-sha:
    description: source-sha node result.
    value: ${{ steps.plan.outputs.source-sha }}
  source-tree-sha:
    description: source-tree-sha node result.
    value: ${{ steps.plan.outputs.source-tree-sha }}
  runtime-sha:
    description: runtime-sha node result.
    value: ${{ steps.plan.outputs.runtime-sha }}
  consumer-policy-receipt-root:
    description: consumer-policy-receipt-root node result.
    value: ${{ steps.plan.outputs.consumer-policy-receipt-root }}
  warrant-readback-root:
    description: warrant-readback-root node result.
    value: ${{ steps.plan.outputs.warrant-readback-root }}
  signing-provider-readback-root:
    description: signing-provider-readback-root node result.
    value: ${{ steps.plan.outputs.signing-provider-readback-root }}
  release-tail-provider-readback-root:
    description: release-tail-provider-readback-root node result.
    value: ${{ steps.plan.outputs.release-tail-provider-readback-root }}
  signing-authority-repository:
    description: signing-authority-repository node result.
    value: ${{ steps.plan.outputs.signing-authority-repository }}
  signing-authority-run-id:
    description: signing-authority-run-id node result.
    value: ${{ steps.plan.outputs.signing-authority-run-id }}
  signing-result-artifact:
    description: signing-result-artifact node result.
    value: ${{ steps.plan.outputs.signing-result-artifact }}
  target-version:
    description: target-version node result.
    value: ${{ steps.plan.outputs.target-version }}
  plan-root:
    description: plan-root node result.
    value: ${{ steps.plan.outputs.plan-root }}
  admission-root:
    description: admission-root node result.
    value: ${{ steps.admit.outputs.admission-root }}
runs:
  using: composite
  steps:
  - name: Resolve exact called-workflow runtime
    id: runtime
    shell: bash
    env:
      BUILDCHAIN_WORKFLOW_SHA: ${{ fromJSON(inputs.job-workflow-sha) }}
    run: "set -euo pipefail\nif [[ ! \"${BUILDCHAIN_WORKFLOW_SHA}\" =~ ^[0-9a-fA-F]{40}$ ]]; then\n  echo \"::error::job.workflow_sha is not an exact commit SHA\"\n  exit 1\nfi\nprintf 'sha=%s\\n' \"$(printf '%s' \"${BUILDCHAIN_WORKFLOW_SHA}\" | tr '[:upper:]' '[:lower:]')\" >> \"${GITHUB_OUTPUT}\"\n"
  - name: Checkout exact Buildchain tail runtime
    uses: actions/checkout@v7.0.0
    with:
      repository: kungfu-systems/buildchain
      ref: ${{ steps.runtime.outputs.sha }}
      path: .buildchain/runtime
      persist-credentials: false
  - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    with:
      directory: .buildchain/runtime
  - name: Materialize data-only recovery inputs
    env:
      BUILDCHAIN_TAIL_RESEAL_REQUEST_JSON: ${{ fromJSON(inputs.request-json).request-json }}
      BUILDCHAIN_CONSUMER_POLICY_RECEIPT_JSON: ${{ fromJSON(inputs.request-json).consumer-policy-receipt-json }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/tail-reseal.mjs" materialize
    shell: bash -e {0}
  - name: Plan effect-pure reuse and explicit macOS tail
    id: plan
    run: node .buildchain/runtime/bin/buildchain.mjs tail-reseal plan --request .buildchain/tail-reseal/request.json --output .buildchain/tail-reseal/plan.json
    shell: bash -e {0}
  - name: Verify runtime, source event, and original consumer policy bindings
    env:
      BUILDCHAIN_RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
      BUILDCHAIN_SOURCE_SHA: ${{ github.sha }}
      BUILDCHAIN_POLICY_ROOT: ${{ steps.plan.outputs.consumer-policy-receipt-root }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/tail-reseal.mjs" policy
    shell: bash -e {0}
  - name: Read back failed run, retained archives, and signing authority
    id: admit
    env:
      GITHUB_TOKEN: ${{ inputs.secrets-buildchain-evidence-read-token }}
    run: node .buildchain/runtime/bin/buildchain.mjs tail-reseal admit --request .buildchain/tail-reseal/request.json --output .buildchain/tail-reseal/admission.json
    shell: bash -e {0}
  - name: Name retained request evidence
    id: names
    env:
      SOURCE_SHA: ${{ steps.plan.outputs.source-sha }}
    run: echo "request-artifact=v4-tail-reseal-request-${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
    shell: bash -e {0}
  - name: Upload exact request, policy, admission, and plan
    uses: actions/upload-artifact@v7.0.1
    with:
      name: ${{ steps.names.outputs.request-artifact }}
      path: .buildchain/tail-reseal/*.json
      if-no-files-found: error
      retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
