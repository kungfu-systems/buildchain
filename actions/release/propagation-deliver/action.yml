name: propagation-deliver
description: propagation deliver.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-propagation-token:
    description: Explicit scoped provider credential.
    required: true
  propagation-work-outputs-execute:
    description: Exact preceding propagation node result.
    required: true
  plan-outputs-branch:
    description: Exact preceding propagation node result.
    required: true
  plan-outputs:
    description: Exact preceding propagation node result.
    required: true
  branch-outputs:
    description: Exact preceding propagation node result.
    required: true
  lock-outputs:
    description: Exact preceding propagation node result.
    required: true
  core-node-outputs-node-path:
    description: Exact preceding propagation node result.
    required: true
  plan-outputs-lock_path:
    description: Exact preceding propagation node result.
    required: true
  plan-outcome:
    description: Exact preceding propagation node result.
    required: true
  lock-outcome:
    description: Exact preceding propagation node result.
    required: true
  propagation-work-outcome:
    description: Exact preceding propagation node result.
    required: true
  plan-outputs-propagation_key:
    description: Exact preceding propagation node result.
    required: true
  controller-plan-outcome:
    description: Exact preceding propagation node result.
    required: true
  runtime-outcome:
    description: Exact preceding propagation node result.
    required: true
  controller-identities-outcome:
    description: Exact preceding propagation node result.
    required: true
  downstream-update-outcome:
    description: Exact preceding propagation node result.
    required: true
  prepare-outcome:
    description: Exact preceding propagation node result.
    required: true
  badges-outcome:
    description: Exact preceding propagation node result.
    required: true
  verify-outcome:
    description: Exact preceding propagation node result.
    required: true
  summarize-outcome:
    description: Exact preceding propagation node result.
    required: true
  predecessors-ok:
    description: Both planning and materialization succeeded.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful predecessor nodes
      if: ${{ inputs.predecessors-ok != 'true' }}
      shell: bash
      run: |
        exit 1
    - name: Prepare propagation PR outcome
      if: ${{ inputs.propagation-work-outputs-execute == 'true' }}
      shell: bash
      env:
        BRANCH: ${{ inputs.plan-outputs-branch }}
        BUILDCHAIN_PROPAGATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_PROPAGATION_PLAN_JSON: ${{ toJSON(fromJSON(inputs.plan-outputs)) }}
        BUILDCHAIN_PROPAGATION_BRANCH_JSON: ${{ toJSON(fromJSON(inputs.branch-outputs)) }}
        BUILDCHAIN_PROPAGATION_LOCK_JSON: ${{ toJSON(fromJSON(inputs.lock-outputs)) }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.core-node-outputs-node-path }}
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/release/nodes/propagation.mjs" pr-outcome
    - name: Create or update downstream PR
      id: open-pr
      if: ${{ (inputs.propagation-work-outputs-execute == 'true') && !fromJSON(inputs.request-json).dry-run }}
      shell: bash
      working-directory: downstream
      env:
        GH_TOKEN: ${{ inputs.secrets-propagation-token || github.token }}
        BRANCH: ${{ inputs.plan-outputs-branch }}
        BASE: ${{ fromJSON(inputs.request-json).downstream-base-ref }}
        TITLE: ${{ fromJSON(inputs.request-json).pr-title }}
        BODY: ${{ fromJSON(inputs.request-json).pr-body }}
        PLAN_PATH: ../.buildchain/release-propagation/plan.json
        LOCK_PATH: ${{ inputs.plan-outputs-lock_path }}
        BUILDCHAIN_PROPAGATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_PROPAGATION_PLAN_JSON: ${{ toJSON(fromJSON(inputs.plan-outputs)) }}
        BUILDCHAIN_PROPAGATION_BRANCH_JSON: ${{ toJSON(fromJSON(inputs.branch-outputs)) }}
        BUILDCHAIN_PROPAGATION_LOCK_JSON: ${{ toJSON(fromJSON(inputs.lock-outputs)) }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.core-node-outputs-node-path }}
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/release/nodes/propagation.mjs" open-pr
    - name: Create exact propagation receipt
      id: propagation-receipt
      if: ${{ always() && (inputs.propagation-work-outputs-execute == 'true') && inputs.plan-outcome == 'success' && inputs.lock-outcome == 'success' && (fromJSON(inputs.request-json).dry-run || steps.open-pr.outcome == 'success') }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/release/nodes/propagation.mjs" receipt
      env:
        BUILDCHAIN_PROPAGATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_PROPAGATION_PLAN_JSON: ${{ toJSON(fromJSON(inputs.plan-outputs)) }}
        BUILDCHAIN_PROPAGATION_BRANCH_JSON: ${{ toJSON(fromJSON(inputs.branch-outputs)) }}
        BUILDCHAIN_PROPAGATION_LOCK_JSON: ${{ toJSON(fromJSON(inputs.lock-outputs)) }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.core-node-outputs-node-path }}
    - name: Record pushed branch and pull request
      if: ${{ inputs.propagation-work-outputs-execute == 'true' && !fromJSON(inputs.request-json).dry-run && steps.open-pr.outcome == 'success' }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/release/nodes/propagation.mjs" record-delivery
      env:
        BUILDCHAIN_PROPAGATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_PROPAGATION_PLAN_JSON: ${{ toJSON(fromJSON(inputs.plan-outputs)) }}
        BUILDCHAIN_PROPAGATION_BRANCH_JSON: ${{ toJSON(fromJSON(inputs.branch-outputs)) }}
        BUILDCHAIN_PROPAGATION_LOCK_JSON: ${{ toJSON(fromJSON(inputs.lock-outputs)) }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.core-node-outputs-node-path }}
    - name: Expose agent-native propagation work
      id: propagation-work-output
      if: ${{ always() && inputs.propagation-work-outcome == 'success' }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/release/nodes/propagation.mjs" work-output
      env:
        BUILDCHAIN_PROPAGATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_PROPAGATION_PLAN_JSON: ${{ toJSON(fromJSON(inputs.plan-outputs)) }}
        BUILDCHAIN_PROPAGATION_BRANCH_JSON: ${{ toJSON(fromJSON(inputs.branch-outputs)) }}
        BUILDCHAIN_PROPAGATION_LOCK_JSON: ${{ toJSON(fromJSON(inputs.lock-outputs)) }}
        BUILDCHAIN_NODE_PATH: ${{ inputs.core-node-outputs-node-path }}
    - name: Upload agent-native propagation work
      if: ${{ always() && inputs.propagation-work-outcome == 'success' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-release-propagation-work-${{ inputs.plan-outputs-propagation_key }}
        path: |
          .buildchain/release-propagation/work.json
          .buildchain/release-propagation/work-status.json
          .buildchain/release-propagation/stage-receipt.json
        if-no-files-found: error
    - name: Upload propagation plan
      id: propagation-upload
      uses: actions/upload-artifact@v4
      with:
        name: buildchain-release-propagation-plan
        path: .buildchain/release-propagation/*
    - name: Create release-propagation controller receipt
      id: controller-receipt
      if: ${{ always() && inputs.controller-plan-outcome == 'success' }}
      run: '"$BUILDCHAIN_NODE_PATH" .buildchain/runtime/packages/core/observability/commands/controller-evidence.mjs --mode receipt'
      env:
        BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
        BUILDCHAIN_CONTROLLER_STAGES_JSON: "[{\"id\":\"resolve-runtime\",\"status\":\"${{ inputs.runtime-outcome == 'success' && inputs.controller-identities-outcome == 'success' && 'success' || inputs.runtime-outcome == 'failure' && 'failure' || inputs.controller-identities-outcome }}\"},{\"id\":\"plan\",\"status\":\"${{ inputs.plan-outcome }}\"},{\"id\":\"emit-work\",\"status\":\"${{ inputs.propagation-work-outcome }}\"},{\"id\":\"write-lock\",\"status\":\"${{ inputs.lock-outcome }}\"},{\"id\":\"prepare-consumer\",\"status\":\"${{ (inputs.downstream-update-outcome == 'failure' || inputs.prepare-outcome == 'failure') && 'failure' || (inputs.downstream-update-outcome == 'success' || inputs.prepare-outcome == 'success') && 'success' || 'skipped' }}\"},{\"id\":\"refresh-badges\",\"status\":\"${{ inputs.badges-outcome }}\"},{\"id\":\"verify-consumer\",\"status\":\"${{ inputs.verify-outcome }}\"},{\"id\":\"open-pr\",\"status\":\"${{ steps.open-pr.outcome }}\"},{\"id\":\"aggregate\",\"status\":\"${{ (inputs.summarize-outcome == 'failure' || steps.propagation-receipt.outcome == 'failure' || steps.propagation-upload.outcome == 'failure') && 'failure' || (inputs.summarize-outcome == 'success' && steps.propagation-receipt.outcome == 'success' && steps.propagation-upload.outcome == 'success') && 'success' || 'skipped' }}\"}]"
        BUILDCHAIN_CONTROLLER_EVIDENCE_FILES_JSON: ${{ inputs.plan-outcome == 'success' && inputs.lock-outcome == 'success' && inputs.downstream-update-outcome != 'failure' && inputs.prepare-outcome != 'failure' && inputs.badges-outcome != 'failure' && inputs.verify-outcome != 'failure' && steps.propagation-receipt.outcome == 'success' && !fromJSON(inputs.request-json).dry-run && '[{"kind":"propagation-plan","path":".buildchain/release-propagation/plan.json"},{"kind":"propagation-lock","path":".buildchain/release-propagation/write-lock.json"},{"kind":"propagation-branch-reconciliation","path":".buildchain/release-propagation/branch-reconciliation.json"}]' || inputs.plan-outcome == 'success' && inputs.lock-outcome == 'success' && inputs.downstream-update-outcome != 'failure' && inputs.prepare-outcome != 'failure' && inputs.badges-outcome != 'failure' && inputs.verify-outcome != 'failure' && steps.propagation-receipt.outcome == 'success' && '[{"kind":"propagation-plan","path":".buildchain/release-propagation/plan.json"},{"kind":"propagation-lock","path":".buildchain/release-propagation/write-lock.json"}]' || '[]' }}
        BUILDCHAIN_CONTROLLER_REASON_CODE: ${{ inputs.plan-outcome == 'success' && inputs.lock-outcome == 'success' && inputs.downstream-update-outcome != 'failure' && inputs.prepare-outcome != 'failure' && inputs.badges-outcome != 'failure' && inputs.verify-outcome != 'failure' && steps.propagation-receipt.outcome == 'success' && '' || 'propagation-incomplete' }}
        BUILDCHAIN_CONTROLLER_REASON_SUMMARY: Release propagation did not complete successfully
        BUILDCHAIN_CONTROLLER_RECEIPT_ARTIFACT: buildchain-release-propagation-controller-receipt-${{ github.sha }}
        BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json
        BUILDCHAIN_NODE_PATH: ${{ inputs.core-node-outputs-node-path }}
      shell: bash -e {0}
    - name: Upload release-propagation controller receipt
      if: ${{ always() && steps.controller-receipt.outcome == 'success' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-release-propagation-controller-receipt-${{ github.sha }}
        path: .buildchain/controller/receipt.json
        if-no-files-found: error
    - name: Enforce qualifying release-propagation controller receipt
      if: ${{ always() && !(inputs.propagation-work-outcome == 'success' && inputs.propagation-work-outputs-execute != 'true') && inputs.controller-plan-outcome == 'success' && steps.controller-receipt.outputs.controller-receipt-qualifying != 'true' }}
      run: |
        echo "::error::release-propagation controller receipt is not qualifying: $BUILDCHAIN_RECEIPT_STATUS"
        exit 1
      shell: bash -e {0}
      env:
        BUILDCHAIN_NODE_PATH: ${{ inputs.core-node-outputs-node-path }}
        BUILDCHAIN_RECEIPT_STATUS: ${{ steps.controller-receipt.outputs.controller-receipt-status }}
outputs:
  controller-plan-artifact:
    description: controller-plan-artifact node result.
    value: buildchain-release-propagation-controller-plan-${{ github.sha }}
  controller-receipt-artifact:
    description: controller-receipt-artifact node result.
    value: buildchain-release-propagation-controller-receipt-${{ github.sha }}
  controller-receipt-json:
    description: controller-receipt-json node result.
    value: ${{ steps.controller-receipt.outputs.controller-receipt-json }}
  controller-receipt-digest:
    description: controller-receipt-digest node result.
    value: ${{ steps.controller-receipt.outputs.controller-receipt-digest }}
  controller-receipt-status:
    description: controller-receipt-status node result.
    value: ${{ steps.controller-receipt.outputs.controller-receipt-status }}
  propagation-receipt-json:
    description: propagation-receipt-json node result.
    value: ${{ steps.propagation-receipt.outputs.receipt-json }}
  propagation-receipt-digest:
    description: propagation-receipt-digest node result.
    value: ${{ steps.propagation-receipt.outputs.receipt-digest }}
  propagation-work-json:
    description: propagation-work-json node result.
    value: ${{ steps.propagation-work-output.outputs.work-json }}
  propagation-work-root:
    description: propagation-work-root node result.
    value: ${{ steps.propagation-work-output.outputs.work-root }}
  propagation-work-next-action:
    description: propagation-work-next-action node result.
    value: ${{ steps.propagation-work-output.outputs.next-action }}
