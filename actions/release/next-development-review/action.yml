name: next-development-review
description: Execute the next-development review capability within its caller job boundary.
inputs:
  secrets-buildchain-approval-token:
    description: Explicit scoped provider credential.
    required: true
  secrets-buildchain-promotion-token:
    description: Explicit scoped provider credential.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Install protected verification dependencies without lifecycle scripts
      run: corepack pnpm@11.7.0 install --prod --frozen-lockfile --ignore-scripts
      shell: bash -e {0}
    - name: Regenerate exact version delta and verify completed publication
      env:
        GH_TOKEN: ${{ github.token }}
      run: node packages/core/release/commands/next-development-review.mjs verify
      shell: bash -e {0}
    - name: Approve only the independently verified exact head
      env:
        GH_TOKEN: ${{ github.token }}
        BUILDCHAIN_APPROVAL_TOKEN: ${{ inputs.secrets-buildchain-approval-token }}
      run: node packages/core/release/commands/next-development-review.mjs approve
      shell: bash -e {0}
    - name: Retain exact-head review readback
      uses: actions/upload-artifact@v7.0.1
      with:
        name: next-development-review-${{ github.event.workflow_run.id }}
        path: .buildchain/next-development-review.json
        include-hidden-files: true
        if-no-files-found: error
    - name: Enqueue the reviewed exact head through protected merge queue
      env:
        GH_TOKEN: ${{ inputs.secrets-buildchain-promotion-token }}
      run: node packages/core/release/commands/next-development-review.mjs enqueue
      shell: bash -e {0}
