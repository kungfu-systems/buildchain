name: stable-candidate-qualification-qualify
description: Execute the stable-candidate-qualification qualify capability
  within its caller job boundary.
inputs:
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
  run-id:
    description: Exact completed public build run.
    required: true
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/runtime/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Resolve exact successful public build run
      id: source
      uses: ./.buildchain/runtime/actions/release/candidate/resolve-public-build
      with:
        run-id: ${{ inputs.run-id }}
        token: ${{ github.token }}
    - name: Download exact public build summary
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ steps.source.outputs.artifact-name }}
        path: .buildchain/qualification/source
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.run-id }}
    - name: Qualify observed alpha runtime and three-platform artifacts
      uses: ./.buildchain/runtime/actions/release/candidate/qualify-public-build
      with:
        run-id: ${{ inputs.run-id }}
        token: ${{ github.token }}
    - name: Retain public build qualification
      uses: actions/upload-artifact@v7.0.0
      with:
        name: buildchain-public-build-qualification-${{ inputs.run-id }}
        path: .buildchain/qualification/result.json
        if-no-files-found: error
