name: promote-qualify
description: Execute the promote qualify capability within its caller job boundary.
inputs:
  runtime-ref:
    description: Selected runtime ref with the caller precedence preserved.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  job-workflow-sha:
    description: Caller job.workflow_sha value.
    required: true
outputs:
  action:
    description: action node result.
    value: ${{ steps.intent.outputs.action }}
  reason:
    description: reason node result.
    value: ${{ steps.intent.outputs.reason }}
  channel:
    description: channel node result.
    value: ${{ steps.intent.outputs.channel }}
  target-ref:
    description: target-ref node result.
    value: ${{ steps.intent.outputs.target-ref }}
  requested-sha:
    description: requested-sha node result.
    value: ${{ steps.intent.outputs.requested-sha }}
  current-sha:
    description: current-sha node result.
    value: ${{ steps.intent.outputs.current-sha }}
  runtime-sha:
    description: runtime-sha node result.
    value: ${{ steps.runtime.outputs.sha }}
  runtime-tree:
    description: runtime-tree node result.
    value: ${{ steps.runtime.outputs.tree }}
  publisher-sha:
    description: publisher-sha node result.
    value: ${{ steps.runtime.outputs.publisher-sha }}
  version:
    description: version node result.
    value: ${{ steps.publication.outputs.version }}
  exact-tag:
    description: exact-tag node result.
    value: ${{ steps.publication.outputs.exact-tag }}
  candidate-version:
    description: candidate-version node result.
    value: ${{ steps.candidate.outputs.release-candidate-version }}
  product-publication-intent-path:
    description: product-publication-intent-path node result.
    value: ${{ steps.publication.outputs.intent-path }}
  product-publication-intent-root:
    description: product-publication-intent-root node result.
    value: ${{ steps.publication.outputs.intent-root }}
  candidate-source-sha:
    description: candidate-source-sha node result.
    value: ${{ steps.candidate.outputs.release-candidate-source-sha }}
  candidate-artifact:
    description: candidate-artifact node result.
    value: ${{ steps.candidate.outputs.release-candidate-artifact }}
  candidate-passport-path:
    description: candidate-passport-path node result.
    value: ${{ steps.candidate.outputs.release-candidate-passport-path }}
  candidate-build-summary-path:
    description: candidate-build-summary-path node result.
    value: ${{ steps.candidate.outputs.release-candidate-build-summary-path }}
  stage-capsules-path:
    description: stage-capsules-path node result.
    value: ${{ steps.candidate.outputs.release-candidate-stage-capsules-path }}
  publication-qualification-path:
    description: publication-qualification-path node result.
    value: ${{ steps.candidate.outputs.release-candidate-publication-qualification-path }}
  sealed-bundle-root:
    description: sealed-bundle-root node result.
    value: ${{ steps.candidate.outputs.publish-sealed-bundle-root }}
  sealed-bundle-manifest:
    description: sealed-bundle-manifest node result.
    value: ${{ steps.candidate.outputs.publish-sealed-bundle-manifest }}
  required-artifacts-path:
    description: required-artifacts-path node result.
    value: ${{ steps.candidate.outputs.publish-required-artifacts-path }}
  release-artifact-paths:
    description: release-artifact-paths node result.
    value: ${{ steps.candidate.outputs.release-candidate-github-release-artifact-paths }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Validate the complete invocation before runtime checkout
      shell: bash
      env:
        BUILDCHAIN_PROMOTION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_WORKFLOW_SHA_JSON: ${{ inputs.job-workflow-sha }}
      run: node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/promotion-invocation.mjs" verify
    - name: Checkout the selected runtime for read-only qualification
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ inputs.runtime-repository }}
        ref: ${{ inputs.runtime-ref }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Root publisher and runtime identities
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        sha="$(git -C .buildchain/runtime rev-parse HEAD)"
        tree="$(git -C .buildchain/runtime rev-parse 'HEAD^{tree}')"
        [[ "$sha" =~ ^[0-9a-f]{40}$ && "$tree" =~ ^[0-9a-f]{40}$ ]]
        {
          echo "sha=${sha}"
          echo "tree=${tree}"
          echo "publisher-sha=${{ fromJSON(inputs.job-workflow-sha) }}"
        } >> "$GITHUB_OUTPUT"
    - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Revalidate queued source intent
      id: intent
      uses: actions/github-script@v8
      env:
        INPUT_CHANNEL: ${{ fromJSON(inputs.request-json).channel }}
        INPUT_TARGET_REF: ${{ fromJSON(inputs.request-json).target-ref }}
        INPUT_TARGET_SHA: ${{ fromJSON(inputs.request-json).target-sha }}
        INPUT_DRY_RUN: ${{ fromJSON(inputs.request-json).dry-run }}
        INPUT_RESUME: ${{ fromJSON(inputs.request-json).resume-candidate-run-id != '' || fromJSON(inputs.request-json).publish-transaction-override }}
        BUILDCHAIN_RUNTIME_ROOT: ${{ github.workspace }}/.buildchain/runtime
        BUILDCHAIN_ACTION_ROOT: ${{ github.action_path }}
      with:
        script: |
          const { pathToFileURL } = require('node:url');
          const { run } = await import(pathToFileURL(process.env.BUILDCHAIN_ACTION_ROOT + '/../../../packages/core/release/nodes/promotion-intent.mjs').href);
          await run({ github, context, core });
    - name: Admit the declared publication contract
      if: ${{ steps.intent.outputs.action == 'promote' }}
      env:
        BUILDCHAIN_PROMOTION_INPUTS_JSON: ${{ toJSON(fromJSON(inputs.request-json)) }}
      run: node .buildchain/runtime/packages/core/release/commands/declarative-promotion-admission.mjs
      shell: bash -e {0}
    - name: Resolve and qualify the sealed release candidate
      if: ${{ steps.intent.outputs.action == 'promote' }}
      id: candidate
      shell: bash
      run: node .buildchain/runtime/packages/core/release/commands/release-candidate-adapter.mjs
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BUILDCHAIN_SOURCE_REPOSITORY: ${{ github.repository }}
        BUILDCHAIN_TARGET_SHA: ${{ steps.intent.outputs.requested-sha }}
        BUILDCHAIN_TARGET_REF: ${{ steps.intent.outputs.target-ref }}
        BUILDCHAIN_ARTIFACT_NAME: ${{ fromJSON(inputs.request-json).artifact-name }}
        BUILDCHAIN_ARTIFACT_PATTERNS: ${{ fromJSON(inputs.request-json).artifact-patterns }}
        BUILDCHAIN_GITHUB_RELEASE_PAYLOAD_PATTERNS: ${{ fromJSON(inputs.request-json).github-release-payload-patterns }}
        BUILDCHAIN_RC_WORKFLOW_FILE: ${{ fromJSON(inputs.request-json).release-candidate-workflow-file }}
        BUILDCHAIN_RC_WORKFLOW_NAME: ${{ fromJSON(inputs.request-json).release-candidate-workflow-name }}
        BUILDCHAIN_RC_WAIT_SECONDS: ${{ fromJSON(inputs.request-json).release-candidate-wait-seconds }}
        BUILDCHAIN_REQUIRED_ARTIFACT_COUNT: ${{ fromJSON(inputs.request-json).required-artifact-count }}
        BUILDCHAIN_PUBLISH_ARTIFACT_KIND: ${{ fromJSON(inputs.request-json).publish-artifact-kind }}
        BUILDCHAIN_PUBLISH_PACKAGE_MAIN: ${{ fromJSON(inputs.request-json).publish-package-main }}
        BUILDCHAIN_RC_DOWNLOAD: "true"
        BUILDCHAIN_RC_OUTPUT_DIR: .buildchain/release-candidate
        BUILDCHAIN_RESUME_CANDIDATE_REPOSITORY: ${{ fromJSON(inputs.request-json).resume-candidate-repository }}
        BUILDCHAIN_RESUME_CANDIDATE_RUN_ID: ${{ fromJSON(inputs.request-json).resume-candidate-run-id }}
        BUILDCHAIN_RESUME_EXPECTED_WORKFLOW_FILE: ${{ fromJSON(inputs.request-json).resume-expected-workflow-file || fromJSON(inputs.request-json).release-candidate-workflow-file }}
        BUILDCHAIN_RESUME_EXPECTED_WORKFLOW_NAME: ${{ fromJSON(inputs.request-json).resume-expected-workflow-name || fromJSON(inputs.request-json).release-candidate-workflow-name }}
        BUILDCHAIN_RESUME_CHANNEL: ${{ fromJSON(inputs.request-json).promotion-publication-channel || steps.intent.outputs.channel }}
        BUILDCHAIN_RESUME_TARGET_REF: ${{ steps.intent.outputs.target-ref }}
        BUILDCHAIN_RESUME_TARGET_SHA: ${{ steps.intent.outputs.requested-sha }}
        BUILDCHAIN_RESUME_EXPECTED_SOURCE_TREE: ${{ fromJSON(inputs.request-json).resume-expected-source-tree }}
        BUILDCHAIN_RESUME_EXPECTED_CANDIDATE_ROOT: ${{ fromJSON(inputs.request-json).resume-expected-candidate-root }}
        BUILDCHAIN_RESUME_EXPECTED_CANDIDATE_RUNTIME_SHA: ${{ fromJSON(inputs.request-json).resume-expected-candidate-runtime-sha }}
        BUILDCHAIN_RESUME_RUNTIME_SHA: ${{ fromJSON(inputs.request-json).resume-buildchain-runtime-sha }}
        BUILDCHAIN_CURRENT_RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
        BUILDCHAIN_RESUME_TRANSACTION_ID: ${{ fromJSON(inputs.request-json).resume-transaction-id }}
        BUILDCHAIN_PUBLISH_REMATERIALIZE_ON_RESUME: ${{ fromJSON(inputs.request-json).publish-rematerialize-on-resume }}
        BUILDCHAIN_RUNTIME_AUTHORIZATION_JSON: ${{ fromJSON(inputs.request-json).promotion-runtime-authorization-json }}
        BUILDCHAIN_RUNTIME_AUTHORIZATION_ROOT: ${{ fromJSON(inputs.request-json).promotion-runtime-authorization-root }}
    - name: Resolve one exact product publication recovery
      if: ${{ steps.intent.outputs.action == 'promote' && (fromJSON(inputs.request-json).publish-transaction-override || fromJSON(inputs.request-json).resume-transaction-id != '') }}
      id: recovery
      uses: actions/github-script@v8
      env:
        BUILDCHAIN_CANDIDATE_VERSION: ${{ steps.candidate.outputs.release-candidate-publication-version || steps.candidate.outputs.release-candidate-version }}
        BUILDCHAIN_EXPLICIT_RESUME: ${{ fromJSON(inputs.request-json).resume-transaction-id != '' }}
        BUILDCHAIN_REQUESTED_SHA: ${{ steps.intent.outputs.requested-sha }}
        BUILDCHAIN_RUNTIME_ROOT: ${{ github.workspace }}/.buildchain/runtime
        BUILDCHAIN_ACTION_ROOT: ${{ github.action_path }}
      with:
        script: |
          const { pathToFileURL } = require('node:url');
          const { run } = await import(pathToFileURL(process.env.BUILDCHAIN_ACTION_ROOT + '/../../../packages/core/release/nodes/promotion-recovery.mjs').href);
          await run({ github, context, core });
    - name: Select and root the exact product publication intent
      if: ${{ steps.intent.outputs.action == 'promote' }}
      id: publication
      shell: bash
      run: node .buildchain/runtime/packages/core/release/commands/product-publication-intent.mjs
      env:
        BUILDCHAIN_REPOSITORY: ${{ github.repository }}
        BUILDCHAIN_CHANNEL: ${{ steps.intent.outputs.channel }}
        BUILDCHAIN_TARGET_REF: ${{ steps.intent.outputs.target-ref }}
        BUILDCHAIN_SOURCE_SHA: ${{ steps.intent.outputs.requested-sha }}
        BUILDCHAIN_SOURCE_TIMESTAMP: ${{ steps.intent.outputs.source-timestamp }}
        BUILDCHAIN_CANDIDATE_VERSION: ${{ steps.candidate.outputs.release-candidate-publication-version || steps.candidate.outputs.release-candidate-version }}
        BUILDCHAIN_RECOVERED_PUBLICATION_VERSION: ${{ steps.recovery.outputs.version || '' }}
        BUILDCHAIN_SEALED_BUNDLE_MANIFEST: ${{ steps.candidate.outputs.publish-sealed-bundle-manifest }}
        BUILDCHAIN_REQUIRED_ARTIFACTS_PATH: ${{ steps.candidate.outputs.publish-required-artifacts-path }}
        BUILDCHAIN_PUBLISH_ARTIFACT_KIND: ${{ fromJSON(inputs.request-json).publish-artifact-kind }}
        BUILDCHAIN_PUBLISH_PACKAGE_MAIN: ${{ fromJSON(inputs.request-json).publish-package-main }}
        BUILDCHAIN_PUBLISH_DIST_TAG: ${{ fromJSON(inputs.request-json).publish-dist-tag }}
    - name: Retain the exact QUALIFY cut
      if: ${{ steps.intent.outputs.action == 'promote' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-v4-release-qualify-${{ steps.intent.outputs.requested-sha }}
        path: .buildchain/release-candidate/
        include-hidden-files: true
        if-no-files-found: error
