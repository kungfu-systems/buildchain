name: next-development-review
description: Execute the next-development review capability within its caller job boundary.
inputs:
  secrets-buildchain-approval-token:
    description: Explicit scoped provider credential.
    required: true
  secrets-buildchain-promotion-token:
    description: Explicit scoped provider credential.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/runtime/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Install protected verification dependencies
      uses: ./.buildchain/runtime/actions/runtime/dependencies/install
      with:
        directory: .
        production: "true"
        ignore-scripts: "true"
    - name: Qualify exact protected source and completed publication
      id: qualify
      uses: ./.buildchain/runtime/actions/release/next-development/qualify
      with:
        token: ${{ github.token }}
    - name: Approve exact transition and enter protected queue
      id: review
      uses: ./.buildchain/runtime/actions/release/next-development/complete-review
      with:
        token: ${{ github.token }}
        approval-token: ${{ inputs.secrets-buildchain-approval-token }}
        mutation-token: ${{ inputs.secrets-buildchain-promotion-token }}
    - name: Retain exact-head review evidence
      if: ${{ always() && steps.qualify.outputs.review-path != '' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: next-development-review-${{ github.event.workflow_run.id }}
        path: ${{ steps.qualify.outputs.review-path }}
        include-hidden-files: true
        if-no-files-found: error
