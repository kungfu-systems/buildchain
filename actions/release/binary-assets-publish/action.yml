name: binary-assets-publish
description: Execute the binary-assets publish capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-publication-authority-outputs-capability-json:
    description: Caller needs.publication-authority.outputs.capability-json value.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Checkout the admitted publication runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.request-json).buildchain-ref }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Verify source and runtime coordinates
      shell: bash
      env:
        RUNTIME_SHA: ${{ fromJSON(inputs.request-json).buildchain-ref }}
        SOURCE_SHA: ${{ fromJSON(inputs.request-json).source-sha }}
      run: node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/binary-assets.mjs" verify
    - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Download binary evidence
      uses: actions/download-artifact@v7.0.0
      with:
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        pattern: buildchain-binary-*
        path: dist/binary
        merge-multiple: true
    - name: Download release passport evidence
      uses: actions/download-artifact@v7.0.0
      with:
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        name: buildchain-release-passport
        path: .buildchain/release-passport
    - name: Write public binary checksums
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/binary-assets.mjs" checksums
    - name: Verify capability against downloaded bundle and tag
      env:
        BUILDCHAIN_PUBLICATION_CAPABILITY_JSON: ${{ fromJSON(inputs.needs-publication-authority-outputs-capability-json) }}
        RELEASE_TAG: ${{ fromJSON(inputs.request-json).release-tag }}
        SOURCE_SHA: ${{ fromJSON(inputs.request-json).source-sha }}
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/binary-assets.mjs" admit
    - name: Upload immutable GitHub Release assets and verify readback
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ fromJSON(inputs.request-json).release-tag }}
      run: node .buildchain/runtime/packages/core/publication/commands/binary-publication-evidence.mjs publish
      shell: bash -e {0}
    - name: Retain binary publication readback
      uses: actions/upload-artifact@v7.0.1
      with:
        name: binary-publication-readback-${{ fromJSON(inputs.request-json).release-tag }}
        path: .buildchain/binary-publication/readback.json
        include-hidden-files: true
        if-no-files-found: error
