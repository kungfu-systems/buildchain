name: Verify release lineage
description: Verify the source version and exact head/base release-line relationship.
runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        path: .buildchain/channel-source
        persist-credentials: false
    - name: Prepare Node
      uses: actions/setup-node@v6.4.0
      with:
        node-version: '24'
    - name: Verify release PR lineage
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../packages/core/release/commands/verify-release-pr.mjs"
      env:
        BUILDCHAIN_SOURCE_CWD: ${{ github.workspace }}/.buildchain/channel-source
        BUILDCHAIN_HEAD_REF: ${{ github.head_ref }}
        BUILDCHAIN_BASE_REF: ${{ github.base_ref }}
