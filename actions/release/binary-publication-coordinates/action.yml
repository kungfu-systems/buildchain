name: binary-publication-coordinates
description: Execute the binary-assets resolve capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
outputs:
  buildchain-ref:
    description: buildchain-ref node result.
    value: ${{ steps.transaction.outputs.buildchain-ref }}
  evidence-run-id:
    description: evidence-run-id node result.
    value: ${{ steps.transaction.outputs.evidence-run-id }}
  release-tag:
    description: release-tag node result.
    value: ${{ steps.transaction.outputs.release-tag }}
  source-sha:
    description: source-sha node result.
    value: ${{ steps.transaction.outputs.source-sha }}
  target-ref:
    description: target-ref node result.
    value: ${{ steps.transaction.outputs.target-ref }}
  publication-version:
    description: publication-version node result.
    value: ${{ steps.transaction.outputs.publication-version }}
runs:
  using: composite
  steps:
  - uses: actions/setup-node@v6.4.0
    with:
      node-version: '24'
  - name: Resolve exact release tag and runtime coordinates
    id: transaction
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_BUILDCHAIN_REF: ${{ fromJSON(inputs.request-json).buildchain-ref }}
      INPUT_RUN_ID: ${{ fromJSON(inputs.request-json).evidence-run-id }}
      INPUT_RELEASE_TAG: ${{ fromJSON(inputs.request-json).release-tag }}
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/release/nodes/binary-publication-coordinates.mjs" resolve
