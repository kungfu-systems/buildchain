name: promote-apply
description: Execute the promote apply capability within its caller job boundary.
inputs:
  needs-qualify-outputs-runtime-sha:
    description: Caller needs.qualify.outputs.runtime-sha value.
    required: true
  needs-qualify-outputs-runtime-tree:
    description: Caller needs.qualify.outputs.runtime-tree value.
    required: true
  needs-qualify-outputs-requested-sha:
    description: Caller needs.qualify.outputs.requested-sha value.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-buildchain-promotion-token:
    description: Explicit scoped provider credential.
    required: true
  needs-qualify-outputs-version:
    description: Caller needs.qualify.outputs.version value.
    required: true
  needs-qualify-outputs-exact-tag:
    description: Caller needs.qualify.outputs.exact-tag value.
    required: true
  needs-qualify-outputs-channel:
    description: Caller needs.qualify.outputs.channel value.
    required: true
  needs-qualify-outputs-target-ref:
    description: Caller needs.qualify.outputs.target-ref value.
    required: true
  needs-qualify-outputs-candidate-passport-path:
    description: Caller needs.qualify.outputs.candidate-passport-path value.
    required: true
  needs-qualify-outputs-candidate-build-summary-path:
    description: Caller needs.qualify.outputs.candidate-build-summary-path value.
    required: true
  needs-qualify-outputs-stage-capsules-path:
    description: Caller needs.qualify.outputs.stage-capsules-path value.
    required: true
  needs-qualify-outputs-publication-qualification-path:
    description: Caller needs.qualify.outputs.publication-qualification-path value.
    required: true
  needs-qualify-outputs-sealed-bundle-root:
    description: Caller needs.qualify.outputs.sealed-bundle-root value.
    required: true
  needs-qualify-outputs-sealed-bundle-manifest:
    description: Caller needs.qualify.outputs.sealed-bundle-manifest value.
    required: true
  needs-qualify-outputs-required-artifacts-path:
    description: Caller needs.qualify.outputs.required-artifacts-path value.
    required: true
  needs-qualify-outputs-product-publication-intent-path:
    description: Caller needs.qualify.outputs.product-publication-intent-path value.
    required: true
  needs-qualify-outputs-publisher-sha:
    description: Caller needs.qualify.outputs.publisher-sha value.
    required: true
  needs-qualify-outputs-release-artifact-paths:
    description: Caller needs.qualify.outputs.release-artifact-paths value.
    required: true
  needs-qualify-outputs-candidate-source-sha:
    description: Caller needs.qualify.outputs.candidate-source-sha value.
    required: true
  needs-qualify-outputs-candidate-artifact:
    description: Caller needs.qualify.outputs.candidate-artifact value.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
outputs:
  promoted-sha:
    description: promoted-sha node result.
    value: ${{ fromJSON(inputs.needs-qualify-outputs-requested-sha) }}
  built-source-sha:
    description: built-source-sha node result.
    value: ${{ fromJSON(inputs.needs-qualify-outputs-candidate-source-sha) }}
  release-candidate-artifact:
    description: release-candidate-artifact node result.
    value: ${{ fromJSON(inputs.needs-qualify-outputs-candidate-artifact) }}
  release-candidate-action:
    description: release-candidate-action node result.
    value: canonical-release-invocation
  release-candidate-outcome:
    description: release-candidate-outcome node result.
    value: success
  promotion-outcome:
    description: promotion-outcome node result.
    value: ${{ steps.publication-settlement.outputs.status == 'complete' && 'success' || 'failure' }}
  finalization-needed:
    description: finalization-needed node result.
    value: ${{ steps.publication-settlement.outputs.status != 'complete' }}
  release-tail-transaction-state:
    description: release-tail-transaction-state node result.
    value: ${{ steps.provider.outputs.transaction-state || steps.resume.outputs.transaction-state }}
  release-tail-declaration-root:
    description: release-tail-declaration-root node result.
    value: ${{ steps.provider.outputs.declaration-root || steps.resume.outputs.declaration-root }}
  release-tail-transaction-root:
    description: release-tail-transaction-root node result.
    value: ${{ steps.provider.outputs.transaction-root || steps.resume.outputs.transaction-root }}
  release-tail-state-root:
    description: release-tail-state-root node result.
    value: ${{ steps.provider.outputs.state-root || steps.resume.outputs.state-root }}
  release-tail-receipt-roots-json:
    description: release-tail-receipt-roots-json node result.
    value: ${{ steps.provider.outputs.receipt-roots-json || steps.resume.outputs.receipt-roots-json }}
  release-invocation-root:
    description: release-invocation-root node result.
    value: ${{ steps.provider.outputs.release-invocation-root || steps.resume.outputs.release-invocation-root }}
  release-transaction-root:
    description: release-transaction-root node result.
    value: ${{ steps.provider.outputs.release-transaction-root || steps.resume.outputs.release-transaction-root }}
  release-receipt-root:
    description: release-receipt-root node result.
    value: ${{ steps.publication-settlement.outputs.receipt-root || steps.provider.outputs.release-receipt-root || steps.resume.outputs.release-receipt-root }}
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Prepare the admitted provider closure
      uses: ./.buildchain/workflow-shell/actions/runtime/provider-closure
      with:
        repository: kungfu-systems/buildchain
        sha: ${{ fromJSON(inputs.needs-qualify-outputs-runtime-sha) }}
        tree: ${{ fromJSON(inputs.needs-qualify-outputs-runtime-tree) }}
    - name: Restore the rooted QUALIFY cut
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-v4-release-qualify-${{ fromJSON(inputs.needs-qualify-outputs-requested-sha) }}
        path: .buildchain/release-candidate
    - name: Execute Provider Plane with requested dogfood interruption
      id: interrupted-provider
      if: ${{ fromJSON(inputs.request-json).provider-failure-after-capability != '' }}
      continue-on-error: true
      uses: ./.buildchain/runtime/actions/release/promote-candidate
      with:
        token: ${{ github.token }}
        mutation-token: ${{ inputs.secrets-buildchain-promotion-token || github.token }}
        repository: ${{ github.repository }}
        source-sha: ${{ fromJSON(inputs.needs-qualify-outputs-requested-sha) }}
        version: ${{ fromJSON(inputs.needs-qualify-outputs-version) }}
        tag: ${{ fromJSON(inputs.needs-qualify-outputs-exact-tag) }}
        channel: ${{ fromJSON(inputs.needs-qualify-outputs-channel) }}
        target-ref: ${{ fromJSON(inputs.needs-qualify-outputs-target-ref) }}
        target-sha: ${{ fromJSON(inputs.needs-qualify-outputs-requested-sha) }}
        candidate-passport-path: ${{ fromJSON(inputs.needs-qualify-outputs-candidate-passport-path) }}
        candidate-build-summary-path: ${{ fromJSON(inputs.needs-qualify-outputs-candidate-build-summary-path) }}
        stage-capsules-path: ${{ fromJSON(inputs.needs-qualify-outputs-stage-capsules-path) }}
        publication-qualification-path: ${{ fromJSON(inputs.needs-qualify-outputs-publication-qualification-path) }}
        sealed-bundle-root: ${{ fromJSON(inputs.needs-qualify-outputs-sealed-bundle-root) }}
        sealed-bundle-manifest: ${{ fromJSON(inputs.needs-qualify-outputs-sealed-bundle-manifest) }}
        required-artifacts-path: ${{ fromJSON(inputs.needs-qualify-outputs-required-artifacts-path) }}
        product-publication-intent-path: ${{ fromJSON(inputs.needs-qualify-outputs-product-publication-intent-path) }}
        publisher-workflow-sha: ${{ fromJSON(inputs.needs-qualify-outputs-publisher-sha) }}
        runtime-commit: ${{ fromJSON(inputs.needs-qualify-outputs-runtime-sha) }}
        runtime-tree: ${{ fromJSON(inputs.needs-qualify-outputs-runtime-tree) }}
        required-status-check: ${{ fromJSON(inputs.request-json).required-status-check }}
        publish-mode: ${{ fromJSON(inputs.request-json).publish-mode }}
        publish-dist-tag: ${{ fromJSON(inputs.request-json).publish-dist-tag }}
        publish-package-set-order: ${{ fromJSON(inputs.request-json).publish-package-set-order }}
        publish-package-main: ${{ fromJSON(inputs.request-json).publish-package-main }}
        publish-artifact-kind: ${{ fromJSON(inputs.request-json).publish-artifact-kind }}
        publish-auth: ${{ fromJSON(inputs.request-json).trusted-publishing && 'trusted-publishing' || 'npm-token' }}
        publish-rematerialize-on-resume: ${{ fromJSON(inputs.request-json).publish-rematerialize-on-resume }}
        publish-transaction-override: ${{ fromJSON(inputs.request-json).publish-transaction-override }}
        resume-transaction-id: ${{ fromJSON(inputs.request-json).resume-transaction-id }}
        artifact-paths: ${{ fromJSON(inputs.needs-qualify-outputs-release-artifact-paths) }}
        state-path: .buildchain/release-tail/state.json
        failure-after-capability: ${{ fromJSON(inputs.request-json).provider-failure-after-capability }}
    - name: Execute Provider Plane
      id: provider
      if: ${{ fromJSON(inputs.request-json).provider-failure-after-capability == '' }}
      uses: ./.buildchain/runtime/actions/release/promote-candidate
      with:
        token: ${{ github.token }}
        mutation-token: ${{ inputs.secrets-buildchain-promotion-token || github.token }}
        repository: ${{ github.repository }}
        source-sha: ${{ fromJSON(inputs.needs-qualify-outputs-requested-sha) }}
        version: ${{ fromJSON(inputs.needs-qualify-outputs-version) }}
        tag: ${{ fromJSON(inputs.needs-qualify-outputs-exact-tag) }}
        channel: ${{ fromJSON(inputs.needs-qualify-outputs-channel) }}
        target-ref: ${{ fromJSON(inputs.needs-qualify-outputs-target-ref) }}
        target-sha: ${{ fromJSON(inputs.needs-qualify-outputs-requested-sha) }}
        candidate-passport-path: ${{ fromJSON(inputs.needs-qualify-outputs-candidate-passport-path) }}
        candidate-build-summary-path: ${{ fromJSON(inputs.needs-qualify-outputs-candidate-build-summary-path) }}
        stage-capsules-path: ${{ fromJSON(inputs.needs-qualify-outputs-stage-capsules-path) }}
        publication-qualification-path: ${{ fromJSON(inputs.needs-qualify-outputs-publication-qualification-path) }}
        sealed-bundle-root: ${{ fromJSON(inputs.needs-qualify-outputs-sealed-bundle-root) }}
        sealed-bundle-manifest: ${{ fromJSON(inputs.needs-qualify-outputs-sealed-bundle-manifest) }}
        required-artifacts-path: ${{ fromJSON(inputs.needs-qualify-outputs-required-artifacts-path) }}
        product-publication-intent-path: ${{ fromJSON(inputs.needs-qualify-outputs-product-publication-intent-path) }}
        publisher-workflow-sha: ${{ fromJSON(inputs.needs-qualify-outputs-publisher-sha) }}
        runtime-commit: ${{ fromJSON(inputs.needs-qualify-outputs-runtime-sha) }}
        runtime-tree: ${{ fromJSON(inputs.needs-qualify-outputs-runtime-tree) }}
        required-status-check: ${{ fromJSON(inputs.request-json).required-status-check }}
        publish-mode: ${{ fromJSON(inputs.request-json).publish-mode }}
        publish-dist-tag: ${{ fromJSON(inputs.request-json).publish-dist-tag }}
        publish-package-set-order: ${{ fromJSON(inputs.request-json).publish-package-set-order }}
        publish-package-main: ${{ fromJSON(inputs.request-json).publish-package-main }}
        publish-artifact-kind: ${{ fromJSON(inputs.request-json).publish-artifact-kind }}
        publish-auth: ${{ fromJSON(inputs.request-json).trusted-publishing && 'trusted-publishing' || 'npm-token' }}
        publish-rematerialize-on-resume: ${{ fromJSON(inputs.request-json).publish-rematerialize-on-resume }}
        publish-transaction-override: ${{ fromJSON(inputs.request-json).publish-transaction-override }}
        resume-transaction-id: ${{ fromJSON(inputs.request-json).resume-transaction-id }}
        artifact-paths: ${{ fromJSON(inputs.needs-qualify-outputs-release-artifact-paths) }}
        state-path: .buildchain/release-tail/state.json
        failure-after-capability: ${{ fromJSON(inputs.request-json).provider-failure-after-capability }}
    - name: Resume the same transaction journal
      id: resume
      if: ${{ steps.interrupted-provider.outcome == 'failure' }}
      uses: ./.buildchain/runtime/actions/release/promote-candidate
      with:
        token: ${{ github.token }}
        mutation-token: ${{ inputs.secrets-buildchain-promotion-token || github.token }}
        repository: ${{ github.repository }}
        source-sha: ${{ fromJSON(inputs.needs-qualify-outputs-requested-sha) }}
        version: ${{ fromJSON(inputs.needs-qualify-outputs-version) }}
        tag: ${{ fromJSON(inputs.needs-qualify-outputs-exact-tag) }}
        channel: ${{ fromJSON(inputs.needs-qualify-outputs-channel) }}
        target-ref: ${{ fromJSON(inputs.needs-qualify-outputs-target-ref) }}
        target-sha: ${{ fromJSON(inputs.needs-qualify-outputs-requested-sha) }}
        candidate-passport-path: ${{ fromJSON(inputs.needs-qualify-outputs-candidate-passport-path) }}
        candidate-build-summary-path: ${{ fromJSON(inputs.needs-qualify-outputs-candidate-build-summary-path) }}
        stage-capsules-path: ${{ fromJSON(inputs.needs-qualify-outputs-stage-capsules-path) }}
        publication-qualification-path: ${{ fromJSON(inputs.needs-qualify-outputs-publication-qualification-path) }}
        sealed-bundle-root: ${{ fromJSON(inputs.needs-qualify-outputs-sealed-bundle-root) }}
        sealed-bundle-manifest: ${{ fromJSON(inputs.needs-qualify-outputs-sealed-bundle-manifest) }}
        required-artifacts-path: ${{ fromJSON(inputs.needs-qualify-outputs-required-artifacts-path) }}
        product-publication-intent-path: ${{ fromJSON(inputs.needs-qualify-outputs-product-publication-intent-path) }}
        publisher-workflow-sha: ${{ fromJSON(inputs.needs-qualify-outputs-publisher-sha) }}
        runtime-commit: ${{ fromJSON(inputs.needs-qualify-outputs-runtime-sha) }}
        runtime-tree: ${{ fromJSON(inputs.needs-qualify-outputs-runtime-tree) }}
        required-status-check: ${{ fromJSON(inputs.request-json).required-status-check }}
        publish-mode: ${{ fromJSON(inputs.request-json).publish-mode }}
        publish-dist-tag: ${{ fromJSON(inputs.request-json).publish-dist-tag }}
        publish-package-set-order: ${{ fromJSON(inputs.request-json).publish-package-set-order }}
        publish-package-main: ${{ fromJSON(inputs.request-json).publish-package-main }}
        publish-artifact-kind: ${{ fromJSON(inputs.request-json).publish-artifact-kind }}
        publish-auth: ${{ fromJSON(inputs.request-json).trusted-publishing && 'trusted-publishing' || 'npm-token' }}
        publish-rematerialize-on-resume: ${{ fromJSON(inputs.request-json).publish-rematerialize-on-resume }}
        publish-transaction-override: ${{ fromJSON(inputs.request-json).publish-transaction-override }}
        resume-transaction-id: ${{ fromJSON(inputs.request-json).resume-transaction-id }}
        artifact-paths: ${{ fromJSON(inputs.needs-qualify-outputs-release-artifact-paths) }}
        state-path: .buildchain/release-tail/state.json
        failure-after-capability: ${{ fromJSON(inputs.request-json).provider-failure-after-capability }}
    - name: Retain completed publication independently of next-development
      id: publication-settlement
      if: ${{ always() && hashFiles('.buildchain/release-tail/release-receipt.json') != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_SHA: ${{ fromJSON(inputs.needs-qualify-outputs-requested-sha) }}
        APPLY_OUTCOME: ${{ (steps.resume.outcome == 'success' || steps.resume.outcome == 'failure') && steps.resume.outcome || steps.provider.outcome }}
      run: node .buildchain/runtime/packages/core/publication/commands/publication-settlement.mjs .buildchain
      shell: bash -e {0}
    - name: Retain canonical APPLY and ReleaseReceipt evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-v4-release-apply-${{ fromJSON(inputs.needs-qualify-outputs-requested-sha) }}
        path: |
          .buildchain/release-candidate/
          .buildchain/release-passport/
          .buildchain/release-tail/
        include-hidden-files: true
        if-no-files-found: error
