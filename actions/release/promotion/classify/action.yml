name: promote-classify-workflow-run
description: Execute the promote classify-workflow-run capability within its caller job boundary.
outputs:
  action:
    description: action node result.
    value: ${{ steps.classify.outputs.action }}
  finalized-version:
    description: finalized-version node result.
    value: ${{ steps.classify.outputs.finalized-version }}
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/workflow-shell/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
    - uses: ./.buildchain/workflow-shell/actions/runtime/environment/prepare
      with:
        directory: .
    - name: Recognize generated publication finalization
      id: classify
      uses: ./actions/release/candidate/classify-publication
      with:
        token: ${{ github.token }}
inputs:
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
