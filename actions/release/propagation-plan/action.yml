name: propagation-plan
description: propagation plan.
inputs:
  runtime-ref:
    description: Selected runtime ref with the caller precedence preserved.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  job-workflow-sha:
    description: Caller job.workflow_sha value.
    required: true
  secrets-propagation-token:
    description: Explicit scoped provider credential.
    required: true
runs:
  using: composite
  steps:
    - name: Checkout Buildchain runtime
      id: runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ inputs.runtime-repository }}
        ref: ${{ inputs.runtime-ref }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact Buildchain runtime
      id: core-node
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Resolve controller identities
      id: controller-identities
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/release/nodes/propagation.mjs" identities
      env:
        BUILDCHAIN_PROPAGATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
    - name: Create release-propagation controller plan
      id: controller-plan
      run: '"$BUILDCHAIN_NODE_PATH" .buildchain/runtime/packages/core/observability/commands/controller-evidence.mjs --mode plan'
      env:
        BUILDCHAIN_CONTROLLER_ID: release-propagation
        BUILDCHAIN_CONTROLLER_SOURCE_REPOSITORY: ${{ github.repository }}
        BUILDCHAIN_CONTROLLER_SOURCE_SHA: ${{ github.sha }}
        BUILDCHAIN_CONTROLLER_RUNTIME_REF: ${{ fromJSON(inputs.request-json).buildchain-ref || fromJSON(inputs.job-workflow-sha) }}
        BUILDCHAIN_CONTROLLER_RUNTIME_SHA: ${{ steps.controller-identities.outputs.runtime-sha }}
        BUILDCHAIN_CONTROLLER_CONTRACT_DIGEST: ${{ steps.controller-identities.outputs.contract-digest }}
        BUILDCHAIN_CONTROLLER_INPUTS_JSON: ${{ toJSON(fromJSON(inputs.request-json)) }}
        BUILDCHAIN_CONTROLLER_INPUT_BOUNDARY: workflow-call
        BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      shell: bash -e {0}
    - name: Upload release-propagation controller plan
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-release-propagation-controller-plan-${{ github.sha }}
        path: .buildchain/controller/plan.json
        if-no-files-found: error
    - name: Write propagation inputs
      shell: bash
      env:
        GRAPH_JSON: ${{ fromJSON(inputs.request-json).graph-json }}
        UPSTREAM_RELEASE_JSON: ${{ fromJSON(inputs.request-json).upstream-release-json }}
        AGENT_WORK_CONTEXT_JSON: ${{ fromJSON(inputs.request-json).agent-work-context-json }}
        AGENT_WORK_MODE: ${{ fromJSON(inputs.request-json).agent-work-mode }}
        BUILDCHAIN_PROPAGATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/release/nodes/propagation.mjs" inputs
    - name: Plan release propagation
      id: plan
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/release/nodes/propagation.mjs" plan
      env:
        TARGET: ${{ fromJSON(inputs.request-json).downstream-target }}
        BRANCH_OVERRIDE: ${{ fromJSON(inputs.request-json).downstream-branch }}
        DOWNSTREAM_REPOSITORY: ${{ fromJSON(inputs.request-json).downstream-repository }}
        DOWNSTREAM_BASE_REF: ${{ fromJSON(inputs.request-json).downstream-base-ref }}
        LOCK_PATH: ${{ fromJSON(inputs.request-json).lock-path }}
        BUILDCHAIN_PROPAGATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_PROPAGATION_PLAN_JSON: ${{ toJSON(steps.plan.outputs) }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
    - name: Checkout downstream repository
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).downstream-repository }}
        token: ${{ inputs.secrets-propagation-token || github.token }}
        path: downstream
        ref: ${{ fromJSON(inputs.request-json).downstream-base-ref }}
    - name: Resolve exact downstream branch
      id: branch
      shell: bash
      working-directory: downstream
      env:
        BRANCH: ${{ steps.plan.outputs.branch }}
        BASE: ${{ fromJSON(inputs.request-json).downstream-base-ref }}
        BUILDCHAIN_PROPAGATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_PROPAGATION_PLAN_JSON: ${{ toJSON(steps.plan.outputs) }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/release/nodes/propagation.mjs" branch
    - name: Create agent-native propagation work
      id: propagation-work
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/release/nodes/propagation.mjs" work
      env:
        BUILDCHAIN_PROPAGATION_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_PROPAGATION_PLAN_JSON: ${{ toJSON(steps.plan.outputs) }}
        BUILDCHAIN_PROPAGATION_BRANCH_JSON: ${{ toJSON(steps.branch.outputs) }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
outputs:
  propagation-work-outputs-execute:
    description: Exact propagation step result.
    value: ${{ steps.propagation-work.outputs.execute }}
  plan-outputs:
    description: Exact propagation step result.
    value: ${{ toJSON(steps.plan.outputs) }}
  branch-outputs:
    description: Exact propagation step result.
    value: ${{ toJSON(steps.branch.outputs) }}
  core-node-outputs-node-path:
    description: Exact propagation step result.
    value: ${{ steps.core-node.outputs.node-path }}
  plan-outputs-update_command:
    description: Exact propagation step result.
    value: ${{ steps.plan.outputs.update_command }}
  plan-outputs-lock_path:
    description: Exact propagation step result.
    value: ${{ steps.plan.outputs.lock_path }}
  plan-outputs-propagation_key:
    description: Exact propagation step result.
    value: ${{ steps.plan.outputs.propagation_key }}
  plan-outputs-branch:
    description: Exact propagation step result.
    value: ${{ steps.plan.outputs.branch }}
  plan-outputs-prepare_command:
    description: Exact propagation step result.
    value: ${{ steps.plan.outputs.prepare_command }}
  plan-outputs-package_name:
    description: Exact propagation step result.
    value: ${{ steps.plan.outputs.package_name }}
  plan-outputs-package_version:
    description: Exact propagation step result.
    value: ${{ steps.plan.outputs.package_version }}
  plan-outputs-verify_command:
    description: Exact propagation step result.
    value: ${{ steps.plan.outputs.verify_command }}
  plan-outcome:
    description: Exact propagation step result.
    value: ${{ steps.plan.outcome }}
  propagation-work-outcome:
    description: Exact propagation step result.
    value: ${{ steps.propagation-work.outcome }}
  controller-plan-outcome:
    description: Exact propagation step result.
    value: ${{ steps.controller-plan.outcome }}
  runtime-outcome:
    description: Exact propagation step result.
    value: ${{ steps.runtime.outcome }}
  controller-identities-outcome:
    description: Exact propagation step result.
    value: ${{ steps.controller-identities.outcome }}
  controller-plan-json:
    description: controller-plan-json node result.
    value: ${{ steps.controller-plan.outputs.controller-plan-json }}
  controller-plan-digest:
    description: controller-plan-digest node result.
    value: ${{ steps.controller-plan.outputs.controller-plan-digest }}
  propagation-work-artifact:
    description: propagation-work-artifact node result.
    value: buildchain-release-propagation-work-${{ steps.plan.outputs.propagation_key }}
