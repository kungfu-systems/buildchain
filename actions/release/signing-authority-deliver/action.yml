name: signing-authority-deliver
description: Execute the signing-authority deliver capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .
    - uses: actions/download-artifact@v7.0.0
      with:
        pattern: authority-result-*-${{ fromJSON(inputs.request-json).correlation-id }}
        path: .buildchain/provider-results
    - uses: actions/download-artifact@v7.0.0
      with:
        name: authority-intake-${{ fromJSON(inputs.request-json).correlation-id }}
        path: .buildchain/authority-intake
    - name: Merge provider result indexes without changing signed bytes
      run: node packages/core/build/commands/merge-artifact-signing-results.mjs
      env:
        BUILDCHAIN_SIGNING_RESULT_INPUT_ROOT: .buildchain/provider-results
        BUILDCHAIN_SIGNING_RESULT_ROOT: .buildchain/authority-result
      shell: bash -e {0}
    - name: Verify complete signed result set on GitHub-hosted infrastructure
      run: node packages/core/build/commands/verify-artifact-signing-results.mjs
      env:
        BUILDCHAIN_SIGNING_REQUEST_ROOT: .buildchain/authority-intake
        BUILDCHAIN_SIGNING_RESULT_ROOT: .buildchain/authority-result
      shell: bash -e {0}
    - name: Publish immutable signed result delivery
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ fromJSON(inputs.request-json).result-artifact-name }}
        path: .buildchain/authority-result
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
