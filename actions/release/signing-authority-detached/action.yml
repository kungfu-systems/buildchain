name: signing-authority-detached
description: Execute the signing-authority detached capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  matrix-json:
    description: Declared platform matrix value.
    required: true
  secrets-buildchain-detached-private-key-pkcs8-base64:
    description: Explicit scoped provider credential.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .
    - uses: actions/download-artifact@v7.0.0
      with:
        name: authority-intake-${{ fromJSON(inputs.request-json).correlation-id }}
        path: .buildchain/authority-intake
    - name: Sign exact sealed payloads
      run: node packages/core/build/commands/sign-detached-artifact-requests.mjs
      env:
        BUILDCHAIN_SIGNING_REQUEST_ROOT: .buildchain/authority-intake/${{ fromJSON(inputs.matrix-json).request.indexRoot }}
        BUILDCHAIN_SIGNING_RESULT_ROOT: .buildchain/provider-results/${{ fromJSON(inputs.matrix-json).request.slug }}
        BUILDCHAIN_SIGNING_ARTIFACT_ID: ${{ fromJSON(inputs.matrix-json).request.id }}
        BUILDCHAIN_DETACHED_PRIVATE_KEY_PKCS8_BASE64: ${{ inputs.secrets-buildchain-detached-private-key-pkcs8-base64 }}
        BUILDCHAIN_DETACHED_KEY_ID: ${{ vars.BUILDCHAIN_DETACHED_KEY_ID }}
      shell: bash -e {0}
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: authority-result-detached-${{ fromJSON(inputs.matrix-json).request.slug }}-${{ fromJSON(inputs.request-json).correlation-id }}
        path: .buildchain/provider-results/${{ fromJSON(inputs.matrix-json).request.slug }}
        if-no-files-found: error
        retention-days: 14
