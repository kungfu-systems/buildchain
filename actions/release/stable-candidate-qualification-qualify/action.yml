name: stable-candidate-qualification-qualify
description: Execute the stable-candidate-qualification qualify capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Resolve exact successful public build run
      id: source
      run: node packages/core/release/commands/stable-candidate-qualification.mjs resolve-public-build
      shell: bash -e {0}
    - name: Download exact public build summary
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ steps.source.outputs.artifact-name }}
        path: .buildchain/qualification/source
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ github.event.workflow_run.id || fromJSON(inputs.request-json).run-id }}
    - name: Qualify observed alpha runtime and three-platform artifacts
      run: node packages/core/release/commands/stable-candidate-qualification.mjs qualify-public-build
      shell: bash -e {0}
    - name: Retain public build qualification
      uses: actions/upload-artifact@v7.0.0
      with:
        name: buildchain-public-build-qualification-${{ github.event.workflow_run.id || fromJSON(inputs.request-json).run-id }}
        path: .buildchain/qualification/result.json
        if-no-files-found: error
