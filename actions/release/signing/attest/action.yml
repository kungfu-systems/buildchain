name: artifact-attestation-attest
description: Execute the artifact-attestation attest capability within its caller job boundary.
inputs:
  runtime-ref:
    description: Exact runtime ref; defaults to this workflow SHA.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  definition-sha:
    description: Exact defining signer workflow SHA.
    required: true
outputs:
  attestation-id:
    description: attestation-id node result.
    value: ${{ steps.attest.outputs.attestation-id }}
  attestation-url:
    description: attestation-url node result.
    value: ${{ steps.attest.outputs.attestation-url }}
  bundle-digest:
    description: bundle-digest node result.
    value: ${{ steps.finalize.outputs.bundle-digest }}
  evidence-root:
    description: evidence-root node result.
    value: ${{ steps.finalize.outputs.evidence-root }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Validate immutable signer identity
      uses: ./.buildchain/workflow-shell/actions/build/artifact/admit-attestation
      with:
        request-json: ${{ inputs.request-json }}
        definition-sha: ${{ inputs.definition-sha }}
    - name: Load exact Buildchain attester runtime
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ inputs.runtime-ref }}
        path: .buildchain/attester-runtime
        persist-credentials: false
    - name: Download exact release subject
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        repository: ${{ github.repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        name: ${{ fromJSON(inputs.request-json).subject-artifact-name }}
        path: .buildchain/attestation-input/subject
    - name: Download original build-runner platform manifest
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        repository: ${{ github.repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        name: ${{ fromJSON(inputs.request-json).platform-manifest-artifact-name }}
        path: .buildchain/attestation-input/platform-manifest
    - name: Download pre-attestation Release Passport
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        repository: ${{ github.repository }}
        run-id: ${{ fromJSON(inputs.request-json).evidence-run-id }}
        github-token: ${{ github.token }}
        name: ${{ fromJSON(inputs.request-json).release-passport-artifact-name }}
        path: .buildchain/attestation-input/release-passport
    - name: Verify sealed inputs and write predicate
      id: prepare
      uses: ./.buildchain/attester-runtime/actions/build/artifact/prepare-attestation
      with:
        subject-path: .buildchain/attestation-input/subject/${{ fromJSON(inputs.request-json).subject-relative-path }}
        platform-manifest-path:
          .buildchain/attestation-input/platform-manifest/${{ fromJSON(inputs.request-json).platform-manifest-relative-path
          }}
        release-passport-path:
          .buildchain/attestation-input/release-passport/${{ fromJSON(inputs.request-json).release-passport-relative-path
          }}
        policy-json: ${{ fromJSON(inputs.request-json).policy-json }}
        runtime-sha: ${{ fromJSON(inputs.request-json).buildchain-ref }}
    - name: Create GitHub/Sigstore attestation
      id: attest
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
      with:
        subject-path: ${{ steps.prepare.outputs.subject-path }}
        subject-name: ${{ steps.prepare.outputs.subject-name }}
        predicate-type: ${{ steps.prepare.outputs.predicate-type }}
        predicate-path: ${{ steps.prepare.outputs.predicate-path }}
    - name: Seal retained attestation evidence
      id: finalize
      uses: ./.buildchain/attester-runtime/actions/build/artifact/seal-attestation
      with:
        preparation-json: ${{ steps.prepare.outputs.preparation-json }}
        attestation-id: ${{ steps.attest.outputs.attestation-id }}
        attestation-url: ${{ steps.attest.outputs.attestation-url }}
        bundle-path: ${{ steps.attest.outputs.bundle-path }}
        runtime-sha: ${{ fromJSON(inputs.request-json).buildchain-ref }}
        token: ${{ github.token }}
    - name: Publish offline-verifiable evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ fromJSON(inputs.request-json).evidence-artifact-name }}
        retention-days: ${{ fromJSON(inputs.request-json).retention-days }}
        if-no-files-found: error
        path: .buildchain/github-artifact-attestation/
