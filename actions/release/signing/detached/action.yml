name: signing-authority-detached
description: Execute the signing-authority detached capability within its caller job boundary.
inputs:
  key-id:
    description: Detached signing key identifier.
  request-json:
    description: Typed public workflow request.
    required: true
  private-key-base64:
    description: Explicit scoped provider credential.
    required: true
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
  item-json:
    description: Declared platform matrix value.
    required: true
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/workflow-shell/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
    - uses: ./.buildchain/workflow-shell/actions/runtime/environment/prepare
      with:
        directory: .
    - uses: actions/download-artifact@v7.0.0
      with:
        name: authority-intake-${{ fromJSON(inputs.request-json).correlation-id }}
        path: .buildchain/authority-intake
    - name: Sign exact sealed payloads
      uses: ./actions/build/signing/sign-detached
      with:
        request-json: ${{ inputs.request-json }}
        item-json: ${{ inputs.item-json }}
        private-key-base64: ${{ inputs.private-key-base64 }}
        key-id: ${{ inputs.key-id }}
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: authority-result-detached-${{ fromJSON(inputs.item-json).slug }}-${{ fromJSON(inputs.request-json).correlation-id }}
        path: .buildchain/provider-results/${{ fromJSON(inputs.item-json).slug }}
        if-no-files-found: error
        retention-days: 14
