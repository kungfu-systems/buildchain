name: tail-reseal-plan
description: Execute the tail-reseal plan capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  workflow-sha:
    description: workflow sha contract input.
    required: true
  evidence-read-token:
    description: evidence read token contract input.
    required: true
outputs:
  request-artifact:
    description: request-artifact node result.
    value: v4-tail-reseal-request-${{ steps.plan.outputs.source-sha }}
  platforms-json:
    description: platforms-json node result.
    value: ${{ steps.plan.outputs.platforms-json }}
  source-run-id:
    description: source-run-id node result.
    value: ${{ steps.plan.outputs.source-run-id }}
  source-run-attempt:
    description: source-run-attempt node result.
    value: ${{ steps.plan.outputs.source-run-attempt }}
  source-sha:
    description: source-sha node result.
    value: ${{ steps.plan.outputs.source-sha }}
  source-tree-sha:
    description: source-tree-sha node result.
    value: ${{ steps.plan.outputs.source-tree-sha }}
  runtime-sha:
    description: runtime-sha node result.
    value: ${{ steps.plan.outputs.runtime-sha }}
  consumer-policy-receipt-root:
    description: consumer-policy-receipt-root node result.
    value: ${{ steps.plan.outputs.consumer-policy-receipt-root }}
  warrant-readback-root:
    description: warrant-readback-root node result.
    value: ${{ steps.plan.outputs.warrant-readback-root }}
  signing-provider-readback-root:
    description: signing-provider-readback-root node result.
    value: ${{ steps.plan.outputs.signing-provider-readback-root }}
  release-tail-provider-readback-root:
    description: release-tail-provider-readback-root node result.
    value: ${{ steps.plan.outputs.release-tail-provider-readback-root }}
  signing-authority-repository:
    description: signing-authority-repository node result.
    value: ${{ steps.plan.outputs.signing-authority-repository }}
  signing-authority-run-id:
    description: signing-authority-run-id node result.
    value: ${{ steps.plan.outputs.signing-authority-run-id }}
  signing-result-artifact:
    description: signing-result-artifact node result.
    value: ${{ steps.plan.outputs.signing-result-artifact }}
  target-version:
    description: target-version node result.
    value: ${{ steps.plan.outputs.target-version }}
  plan-root:
    description: plan-root node result.
    value: ${{ steps.plan.outputs.plan-root }}
  admission-root:
    description: admission-root node result.
    value: ${{ steps.plan.outputs.admission-root }}
runs:
  using: composite
  steps:
    - name: Admit source policy and retained provider evidence
      id: plan
      uses: ./.buildchain/runtime/actions/release/reseal/admit
      with:
        runtime-sha: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
        request-json: ${{ inputs.request-json }}
        token: ${{ inputs.evidence-read-token }}
    - name: Upload exact request, policy, admission, and plan
      uses: actions/upload-artifact@v7.0.1
      with:
        name: v4-tail-reseal-request-${{ steps.plan.outputs.source-sha }}
        path: .buildchain/tail-reseal/*.json
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
