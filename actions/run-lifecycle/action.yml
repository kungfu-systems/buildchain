name: "Buildchain Run Lifecycle"
description: "Run a Buildchain lifecycle stage or command and write a deterministic artifact manifest"
inputs:
  cwd:
    description: "Working directory for command execution"
    required: false
    default: "."
  stage:
    description: "Lifecycle stage name to run when command is empty"
    required: false
    default: "build"
  command:
    description: "Explicit command overriding buildchain.toml"
    required: false
    default: ""
  required:
    description: "Fail when neither command nor configured stage ran"
    required: false
    default: "true"
  artifact-name:
    description: "Deterministic artifact name"
    required: false
    default: "buildchain-artifact"
  artifact-paths:
    description: "Newline-separated artifact roots to include in the manifest"
    required: false
    default: |
      dist
      build/stage
  platform-id:
    description: "Stable platform id"
    required: false
    default: ""
  platform-name:
    description: "Human-readable platform name"
    required: false
    default: ""
  manifest-path:
    description: "Manifest output path"
    required: false
    default: ".buildchain/artifacts/manifest.json"
  summary-path:
    description: "Compact artifact summary output path"
    required: false
    default: ".buildchain/artifacts/summary.json"
  diagnostics-path:
    description: "Compact diagnostics artifact output path"
    required: false
    default: ""
  manifest-artifact-name:
    description: "Uploaded platform manifest artifact name recorded in diagnostics links"
    required: false
    default: ""
  diagnostics-artifact-name:
    description: "Uploaded platform diagnostics artifact name recorded in diagnostics links"
    required: false
    default: ""
  expected-artifacts-json:
    description: "JSON expectation contract for final artifact files"
    required: false
    default: ""
  process-summary-path:
    description: "Optional process sampler summary JSON to embed in diagnostics"
    required: false
    default: ""
  process-samples-path:
    description: "Optional process sampler JSONL sidecar path"
    required: false
    default: ".buildchain/diagnostics/process-samples.jsonl"
  sample-process-tree:
    description: "Wrap the lifecycle command or stage with the process tree sampler"
    required: false
    default: "false"
  process-sample-interval-ms:
    description: "Process sampler interval in milliseconds"
    required: false
    default: "15000"
  requested-parallelism:
    description: "Optional expected build parallelism recorded in process diagnostics"
    required: false
    default: "0"
  process-summary-required:
    description: "Fail when process-summary-path is configured but missing"
    required: false
    default: "true"
outputs:
  manifest-path:
    description: "Path to the generated artifact manifest"
  summary-path:
    description: "Path to the generated compact artifact summary"
  artifact-name:
    description: "Resolved artifact name recorded in the manifest"
  artifact-file-count:
    description: "Number of files included in the artifact manifest"
  artifact-total-bytes:
    description: "Total bytes included in the artifact manifest"
  artifact-summary-json:
    description: "Compact machine-readable artifact summary JSON"
  expected-artifacts-ok:
    description: "true when expected-artifacts-json is empty or passed"
runs:
  using: "node24"
  main: "dist/index.js"
