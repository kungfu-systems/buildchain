name: stable-candidate-patrol
description: Execute the stable-candidate-patrol patrol capability within its caller job boundary.
inputs:
  runtime-ref:
    description: Exact runtime ref; defaults to this workflow SHA.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-promotion-token:
    description: Explicit scoped provider credential.
    required: true
  secrets-approval-token:
    description: Explicit scoped provider credential.
    required: true
outputs:
  result-path:
    description: result-path node result.
    value: ${{ steps.patrol.outputs.result-path }}
  selected:
    description: selected node result.
    value: ${{ steps.patrol.outputs.selected }}
  selected-version:
    description: selected-version node result.
    value: ${{ steps.patrol.outputs.selected-version }}
  selected-sha:
    description: selected-sha node result.
    value: ${{ steps.patrol.outputs.selected-sha }}
  stable-version:
    description: stable-version node result.
    value: ${{ steps.patrol.outputs.stable-version }}
  promotion-pr:
    description: promotion-pr node result.
    value: ${{ steps.patrol.outputs.promotion-pr }}
runs:
  using: composite
  steps:
  - name: Resolve stable release line
    id: line
    shell: bash
    env:
      INPUT_TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/governance/nodes/stable-release-line.mjs"
  - name: Checkout Buildchain runtime
    uses: actions/checkout@v7.0.0
    with:
      repository: ${{ inputs.runtime-repository }}
      ref: ${{ inputs.runtime-ref }}
      path: .buildchain/runtime
      persist-credentials: false
  - name: Checkout caller policy source
    uses: actions/checkout@v7.0.0
    with:
      path: .buildchain/source
      persist-credentials: false
  - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    with:
      directory: .buildchain/runtime
  - name: Resolve repository stable policy
    id: policy
    run: node .buildchain/runtime/packages/core/release/commands/stable-candidate-policy.mjs
    env:
      BUILDCHAIN_STABLE_POLICY_CWD: .buildchain/source
    shell: bash -e {0}
  - name: Reconcile and select stable candidate
    id: patrol
    run: node .buildchain/runtime/packages/core/release/commands/stable-candidate-patrol.mjs
    env:
      GITHUB_TOKEN: ${{ inputs.secrets-promotion-token || github.token }}
      BUILDCHAIN_STABLE_PATROL_REPOSITORY: ${{ github.repository }}
      BUILDCHAIN_STABLE_PATROL_TARGET_BRANCH: ${{ steps.line.outputs.target-branch }}
      BUILDCHAIN_STABLE_PATROL_LEDGER_REF: ${{ fromJSON(inputs.request-json).ledger-ref || steps.policy.outputs.ledger-ref
        }}
      BUILDCHAIN_STABLE_PATROL_MINIMUM_SOAK_SECONDS: ${{ fromJSON(inputs.request-json).minimum-soak-seconds || steps.policy.outputs.minimum-soak-seconds
        }}
      BUILDCHAIN_STABLE_PATROL_REQUIRED_CHECKS: ${{ fromJSON(inputs.request-json).required-checks || steps.policy.outputs.required-checks
        || 'alpha-release' }}
      BUILDCHAIN_STABLE_PATROL_REVOKED_VERSIONS: ${{ fromJSON(inputs.request-json).revoked-versions || vars.BUILDCHAIN_STABLE_REVOKED_ALPHA_VERSIONS
        }}
      BUILDCHAIN_STABLE_PATROL_REVOKE_REASON: ${{ fromJSON(inputs.request-json).revoke-reason || vars.BUILDCHAIN_STABLE_REVOKE_REASON
        }}
      BUILDCHAIN_STABLE_PATROL_HOLD: ${{ fromJSON(inputs.request-json).hold || vars.BUILDCHAIN_STABLE_HOLD == 'true' }}
      BUILDCHAIN_STABLE_PATROL_HOLD_REASON: ${{ fromJSON(inputs.request-json).hold-reason || vars.BUILDCHAIN_STABLE_HOLD_REASON
        }}
      BUILDCHAIN_STABLE_PATROL_RELEASE_NOW: ${{ fromJSON(inputs.request-json).release-now }}
      BUILDCHAIN_STABLE_PATROL_AUTO_PROMOTE: ${{ fromJSON(inputs.request-json).auto-promote || steps.policy.outputs.auto-promote
        == 'true' }}
      BUILDCHAIN_STABLE_PATROL_AUTO_MERGE: ${{ fromJSON(inputs.request-json).auto-merge || steps.policy.outputs.auto-merge
        == 'true' }}
      BUILDCHAIN_STABLE_PATROL_MERGE_METHOD: ${{ fromJSON(inputs.request-json).merge-method }}
      BUILDCHAIN_STABLE_PATROL_DRY_RUN: ${{ fromJSON(inputs.request-json).dry-run }}
      BUILDCHAIN_STABLE_PATROL_OUTPUT_PATH: .buildchain/patrol/stable-candidate.json
    shell: bash -e {0}
  - name: Approve generated stable PR
    if: ${{ fromJSON(inputs.request-json).auto-approve && !fromJSON(inputs.request-json).dry-run && steps.patrol.outputs.promotion-pr
      != '' }}
    env:
      GH_TOKEN: ${{ inputs.secrets-approval-token || github.token }}
      PROMOTION_PR: ${{ steps.patrol.outputs.promotion-pr }}
    run: gh pr review "${PROMOTION_PR}" --approve --body "Approved by the repository-owned Buildchain Stable Candidate Patrol
      policy."
    shell: bash -e {0}
  - name: Upload stable candidate patrol result
    uses: actions/upload-artifact@v7.0.1
    with:
      name: buildchain-stable-candidate-patrol-${{ steps.line.outputs.artifact-line }}
      path: ${{ steps.patrol.outputs.result-path }}
      if-no-files-found: error
