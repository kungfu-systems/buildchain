name: Reconcile required build aggregate
description: Execute the release-governance reconcile capability within its
  caller job boundary.
inputs:
  runtime-ref:
    description: Exact runtime ref; defaults to this workflow SHA.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  token:
    description: Scoped branch governance credential.
    required: true
runs:
  using: composite
  steps:
    - name: Align governed release checks
      uses: ./.buildchain/runtime/actions/governance/release/align-checks
      with:
        request-json: ${{ inputs.request-json }}
        token: ${{ inputs.token }}
    - name: Upload reconciliation evidence
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-release-governance-${{
          fromJSON(inputs.request-json).candidate-sha }}
        path: .buildchain-release-governance-reconciliation.json
        if-no-files-found: error
