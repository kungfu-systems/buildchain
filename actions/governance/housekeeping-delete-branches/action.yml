name: Apply exact branch deletions
description: Execute the housekeeping delete-branches capability within its caller job boundary.
inputs:
  runtime-ref:
    description: Exact runtime ref; defaults to this workflow SHA.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-housekeeper-app-id:
    description: Explicit scoped provider credential.
    required: true
  secrets-housekeeper-app-private-key:
    description: Explicit scoped provider credential.
    required: true
  needs-plan-outputs-plan-artifact:
    description: Caller needs.plan.outputs.plan-artifact value.
    required: true
  secrets-housekeeper-token:
    description: Explicit scoped provider credential.
    required: true
outputs:
  receipt-root:
    description: receipt-root node result.
    value: ${{ steps.housekeeper.outputs.receipt-root }}
runs:
  using: composite
  steps:
  - name: Resolve target repository
    id: target
    shell: bash
    env:
      INPUT_REPOSITORY: ${{ fromJSON(inputs.request-json).repository }}
    run: "set -euo pipefail\nrepository=\"${INPUT_REPOSITORY:-${GITHUB_REPOSITORY}}\"\n{\n  echo \"repository=${repository}\"\
      \n  echo \"owner=${repository%%/*}\"\n  echo \"name=${repository#*/}\"\n} >> \"${GITHUB_OUTPUT}\"\n"
  - name: Mint caller-owned GitHub App token
    if: ${{ env.HOUSEKEEPER_APP_ID != '' && env.HOUSEKEEPER_APP_PRIVATE_KEY != '' }}
    id: app-token
    uses: actions/create-github-app-token@v3.1.1
    with:
      app-id: ${{ inputs.secrets-housekeeper-app-id }}
      private-key: ${{ inputs.secrets-housekeeper-app-private-key }}
      owner: ${{ steps.target.outputs.owner }}
      repositories: ${{ steps.target.outputs.name }}
  - name: Checkout Buildchain runtime
    uses: actions/checkout@v7.0.0
    with:
      repository: ${{ inputs.runtime-repository }}
      ref: ${{ inputs.runtime-ref }}
      path: .buildchain/runtime
      persist-credentials: false
  - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    with:
      directory: .buildchain/runtime
  - name: Download exact plan
    uses: actions/download-artifact@v8.0.1
    with:
      name: ${{ fromJSON(inputs.needs-plan-outputs-plan-artifact) }}
      path: .buildchain/engineering-housekeeper-input
  - name: Revalidate and apply branch actions
    id: housekeeper
    env:
      GITHUB_TOKEN: ${{ steps.app-token.outputs.token || inputs.secrets-housekeeper-token || github.token }}
      HOUSEKEEPER_REPOSITORY: ${{ steps.target.outputs.repository }}
      HOUSEKEEPER_TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
      HOUSEKEEPER_MODE: apply
      HOUSEKEEPER_APPLY_ENABLED: 'true'
      HOUSEKEEPER_STALE_DAYS: ${{ fromJSON(inputs.request-json).stale-days }}
      HOUSEKEEPER_MAX_ACTIONS: ${{ fromJSON(inputs.request-json).max-actions }}
      HOUSEKEEPER_PLAN_PATH: .buildchain/engineering-housekeeper-input/plan.json
      HOUSEKEEPER_OUTPUT_DIRECTORY: .buildchain/engineering-housekeeper-branches
    run: node .buildchain/runtime/packages/core/governance/commands/engineering-housekeeper-workflow.mjs apply branches
    shell: bash -e {0}
  - name: Upload branch receipt
    uses: actions/upload-artifact@v7.0.1
    with:
      name: ${{ fromJSON(inputs.request-json).artifact-prefix }}-branch-receipt-${{ github.run_id }}
      path: '${{ steps.housekeeper.outputs.receipt-path }}

        ${{ steps.housekeeper.outputs.report-path }}

        '
      retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
      if-no-files-found: error
