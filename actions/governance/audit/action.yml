name: Audit GitHub governance
description: Collect managed-zone authority, retain sanitized receipts, and enforce qualification.
inputs:
  auditor-app-id:
    description: Bounded governance auditor application ID.
    required: false
  auditor-private-key:
    description: Bounded auditor application private key.
    required: false
  governance-read-token:
    description: Optional governance reader credential.
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - shell: bash
      run: corepack enable
    - shell: bash
      run: pnpm install --frozen-lockfile
    - name: Mint bounded governance auditor token
      if: inputs.auditor-app-id != '' && inputs.auditor-private-key != ''
      id: auditor
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.auditor-app-id }}
        private-key: ${{ inputs.auditor-private-key }}
        owner: ${{ github.repository_owner }}
    - name: Collect sanitized managed-zone governance receipts
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../packages/core/governance/audit/collect.mjs"
      env:
        GH_TOKEN: ${{ steps.auditor.outputs.token || inputs.governance-read-token || github.token }}
        AUDIT_REPOSITORY: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.repository || '' }}
        AUDIT_TARGET_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}
    - name: Publish audit summary
      id: summary
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../packages/core/governance/audit/summary.mjs"
    - name: Upload sanitized immutable audit
      uses: actions/upload-artifact@v7
      with:
        name: github-governance-audit-${{ github.run_id }}-${{ github.run_attempt }}
        path: github-governance-audit.json
        if-no-files-found: error
        retention-days: 30
    - name: Open or update one governance drift incident
      if: steps.summary.outputs.non-qualifying != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      uses: actions/github-script@v8
      env:
        BUILDCHAIN_ACTION_DIRECTORY: ${{ github.action_path }}
        AUDIT_ROOT: ${{ steps.summary.outputs.audit-root }}
        NON_QUALIFYING: ${{ steps.summary.outputs.non-qualifying }}
      with:
        script: |
          const { pathToFileURL } = require('node:url');
          const path = require('node:path');
          const file = path.resolve(process.env.BUILDCHAIN_ACTION_DIRECTORY, '../../../packages/core/governance/audit/incident.mjs');
          const { reportGovernanceIncident } = await import(pathToFileURL(file).href);
          await reportGovernanceIncident({ github, context });
    - name: Enforce governance qualification
      if: steps.summary.outputs.non-qualifying != '0'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../packages/core/governance/audit/enforce.mjs"
      env:
        FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        GOVERNANCE_AUDITOR_TOKEN: ${{ steps.auditor.outputs.token }}
        GOVERNANCE_READ_TOKEN: ${{ inputs.governance-read-token }}
