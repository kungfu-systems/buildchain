name: runner-smoke
description: Execute the runner-smoke smoke capability within its caller job boundary.
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/runtime/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Setup Go
      uses: actions/setup-go@v6.5.0
      with:
        go-version: 1.25.x
    - uses: ./.buildchain/runtime/actions/runtime/dependencies/install
      with:
        directory: .
        production: "false"
        ignore-scripts: "false"
    - uses: ./.buildchain/runtime/actions/build/verification/qualify-runner
inputs:
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
