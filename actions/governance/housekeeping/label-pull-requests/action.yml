name: Apply stale pull-request labels
description: Execute the housekeeping label-pull-requests capability within its
  caller job boundary.
inputs:
  runtime-ref:
    description: Exact runtime ref; defaults to this workflow SHA.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-housekeeper-app-id:
    description: Explicit scoped provider credential.
    required: true
  secrets-housekeeper-app-private-key:
    description: Explicit scoped provider credential.
    required: true
  needs-plan-outputs-plan-artifact:
    description: Caller needs.plan.outputs.plan-artifact value.
    required: true
  secrets-housekeeper-token:
    description: Explicit scoped provider credential.
    required: true
outputs:
  receipt-root:
    description: receipt-root node result.
    value: ${{ steps.housekeeper.outputs.receipt-root }}
runs:
  using: composite
  steps:
    - name: Acquire exact housekeeping credential
      id: credential
      uses: ./.buildchain/runtime/actions/providers/github/token
      with:
        repository: ${{ fromJSON(inputs.request-json).repository }}
        app-id: ${{ inputs.secrets-housekeeper-app-id }}
        private-key: ${{ inputs.secrets-housekeeper-app-private-key }}
        failure-policy: strict
        fallback-token: ${{ inputs.secrets-housekeeper-token }}
        workflow-token: ${{ github.token }}
    - name: Download exact plan
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ fromJSON(inputs.needs-plan-outputs-plan-artifact) }}
        path: .buildchain/engineering-housekeeper-input
    - name: Reconcile exact housekeeping scope
      id: housekeeper
      uses: ./.buildchain/runtime/actions/governance/housekeeping/reconcile
      with:
        request-json: ${{ inputs.request-json }}
        repository: ${{ steps.credential.outputs.repository }}
        scope: pull-requests
        token: ${{ steps.credential.outputs.token }}
    - name: Upload pull-request receipt
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ fromJSON(inputs.request-json).artifact-prefix
          }}-pull-request-receipt-${{ github.run_id }}
        path: |
          ${{ steps.housekeeper.outputs.receipt-path }}
          ${{ steps.housekeeper.outputs.report-path }}
        retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
        if-no-files-found: error
