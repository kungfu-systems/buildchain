name: runner-smoke
description: Execute the runner-smoke smoke capability within its caller job boundary.
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Show runner
      run: |
        echo "runner.name=${RUNNER_NAME}"
        echo "runner.os=${RUNNER_OS}"
        echo "runner.arch=${RUNNER_ARCH}"
        node --version
        corepack --version
      shell: bash -e {0}
    - name: Setup Go
      uses: actions/setup-go@v6.5.0
      with:
        go-version: 1.25.x
    - name: Enable pnpm
      run: |
        corepack prepare pnpm@11.7.0 --activate
        corepack enable
        pnpm --version
      shell: bash -e {0}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash -e {0}
    - name: Check buildchain
      run: pnpm run check
      shell: bash -e {0}
    - name: Verify release passport compatibility fixture
      env:
        BUILDCHAIN_RUNNER_KIND: self-hosted
      run: |
        mkdir -p dist/passport-fixture
        printf 'self-hosted compatibility fixture\n' > dist/passport-fixture/buildchain-self-hosted-fixture.tar.gz
        node bin/buildchain.mjs collect github-release \
          --tag "v0.0.0-self-hosted-smoke" \
          --repository "${GITHUB_REPOSITORY}" \
          --source-sha "${GITHUB_SHA}" \
          --assets-dir dist/passport-fixture \
          --output-dir .buildchain/self-hosted-passport
        node bin/buildchain.mjs verify release-passport .buildchain/self-hosted-passport/buildchain.release.json
      shell: bash -e {0}
inputs:
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
