name: Audit GitHub governance
description: Collect managed-zone authority, retain sanitized receipts, and enforce qualification.
inputs:
  auditor-app-id:
    description: Bounded governance auditor application ID.
    required: false
  auditor-private-key:
    description: Bounded auditor application private key.
    required: false
  governance-read-token:
    description: Optional governance reader credential.
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "24"
    - uses: ./.buildchain/workflow-shell/actions/runtime/dependencies/install
      with:
        directory: .
        production: "false"
        ignore-scripts: "false"
    - name: Acquire bounded governance audit credential
      id: credential
      uses: ./.buildchain/workflow-shell/actions/providers/github/token
      with:
        app-id: ${{ inputs.auditor-app-id }}
        private-key: ${{ inputs.auditor-private-key }}
        organization: ${{ github.repository_owner }}
        fallback-token: ${{ inputs.governance-read-token }}
        workflow-token: ${{ github.token }}
    - name: Collect sanitized managed-zone governance receipts
      id: summary
      uses: ./.buildchain/workflow-shell/actions/governance/repository/collect-audit
      with:
        token: ${{ steps.credential.outputs.token }}
    - name: Upload sanitized immutable audit
      uses: actions/upload-artifact@v7
      with:
        name: github-governance-audit-${{ github.run_id }}-${{ github.run_attempt }}
        path: github-governance-audit.json
        if-no-files-found: error
        retention-days: 30
    - name: Report and enforce governance qualification
      uses: ./.buildchain/workflow-shell/actions/governance/repository/finalize-audit
      with:
        credential-json: ${{ steps.credential.outputs.metadata-json }}
        token: ${{ github.token }}
