name: alpha-candidate-patrol-observe
description: Execute the alpha-candidate-patrol observe capability within its caller job boundary.
inputs:
  runtime-ref:
    description: Exact runtime ref; defaults to this workflow SHA.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
outputs:
  result-path:
    description: result-path node result.
    value: ${{ steps.observe.outputs.result-path }}
  eligible:
    description: eligible node result.
    value: ${{ steps.observe.outputs.eligible }}
  selected-sha:
    description: selected-sha node result.
    value: ${{ steps.observe.outputs.selected-sha }}
  source-lock-ref:
    description: source-lock-ref node result.
    value: ${{ steps.observe.outputs.source-lock-ref }}
  controller-state:
    description: controller-state node result.
    value: ${{ steps.observe.outputs.controller-state }}
  active-candidate-pr:
    description: active-candidate-pr node result.
    value: ${{ steps.observe.outputs.active-candidate-pr }}
  next-candidate-sha:
    description: next-candidate-sha node result.
    value: ${{ steps.observe.outputs.next-candidate-sha }}
  pull-request-body-prefix:
    description: pull-request-body-prefix node result.
    value: ${{ steps.render-body-prefix.outputs.pull-request-body-prefix || fromJSON(inputs.request-json).pull-request-body-prefix
      }}
  prior-state-root:
    description: prior-state-root node result.
    value: ${{ steps.observe.outputs.prior-state-root }}
  train-root:
    description: train-root node result.
    value: ${{ steps.observe.outputs.train-root }}
  cut-root:
    description: cut-root node result.
    value: ${{ steps.observe.outputs.cut-root }}
  candidate-generation:
    description: candidate-generation node result.
    value: ${{ steps.observe.outputs.candidate-generation }}
  candidate-tree-sha:
    description: candidate-tree-sha node result.
    value: ${{ steps.observe.outputs.candidate-tree-sha }}
  runtime-sha:
    description: runtime-sha node result.
    value: ${{ steps.runtime.outputs.sha }}
  cut-created-at:
    description: cut-created-at node result.
    value: ${{ steps.observe.outputs.cut-created-at }}
  observed-at:
    description: observed-at node result.
    value: ${{ steps.observe.outputs.observed-at }}
  drift-root:
    description: drift-root node result.
    value: ${{ steps.observe.outputs.drift-root }}
  hold-root:
    description: hold-root node result.
    value: ${{ steps.observe.outputs.hold-root }}
runs:
  using: composite
  steps:
  - name: Checkout Buildchain runtime
    uses: actions/checkout@v7.0.0
    with:
      repository: ${{ inputs.runtime-repository }}
      ref: ${{ inputs.runtime-ref }}
      path: .buildchain/runtime
      persist-credentials: false
  - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    with:
      directory: .buildchain/runtime
  - name: Bind exact Buildchain runtime
    id: runtime
    shell: bash
    run: echo "sha=$(git -C .buildchain/runtime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  - name: Observe exact-source candidate
    id: observe
    run: node .buildchain/runtime/packages/core/release/commands/dev-alpha-candidate-patrol.mjs
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BUILDCHAIN_CHANNEL_PATROL_REPOSITORY: ${{ github.repository }}
      BUILDCHAIN_CHANNEL_PATROL_SOURCE_BRANCH: ${{ fromJSON(inputs.request-json).source-branch }}
      BUILDCHAIN_CHANNEL_PATROL_TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
      BUILDCHAIN_CHANNEL_PATROL_DEV_WORKFLOW: ${{ fromJSON(inputs.request-json).dev-workflow-path }}
      BUILDCHAIN_CHANNEL_PATROL_ALPHA_WORKFLOW: ${{ fromJSON(inputs.request-json).alpha-workflow-path }}
      BUILDCHAIN_CHANNEL_PATROL_MAX_AGE_SECONDS: ${{ fromJSON(inputs.request-json).max-age-seconds }}
      BUILDCHAIN_CHANNEL_PATROL_REQUIRE_ACTIVE_TRAIN: 'true'
      BUILDCHAIN_CHANNEL_PATROL_RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
      BUILDCHAIN_CHANNEL_PATROL_PR_BODY_PREFIX: ${{ fromJSON(inputs.request-json).pull-request-body-prefix }}
      BUILDCHAIN_CHANNEL_PATROL_CREATE_PR: 'false'
      BUILDCHAIN_CHANNEL_PATROL_SETTLEMENT_AUTHORIZED: 'false'
      BUILDCHAIN_CHANNEL_PATROL_DRY_RUN: 'true'
      BUILDCHAIN_CHANNEL_PATROL_OUTPUT_PATH: .buildchain/patrol/dev-alpha-candidate.json
    shell: bash -e {0}
  - name: Reject ambiguous PR body prefix authority
    if: ${{ fromJSON(inputs.request-json).pull-request-body-prefix-renderer != '' && fromJSON(inputs.request-json).pull-request-body-prefix
      != '' }}
    shell: bash
    run: 'echo "pull-request-body-prefix and pull-request-body-prefix-renderer are mutually exclusive" >&2

      exit 1

      '
  - name: Checkout exact consumer source for PR body prefix
    if: ${{ fromJSON(inputs.request-json).pull-request-body-prefix-renderer != '' && steps.observe.outputs.eligible == 'true'
      }}
    uses: actions/checkout@v7.0.0
    with:
      ref: ${{ steps.observe.outputs.selected-sha }}
      path: .buildchain/consumer
      fetch-depth: 0
      persist-credentials: false
  - name: Render exact-source PR body prefix
    id: render-body-prefix
    if: ${{ fromJSON(inputs.request-json).pull-request-body-prefix-renderer != '' && steps.observe.outputs.eligible == 'true'
      }}
    run: node .buildchain/runtime/packages/core/build/commands/run-candidate-body-prefix-renderer.mjs
    env:
      BUILDCHAIN_CHANNEL_PATROL_CONSUMER_ROOT: .buildchain/consumer
      BUILDCHAIN_CHANNEL_PATROL_PR_BODY_PREFIX_RENDERER: ${{ fromJSON(inputs.request-json).pull-request-body-prefix-renderer
        }}
      BUILDCHAIN_CHANNEL_PATROL_PR_BODY_PREFIX_OUTPUT: .buildchain/patrol/pull-request-body-prefix.txt
      BUILDCHAIN_CHANNEL_PATROL_SELECTED_SHA: ${{ steps.observe.outputs.selected-sha }}
      BUILDCHAIN_CHANNEL_PATROL_SOURCE_BRANCH: ${{ fromJSON(inputs.request-json).source-branch }}
      BUILDCHAIN_CHANNEL_PATROL_TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
    shell: bash -e {0}
  - name: Upload read-only exact-source observation
    uses: actions/upload-artifact@v7.0.1
    with:
      name: buildchain-dev-alpha-candidate-observation-${{ steps.observe.outputs.selected-sha }}
      path: '${{ steps.observe.outputs.result-path }}

        .buildchain/patrol/pull-request-body-prefix.txt

        '
      if-no-files-found: error
      retention-days: 30
