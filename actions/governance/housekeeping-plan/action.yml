name: Inventory and plan
description: Execute the housekeeping plan capability within its caller job boundary.
inputs:
  runtime-ref:
    description: Exact runtime ref; defaults to this workflow SHA.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-housekeeper-app-id:
    description: Explicit scoped provider credential.
    required: true
  secrets-housekeeper-app-private-key:
    description: Explicit scoped provider credential.
    required: true
  secrets-housekeeper-token:
    description: Explicit scoped provider credential.
    required: true
outputs:
  plan-root:
    description: plan-root node result.
    value: ${{ steps.housekeeper.outputs.plan-root }}
  report-receipt-root:
    description: report-receipt-root node result.
    value: ${{ steps.housekeeper.outputs.report-receipt-root }}
  action-count:
    description: action-count node result.
    value: ${{ steps.housekeeper.outputs.action-count }}
  branch-action-count:
    description: branch-action-count node result.
    value: ${{ steps.housekeeper.outputs.branch-action-count }}
  pull-request-action-count:
    description: pull-request-action-count node result.
    value: ${{ steps.housekeeper.outputs.pull-request-action-count }}
  outcome:
    description: outcome node result.
    value: ${{ steps.housekeeper.outputs.outcome }}
  plan-artifact:
    description: plan-artifact node result.
    value: ${{ fromJSON(inputs.request-json).artifact-prefix }}-plan-${{ github.run_id }}
  report-artifact:
    description: report-artifact node result.
    value: ${{ fromJSON(inputs.request-json).artifact-prefix }}-report-${{ github.run_id }}
  receipt-artifact:
    description: receipt-artifact node result.
    value: ${{ fromJSON(inputs.request-json).artifact-prefix }}-receipt-${{ github.run_id }}
runs:
  using: composite
  steps:
  - name: Resolve target repository
    id: target
    shell: bash
    env:
      INPUT_REPOSITORY: ${{ fromJSON(inputs.request-json).repository }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/governance/nodes/target-repository.mjs"
  - name: Validate caller-owned GitHub App credential pair
    shell: bash
    run: "set -euo pipefail\nif [[ -n \"${HOUSEKEEPER_APP_ID}\" && -z \"${HOUSEKEEPER_APP_PRIVATE_KEY}\" ]] || \\\n   [[ -z\
      \ \"${HOUSEKEEPER_APP_ID}\" && -n \"${HOUSEKEEPER_APP_PRIVATE_KEY}\" ]]; then\n  echo \"::error::housekeeper_app_id\
      \ and housekeeper_app_private_key must be provided together\"\n  exit 1\nfi\n"
  - name: Mint caller-owned GitHub App token
    if: ${{ env.HOUSEKEEPER_APP_ID != '' && env.HOUSEKEEPER_APP_PRIVATE_KEY != '' }}
    id: app-token
    uses: actions/create-github-app-token@v3.1.1
    with:
      app-id: ${{ inputs.secrets-housekeeper-app-id }}
      private-key: ${{ inputs.secrets-housekeeper-app-private-key }}
      owner: ${{ steps.target.outputs.owner }}
      repositories: ${{ steps.target.outputs.name }}
  - name: Checkout Buildchain runtime
    uses: actions/checkout@v7.0.0
    with:
      repository: ${{ inputs.runtime-repository }}
      ref: ${{ inputs.runtime-ref }}
      path: .buildchain/runtime
      persist-credentials: false
  - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    with:
      directory: .buildchain/runtime
  - name: Create exact housekeeper plan and report receipt
    id: housekeeper
    env:
      GITHUB_TOKEN: ${{ steps.app-token.outputs.token || inputs.secrets-housekeeper-token || github.token }}
      HOUSEKEEPER_REPOSITORY: ${{ steps.target.outputs.repository }}
      HOUSEKEEPER_TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
      HOUSEKEEPER_MODE: ${{ fromJSON(inputs.request-json).mode }}
      HOUSEKEEPER_APPLY_ENABLED: ${{ fromJSON(inputs.request-json).apply-enabled }}
      HOUSEKEEPER_PROTECTED_PATTERNS: ${{ fromJSON(inputs.request-json).protected-patterns }}
      HOUSEKEEPER_RETAINED_PATTERNS: ${{ fromJSON(inputs.request-json).retained-patterns }}
      HOUSEKEEPER_TEMPORARY_BRANCH_PATTERNS: ${{ fromJSON(inputs.request-json).temporary-branch-patterns }}
      HOUSEKEEPER_STALE_DAYS: ${{ fromJSON(inputs.request-json).stale-days }}
      HOUSEKEEPER_STALE_PR_LABEL: ${{ fromJSON(inputs.request-json).stale-pull-request-label }}
      HOUSEKEEPER_MAX_ACTIONS: ${{ fromJSON(inputs.request-json).max-actions }}
      HOUSEKEEPER_OUTPUT_DIRECTORY: .buildchain/engineering-housekeeper
    run: node .buildchain/runtime/packages/core/governance/commands/engineering-housekeeper-workflow.mjs plan
    shell: bash -e {0}
  - name: Upload exact plan
    uses: actions/upload-artifact@v7.0.1
    with:
      name: ${{ fromJSON(inputs.request-json).artifact-prefix }}-plan-${{ github.run_id }}
      path: ${{ steps.housekeeper.outputs.plan-path }}
      retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
      if-no-files-found: error
  - name: Upload decision report
    uses: actions/upload-artifact@v7.0.1
    with:
      name: ${{ fromJSON(inputs.request-json).artifact-prefix }}-report-${{ github.run_id }}
      path: ${{ steps.housekeeper.outputs.report-path }}
      retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
      if-no-files-found: error
  - name: Upload report receipt
    uses: actions/upload-artifact@v7.0.1
    with:
      name: ${{ fromJSON(inputs.request-json).artifact-prefix }}-receipt-${{ github.run_id }}
      path: ${{ steps.housekeeper.outputs.report-receipt-path }}
      retention-days: ${{ fromJSON(inputs.request-json).artifact-retention-days }}
      if-no-files-found: error
