name: dev-qualification-patrol-mutate
description: Execute the dev-qualification-patrol mutate capability within its caller job boundary.
inputs:
  runtime-ref:
    description: Exact runtime ref; defaults to this workflow SHA.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-qualification-token:
    description: Explicit scoped provider credential.
    required: true
  needs-observe-outputs-action:
    description: Caller needs.observe.outputs.action value.
    required: true
  needs-observe-outputs-source-sha:
    description: Caller needs.observe.outputs.source-sha value.
    required: true
outputs:
  state:
    description: state node result.
    value: ${{ steps.mutate.outputs.state }}
  action:
    description: action node result.
    value: ${{ steps.mutate.outputs.action }}
  reason:
    description: reason node result.
    value: ${{ steps.mutate.outputs.reason }}
  source-sha:
    description: source-sha node result.
    value: ${{ steps.mutate.outputs.source-sha }}
  pending-sha:
    description: pending-sha node result.
    value: ${{ steps.mutate.outputs.pending-sha }}
  active-run-id:
    description: active-run-id node result.
    value: ${{ steps.mutate.outputs.active-run-id }}
  decision-root:
    description: decision-root node result.
    value: ${{ steps.mutate.outputs.decision-root }}
runs:
  using: composite
  steps:
  - name: Checkout Buildchain runtime
    uses: actions/checkout@v7.0.0
    with:
      repository: ${{ inputs.runtime-repository }}
      ref: ${{ inputs.runtime-ref }}
      path: .buildchain/runtime
      persist-credentials: false
  - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    with:
      directory: .buildchain/runtime
  - name: Reconcile and mutate latest Dev qualification
    id: mutate
    run: node .buildchain/runtime/packages/core/dev-delivery/commands/dev-qualification-patrol.mjs
    env:
      GITHUB_TOKEN: ${{ inputs.secrets-qualification-token || github.token }}
      BUILDCHAIN_DEV_QUALIFICATION_REPOSITORY: ${{ github.repository }}
      BUILDCHAIN_DEV_QUALIFICATION_SOURCE_BRANCH: ${{ fromJSON(inputs.request-json).source-branch }}
      BUILDCHAIN_DEV_QUALIFICATION_WORKFLOW: ${{ fromJSON(inputs.request-json).dev-workflow-path }}
      BUILDCHAIN_DEV_QUALIFICATION_PREFLIGHT_WORKFLOW: ${{ fromJSON(inputs.request-json).preflight-workflow-path }}
      BUILDCHAIN_DEV_QUALIFICATION_PRIORITY_WORKFLOWS: ${{ fromJSON(inputs.request-json).priority-workflows-json }}
      BUILDCHAIN_DEV_QUALIFICATION_DISPATCH_INPUTS: ${{ fromJSON(inputs.request-json).dispatch-inputs-json }}
      BUILDCHAIN_DEV_QUALIFICATION_MAX_ATTEMPTS: ${{ fromJSON(inputs.request-json).max-attempts }}
      BUILDCHAIN_DEV_QUALIFICATION_EXPECTED_ACTION: ${{ fromJSON(inputs.needs-observe-outputs-action) }}
      BUILDCHAIN_DEV_QUALIFICATION_EXPECTED_SOURCE_SHA: ${{ fromJSON(inputs.needs-observe-outputs-source-sha) }}
      BUILDCHAIN_DEV_QUALIFICATION_MUTATION_AUTHORIZED: 'true'
      BUILDCHAIN_DEV_QUALIFICATION_OUTPUT_PATH: .buildchain/patrol/dev-qualification-mutation.json
    shell: bash -e {0}
  - name: Upload protected mutation decision
    uses: actions/upload-artifact@v7.0.1
    with:
      name: buildchain-dev-qualification-mutation-${{ steps.mutate.outputs.source-sha }}
      path: ${{ steps.mutate.outputs.result-path }}
      if-no-files-found: error
      retention-days: 30
      overwrite: true
