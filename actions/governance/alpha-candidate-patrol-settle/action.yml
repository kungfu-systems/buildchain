name: alpha-candidate-patrol-settle
description: Execute the alpha-candidate-patrol settle capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-observe-outputs-runtime-sha:
    description: Caller needs.observe.outputs.runtime-sha value.
    required: true
  secrets-promotion-token:
    description: Explicit scoped provider credential.
    required: true
  needs-observe-outputs-pull-request-body-prefix:
    description: Caller needs.observe.outputs.pull-request-body-prefix value.
    required: true
  needs-observe-outputs-selected-sha:
    description: Caller needs.observe.outputs.selected-sha value.
    required: true
  needs-observe-outputs-prior-state-root:
    description: Caller needs.observe.outputs.prior-state-root value.
    required: true
  needs-observe-outputs-cut-root:
    description: Caller needs.observe.outputs.cut-root value.
    required: true
  needs-observe-outputs-cut-created-at:
    description: Caller needs.observe.outputs.cut-created-at value.
    required: true
  needs-observe-outputs-observed-at:
    description: Caller needs.observe.outputs.observed-at value.
    required: true
outputs:
  promotion-pr:
    description: promotion-pr node result.
    value: ${{ steps.settle.outputs.promotion-pr }}
  controller-state:
    description: controller-state node result.
    value: ${{ steps.settle.outputs.controller-state }}
  active-candidate-pr:
    description: active-candidate-pr node result.
    value: ${{ steps.settle.outputs.active-candidate-pr }}
  next-candidate-sha:
    description: next-candidate-sha node result.
    value: ${{ steps.settle.outputs.next-candidate-sha }}
  settlement-action:
    description: settlement-action node result.
    value: ${{ steps.settle.outputs.settlement-action }}
  prior-state-root:
    description: prior-state-root node result.
    value: ${{ steps.settle.outputs.prior-state-root }}
  train-root:
    description: train-root node result.
    value: ${{ steps.settle.outputs.train-root }}
  cut-root:
    description: cut-root node result.
    value: ${{ steps.settle.outputs.cut-root }}
  candidate-generation:
    description: candidate-generation node result.
    value: ${{ steps.settle.outputs.candidate-generation }}
  candidate-tree-sha:
    description: candidate-tree-sha node result.
    value: ${{ steps.settle.outputs.candidate-tree-sha }}
  runtime-sha:
    description: runtime-sha node result.
    value: ${{ steps.runtime.outputs.sha }}
  cut-created-at:
    description: cut-created-at node result.
    value: ${{ steps.settle.outputs.cut-created-at }}
  drift-root:
    description: drift-root node result.
    value: ${{ steps.settle.outputs.drift-root }}
  hold-root:
    description: hold-root node result.
    value: ${{ steps.settle.outputs.hold-root }}
runs:
  using: composite
  steps:
  - name: Checkout Buildchain runtime
    uses: actions/checkout@v7.0.0
    with:
      repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
      ref: ${{ fromJSON(inputs.needs-observe-outputs-runtime-sha) }}
      path: .buildchain/runtime
      persist-credentials: false
  - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    with:
      directory: .buildchain/runtime
  - name: Bind exact Buildchain runtime
    id: runtime
    shell: bash
    run: echo "sha=$(git -C .buildchain/runtime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  - name: Reconcile and settle exact-source candidate
    id: settle
    run: node .buildchain/runtime/packages/core/release/commands/dev-alpha-candidate-patrol.mjs
    env:
      GITHUB_TOKEN: ${{ inputs.secrets-promotion-token || github.token }}
      BUILDCHAIN_CHANNEL_PATROL_REPOSITORY: ${{ github.repository }}
      BUILDCHAIN_CHANNEL_PATROL_SOURCE_BRANCH: ${{ fromJSON(inputs.request-json).source-branch }}
      BUILDCHAIN_CHANNEL_PATROL_TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
      BUILDCHAIN_CHANNEL_PATROL_DEV_WORKFLOW: ${{ fromJSON(inputs.request-json).dev-workflow-path }}
      BUILDCHAIN_CHANNEL_PATROL_ALPHA_WORKFLOW: ${{ fromJSON(inputs.request-json).alpha-workflow-path }}
      BUILDCHAIN_CHANNEL_PATROL_MAX_AGE_SECONDS: ${{ fromJSON(inputs.request-json).max-age-seconds }}
      BUILDCHAIN_CHANNEL_PATROL_REQUIRE_ACTIVE_TRAIN: 'true'
      BUILDCHAIN_CHANNEL_PATROL_RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
      BUILDCHAIN_CHANNEL_PATROL_PR_BODY_PREFIX: ${{ fromJSON(inputs.needs-observe-outputs-pull-request-body-prefix) }}
      BUILDCHAIN_CHANNEL_PATROL_EXPECTED_SELECTED_SHA: ${{ fromJSON(inputs.needs-observe-outputs-selected-sha) }}
      BUILDCHAIN_CHANNEL_PATROL_EXPECTED_PRIOR_STATE_ROOT: ${{ fromJSON(inputs.needs-observe-outputs-prior-state-root) }}
      BUILDCHAIN_CHANNEL_PATROL_EXPECTED_CUT_ROOT: ${{ fromJSON(inputs.needs-observe-outputs-cut-root) }}
      BUILDCHAIN_CHANNEL_PATROL_CUT_CREATED_AT: ${{ fromJSON(inputs.needs-observe-outputs-cut-created-at) }}
      BUILDCHAIN_CHANNEL_PATROL_NOW: ${{ fromJSON(inputs.needs-observe-outputs-observed-at) }}
      BUILDCHAIN_CHANNEL_PATROL_REACTIVATION_AUTHORIZED: ${{ fromJSON(inputs.request-json).reactivation-authorized }}
      BUILDCHAIN_CHANNEL_PATROL_CREATE_PR: 'true'
      BUILDCHAIN_CHANNEL_PATROL_SETTLEMENT_AUTHORIZED: 'true'
      BUILDCHAIN_CHANNEL_PATROL_AUTO_MERGE: ${{ fromJSON(inputs.request-json).auto-merge }}
      BUILDCHAIN_CHANNEL_PATROL_MERGE_METHOD: ${{ fromJSON(inputs.request-json).merge-method }}
      BUILDCHAIN_CHANNEL_PATROL_DRY_RUN: 'false'
      BUILDCHAIN_CHANNEL_PATROL_OUTPUT_PATH: .buildchain/patrol/dev-alpha-candidate-settlement.json
    shell: bash -e {0}
  - name: Upload protected settlement decision
    uses: actions/upload-artifact@v7.0.1
    with:
      name: buildchain-dev-alpha-candidate-settlement-${{ steps.settle.outputs.selected-sha }}
      path: ${{ steps.settle.outputs.result-path }}
      if-no-files-found: error
      retention-days: 30
