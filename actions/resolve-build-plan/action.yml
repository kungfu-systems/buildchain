name: resolve-build-plan
description: Admit source and runtime, resolve TOML and produce the complete rooted build plan.
inputs:
  config-path:
    description: Optional project TOML locator
    required: false
    default: ''
  workflow-ref:
    description: GitHub called workflow identity
    required: true
  workflow-sha:
    description: Exact GitHub called workflow SHA
    required: true
  control-token:
    description: Runner inventory authority
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Setup control runtime
    uses: actions/setup-node@v6.4.0
    with:
      node-version: '24'
  - name: Install exact runtime dependencies
    shell: bash
    run: corepack pnpm@11.7.0 install --dir "$GITHUB_ACTION_PATH/../.." --prod --frozen-lockfile --ignore-scripts
  - name: Resolve and admit build plan
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../scripts/build/plan.mjs"
    env:
      BUILDCHAIN_CONFIG_PATH: ${{ inputs.config-path }}
      BUILDCHAIN_WORKFLOW_REF: ${{ inputs.workflow-ref }}
      BUILDCHAIN_WORKFLOW_SHA: ${{ inputs.workflow-sha }}
      BUILDCHAIN_CONTROL_TOKEN: ${{ inputs.control-token }}
      GITHUB_TOKEN: ${{ github.token }}
    id: plan
outputs:
  plan:
    description: Rooted build plan
    value: ${{ steps.plan.outputs.plan }}
