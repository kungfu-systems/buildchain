name: admit-candidate
description: Paper admit candidate.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
  needs-publication-candidate-outputs-runtime-sha:
    description: Caller needs.publication-candidate.outputs.runtime-sha value.
    required: true
  secrets-buildchain-generated-write-app-client-id:
    description: Explicit scoped provider credential.
    required: true
  secrets-buildchain-generated-write-app-private-key:
    description: Explicit scoped provider credential.
    required: true
  secrets-buildchain-generated-write-token:
    description: Explicit scoped provider credential.
    required: true
  needs-publication-candidate-outputs-publication-artifact-name:
    description: Caller needs.publication-candidate.outputs.publication-artifact-name value.
    required: true
  needs-publication-candidate-outputs-controller-receipt-artifact:
    description: Caller needs.publication-candidate.outputs.controller-receipt-artifact value.
    required: true
  needs-publication-authority-outputs-capability-json:
    description: Caller needs.publication-authority.outputs.capability-json value.
    required: true
  needs-publication-candidate-outputs-package-name:
    description: Caller needs.publication-candidate.outputs.package-name value.
    required: true
  needs-publication-candidate-outputs-package-version:
    description: Caller needs.publication-candidate.outputs.package-version value.
    required: true
  needs-publication-candidate-outputs-publish-dist-tag:
    description: Caller needs.publication-candidate.outputs.publish-dist-tag value.
    required: true
  source-checkout-outcome:
    description: Consumer source checkout outcome.
    required: true
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: |
        exit 1
    - name: Checkout exact admitted Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-publication-candidate-outputs-runtime-sha) }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Prepare exact admitted Buildchain runtime
      id: core-node
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
      with:
        directory: .buildchain/runtime
    - name: Resolve generated-write authority config
      id: generated-write-config
      env:
        APP_CLIENT_ID: ${{ inputs.secrets-buildchain-generated-write-app-client-id }}
        APP_PRIVATE_KEY: ${{ inputs.secrets-buildchain-generated-write-app-private-key }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/paper/nodes/publish.mjs" write-config
    - name: Create generated-write GitHub App token
      id: generated-write-app-token
      if: ${{ steps.generated-write-config.outputs.app-configured == 'true' }}
      uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
      with:
        client-id: ${{ inputs.secrets-buildchain-generated-write-app-client-id }}
        private-key: ${{ inputs.secrets-buildchain-generated-write-app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write
        permission-contents: write
        permission-pull-requests: write
    - name: Require narrow generated-write authority
      env:
        APP_TOKEN: ${{ steps.generated-write-app-token.outputs.token }}
        NARROW_TOKEN: ${{ inputs.secrets-buildchain-generated-write-token }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/paper/nodes/publish.mjs" require-write
    - name: Download admitted publication candidate
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ fromJSON(inputs.needs-publication-candidate-outputs-publication-artifact-name) }}
        path: .buildchain/admitted/artifact
    - name: Download admitted publication controller receipt
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ fromJSON(inputs.needs-publication-candidate-outputs-controller-receipt-artifact) }}
        path: .buildchain/admitted/controller
    - name: Verify candidate bytes against sealed capability
      id: candidate
      env:
        BUILDCHAIN_CAPABILITY_JSON: ${{ fromJSON(inputs.needs-publication-authority-outputs-capability-json) }}
        BUILDCHAIN_RUNTIME_SHA: ${{ fromJSON(inputs.needs-publication-candidate-outputs-runtime-sha) }}
        BUILDCHAIN_PACKAGE_NAME: ${{ fromJSON(inputs.needs-publication-candidate-outputs-package-name) }}
        BUILDCHAIN_PACKAGE_VERSION: ${{ fromJSON(inputs.needs-publication-candidate-outputs-package-version) }}
        BUILDCHAIN_DIST_TAG: ${{ fromJSON(inputs.needs-publication-candidate-outputs-publish-dist-tag) }}
        BUILDCHAIN_GITHUB_RELEASE: ${{ fromJSON(inputs.request-json).github-release }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      shell: bash
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/paper/nodes/publish.mjs" candidate
    - name: Plan source-bound Paper publication controller
      id: controller-plan
      shell: bash
      env:
        REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_NODE_PATH: ${{ steps.core-node.outputs.node-path }}
      run: |
        "$BUILDCHAIN_NODE_PATH" "$GITHUB_WORKSPACE/.buildchain/runtime/packages/core/paper/nodes/controller.mjs" plan
    - name: Upload Paper publication controller plan
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ steps.controller-plan.outputs.controller-plan-artifact }}
        path: .buildchain/paper-controller/plan.json
        if-no-files-found: error
outputs:
  core-node-outputs-node-path:
    description: Exact paper step result.
    value: ${{ steps.core-node.outputs.node-path }}
  generated-write-app-token-outputs-token:
    description: Exact paper step result.
    value: ${{ steps.generated-write-app-token.outputs.token }}
  candidate-outputs-package-version:
    description: Exact paper step result.
    value: ${{ steps.candidate.outputs.package-version }}
  candidate-outputs-exact-tag:
    description: Exact paper step result.
    value: ${{ steps.candidate.outputs.exact-tag }}
  candidate-outputs-package-dir:
    description: Exact paper step result.
    value: ${{ steps.candidate.outputs.package-dir }}
  candidate-outputs-sealed-bundle-root:
    description: Exact paper step result.
    value: ${{ steps.candidate.outputs.sealed-bundle-root }}
  candidate-outputs-sealed-bundle-manifest:
    description: Exact paper step result.
    value: ${{ steps.candidate.outputs.sealed-bundle-manifest }}
  candidate-outputs-required-artifacts-json:
    description: Exact paper step result.
    value: ${{ steps.candidate.outputs.required-artifacts-json }}
  candidate-outputs-dist-tag:
    description: Exact paper step result.
    value: ${{ steps.candidate.outputs.dist-tag }}
  candidate-outputs-package-name:
    description: Exact paper step result.
    value: ${{ steps.candidate.outputs.package-name }}
  candidate-outputs-build-summary-path:
    description: Exact paper step result.
    value: ${{ steps.candidate.outputs.build-summary-path }}
  candidate-outputs-manifest-path:
    description: Exact paper step result.
    value: ${{ steps.candidate.outputs.manifest-path }}
  candidate-outputs-github-release-artifact-paths:
    description: Exact paper step result.
    value: ${{ steps.candidate.outputs.github-release-artifact-paths }}
  package-name:
    description: package-name node result.
    value: ${{ steps.candidate.outputs.package-name }}
  package-version:
    description: package-version node result.
    value: ${{ steps.candidate.outputs.package-version }}
  controller-plan-json:
    description: Admitted Paper publication controller plan.
    value: ${{ steps.controller-plan.outputs.controller-plan-json }}
  controller-plan-digest:
    description: Admitted Paper publication controller plan.
    value: ${{ steps.controller-plan.outputs.controller-plan-digest }}
  controller-plan-artifact:
    description: Admitted Paper publication controller plan.
    value: ${{ steps.controller-plan.outputs.controller-plan-artifact }}
  controller-plan-outcome:
    description: Whether the source-bound controller plan was emitted.
    value: ${{ steps.controller-plan.outcome }}
