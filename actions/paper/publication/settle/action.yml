name: settle-publication
description: Paper settle publication.
inputs:
  request-json:
    description: request-json
    required: true
  candidate-json:
    description: candidate-json
    required: true
  publication-json:
    description: publication-json
    required: true
  target-json:
    description: target-json
    required: true
  token:
    description: token
    required: true
  plan-outcome:
    description: plan-outcome
    required: true
  publish-outcome:
    description: publish-outcome
    required: true
  promote-outcome:
    description: promote-outcome
    required: true
runs:
  using: composite
  steps:
    - name: Read back publication and capture downstream work
      id: observe
      if: ${{ !fromJSON(inputs.request-json).dry-run && inputs.promote-outcome ==
        'success' }}
      uses: ./.buildchain/runtime/actions/paper/publication/observe
      with:
        candidate-json: ${{ inputs.candidate-json }}
        publication-json: ${{ inputs.publication-json }}
        target-json: ${{ inputs.target-json }}
        token: ${{ inputs.token }}
    - name: Retain verified publication envelope
      if: ${{ always() && steps.observe.outputs.readback-outcome == 'success' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: paper-upstream-release-${{ fromJSON(inputs.candidate-json).package-version
          }}-${{ fromJSON(inputs.target-json).sha }}
        path: .buildchain/upstream-release.json
        if-no-files-found: error
    - name: Retain configured propagation work
      if: ${{ always() && steps.observe.outputs.propagation-configured == 'true' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ steps.observe.outputs.propagation-work-artifact }}
        path: |
          .buildchain/release-propagation-config.json
          .buildchain/release-propagation-plan.json
          .buildchain/release-propagation-work/*/work.json
          .buildchain/release-propagation-work/*/status.json
        if-no-files-found: error
    - name: Seal complete publication receipt
      id: receipt
      if: ${{ always() && inputs.plan-outcome == 'success' }}
      uses: ./.buildchain/runtime/actions/paper/publication/finalize
      with:
        candidate-json: ${{ inputs.candidate-json }}
        publication-json: ${{ inputs.publication-json || '{}' }}
        observations-json: ${{ toJSON(steps) }}
        publish-outcome: ${{ inputs.publish-outcome }}
        aggregate-outcome: ${{ job.status == 'cancelled' && 'cancelled' ||
          (github.action_status || 'success') == 'success' && 'success' ||
          'failure' }}
    - name: Retain terminal publication receipt
      if: ${{ always() && steps.receipt.outputs.controller-receipt-digest != '' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ steps.receipt.outputs.controller-receipt-artifact }}
        path: .buildchain/paper-controller/receipt.json
        if-no-files-found: error
outputs:
  upstream-release-json:
    description: upstream-release-json
    value: ${{ steps.observe.outputs.upstream-release-json }}
  propagation-work-artifact:
    description: propagation-work-artifact
    value: ${{ steps.observe.outputs.propagation-work-artifact }}
  controller-receipt-json:
    description: controller-receipt-json
    value: ${{ steps.receipt.outputs.controller-receipt-json }}
  controller-receipt-digest:
    description: controller-receipt-digest
    value: ${{ steps.receipt.outputs.controller-receipt-digest }}
  controller-receipt-artifact:
    description: controller-receipt-artifact
    value: ${{ steps.receipt.outputs.controller-receipt-artifact }}
  controller-receipt-status:
    description: controller-receipt-status
    value: ${{ steps.receipt.outputs.controller-receipt-status }}
  controller-receipt-qualifying:
    description: controller-receipt-qualifying
    value: ${{ steps.receipt.outputs.controller-receipt-qualifying }}
