name: warrant-cancel
description: Execute the warrant-cancel cancel capability within its caller job boundary.
inputs:
  runtime-ref:
    description: Exact runtime ref; defaults to this workflow SHA.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-github-token:
    description: Explicit scoped provider credential.
    required: true
outputs:
  cancellation-action:
    description: cancellation-action node result.
    value: ${{ steps.cancel.outputs.cancellation-action }}
  cancellation-receipt-root:
    description: cancellation-receipt-root node result.
    value: ${{ steps.cancel.outputs.cancellation-receipt-root }}
  final-state-root:
    description: final-state-root node result.
    value: ${{ steps.cancel.outputs.final-state-root }}
runs:
  using: composite
  steps:
  - uses: actions/setup-node@v6.4.0
    with:
      node-version: '24'
  - name: Validate queued cancellation intent
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/cancel.mjs" intent
    env:
      TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
      EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
      EXPECTED_CANDIDATE_ID: ${{ fromJSON(inputs.request-json).expected-candidate-id }}
      EXPECTED_SOURCE_HEAD: ${{ fromJSON(inputs.request-json).expected-source-head-sha }}
      OBSERVED_SOURCE_HEAD: ${{ fromJSON(inputs.request-json).observed-source-head-sha }}
      EXPECTED_OLD_STATE_ROOT: ${{ fromJSON(inputs.request-json).expected-old-state-root }}
      EVENT_ACTION: ${{ fromJSON(inputs.request-json).event-action }}
      OUTCOME: ${{ fromJSON(inputs.request-json).outcome }}
      TERMINAL_EVIDENCE_ROOT: ${{ fromJSON(inputs.request-json).terminal-evidence-root }}
  - name: Checkout Buildchain runtime
    uses: actions/checkout@v7.0.0
    with:
      repository: ${{ inputs.runtime-repository }}
      ref: ${{ inputs.runtime-ref }}
      path: .buildchain/runtime
      persist-credentials: false
  - name: Cancel exact queued candidate
    id: cancel
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/cancel.mjs" cancel
    env:
      GITHUB_TOKEN: ${{ inputs.secrets-github-token || github.token }}
      TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
      EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
      EXPECTED_CANDIDATE_ID: ${{ fromJSON(inputs.request-json).expected-candidate-id }}
      EXPECTED_SOURCE_HEAD: ${{ fromJSON(inputs.request-json).expected-source-head-sha }}
      OBSERVED_SOURCE_HEAD: ${{ fromJSON(inputs.request-json).observed-source-head-sha }}
      EXPECTED_OLD_STATE_ROOT: ${{ fromJSON(inputs.request-json).expected-old-state-root }}
      EVENT_ACTION: ${{ fromJSON(inputs.request-json).event-action }}
      OUTCOME: ${{ fromJSON(inputs.request-json).outcome }}
      TERMINAL_EVIDENCE_ROOT: ${{ fromJSON(inputs.request-json).terminal-evidence-root }}
      REASON: ${{ fromJSON(inputs.request-json).reason }}
  - name: Upload queued cancellation evidence
    if: always()
    uses: actions/upload-artifact@v7.0.1
    with:
      name: buildchain-dev-delivery-cancel-${{ fromJSON(inputs.request-json).expected-pr-number }}-${{ fromJSON(inputs.request-json).outcome
        }}
      path: .buildchain/dev-delivery/
      if-no-files-found: error
      retention-days: 30
      overwrite: true
