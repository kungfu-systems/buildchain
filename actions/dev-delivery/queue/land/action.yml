name: Land protected dev PR
description: Owned land node of protected dev delivery.
inputs:
  request-json:
    description: Typed public workflow inputs, serialized once by the caller.
    required: true
  github-token:
    description: Provider token; supplied only in a credentialed job.
    required: false
    default: ""
  needs-json:
    description: Exact dependency job results and admitted output coordinates.
    required: false
    default: "{}"
  native-final-outcome:
    description: Predecessor node native-final-outcome.
    required: false
    default: ""
  boundary-outcome:
    description: Predecessor node boundary-outcome.
    required: false
    default: ""
  boundary-native-outcome:
    description: Predecessor node boundary-native-outcome.
    required: false
    default: ""
  failure-final-outcome:
    description: Predecessor node failure-final-outcome.
    required: false
    default: ""
  predecessors-ok:
    description: Whether prior job steps succeeded; artifact upload and result enforcement still run on failure.
    required: true
outputs:
  merge-evaluated-count:
    description: merge-evaluated-count.
    value: ${{ steps.merge.outputs.evaluated-count }}
  merge-merged-count:
    description: merge-merged-count.
    value: ${{ steps.merge.outputs.merged-count }}
  merge-enqueued-count:
    description: merge-enqueued-count.
    value: ${{ steps.merge.outputs.enqueued-count }}
  merge-action-count:
    description: merge-action-count.
    value: ${{ steps.merge.outputs.action-count }}
  merge-skipped-count:
    description: merge-skipped-count.
    value: ${{ steps.merge.outputs.skipped-count }}
  merge-final-base-sha:
    description: merge-final-base-sha.
    value: ${{ steps.merge.outputs.final-base-sha }}
  merge-admission-state:
    description: merge-admission-state.
    value: ${{ steps.merge.outputs.admission-state }}
  merge-receipt-root:
    description: merge-receipt-root.
    value: ${{ steps.merge.outputs.receipt-root }}
runs:
  using: composite
  steps:
    - name: Run Buildchain dev PR auto-merge
      id: merge
      if:
        inputs.predecessors-ok == 'true' && (fromJSON(inputs.request-json).defer-landing != true &&
        fromJSON(inputs.needs-json).admission.outputs.handoff-required != 'true' &&
        (fromJSON(inputs.request-json).delivery-warrant-mode != 'required' ||
        fromJSON(inputs.needs-json).admission.outputs.already-qualified == 'true' || inputs.native-final-outcome ==
        'success'))
      continue-on-error: true
      uses: ./.buildchain/runtime/actions/dev-delivery/queue/admit-landing
      with:
        runtime-sha: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}
        request-json: ${{ inputs.request-json }}
        branch: ${{ fromJSON(inputs.needs-json).admission.outputs.target-branch }}
        project-cut-proof-root: ${{ fromJSON(inputs.needs-json).admission.outputs.project-cut-proof-root }}
        token: ${{ inputs.github-token || github.token }}
    - name: Upload dev PR auto-merge plan
      if: always() && fromJSON(inputs.request-json).defer-landing != true
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-dev-pr-auto-merge-${{ fromJSON(inputs.needs-json).admission.outputs.branch-artifact }}
        path: .buildchain/dev-pr-auto-merge/result.json
        if-no-files-found: error
    - name: Upload Dev Delivery Warrant evidence
      if: always() && fromJSON(inputs.request-json).delivery-warrant-mode != 'off'
      uses: actions/upload-artifact@v7.0.1
      with:
        name:
          buildchain-dev-delivery-warrant-${{ fromJSON(inputs.needs-json).admission.outputs.branch-artifact }}-${{
          fromJSON(inputs.request-json).expected-pr-number }}
        path: |
          .buildchain/dev-delivery/
          .buildchain/native-transfer/
          .buildchain/finalizer-evidence/
          .buildchain/provider-finalizer-boundary.json
          .buildchain/provider-failure-settlement.json
          .buildchain/provider-heartbeat-receipt.json
          .buildchain/provider-heartbeat-verification.json
        if-no-files-found: error
        retention-days: 30
        overwrite: true
    - name: Enforce targeted admission result
      if: always()
      uses: ./.buildchain/workflow-shell/actions/dev-delivery/queue/complete
      with:
        merge-step-outcome: ${{ steps.merge.outcome }}
        defer-landing: ${{ fromJSON(inputs.request-json).defer-landing }}
        targeted: ${{ steps.merge.outputs.targeted }}
        targeted-ok: ${{ steps.merge.outputs.targeted-ok }}
        warrant-mode: ${{ fromJSON(inputs.request-json).delivery-warrant-mode }}
        boundary-outcome: ${{ inputs.boundary-outcome }}
        native-qualification-outcome: ${{ inputs.native-final-outcome }}
        native-job-outcome: ${{ inputs.boundary-native-outcome }}
        seal-job-outcome: ${{ fromJSON(inputs.needs-json).seal-native-execution.result }}
        heartbeat-job-outcome: ${{ fromJSON(inputs.needs-json).delivery-heartbeat.result }}
        run-native: ${{ fromJSON(inputs.needs-json).admission.outputs.run-native }}
        failure-settlement-outcome: ${{ inputs.failure-final-outcome }}
        already-qualified: ${{ fromJSON(inputs.needs-json).admission.outputs.already-qualified }}
