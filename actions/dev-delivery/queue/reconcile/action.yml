name: merge-queue-reconcile
description: Execute the merge-queue reconcile capability within its caller job boundary.
runs:
  using: composite
  steps:
    - name: Admit source checkout
      id: source-boundary
      if: ${{ always() }}
      uses: ./.buildchain/workflow-shell/actions/build/source/admit
      with:
        source-checkout-outcome: ${{ inputs.source-checkout-outcome }}
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: pnpm
    - name: Install dependencies
      uses: ./.buildchain/workflow-shell/actions/runtime/dependencies/install
      with:
        directory: .
        production: "false"
        ignore-scripts: "false"
    - name: Reconcile declared governance policy
      uses: ./actions/dev-delivery/queue/apply-policy
      with:
        branch: ${{ inputs.branch }}
        apply: ${{ inputs.apply }}
        token: ${{ inputs.token }}
inputs:
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
  branch:
    description: Protected dev branch.
    required: true
  apply:
    description: Apply the resolved governance plan.
    required: true
  token:
    description: Scoped governance credential.
    required: true
