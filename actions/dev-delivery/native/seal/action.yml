name: Native delivery seal
description: Own the seal adapter inside its isolated caller job.
inputs:
  request-json:
    description: Typed public workflow inputs, serialized once by the caller.
    required: true
  needs-json:
    description: Exact dependency job results and admitted output coordinates.
    required: false
    default: "{}"
outputs:
  transfer-root:
    description: transfer-root.
    value: ${{ steps.transfer.outputs.root }}
  transfer-native-outcome:
    description: transfer-native-outcome.
    value: ${{ steps.transfer.outputs.native-outcome }}
runs:
  using: composite
  steps:
    - name: Checkout exact admitted Buildchain seal runtime
      if: ${{ success() }}
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - uses: ./.buildchain/workflow-shell/actions/runtime/environment/prepare
      with:
        directory: .buildchain/runtime
      if: ${{ success() }}
    - name: Download raw native execution output
      if: ${{ success() }}
      uses: actions/download-artifact@v7.0.0
      with:
        name:
          buildchain-dev-delivery-native-raw-${{ github.run_id }}-${{ github.run_attempt }}-${{
          fromJSON(inputs.request-json).expected-pr-number }}
        path: .buildchain/native-raw
    - name: Validate and seal closed native evidence
      id: transfer
      uses: ./.buildchain/runtime/actions/dev-delivery/native/seal-transfer
      with:
        runtime-sha: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}
        runtime-selection-root: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-selection-root }}
        runner-environment: ${{ runner.environment }}
    - name: Upload canonical closed native execution transfer
      if: ${{ success() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name:
          buildchain-dev-delivery-native-sealed-${{ github.run_id }}-${{ github.run_attempt }}-${{
          fromJSON(inputs.request-json).expected-pr-number }}
        path: .buildchain/native-transfer-staging/
        if-no-files-found: error
        retention-days: 30
