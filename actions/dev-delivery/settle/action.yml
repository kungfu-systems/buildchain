name: Settle terminal delivery
description: Owned settle node of protected dev delivery.
inputs:
  request-json:
    description: Typed public workflow inputs, serialized once by the caller.
    required: true
  github-token:
    description: Provider token; supplied only in a credentialed job.
    required: false
    default: ''
  needs-json:
    description: Exact dependency job results and admitted output coordinates.
    required: false
    default: '{}'
  boundary-outcome:
    description: Predecessor node boundary-outcome.
    required: false
    default: ''
  boundary-native-outcome:
    description: Predecessor node boundary-native-outcome.
    required: false
    default: ''
  phase:
    description: Fixed execution domain selected by the owning workflow.
    required: true
  runtime-ref:
    description: Exact terminal runtime ref, supplied by the defining workflow.
    required: false
    default: ''
outputs:
  evidence-integration-proof-root:
    description: evidence-integration-proof-root.
    value: ${{ steps.evidence.outputs.integration-proof-root }}
  close-receipt-root:
    description: close-receipt-root.
    value: ${{ steps.close.outputs.close-receipt-root }}
  close-final-state-root:
    description: close-final-state-root.
    value: ${{ steps.close.outputs.final-state-root }}
  close-successor-wake-json:
    description: close-successor-wake-json.
    value: ${{ steps.close.outputs.successor-wake-json }}
  failure-final-outcome:
    description: failure-final-outcome.
    value: ${{ steps.failure-final.outcome }}
runs:
  using: composite
  steps:
  - uses: actions/setup-node@v6.4.0
    if: ${{ inputs.phase == 'terminal' && (success()) }}
    with:
      node-version: '24'
  - name: Settle the exact independently verified native failure
    id: failure-final
    if: ${{ inputs.phase == 'native-failure' && (success() && (fromJSON(inputs.needs-json).admission.outputs.run-native ==
      'true' && inputs.boundary-outcome == 'success' && inputs.boundary-native-outcome == 'failure')) }}
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/settle.mjs" failure
    env:
      GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      TARGET_BRANCH: ${{ fromJSON(inputs.needs-json).admission.outputs.target-branch }}
  - name: Validate terminal intent
    if: ${{ inputs.phase == 'terminal' && (success()) }}
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/settle.mjs" intent
    env:
      OUTCOME: ${{ fromJSON(inputs.request-json).outcome }}
      TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
      EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
  - name: Checkout Buildchain runtime
    if: ${{ inputs.phase == 'terminal' && (success()) }}
    uses: actions/checkout@v7.0.0
    with:
      repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
      ref: ${{ inputs.runtime-ref }}
      path: .buildchain/runtime
      persist-credentials: false
  - uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    if: ${{ inputs.phase == 'terminal' && success() }}
    with:
      directory: .buildchain/runtime
  - name: Observe active Warrant authority
    if: ${{ inputs.phase == 'terminal' && (success()) }}
    shell: bash
    run: node .buildchain/runtime/packages/core/dev-delivery/commands/dev-delivery-warrant.mjs observe --repository "${GITHUB_REPOSITORY}"
      --branch "${TARGET_BRANCH}" --output .buildchain/dev-delivery/observation.json
    env:
      GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
  - name: Resolve terminal settlement mode
    if: ${{ inputs.phase == 'terminal' && (success()) }}
    id: settlement
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/settle.mjs" mode
    env:
      EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
      EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
  - name: Seal exact terminal evidence
    id: evidence
    if: ${{ inputs.phase == 'terminal' && (success() && (steps.settlement.outputs.mode == 'active' || fromJSON(inputs.request-json).outcome
      != 'merged')) }}
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/settle.mjs" evidence
    env:
      OUTCOME: ${{ fromJSON(inputs.request-json).outcome }}
      TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
      CURRENT_BASE: ${{ fromJSON(inputs.request-json).current-base-sha }}
      REPLAY_TREE: ${{ fromJSON(inputs.request-json).replay-tree-sha }}
      MERGE_GROUP_HEAD: ${{ fromJSON(inputs.request-json).merge-group-head-sha }}
      MERGE_GROUP_TREE: ${{ fromJSON(inputs.request-json).merge-group-tree-sha }}
      CONTEXT_ROOTS: ${{ fromJSON(inputs.request-json).required-context-roots-json }}
      TERMINAL_EVIDENCE_ROOT: ${{ fromJSON(inputs.request-json).terminal-evidence-root }}
  - name: Settle terminal delivery event
    if: ${{ inputs.phase == 'terminal' && (success()) }}
    id: close
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/settle.mjs" close
    env:
      GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
      EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
      EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
      OUTCOME: ${{ fromJSON(inputs.request-json).outcome }}
      EVIDENCE_ROOT: ${{ steps.evidence.outputs.evidence-root }}
      REASON: ${{ fromJSON(inputs.request-json).reason }}
      SETTLEMENT_MODE: ${{ steps.settlement.outputs.mode }}
  - name: Wake exact queued successor
    if: ${{ inputs.phase == 'terminal' && (success() && (steps.close.outcome == 'success' && steps.close.outputs.successor-wake-json
      != 'null')) }}
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/settle.mjs" wake
    env:
      GH_TOKEN: ${{ inputs.github-token || github.token }}
      SUCCESSOR_WAKE: ${{ steps.close.outputs.successor-wake-json }}
  - name: Upload terminal Warrant evidence
    if: ${{ inputs.phase == 'terminal' && (always()) }}
    uses: actions/upload-artifact@v7.0.1
    with:
      name: buildchain-dev-delivery-close-${{ fromJSON(inputs.request-json).expected-pr-number }}-${{ fromJSON(inputs.request-json).outcome
        }}
      path: .buildchain/dev-delivery/
      if-no-files-found: error
      retention-days: 30
      overwrite: true
