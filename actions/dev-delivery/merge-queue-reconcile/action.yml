name: merge-queue-reconcile
description: Execute the merge-queue reconcile capability within its caller job boundary.
runs:
  using: composite
  steps:
    - name: Require successful source checkout
      id: source-boundary
      if: ${{ inputs.source-checkout-outcome != 'success' }}
      shell: bash
      run: exit 1
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash -e {0}
    - name: Reconcile declared policy
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/merge-queue.mjs" reconcile
inputs:
  source-checkout-outcome:
    description: Actual preceding source checkout outcome.
    required: true
