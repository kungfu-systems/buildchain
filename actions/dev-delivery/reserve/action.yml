name: Reserve delivery turn
description: Owned reserve node of protected dev delivery.
inputs:
  request-json:
    description: Typed public workflow inputs, serialized once by the caller.
    required: true
  github-token:
    description: Provider token; supplied only in a credentialed job.
    required: false
    default: ''
  proof-outcome:
    description: Predecessor node proof-outcome.
    required: false
    default: ''
  target-branch:
    description: Predecessor node target-branch.
    required: false
    default: ''
  proof-source-proof-root:
    description: Predecessor node proof-source-proof-root.
    required: false
    default: ''
  qualify-outcome:
    description: Predecessor node qualify-outcome.
    required: false
    default: ''
  predecessors-ok:
    description: Whether prior job steps succeeded; reservation reporting still runs on failure.
    required: true
outputs:
  warrant-receipt-root:
    description: warrant-receipt-root.
    value: ${{ steps.warrant.outputs.warrant-receipt-root }}
  warrant-state-root:
    description: warrant-state-root.
    value: ${{ steps.warrant.outputs.warrant-state-root }}
  warrant-state-commit:
    description: warrant-state-commit.
    value: ${{ steps.warrant.outputs.warrant-state-commit }}
  warrant-native-proof-root:
    description: warrant-native-proof-root.
    value: ${{ steps.warrant.outputs.native-proof-root }}
  warrant-decision-root:
    description: warrant-decision-root.
    value: ${{ steps.warrant.outputs.decision-root }}
  warrant-qualification-receipt-root:
    description: warrant-qualification-receipt-root.
    value: ${{ steps.warrant.outputs.qualification-receipt-root }}
  warrant-handoff-required:
    description: warrant-handoff-required.
    value: ${{ steps.warrant.outputs.handoff-required }}
  warrant-handoff-dispatched:
    description: warrant-handoff-dispatched.
    value: ${{ steps.warrant.outputs.handoff-dispatched }}
  warrant-already-qualified:
    description: warrant-already-qualified.
    value: ${{ steps.warrant.outputs.already-qualified }}
  warrant-outcome:
    description: warrant-outcome.
    value: ${{ steps.warrant.outcome }}
runs:
  using: composite
  steps:
  - name: Submit qualified delivery candidate
    id: submit
    if: inputs.predecessors-ok == 'true' && (fromJSON(inputs.request-json).delivery-warrant-mode != 'off' && inputs.proof-outcome
      == 'success')
    continue-on-error: true
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/submission.mjs" submit
    env:
      GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      TARGET_BRANCH: ${{ inputs.target-branch }}
      EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
      EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
      SOURCE_ROOT: ${{ fromJSON(inputs.request-json).source-root }}
      SOURCE_IDENTITY_ROOT: ${{ fromJSON(inputs.request-json).source-identity-root }}
      SOURCE_PATCH_ROOT: ${{ fromJSON(inputs.request-json).source-patch-root }}
      SOURCE_PROOF_ROOT: ${{ inputs.proof-source-proof-root }}
      SOURCE_WORKFLOW_RUN_ID: ${{ fromJSON(inputs.request-json).source-workflow-run-id }}
      PLAN_ROOT: ${{ fromJSON(inputs.request-json).plan-root }}
      CLOSURE_ROOT: ${{ fromJSON(inputs.request-json).closure-root }}
      DEPENDENCY_ROOT: ${{ fromJSON(inputs.request-json).dependency-root }}
      TOOLCHAIN_ROOT: ${{ fromJSON(inputs.request-json).toolchain-root }}
      ENVIRONMENT_ROOT: ${{ fromJSON(inputs.request-json).environment-root }}
      AFFECTED_PATHS: ${{ fromJSON(inputs.request-json).affected-paths-json }}
      SHARD_ROOTS: ${{ fromJSON(inputs.request-json).shard-evidence-roots-json }}
      NATIVE_COMMAND: ${{ fromJSON(inputs.request-json).native-command }}
      NATIVE_COMMAND_ROOT: ${{ fromJSON(inputs.request-json).native-command-root }}
      RELEASE_BLOCKER_PRIORITY: ${{ fromJSON(inputs.request-json).release-blocker-priority-json }}
      DELIVERY_CLASS: ${{ fromJSON(inputs.request-json).delivery-class }}
      DELIVERY_PRIORITY: ${{ fromJSON(inputs.request-json).delivery-priority }}
      WARRANT_MODE: ${{ fromJSON(inputs.request-json).delivery-warrant-mode }}
  - name: Select exact Delivery Warrant
    id: warrant
    if: fromJSON(inputs.request-json).delivery-warrant-mode == 'required' && steps.submit.outcome == 'success'
    continue-on-error: true
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/reserve.mjs" select
    env:
      GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      TARGET_BRANCH: ${{ inputs.target-branch }}
      LEASE_SECONDS: ${{ fromJSON(inputs.request-json).warrant-lease-seconds }}
      EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
      EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
      HANDOFF_WORKFLOW_ID: ${{ fromJSON(inputs.request-json).handoff-workflow-id }}
      HEARTBEAT_SECONDS: ${{ fromJSON(inputs.request-json).native-heartbeat-seconds }}
  - name: Upload immutable admission state for native execution
    if: fromJSON(inputs.request-json).delivery-warrant-mode == 'required' && steps.warrant.outcome == 'success' && steps.warrant.outputs.handoff-required
      != 'true'
    uses: actions/upload-artifact@v7.0.1
    with:
      name: buildchain-dev-delivery-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.request-json).expected-pr-number
        }}
      path: .buildchain/dev-delivery/
      if-no-files-found: error
      retention-days: 1
  - name: Enforce reservation result
    if: always()
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/dev-delivery/nodes/outcome.mjs" reserve
    env:
      WARRANT_MODE: ${{ fromJSON(inputs.request-json).delivery-warrant-mode }}
      QUALIFY_OUTCOME: ${{ inputs.qualify-outcome }}
      SUBMIT_OUTCOME: ${{ steps.submit.outcome }}
      WARRANT_OUTCOME: ${{ steps.warrant.outcome }}
      HANDOFF_REQUIRED: ${{ steps.warrant.outputs.handoff-required }}
      HANDOFF_DISPATCHED: ${{ steps.warrant.outputs.handoff-dispatched }}
