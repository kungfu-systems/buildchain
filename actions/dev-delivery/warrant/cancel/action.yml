name: warrant-cancel
description: Execute the warrant-cancel cancel capability within its caller job boundary.
inputs:
  runtime-ref:
    description: Exact runtime ref; defaults to this workflow SHA.
    required: true
  runtime-repository:
    description: Runtime repository.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
  secrets-github-token:
    description: Explicit scoped provider credential.
    required: true
outputs:
  cancellation-action:
    description: cancellation-action node result.
    value: ${{ steps.cancel.outputs.cancellation-action }}
  cancellation-receipt-root:
    description: cancellation-receipt-root node result.
    value: ${{ steps.cancel.outputs.cancellation-receipt-root }}
  final-state-root:
    description: final-state-root node result.
    value: ${{ steps.cancel.outputs.final-state-root }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Cancel exact queued candidate
      id: cancel
      uses: ./.buildchain/runtime/actions/dev-delivery/warrant/cancel-queued
      with:
        runtime-ref: ${{ inputs.runtime-ref }}
        request-json: ${{ inputs.request-json }}
        token: ${{ inputs.secrets-github-token || github.token }}
    - name: Upload queued cancellation evidence
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-dev-delivery-cancel-${{
          fromJSON(inputs.request-json).expected-pr-number }}-${{
          fromJSON(inputs.request-json).outcome }}
        path: .buildchain/dev-delivery/
        if-no-files-found: error
        retention-days: 30
        overwrite: true
