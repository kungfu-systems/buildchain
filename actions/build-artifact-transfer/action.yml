name: build-artifact-transfer
description: "Shared build steps owned by Buildchain artifact transport maintainers"
inputs:
  transfer-json:
    description: "Resolved transfer-json; supplied by the build backbone"
    required: true
  platform-json:
    description: "Resolved platform-json; supplied by the build backbone"
    required: true
  plan-json:
    description: "Resolved plan-json; supplied by the build backbone"
    required: true
  relay-upload-role:
    description: "Resolved relay-upload-role; supplied by the build backbone"
    required: true
  relay-role:
    description: "Resolved relay-role; supplied by the build backbone"
    required: true
  source-json:
    description: "Resolved source-json; supplied by the build backbone"
    required: true
  artifact-name:
    description: "Resolved artifact-name; supplied by the build backbone"
    required: true
runs:
  using: composite
  steps:
    - name: Configure AWS credentials for artifact relay upload
      if: ${{ fromJSON(inputs.transfer-json).mode == 's3-to-github-artifacts' && fromJSON(inputs.platform-json).githubHosted != true }}
      uses: aws-actions/configure-aws-credentials@v6.1.0
      with:
        role-to-assume: ${{ fromJSON(inputs.plan-json).environment.transfer.upload_role_arn || inputs.relay-upload-role || inputs.relay-role }}
        aws-region: ${{ fromJSON(inputs.transfer-json).s3-region }}
        audience: ${{ fromJSON(inputs.transfer-json).oidc-audience }}

    - name: Upload payload to S3 artifact relay
      id: artifact-relay
      if: ${{ fromJSON(inputs.transfer-json).mode == 's3-to-github-artifacts' && fromJSON(inputs.platform-json).githubHosted != true }}
      shell: bash
      run: node .buildchain/runtime/scripts/artifact-relay-s3.mjs upload
      env:
        BUILDCHAIN_ARTIFACT_RELAY_BUCKET: ${{ fromJSON(inputs.transfer-json).s3-bucket }}
        BUILDCHAIN_ARTIFACT_RELAY_REGION: ${{ fromJSON(inputs.transfer-json).s3-region }}
        BUILDCHAIN_ARTIFACT_RELAY_PREFIX: ${{ fromJSON(inputs.transfer-json).s3-prefix }}
        BUILDCHAIN_ARTIFACT_RELAY_SOURCE_SHA: ${{ fromJSON(inputs.source-json).publish-source-sha }}
        BUILDCHAIN_ARTIFACT_RELAY_PLATFORM_ID: ${{ fromJSON(inputs.platform-json).id }}
        BUILDCHAIN_ARTIFACT_RELAY_PLATFORM_NAME: ${{ fromJSON(inputs.platform-json).name }}
        BUILDCHAIN_ARTIFACT_RELAY_MANIFEST_PATH: .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/relay-manifest.json
        BUILDCHAIN_ARTIFACT_RELAY_PAYLOAD_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        BUILDCHAIN_ARTIFACT_RELAY_PAYLOAD_PATHS: |
          ${{ fromJSON(inputs.plan-json).artifacts.paths }}
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/manifest.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/summary.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/diagnostics.json
        BUILDCHAIN_ARTIFACT_RELAY_MANIFEST_ARTIFACT_NAME: ${{ fromJSON(inputs.plan-json).artifacts.name }}-manifest-${{ fromJSON(inputs.platform-json).id }}-${{ fromJSON(inputs.source-json).publish-source-sha }}
        BUILDCHAIN_ARTIFACT_RELAY_MANIFEST_PATHS: |
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/manifest.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/summary.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/diagnostics.json
        BUILDCHAIN_ARTIFACT_RELAY_DIAGNOSTICS_ARTIFACT_NAME: ${{ fromJSON(inputs.plan-json).artifacts.name }}-diagnostics-${{ fromJSON(inputs.platform-json).id }}-${{ fromJSON(inputs.source-json).publish-source-sha }}
        BUILDCHAIN_ARTIFACT_RELAY_DIAGNOSTICS_PATHS: |
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/diagnostics.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/diagnostics-manifest.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/source-checkout.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/compiler-cache-preparation.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/events.jsonl
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/process-summary.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/process-samples.jsonl
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/verify-substages.json
        BUILDCHAIN_ARTIFACT_RELAY_CREDENTIAL_INPUT_ARTIFACT_NAME: ${{ fromJSON(inputs.plan-json).artifacts.name }}-credential-island-input-${{ fromJSON(inputs.platform-json).id }}-${{ fromJSON(inputs.source-json).publish-source-sha }}
        BUILDCHAIN_ARTIFACT_RELAY_CREDENTIAL_INPUT_PATHS: ${{ fromJSON(inputs.platform-json).id == fromJSON(inputs.plan-json).build.macos_signing.platform && fromJSON(inputs.plan-json).build.macos_signing.app_path != '' && format('.buildchain/credential-island/{0}', fromJSON(inputs.platform-json).id) || '' }}

    - name: Upload artifact relay manifest
      if: ${{ fromJSON(inputs.transfer-json).mode == 's3-to-github-artifacts' && fromJSON(inputs.platform-json).githubHosted != true }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ fromJSON(inputs.plan-json).artifacts.name }}-relay-manifest-${{ fromJSON(inputs.platform-json).id }}-${{ fromJSON(inputs.source-json).publish-source-sha }}
        path: .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/relay-manifest.json
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.plan-json).build.artifacts.retention_days }}

    - name: Upload deterministic artifact
      if: ${{ fromJSON(inputs.transfer-json).mode == 'github-artifacts' || fromJSON(inputs.platform-json).githubHosted == true }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ fromJSON(inputs.plan-json).artifacts.paths }}
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/manifest.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/summary.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/diagnostics.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.plan-json).build.artifacts.retention_days }}
        compression-level: ${{ fromJSON(inputs.plan-json).build.artifacts.compression_level }}
    - name: Upload artifact manifest
      if: ${{ fromJSON(inputs.transfer-json).mode == 'github-artifacts' || fromJSON(inputs.platform-json).githubHosted == true }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ fromJSON(inputs.plan-json).artifacts.name }}-manifest-${{ fromJSON(inputs.platform-json).id }}-${{ fromJSON(inputs.source-json).publish-source-sha }}
        path: |
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/manifest.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/summary.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/diagnostics.json
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.plan-json).build.artifacts.retention_days }}

    - name: Upload diagnostics artifact
      if: ${{ fromJSON(inputs.transfer-json).mode == 'github-artifacts' || fromJSON(inputs.platform-json).githubHosted == true }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ fromJSON(inputs.plan-json).artifacts.name }}-diagnostics-${{ fromJSON(inputs.platform-json).id }}-${{ fromJSON(inputs.source-json).publish-source-sha }}
        path: |
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/diagnostics.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/diagnostics-manifest.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/source-checkout.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/compiler-cache-preparation.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/events.jsonl
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/process-summary.json
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/process-samples.jsonl
          .buildchain/artifacts/${{ fromJSON(inputs.platform-json).id }}/verify-substages.json
        if-no-files-found: error
        retention-days: ${{ fromJSON(inputs.plan-json).build.artifacts.retention_days }}
