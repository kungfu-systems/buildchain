name: reconcile-adopters
description: Require exactly one consistent report for every declared platform.
inputs:
  request-json:
    description: Current adopter qualification request.
    required: true
  workflow-sha:
    description: Exact defining runtime commit.
    required: true
runs:
  using: composite
  steps:
    - name: Prepare the defining runtime
      id: core
      uses: ./.buildchain/workflow-shell/actions/runtime/prepare
    - name: Download current run platform reports
      uses: actions/download-artifact@v7.0.0
      with:
        pattern: v4-adopter-delivery-${{ fromJSON(inputs.request-json).consumer }}-*-${{ github.sha }}
        path: .buildchain/platform-reports
    - name: Reconcile exact three-platform reports
      shell: bash
      env:
        BUILDCHAIN_ADOPTER_REQUEST_JSON: ${{ inputs.request-json }}
        BUILDCHAIN_WORKFLOW_SHA: ${{ inputs.workflow-sha }}
        BUILDCHAIN_ACTION_PATH: ${{ github.action_path }}
        BUILDCHAIN_NODE: ${{ steps.core.outputs.node-path }}
      run: '"$BUILDCHAIN_NODE" "$BUILDCHAIN_ACTION_PATH/../../../packages/core/adoption/nodes/adopter.mjs" reconcile'
    - name: Preserve rooted qualification
      uses: actions/upload-artifact@v7.0.1
      with:
        name: v4-adopter-delivery-qualification-${{ fromJSON(inputs.request-json).consumer }}-${{ github.sha }}
        path: .buildchain/adopter-delivery-qualification.json
        if-no-files-found: error
