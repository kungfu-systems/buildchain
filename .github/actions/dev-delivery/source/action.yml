name: Admit exact source
description: Owned source node of protected dev delivery.
inputs:
  request-json:
    description: Typed public workflow inputs, serialized once by the caller.
    required: true
  github-token:
    description: Provider token; supplied only in a credentialed job.
    required: false
    default: ''
outputs:
  runtime-sha:
    description: runtime-sha.
    value: ${{ steps.runtime.outputs.sha }}
  runtime-root:
    description: runtime-root.
    value: ${{ steps.runtime.outputs.root }}
  target-branch:
    description: target-branch.
    value: ${{ steps.target.outputs.branch }}
  target-branch-artifact:
    description: target-branch-artifact.
    value: ${{ steps.target.outputs.branch-artifact }}
  proof-source-proof-root:
    description: proof-source-proof-root.
    value: ${{ steps.proof.outputs.source-proof-root }}
  project-cut-proof-root:
    description: project-cut-proof-root.
    value: ${{ steps.project-cut.outputs.proof-root }}
  proof-outcome:
    description: proof-outcome.
    value: ${{ steps.proof.outcome }}
  qualify-outcome:
    description: qualify-outcome.
    value: ${{ steps.qualify.outcome }}
runs:
  using: composite
  steps:
    - name: Resolve target branch
      id: target
      shell: bash
      run: |
        target_branch="${INPUT_TARGET_BRANCH:-${GITHUB_REF_NAME}}"
        case "${target_branch}" in
          dev/v*/v*) ;;
          *)
            echo "::error::target-branch must be a semver dev branch such as dev/v4/v4.N, got: ${target_branch}"
            exit 1
            ;;
        esac
        echo "branch=${target_branch}" >> "${GITHUB_OUTPUT}"
        echo "branch-artifact=${target_branch//\//-}" >> "${GITHUB_OUTPUT}"
        case "${WARRANT_MODE}" in
          off|shadow|required) ;;
          *)
            echo "::error::delivery-warrant-mode must be off, shadow, or required"
            exit 1
            ;;
        esac
        if [ "${WARRANT_MODE}" != "off" ] && { [ "${EXPECTED_PR}" = "0" ] || [ -z "${EXPECTED_HEAD}" ]; }; then
          echo "::error::delivery Warrant rollout requires an exact PR number and head"
          exit 1
        fi
        if [ "${WARRANT_MODE}" = "required" ] && [ "${DRY_RUN}" = "true" ]; then
          echo "::error::required delivery Warrant mode cannot be combined with dry-run"
          exit 1
        fi
      env:
        INPUT_TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
        WARRANT_MODE: ${{ fromJSON(inputs.request-json).delivery-warrant-mode }}
        EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
        EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
        DRY_RUN: ${{ fromJSON(inputs.request-json).dry-run }}

    - name: Validate native qualification contract before Warrant admission
      if: fromJSON(inputs.request-json).delivery-warrant-mode == 'required'
      shell: bash
      run: |
        case "${DELIVERY_CLASS}" in
          native-proof-required|cross-platform|release)
            if [[ ! "${ENVIRONMENT_ROOT}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::environment-root must be an exact sha256 content root before required native Warrant admission"
              exit 1
            fi
            ;;
          non-native-fast) ;;
          *)
            echo "::error::unsupported delivery-class ${DELIVERY_CLASS}"
            exit 1
            ;;
        esac
      env:
        DELIVERY_CLASS: ${{ fromJSON(inputs.request-json).delivery-class }}
        ENVIRONMENT_ROOT: ${{ fromJSON(inputs.request-json).environment-root }}

    - name: Require explicit v4 delivery runtime authority
      shell: bash
      run: |
        case "${BUILDCHAIN_REF}" in
          v4|v4-alpha) ;;
          [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
          train/v4/v4.0/*)
            if [[ ! "${BUILDCHAIN_REF}" =~ ^train/v4/v4\.0/[a-z0-9][a-z0-9._-]*$ ]]; then
              echo "::error::trusted v4 train selector has an invalid capability component"
              exit 1
            fi
            ;;
          *) [[ "${BUILDCHAIN_REF}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::buildchain-ref must be an exact immutable SHA, v4, v4-alpha, or train/v4/v4.0/<capability>"; exit 1; } ;;
        esac
      env:
        BUILDCHAIN_REF: ${{ fromJSON(inputs.request-json).buildchain-ref }}

    - name: Checkout Buildchain runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.request-json).buildchain-ref }}
        path: .buildchain/runtime
        persist-credentials: false

    - name: Root the once-resolved Buildchain runtime
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        runtime_sha="$(git -C .buildchain/runtime rev-parse --verify 'HEAD^{commit}')"
        if [[ ! "${runtime_sha}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::resolved Buildchain runtime is not an exact commit SHA"
          exit 1
        fi
        if [[ "${BUILDCHAIN_REF}" =~ ^[0-9a-f]{40}$ && "${runtime_sha}" != "${BUILDCHAIN_REF}" ]]; then echo "::error::resolved Buildchain runtime SHA does not match the immutable selector"; exit 1; fi
        mkdir -p .buildchain/dev-delivery
        jq -n \
          --arg repository "${BUILDCHAIN_REPOSITORY}" \
          --arg selector "${BUILDCHAIN_REF}" \
          --arg sha "${runtime_sha}" \
          '{schema:"kungfu.buildchain.dev-delivery-runtime-selection/v1",repository:$repository,selector:$selector,resolvedSha:$sha}' \
          > .buildchain/dev-delivery/runtime-selection.json
        runtime_root="sha256:$(sha256sum .buildchain/dev-delivery/runtime-selection.json | cut -d' ' -f1)"
        {
          echo "sha=${runtime_sha}"
          echo "root=${runtime_root}"
        } >> "${GITHUB_OUTPUT}"
      env:
        BUILDCHAIN_REPOSITORY: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        BUILDCHAIN_REF: ${{ fromJSON(inputs.request-json).buildchain-ref }}

    - name: Reject a locked protected branch before Warrant selection
      if: fromJSON(inputs.request-json).delivery-warrant-mode == 'required'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        TARGET_BRANCH: ${{ steps.target.outputs.branch }}
      run: |
        set -euo pipefail
        encoded_branch="${TARGET_BRANCH//\//%2F}"
        protection_error="$(mktemp)"
        if protection="$(gh api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch/protection" 2>"$protection_error")"; then
          locked="$(jq -r '.lock_branch.enabled // false' <<<"$protection")"
        elif grep -q 'HTTP 404' "$protection_error"; then
          locked=false
        else
          cat "$protection_error" >&2
          exit 1
        fi
        rm -f "$protection_error"
        applied_rules="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$encoded_branch")"
        if jq -e 'any(.[]?; .type == "update")' <<<"$applied_rules" >/dev/null; then
          locked=true
        fi
        if [ "$locked" = "true" ]; then
          echo "::error::Protected branch $TARGET_BRANCH is locked by classic protection or an applied update rule; native merge queue admission cannot change a locked branch"
          exit 1
        fi

    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"

    - name: Verify optional exact Project Cut replay proof
      id: project-cut
      if: fromJSON(inputs.request-json).project-cut-proof-json != ''
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .buildchain/dev-delivery
        printf '%s\n' "${PROJECT_CUT_PROOF_JSON}" > .buildchain/dev-delivery/project-cut-proof.json
        node .buildchain/runtime/scripts/dev-delivery-proof.mjs verify-replay \
          --source-proof .buildchain/dev-delivery/project-cut-proof.json \
          --output .buildchain/dev-delivery/project-cut-verification.json
        jq -e '.ok == true and .reason == "exact-project-cut-replay"' \
          .buildchain/dev-delivery/project-cut-verification.json >/dev/null
        echo "path=.buildchain/dev-delivery/project-cut-proof.json" >> "${GITHUB_OUTPUT}"
        echo "proof-root=$(jq -er '.proofRoot' .buildchain/dev-delivery/project-cut-proof.json)" >> "${GITHUB_OUTPUT}"
      env:
        PROJECT_CUT_PROOF_JSON: ${{ fromJSON(inputs.request-json).project-cut-proof-json }}

    - name: Qualify exact source before scheduling
      id: qualify
      if: fromJSON(inputs.request-json).delivery-warrant-mode != 'off'
      continue-on-error: true
      shell: bash
      run: |
        args=(
          --repository "${GITHUB_REPOSITORY}"
          --branch "${TARGET_BRANCH}"
          --pull-request "${EXPECTED_PR}"
          --expected-head "${EXPECTED_HEAD}"
          --landing-mode queue
          --qualification-only
          --source-patch-root "${SOURCE_PATCH_ROOT}"
          --output .buildchain/dev-delivery/source-admission.json
        )
        if [ -n "${PROJECT_CUT_PROOF_PATH}" ]; then
          args+=(--project-cut-proof "${PROJECT_CUT_PROOF_PATH}")
        fi
        if [ "${WARRANT_MODE}" = "required" ] || { [ "${WARRANT_MODE}" = "shadow" ] && [ "${DRY_RUN}" != "true" ]; }; then
          args+=(--execute)
        fi
        node .buildchain/runtime/scripts/dev-pr-auto-merge.mjs "${args[@]}"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
        EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
        WARRANT_MODE: ${{ fromJSON(inputs.request-json).delivery-warrant-mode }}
        BUILDCHAIN_DEV_PR_WARRANT_MODE: ${{ fromJSON(inputs.request-json).delivery-warrant-mode == 'required' && 'required' || 'off' }}
        DRY_RUN: ${{ fromJSON(inputs.request-json).dry-run }}
        SOURCE_PATCH_ROOT: ${{ fromJSON(inputs.request-json).source-patch-root }}
        PROJECT_CUT_PROOF_PATH: ${{ steps.project-cut.outputs.path }}
        BUILDCHAIN_DEV_PR_DIAGNOSTIC_CONTEXT: ${{ fromJSON(inputs.request-json).diagnostic-context }}
        BUILDCHAIN_DEV_PR_REQUIRED_CHECKS: ${{ fromJSON(inputs.request-json).required-status-checks }}
        BUILDCHAIN_DEV_PR_READY_LABEL: ${{ fromJSON(inputs.request-json).ready-label }}
        BUILDCHAIN_DEV_PR_BLOCK_LABELS: ${{ fromJSON(inputs.request-json).block-labels }}
        BUILDCHAIN_DEV_PR_ALLOWED_HEAD_PREFIXES: ${{ fromJSON(inputs.request-json).allowed-head-prefixes }}
        BUILDCHAIN_DEV_PR_REQUIRE_APPROVAL: ${{ fromJSON(inputs.request-json).require-approval }}
        BUILDCHAIN_DEV_PR_SAME_REPOSITORY_ONLY: ${{ fromJSON(inputs.request-json).same-repository-only }}
        BUILDCHAIN_DEV_PR_QUEUE_ADMISSION_CONTEXT: ${{ fromJSON(inputs.request-json).queue-admission-context }}

    - name: Seal Source Qualification Proof
      id: proof
      if: fromJSON(inputs.request-json).delivery-warrant-mode != 'off' && steps.qualify.outcome == 'success'
      shell: bash
      run: |
        receipt_root="$(jq -er '.receiptRoot' .buildchain/dev-delivery/source-admission.json)"
        evidence_roots="$(jq -cn --arg root "${receipt_root}" '[$root]')"
        node .buildchain/runtime/scripts/dev-delivery-proof.mjs source \
          --repository "${GITHUB_REPOSITORY}" \
          --branch "${TARGET_BRANCH}" \
          --source-identity-root "${SOURCE_IDENTITY_ROOT}" \
          --source-head "${EXPECTED_HEAD}" \
          --source-patch-root "${SOURCE_PATCH_ROOT}" \
          --plan-root "${PLAN_ROOT}" \
          --closure-root "${CLOSURE_ROOT}" \
          --dependency-root "${DEPENDENCY_ROOT}" \
          --toolchain-root "${TOOLCHAIN_ROOT}" \
          --affected-paths-json "${AFFECTED_PATHS}" \
          --shard-evidence-roots-json "${evidence_roots}" \
          --qualified-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --output .buildchain/dev-delivery/source-proof.json
        echo "source-proof-root=$(jq -er '.proofRoot' .buildchain/dev-delivery/source-proof.json)" >> "${GITHUB_OUTPUT}"
      env:
        TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
        SOURCE_IDENTITY_ROOT: ${{ fromJSON(inputs.request-json).source-identity-root }}
        SOURCE_PATCH_ROOT: ${{ fromJSON(inputs.request-json).source-patch-root }}
        PLAN_ROOT: ${{ fromJSON(inputs.request-json).plan-root }}
        CLOSURE_ROOT: ${{ fromJSON(inputs.request-json).closure-root }}
        DEPENDENCY_ROOT: ${{ fromJSON(inputs.request-json).dependency-root }}
        TOOLCHAIN_ROOT: ${{ fromJSON(inputs.request-json).toolchain-root }}
        AFFECTED_PATHS: ${{ fromJSON(inputs.request-json).affected-paths-json }}
