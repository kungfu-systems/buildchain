name: Qualify delivery evidence
description: Owned qualify node of protected dev delivery.
inputs:
  request-json:
    description: Typed public workflow inputs, serialized once by the caller.
    required: true
  github-token:
    description: Provider token; supplied only in a credentialed job.
    required: false
    default: ''
  needs-json:
    description: Exact dependency job results and admitted output coordinates.
    required: false
    default: '{}'
outputs:
  native-final-native-proof-root:
    description: native-final-native-proof-root.
    value: ${{ steps.native-final.outputs.native-proof-root }}
  native-final-decision-root:
    description: native-final-decision-root.
    value: ${{ steps.native-final.outputs.decision-root }}
  native-final-qualification-receipt-root:
    description: native-final-qualification-receipt-root.
    value: ${{ steps.native-final.outputs.qualification-receipt-root }}
  boundary-transfer-root:
    description: boundary-transfer-root.
    value: ${{ steps.boundary.outputs.transfer-root }}
  boundary-root:
    description: boundary-root.
    value: ${{ steps.boundary.outputs.boundary-root }}
  boundary-outcome:
    description: boundary-outcome.
    value: ${{ steps.boundary.outcome }}
  boundary-native-outcome:
    description: boundary-native-outcome.
    value: ${{ steps.boundary.outputs.native-outcome }}
  native-final-outcome:
    description: native-final-outcome.
    value: ${{ steps.native-final.outcome }}
runs:
  using: composite
  steps:
    - name: Checkout trusted Buildchain finalizer runtime
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}
        path: .buildchain/runtime
        persist-credentials: false

    - name: Verify exact admitted Buildchain finalizer runtime
      shell: bash
      run: |
        test "$(git -C .buildchain/runtime rev-parse --verify 'HEAD^{commit}')" = "${ADMITTED_RUNTIME_SHA}"
      env:
        ADMITTED_RUNTIME_SHA: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}

    - name: Download immutable admission state
      if: fromJSON(inputs.request-json).delivery-warrant-mode == 'required' && fromJSON(inputs.needs-json).admission.outputs.handoff-required != 'true'
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-dev-delivery-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.request-json).expected-pr-number }}
        path: .buildchain/dev-delivery

    - name: Download native execution transfer
      if: fromJSON(inputs.needs-json).admission.outputs.run-native == 'true'
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-dev-delivery-native-sealed-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.request-json).expected-pr-number }}
        path: .buildchain/native-transfer

    - name: Download independent provider heartbeat receipt
      if: fromJSON(inputs.needs-json).admission.outputs.run-native == 'true'
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-dev-delivery-heartbeat-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.request-json).expected-pr-number }}
        path: .buildchain

    - name: Prove fresh provider finalizer job and runner boundary
      id: boundary
      if: fromJSON(inputs.needs-json).admission.outputs.run-native == 'true'
      shell: bash
      run: |
        set -euo pipefail
        gh api \
          "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
          > .buildchain/provider-jobs.json
        gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" \
          > .buildchain/provider-pull-request.json
        gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" \
          > .buildchain/provider-base-ref.json
        node .buildchain/runtime/scripts/dev-delivery-provider-heartbeat.mjs verify \
          --repository "${GITHUB_REPOSITORY}" \
          --branch "${TARGET_BRANCH}" \
          --admission .buildchain/dev-delivery/warrant.json \
          --receipt .buildchain/provider-heartbeat-receipt.json \
          --jobs-readback .buildchain/provider-jobs.json \
          --workflow-run-id "${GITHUB_RUN_ID}" \
          --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
          --admission-job-name "Reserve exact delivery candidate" \
          --heartbeat-job-name "Credentialed independent Warrant heartbeat" \
          --finalizer-job-name "Credentialed provider finalizer" \
          --output .buildchain/provider-heartbeat-verification.json
        node .buildchain/runtime/scripts/dev-delivery-process-boundary.mjs verify \
          --directory .buildchain/native-transfer \
          --jobs-readback .buildchain/provider-jobs.json \
          --pull-request-readback .buildchain/provider-pull-request.json \
          --base-ref-readback .buildchain/provider-base-ref.json \
          --native-job native-execution \
          --native-job-name "Credentialless native execution" \
          --seal-job-name "Credentialless native evidence seal" \
          --finalizer-job-name "Credentialed provider finalizer" \
          --pull-request "${EXPECTED_PR}" \
          --source-head "${EXPECTED_HEAD}" \
          --runtime-sha "${ADMITTED_RUNTIME_SHA}" \
          --runtime-selection-root "${ADMITTED_RUNTIME_ROOT}" \
          --output .buildchain/provider-finalizer-boundary.json
        {
          echo "transfer-root=$(jq -er '.transferRoot' .buildchain/provider-finalizer-boundary.json)"
          echo "boundary-root=$(jq -er '.boundaryRoot' .buildchain/provider-finalizer-boundary.json)"
          echo "native-outcome=$(jq -er '.nativeJob.conclusion' .buildchain/provider-finalizer-boundary.json)"
          echo "native-job-id=$(jq -er '.nativeJob.id' .buildchain/provider-finalizer-boundary.json)"
          echo "seal-job-id=$(jq -er '.sealJob.id' .buildchain/provider-finalizer-boundary.json)"
        } >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        BUILDCHAIN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
        EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
        TARGET_BRANCH: ${{ fromJSON(inputs.needs-json).admission.outputs.target-branch }}
        ADMITTED_RUNTIME_SHA: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}
        ADMITTED_RUNTIME_ROOT: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-selection-root }}

    - name: Verify transferred native proof before provider mutation
      id: proof-verification
      if: fromJSON(inputs.needs-json).admission.outputs.run-native == 'true' && steps.boundary.outcome == 'success' && steps.boundary.outputs.native-outcome == 'success'
      shell: bash
      run: |
        set -euo pipefail
        node .buildchain/runtime/scripts/dev-delivery-proof.mjs verify-native \
          --source-proof .buildchain/native-transfer/native-proof.json \
          --output .buildchain/provider-native-proof-verification.json
        jq -e '.ok == true and .reason == "exact-native-proof"' \
          .buildchain/provider-native-proof-verification.json >/dev/null

    - name: Independently recheck and atomically qualify native proof
      id: native-final
      if: fromJSON(inputs.needs-json).admission.outputs.run-native == 'true' && steps.boundary.outcome == 'success' && steps.boundary.outputs.native-outcome == 'success' && steps.proof-verification.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        args=(
          --repository "${GITHUB_REPOSITORY}" \
          --branch "${TARGET_BRANCH}" \
          --pull-request "${EXPECTED_PR}" \
          --expected-head "${EXPECTED_HEAD}" \
          --source-identity-root "${SOURCE_IDENTITY_ROOT}" \
          --source-patch-root "${SOURCE_PATCH_ROOT}" \
          --plan-root "${PLAN_ROOT}" \
          --closure-root "${CLOSURE_ROOT}" \
          --dependency-root "${DEPENDENCY_ROOT}" \
          --toolchain-root "${TOOLCHAIN_ROOT}" \
          --environment-root "${ENVIRONMENT_ROOT}" \
          --affected-paths-json "${AFFECTED_PATHS}" \
          --shard-evidence-roots-json "${SHARD_ROOTS}" \
          --native-command "${NATIVE_COMMAND}" \
          --warrant-result .buildchain/dev-delivery/warrant.json \
          --candidate-directory .buildchain/runtime \
          --evidence-directory .buildchain/finalizer-evidence \
          --lease-seconds "${LEASE_SECONDS}" \
          --heartbeat-seconds "${HEARTBEAT_SECONDS}" \
          --finalize-only
        )
        if [ -f .buildchain/native-transfer/native-proof.json ]; then
          args+=(--native-proof .buildchain/native-transfer/native-proof.json)
        fi
        node .buildchain/runtime/scripts/dev-delivery-two-phase.mjs "${args[@]}"
        jq -e \
          --argjson pr "${EXPECTED_PR}" \
          --arg head "${EXPECTED_HEAD}" \
          '.ok == true
           and .outcome == "qualified-warrant"
           and .qualifiedWarrant.phase == "qualified"
           and .qualifiedWarrant.pullRequestNumber == $pr
           and .qualifiedWarrant.sourceHead == $head
           and (.nativeProofRoot | test("^sha256:[0-9a-f]{64}$"))
           and (.nativeReuseDecisionRoot | test("^sha256:[0-9a-f]{64}$"))' \
          .buildchain/finalizer-evidence/two-phase-result.json >/dev/null
        cp .buildchain/finalizer-evidence/qualified-warrant.json .buildchain/dev-delivery/warrant.json
        {
          echo "native-proof-root=$(jq -er '.nativeProofRoot' .buildchain/finalizer-evidence/two-phase-result.json)"
          echo "decision-root=$(jq -er '.nativeReuseDecisionRoot' .buildchain/finalizer-evidence/two-phase-result.json)"
          echo "qualification-receipt-root=$(jq -er '.qualificationReceiptRoot' .buildchain/finalizer-evidence/two-phase-result.json)"
        } >> "${GITHUB_OUTPUT}"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        TARGET_BRANCH: ${{ fromJSON(inputs.needs-json).admission.outputs.target-branch }}
        EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
        EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
        SOURCE_IDENTITY_ROOT: ${{ fromJSON(inputs.request-json).source-identity-root }}
        SOURCE_PATCH_ROOT: ${{ fromJSON(inputs.request-json).source-patch-root }}
        PLAN_ROOT: ${{ fromJSON(inputs.request-json).plan-root }}
        CLOSURE_ROOT: ${{ fromJSON(inputs.request-json).closure-root }}
        DEPENDENCY_ROOT: ${{ fromJSON(inputs.request-json).dependency-root }}
        TOOLCHAIN_ROOT: ${{ fromJSON(inputs.request-json).toolchain-root }}
        ENVIRONMENT_ROOT: ${{ fromJSON(inputs.request-json).environment-root }}
        AFFECTED_PATHS: ${{ fromJSON(inputs.request-json).affected-paths-json }}
        SHARD_ROOTS: ${{ fromJSON(inputs.request-json).shard-evidence-roots-json }}
        NATIVE_COMMAND: ${{ fromJSON(inputs.request-json).native-command }}
        LEASE_SECONDS: ${{ fromJSON(inputs.request-json).warrant-lease-seconds }}
        HEARTBEAT_SECONDS: ${{ fromJSON(inputs.request-json).native-heartbeat-seconds }}
