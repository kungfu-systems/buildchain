name: Land protected dev PR
description: Owned land node of protected dev delivery.
inputs:
  request-json:
    description: Typed public workflow inputs, serialized once by the caller.
    required: true
  github-token:
    description: Provider token; supplied only in a credentialed job.
    required: false
    default: ''
  needs-json:
    description: Exact dependency job results and admitted output coordinates.
    required: false
    default: '{}'
  native-final-outcome:
    description: Predecessor node native-final-outcome.
    required: false
    default: ''
  boundary-outcome:
    description: Predecessor node boundary-outcome.
    required: false
    default: ''
  boundary-native-outcome:
    description: Predecessor node boundary-native-outcome.
    required: false
    default: ''
  failure-final-outcome:
    description: Predecessor node failure-final-outcome.
    required: false
    default: ''
  predecessors-ok:
    description: Whether prior job steps succeeded; artifact upload and result enforcement still run on failure.
    required: true
outputs:
  merge-evaluated-count:
    description: merge-evaluated-count.
    value: ${{ steps.merge.outputs.evaluated-count }}
  merge-merged-count:
    description: merge-merged-count.
    value: ${{ steps.merge.outputs.merged-count }}
  merge-enqueued-count:
    description: merge-enqueued-count.
    value: ${{ steps.merge.outputs.enqueued-count }}
  merge-action-count:
    description: merge-action-count.
    value: ${{ steps.merge.outputs.action-count }}
  merge-skipped-count:
    description: merge-skipped-count.
    value: ${{ steps.merge.outputs.skipped-count }}
  merge-final-base-sha:
    description: merge-final-base-sha.
    value: ${{ steps.merge.outputs.final-base-sha }}
  merge-admission-state:
    description: merge-admission-state.
    value: ${{ steps.merge.outputs.admission-state }}
  merge-receipt-root:
    description: merge-receipt-root.
    value: ${{ steps.merge.outputs.receipt-root }}
runs:
  using: composite
  steps:
    - name: Run Buildchain dev PR auto-merge
      id: merge
      if: inputs.predecessors-ok == 'true' && (fromJSON(inputs.request-json).defer-landing != true && fromJSON(inputs.needs-json).admission.outputs.handoff-required != 'true' && (fromJSON(inputs.request-json).delivery-warrant-mode != 'required' || fromJSON(inputs.needs-json).admission.outputs.already-qualified == 'true' || inputs.native-final-outcome == 'success'))
      continue-on-error: true
      shell: bash
      run: node .buildchain/runtime/scripts/dev-pr-auto-merge.mjs
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        BUILDCHAIN_DEV_PR_REPOSITORY: ${{ github.repository }}
        BUILDCHAIN_DEV_PR_TARGET_BRANCH: ${{ fromJSON(inputs.needs-json).admission.outputs.target-branch }}
        BUILDCHAIN_DEV_PR_EXPECTED_PR_NUMBER: ${{ fromJSON(inputs.request-json).expected-pr-number }}
        BUILDCHAIN_DEV_PR_EXPECTED_HEAD_SHA: ${{ fromJSON(inputs.request-json).expected-head-sha }}
        BUILDCHAIN_DEV_PR_DIAGNOSTIC_CONTEXT: ${{ fromJSON(inputs.request-json).diagnostic-context }}
        BUILDCHAIN_DEV_PR_WARRANT_MODE: ${{ fromJSON(inputs.request-json).delivery-warrant-mode == 'required' && 'required' || 'off' }}
        BUILDCHAIN_DEV_PR_WARRANT_RESULT_PATH: .buildchain/dev-delivery/warrant.json
        BUILDCHAIN_DEV_PR_PROJECT_CUT_PROOF_PATH: ${{ fromJSON(inputs.needs-json).admission.outputs.project-cut-proof-root != '' && '.buildchain/dev-delivery/project-cut-proof.json' || '' }}
        BUILDCHAIN_DEV_PR_SOURCE_PATCH_ROOT: ${{ fromJSON(inputs.request-json).source-patch-root }}
        BUILDCHAIN_DEV_PR_REQUIRED_CHECKS: ${{ fromJSON(inputs.request-json).required-status-checks }}
        BUILDCHAIN_DEV_PR_QUEUE_ADMISSION_CONTEXT: ${{ fromJSON(inputs.request-json).queue-admission-context }}
        BUILDCHAIN_DEV_PR_ACTIVE_LEASE_CONTEXT: ${{ fromJSON(inputs.request-json).active-lease-context }}
        BUILDCHAIN_DEV_PR_READY_LABEL: ${{ fromJSON(inputs.request-json).ready-label }}
        BUILDCHAIN_DEV_PR_BLOCK_LABELS: ${{ fromJSON(inputs.request-json).block-labels }}
        BUILDCHAIN_DEV_PR_ALLOWED_HEAD_PREFIXES: ${{ fromJSON(inputs.request-json).allowed-head-prefixes }}
        BUILDCHAIN_DEV_PR_REQUIRE_APPROVAL: ${{ fromJSON(inputs.request-json).require-approval }}
        BUILDCHAIN_DEV_PR_SAME_REPOSITORY_ONLY: ${{ fromJSON(inputs.request-json).same-repository-only }}
        BUILDCHAIN_DEV_PR_MAX_MERGES: ${{ fromJSON(inputs.request-json).max-merges }}
        BUILDCHAIN_DEV_PR_MERGE_METHOD: ${{ fromJSON(inputs.request-json).merge-method }}
        BUILDCHAIN_DEV_PR_LANDING_MODE: ${{ fromJSON(inputs.request-json).landing-mode }}
        BUILDCHAIN_DEV_PR_DRY_RUN: ${{ fromJSON(inputs.request-json).dry-run }}
        BUILDCHAIN_DEV_PR_OUTPUT_PATH: .buildchain/dev-pr-auto-merge/result.json

    - name: Upload dev PR auto-merge plan
      if: always() && fromJSON(inputs.request-json).defer-landing != true
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-dev-pr-auto-merge-${{ fromJSON(inputs.needs-json).admission.outputs.branch-artifact }}
        path: .buildchain/dev-pr-auto-merge/result.json
        if-no-files-found: error

    - name: Upload Dev Delivery Warrant evidence
      if: always() && fromJSON(inputs.request-json).delivery-warrant-mode != 'off'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-dev-delivery-warrant-${{ fromJSON(inputs.needs-json).admission.outputs.branch-artifact }}-${{ fromJSON(inputs.request-json).expected-pr-number }}
        path: |
          .buildchain/dev-delivery/
          .buildchain/native-transfer/
          .buildchain/finalizer-evidence/
          .buildchain/provider-finalizer-boundary.json
          .buildchain/provider-failure-settlement.json
          .buildchain/provider-heartbeat-receipt.json
          .buildchain/provider-heartbeat-verification.json
        if-no-files-found: error
        retention-days: 30
        overwrite: true

    - name: Enforce targeted admission result
      if: always()
      shell: bash
      run: |
        if [ "${DEFER_LANDING}" = "true" ]; then
          if [ "${WARRANT_MODE}" != "required" ]; then
            echo "::error::defer-landing requires delivery-warrant-mode required"
            exit 1
          fi
          if [ "${ALREADY_QUALIFIED}" != "true" ] && { [ "${BOUNDARY_OUTCOME}" != "success" ] || [ "${NATIVE_OUTCOME}" != "success" ]; }; then
            echo "::error::defer-landing requires exact native Warrant qualification"
            exit 1
          fi
          echo "Exact required Warrant qualified; landing is explicitly deferred."
          exit 0
        fi
        if [ "${NATIVE_JOB_OUTCOME}" = "failure" ]; then
          if [ "${FAILURE_FINAL_OUTCOME}" != "success" ]; then
            echo "::error::Exact independently verified native failure did not settle its retained fence"
            exit 1
          fi
          echo "::error::Native execution failed; its exact verified failure root settled the retained fence"
          exit 1
        fi
        if [ "${RUN_NATIVE}" = "true" ] && [ "${SEAL_JOB_OUTCOME}" != "success" ]; then
          echo "::error::Fresh credentialless native evidence seal did not complete"
          exit 1
        fi
        if [ "${RUN_NATIVE}" = "true" ] && [ "${HEARTBEAT_JOB_OUTCOME}" != "success" ]; then
          echo "::error::Independent credentialed Warrant heartbeat did not prove continuity through provider-terminal native and seal jobs; authority remains retained"
          exit 1
        fi
        if [ "${MERGE_STEP_OUTCOME}" != "success" ]; then
          echo "::error::Buildchain dev PR controller failed; inspect the uploaded receipt"
          exit 1
        fi
        if [ "${WARRANT_MODE}" = "required" ] && [ "${ALREADY_QUALIFIED}" != "true" ] && { [ "${BOUNDARY_OUTCOME}" != "success" ] || [ "${NATIVE_OUTCOME}" != "success" ]; }; then
          echo "::error::Provisional Warrant did not atomically upgrade with an exact native proof"
          exit 1
        fi
        if [ "${TARGETED}" = "true" ] && [ "${TARGETED_OK}" != "true" ]; then
          echo "::error::Targeted PR was not admitted at its expected head"
          exit 1
        fi
      env:
        MERGE_STEP_OUTCOME: ${{ steps.merge.outcome }}
        DEFER_LANDING: ${{ fromJSON(inputs.request-json).defer-landing }}
        TARGETED: ${{ steps.merge.outputs.targeted }}
        TARGETED_OK: ${{ steps.merge.outputs.targeted-ok }}
        WARRANT_MODE: ${{ fromJSON(inputs.request-json).delivery-warrant-mode }}
        BOUNDARY_OUTCOME: ${{ inputs.boundary-outcome }}
        NATIVE_OUTCOME: ${{ inputs.native-final-outcome }}
        NATIVE_JOB_OUTCOME: ${{ inputs.boundary-native-outcome }}
        SEAL_JOB_OUTCOME: ${{ fromJSON(inputs.needs-json).seal-native-execution.result }}
        HEARTBEAT_JOB_OUTCOME: ${{ fromJSON(inputs.needs-json).delivery-heartbeat.result }}
        RUN_NATIVE: ${{ fromJSON(inputs.needs-json).admission.outputs.run-native }}
        FAILURE_FINAL_OUTCOME: ${{ inputs.failure-final-outcome }}
        ALREADY_QUALIFIED: ${{ fromJSON(inputs.needs-json).admission.outputs.already-qualified }}
