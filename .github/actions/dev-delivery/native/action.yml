name: Verify native execution
description: Owned native node of protected dev delivery.
inputs:
  request-json:
    description: Typed public workflow inputs, serialized once by the caller.
    required: true
  github-token:
    description: Provider token; supplied only in a credentialed job.
    required: false
    default: ''
  needs-json:
    description: Exact dependency job results and admitted output coordinates.
    required: false
    default: '{}'
  phase:
    description: Fixed execution domain selected by the owning workflow.
    required: true
outputs:
  transfer-root:
    description: transfer-root.
    value: ${{ steps.transfer.outputs.root }}
  transfer-native-outcome:
    description: transfer-native-outcome.
    value: ${{ steps.transfer.outputs.native-outcome }}
  heartbeat-receipt-root:
    description: heartbeat-receipt-root.
    value: ${{ steps.heartbeat.outputs.receipt-root }}
runs:
  using: composite
  steps:
    - name: Checkout Buildchain runtime without persisted credentials
      if: ${{ inputs.phase == 'execute' && (success()) }}
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}
        path: .buildchain/runtime
        persist-credentials: false

    - name: Verify exact admitted Buildchain runtime
      if: ${{ inputs.phase == 'execute' && (success()) }}
      shell: bash
      run: |
        test "$(git -C .buildchain/runtime rev-parse --verify 'HEAD^{commit}')" = "${ADMITTED_RUNTIME_SHA}"
      env:
        ADMITTED_RUNTIME_SHA: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}

    - name: Download immutable admission state
      if: ${{ inputs.phase == 'execute' && (success()) }}
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-dev-delivery-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.request-json).expected-pr-number }}
        path: .buildchain/dev-delivery

    - name: Verify rooted runtime selection readback
      if: ${{ inputs.phase == 'execute' && (success()) }}
      shell: bash
      run: |
        test "$(jq -er '.resolvedSha' .buildchain/dev-delivery/runtime-selection.json)" = "${ADMITTED_RUNTIME_SHA}"
        test "sha256:$(sha256sum .buildchain/dev-delivery/runtime-selection.json | cut -d' ' -f1)" = "${ADMITTED_RUNTIME_ROOT}"
      env:
        ADMITTED_RUNTIME_SHA: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}
        ADMITTED_RUNTIME_ROOT: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-selection-root }}

    - name: Checkout exact candidate for native qualification
      if: ${{ inputs.phase == 'execute' && (success()) }}
      uses: actions/checkout@v7.0.0
      with:
        ref: ${{ fromJSON(inputs.request-json).expected-head-sha }}
        fetch-depth: 0
        path: .buildchain/candidate
        persist-credentials: false

    - name: Materialize optional reusable native proof
      id: native-input
      if: ${{ inputs.phase == 'execute' && (success() && (fromJSON(inputs.request-json).native-proof-json != '')) }}
      shell: bash
      run: |
        printf '%s\n' "${NATIVE_PROOF_JSON}" > .buildchain/dev-delivery/reusable-native-proof.json
        node .buildchain/runtime/scripts/dev-delivery-proof.mjs verify-native \
          --source-proof .buildchain/dev-delivery/reusable-native-proof.json \
          --output .buildchain/dev-delivery/reusable-native-proof-verification.json
        jq -e '.ok == true and .reason == "exact-native-proof"' \
          .buildchain/dev-delivery/reusable-native-proof-verification.json >/dev/null
        echo "path=.buildchain/dev-delivery/reusable-native-proof.json" >> "${GITHUB_OUTPUT}"
      env:
        NATIVE_PROOF_JSON: ${{ fromJSON(inputs.request-json).native-proof-json }}

    - name: Run or reuse native proof without provider credentials
      if: ${{ inputs.phase == 'execute' && (success()) }}
      id: native-run
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        args=(
          --repository "${GITHUB_REPOSITORY}"
          --branch "${TARGET_BRANCH}"
          --pull-request "${EXPECTED_PR}"
          --expected-head "${EXPECTED_HEAD}"
          --source-identity-root "${SOURCE_IDENTITY_ROOT}"
          --source-patch-root "${SOURCE_PATCH_ROOT}"
          --plan-root "${PLAN_ROOT}"
          --closure-root "${CLOSURE_ROOT}"
          --dependency-root "${DEPENDENCY_ROOT}"
          --toolchain-root "${TOOLCHAIN_ROOT}"
          --environment-root "${ENVIRONMENT_ROOT}"
          --affected-paths-json "${AFFECTED_PATHS}"
          --shard-evidence-roots-json "${SHARD_ROOTS}"
          --native-command "${NATIVE_COMMAND}"
          --warrant-result .buildchain/dev-delivery/warrant.json
          --candidate-directory .buildchain/candidate
          --evidence-directory .buildchain/dev-delivery
          --lease-seconds "${LEASE_SECONDS}"
          --heartbeat-seconds "${HEARTBEAT_SECONDS}"
          --native-only
        )
        if [ -n "${NATIVE_PROOF_PATH}" ]; then
          args+=(--native-proof "${NATIVE_PROOF_PATH}")
        fi
        node .buildchain/runtime/scripts/dev-delivery-two-phase.mjs "${args[@]}"
        jq -e \
          --argjson pr "${EXPECTED_PR}" \
          --arg head "${EXPECTED_HEAD}" \
          '.ok == true
           and .outcome == "native-proof-ready"
           and .qualifiedWarrant.phase == "provisional"
           and .qualifiedWarrant.pullRequestNumber == $pr
           and .qualifiedWarrant.sourceHead == $head
           and (.nativeProofRoot | test("^sha256:[0-9a-f]{64}$"))
           and (.nativeReuseDecisionRoot | test("^sha256:[0-9a-f]{64}$"))' \
          .buildchain/dev-delivery/two-phase-native-result.json >/dev/null
        {
          echo "native-proof-root=$(jq -er '.nativeProofRoot' .buildchain/dev-delivery/two-phase-native-result.json)"
          echo "decision-root=$(jq -er '.nativeReuseDecisionRoot' .buildchain/dev-delivery/two-phase-native-result.json)"
        } >> "${GITHUB_OUTPUT}"
      env:
        TARGET_BRANCH: ${{ fromJSON(inputs.needs-json).admission.outputs.target-branch }}
        EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
        EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
        SOURCE_IDENTITY_ROOT: ${{ fromJSON(inputs.request-json).source-identity-root }}
        SOURCE_PATCH_ROOT: ${{ fromJSON(inputs.request-json).source-patch-root }}
        PLAN_ROOT: ${{ fromJSON(inputs.request-json).plan-root }}
        CLOSURE_ROOT: ${{ fromJSON(inputs.request-json).closure-root }}
        DEPENDENCY_ROOT: ${{ fromJSON(inputs.request-json).dependency-root }}
        TOOLCHAIN_ROOT: ${{ fromJSON(inputs.request-json).toolchain-root }}
        ENVIRONMENT_ROOT: ${{ fromJSON(inputs.request-json).environment-root }}
        AFFECTED_PATHS: ${{ fromJSON(inputs.request-json).affected-paths-json }}
        SHARD_ROOTS: ${{ fromJSON(inputs.request-json).shard-evidence-roots-json }}
        NATIVE_COMMAND: ${{ fromJSON(inputs.request-json).native-command }}
        NATIVE_PROOF_PATH: ${{ steps.native-input.outputs.path }}
        LEASE_SECONDS: ${{ fromJSON(inputs.request-json).warrant-lease-seconds }}
        HEARTBEAT_SECONDS: ${{ fromJSON(inputs.request-json).native-heartbeat-seconds }}
        BUILDCHAIN_CREDENTIAL_ANCESTRY_BOUNDARY: github-actions-runner-worker/v1

    - name: Record credentialless native job context
      if: ${{ inputs.phase == 'execute' && (always()) }}
      shell: bash
      run: |
        outcome=failed
        if [ "${NATIVE_STEP_OUTCOME}" = "success" ]; then
          outcome=succeeded
        fi
        node .buildchain/runtime/scripts/dev-delivery-process-boundary.mjs record-native \
          --job native-execution \
          --outcome "${outcome}" \
          --output .buildchain/dev-delivery/native-job-context.json
      env:
        BUILDCHAIN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        NATIVE_STEP_OUTCOME: ${{ steps.native-run.outcome }}

    - name: Upload raw native execution output
      if: ${{ inputs.phase == 'execute' && (always()) }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-dev-delivery-native-raw-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.request-json).expected-pr-number }}
        path: .buildchain/dev-delivery/
        if-no-files-found: error
        retention-days: 30

    - name: Preserve native execution outcome for provider settlement
      if: ${{ inputs.phase == 'execute' && (always() && steps.native-run.outcome != 'success') }}
      shell: bash
      run: |
        echo "::error::Native execution failed; the fresh provider finalizer must settle the retained fence"
        exit 1

    - name: Checkout exact admitted Buildchain seal runtime
      if: ${{ inputs.phase == 'seal' && (success()) }}
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}
        path: .buildchain/runtime
        persist-credentials: false

    - name: Verify exact admitted Buildchain seal runtime
      if: ${{ inputs.phase == 'seal' && (success()) }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C .buildchain/runtime rev-parse --verify 'HEAD^{commit}')" = "${ADMITTED_RUNTIME_SHA}"
      env:
        ADMITTED_RUNTIME_SHA: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}

    - name: Download raw native execution output
      if: ${{ inputs.phase == 'seal' && (success()) }}
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-dev-delivery-native-raw-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.request-json).expected-pr-number }}
        path: .buildchain/native-raw

    - name: Independently validate and seal exact native transfer
      if: ${{ inputs.phase == 'seal' && (success()) }}
      id: transfer
      shell: bash
      run: |
        set -euo pipefail
        unset GH_TOKEN GITHUB_TOKEN
        node .buildchain/runtime/scripts/dev-delivery-process-boundary.mjs seal \
          --directory .buildchain/native-raw \
          --staging-directory .buildchain/native-transfer-staging \
          --seal-job seal-native-execution \
          --runtime-selection-root "${ADMITTED_RUNTIME_ROOT}" \
          --output execution-transfer.json
        {
          echo "root=$(jq -er '.transferRoot' .buildchain/native-transfer-staging/execution-transfer.json)"
          echo "native-outcome=$(jq -er '.outcome' .buildchain/native-transfer-staging/execution-transfer.json)"
        } >> "${GITHUB_OUTPUT}"
      env:
        BUILDCHAIN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        ADMITTED_RUNTIME_ROOT: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-selection-root }}

    - name: Upload canonical closed native execution transfer
      if: ${{ inputs.phase == 'seal' && (success()) }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-dev-delivery-native-sealed-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.request-json).expected-pr-number }}
        path: .buildchain/native-transfer-staging/
        if-no-files-found: error
        retention-days: 30

    - name: Checkout trusted heartbeat runtime
      if: ${{ inputs.phase == 'heartbeat' && (success()) }}
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}
        path: .buildchain/runtime
        persist-credentials: false

    - name: Verify exact admitted heartbeat runtime
      if: ${{ inputs.phase == 'heartbeat' && (success()) }}
      shell: bash
      run: |
        test "$(git -C .buildchain/runtime rev-parse --verify 'HEAD^{commit}')" = "${ADMITTED_RUNTIME_SHA}"
      env:
        ADMITTED_RUNTIME_SHA: ${{ fromJSON(inputs.needs-json).admission.outputs.runtime-sha }}

    - name: Download immutable admitted Warrant
      if: ${{ inputs.phase == 'heartbeat' && (success()) }}
      uses: actions/download-artifact@v7.0.0
      with:
        name: buildchain-dev-delivery-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.request-json).expected-pr-number }}
        path: .buildchain/dev-delivery

    - name: Durably heartbeat until native and seal are provider-terminal
      if: ${{ inputs.phase == 'heartbeat' && (success()) }}
      id: heartbeat
      shell: bash
      run: |
        set -euo pipefail
        node .buildchain/runtime/scripts/dev-delivery-provider-heartbeat.mjs run \
          --repository "${GITHUB_REPOSITORY}" \
          --branch "${TARGET_BRANCH}" \
          --admission .buildchain/dev-delivery/warrant.json \
          --lease-seconds "${LEASE_SECONDS}" \
          --heartbeat-seconds "${HEARTBEAT_SECONDS}" \
          --output .buildchain/provider-heartbeat-receipt.json
        echo "receipt-root=$(jq -er '.receiptRoot' .buildchain/provider-heartbeat-receipt.json)" >> "${GITHUB_OUTPUT}"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        TARGET_BRANCH: ${{ fromJSON(inputs.needs-json).admission.outputs.target-branch }}
        LEASE_SECONDS: ${{ fromJSON(inputs.request-json).warrant-lease-seconds }}
        HEARTBEAT_SECONDS: ${{ fromJSON(inputs.request-json).native-heartbeat-seconds }}

    - name: Upload rooted provider heartbeat receipt
      if: ${{ inputs.phase == 'heartbeat' && (success()) }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-dev-delivery-heartbeat-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.request-json).expected-pr-number }}
        path: .buildchain/provider-heartbeat-receipt.json
        if-no-files-found: error
        retention-days: 30
