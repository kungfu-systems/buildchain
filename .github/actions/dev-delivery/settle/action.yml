name: Settle terminal delivery
description: Owned settle node of protected dev delivery.
inputs:
  request-json:
    description: Typed public workflow inputs, serialized once by the caller.
    required: true
  github-token:
    description: Provider token; supplied only in a credentialed job.
    required: false
    default: ''
  needs-json:
    description: Exact dependency job results and admitted output coordinates.
    required: false
    default: '{}'
  boundary-outcome:
    description: Predecessor node boundary-outcome.
    required: false
    default: ''
  boundary-native-outcome:
    description: Predecessor node boundary-native-outcome.
    required: false
    default: ''
  phase:
    description: Fixed execution domain selected by the owning workflow.
    required: true
outputs:
  evidence-integration-proof-root:
    description: evidence-integration-proof-root.
    value: ${{ steps.evidence.outputs.integration-proof-root }}
  close-receipt-root:
    description: close-receipt-root.
    value: ${{ steps.close.outputs.close-receipt-root }}
  close-final-state-root:
    description: close-final-state-root.
    value: ${{ steps.close.outputs.final-state-root }}
  close-successor-wake-json:
    description: close-successor-wake-json.
    value: ${{ steps.close.outputs.successor-wake-json }}
  failure-final-outcome:
    description: failure-final-outcome.
    value: ${{ steps.failure-final.outcome }}
runs:
  using: composite
  steps:
    - name: Settle the exact independently verified native failure
      id: failure-final
      if: ${{ inputs.phase == 'native-failure' && (success() && (fromJSON(inputs.needs-json).admission.outputs.run-native == 'true' && inputs.boundary-outcome == 'success' && inputs.boundary-native-outcome == 'failure')) }}
      shell: bash
      run: |
        set -euo pipefail
        settlement=.buildchain/provider-failure-settlement.json
        settlement_state="$(jq -er '.latestStateRoot' .buildchain/provider-heartbeat-verification.json)"
        node .buildchain/runtime/scripts/dev-delivery-warrant.mjs settle \
          --repository "${GITHUB_REPOSITORY}" \
          --branch "${TARGET_BRANCH}" \
          --expected-old "${settlement_state}" \
          --pull-request "$(jq -er '.pullRequestNumber' "$settlement")" \
          --expected-source-head "$(jq -er '.sourceHead' "$settlement")" \
          --fencing-token "$(jq -er '.fencingToken' "$settlement")" \
          --lease-generation "$(jq -er '.leaseGeneration' "$settlement")" \
          --outcome terminal-failure \
          --evidence-root "$(jq -er '.evidenceRoot' "$settlement")" \
          --reason "$(jq -er '.reason' "$settlement")" \
          --transfer-root "$(jq -er '.transferRoot' "$settlement")" \
          --finalizer-boundary-root "$(jq -er '.finalizerBoundaryRoot' "$settlement")" \
          --native-job-id "$(jq -er '.nativeJobId' "$settlement")" \
          --seal-job-id "$(jq -er '.sealJobId' "$settlement")" \
          --execute \
          --output .buildchain/finalizer-evidence/failure-settlement-result.json
        jq -e \
          --arg evidenceRoot "$(jq -er '.evidenceRoot' "$settlement")" \
          --arg stateRoot "${settlement_state}" \
          --arg transferRoot "$(jq -er '.transferRoot' "$settlement")" \
          --arg boundaryRoot "$(jq -er '.finalizerBoundaryRoot' "$settlement")" \
          --argjson nativeJobId "$(jq -er '.nativeJobId' "$settlement")" \
          --argjson sealJobId "$(jq -er '.sealJobId' "$settlement")" \
          '.ok == true
           and .receipt.outcome == "terminal-failure"
           and .receipt.evidenceRoot == $evidenceRoot
           and .receipt.expectedOldStateRoot == $stateRoot
           and .receipt.transferRoot == $transferRoot
           and .receipt.finalizerBoundaryRoot == $boundaryRoot
           and .receipt.nativeJobId == $nativeJobId
           and .receipt.sealJobId == $sealJobId
           and .observation.candidates[-1].terminal.transferRoot == $transferRoot
           and .observation.candidates[-1].terminal.finalizerBoundaryRoot == $boundaryRoot
           and .observation.candidates[-1].terminal.nativeJobId == $nativeJobId
           and .observation.candidates[-1].terminal.sealJobId == $sealJobId
           and .observation.activeWarrant == null' \
          .buildchain/finalizer-evidence/failure-settlement-result.json >/dev/null
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        TARGET_BRANCH: ${{ fromJSON(inputs.needs-json).admission.outputs.target-branch }}

    - name: Validate terminal intent
      if: ${{ inputs.phase == 'terminal' && (success()) }}
      shell: bash
      run: |
        case "${OUTCOME}" in
          merged|terminal-failure|dequeued|cancelled) ;;
          *)
            echo "::error::unsupported terminal Warrant outcome: ${OUTCOME}"
            exit 1
            ;;
        esac
        case "${TARGET_BRANCH}" in
          dev/v*/v*) ;;
          *)
            echo "::error::target-branch must be a semver dev branch"
            exit 1
            ;;
        esac
        if ! [[ "${EXPECTED_HEAD}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::expected-head-sha must be an exact lowercase Git SHA"
          exit 1
        fi
      env:
        OUTCOME: ${{ fromJSON(inputs.request-json).outcome }}
        TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
        EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}

    - name: Checkout Buildchain runtime
      if: ${{ inputs.phase == 'terminal' && (success()) }}
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ fromJSON(inputs.request-json).buildchain-repository }}
        ref: ${{ fromJSON(inputs.request-json).buildchain-ref || 'v3' }}
        path: .buildchain/runtime
        persist-credentials: false

    - uses: actions/setup-node@v6.4.0
      if: ${{ inputs.phase == 'terminal' && (success()) }}
      with:
        node-version: "24"

    - name: Observe active Warrant authority
      if: ${{ inputs.phase == 'terminal' && (success()) }}
      shell: bash
      run: >-
        node .buildchain/runtime/scripts/dev-delivery-warrant.mjs observe
        --repository "${GITHUB_REPOSITORY}"
        --branch "${TARGET_BRANCH}"
        --output .buildchain/dev-delivery/observation.json
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}

    - name: Resolve terminal settlement mode
      if: ${{ inputs.phase == 'terminal' && (success()) }}
      id: settlement
      shell: bash
      run: |
        set -euo pipefail
        if jq -e '.observation.activeWarrant != null' .buildchain/dev-delivery/observation.json >/dev/null; then
          jq -e \
            --argjson pr "${EXPECTED_PR}" \
            --arg head "${EXPECTED_HEAD}" \
            '.observation.activeWarrant.pullRequestNumber == $pr
             and .observation.activeWarrant.sourceHead == $head
             and .observation.activeCandidate.pullRequestNumber == $pr
             and .observation.activeCandidate.sourceHead == $head
             and .observation.activeCandidate.candidateId == .observation.activeWarrant.candidateId' \
            .buildchain/dev-delivery/observation.json >/dev/null
          echo "mode=active" >> "${GITHUB_OUTPUT}"
        else
          echo "mode=inactive" >> "${GITHUB_OUTPUT}"
        fi
      env:
        EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
        EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}

    - name: Seal exact terminal evidence
      id: evidence
      if: ${{ inputs.phase == 'terminal' && (success() && (steps.settlement.outputs.mode == 'active' || fromJSON(inputs.request-json).outcome != 'merged')) }}
      shell: bash
      run: |
        if [ "${OUTCOME}" = "merged" ]; then
          source_proof_root="$(jq -er '.observation.activeCandidate.sourceProofRoot' .buildchain/dev-delivery/observation.json)"
          node .buildchain/runtime/scripts/dev-delivery-proof.mjs integration \
            --repository "${GITHUB_REPOSITORY}" \
            --branch "${TARGET_BRANCH}" \
            --source-proof-root "${source_proof_root}" \
            --warrant-result .buildchain/dev-delivery/observation.json \
            --current-base "${CURRENT_BASE}" \
            --replay-tree "${REPLAY_TREE}" \
            --merge-group-head "${MERGE_GROUP_HEAD}" \
            --merge-group-tree "${MERGE_GROUP_TREE}" \
            --required-context-roots-json "${CONTEXT_ROOTS}" \
            --verified-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output .buildchain/dev-delivery/integration-proof.json
          evidence_root="$(jq -er '.proofRoot' .buildchain/dev-delivery/integration-proof.json)"
          echo "integration-proof-root=${evidence_root}" >> "${GITHUB_OUTPUT}"
        else
          evidence_root="${TERMINAL_EVIDENCE_ROOT}"
          if ! [[ "${evidence_root}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::non-merged terminal closeout requires an exact evidence root"
            exit 1
          fi
        fi
        echo "evidence-root=${evidence_root}" >> "${GITHUB_OUTPUT}"
      env:
        OUTCOME: ${{ fromJSON(inputs.request-json).outcome }}
        TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
        CURRENT_BASE: ${{ fromJSON(inputs.request-json).current-base-sha }}
        REPLAY_TREE: ${{ fromJSON(inputs.request-json).replay-tree-sha }}
        MERGE_GROUP_HEAD: ${{ fromJSON(inputs.request-json).merge-group-head-sha }}
        MERGE_GROUP_TREE: ${{ fromJSON(inputs.request-json).merge-group-tree-sha }}
        CONTEXT_ROOTS: ${{ fromJSON(inputs.request-json).required-context-roots-json }}
        TERMINAL_EVIDENCE_ROOT: ${{ fromJSON(inputs.request-json).terminal-evidence-root }}

    - name: Settle terminal delivery event
      if: ${{ inputs.phase == 'terminal' && (success()) }}
      id: close
      shell: bash
      run: |
        set -euo pipefail
        args=(
          settle
          --repository "${GITHUB_REPOSITORY}"
          --branch "${TARGET_BRANCH}"
          --pull-request "${EXPECTED_PR}"
          --expected-source-head "${EXPECTED_HEAD}"
          --outcome "${OUTCOME}"
          --reason "${REASON}"
          --execute
          --output .buildchain/dev-delivery/close.json
        )
        if [ "${SETTLEMENT_MODE}" = "active" ]; then
          args+=(
            --fencing-token "$(jq -er '.observation.activeWarrant.fencingToken' .buildchain/dev-delivery/observation.json)"
            --lease-generation "$(jq -er '.observation.activeWarrant.generation' .buildchain/dev-delivery/observation.json)"
          )
        fi
        if [ -n "${EVIDENCE_ROOT}" ]; then
          args+=(--evidence-root "${EVIDENCE_ROOT}")
        fi
        node .buildchain/runtime/scripts/dev-delivery-warrant.mjs "${args[@]}"
        {
          echo "close-receipt-root=$(jq -er '.receiptRoot' .buildchain/dev-delivery/close.json)"
          echo "final-state-root=$(jq -er '.after.stateRoot' .buildchain/dev-delivery/close.json)"
          echo "successor-wake-json=$(jq -c '.receipt.successorWake // null' .buildchain/dev-delivery/close.json)"
        } >> "${GITHUB_OUTPUT}"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        TARGET_BRANCH: ${{ fromJSON(inputs.request-json).target-branch }}
        EXPECTED_PR: ${{ fromJSON(inputs.request-json).expected-pr-number }}
        EXPECTED_HEAD: ${{ fromJSON(inputs.request-json).expected-head-sha }}
        OUTCOME: ${{ fromJSON(inputs.request-json).outcome }}
        EVIDENCE_ROOT: ${{ steps.evidence.outputs.evidence-root }}
        REASON: ${{ fromJSON(inputs.request-json).reason }}
        SETTLEMENT_MODE: ${{ steps.settlement.outputs.mode }}

    - name: Wake exact queued successor
      if: ${{ inputs.phase == 'terminal' && (success() && (steps.close.outcome == 'success' && steps.close.outputs.successor-wake-json != 'null')) }}
      shell: bash
      run: |
        set -euo pipefail
        jq -cn --argjson candidate "${SUCCESSOR_WAKE}" \
          '{event_type: "buildchain-dev-delivery-wake", client_payload: {candidate: $candidate}}' > .buildchain/dev-delivery/successor-dispatch.json
        gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
          --input .buildchain/dev-delivery/successor-dispatch.json
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        SUCCESSOR_WAKE: ${{ steps.close.outputs.successor-wake-json }}

    - name: Upload terminal Warrant evidence
      if: ${{ inputs.phase == 'terminal' && (always()) }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: buildchain-dev-delivery-close-${{ fromJSON(inputs.request-json).expected-pr-number }}-${{ fromJSON(inputs.request-json).outcome }}
        path: .buildchain/dev-delivery/
        if-no-files-found: error
        retention-days: 30
        overwrite: true
