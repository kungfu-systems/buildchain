self-hosted-runner:
  # Labels of self-hosted runner in array of strings.
  labels:
    - agent-120
    - kungfu-build
    - kungfu-build-v4
    - kungfu-build-v4-linux-x64
    - linux-x64

# Configuration variables in array of strings defined in your repository or
# organization. `null` means disabling configuration variables check.
# Empty array means no configuration variable is allowed.
config-variables: null

# Configuration for file paths. The keys are glob patterns to match to file
# paths relative to the repository root. The values are the configurations for
# the file paths. Note that the path separator is always '/'.
# The following configurations are available.
#
# "ignore" is an array of regular expression patterns. Matched error messages
# are ignored. This is similar to the "-ignore" command line option.
paths:
  .github/workflows/build.yml:
    # GitHub.com exposes job.workflow_ref for called-workflow identity. Keep
    # this exact false-positive scoped until actionlint's context schema ships it.
    ignore:
      - 'property "workflow_ref" is not defined in object type'
  .github/workflows/.build.yml:
    # GitHub.com exposes job.workflow_ref for called-workflow identity. Keep
    # this exact false-positive scoped until actionlint's context schema ships it.
    ignore:
      - 'property "workflow_ref" is not defined in object type'
  .github/workflows/.gate-profile.yml:
    # GitHub.com exposes job.workflow_ref for called-workflow identity. Keep
    # this exact false-positive scoped until actionlint's context schema ships it.
    ignore:
      - 'property "workflow_ref" is not defined in object type'
  .github/workflows/release-candidate-promote.yml:
    # GitHub.com exposes these job properties for called-workflow identity. Keep
    # these exact false-positives scoped until actionlint's context schema ships them.
    ignore:
      - 'property "workflow_ref" is not defined in object type'
      - 'property "workflow_repository" is not defined in object type'
      - 'property "workflow_sha" is not defined in object type'
  .github/workflows/.release-candidate-promote.yml:
    # The advanced shell binds its called-workflow identity before candidate use.
    ignore:
      - 'property "workflow_ref" is not defined in object type'
      - 'property "workflow_sha" is not defined in object type'
  .github/workflows/.release-verify.yml:
    ignore:
      - 'property "workflow_ref" is not defined in object type'
  .github/workflows/.web-surface.yml:
    ignore:
      - 'property "workflow_ref" is not defined in object type'
  .github/workflows/paper-release.yml:
    ignore:
      - 'property "workflow_ref" is not defined in object type'
  .github/workflows/publication-artifact.yml:
    ignore:
      - 'property "workflow_ref" is not defined in object type'
