      BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN:
        required: false
      BUILDCHAIN_ARTIFACT_RELAY_S3_UPLOAD_ROLE_ARN:
        required: false
      BUILDCHAIN_ARTIFACT_RELAY_S3_DOWNLOAD_ROLE_ARN:
        required: false
    outputs:
      buildchain-channel:
        description: "Resolved Buildchain channel: alpha, stable, or override"
