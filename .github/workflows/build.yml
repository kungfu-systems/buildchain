        value: ${{ jobs.build.outputs.trusted-event }}
      buildchain-runtime-ref:
        description: "Resolved Buildchain runtime ref"
        value: ${{ jobs.build.outputs.buildchain-runtime-ref }}
      buildchain-runtime-sha:
        description: "Resolved immutable Buildchain runtime SHA"
        value: ${{ jobs.build.outputs.buildchain-runtime-sha }}
      buildchain-runtime-class:
        description: "Runtime stability class: stable, alpha, train, exact-sha, or development"
        value: ${{ jobs.build.outputs.buildchain-runtime-class }}
      buildchain-runtime-override:
        description: "Whether a train or exact-SHA buildchain-ref override was used"
        value: ${{ jobs.build.outputs.buildchain-runtime-override }}
      buildchain-runtime-trust-decision:
        description: "Runtime override trust decision"
        value: ${{ jobs.build.outputs.buildchain-runtime-trust-decision }}
      buildchain-contract-lock-status:
        description: "Floating Buildchain runtime contract lock status"
        value: ${{ jobs.build.outputs.buildchain-contract-lock-status }}
      buildchain-contract-lock-drift:
        description: "Whether the floating Buildchain runtime SHA or contract digest drifted from the consumer lock"
        value: ${{ jobs.build.outputs.buildchain-contract-lock-drift }}
      buildchain-contract-digest:
        description: "Current Buildchain runtime contract digest"
        value: ${{ jobs.build.outputs.buildchain-contract-digest }}
      publish-channel:
        description: "Resolved publish channel"
        value: ${{ jobs.build.outputs.publish-channel }}
      publish-allowed:
        description: "Whether this event/ref may publish after successful verification"
        value: ${{ jobs.build.outputs.publish-allowed }}
      publish-reason:
        description: "Human-readable publish gate reason"
        value: ${{ jobs.build.outputs.publish-reason }}
      publish-source-ref:
        description: "Resolved publish source ref"
        value: ${{ jobs.build.outputs.publish-source-ref }}
      publish-source-sha:
        description: "Locked source SHA used for checkout/build/summary"
        value: ${{ jobs.build.outputs.publish-source-sha }}
      publish-source-tree-sha:
        description: "Git tree SHA for the locked source commit used by release-candidate promotion equivalence checks"
        value: ${{ jobs.build.outputs.publish-source-tree-sha }}
      publish-source-locked:
        description: "Whether a publish-gate source ref was explicitly locked"
        value: ${{ jobs.build.outputs.publish-source-locked }}
      publish-source-channel:
        description: "Channel parsed from the publish-gate source ref"
        value: ${{ jobs.build.outputs.publish-source-channel }}
      publish-source-line:
        description: "Line parsed from the publish-gate source ref"
        value: ${{ jobs.build.outputs.publish-source-line }}
      publish-source-consumer-version:
        description: "Consumer version parsed from the publish-gate source ref"
        value: ${{ jobs.build.outputs.publish-source-consumer-version }}
      release-manifest-json:
        description: "Resolved release manifest JSON"
        value: ${{ jobs.build.outputs.release-manifest-json }}
      controller-plan-artifact:
        description: "Uploaded build-channel-router controller plan artifact name"
        value: ${{ jobs.controller-plan.outputs.controller-plan-artifact }}
      controller-plan-json:
        description: "Compact source/runtime-bound build-channel-router controller plan"
        value: ${{ jobs.controller-plan.outputs.controller-plan-json }}
      controller-plan-digest:
        description: "Digest of the build-channel-router controller plan"
        value: ${{ jobs.controller-plan.outputs.controller-plan-digest }}
      controller-receipt-artifact:
        description: "Uploaded build-channel-router controller receipt artifact name"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-artifact }}
      controller-receipt-json:
        description: "Compact build-channel-router controller receipt"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-json }}
      controller-receipt-digest:
        description: "Digest of the build-channel-router controller receipt"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-digest }}
      controller-receipt-status:
        description: "Final build-channel-router controller status"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-status }}

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  resolve-channel:
    name: Resolve Buildchain channel
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      buildchain-ref: ${{ steps.channel.outputs.buildchain-ref }}
      contract-lock-path: ${{ steps.lock.outputs.path }}
      router-repository: ${{ steps.router.outputs.repository }}
      router-ref: ${{ steps.router.outputs.ref }}
      selection-source: ${{ steps.channel.outputs.selection-source }}
      reason: ${{ steps.channel.outputs.reason }}
    steps:
      - name: Resolve router source
        id: router
        shell: bash
        env:
          BUILDCHAIN_ROUTER_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          workflow_ref="${BUILDCHAIN_ROUTER_WORKFLOW_REF}"
          repository="${workflow_ref%%/.github/workflows/*}"
          ref="${workflow_ref##*@}"
          ref="${ref#refs/heads/}"
          ref="${ref#refs/tags/}"
          if [[ -z "${repository}" || "${repository}" = "${workflow_ref}" || -z "${ref}" ]]; then
            echo "Unable to resolve Buildchain router source from job.workflow_ref=${workflow_ref}" >&2
            exit 1
          fi
          {
            echo "repository=${repository}"
            echo "ref=${ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout Buildchain router
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ steps.router.outputs.repository }}
          ref: ${{ steps.router.outputs.ref }}
          path: .buildchain/router
          persist-credentials: false

      - name: Resolve channel
        id: channel
        shell: bash
        env:
          BUILDCHAIN_CHANNEL: ${{ inputs.buildchain-channel }}
          BUILDCHAIN_REQUESTED_REF: ${{ inputs.buildchain-ref }}
          BUILDCHAIN_PUBLISH_CHANNEL: ${{ inputs.publish-channel }}
          BUILDCHAIN_EVENT_NAME: ${{ github.event_name }}
          BUILDCHAIN_GIT_REF: ${{ github.ref }}
          BUILDCHAIN_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          BUILDCHAIN_ROUTER_REF: ${{ steps.router.outputs.ref }}
        run: |
          node .buildchain/router/scripts/buildchain-channel-router.mjs \
            --cwd .buildchain/router \
            --channel "${BUILDCHAIN_CHANNEL}" \
            --buildchain-ref "${BUILDCHAIN_REQUESTED_REF}" \
            --publish-channel "${BUILDCHAIN_PUBLISH_CHANNEL}" \
            --event-name "${BUILDCHAIN_EVENT_NAME}" \
            --ref "${BUILDCHAIN_GIT_REF}" \
            --release-prerelease "${BUILDCHAIN_RELEASE_PRERELEASE}" \
            --router-ref "${BUILDCHAIN_ROUTER_REF}"

      - name: Select consumer contract lock
        id: lock
        shell: bash
        env:
          EXPLICIT_PATH: ${{ inputs.buildchain-contract-lock-path }}
          ALPHA_PATH: ${{ inputs.buildchain-alpha-contract-lock-path }}
          STABLE_PATH: ${{ inputs.buildchain-stable-contract-lock-path }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          path="${EXPLICIT_PATH}"
          if [[ -z "${path}" ]]; then
            if [[ "${CHANNEL}" = "alpha" ]]; then
              path="${ALPHA_PATH}"
            else
              path="${STABLE_PATH}"
            fi
          fi
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

  controller-plan:
    name: Plan channel router controller evidence
    needs: resolve-channel
    runs-on: ubuntu-24.04
    outputs:
      controller-plan-artifact: ${{ steps.names.outputs.controller-plan-artifact }}
      controller-plan-json: ${{ steps.plan.outputs.controller-plan-json }}
      controller-plan-digest: ${{ steps.plan.outputs.controller-plan-digest }}
      runtime-sha: ${{ steps.identities.outputs.runtime-sha }}
    steps:
      - name: Checkout Buildchain controller workflow shell
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ needs.resolve-channel.outputs.router-repository }}
          ref: ${{ needs.resolve-channel.outputs.router-ref }}
          path: .buildchain/controller-runtime
          persist-credentials: false

      - name: Resolve controller workflow shell identity
        id: identities
        shell: bash
        run: |
          runtime_sha="$(git -C .buildchain/controller-runtime rev-parse HEAD)"
          contract_digest="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(".buildchain/controller-runtime/dist/site/buildchain-contract.json","utf8")); process.stdout.write(value.contractDigest)')"
          {
            echo "runtime-sha=${runtime_sha}"
            echo "contract-digest=${contract_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Create channel router controller plan
        id: plan
        run: node .buildchain/controller-runtime/scripts/controller-evidence.mjs --mode plan
        env:
          BUILDCHAIN_CONTROLLER_ID: build-channel-router
          BUILDCHAIN_CONTROLLER_SOURCE_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_CONTROLLER_SOURCE_SHA: ${{ github.sha }}
          BUILDCHAIN_CONTROLLER_RUNTIME_REF: ${{ needs.resolve-channel.outputs.router-ref }}
          BUILDCHAIN_CONTROLLER_RUNTIME_SHA: ${{ steps.identities.outputs.runtime-sha }}
          BUILDCHAIN_CONTROLLER_CONTRACT_DIGEST: ${{ steps.identities.outputs.contract-digest }}
          BUILDCHAIN_CONTROLLER_REGISTRY: .buildchain/controller-runtime/dist/site/controller-registry.json
          BUILDCHAIN_CONTROLLER_INPUTS_JSON: ${{ toJSON(inputs) }}
          BUILDCHAIN_CONTROLLER_INPUT_BOUNDARY: workflow-call
          BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json

      - name: Resolve channel router controller plan artifact
        id: names
        run: echo "controller-plan-artifact=buildchain-channel-controller-plan-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_SHA: ${{ github.sha }}

      - name: Upload channel router controller plan
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.names.outputs.controller-plan-artifact }}
          path: .buildchain/controller/plan.json
          if-no-files-found: error

  build:
    name: Build with resolved channel
    needs:
      - resolve-channel
      - controller-plan
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      issues: write
      id-token: write
    with:
      buildchain-repository: ${{ inputs.buildchain-repository }}
      buildchain-ref: ${{ needs.resolve-channel.outputs.buildchain-ref }}
      buildchain-contract-lock-path: ${{ needs.resolve-channel.outputs.contract-lock-path }}
      buildchain-contract-compatibility-policy: ${{ inputs.buildchain-contract-compatibility-policy }}
      buildchain-contract-drift-issue-mode: ${{ inputs.buildchain-contract-drift-issue-mode }}
      working-directory: ${{ inputs.working-directory }}
      runner-preset: ${{ inputs.runner-preset }}
      platforms-json: ${{ inputs.platforms-json }}
      linux-container-preset: ${{ inputs.linux-container-preset }}
      linux-container-image: ${{ inputs.linux-container-image }}
      require-trusted-event: ${{ inputs.require-trusted-event }}
      untrusted-policy: ${{ inputs.untrusted-policy }}
      publish-channel: ${{ inputs.publish-channel }}
      publish-refs-json: ${{ inputs.publish-refs-json }}
      publish-source-ref: ${{ inputs.publish-source-ref }}
      publish-anchor-request-json: ${{ inputs.publish-anchor-request-json }}
      publish-registry: ${{ inputs.publish-registry }}
      setup-node: ${{ inputs.setup-node }}
      node-version: ${{ inputs.node-version }}
      setup-rust: ${{ inputs.setup-rust }}
      rust-toolchain: ${{ inputs.rust-toolchain }}
      rustup-dist-server: ${{ inputs.rustup-dist-server }}
      rustup-update-root: ${{ inputs.rustup-update-root }}
      cargo-registry-index: ${{ inputs.cargo-registry-index }}
      install-command: ${{ inputs.install-command }}
      build-command: ${{ inputs.build-command }}
      verify-command: ${{ inputs.verify-command }}
      require-install: ${{ inputs.require-install }}
      require-build: ${{ inputs.require-build }}
      require-verify: ${{ inputs.require-verify }}
      artifact-name: ${{ inputs.artifact-name }}
      artifact-name-template: ${{ inputs.artifact-name-template }}
      artifact-paths: ${{ inputs.artifact-paths }}
      release-candidate: ${{ inputs.release-candidate }}
      expected-artifacts-json: ${{ inputs.expected-artifacts-json }}
      process-summary-path: ${{ inputs.process-summary-path }}
      sample-process-tree: ${{ inputs.sample-process-tree }}
      process-sample-interval-ms: ${{ inputs.process-sample-interval-ms }}
      requested-parallelism: ${{ inputs.requested-parallelism }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
      artifact-transfer-mode: ${{ inputs.artifact-transfer-mode }}
      artifact-relay-s3-bucket: ${{ inputs.artifact-relay-s3-bucket }}
      artifact-relay-s3-region: ${{ inputs.artifact-relay-s3-region }}
      artifact-relay-s3-prefix: ${{ inputs.artifact-relay-s3-prefix }}
      artifact-relay-s3-role-arn: ${{ inputs.artifact-relay-s3-role-arn }}
      artifact-relay-s3-upload-role-arn: ${{ inputs.artifact-relay-s3-upload-role-arn }}
      artifact-relay-s3-download-role-arn: ${{ inputs.artifact-relay-s3-download-role-arn }}
      artifact-relay-s3-oidc-audience: ${{ inputs.artifact-relay-s3-oidc-audience }}
      checkout-cache-mode: ${{ inputs.checkout-cache-mode }}
      checkout-cache-mirror-url-template: ${{ inputs.checkout-cache-mirror-url-template }}
      checkout-cache-reference-repository-template: ${{ inputs.checkout-cache-reference-repository-template }}
      checkout-cache-fallback: ${{ inputs.checkout-cache-fallback }}
      checkout-cache-timeout-seconds: ${{ inputs.checkout-cache-timeout-seconds }}
      checkout-cache-github-timeout-seconds: ${{ inputs.checkout-cache-github-timeout-seconds }}
      checkout-cache-fetch-attempts: ${{ inputs.checkout-cache-fetch-attempts }}
      shifu-cache-profile-ref: ${{ inputs.shifu-cache-profile-ref }}
      shifu-cache-profile-digest: ${{ inputs.shifu-cache-profile-digest }}
      gate-profile-aggregate-json: ${{ inputs.gate-profile-aggregate-json }}
    secrets: inherit

  controller-receipt:
    name: Finalize channel router controller evidence
    needs:
      - resolve-channel
      - controller-plan
      - build
    if: ${{ always() && needs.controller-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      controller-receipt-artifact: ${{ steps.names.outputs.controller-receipt-artifact }}
      controller-receipt-json: ${{ steps.receipt.outputs.controller-receipt-json }}
      controller-receipt-digest: ${{ steps.receipt.outputs.controller-receipt-digest }}
      controller-receipt-status: ${{ steps.receipt.outputs.controller-receipt-status }}
    steps:
      - name: Checkout Buildchain controller workflow shell
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ needs.resolve-channel.outputs.router-repository }}
          ref: ${{ needs.controller-plan.outputs.runtime-sha }}
          path: .buildchain/controller-runtime
          persist-credentials: false

      - name: Download channel router controller plan
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.controller-plan.outputs.controller-plan-artifact }}
          path: .buildchain/controller

      - name: Create channel router controller receipt
        id: receipt
        run: node .buildchain/controller-runtime/scripts/controller-evidence.mjs --mode receipt
        env:
          BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
          BUILDCHAIN_CONTROLLER_STAGES_JSON: >-
            [{"id":"resolve-channel","status":"${{ needs.resolve-channel.result }}"},{"id":"build","status":"${{ needs.build.result }}"},{"id":"aggregate","status":"${{ needs.build.result }}"}]
          BUILDCHAIN_CONTROLLER_EVIDENCE_JSON: ${{ needs.build.outputs.controller-receipt-digest != '' && format('[{{"kind":"nested-controller-receipt","digest":"{0}"}}]', needs.build.outputs.controller-receipt-digest) || '[]' }}
          BUILDCHAIN_CONTROLLER_REASON_CODE: ${{ needs.build.result == 'success' && '' || 'nested-build-incomplete' }}
          BUILDCHAIN_CONTROLLER_REASON_SUMMARY: Nested build controller did not complete successfully
          BUILDCHAIN_CONTROLLER_RECEIPT_ARTIFACT: buildchain-channel-controller-receipt-${{ github.sha }}
          BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json

      - name: Resolve channel router controller receipt artifact
        id: names
        run: echo "controller-receipt-artifact=buildchain-channel-controller-receipt-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_SHA: ${{ github.sha }}

      - name: Upload channel router controller receipt
        if: ${{ always() && steps.receipt.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.names.outputs.controller-receipt-artifact }}
          path: .buildchain/controller/receipt.json
          if-no-files-found: error

      - name: Enforce qualifying channel router controller receipt
        if: ${{ steps.receipt.outputs.controller-receipt-qualifying != 'true' }}
        run: |
          echo "::error::channel router controller receipt is not qualifying: ${{ steps.receipt.outputs.controller-receipt-status }}"
          exit 1
