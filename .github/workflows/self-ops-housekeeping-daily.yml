name: Engineering Housekeeper Daily

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Report by default; apply also requires apply-enabled."
        type: choice
        options: [report, apply]
        default: report
      apply-enabled:
        description: "Explicit positive mutation gate."
        type: boolean
        default: false
      buildchain-ref:
        description: "Temporary runtime ref for trusted qualification."
        type: string
        default: ""

permissions: {}

jobs:
  invalid-apply-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && !inputs.apply-enabled }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: |
          echo "::error::apply mode requires apply-enabled=true"
          exit 1

  report:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'apply' }}
    uses: ./.github/workflows/engineering-housekeeper.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      mode: report
      stale-days: 30
      max-actions: 10
      buildchain-ref: ${{ inputs.buildchain-ref || github.sha }}

  apply:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.apply-enabled) }}
    uses: ./.github/workflows/engineering-housekeeper.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      mode: apply
      apply-enabled: true
      stale-pull-request-label: engineering-housekeeper:stale
      stale-days: 30
      max-actions: 10
      buildchain-ref: ${{ inputs.buildchain-ref || github.sha }}
