name: Engineering Housekeeper Daily
on:
  schedule:
    - cron: 23 2 * * *
  workflow_dispatch:
    inputs:
      mode:
        description: Report by default; apply also requires apply-enabled.
        type: choice
        options:
          - report
          - apply
        default: report
      apply-enabled:
        description: Explicit positive mutation gate.
        type: boolean
        default: false
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
permissions: {}
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
    timeout-minutes: 5
  invalid-apply-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && !inputs.apply-enabled
      }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Reject invalid apply request
        uses: ./.buildchain/runtime/actions/workflow/admission/reject
        with:
          reason: apply mode requires apply-enabled=true
    needs:
      - execution-runtime
  report:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'apply' }}
    uses: kungfu-systems/buildchain/.github/workflows/public-ops-housekeeping.yml@v4
    permissions:
      contents: read
      pull-requests: read
    with:
      mode: report
      stale-days: 30
      max-actions: 10
      runtime-selection: ${{ needs.execution-runtime.outputs.selection }}
    needs:
      - execution-runtime
  apply:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode
      == 'apply' && inputs.apply-enabled) }}
    uses: kungfu-systems/buildchain/.github/workflows/public-ops-housekeeping.yml@v4
    permissions:
      contents: write
      pull-requests: write
    with:
      mode: apply
      apply-enabled: true
      stale-pull-request-label: engineering-housekeeper:stale
      stale-days: 30
      max-actions: 10
      runtime-selection: ${{ needs.execution-runtime.outputs.selection }}
    needs:
      - execution-runtime
