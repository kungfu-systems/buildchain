name: Buildchain Sealed Publication Authority

on:
  workflow_call:
    inputs:
      buildchain-repository:
        default: "kungfu-systems/buildchain"
        type: string
        required: false
      buildchain-ref:
        description: "Exact Buildchain runtime SHA that owns the authority registry and verifier"
        type: string
        required: true
      admission-json:
        description: "Fresh sealed publication admission JSON"
        type: string
        required: false
        default: ""
      runner-provenance-json:
        description: "Runner provenance receipt JSON"
        type: string
        required: false
        default: ""
      control-plane-audit-json:
        description: "Fresh external control-plane audit receipt JSON"
        type: string
        required: false
        default: ""
      gate-aggregate-json:
        description: "Qualifying Shifu Gate aggregate or explicit consumer-owned no-Gate decision"
        type: string
        required: false
        default: ""
      expected-json:
        description: "Independent exact publication bindings JSON"
        type: string
        required: false
        default: ""
      used-nonces-json:
        description: "JSON array of already consumed admission nonces"
        type: string
        required: false
        default: "[]"
      consumer-qualification-required:
        description: "Require a consumer-owned predicate receipt before provider mutation"
        type: boolean
        required: false
        default: false
      consumer-predicate-id:
        description: "Stable consumer-owned predicate identifier"
        type: string
        required: false
        default: ""
      consumer-predicate-digest:
        description: "SHA-256 digest of the exact consumer predicate command"
        type: string
        required: false
        default: ""
      auto-admission:
        description: "Assemble sealed evidence from an exact managed publication candidate"
        type: boolean
        required: false
        default: false
      auto-admission-kind:
        description: "Managed evidence kind: release-candidate or publication-artifact"
        type: string
        required: false
        default: "release-candidate"
      auto-no-gate:
        description: "Explicit caller decision that a managed release-candidate publication has no Shifu Gate registry"
        type: boolean
        required: false
        default: false
      source-sha:
        description: "Exact caller channel commit admitted by managed publication assembly"
        type: string
        required: false
        default: ""
      target-ref:
        description: "Protected Buildchain channel ref audited by self-publication assembly"
        type: string
        required: false
        default: ""
      required-status-check:
        description: "Exact protected-branch status check context admitted by the authority"
        type: string
        required: false
        default: "check"
      publisher-workflow-path:
        description: "Caller workflow filename bound by the npm trusted publisher"
        type: string
        required: false
        default: ""
      authority-workflow-path:
        description: "Buildchain product-publication workflow path bound by the admission"
        type: string
        required: false
        default: ""
      product:
        type: string
        required: false
        default: "Buildchain"
      publication-target:
        type: string
        required: false
        default: "npm:@kungfu-tech/buildchain"
      publication-version:
        description: "Exact version selected by the read-only publication plan"
        type: string
        required: false
        default: ""
      package-name:
        type: string
        required: false
        default: "@kungfu-tech/buildchain"
      evidence-repository:
        description: "Consumer repository whose exact Actions run owns the independent evidence"
        type: string
        required: false
        default: ""
      evidence-run-id:
        description: "Exact successful Actions run containing the RC passport and controller/artifact evidence"
        type: string
        required: false
        default: ""
      evidence-passport-artifact:
        description: "Exact release-candidate passport artifact name"
        type: string
        required: false
        default: ""
      evidence-summary-artifact:
        description: "Exact build-summary artifact name"
        type: string
        required: false
        default: ""
      evidence-manifest-pattern:
        description: "Artifact-name pattern selecting the exact run's platform manifests"
        type: string
        required: false
        default: ""
      evidence-payload-pattern:
        description: "Artifact-name pattern selecting the exact run's candidate payloads"
        type: string
        required: false
        default: ""
      evidence-publication-artifact:
        description: "Exact publication candidate artifact name"
        type: string
        required: false
        default: ""
      evidence-controller-artifact:
        description: "Exact publication-artifact controller receipt artifact name"
        type: string
        required: false
        default: ""
      dry-run:
        type: boolean
        required: false
        default: false
    outputs:
      capability-json:
        description: "Compact publication capability receipt JSON; dry-run is not a publication capability"
        value: ${{ jobs.verify.outputs.capability-json }}
      capability-digest:
        description: "Publication capability receipt digest"
        value: ${{ jobs.verify.outputs.capability-digest }}
      capability-artifact:
        description: "Publication capability receipt artifact"
        value: ${{ jobs.verify.outputs.capability-artifact }}
      gate-aggregate-json:
        description: "Complete Gate aggregate transported without summary reduction"
        value: ${{ jobs.verify.outputs.gate-aggregate-json }}
      gate-aggregate-digest:
        description: "Canonical digest of the transported Gate aggregate"
        value: ${{ jobs.verify.outputs.gate-aggregate-digest }}

permissions:
  contents: read

jobs:
  verify:
    name: Independently verify publication admission
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      capability-json: ${{ steps.result.outputs.capability-json }}
      capability-digest: ${{ steps.result.outputs.capability-digest }}
      capability-artifact: buildchain-publication-capability-${{ github.run_id }}-${{ github.run_attempt }}
      gate-aggregate-json: ${{ steps.result.outputs.gate-aggregate-json }}
      gate-aggregate-digest: ${{ steps.result.outputs.gate-aggregate-digest }}
    steps:
      - name: Require an immutable authority runtime
        if: ${{ !inputs.dry-run }}
        env:
          BUILDCHAIN_AUTHORITY_REF: ${{ inputs.buildchain-ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BUILDCHAIN_AUTHORITY_REF" =~ ^[0-9a-fA-F]{40}$ && ! "$BUILDCHAIN_AUTHORITY_REF" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::non-dry-run authority verification requires an exact 40- or 64-character Buildchain commit SHA"
            exit 1
          fi

      - name: Require complete sealed publication evidence
        if: ${{ !inputs.dry-run && !inputs.auto-admission }}
        env:
          BUILDCHAIN_PUBLICATION_ADMISSION_JSON: ${{ inputs.admission-json }}
          BUILDCHAIN_RUNNER_PROVENANCE_JSON: ${{ inputs.runner-provenance-json }}
          BUILDCHAIN_CONTROL_PLANE_AUDIT_JSON: ${{ inputs.control-plane-audit-json }}
          BUILDCHAIN_GATE_AGGREGATE_JSON: ${{ inputs.gate-aggregate-json }}
          BUILDCHAIN_PUBLICATION_EXPECTED_JSON: ${{ inputs.expected-json }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in BUILDCHAIN_PUBLICATION_ADMISSION_JSON BUILDCHAIN_RUNNER_PROVENANCE_JSON BUILDCHAIN_CONTROL_PLANE_AUDIT_JSON BUILDCHAIN_GATE_AGGREGATE_JSON BUILDCHAIN_PUBLICATION_EXPECTED_JSON; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            joined="$(IFS=,; echo "${missing[*]}")"
            echo "::error title=Sealed publication evidence unavailable::Missing ${joined}. Product publication was denied before artifact download. npm Trusted Publishing and OIDC were not evaluated; this denial does not mean either is absent or unable to publish."
            exit 1
          fi

      - name: Restrict automatic admission to declared managed publication surfaces
        if: ${{ !inputs.dry-run && inputs.auto-admission }}
        env:
          BUILDCHAIN_REPOSITORY: ${{ inputs.buildchain-repository }}
          BUILDCHAIN_SOURCE_SHA: ${{ inputs.source-sha }}
          BUILDCHAIN_TARGET_REF: ${{ inputs.target-ref }}
          BUILDCHAIN_PUBLISHER_WORKFLOW_PATH: ${{ inputs.publisher-workflow-path }}
          BUILDCHAIN_PUBLICATION_VERSION: ${{ inputs.publication-version }}
          BUILDCHAIN_AUTO_ADMISSION_KIND: ${{ inputs.auto-admission-kind }}
          BUILDCHAIN_AUTO_NO_GATE: ${{ inputs.auto-no-gate }}
          BUILDCHAIN_EVIDENCE_REPOSITORY: ${{ inputs.evidence-repository }}
          BUILDCHAIN_GATE_AGGREGATE_JSON: ${{ inputs.gate-aggregate-json }}
          BUILDCHAIN_PUBLICATION_TARGET: ${{ inputs.publication-target }}
          BUILDCHAIN_PACKAGE_NAME: ${{ inputs.package-name }}
          BUILDCHAIN_CONSUMER_QUALIFICATION_REQUIRED: ${{ inputs.consumer-qualification-required }}
          BUILDCHAIN_CONSUMER_PREDICATE_ID: ${{ inputs.consumer-predicate-id }}
          BUILDCHAIN_CONSUMER_PREDICATE_DIGEST: ${{ inputs.consumer-predicate-digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILDCHAIN_REPOSITORY" != "kungfu-systems/buildchain" ]]; then
            echo "::error::automatic publication admission requires the canonical Buildchain authority repository"
            exit 1
          fi
          if [[ ! "$BUILDCHAIN_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::automatic publication admission requires an exact 40-character source SHA"
            exit 1
          fi
          if [[ ! "$BUILDCHAIN_TARGET_REF" =~ ^(alpha|release)/v[0-9]+/v[0-9]+\.[0-9]+$ && "$BUILDCHAIN_TARGET_REF" != "publish-gate/major" && "$BUILDCHAIN_TARGET_REF" != "major-gate" ]]; then
            echo "::error::automatic publication admission target is not an allowed managed channel: $BUILDCHAIN_TARGET_REF"
            exit 1
          fi
          if [[ -z "$BUILDCHAIN_PUBLICATION_VERSION" ]]; then
            echo "::error::automatic publication admission requires an exact planned publication version"
            exit 1
          fi
          if [[ "$BUILDCHAIN_CONSUMER_QUALIFICATION_REQUIRED" == "true" ]]; then
            if [[ -z "$BUILDCHAIN_CONSUMER_PREDICATE_ID" || ! "$BUILDCHAIN_CONSUMER_PREDICATE_DIGEST" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "::error::consumer qualification requires an exact predicate id and SHA-256 command digest"
              exit 1
            fi
          fi
          case "$BUILDCHAIN_AUTO_ADMISSION_KIND" in
            release-candidate)
              if [[ "$BUILDCHAIN_EVIDENCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
                echo "::error::release-candidate admission evidence must belong to the caller repository"
                exit 1
              fi
              if [[ ! "$BUILDCHAIN_PUBLISHER_WORKFLOW_PATH" =~ ^\.github/workflows/[A-Za-z0-9._-]+\.ya?ml$ ]]; then
                echo "::error::release-candidate admission requires a repository-local publisher workflow path"
                exit 1
              fi
              if [[ -z "$BUILDCHAIN_PACKAGE_NAME" || "$BUILDCHAIN_PUBLICATION_TARGET" != "npm:${BUILDCHAIN_PACKAGE_NAME}" ]]; then
                echo "::error::release-candidate admission requires an exact npm target matching publication-package-name"
                exit 1
              fi
              if [[ -z "$BUILDCHAIN_GATE_AGGREGATE_JSON" && "$BUILDCHAIN_AUTO_NO_GATE" != "true" ]]; then
                echo "::error::release-candidate admission requires a Gate aggregate or explicit publication-auto-no-gate decision"
                exit 1
              fi
              ;;
            publication-artifact)
              if [[ "$BUILDCHAIN_EVIDENCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
                echo "::error::publication-artifact admission evidence must belong to the caller repository"
                exit 1
              fi
              if [[ ! "$BUILDCHAIN_PUBLISHER_WORKFLOW_PATH" =~ ^\.github/workflows/[A-Za-z0-9._-]+\.ya?ml$ ]]; then
                echo "::error::publication-artifact admission requires a repository-local publisher workflow path"
                exit 1
              fi
              ;;
            *)
              echo "::error::unsupported automatic admission kind: $BUILDCHAIN_AUTO_ADMISSION_KIND"
              exit 1
              ;;
          esac

      - name: Checkout exact Buildchain authority runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref }}
          path: .buildchain/authority-runtime
          persist-credentials: false

      - name: Download exact release-candidate passport evidence
        if: ${{ !inputs.dry-run && inputs.auto-admission-kind == 'release-candidate' }}
        uses: actions/download-artifact@v7.0.0
        with:
          repository: ${{ inputs.evidence-repository }}
          run-id: ${{ inputs.evidence-run-id }}
          github-token: ${{ github.token }}
          name: ${{ inputs.evidence-passport-artifact }}
          path: .buildchain/publication-evidence/passport

      - name: Download exact build-summary evidence
        if: ${{ !inputs.dry-run && inputs.auto-admission-kind == 'release-candidate' }}
        uses: actions/download-artifact@v7.0.0
        with:
          repository: ${{ inputs.evidence-repository }}
          run-id: ${{ inputs.evidence-run-id }}
          github-token: ${{ github.token }}
          name: ${{ inputs.evidence-summary-artifact }}
          path: .buildchain/publication-evidence/summary

      - name: Resolve referenced controller evidence
        if: ${{ !inputs.dry-run && inputs.auto-admission-kind == 'release-candidate' }}
        id: controller-evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const find = (root, name) => {
            const stack = [root];
            while (stack.length) {
              const current = stack.pop();
              for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
                const full = path.join(current, entry.name);
                if (entry.isDirectory()) stack.push(full);
                else if (entry.name === name) return full;
              }
            }
            return "";
          };
          const passportPath = find(".buildchain/publication-evidence/passport", "release-candidate-passport.json");
          if (!passportPath) throw new Error("release-candidate-passport.json is missing from exact evidence artifact");
          const passport = JSON.parse(fs.readFileSync(passportPath, "utf8"));
          if (!Array.isArray(passport.controllerReceipts) || passport.controllerReceipts.length !== 1) {
            throw new Error("publication evidence requires exactly one qualifying controller receipt reference");
          }
          const artifact = String(passport.controllerReceipts[0].artifact || "");
          if (!artifact) throw new Error("release-candidate passport controller receipt artifact is missing");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `controller-artifact=${artifact}\n`);
          NODE

      - name: Download referenced controller receipt evidence
        if: ${{ !inputs.dry-run && inputs.auto-admission-kind == 'release-candidate' }}
        uses: actions/download-artifact@v7.0.0
        with:
          repository: ${{ inputs.evidence-repository }}
          run-id: ${{ inputs.evidence-run-id }}
          github-token: ${{ github.token }}
          name: ${{ steps.controller-evidence.outputs.controller-artifact }}
          path: .buildchain/publication-evidence/controller

      - name: Download exact artifact manifest evidence
        if: ${{ !inputs.dry-run && inputs.auto-admission-kind == 'release-candidate' }}
        uses: actions/download-artifact@v7.0.0
        with:
          repository: ${{ inputs.evidence-repository }}
          run-id: ${{ inputs.evidence-run-id }}
          github-token: ${{ github.token }}
          pattern: ${{ inputs.evidence-manifest-pattern }}
          path: .buildchain/publication-evidence/manifests

      - name: Download exact candidate payload evidence
        if: ${{ !inputs.dry-run && inputs.auto-admission-kind == 'release-candidate' }}
        uses: actions/download-artifact@v7.0.0
        with:
          repository: ${{ inputs.evidence-repository }}
          run-id: ${{ inputs.evidence-run-id }}
          github-token: ${{ github.token }}
          pattern: ${{ inputs.evidence-payload-pattern }}
          path: .buildchain/publication-evidence/payloads

      - name: Download exact publication artifact candidate
        if: ${{ !inputs.dry-run && inputs.auto-admission-kind == 'publication-artifact' }}
        uses: actions/download-artifact@v7.0.0
        with:
          repository: ${{ inputs.evidence-repository }}
          run-id: ${{ inputs.evidence-run-id }}
          github-token: ${{ github.token }}
          name: ${{ inputs.evidence-publication-artifact }}
          path: .buildchain/publication-evidence/artifact

      - name: Download exact publication controller receipt
        if: ${{ !inputs.dry-run && inputs.auto-admission-kind == 'publication-artifact' }}
        uses: actions/download-artifact@v7.0.0
        with:
          repository: ${{ inputs.evidence-repository }}
          run-id: ${{ inputs.evidence-run-id }}
          github-token: ${{ github.token }}
          name: ${{ inputs.evidence-controller-artifact }}
          path: .buildchain/publication-evidence/controller

      - name: Audit managed release-candidate publication control plane
        if: ${{ !inputs.dry-run && inputs.auto-admission && inputs.auto-admission-kind == 'release-candidate' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .buildchain/publication-authority/auto
          node .buildchain/authority-runtime/scripts/audit-publication-control-plane.mjs \
            --repository "${{ inputs.evidence-repository }}" \
            --workflow-repository "${{ inputs.buildchain-repository }}" \
            --branch "${{ inputs.target-ref }}" \
            --source-sha "${{ inputs.source-sha }}" \
            --workflow .github/workflows/release-candidate-promote.yml \
            --workflow-ref "${{ inputs.buildchain-ref }}" \
            --publisher-workflow "${{ inputs.publisher-workflow-path }}" \
            --required-status-check "${{ inputs.required-status-check }}" \
            --job promote \
            --environment none \
            --package "${{ inputs.package-name }}" \
            --output .buildchain/publication-authority/auto/control-plane.json

      - name: Assemble managed release-candidate admission
        if: ${{ !inputs.dry-run && inputs.auto-admission && inputs.auto-admission-kind == 'release-candidate' }}
        id: auto-evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_REPOSITORY: ${{ inputs.evidence-repository }}
          BUILDCHAIN_SOURCE_SHA: ${{ inputs.source-sha }}
          BUILDCHAIN_AUTHORITY_WORKFLOW_PATH: .github/workflows/release-candidate-promote.yml
          BUILDCHAIN_PUBLISHER_WORKFLOW_PATH: ${{ inputs.publisher-workflow-path }}
          BUILDCHAIN_CONTROL_PLANE_AUDIT_PATH: .buildchain/publication-authority/auto/control-plane.json
          BUILDCHAIN_PUBLICATION_ENVIRONMENT: none
          BUILDCHAIN_PUBLICATION_PRODUCT: ${{ inputs.product }}
          BUILDCHAIN_PUBLICATION_TARGET: ${{ inputs.publication-target }}
          BUILDCHAIN_PUBLICATION_VERSION: ${{ inputs.publication-version }}
          BUILDCHAIN_PUBLICATION_CHANNEL: ${{ startsWith(inputs.target-ref, 'release/') && 'release' || startsWith(inputs.target-ref, 'alpha/') && 'alpha' || 'major' }}
          BUILDCHAIN_GATE_AGGREGATE_JSON: ${{ inputs.gate-aggregate-json }}
          BUILDCHAIN_ALLOW_NO_GATE: ${{ inputs.auto-no-gate }}
          BUILDCHAIN_CONSUMER_QUALIFICATION_REQUIRED: ${{ inputs.consumer-qualification-required }}
          BUILDCHAIN_CONSUMER_PREDICATE_ID: ${{ inputs.consumer-predicate-id }}
          BUILDCHAIN_CONSUMER_PREDICATE_DIGEST: ${{ inputs.consumer-predicate-digest }}
        shell: bash
        run: node .buildchain/authority-runtime/scripts/assemble-self-publication-admission.mjs

      - name: Audit managed paper publication control plane
        if: ${{ !inputs.dry-run && inputs.auto-admission && inputs.auto-admission-kind == 'publication-artifact' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .buildchain/publication-authority/auto
          node .buildchain/authority-runtime/scripts/audit-publication-control-plane.mjs \
            --repository "${{ inputs.evidence-repository }}" \
            --workflow-repository "${{ inputs.buildchain-repository }}" \
            --branch "${{ inputs.target-ref }}" \
            --source-sha "${{ inputs.source-sha }}" \
            --workflow "${{ inputs.authority-workflow-path || '.github/workflows/paper-release-sealed.yml' }}" \
            --workflow-ref "${{ inputs.buildchain-ref }}" \
            --publisher-workflow "${{ inputs.publisher-workflow-path }}" \
            --required-status-check "${{ inputs.required-status-check }}" \
            --job publish \
            --environment none \
            --package "${{ inputs.package-name }}" \
            --output .buildchain/publication-authority/auto/control-plane.json

      - name: Assemble managed publication artifact admission
        if: ${{ !inputs.dry-run && inputs.auto-admission && inputs.auto-admission-kind == 'publication-artifact' }}
        id: paper-auto-evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_REPOSITORY: ${{ inputs.evidence-repository }}
          BUILDCHAIN_SOURCE_SHA: ${{ inputs.source-sha }}
          BUILDCHAIN_PUBLISHER_WORKFLOW_PATH: ${{ inputs.publisher-workflow-path }}
          BUILDCHAIN_AUTHORITY_WORKFLOW_PATH: ${{ inputs.authority-workflow-path || '.github/workflows/paper-release-sealed.yml' }}
          BUILDCHAIN_CONTROL_PLANE_AUDIT_PATH: .buildchain/publication-authority/auto/control-plane.json
          BUILDCHAIN_PUBLICATION_PRODUCT: ${{ inputs.product }}
          BUILDCHAIN_PUBLICATION_TARGET: ${{ inputs.publication-target }}
          BUILDCHAIN_PUBLICATION_VERSION: ${{ inputs.publication-version }}
          BUILDCHAIN_PUBLICATION_CHANNEL: ${{ startsWith(inputs.target-ref, 'release/') && 'release' || 'alpha' }}
          BUILDCHAIN_CONSUMER_QUALIFICATION_REQUIRED: ${{ inputs.consumer-qualification-required }}
          BUILDCHAIN_CONSUMER_PREDICATE_ID: ${{ inputs.consumer-predicate-id }}
          BUILDCHAIN_CONSUMER_PREDICATE_DIGEST: ${{ inputs.consumer-predicate-digest }}
        shell: bash
        run: node .buildchain/authority-runtime/scripts/assemble-publication-artifact-admission.mjs

      - name: Verify sealed publication admission
        if: ${{ !inputs.dry-run }}
        env:
          BUILDCHAIN_PUBLICATION_ADMISSION_JSON: ${{ inputs.admission-json || steps.auto-evidence.outputs.admission-json || steps.paper-auto-evidence.outputs.admission-json }}
          BUILDCHAIN_RUNNER_PROVENANCE_JSON: ${{ inputs.runner-provenance-json || steps.auto-evidence.outputs.runner-provenance-json || steps.paper-auto-evidence.outputs.runner-provenance-json }}
          BUILDCHAIN_CONTROL_PLANE_AUDIT_JSON: ${{ inputs.control-plane-audit-json || steps.auto-evidence.outputs.control-plane-audit-json || steps.paper-auto-evidence.outputs.control-plane-audit-json }}
          BUILDCHAIN_GATE_AGGREGATE_JSON: ${{ inputs.gate-aggregate-json || steps.auto-evidence.outputs.gate-aggregate-json || steps.paper-auto-evidence.outputs.gate-aggregate-json }}
          BUILDCHAIN_PUBLICATION_EXPECTED_JSON: ${{ inputs.expected-json || steps.auto-evidence.outputs.expected-json || steps.paper-auto-evidence.outputs.expected-json }}
          BUILDCHAIN_USED_NONCES_JSON: ${{ inputs.used-nonces-json }}
          BUILDCHAIN_PLANNED_PUBLICATION_VERSION: ${{ inputs.publication-version }}
          BUILDCHAIN_AUTO_ADMISSION_KIND: ${{ inputs.auto-admission-kind }}
          BUILDCHAIN_CONSUMER_QUALIFICATION_REQUIRED: ${{ inputs.consumer-qualification-required }}
          BUILDCHAIN_CONSUMER_PREDICATE_ID: ${{ inputs.consumer-predicate-id }}
          BUILDCHAIN_CONSUMER_PREDICATE_DIGEST: ${{ inputs.consumer-predicate-digest }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import { execFileSync } from "node:child_process";
          import path from "node:path";
          import { verifyPublicationAdmission } from "./.buildchain/authority-runtime/packages/core/publication-authority.js";
          import { buildPublicationArtifactCandidate } from "./.buildchain/authority-runtime/scripts/publication-artifact-candidate.mjs";
          const parse = (name) => JSON.parse(process.env[name]);
          const filesNamed = (root, name) => {
            const matches = [];
            const stack = [root];
            while (stack.length) {
              const current = stack.pop();
              for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
                const full = path.join(current, entry.name);
                if (entry.isDirectory()) stack.push(full);
                else if (entry.name === name) matches.push(full);
              }
            }
            return matches.sort();
          };
          const one = (root, name) => {
            const matches = filesNamed(root, name);
            if (matches.length !== 1) throw new Error(`expected exactly one ${name} under ${root}, found ${matches.length}`);
            return JSON.parse(fs.readFileSync(matches[0], "utf8"));
          };
          const sha256File = (file) => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const payloadFor = (manifest) => {
            const root = path.join(".buildchain/publication-evidence/payloads", manifest.artifactName);
            if (!fs.existsSync(root)) throw new Error(`candidate payload artifact is missing: ${manifest.artifactName}`);
            return {
              artifactName: manifest.artifactName,
              files: (manifest.files || []).filter((entry) => !entry.path.startsWith(".buildchain/")).map((entry) => {
                if (path.isAbsolute(entry.path) || entry.path.includes("\\") || entry.path.split("/").includes("..")) {
                  throw new Error(`candidate payload manifest contains an unsafe path: ${entry.path}`);
                }
                const file = path.join(root, entry.path);
                if (!fs.existsSync(file) || !fs.statSync(file).isFile()) {
                  throw new Error(`candidate payload file is missing: ${manifest.artifactName}/${entry.path}`);
                }
                return { path: entry.path, size: fs.statSync(file).size, sha256: sha256File(file) };
              }),
            };
          };
          const admission = parse("BUILDCHAIN_PUBLICATION_ADMISSION_JSON");
          const response = await fetch(
            `${process.env.GITHUB_API_URL}/repos/${admission.repository}/git/commits/${admission.sourceSha}`,
            {
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                "x-github-api-version": "2022-11-28",
              },
            },
          );
          if (!response.ok) throw new Error(`could not resolve admitted source tree: GitHub API ${response.status}`);
          const commit = await response.json();
          const actualRuntimeSha = execFileSync("git", ["-C", ".buildchain/authority-runtime", "rev-parse", "HEAD"], { encoding: "utf8" }).trim().toLowerCase();
          let publicationEvidence;
          if (process.env.BUILDCHAIN_AUTO_ADMISSION_KIND === "publication-artifact") {
            const candidateBundle = buildPublicationArtifactCandidate({
              artifactRoot: ".buildchain/publication-evidence/artifact",
              controllerRoot: ".buildchain/publication-evidence/controller",
              repository: admission.repository,
              sourceSha: admission.sourceSha,
              sourceTreeSha: commit.tree?.sha,
              runtimeSha: actualRuntimeSha,
            });
            publicationEvidence = {
              publicationArtifactCandidate: candidateBundle.evidence,
              gateAggregate: parse("BUILDCHAIN_GATE_AGGREGATE_JSON"),
            };
          } else {
            const artifactManifests = filesNamed(".buildchain/publication-evidence/manifests", "manifest.json")
              .map((file) => JSON.parse(fs.readFileSync(file, "utf8")));
            publicationEvidence = {
              sourceTreeSha: commit.tree?.sha,
              releaseCandidatePassport: one(".buildchain/publication-evidence/passport", "release-candidate-passport.json"),
              buildSummary: one(".buildchain/publication-evidence/summary", "build-summary.json"),
              controllerReceipt: one(".buildchain/publication-evidence/controller", "release-candidate-receipt.json"),
              gateAggregate: parse("BUILDCHAIN_GATE_AGGREGATE_JSON"),
              artifactManifests,
              artifactPayloads: artifactManifests.map(payloadFor),
            };
          }
          const capability = verifyPublicationAdmission({
            admission,
            registry: JSON.parse(fs.readFileSync(".buildchain/authority-runtime/dist/site/publication-authority-registry.json", "utf8")),
            runnerProvenance: parse("BUILDCHAIN_RUNNER_PROVENANCE_JSON"),
            controlPlaneAudit: parse("BUILDCHAIN_CONTROL_PLANE_AUDIT_JSON"),
            publicationEvidence,
            expected: parse("BUILDCHAIN_PUBLICATION_EXPECTED_JSON"),
            usedNonces: parse("BUILDCHAIN_USED_NONCES_JSON"),
          });
          if (capability.runtimeSha !== actualRuntimeSha) {
            throw new Error(`authority runtime checkout mismatch: expected ${capability.runtimeSha}, got ${actualRuntimeSha}`);
          }
          if (capability.version !== process.env.BUILDCHAIN_PLANNED_PUBLICATION_VERSION) {
            throw new Error(`authority publication version mismatch: planned ${process.env.BUILDCHAIN_PLANNED_PUBLICATION_VERSION || "<empty>"}, capability ${capability.version || "<empty>"}`);
          }
          const qualificationRequired = process.env.BUILDCHAIN_CONSUMER_QUALIFICATION_REQUIRED === "true";
          // Runtimes published before the consumer-qualification capability
          // omit this optional field. Preserve fail-closed behavior when a
          // predicate is required, while treating the legacy omission as the
          // equivalent of the explicit non-required shape.
          const capabilityQualificationRequired = capability.qualification?.required === true;
          if (capabilityQualificationRequired !== qualificationRequired) {
            throw new Error("authority consumer qualification requirement mismatch");
          }
          if (qualificationRequired && (
            capability.qualification.predicateId !== process.env.BUILDCHAIN_CONSUMER_PREDICATE_ID ||
            capability.qualification.predicateDigest !== process.env.BUILDCHAIN_CONSUMER_PREDICATE_DIGEST
          )) {
            throw new Error("authority consumer predicate binding mismatch");
          }
          fs.mkdirSync(".buildchain/publication-authority", { recursive: true });
          fs.writeFileSync(".buildchain/publication-authority/capability.json", `${JSON.stringify(capability, null, 2)}\n`);
          fs.writeFileSync(".buildchain/publication-authority/gate-aggregate.json", `${JSON.stringify(publicationEvidence.gateAggregate, null, 2)}\n`);
          NODE

      - name: Record non-authorizing dry-run result
        if: ${{ inputs.dry-run }}
        run: |
          mkdir -p .buildchain/publication-authority
          printf '%s\n' '{"schemaVersion":1,"contract":"kungfu-buildchain-publication-capability-dry-run","decision":"dry-run"}' > .buildchain/publication-authority/capability.json

      - name: Export capability result
        id: result
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync(".buildchain/publication-authority/capability.json", "utf8"));
          const gatePath = ".buildchain/publication-authority/gate-aggregate.json";
          const gate = fs.existsSync(gatePath) ? JSON.parse(fs.readFileSync(gatePath, "utf8")) : null;
          const output = fs.createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
          output.write(`capability-json=${JSON.stringify(value)}\n`);
          output.write(`capability-digest=${value.capabilityDigest || ""}\n`);
          output.write(`gate-aggregate-json=${gate ? JSON.stringify(gate) : ""}\n`);
          output.write(`gate-aggregate-digest=${gate?.digest || ""}\n`);
          output.end();
          NODE

      - name: Upload publication capability receipt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-publication-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: .buildchain/publication-authority/capability.json
          if-no-files-found: error

      - name: Upload assembled self-publication evidence
        if: ${{ !inputs.dry-run && inputs.auto-admission }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-self-publication-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: .buildchain/publication-authority/auto/*.json
          if-no-files-found: error
