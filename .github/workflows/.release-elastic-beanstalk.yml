on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      eb-environment-name:
        required: true
        type: string
      eb-application-name:
        required: true
        type: string
    secrets:
      AWS_USER_ACCESS_KEY_ID:
        required: true
      AWS_USER_SECRET_ACCESS_KEY:
        required: true
      GITHUB_PUSH_TOKEN:
        required: true

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Elastic Beanstalk release workflow retired
        run: |
          echo "::error::The workflows v2 Elastic Beanstalk release path is retired."
          echo "::error::Do not use .release-elastic-beanstalk.yml; use a project lifecycle.publish command behind release-candidate-promote.yml@v2 so publish-gate source-lock enforcement applies."
          exit 1
