          plan_file="$(find .buildchain/downloaded-plans -name web-surface-staging-plan.json -print -quit)"
          if [ -z "$plan_file" ]; then
            echo "::error::staging apply requested but staging plan artifact was not found"
            exit 1
          fi
          node .buildchain/runtime/scripts/web-surface.mjs \
            --mode deploy-apply \
            --cwd "${{ inputs.working-directory }}" \
            --plan "$plan_file" \
            --dry-run false \
            --actor "${{ github.actor }}" \
            --run-id "${{ github.run_id }}" \
            --output .buildchain/web-surface-staging-apply.json

      - name: Health check staging deploy
        id: health
        run: |
          set -euo pipefail
          node .buildchain/runtime/scripts/web-surface.mjs \
            --mode health-check \
            --cwd "${{ inputs.working-directory }}" \
            --result .buildchain/web-surface-staging-apply.json \
            --output .buildchain/web-surface-staging-health.json

      - name: Write staging release PR summary
        run: >-
          node .buildchain/runtime/scripts/web-surface-production-release-pr.mjs
          write-summary
          --input .buildchain/web-surface-staging-apply.json
          --output .buildchain/web-surface-staging-release-pr-summary.json

      - name: Summarize staging apply
        if: ${{ always() }}
        run: |
          {
            echo "## Staging apply"
            node -e 'const fs=require("fs"); const read=(p)=>fs.existsSync(p)?JSON.parse(fs.readFileSync(p,"utf8")):{}; const r=read(".buildchain/web-surface-staging-apply.json"); const h=read(".buildchain/web-surface-staging-health.json"); const urls=Object.entries(r.urls||{default:r.url||""}).filter(([,u])=>u).map(([s,u])=>"- "+s+": "+u).join("\n"); console.log(urls+"\n- status: "+(r.status||"missing")+"\n- health: "+(h.status||"missing")+"\n- target: "+(r.target||"")+"\n- source: "+(r.sourceSha||"")+"\n- artifact: "+(r.artifactHash||""))'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging apply diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-web-surface-staging-diagnostics
          path: |
            .buildchain/web-surface-staging-apply.json
            .buildchain/web-surface-staging-health.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload staging release PR summary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-web-surface-staging-release-pr-summary
          path: .buildchain/web-surface-staging-release-pr-summary.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Comment staging deploy feedback and write passport
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_WEB_SURFACE_CHANNEL: staging
          BUILDCHAIN_RUNTIME_SHA: ${{ needs.runtime.outputs.runtime-sha }}
          BUILDCHAIN_ROLLBACK_POINTER: ${{ needs.runtime.outputs.rollback-ref }}
          APPLY_RESULT_PATH: .buildchain/web-surface-staging-apply.json
          HEALTH_RESULT_PATH: .buildchain/web-surface-staging-health.json
          APPLY_STEP_OUTCOME: ${{ steps.apply.outcome }}
          JOB_STATUS: ${{ job.status }}
          OUTPUT_PATH: .buildchain/web-surface-staging-release-passport.json
          PASSPORT_ARTIFACT_NAME: buildchain-web-surface-staging-release-passport
          RELEASE_FEEDBACK_ACTOR_PRIVACY: ${{ inputs.release-feedback-actor-privacy }}
          AWS_ROLE_ARN: ${{ inputs.staging-aws-role-arn }}
        run: node .buildchain/runtime/scripts/web-surface-release-feedback.mjs

      - name: Upload staging release passport
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-web-surface-staging-release-passport
          path: .buildchain/web-surface-staging-release-passport.json
          include-hidden-files: true
          if-no-files-found: error

  open-production-release-pr:
    name: Open production release PR
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref_name == 'main' &&
        inputs.staging-apply &&
        inputs.production-release-on-main &&
        needs.staging-apply.result == 'success' &&
        needs.release-intent.outputs.production-release-approved != 'true'
      }}
    runs-on: ubuntu-24.04
    needs:
      - runtime
      - release-intent
      - staging-apply
    outputs:
      release-pr-status: ${{ steps.open.outputs.release-pr-status }}
      production-release-pr-status: ${{ steps.open.outputs.production-release-pr-status }}
      production-release-pr-url: ${{ steps.open.outputs.production-release-pr-url }}
      production-release-pr: ${{ steps.open.outputs.production-release-pr }}
      production-release-branch: ${{ steps.open.outputs.production-release-branch }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.runtime.outputs.runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable pnpm
        run: |
          corepack prepare pnpm@11.7.0 --activate
          corepack enable
          pnpm --version

      - name: Install Buildchain runtime
        working-directory: .buildchain/runtime
        run: pnpm install --frozen-lockfile

      - name: Download staging release PR summary
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-web-surface-staging-release-pr-summary
          path: .buildchain/staging-release-pr-summary

      - name: Download staging release passport
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-web-surface-staging-release-passport
          path: .buildchain/staging-release-passport

      - name: Resolve production release token config
        id: production-release-token-config
        env:
          PRODUCTION_RELEASE_APP_CLIENT_ID: ${{ inputs.production-release-app-client-id || inputs.production-release-app-id }}
          PRODUCTION_RELEASE_APP_PRIVATE_KEY_PRESENT: ${{ secrets.production-release-app-private-key != '' }}
          PRODUCTION_RELEASE_PR_TOKEN_PRESENT: ${{ inputs.production-release-pr-token != '' }}
        run: |
          set -euo pipefail
          app_token_status="not-configured"
          app_token_requested="false"
          if [ -n "$PRODUCTION_RELEASE_APP_CLIENT_ID" ]; then
            if [ "$PRODUCTION_RELEASE_APP_PRIVATE_KEY_PRESENT" = "true" ]; then
              app_token_status="requested"
              app_token_requested="true"
            else
              app_token_status="missing-private-key"
            fi
          elif [ "$PRODUCTION_RELEASE_APP_PRIVATE_KEY_PRESENT" = "true" ]; then
            app_token_status="missing-client-id"
          fi
          {
            echo "app-token-status=$app_token_status"
            echo "app-token-requested=$app_token_requested"
            echo "app-client-id-configured=$([ -n "$PRODUCTION_RELEASE_APP_CLIENT_ID" ] && echo true || echo false)"
            echo "app-private-key-configured=$PRODUCTION_RELEASE_APP_PRIVATE_KEY_PRESENT"
            echo "pr-token-configured=$PRODUCTION_RELEASE_PR_TOKEN_PRESENT"
          } >> "$GITHUB_OUTPUT"

      - name: Create production release app token
        id: production-release-app-token
        if: ${{ steps.production-release-token-config.outputs.app-token-requested == 'true' }}
        uses: actions/create-github-app-token@v3.1.1
        continue-on-error: true
        with:
          client-id: ${{ inputs.production-release-app-client-id || inputs.production-release-app-id }}
          private-key: ${{ secrets.production-release-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Resolve production release token source
        id: production-release-token
        env:
          APP_TOKEN_STATUS: ${{ steps.production-release-token-config.outputs.app-token-status }}
          APP_TOKEN_OUTCOME: ${{ steps.production-release-app-token.outcome }}
          APP_TOKEN_PRESENT: ${{ steps.production-release-app-token.outputs.token != '' }}
          PR_TOKEN_CONFIGURED: ${{ steps.production-release-token-config.outputs.pr-token-configured }}
        run: |
          set -euo pipefail
          token_source="github-token"
          app_token_status="$APP_TOKEN_STATUS"
          app_token_unavailable="false"
          if [ "$APP_TOKEN_STATUS" = "requested" ]; then
            if [ "$APP_TOKEN_OUTCOME" = "success" ] && [ "$APP_TOKEN_PRESENT" = "true" ]; then
              token_source="github-app"
              app_token_status="available"
            else
              app_token_status="create-failed"
              app_token_unavailable="true"
            fi
          elif [ "$APP_TOKEN_STATUS" != "not-configured" ]; then
            app_token_unavailable="true"
          fi
          if [ "$token_source" = "github-token" ] && [ "$PR_TOKEN_CONFIGURED" = "true" ]; then
            token_source="production-release-pr-token"
          fi
          {
            echo "token-source=$token_source"
            echo "app-token-status=$app_token_status"
            echo "app-token-unavailable=$app_token_unavailable"
          } >> "$GITHUB_OUTPUT"

      - name: Open production release PR
        id: open
        env:
          GITHUB_TOKEN: ${{ steps.production-release-app-token.outputs.token || inputs.production-release-pr-token || github.token }}
          PRODUCTION_RELEASE_TOKEN_SOURCE: ${{ steps.production-release-token.outputs.token-source }}
          PRODUCTION_RELEASE_APP_TOKEN_STATUS: ${{ steps.production-release-token.outputs.app-token-status }}
          PRODUCTION_RELEASE_APP_TOKEN_UNAVAILABLE: ${{ steps.production-release-token.outputs.app-token-unavailable }}
          PRODUCTION_RELEASE_APP_CLIENT_ID_CONFIGURED: ${{ steps.production-release-token-config.outputs.app-client-id-configured }}
          PRODUCTION_RELEASE_APP_PRIVATE_KEY_CONFIGURED: ${{ steps.production-release-token-config.outputs.app-private-key-configured }}
          PRODUCTION_RELEASE_PR_TOKEN_CONFIGURED: ${{ steps.production-release-token-config.outputs.pr-token-configured }}
          STAGING_RELEASE_PR_SUMMARY_PATH: .buildchain/staging-release-pr-summary/web-surface-staging-release-pr-summary.json
          PRODUCTION_RELEASE_PR_SUMMARY_PATH: .buildchain/production-release-pr/handoff.json
          PRODUCTION_RELEASE_PR_BODY_PATH: .buildchain/production-release-pr/body.md
          PRODUCTION_RELEASE_PR_MODE: ${{ inputs.production-release-pr-mode }}
          FAIL_ON_RELEASE_PR_ERROR: ${{ inputs.fail-on-release-pr-error }}
          PRODUCTION_RELEASE_LABEL: ${{ inputs.production-release-label }}
          PRODUCTION_RELEASE_HEAD_PREFIX: ${{ inputs.production-release-head-prefix }}
          PRODUCTION_RELEASE_CHANNEL: ${{ inputs.production-release-branch-channel }}
          RELEASE_PASSPORT_ARTIFACT: buildchain-web-surface-staging-release-passport
        run: node .buildchain/runtime/scripts/web-surface-production-release-pr.mjs

      - name: Upload production release PR handoff
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-web-surface-production-release-pr-handoff
          path: |
            .buildchain/production-release-pr/handoff.json
            .buildchain/production-release-pr/body.md
            .buildchain/staging-release-pr-summary/web-surface-staging-release-pr-summary.json
            .buildchain/staging-release-passport/web-surface-staging-release-passport.json
          include-hidden-files: true
          if-no-files-found: warn

  external-publication-authority:
    name: Verify external web production publication capability
    needs:
      - plan
      - runtime
      - publication-decision
    if: >-
      ${{
        inputs.production-apply &&
        needs.publication-decision.outputs.approved == 'true' &&
        (inputs.publication-admission-json != '' || inputs.publication-runner-provenance-json != '' || inputs.publication-control-plane-audit-json != '' || inputs.publication-gate-aggregate-json != '' || inputs.publication-expected-json != '')
      }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/.publication-authority.yml
    with:
      buildchain-repository: ${{ inputs.buildchain-repository }}
      buildchain-ref: ${{ needs.runtime.outputs.runtime-sha }}
      admission-json: ${{ inputs.publication-admission-json }}
      runner-provenance-json: ${{ inputs.publication-runner-provenance-json }}
      control-plane-audit-json: ${{ inputs.publication-control-plane-audit-json }}
      gate-aggregate-json: ${{ inputs.publication-gate-aggregate-json }}
      expected-json: ${{ inputs.publication-expected-json }}
      used-nonces-json: ${{ inputs.publication-used-nonces-json }}

  publication-authority:
    name: Seal managed web production publication capability
    runs-on: ubuntu-24.04
    needs:
      - plan
      - runtime
      - controller-plan
      - publication-decision
    if: >-
      ${{
        inputs.production-apply &&
        needs.publication-decision.outputs.approved == 'true' &&
        inputs.publication-admission-json == '' && inputs.publication-runner-provenance-json == '' && inputs.publication-control-plane-audit-json == '' && inputs.publication-gate-aggregate-json == '' && inputs.publication-expected-json == ''
      }}
    permissions:
      actions: read
      contents: read
    outputs:
      capability-json: ${{ steps.authority.outputs.capability-json }}
      capability-digest: ${{ steps.authority.outputs.capability-digest }}
      candidate-json: ${{ steps.authority.outputs.candidate-json }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.runtime.outputs.runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Download web-surface controller plan
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.controller-plan.outputs.controller-plan-artifact }}
          path: .buildchain/controller

      - name: Download web-surface production plan
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-web-surface-plans
          path: .buildchain/controller/web-plans

      - name: Select production plan evidence
        shell: bash
        run: |
          set -euo pipefail
          plan_file="$(find .buildchain/controller/web-plans -name web-surface-production-plan.json -print -quit)"
          if [ -z "$plan_file" ]; then
            echo "::error::managed production authority requires exactly one production plan"
            exit 1
          fi
          cp "$plan_file" .buildchain/controller/web-surface-plan.json

      - name: Create qualifying pre-publication controller receipt
        run: node .buildchain/runtime/scripts/controller-evidence.mjs --mode receipt
        env:
          BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
          BUILDCHAIN_CONTROLLER_STAGES_JSON: >-
            [{"id":"resolve-runtime","status":"${{ needs.runtime.result }}"},{"id":"plan","status":"${{ needs.plan.result }}"},{"id":"build","status":"${{ needs.plan.outputs.build-outcome || needs.plan.result }}"},{"id":"verify","status":"${{ needs.plan.outputs.verify-outcome || needs.plan.result }}"},{"id":"publication-authority","status":"skipped"},{"id":"apply","status":"skipped"},{"id":"aggregate","status":"success"}]
          BUILDCHAIN_CONTROLLER_EVIDENCE_FILES_JSON: '[{"kind":"web-surface-plan","path":".buildchain/controller/web-surface-plan.json"}]'
          BUILDCHAIN_CONTROLLER_RECEIPT_ARTIFACT: buildchain-web-surface-prepublication-receipt-${{ github.sha }}
          BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json

      - name: Assemble and verify managed web publication admission
        id: authority
        run: node .buildchain/runtime/scripts/assemble-web-surface-publication-admission.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_SOURCE_SHA: ${{ github.sha }}
          BUILDCHAIN_RUNTIME_ROOT: .buildchain/runtime
          BUILDCHAIN_WEB_SURFACE_PLAN_PATH: .buildchain/controller/web-surface-plan.json
          BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json
          BUILDCHAIN_PRODUCTION_DECISION_JSON: ${{ needs.publication-decision.outputs.decision-json }}
          BUILDCHAIN_PUBLICATION_ENVIRONMENT: ${{ inputs.production-environment }}
          BUILDCHAIN_PRODUCTION_ROLE_ARN: ${{ inputs.production-aws-role-arn }}
          BUILDCHAIN_OUTPUT_DIR: .buildchain/web-publication-authority

      - name: Upload managed web publication authority evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-web-publication-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: .buildchain/web-publication-authority/*.json
          if-no-files-found: error

  production-apply:
    name: Apply production deploy
    if: >-
      ${{ always() &&
        inputs.production-apply &&
        needs.publication-decision.outputs.approved == 'true' &&
        (needs.publication-authority.result == 'success' || needs.external-publication-authority.result == 'success')
      }}
    runs-on: ubuntu-24.04
    needs:
      - plan
      - runtime
      - release-intent
      - publication-decision
      - publication-authority
      - external-publication-authority
    environment: ${{ inputs.production-environment }}
    outputs:
      production-apply-result-json: ${{ steps.apply.outputs.web-surface-apply-result-json }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.runtime.outputs.runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable pnpm
        run: |
          corepack prepare pnpm@11.7.0 --activate
          corepack enable
          pnpm --version

      - name: Install Buildchain runtime
        working-directory: .buildchain/runtime
        run: pnpm install --frozen-lockfile

      - name: Download web-surface plan
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-web-surface-plans
          path: .buildchain/downloaded-plans

      - name: Verify sealed production capability before artifact download
        env:
          BUILDCHAIN_PUBLICATION_CAPABILITY_JSON: ${{ needs.publication-authority.outputs.capability-json || needs.external-publication-authority.outputs.capability-json }}
          BUILDCHAIN_WEB_SURFACE_CANDIDATE_JSON: ${{ needs.publication-authority.outputs.candidate-json }}
          BUILDCHAIN_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_SOURCE_SHA: ${{ github.sha }}
          BUILDCHAIN_RUNTIME_SHA: ${{ needs.runtime.outputs.runtime-sha }}
          BUILDCHAIN_PUBLICATION_ENVIRONMENT: ${{ inputs.production-environment }}
          BUILDCHAIN_PRODUCTION_ROLE_ARN: ${{ inputs.production-aws-role-arn }}
          BUILDCHAIN_WEB_SURFACE_PLAN_PATH: .buildchain/downloaded-plans/web-surface-production-plan.json
        run: node .buildchain/runtime/scripts/verify-web-surface-publication-capability.mjs

      - name: Download web-surface artifact
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-web-surface-artifact
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}

      - name: Validate production role
        env:
          ROLE_ARN: ${{ inputs.production-aws-role-arn }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::production-aws-role-arn is required when production-apply is true"
            exit 1
          fi

      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.production-aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: buildchain-production-${{ github.run_id }}

      - name: Preflight production readiness
        id: preflight
        run: |
          set -euo pipefail
          plan_file="$(find .buildchain/downloaded-plans -name web-surface-production-plan.json -print -quit)"
          if [ -z "$plan_file" ]; then
            echo "::error::production preflight requested but production plan artifact was not found"
            exit 1
          fi
          node .buildchain/runtime/scripts/web-surface.mjs \
            --mode production-preflight \
            --cwd "${{ inputs.working-directory }}" \
            --plan "$plan_file" \
            --execute true \
            --output .buildchain/web-surface-production-preflight.json

      - name: Apply production deploy
        id: apply
        run: |
          set -euo pipefail
          plan_file="$(find .buildchain/downloaded-plans -name web-surface-production-plan.json -print -quit)"
          if [ -z "$plan_file" ]; then
            echo "::error::production apply requested but production plan artifact was not found"
            exit 1
          fi
          node .buildchain/runtime/scripts/web-surface.mjs \
            --mode deploy-apply \
            --cwd "${{ inputs.working-directory }}" \
            --plan "$plan_file" \
            --dry-run false \
            --actor "${{ github.actor }}" \
            --run-id "${{ github.run_id }}" \
            --output .buildchain/web-surface-production-apply.json

      - name: Health check production deploy
        id: health
        run: |
          set -euo pipefail
          node .buildchain/runtime/scripts/web-surface.mjs \
            --mode health-check \
            --cwd "${{ inputs.working-directory }}" \
            --result .buildchain/web-surface-production-apply.json \
            --output .buildchain/web-surface-production-health.json

      - name: Summarize production apply
        if: ${{ always() }}
        run: |
          {
            echo "## Production apply"
            node -e 'const fs=require("fs"); const read=(p)=>fs.existsSync(p)?JSON.parse(fs.readFileSync(p,"utf8")):{}; const r=read(".buildchain/web-surface-production-apply.json"); const p=read(".buildchain/web-surface-production-preflight.json"); const h=read(".buildchain/web-surface-production-health.json"); const urls=Object.entries(r.urls||{default:r.url||""}).filter(([,u])=>u).map(([s,u])=>"- "+s+": "+u).join("\n"); console.log(urls+"\n- preflight: "+(p.status||"missing")+"\n- deploy status: "+(r.status||"missing")+"\n- health: "+(h.status||"missing")+"\n- target: "+(r.target||"")+"\n- source: "+(r.sourceSha||"")+"\n- artifact: "+(r.artifactHash||"")+"\n- rollback pointer: "+((r.manifest||{}).rollbackPointer || "not configured"))'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production apply diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-web-surface-production-diagnostics
          path: |
            .buildchain/web-surface-production-preflight.json
            .buildchain/web-surface-production-apply.json
            .buildchain/web-surface-production-health.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Comment production deploy feedback and write passport
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_WEB_SURFACE_CHANNEL: production
          BUILDCHAIN_RUNTIME_SHA: ${{ needs.runtime.outputs.runtime-sha }}
          BUILDCHAIN_ROLLBACK_POINTER: ${{ needs.runtime.outputs.rollback-ref }}
          APPLY_RESULT_PATH: .buildchain/web-surface-production-apply.json
          PREFLIGHT_RESULT_PATH: .buildchain/web-surface-production-preflight.json
          HEALTH_RESULT_PATH: .buildchain/web-surface-production-health.json
          APPLY_STEP_OUTCOME: ${{ steps.apply.outcome }}
          JOB_STATUS: ${{ job.status }}
          OUTPUT_PATH: .buildchain/web-surface-production-release-passport.json
          PASSPORT_ARTIFACT_NAME: buildchain-web-surface-production-release-passport
          RELEASE_FEEDBACK_ACTOR_PRIVACY: ${{ inputs.release-feedback-actor-privacy }}
          PRODUCTION_RELEASE_PR: ${{ needs.release-intent.outputs.production-release-pr }}
          PRODUCTION_RELEASE_SOURCE: ${{ needs.release-intent.outputs.production-release-source }}
          PRODUCTION_RELEASE_LABEL: ${{ inputs.production-release-label }}
          PRODUCTION_RELEASE_HEAD_PREFIX: ${{ inputs.production-release-head-prefix }}
          AWS_ROLE_ARN: ${{ inputs.production-aws-role-arn }}
        run: node .buildchain/runtime/scripts/web-surface-release-feedback.mjs

      - name: Upload production release passport
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-web-surface-production-release-passport
          path: .buildchain/web-surface-production-release-passport.json
          include-hidden-files: true
          if-no-files-found: error

  controller-receipt:
    name: Record web-surface controller receipt
    needs:
      - runtime
      - controller-plan
      - plan
      - preview-apply
      - preview-cleanup
      - staging-apply
      - publication-authority
      - external-publication-authority
      - production-apply
    if: ${{ always() && needs.controller-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      controller-receipt-artifact: buildchain-web-surface-controller-receipt-${{ github.sha }}
      controller-receipt-json: ${{ steps.controller-receipt.outputs.controller-receipt-json }}
      controller-receipt-digest: ${{ steps.controller-receipt.outputs.controller-receipt-digest }}
      controller-receipt-status: ${{ steps.controller-receipt.outputs.controller-receipt-status }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.runtime.outputs.runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Download web-surface controller plan
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.controller-plan.outputs.controller-plan-artifact }}
          path: .buildchain/controller

      - name: Download web-surface deployment plan
        if: ${{ needs.plan.result == 'success' && (needs.plan.outputs.web-surface-channel != '' || needs.plan.outputs.web-surface-cleanup-plan-json != '') }}
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-web-surface-plans
          path: .buildchain/controller/web-plans

      - name: Select web-surface plan evidence
        id: select-plan
        if: ${{ needs.plan.result == 'success' && (needs.plan.outputs.web-surface-channel != '' || needs.plan.outputs.web-surface-cleanup-plan-json != '') }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = ".buildchain/controller/web-plans";
          const candidates = fs.readdirSync(root).filter((name) => name.endsWith("-plan.json")).sort();
          if (candidates.length !== 1) throw new Error(`expected one web-surface plan, found ${candidates.length}`);
          fs.copyFileSync(path.join(root, candidates[0]), ".buildchain/controller/web-surface-plan.json");
          NODE

      - name: Create web-surface controller receipt
        id: controller-receipt
        run: node .buildchain/runtime/scripts/controller-evidence.mjs --mode receipt
        env:
          BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
          BUILDCHAIN_CONTROLLER_STAGES_JSON: >-
            [{"id":"resolve-runtime","status":"${{ needs.runtime.result }}"},{"id":"plan","status":"${{ needs.plan.result }}"},{"id":"build","status":"${{ needs.plan.outputs.build-outcome || needs.plan.result }}"},{"id":"verify","status":"${{ needs.plan.outputs.verify-outcome || needs.plan.result }}"},{"id":"publication-authority","status":"${{ (needs.publication-authority.result == 'success' || needs.external-publication-authority.result == 'success') && 'success' || (needs.publication-authority.result == 'failure' || needs.external-publication-authority.result == 'failure') && 'failure' || 'skipped' }}"},{"id":"apply","status":"${{ (needs.preview-apply.result == 'failure' || needs.preview-cleanup.result == 'failure' || needs.staging-apply.result == 'failure' || needs.production-apply.result == 'failure') && 'failure' || (needs.preview-apply.result == 'cancelled' || needs.preview-cleanup.result == 'cancelled' || needs.staging-apply.result == 'cancelled' || needs.production-apply.result == 'cancelled') && 'cancelled' || (needs.preview-apply.result == 'success' || needs.preview-cleanup.result == 'success' || needs.staging-apply.result == 'success' || needs.production-apply.result == 'success') && 'success' || 'skipped' }}"},{"id":"aggregate","status":"${{ (needs.plan.result == 'failure' || needs.preview-apply.result == 'failure' || needs.preview-cleanup.result == 'failure' || needs.staging-apply.result == 'failure' || needs.production-apply.result == 'failure') && 'failure' || (needs.plan.result == 'cancelled' || needs.preview-apply.result == 'cancelled' || needs.preview-cleanup.result == 'cancelled' || needs.staging-apply.result == 'cancelled' || needs.production-apply.result == 'cancelled') && 'cancelled' || needs.plan.result == 'success' && 'success' || 'skipped' }}"}]
          BUILDCHAIN_CONTROLLER_EVIDENCE_FILES_JSON: ${{ steps.select-plan.outcome == 'success' && '[{"kind":"web-surface-plan","path":".buildchain/controller/web-surface-plan.json"}]' || '[]' }}
          BUILDCHAIN_CONTROLLER_REASON_CODE: ${{ needs.plan.result != 'success' && 'web-surface-incomplete' || steps.select-plan.outcome != 'success' && 'no-applicable-web-surface-channel' || '' }}
          BUILDCHAIN_CONTROLLER_REASON_SUMMARY: Web-surface controller did not complete an applicable channel successfully
          BUILDCHAIN_CONTROLLER_RECEIPT_ARTIFACT: buildchain-web-surface-controller-receipt-${{ github.sha }}
          BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json

      - name: Upload web-surface controller receipt
        if: ${{ always() && steps.controller-receipt.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-web-surface-controller-receipt-${{ github.sha }}
          path: .buildchain/controller/receipt.json
          if-no-files-found: error

      - name: Enforce qualifying web-surface controller receipt
        if: ${{ always() && (needs.plan.result != 'success' || steps.select-plan.outcome == 'success') && steps.controller-receipt.outputs.controller-receipt-qualifying != 'true' }}
        run: |
          echo "::error::web-surface controller receipt is not qualifying: ${{ steps.controller-receipt.outputs.controller-receipt-status }}"
          exit 1
