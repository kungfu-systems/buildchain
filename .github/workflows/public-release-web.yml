name: Buildchain Web Surface
permissions:
  actions: read
  contents: read
jobs:
  runtime:
    name: Resolve Buildchain runtime
    runs-on: ubuntu-24.04
    outputs:
      runtime-ref: ${{ steps.node.outputs.runtime-ref }}
      runtime-full-ref: ${{ steps.node.outputs.runtime-full-ref }}
      runtime-sha: ${{ steps.node.outputs.runtime-sha }}
      runtime-class: ${{ steps.node.outputs.runtime-class }}
      runtime-override: ${{ steps.node.outputs.runtime-override }}
      runtime-trust-decision: ${{ steps.node.outputs.runtime-trust-decision }}
      workflow-shell-ref: ${{ steps.node.outputs.workflow-shell-ref }}
      rollback-ref: ${{ steps.node.outputs.rollback-ref }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Resolve Buildchain runtime
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-runtime
        with:
          request-json: ${{ toJSON(inputs) }}
          job-workflow-ref: ${{ toJSON(job.workflow_ref) }}
          job-workflow-sha: ${{ toJSON(job.workflow_sha) }}
  controller-plan:
    name: Plan web-surface controller
    needs:
      - runtime
      - release-intent
    runs-on: ubuntu-24.04
    outputs:
      controller-plan-artifact: ${{ steps.node.outputs.controller-plan-artifact }}
      controller-plan-json: ${{ steps.node.outputs.controller-plan-json }}
      controller-plan-digest: ${{ steps.node.outputs.controller-plan-digest }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Plan web-surface controller
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-controller-plan
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-runtime-outputs-runtime-sha: ${{ toJSON(needs.runtime.outputs.runtime-sha) }}
          needs-release-intent-outputs-production-source-sha: ${{ toJSON(needs.release-intent.outputs.production-source-sha) }}
          needs-runtime-outputs-runtime-ref: ${{ toJSON(needs.runtime.outputs.runtime-ref) }}
  release-intent:
    name: Resolve production release PR intent
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      production-release-approved: ${{ steps.node.outputs.production-release-approved }}
      production-release-pr: ${{ steps.node.outputs.production-release-pr }}
      production-release-source: ${{ steps.node.outputs.production-release-source }}
      production-release-reason: ${{ steps.node.outputs.production-release-reason }}
      production-source-sha: ${{ steps.node.outputs.production-source-sha }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Resolve production release PR intent
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-release-intent
        with:
          request-json: ${{ toJSON(inputs) }}
  publication-decision:
    name: Resolve trusted production decision
    runs-on: ubuntu-24.04
    needs:
      - runtime
      - release-intent
    permissions:
      contents: read
    outputs:
      approved: ${{ steps.node.outputs.approved }}
      decision-json: ${{ steps.node.outputs.decision-json }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Resolve trusted production decision
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-publication-decision
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-runtime-outputs-runtime-sha: ${{ toJSON(needs.runtime.outputs.runtime-sha) }}
          needs-release-intent-outputs-production-release-approved: ${{ toJSON(needs.release-intent.outputs.production-release-approved) }}
          needs-release-intent-outputs-production-release-pr: ${{ toJSON(needs.release-intent.outputs.production-release-pr) }}
          needs-release-intent-outputs-production-release-source: ${{ toJSON(needs.release-intent.outputs.production-release-source) }}
          needs-release-intent-outputs-production-source-sha: ${{ toJSON(needs.release-intent.outputs.production-source-sha) }}
  apply-input-gate:
    name: Validate web-surface apply inputs
    runs-on: ubuntu-24.04
    needs:
      - runtime
      - release-intent
      - publication-decision
    outputs:
      web-surface-channel: ${{ steps.node.outputs.web-surface-channel }}
      web-surface-alias: ${{ steps.node.outputs.web-surface-alias }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Validate web-surface apply inputs
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-apply-input-gate
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-release-intent-outputs-production-release-approved: ${{ toJSON(needs.release-intent.outputs.production-release-approved) }}
          needs-publication-decision-outputs-approved: ${{ toJSON(needs.publication-decision.outputs.approved) }}
  plan:
    name: Plan web-surface channel
    runs-on: ubuntu-24.04
    needs:
      - runtime
      - release-intent
      - apply-input-gate
      - controller-plan
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    outputs:
      web-surface-channel: ${{ steps.node.outputs.web-surface-channel }}
      web-surface-alias: ${{ steps.node.outputs.web-surface-alias }}
      web-surface-url: ${{ steps.node.outputs.web-surface-url }}
      web-surface-urls-json: ${{ steps.node.outputs.web-surface-urls-json }}
      web-surface-manifest-json: ${{ steps.node.outputs.web-surface-manifest-json }}
      web-surface-cleanup-plan-json: ${{ steps.node.outputs.web-surface-cleanup-plan-json }}
      build-outcome: ${{ steps.node.outputs.build-outcome }}
      verify-outcome: ${{ steps.node.outputs.verify-outcome }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.release-intent.outputs.production-source-sha }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Plan web-surface channel
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-plan
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-runtime-outputs-runtime-sha: ${{ toJSON(needs.runtime.outputs.runtime-sha) }}
          needs-runtime-outputs-runtime-ref: ${{ toJSON(needs.runtime.outputs.runtime-ref) }}
          needs-runtime-outputs-runtime-class: ${{ toJSON(needs.runtime.outputs.runtime-class) }}
          job-workflow-ref: ${{ toJSON(job.workflow_ref) }}
          needs-runtime-outputs-runtime-override: ${{ toJSON(needs.runtime.outputs.runtime-override) }}
          needs-release-intent-outputs-production-source-sha: ${{ toJSON(needs.release-intent.outputs.production-source-sha) }}
          needs-apply-input-gate-outputs-web-surface-channel: ${{ toJSON(needs.apply-input-gate.outputs.web-surface-channel) }}
          needs-apply-input-gate-outputs-web-surface-alias: ${{ toJSON(needs.apply-input-gate.outputs.web-surface-alias) }}
          needs-runtime-outputs-rollback-ref: ${{ toJSON(needs.runtime.outputs.rollback-ref) }}
          needs-release-intent-outputs-production-release-approved: ${{ toJSON(needs.release-intent.outputs.production-release-approved) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  preview-apply:
    name: Apply pull request preview
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed' && inputs.preview-apply) }}
    runs-on: ubuntu-24.04
    needs:
      - plan
      - runtime
    environment: ${{ inputs.preview-environment }}
    outputs:
      preview-apply-result-json: ${{ steps.node.outputs.preview-apply-result-json }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Apply pull request preview
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-preview-apply
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-runtime-outputs-runtime-sha: ${{ toJSON(needs.runtime.outputs.runtime-sha) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  preview-cleanup:
    name: Apply pull request preview cleanup
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'closed' && inputs.preview-cleanup-apply && needs.release-intent.outputs.production-release-approved != 'true') }}
    runs-on: ubuntu-24.04
    needs:
      - plan
      - runtime
      - release-intent
    environment: ${{ inputs.preview-environment }}
    outputs:
      preview-cleanup-result-json: ${{ steps.node.outputs.preview-cleanup-result-json }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Apply pull request preview cleanup
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-preview-cleanup
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-runtime-outputs-runtime-sha: ${{ toJSON(needs.runtime.outputs.runtime-sha) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  staging-apply:
    name: Apply staging deploy
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main' && inputs.staging-apply && needs.plan.outputs.web-surface-channel == 'staging') }}
    runs-on: ubuntu-24.04
    needs:
      - plan
      - runtime
    environment: ${{ inputs.staging-environment }}
    outputs:
      staging-apply-result-json: ${{ steps.node.outputs.staging-apply-result-json }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Apply staging deploy
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-staging-apply
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-runtime-outputs-runtime-sha: ${{ toJSON(needs.runtime.outputs.runtime-sha) }}
          needs-runtime-outputs-rollback-ref: ${{ toJSON(needs.runtime.outputs.rollback-ref) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  open-production-release-pr:
    name: Open production release PR
    if: |-
      ${{
        (
          github.event_name == 'push' &&
          github.ref_name == 'main' &&
          inputs.staging-apply &&
          inputs.production-release-on-main &&
          needs.staging-apply.result == 'success' &&
          needs.release-intent.outputs.production-release-approved != 'true'
        )
      }}
    runs-on: ubuntu-24.04
    needs:
      - runtime
      - release-intent
      - staging-apply
    outputs:
      release-pr-status: ${{ steps.node.outputs.release-pr-status }}
      production-release-pr-status: ${{ steps.node.outputs.production-release-pr-status }}
      production-release-pr-url: ${{ steps.node.outputs.production-release-pr-url }}
      production-release-pr: ${{ steps.node.outputs.production-release-pr }}
      production-release-branch: ${{ steps.node.outputs.production-release-branch }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Open production release PR
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-open-production-release-pr
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-runtime-outputs-runtime-sha: ${{ toJSON(needs.runtime.outputs.runtime-sha) }}
          secrets-production-release-app-private-key: ${{ secrets.production-release-app-private-key }}
          secrets-production-release-pr-token: ${{ secrets.production-release-pr-token }}
  external-publication-authority:
    name: Verify external web production publication capability
    needs:
      - plan
      - runtime
      - publication-decision
    if: |-
      ${{
        (
          inputs.production-apply &&
          needs.publication-decision.outputs.approved == 'true' &&
          (inputs.publication-admission-json != '' || inputs.publication-runner-provenance-json != '' || inputs.publication-control-plane-audit-json != '' || inputs.publication-gate-aggregate-json != '' || inputs.publication-expected-json != '')
        )
      }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/.release-authority.yml
    with:
      buildchain-repository: ${{ inputs.buildchain-repository }}
      buildchain-ref: ${{ needs.runtime.outputs.runtime-sha }}
      admission-json: ${{ inputs.publication-admission-json }}
      runner-provenance-json: ${{ inputs.publication-runner-provenance-json }}
      control-plane-audit-json: ${{ inputs.publication-control-plane-audit-json }}
      github-governance-receipt-json: ${{ inputs.github-governance-receipt-json }}
      gate-aggregate-json: ${{ inputs.publication-gate-aggregate-json }}
      expected-json: ${{ inputs.publication-expected-json }}
      used-nonces-json: ${{ inputs.publication-used-nonces-json }}
      target-ref: ${{ github.ref_name }}
      evidence-repository: ${{ github.repository }}
  publication-authority:
    name: Seal managed web production publication capability
    runs-on: ubuntu-24.04
    needs:
      - plan
      - runtime
      - controller-plan
      - publication-decision
      - release-intent
    if: |-
      ${{
        (
          inputs.production-apply &&
          needs.publication-decision.outputs.approved == 'true' &&
          inputs.publication-admission-json == '' && inputs.publication-runner-provenance-json == '' && inputs.publication-control-plane-audit-json == '' && inputs.publication-gate-aggregate-json == '' && inputs.publication-expected-json == ''
        )
      }}
    permissions:
      actions: read
      contents: read
    outputs:
      capability-json: ${{ steps.node.outputs.capability-json }}
      capability-digest: ${{ steps.node.outputs.capability-digest }}
      candidate-json: ${{ steps.node.outputs.candidate-json }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Seal managed web production publication capability
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-publication-authority
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-runtime-outputs-runtime-sha: ${{ toJSON(needs.runtime.outputs.runtime-sha) }}
          needs-controller-plan-outputs-controller-plan-artifact: ${{ toJSON(needs.controller-plan.outputs.controller-plan-artifact) }}
          needs-runtime-result: ${{ toJSON(needs.runtime.result) }}
          needs-plan-result: ${{ toJSON(needs.plan.result) }}
          needs-plan-outputs-build-outcome: ${{ toJSON(needs.plan.outputs.build-outcome) }}
          needs-plan-outputs-verify-outcome: ${{ toJSON(needs.plan.outputs.verify-outcome) }}
          needs-release-intent-outputs-production-source-sha: ${{ toJSON(needs.release-intent.outputs.production-source-sha) }}
          needs-publication-decision-outputs-decision-json: ${{ toJSON(needs.publication-decision.outputs.decision-json) }}
  production-apply:
    name: Apply production deploy
    if: |-
      ${{
        (
          always() &&
          inputs.production-apply &&
          needs.publication-decision.outputs.approved == 'true' &&
          (needs.publication-authority.result == 'success' || needs.external-publication-authority.result == 'success')
        )
      }}
    runs-on: ubuntu-24.04
    needs:
      - plan
      - runtime
      - release-intent
      - publication-decision
      - publication-authority
      - external-publication-authority
    environment: ${{ inputs.production-environment }}
    outputs:
      production-apply-result-json: ${{ steps.node.outputs.production-apply-result-json }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.release-intent.outputs.production-source-sha }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Apply production deploy
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-production-apply
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-runtime-outputs-runtime-sha: ${{ toJSON(needs.runtime.outputs.runtime-sha) }}
          needs-publication-authority-outputs-capability-json: ${{ toJSON(needs.publication-authority.outputs.capability-json) }}
          needs-external-publication-authority-outputs-capability-json: ${{ toJSON(needs.external-publication-authority.outputs.capability-json) }}
          needs-publication-authority-outputs-candidate-json: ${{ toJSON(needs.publication-authority.outputs.candidate-json) }}
          needs-release-intent-outputs-production-source-sha: ${{ toJSON(needs.release-intent.outputs.production-source-sha) }}
          needs-runtime-outputs-rollback-ref: ${{ toJSON(needs.runtime.outputs.rollback-ref) }}
          needs-release-intent-outputs-production-release-pr: ${{ toJSON(needs.release-intent.outputs.production-release-pr) }}
          needs-release-intent-outputs-production-release-source: ${{ toJSON(needs.release-intent.outputs.production-release-source) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  controller-receipt:
    name: Record web-surface controller receipt
    needs:
      - runtime
      - controller-plan
      - plan
      - preview-apply
      - preview-cleanup
      - staging-apply
      - publication-authority
      - external-publication-authority
      - production-apply
      - release-intent
    if: ${{ (always() && needs.controller-plan.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      controller-receipt-artifact: ${{ steps.node.outputs.controller-receipt-artifact }}
      controller-receipt-json: ${{ steps.node.outputs.controller-receipt-json }}
      controller-receipt-digest: ${{ steps.node.outputs.controller-receipt-digest }}
      controller-receipt-status: ${{ steps.node.outputs.controller-receipt-status }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Record web-surface controller receipt
        id: node
        uses: ./.buildchain/workflow-shell/actions/web/web-controller-receipt
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-runtime-outputs-runtime-sha: ${{ toJSON(needs.runtime.outputs.runtime-sha) }}
          needs-controller-plan-outputs-controller-plan-artifact: ${{ toJSON(needs.controller-plan.outputs.controller-plan-artifact) }}
          needs-plan-result: ${{ toJSON(needs.plan.result) }}
          needs-plan-outputs-web-surface-channel: ${{ toJSON(needs.plan.outputs.web-surface-channel) }}
          needs-plan-outputs-web-surface-cleanup-plan-json: ${{ toJSON(needs.plan.outputs.web-surface-cleanup-plan-json) }}
          needs-runtime-result: ${{ toJSON(needs.runtime.result) }}
          needs-plan-outputs-build-outcome: ${{ toJSON(needs.plan.outputs.build-outcome) }}
          needs-plan-outputs-verify-outcome: ${{ toJSON(needs.plan.outputs.verify-outcome) }}
          needs-publication-authority-result: ${{ toJSON(needs.publication-authority.result) }}
          needs-external-publication-authority-result: ${{ toJSON(needs.external-publication-authority.result) }}
          needs-preview-apply-result: ${{ toJSON(needs.preview-apply.result) }}
          needs-preview-cleanup-result: ${{ toJSON(needs.preview-cleanup.result) }}
          needs-staging-apply-result: ${{ toJSON(needs.staging-apply.result) }}
          needs-production-apply-result: ${{ toJSON(needs.production-apply.result) }}
          needs-release-intent-outputs-production-source-sha: ${{ toJSON(needs.release-intent.outputs.production-source-sha) }}
on:
  workflow_call:
    inputs:
      buildchain-repository:
        default: kungfu-systems/buildchain
        type: string
        required: false
      buildchain-ref:
        description: Optional explicit runtime ref. Empty binds the defining workflow SHA.
        default: ""
        type: string
        required: false
      buildchain-contract-expected-channel:
        description: Compatibility expected channel for the exact Buildchain contract lock
        default: ""
        type: string
        required: false
      buildchain-contract-expected-major:
        description: Compatibility expected major for the exact Buildchain contract lock
        default: ""
        type: string
        required: false
      buildchain-contract-lock-path:
        description: Path to the consumer-accepted Buildchain runtime contract lock. Empty disables lock lookup.
        default: buildchain.contract-lock.json
        type: string
        required: false
      buildchain-contract-compatibility-policy:
        description: "Contract compatibility policy: major-compatible, allow-additive, or exact."
        default: major-compatible
        type: string
        required: false
      buildchain-contract-drift-issue-mode:
        description: "Consumer issue behavior for Buildchain floating-ref contract drift: off, breaking-only, or compatible-and-breaking."
        default: compatible-and-breaking
        type: string
        required: false
      working-directory:
        default: .
        type: string
        required: false
      node-version:
        default: "24"
        type: string
        required: false
      build-command:
        default: ""
        type: string
        required: false
      verify-command:
        default: ""
        type: string
        required: false
      artifact-path:
        default: dist
        type: string
        required: false
      aws-region:
        default: us-east-1
        type: string
        required: false
      preview-apply:
        default: false
        type: boolean
        required: false
      preview-cleanup-apply:
        default: false
        type: boolean
        required: false
      preview-aws-role-arn:
        default: ""
        type: string
        required: false
      preview-environment:
        default: preview
        type: string
        required: false
      preview-comment:
        default: true
        type: boolean
        required: false
      staging-apply:
        default: false
        type: boolean
        required: false
      staging-aws-role-arn:
        default: ""
        type: string
        required: false
      staging-environment:
        default: staging
        type: string
        required: false
      production-apply:
        description: Enable production deployment capability; each production apply still requires a trusted event decision.
        default: false
        type: boolean
        required: false
      production-approved:
        default: false
        type: boolean
        required: false
      production-source-sha:
        description: Optional exact reviewed consumer source SHA for a trusted workflow_dispatch production activation.
        default: ""
        type: string
        required: false
      production-release-on-main:
        description: Treat a reviewed release pull request merge into main as production approval.
        default: false
        type: boolean
        required: false
      production-release-label:
        description: Required pull request label for production release PR merges.
        default: buildchain-release
        type: string
        required: false
      production-release-head-prefix:
        description: Optional source branch prefix required for production release PR merges.
        default: release/
        type: string
        required: false
      production-release-branch-channel:
        description: Branch channel slug for Buildchain-opened production release PRs.
        default: production
        type: string
        required: false
      production-release-pr-mode:
        description: "Production release PR handoff mode: auto, summary-only, or disabled."
        default: auto
        type: string
        required: false
      production-release-app-client-id:
        description: Optional GitHub App client id used to create production release PRs. Requires production-release-app-private-key.
        default: ""
        type: string
        required: false
      fail-on-release-pr-error:
        description: Fail the workflow when automatic production release PR creation cannot complete.
        default: false
        type: boolean
        required: false
      production-aws-role-arn:
        default: ""
        type: string
        required: false
      production-environment:
        default: production
        type: string
        required: false
      publication-admission-json:
        description: Fresh sealed admission for production deploy; ignored by preview and staging lanes.
        default: ""
        type: string
        required: false
      publication-runner-provenance-json:
        description: Qualified runner provenance bound by the production admission.
        default: ""
        type: string
        required: false
      publication-control-plane-audit-json:
        description: Fresh consumer control-plane audit bound to production-environment.
        default: ""
        type: string
        required: false
      github-governance-receipt-json:
        description: Fresh qualifying governance receipt for the exact production repository and target ref
        default: ""
        type: string
        required: false
      publication-gate-aggregate-json:
        description: Optional complete Gate aggregate for the external sealed-evidence compatibility path.
        default: ""
        type: string
        required: false
      publication-expected-json:
        description: Consumer-owned exact production source, runtime, Gate, artifact, target, and channel bindings.
        default: ""
        type: string
        required: false
      publication-used-nonces-json:
        description: Consumer-owned JSON array of already consumed admission nonces.
        default: "[]"
        type: string
        required: false
      release-feedback-actor-privacy:
        description: "Actor identity mode for web-surface release feedback passports: public, redacted, or private-ref."
        default: public
        type: string
        required: false
    secrets:
      production-release-app-private-key:
        description: Private key for production-release-app-client-id. When set, Buildchain creates production release PRs with that GitHub App installation token.
        required: false
      production-release-pr-token:
        description: Optional narrowly scoped token for production release PR creation.
        required: false
    outputs:
      web-surface-channel:
        description: Planned web-surface channel
        value: ${{ jobs.plan.outputs.web-surface-channel }}
      web-surface-alias:
        description: Planned preview alias when applicable
        value: ${{ jobs.plan.outputs.web-surface-alias }}
      web-surface-url:
        description: Planned deployment URL
        value: ${{ jobs.plan.outputs.web-surface-url }}
      web-surface-urls-json:
        description: All planned deployment URLs keyed by surface name
        value: ${{ jobs.plan.outputs.web-surface-urls-json }}
      web-surface-manifest-json:
        description: Deployment manifest JSON when a deployment plan was created
        value: ${{ jobs.plan.outputs.web-surface-manifest-json }}
      web-surface-cleanup-plan-json:
        description: Cleanup plan JSON when a cleanup plan was created
        value: ${{ jobs.plan.outputs.web-surface-cleanup-plan-json }}
      preview-apply-result-json:
        description: Preview deploy apply result JSON when preview apply ran
        value: ${{ jobs.preview-apply.outputs.preview-apply-result-json }}
      preview-cleanup-result-json:
        description: Preview cleanup apply result JSON when cleanup apply ran
        value: ${{ jobs.preview-cleanup.outputs.preview-cleanup-result-json }}
      staging-apply-result-json:
        description: Staging deploy apply result JSON when staging apply ran
        value: ${{ jobs.staging-apply.outputs.staging-apply-result-json }}
      production-apply-result-json:
        description: Production deploy apply result JSON when production apply ran
        value: ${{ jobs.production-apply.outputs.production-apply-result-json }}
      production-release-pr-url:
        description: Production release PR URL opened after staging apply
        value: ${{ jobs.open-production-release-pr.outputs.production-release-pr-url }}
      release-pr-status:
        description: "Production release PR handoff status: created, updated, permission-denied, summary-only, disabled, or failed"
        value: ${{ jobs.open-production-release-pr.outputs.release-pr-status }}
      buildchain-runtime-ref:
        description: Resolved Buildchain runtime ref
        value: ${{ jobs.runtime.outputs.runtime-ref }}
      buildchain-runtime-sha:
        description: Resolved immutable Buildchain runtime SHA
        value: ${{ jobs.runtime.outputs.runtime-sha }}
      buildchain-runtime-class:
        description: "Runtime stability class: stable, alpha, train, exact-sha, or development"
        value: ${{ jobs.runtime.outputs.runtime-class }}
      buildchain-runtime-override:
        description: Whether a train or exact-SHA buildchain-ref override was used
        value: ${{ jobs.runtime.outputs.runtime-override }}
      controller-plan-artifact:
        description: Controller plan artifact name
        value: ${{ jobs.controller-plan.outputs.controller-plan-artifact }}
      controller-plan-json:
        description: Compact controller plan JSON
        value: ${{ jobs.controller-plan.outputs.controller-plan-json }}
      controller-plan-digest:
        description: Controller plan digest
        value: ${{ jobs.controller-plan.outputs.controller-plan-digest }}
      controller-receipt-artifact:
        description: Controller receipt artifact name
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-artifact }}
      controller-receipt-json:
        description: Compact controller receipt JSON
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-json }}
      controller-receipt-digest:
        description: Controller receipt digest
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-digest }}
      controller-receipt-status:
        description: Controller receipt status
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-status }}
