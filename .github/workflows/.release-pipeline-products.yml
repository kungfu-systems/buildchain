name: Internal pipeline product publication
on:
  workflow_call:
    inputs:
      attempt:
        type: string
        required: true
      runtime-selection:
        type: string
        required: true
    secrets:
      BUILDCHAIN_APP_PRIVATE_KEY:
        required: false
      BUILDCHAIN_AUTOMATION_TOKEN:
        required: false
      BUILDCHAIN_NPM_TOKEN:
        required: false
    outputs:
      stable-wait:
        value: ${{ jobs.prepare.outputs.stable-wait || jobs.materialize.outputs.stable-wait || jobs.apply.outputs.stable-wait }}
permissions:
  contents: read
concurrency:
  group: buildchain-product-publication-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      stable-wait: ${{ steps.prepare.outputs.stable-wait }}
      operation: ${{ steps.prepare.outputs.operation }}
      context: ${{ steps.prepare.outputs.context }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ inputs.runtime-selection }}
          token: ${{ github.token }}
      - id: prepare
        uses: ./.buildchain/runtime/actions/publication/pipeline/prepare
        with:
          attempt: ${{ inputs.attempt }}
          definition-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          authority-token: ${{ secrets.BUILDCHAIN_AUTOMATION_TOKEN }}
  materialize:
    name: Prepare publication version
    needs: prepare
    uses: ./.github/workflows/.release-pipeline-version.yml
    permissions:
      actions: read
      contents: write
      pull-requests: write
    with:
      context: ${{ needs.prepare.outputs.context }}
      operation: ${{ needs.prepare.outputs.operation }}
      matrix: ${{ needs.prepare.outputs.matrix }}
      purpose: publication
      runtime-selection: ${{ inputs.runtime-selection }}
  build:
    name: Build publication (${{ matrix.platform }})
    needs: materialize
    if: always() && needs.materialize.result == 'success' && needs.materialize.outputs.operation == 'build'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.materialize.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes || 60 }}
    permissions:
      contents: read
    steps:
      - uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ inputs.runtime-selection }}
          token: ${{ github.token }}
      - uses: actions/checkout@v7.0.0
        with:
          repository: ${{ fromJSON(needs.materialize.outputs.context).materialization.source.repository }}
          ref: ${{ fromJSON(needs.materialize.outputs.context).materialization.source.commit }}
          path: .buildchain/product
          persist-credentials: false
      - uses: ./.buildchain/runtime/actions/publication/pipeline/build
        with:
          context: ${{ needs.materialize.outputs.context }}
          platform: ${{ matrix.platform }}
  native:
    name: Native publication
    needs: [materialize, build]
    if: >-
      always() && needs.materialize.result == 'success' &&
      fromJSON(needs.materialize.outputs.context).plan.nativeSigning &&
      fromJSON(needs.materialize.outputs.context).recovery.mode != 'prepared' &&
      (needs.materialize.outputs.operation == 'qualify' ||
      (needs.materialize.outputs.operation == 'build' && needs.build.result == 'success'))
    uses: ./.github/workflows/.release-pipeline-native.yml
    with:
      context: ${{ needs.materialize.outputs.context }}
      runtime-selection: ${{ inputs.runtime-selection }}
    secrets:
      BUILDCHAIN_AUTOMATION_TOKEN: ${{ secrets.BUILDCHAIN_AUTOMATION_TOKEN }}
    permissions:
      actions: read
      contents: write
  qualify:
    name: Qualify and sign products
    needs: [materialize, build, native]
    if: >-
      always() && needs.materialize.result == 'success' &&
      (needs.materialize.outputs.operation == 'qualify' ||
      (needs.materialize.outputs.operation == 'build' && needs.build.result == 'success')) &&
      (!fromJSON(needs.materialize.outputs.context).plan.nativeSigning ||
      fromJSON(needs.materialize.outputs.context).recovery.mode == 'prepared' ||
      needs.native.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ inputs.runtime-selection }}
          token: ${{ github.token }}
      - uses: ./.buildchain/runtime/actions/publication/pipeline/qualify
        with:
          context: ${{ needs.materialize.outputs.context }}
          token: ${{ github.token }}
          authority-token: ${{ fromJSON(needs.materialize.outputs.context).plan.nativeSigning && secrets.BUILDCHAIN_AUTOMATION_TOKEN || '' }}
  apply:
    name: Apply qualified publication
    needs: [materialize, qualify]
    if: always() && (needs.materialize.outputs.operation == 'apply' || needs.qualify.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      stable-wait: ${{ steps.apply.outputs.stable-wait }}
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: read
    steps:
      - uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ inputs.runtime-selection }}
          token: ${{ github.token }}
      - id: apply
        uses: ./.buildchain/runtime/actions/publication/pipeline/apply
        env:
          NODE_AUTH_TOKEN: ${{ secrets.BUILDCHAIN_NPM_TOKEN }}
        with:
          context: ${{ needs.materialize.outputs.context }}
          token: ${{ github.token }}
  settle:
    name: Settle product follow-ups
    needs: [materialize, apply]
    if: always() && (needs.materialize.outputs.operation == 'settle' || (needs.apply.result == 'success' && needs.apply.outputs.stable-wait == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      discussions: write
      pull-requests: write
      id-token: write
    outputs:
      operation: ${{ steps.settle.outputs.operation }}
      version-context: ${{ steps.settle.outputs.version-context }}
      matrix: ${{ steps.settle.outputs.matrix }}
    steps:
      - uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ inputs.runtime-selection }}
          token: ${{ github.token }}
      - id: credential
        uses: ./.buildchain/runtime/actions/providers/github/token
        with:
          client-id: ${{ vars.BUILDCHAIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUILDCHAIN_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.BUILDCHAIN_AUTOMATION_TOKEN }}
          failure-policy: strict
          permission-contents: write
          permission-pull-requests: write
      - id: settle
        uses: ./.buildchain/runtime/actions/publication/pipeline/settle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.BUILDCHAIN_NPM_TOKEN }}
        with:
          context: ${{ needs.materialize.outputs.context }}
          token: ${{ github.token }}
          pr-token: ${{ steps.credential.outputs.token }}
  development:
    name: Prepare next development version
    needs: settle
    if: always() && needs.settle.result == 'success' && needs.settle.outputs.operation == 'regenerate'
    uses: ./.github/workflows/.release-pipeline-version.yml
    permissions:
      actions: read
      contents: write
      pull-requests: write
    secrets: inherit
    with:
      context: ${{ needs.settle.outputs.version-context }}
      operation: ${{ needs.settle.outputs.operation }}
      matrix: ${{ needs.settle.outputs.matrix }}
      purpose: development
      runtime-selection: ${{ inputs.runtime-selection }}
