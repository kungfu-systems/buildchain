name: Dev Delivery Warrant Queued Candidate Cancel

on:
  workflow_call:
    inputs:
      buildchain-repository:
        {
          description: "Buildchain runtime repository",
          default: "kungfu-systems/buildchain",
          type: string,
          required: false,
        }
      buildchain-ref:
        {
          description: "Buildchain runtime ref",
          default: "v3",
          type: string,
          required: false,
        }
      target-branch:
        { description: "Protected dev branch", type: string, required: true }
      expected-pr-number:
        { description: "Exact PR owning the queued candidate", type: number, required: true }
      expected-candidate-id:
        { description: "Exact queued candidate content root", type: string, required: true }
      expected-source-head-sha:
        { description: "Exact source head recorded in the queue", type: string, required: true }
      observed-source-head-sha:
        { description: "Exact source head observed on the terminal event", type: string, required: true }
      expected-old-state-root:
        { description: "Exact queue root observed by the caller", type: string, required: true }
      event-action:
        { description: "closed, cancelled, or dequeued", type: string, required: true }
      outcome:
        { description: "cancelled or dequeued", type: string, required: true }
      terminal-evidence-root:
        { description: "Exact immutable terminal event evidence root", type: string, required: true }
      reason:
        { description: "Visible terminal reason", default: "", type: string, required: false }
    secrets:
      github-token:
        description: "Token permitted to advance the Buildchain Warrant state ref"
        required: false
    outputs:
      cancellation-action:
        value: ${{ jobs.cancel.outputs.cancellation-action }}
      cancellation-receipt-root:
        value: ${{ jobs.cancel.outputs.cancellation-receipt-root }}
      final-state-root:
        value: ${{ jobs.cancel.outputs.final-state-root }}

permissions:
  contents: write
jobs:
  cancel:
    name: Cancel exact non-active queued candidate
    runs-on: ubuntu-24.04
    outputs:
      cancellation-action: ${{ steps.cancel.outputs.cancellation-action }}
      cancellation-receipt-root: ${{ steps.cancel.outputs.cancellation-receipt-root }}
      final-state-root: ${{ steps.cancel.outputs.final-state-root }}
    steps:
      - name: Validate queued cancellation intent
        shell: bash
        run: |
          case "${TARGET_BRANCH}" in
            dev/v*/v*) ;;
            *)
              echo "::error::target-branch must be a semver dev branch"
              exit 1
              ;;
          esac
          case "${EVENT_ACTION}:${OUTCOME}" in
            closed:cancelled|cancelled:cancelled|synchronize:cancelled|dequeued:dequeued) ;;
            *)
              echo "::error::event-action and outcome do not form a supported queued cancellation"
              exit 1
              ;;
          esac
          if ! [[ "${EXPECTED_PR}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::expected-pr-number must be positive"
            exit 1
          fi
          for sha in "${EXPECTED_SOURCE_HEAD}" "${OBSERVED_SOURCE_HEAD}"; do
            if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::source heads must be exact lowercase Git SHAs"
              exit 1
            fi
          done
          for root in "${EXPECTED_CANDIDATE_ID}" "${EXPECTED_OLD_STATE_ROOT}" "${TERMINAL_EVIDENCE_ROOT}"; do
            if ! [[ "${root}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::candidate, expected-old, and evidence roots must be exact sha256 roots"
              exit 1
            fi
          done
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}
          EXPECTED_PR: ${{ inputs.expected-pr-number }}
          EXPECTED_CANDIDATE_ID: ${{ inputs.expected-candidate-id }}
          EXPECTED_SOURCE_HEAD: ${{ inputs.expected-source-head-sha }}
          OBSERVED_SOURCE_HEAD: ${{ inputs.observed-source-head-sha }}
          EXPECTED_OLD_STATE_ROOT: ${{ inputs.expected-old-state-root }}
          EVENT_ACTION: ${{ inputs.event-action }}
          OUTCOME: ${{ inputs.outcome }}
          TERMINAL_EVIDENCE_ROOT: ${{ inputs.terminal-evidence-root }}
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v3' }}
          path: .buildchain/runtime
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Cancel exact queued candidate
        id: cancel
        shell: bash
        run: |
          node .buildchain/runtime/scripts/dev-delivery-warrant.mjs cancel-queued \
            --repository "${GITHUB_REPOSITORY}" \
            --branch "${TARGET_BRANCH}" \
            --candidate-id "${EXPECTED_CANDIDATE_ID}" \
            --pull-request "${EXPECTED_PR}" \
            --expected-source-head "${EXPECTED_SOURCE_HEAD}" \
            --observed-source-head "${OBSERVED_SOURCE_HEAD}" \
            --expected-old "${EXPECTED_OLD_STATE_ROOT}" \
            --event-action "${EVENT_ACTION}" \
            --outcome "${OUTCOME}" \
            --evidence-root "${TERMINAL_EVIDENCE_ROOT}" \
            --reason "${REASON}" \
            --execute \
            --output .buildchain/dev-delivery/cancel.json
          {
            echo "cancellation-action=$(jq -er '.receipt.action' .buildchain/dev-delivery/cancel.json)"
            echo "cancellation-receipt-root=$(jq -er '.receiptRoot' .buildchain/dev-delivery/cancel.json)"
            echo "final-state-root=$(jq -er '.after.stateRoot' .buildchain/dev-delivery/cancel.json)"
          } >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          EXPECTED_PR: ${{ inputs.expected-pr-number }}
          EXPECTED_CANDIDATE_ID: ${{ inputs.expected-candidate-id }}
          EXPECTED_SOURCE_HEAD: ${{ inputs.expected-source-head-sha }}
          OBSERVED_SOURCE_HEAD: ${{ inputs.observed-source-head-sha }}
          EXPECTED_OLD_STATE_ROOT: ${{ inputs.expected-old-state-root }}
          EVENT_ACTION: ${{ inputs.event-action }}
          OUTCOME: ${{ inputs.outcome }}
          TERMINAL_EVIDENCE_ROOT: ${{ inputs.terminal-evidence-root }}
          REASON: ${{ inputs.reason }}

      - name: Upload queued cancellation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-dev-delivery-cancel-${{ inputs.expected-pr-number }}-${{ inputs.outcome }}
          path: .buildchain/dev-delivery/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
