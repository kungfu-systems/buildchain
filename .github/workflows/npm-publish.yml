name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to dry-run. Defaults to the selected workflow ref."
        required: false
        default: ""
      run-check:
        description: "Run the full Buildchain check before npm publish dry-run."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry-run npm publish
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout dry-run ref
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Enable pnpm
        run: |
          corepack enable pnpm
          pnpm --version
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        if: ${{ inputs.run-check }}
        run: pnpm run check

      - name: Dry-run npm publish
        run: node scripts/npm-publish-dry-run.mjs --json
