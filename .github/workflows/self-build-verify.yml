name: Verify
on:
  pull_request: null
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
      - publish-gate/major
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build-backbone:
    name: Build backbone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
          - platform: linux-container
            runner: ubuntu-24.04
            container: ghcr.io/kungfu-systems/build-images/kungfu-verify@sha256:11f0ba64267ce88174a4f73a9bf833ff4e9c59cd16ec3d08a6432a06c2be6fb1
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Build backbone (${{ matrix.platform }})
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/verify-build-backbone
        if: ${{ always() }}
        with:
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
  stage-capsule-checkpoints:
    name: Stage Capsule checkpoint (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Stage Capsule checkpoint (${{ matrix.platform }})
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/verify-stage-capsule-checkpoints
        with:
          matrix-json: ${{ toJSON(matrix) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  check:
    needs: stage-capsule-checkpoints
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Execute verify-check
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/verify-check
        if: ${{ always() }}
        with:
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
