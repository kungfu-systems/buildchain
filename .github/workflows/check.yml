name: Buildchain Check

on:
  workflow_call:
    inputs:
      buildchain-repository:
        description: "Buildchain runtime repository"
        default: "kungfu-systems/buildchain"
        type: string
        required: false
      buildchain-ref:
        description: "Buildchain runtime ref. Empty uses v2."
        default: "v2"
        type: string
        required: false
      working-directory:
        description: "Repository directory containing buildchain.toml"
        default: "."
        type: string
        required: false
      node-version:
        description: "Node.js version used for the Buildchain runtime"
        default: "24"
        type: string
        required: false
      require-version-state:
        description: "Require configured version.files entries"
        default: false
        type: boolean
        required: false
      mode:
        description: "Check mode: verify runs install + verify; source runs install + check"
        default: "verify"
        type: string
        required: false
      upload-artifacts:
        description: "Upload check lifecycle manifests and summaries"
        default: true
        type: boolean
        required: false

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: ${{ inputs.mode == 'source' && 0 || 1 }}
          persist-credentials: false

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v2' }}
          path: .buildchain/runtime
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable package manager shims
        run: |
          corepack prepare pnpm@11.7.0 --activate
          corepack enable
          pnpm --version

      - name: Install Buildchain runtime dependencies
        run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts

      - name: Resolve check lifecycle mode
        id: lifecycle
        shell: bash
        env:
          BUILDCHAIN_CHECK_MODE: ${{ inputs.mode }}
        run: |
          case "$BUILDCHAIN_CHECK_MODE" in
            verify) stage="verify" ;;
            source) stage="check" ;;
            *)
              echo "unsupported check mode: $BUILDCHAIN_CHECK_MODE" >&2
              exit 1
              ;;
          esac
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Validate declared check lifecycle
        run: >-
          node .buildchain/runtime/bin/buildchain.mjs validate
          --cwd "${{ inputs.working-directory }}"
          ${{ inputs.require-version-state && '--require-version-state' || '' }}
          --require-lifecycle-stages install,${{ steps.lifecycle.outputs.stage }}

      - name: Run declared install lifecycle
        env:
          BUILDCHAIN_CHECK_MODE: ${{ inputs.mode }}
        run: >-
          node .buildchain/runtime/bin/buildchain.mjs lifecycle run install
          --cwd "${{ inputs.working-directory }}"
          --required
          --artifact-name buildchain-check-install
          --manifest-path .buildchain/artifacts/check-install-manifest.json
          --summary-path .buildchain/artifacts/check-install-summary.json

      - name: Run selected check lifecycle
        env:
          BUILDCHAIN_CHECK_MODE: ${{ inputs.mode }}
        run: >-
          node .buildchain/runtime/bin/buildchain.mjs lifecycle run ${{ steps.lifecycle.outputs.stage }}
          --cwd "${{ inputs.working-directory }}"
          --required
          --artifact-name buildchain-check
          --manifest-path .buildchain/artifacts/check-manifest.json
          --summary-path .buildchain/artifacts/check-summary.json

      - name: Upload check evidence
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-check
          path: .buildchain/artifacts/
          if-no-files-found: error
