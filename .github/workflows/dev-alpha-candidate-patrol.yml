name: Buildchain Dev to Alpha Candidate Patrol

on:
  workflow_call:
    inputs:
      buildchain-repository:
        description: Buildchain runtime repository
        default: kungfu-systems/buildchain
        required: false
        type: string
      buildchain-ref:
        description: Buildchain runtime ref
        default: v3-alpha
        required: false
        type: string
      source-branch:
        description: Development source branch
        required: true
        type: string
      target-branch:
        description: Alpha target branch
        required: true
        type: string
      dev-workflow-path:
        description: Repository path of the Dev Patrol workflow
        default: .github/workflows/dev-verify-patrol.yml
        required: false
        type: string
      alpha-workflow-path:
        description: Repository path of the Alpha preflight workflow
        default: .github/workflows/alpha-promotion-preflight.yml
        required: false
        type: string
      max-age-seconds:
        description: Maximum age of each same-SHA workflow result
        default: 604800
        required: false
        type: number
      pull-request-body-prefix:
        description: Repository-owned declaration prepended when a candidate PR is created
        default: ""
        required: false
        type: string
      pull-request-body-prefix-renderer:
        description: Repository-relative Node.js renderer for an exact-source PR declaration
        default: ""
        required: false
        type: string
      create-pull-request:
        description: Backward-compatible alias for settlement-authorized
        default: false
        required: false
        type: boolean
      settlement-authorized:
        description: Run the separately permissioned candidate settlement job
        default: false
        required: false
        type: boolean
      auto-merge:
        description: Enable GitHub auto-merge on the managed exact-source Alpha PR
        default: false
        required: false
        type: boolean
      merge-method:
        description: "GitHub auto-merge method: merge, squash, or rebase"
        default: merge
        required: false
        type: string
      dry-run:
        description: Evaluate without creating a branch or pull request
        default: true
        required: false
        type: boolean
      reactivation-authorized:
        description: Explicitly authorize a new evidence-bound transition for a tombstoned SHA
        default: false
        required: false
        type: boolean
    secrets:
      promotion-token:
        description: Repository-owned token for source-lock branch and PR writes
        required: false
    outputs:
      result-path:
        value: ${{ jobs.observe.outputs.result-path }}
      eligible:
        value: ${{ jobs.observe.outputs.eligible }}
      selected-sha:
        value: ${{ jobs.observe.outputs.selected-sha }}
      source-lock-ref:
        value: ${{ jobs.observe.outputs.source-lock-ref }}
      promotion-pr:
        value: ${{ jobs.settle.outputs.promotion-pr || jobs.observe.outputs.active-candidate-pr }}
      controller-state:
        value: ${{ jobs.settle.outputs.controller-state || jobs.observe.outputs.controller-state }}
      active-candidate-pr:
        value: ${{ jobs.settle.outputs.active-candidate-pr || jobs.observe.outputs.active-candidate-pr }}
      next-candidate-sha:
        value: ${{ jobs.settle.outputs.next-candidate-sha || jobs.observe.outputs.next-candidate-sha }}
      settlement-action:
        value: ${{ jobs.settle.outputs.settlement-action || 'none' }}
      prior-state-root:
        value: ${{ jobs.settle.outputs.prior-state-root || jobs.observe.outputs.prior-state-root }}

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: buildchain-dev-alpha-candidate-${{ github.repository }}-${{ inputs.target-branch }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      result-path: ${{ steps.observe.outputs.result-path }}
      eligible: ${{ steps.observe.outputs.eligible }}
      selected-sha: ${{ steps.observe.outputs.selected-sha }}
      source-lock-ref: ${{ steps.observe.outputs.source-lock-ref }}
      controller-state: ${{ steps.observe.outputs.controller-state }}
      active-candidate-pr: ${{ steps.observe.outputs.active-candidate-pr }}
      next-candidate-sha: ${{ steps.observe.outputs.next-candidate-sha }}
      pull-request-body-prefix: ${{ steps.render-body-prefix.outputs.pull-request-body-prefix || inputs.pull-request-body-prefix }}
      prior-state-root: ${{ steps.observe.outputs.prior-state-root }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v3-alpha' }}
          path: .buildchain/runtime
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Install Buildchain runtime
        run: |
          corepack prepare pnpm@11.7.0 --activate
          corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile

      - name: Observe exact-source candidate
        id: observe
        run: node .buildchain/runtime/scripts/dev-alpha-candidate-patrol.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_CHANNEL_PATROL_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_CHANNEL_PATROL_SOURCE_BRANCH: ${{ inputs.source-branch }}
          BUILDCHAIN_CHANNEL_PATROL_TARGET_BRANCH: ${{ inputs.target-branch }}
          BUILDCHAIN_CHANNEL_PATROL_DEV_WORKFLOW: ${{ inputs.dev-workflow-path }}
          BUILDCHAIN_CHANNEL_PATROL_ALPHA_WORKFLOW: ${{ inputs.alpha-workflow-path }}
          BUILDCHAIN_CHANNEL_PATROL_MAX_AGE_SECONDS: ${{ inputs.max-age-seconds }}
          BUILDCHAIN_CHANNEL_PATROL_PR_BODY_PREFIX: ${{ inputs.pull-request-body-prefix }}
          BUILDCHAIN_CHANNEL_PATROL_CREATE_PR: "false"
          BUILDCHAIN_CHANNEL_PATROL_SETTLEMENT_AUTHORIZED: "false"
          BUILDCHAIN_CHANNEL_PATROL_DRY_RUN: "true"
          BUILDCHAIN_CHANNEL_PATROL_OUTPUT_PATH: .buildchain/patrol/dev-alpha-candidate.json

      - name: Reject ambiguous PR body prefix authority
        if: ${{ inputs.pull-request-body-prefix-renderer != '' && inputs.pull-request-body-prefix != '' }}
        shell: bash
        run: |
          echo "pull-request-body-prefix and pull-request-body-prefix-renderer are mutually exclusive" >&2
          exit 1

      - name: Checkout exact consumer source for PR body prefix
        if: ${{ inputs.pull-request-body-prefix-renderer != '' && steps.observe.outputs.eligible == 'true' }}
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ steps.observe.outputs.selected-sha }}
          path: .buildchain/consumer
          fetch-depth: 0
          persist-credentials: false

      - name: Render exact-source PR body prefix
        id: render-body-prefix
        if: ${{ inputs.pull-request-body-prefix-renderer != '' && steps.observe.outputs.eligible == 'true' }}
        run: node .buildchain/runtime/scripts/run-candidate-body-prefix-renderer.mjs
        env:
          BUILDCHAIN_CHANNEL_PATROL_CONSUMER_ROOT: .buildchain/consumer
          BUILDCHAIN_CHANNEL_PATROL_PR_BODY_PREFIX_RENDERER: ${{ inputs.pull-request-body-prefix-renderer }}
          BUILDCHAIN_CHANNEL_PATROL_PR_BODY_PREFIX_OUTPUT: .buildchain/patrol/pull-request-body-prefix.txt
          BUILDCHAIN_CHANNEL_PATROL_SELECTED_SHA: ${{ steps.observe.outputs.selected-sha }}
          BUILDCHAIN_CHANNEL_PATROL_SOURCE_BRANCH: ${{ inputs.source-branch }}
          BUILDCHAIN_CHANNEL_PATROL_TARGET_BRANCH: ${{ inputs.target-branch }}

      - name: Upload read-only exact-source observation
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-dev-alpha-candidate-observation-${{ steps.observe.outputs.selected-sha }}
          path: |
            ${{ steps.observe.outputs.result-path }}
            .buildchain/patrol/pull-request-body-prefix.txt
          if-no-files-found: error
          retention-days: 30

  settle:
    needs: observe
    if: >-
      (inputs.settlement-authorized || inputs.create-pull-request) &&
      !inputs.dry-run &&
      (needs.observe.outputs.controller-state == 'eligible-for-settlement' ||
       needs.observe.outputs.controller-state == 'active' ||
       needs.observe.outputs.controller-state == 'retained-next')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      promotion-pr: ${{ steps.settle.outputs.promotion-pr }}
      controller-state: ${{ steps.settle.outputs.controller-state }}
      active-candidate-pr: ${{ steps.settle.outputs.active-candidate-pr }}
      next-candidate-sha: ${{ steps.settle.outputs.next-candidate-sha }}
      settlement-action: ${{ steps.settle.outputs.settlement-action }}
      prior-state-root: ${{ steps.settle.outputs.prior-state-root }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v3-alpha' }}
          path: .buildchain/runtime
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Install Buildchain runtime
        run: |
          corepack prepare pnpm@11.7.0 --activate
          corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile

      - name: Reconcile and settle exact-source candidate
        id: settle
        run: node .buildchain/runtime/scripts/dev-alpha-candidate-patrol.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.promotion-token || github.token }}
          BUILDCHAIN_CHANNEL_PATROL_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_CHANNEL_PATROL_SOURCE_BRANCH: ${{ inputs.source-branch }}
          BUILDCHAIN_CHANNEL_PATROL_TARGET_BRANCH: ${{ inputs.target-branch }}
          BUILDCHAIN_CHANNEL_PATROL_DEV_WORKFLOW: ${{ inputs.dev-workflow-path }}
          BUILDCHAIN_CHANNEL_PATROL_ALPHA_WORKFLOW: ${{ inputs.alpha-workflow-path }}
          BUILDCHAIN_CHANNEL_PATROL_MAX_AGE_SECONDS: ${{ inputs.max-age-seconds }}
          BUILDCHAIN_CHANNEL_PATROL_PR_BODY_PREFIX: ${{ needs.observe.outputs.pull-request-body-prefix }}
          BUILDCHAIN_CHANNEL_PATROL_EXPECTED_SELECTED_SHA: ${{ needs.observe.outputs.selected-sha }}
          BUILDCHAIN_CHANNEL_PATROL_EXPECTED_PRIOR_STATE_ROOT: ${{ needs.observe.outputs.prior-state-root }}
          BUILDCHAIN_CHANNEL_PATROL_REACTIVATION_AUTHORIZED: ${{ inputs.reactivation-authorized }}
          BUILDCHAIN_CHANNEL_PATROL_CREATE_PR: "true"
          BUILDCHAIN_CHANNEL_PATROL_SETTLEMENT_AUTHORIZED: "true"
          BUILDCHAIN_CHANNEL_PATROL_AUTO_MERGE: ${{ inputs.auto-merge }}
          BUILDCHAIN_CHANNEL_PATROL_MERGE_METHOD: ${{ inputs.merge-method }}
          BUILDCHAIN_CHANNEL_PATROL_DRY_RUN: "false"
          BUILDCHAIN_CHANNEL_PATROL_OUTPUT_PATH: .buildchain/patrol/dev-alpha-candidate-settlement.json

      - name: Upload protected settlement decision
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-dev-alpha-candidate-settlement-${{ steps.settle.outputs.selected-sha }}
          path: ${{ steps.settle.outputs.result-path }}
          if-no-files-found: error
          retention-days: 30
