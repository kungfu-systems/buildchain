name: Buildchain Declarative Demo Dogfood
on:
  push:
    tags:
      - v*.*.*
      - v*.*.*-alpha.*
  workflow_dispatch:
    inputs:
      mode:
        description: Run the required Gate only, or Gate plus native media rendering
        required: true
        default: full
        type: choice
        options:
          - gate-only
          - full
      materialize:
        description: Open or update the protected README media pull request
        required: true
        default: false
        type: boolean
      base-ref:
        description: Target branch for the protected README media pull request
        required: true
        default: dev/v4/v4.1
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: buildchain-declarative-demo-dogfood-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-binary:
    name: Build exact standalone Buildchain binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.node.outputs.artifact-name }}
      artifact-digest: ${{ steps.node.outputs.artifact-digest }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Build exact standalone Buildchain binary
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/demo/qualify-binary
        if: ${{ always() }}
        with:
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
  dogfood:
    name: Recursively consume declarative demo platform
    needs: exact-binary
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/public-build-demo.yml
    with:
      source-ref: ${{ github.sha }}
      binary-artifact-name: ${{ needs.exact-binary.outputs.artifact-name }}
      binary-artifact-digest: ${{ needs.exact-binary.outputs.artifact-digest }}
      scenario-path: .buildchain/auditable-demo.json
      renderer-image: ghcr.io/kungfu-systems/build-images/demo-renderer@sha256:3a49708163fedaaabe07b45bba910026a1828151b5d4e9bbdaf0d62e75c927c1
      render-media: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
      media-profile: responsive-web-delivery-v1
      materialize: ${{ github.event_name != 'workflow_dispatch' || inputs.materialize }}
      materialize-base-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base-ref || 'dev/v4/v4.1' }}
      artifact-retention-days: 14
    secrets:
      DEMO_UPDATE_TOKEN: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
