name: Buildchain Declarative Demo Dogfood
on:
  push:
    tags:
      - v*.*.*
      - v*.*.*-alpha.*
  workflow_dispatch:
    inputs:
      mode:
        description: Run the required Gate only, or Gate plus native media rendering
        required: true
        default: full
        type: choice
        options:
          - gate-only
          - full
      materialize:
        description: Open or update the protected README media pull request
        required: true
        default: false
        type: boolean
      base-ref:
        description: Target branch for the protected README media pull request
        required: true
        default: dev/v4/v4.1
        type: string
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
permissions:
  actions: read
  contents: read
concurrency:
  group: buildchain-declarative-demo-dogfood-${{ github.ref }}
  cancel-in-progress: false
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
    timeout-minutes: 5
  exact-binary:
    name: Build exact standalone Buildchain binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.node.outputs.artifact-name }}
      artifact-digest: ${{ steps.node.outputs.artifact-digest }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
        id: source-checkout
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
        if: ${{ always() }}
      - name: Build exact standalone Buildchain binary
        id: node
        uses: ./.buildchain/runtime/actions/build/demo/qualify-binary
        if: ${{ always() }}
        with:
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
    needs:
      - execution-runtime
  dogfood:
    name: Recursively consume declarative demo platform
    needs:
      - exact-binary
      - execution-runtime
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: kungfu-systems/buildchain/.github/workflows/public-build-demo.yml@v4
    with:
      source-ref: ${{ github.sha }}
      binary-artifact-name: ${{ needs.exact-binary.outputs.artifact-name }}
      binary-artifact-digest: ${{ needs.exact-binary.outputs.artifact-digest }}
      scenario-path: .buildchain/auditable-demo.json
      renderer-image: ghcr.io/kungfu-systems/build-images/demo-renderer@sha256:3a49708163fedaaabe07b45bba910026a1828151b5d4e9bbdaf0d62e75c927c1
      render-media: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
      media-profile: responsive-web-delivery-v1
      materialize: ${{ github.event_name != 'workflow_dispatch' || inputs.materialize }}
      materialize-base-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base-ref || 'dev/v4/v4.1' }}
      artifact-retention-days: 14
      runtime-selection: ${{ needs.execution-runtime.outputs.selection }}
    secrets:
      DEMO_UPDATE_TOKEN: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
