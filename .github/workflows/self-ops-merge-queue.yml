name: Dev Merge Queue Governance
on:
  push:
    branches:
      - dev/v*/v*
    paths:
      - .buildchain/buildchain.toml
      - .github/workflows/**
      - bin/buildchain.mjs
      - packages/core/consumer/buildchain-config.js
      - packages/core/dev-delivery/commands/dev-merge-queue.mjs
  workflow_dispatch:
    inputs:
      branch:
        description: Protected Buildchain dev branch
        required: true
        type: string
      apply:
        description: Apply the reconciled policy after emitting the plan
        required: false
        default: false
        type: boolean
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
    timeout-minutes: 5
  reconcile:
    name: Reconcile declared dev merge queue
    runs-on: ubuntu-24.04
    env:
      BUILDCHAIN_TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
      BUILDCHAIN_APPLY: ${{ github.event_name == 'push' || inputs.apply }}
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILDCHAIN_TARGET_BRANCH }}
          persist-credentials: false
        id: source-checkout
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
        if: ${{ always() }}
      - name: Reconcile declared dev merge queue
        id: node
        uses: ./.buildchain/runtime/actions/dev-delivery/queue/reconcile
        if: ${{ always() }}
        with:
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
          branch: ${{ env.BUILDCHAIN_TARGET_BRANCH }}
          apply: ${{ env.BUILDCHAIN_APPLY }}
          token: ${{ secrets.BUILDCHAIN_GOVERNANCE_TOKEN || secrets.BUILDCHAIN_PROMOTION_TOKEN || github.token
            }}
    needs:
      - execution-runtime
