name: Dev Merge Queue Governance
on:
  push:
    branches:
      - dev/v*/v*
    paths:
      - .buildchain/buildchain.toml
      - .github/workflows/**
      - bin/buildchain.mjs
      - packages/core/consumer/buildchain-config.js
      - packages/core/dev-delivery/commands/dev-merge-queue.mjs
  workflow_dispatch:
    inputs:
      branch:
        description: Protected Buildchain dev branch
        required: true
        type: string
      apply:
        description: Apply the reconciled policy after emitting the plan
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  reconcile:
    name: Reconcile declared dev merge queue
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.BUILDCHAIN_GOVERNANCE_TOKEN || secrets.BUILDCHAIN_PROMOTION_TOKEN || github.token }}
      BUILDCHAIN_TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
      BUILDCHAIN_APPLY: ${{ github.event_name == 'push' || inputs.apply }}
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILDCHAIN_TARGET_BRANCH }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Reconcile declared dev merge queue
        id: node
        uses: ./.buildchain/workflow-shell/actions/dev-delivery/merge-queue-reconcile
        if: ${{ always() }}
        with:
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
