name: Release Line Bootstrap
on:
  workflow_dispatch:
    inputs:
      major:
        description: Semver major number, for example 2
        required: true
        type: string
      minor:
        description: Semver minor number, for example 10
        required: true
        type: string
      source-ref:
        description: Existing ref used as the baseline for alpha/release branches
        required: true
        type: string
      initial-version:
        description: Initial dev version. Defaults to <major>.<minor>.0-alpha.0
        required: false
        default: ""
        type: string
      apply:
        description: Create refs, protection, default branch, and alpha PR
        required: false
        default: false
        type: boolean
      required-status-check:
        description: Exact required branch-protection check context
        required: false
        default: check
        type: string
      create-alpha-pr:
        description: Open dev -> alpha channel PR
        required: false
        default: true
        type: boolean
      set-default-branch:
        description: Switch repository default branch to the new dev line
        required: false
        default: true
        type: boolean
permissions:
  contents: write
  pull-requests: write
jobs:
  bootstrap:
    name: Bootstrap release line
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 0
          token: ${{ github.token }}
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Bootstrap release line
        id: node
        uses: ./.buildchain/workflow-shell/actions/release/line/open
        with:
          request-json: ${{ toJSON(inputs) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
          token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
          workflow-sha: ${{ job.workflow_sha }}
        if: ${{ always() }}
