name: Release Line Bootstrap
on:
  workflow_dispatch:
    inputs:
      major:
        description: Semver major number, for example 2
        required: true
        type: string
      minor:
        description: Semver minor number, for example 10
        required: true
        type: string
      source-ref:
        description: Existing ref used as the baseline for alpha/release branches
        required: true
        type: string
      initial-version:
        description: Initial dev version. Defaults to <major>.<minor>.0-alpha.0
        required: false
        default: ""
        type: string
      apply:
        description: Create refs, protection, default branch, and alpha PR
        required: false
        default: false
        type: boolean
      required-status-check:
        description: Exact required branch-protection check context
        required: false
        default: check
        type: string
      create-alpha-pr:
        description: Open dev -> alpha channel PR
        required: false
        default: true
        type: boolean
      set-default-branch:
        description: Switch repository default branch to the new dev line
        required: false
        default: true
        type: boolean
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: write
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
    timeout-minutes: 5
  bootstrap:
    name: Bootstrap release line
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 0
          token: ${{ github.token }}
        id: source-checkout
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
        if: ${{ always() }}
      - name: Bootstrap release line
        id: node
        uses: ./.buildchain/runtime/actions/release/line/open
        with:
          request-json: ${{ toJSON(inputs) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
          token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
          workflow-sha: ${{ job.workflow_sha }}
        if: ${{ always() }}
    needs:
      - execution-runtime
