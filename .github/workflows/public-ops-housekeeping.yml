name: Engineering Housekeeper
on:
  workflow_call:
    inputs:
      repository:
        description: Repository to inspect as owner/repo. Empty uses the caller repository.
        required: false
        type: string
        default: ""
      target-branch:
        description: Optional primary ancestry target. Empty discovers the default and all protected
          mainline families repository-wide.
        required: false
        type: string
        default: ""
      mode:
        description: "Execution mode: report or apply."
        required: false
        type: string
        default: report
      apply-enabled:
        description: Explicit positive mutation gate. Must be true together with mode=apply.
        required: false
        type: boolean
        default: false
      protected-patterns:
        description: Comma or newline separated protected branch globs.
        required: false
        type: string
        default: dev/**,alpha/**,release/**,publish-gate/**
      retained-patterns:
        description: Comma or newline separated retained branch globs.
        required: false
        type: string
        default: train/**,authority/**
      temporary-branch-patterns:
        description: Positive allowlist of temporary development branch globs eligible for deletion.
        required: false
        type: string
        default: feature/**,fix/**,chore/**,docs/**,ci/**,refactor/**
      stale-days:
        description: Age threshold for stale pull-request reporting and optional labeling.
        required: false
        type: number
        default: 30
      stale-pull-request-label:
        description: Optional label for stale pull requests. Empty keeps pull requests report-only.
        required: false
        type: string
        default: ""
      max-actions:
        description: Maximum ordered plan actions eligible for one apply run.
        required: false
        type: number
        default: 20
      artifact-retention-days:
        description: Retention for plan, report, and receipt artifacts.
        required: false
        type: number
        default: 30
      artifact-prefix:
        description: Non-secret artifact name prefix.
        required: false
        type: string
        default: engineering-housekeeper
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
    secrets:
      housekeeper_token:
        description: Optional caller-owned token. Defaults to the caller-scoped github.token.
        required: false
      housekeeper_app_id:
        description: Optional caller-owned GitHub App id; must be paired with housekeeper_app_private_key.
        required: false
      housekeeper_app_private_key:
        description: Optional caller-owned GitHub App private key; must be paired with housekeeper_app_id.
        required: false
    outputs:
      plan-root:
        description: Root of the exact observed plan.
        value: ${{ jobs.plan.outputs.plan-root }}
      report-receipt-root:
        description: Root of the default dry-run receipt.
        value: ${{ jobs.plan.outputs.report-receipt-root }}
      branch-receipt-root:
        description: Root of the branch apply receipt, or empty when no branch apply job ran.
        value: ${{ jobs.delete-branches.outputs.receipt-root }}
      pull-request-receipt-root:
        description: Root of the pull-request apply receipt, or empty when no pull-request apply job ran.
        value: ${{ jobs.label-pull-requests.outputs.receipt-root }}
      action-count:
        description: Number of exact actions in the plan before the apply limit.
        value: ${{ jobs.plan.outputs.action-count }}
      outcome:
        description: "Plan outcome: no-actions, report-ready, or apply-ready."
        value: ${{ jobs.plan.outputs.outcome }}
      plan-artifact:
        description: Artifact containing the exact rooted plan.
        value: ${{ jobs.plan.outputs.plan-artifact }}
      report-artifact:
        description: Artifact containing the decision and dry-run outcome report.
        value: ${{ jobs.plan.outputs.report-artifact }}
      receipt-artifact:
        description: Artifact containing the default dry-run receipt.
        value: ${{ jobs.plan.outputs.receipt-artifact }}
permissions: {}
concurrency:
  group: engineering-housekeeper-${{ inputs.repository || github.repository }}-${{
    inputs.target-branch || 'all-mainlines' }}
  cancel-in-progress: false
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  plan:
    name: Inventory and plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan-root: ${{ steps.node.outputs.plan-root }}
      report-receipt-root: ${{ steps.node.outputs.report-receipt-root }}
      action-count: ${{ steps.node.outputs.action-count }}
      branch-action-count: ${{ steps.node.outputs.branch-action-count }}
      pull-request-action-count: ${{ steps.node.outputs.pull-request-action-count }}
      outcome: ${{ steps.node.outputs.outcome }}
      plan-artifact: ${{ steps.node.outputs.plan-artifact }}
      report-artifact: ${{ steps.node.outputs.report-artifact }}
      receipt-artifact: ${{ steps.node.outputs.receipt-artifact }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Inventory and plan
        id: node
        uses: ./.buildchain/runtime/actions/governance/housekeeping/plan
        with:
          runtime-ref: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
          runtime-repository: kungfu-systems/buildchain
          request-json: ${{ toJSON(inputs) }}
          secrets-housekeeper-app-id: ${{ secrets.housekeeper_app_id }}
          secrets-housekeeper-app-private-key: ${{ secrets.housekeeper_app_private_key }}
          secrets-housekeeper-token: ${{ secrets.housekeeper_token }}
    needs:
      - execution-runtime
  delete-branches:
    name: Apply exact branch deletions
    if: ${{ (inputs.mode == 'apply' && inputs.apply-enabled && needs.plan.outputs.branch-action-count !=
      '0') }}
    needs:
      - plan
      - execution-runtime
    runs-on: ubuntu-24.04
    outputs:
      receipt-root: ${{ steps.node.outputs.receipt-root }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Apply exact branch deletions
        id: node
        uses: ./.buildchain/runtime/actions/governance/housekeeping/delete-branches
        with:
          runtime-ref: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
          runtime-repository: kungfu-systems/buildchain
          request-json: ${{ toJSON(inputs) }}
          secrets-housekeeper-app-id: ${{ secrets.housekeeper_app_id }}
          secrets-housekeeper-app-private-key: ${{ secrets.housekeeper_app_private_key }}
          needs-plan-outputs-plan-artifact: ${{ toJSON(needs.plan.outputs.plan-artifact) }}
          secrets-housekeeper-token: ${{ secrets.housekeeper_token }}
  label-pull-requests:
    name: Apply stale pull-request labels
    if: ${{ (inputs.mode == 'apply' && inputs.apply-enabled && inputs.stale-pull-request-label != '' &&
      needs.plan.outputs.pull-request-action-count != '0') }}
    needs:
      - plan
      - execution-runtime
    runs-on: ubuntu-24.04
    outputs:
      receipt-root: ${{ steps.node.outputs.receipt-root }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Apply stale pull-request labels
        id: node
        uses: ./.buildchain/runtime/actions/governance/housekeeping/label-pull-requests
        with:
          runtime-ref: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
          runtime-repository: kungfu-systems/buildchain
          request-json: ${{ toJSON(inputs) }}
          secrets-housekeeper-app-id: ${{ secrets.housekeeper_app_id }}
          secrets-housekeeper-app-private-key: ${{ secrets.housekeeper_app_private_key }}
          needs-plan-outputs-plan-artifact: ${{ toJSON(needs.plan.outputs.plan-artifact) }}
          secrets-housekeeper-token: ${{ secrets.housekeeper_token }}
