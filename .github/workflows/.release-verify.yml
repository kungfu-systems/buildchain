      - name: Approve Merge
        if: ${{ github.event_name == 'pull_request' && inputs.auto-approve-enabled && env.HAS_NODE_AUTH_TOKEN == 'true' && (!inputs.prebuild || needs.build.result == 'success' || needs.build_local.result == 'success') && !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') }}
        run: |
          echo "::error::actions/approve is retired."
          echo "::error::Use repository-native GitHub automation for PR approval."
          exit 1
