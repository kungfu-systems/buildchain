          BUILDCHAIN_HEAD_REF: ${{ github.head_ref }}
          BUILDCHAIN_BASE_REF: ${{ github.base_ref }}

      - name: Reject retired dependency discovery
        if: ${{ inputs.find-dependencies }}
        run: |
          echo "::error::find-dependencies is retired in workflows v2."
          echo "::error::Do not route modern verification through action-find-dependencies or Airtable dependency discovery."
