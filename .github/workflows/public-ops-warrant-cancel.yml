name: Dev Delivery Warrant Queued Candidate Cancel

on:
  workflow_call:
    inputs:
      buildchain-repository:
        {
          description: "Buildchain runtime repository",
          default: "kungfu-systems/buildchain",
          type: string,
          required: false,
        }
      buildchain-ref:
        {
          description: "Optional explicit runtime ref. Empty binds the defining workflow SHA.",
          default: "",
          type: string,
          required: false,
        }
      target-branch:
        { description: "Protected dev branch", type: string, required: true }
      expected-pr-number:
        {
          description: "Exact PR owning the queued candidate",
          type: number,
          required: true,
        }
      expected-candidate-id:
        {
          description: "Exact queued candidate content root",
          type: string,
          required: true,
        }
      expected-source-head-sha:
        {
          description: "Exact source head recorded in the queue",
          type: string,
          required: true,
        }
      observed-source-head-sha:
        {
          description: "Exact source head observed on the terminal event",
          type: string,
          required: true,
        }
      expected-old-state-root:
        {
          description: "Exact queue root observed by the caller",
          type: string,
          required: true,
        }
      event-action:
        {
          description: "closed, cancelled, or dequeued",
          type: string,
          required: true,
        }
      outcome:
        { description: "cancelled or dequeued", type: string, required: true }
      terminal-evidence-root:
        {
          description: "Exact immutable terminal event evidence root",
          type: string,
          required: true,
        }
      reason:
        {
          description: "Visible terminal reason",
          default: "",
          type: string,
          required: false,
        }
    secrets:
      github-token:
        description: "Token permitted to advance the Buildchain Warrant state ref"
        required: false
    outputs:
      cancellation-action:
        value: ${{ jobs.cancel.outputs.cancellation-action }}
      cancellation-receipt-root:
        value: ${{ jobs.cancel.outputs.cancellation-receipt-root }}
      final-state-root:
        value: ${{ jobs.cancel.outputs.final-state-root }}

permissions:
  contents: write
jobs:
  cancel:
    name: Cancel exact non-active queued candidate
    runs-on: ubuntu-24.04
    outputs:
      cancellation-action: ${{ steps.node.outputs.cancellation-action }}
      cancellation-receipt-root: ${{ steps.node.outputs.cancellation-receipt-root }}
      final-state-root: ${{ steps.node.outputs.final-state-root }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Cancel exact non-active queued candidate
        id: node
        uses: ./.buildchain/workflow-shell/actions/dev-delivery/warrant/cancel
        with:
          runtime-ref: ${{ inputs.buildchain-ref || job.workflow_sha }}
          runtime-repository: ${{ inputs.buildchain-repository || job.workflow_repository }}
          request-json: ${{ toJSON(inputs) }}
          secrets-github-token: ${{ secrets.github-token }}
