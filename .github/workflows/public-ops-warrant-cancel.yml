name: Dev Delivery Warrant Queued Candidate Cancel
on:
  workflow_call:
    inputs:
      target-branch:
        description: Protected dev branch
        type: string
        required: true
      expected-pr-number:
        description: Exact PR owning the queued candidate
        type: number
        required: true
      expected-candidate-id:
        description: Exact queued candidate content root
        type: string
        required: true
      expected-source-head-sha:
        description: Exact source head recorded in the queue
        type: string
        required: true
      observed-source-head-sha:
        description: Exact source head observed on the terminal event
        type: string
        required: true
      expected-old-state-root:
        description: Exact queue root observed by the caller
        type: string
        required: true
      event-action:
        description: closed, cancelled, or dequeued
        type: string
        required: true
      outcome:
        description: cancelled or dequeued
        type: string
        required: true
      terminal-evidence-root:
        description: Exact immutable terminal event evidence root
        type: string
        required: true
      reason:
        description: Visible terminal reason
        default: ""
        type: string
        required: false
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
    secrets:
      github-token:
        description: Token permitted to advance the Buildchain Warrant state ref
        required: false
    outputs:
      cancellation-action:
        value: ${{ jobs.cancel.outputs.cancellation-action }}
      cancellation-receipt-root:
        value: ${{ jobs.cancel.outputs.cancellation-receipt-root }}
      final-state-root:
        value: ${{ jobs.cancel.outputs.final-state-root }}
permissions:
  contents: write
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  cancel:
    name: Cancel exact non-active queued candidate
    runs-on: ubuntu-24.04
    outputs:
      cancellation-action: ${{ steps.node.outputs.cancellation-action }}
      cancellation-receipt-root: ${{ steps.node.outputs.cancellation-receipt-root }}
      final-state-root: ${{ steps.node.outputs.final-state-root }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Cancel exact non-active queued candidate
        id: node
        uses: ./.buildchain/runtime/actions/dev-delivery/warrant/cancel
        with:
          runtime-ref: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
          runtime-repository: kungfu-systems/buildchain
          request-json: ${{ toJSON(inputs) }}
          secrets-github-token: ${{ secrets.github-token }}
    needs:
      - execution-runtime
