name: Buildchain Binary Release Assets
on:
  workflow_call:
    inputs:
      evidence-run-id:
        description: Successful Binary Distribution run containing the exact evidence bundle.
        type: string
        required: true
      release-tag:
        description: Existing v* tag whose assets will be updated.
        type: string
        required: true
      source-sha:
        description: Exact release tag commit admitted by binary evidence.
        type: string
        required: true
      target-ref:
        description: Protected alpha/release channel branch that governed the tag.
        type: string
        required: true
      publication-version:
        description: Release tag without the leading v.
        type: string
        required: true
      auto-admission:
        description: Assemble sealed authority evidence from the exact Binary Distribution run.
        type: boolean
        default: true
        required: false
      publication-admission-json:
        type: string
        required: false
        default: ""
      publication-runner-provenance-json:
        type: string
        required: false
        default: ""
      publication-control-plane-audit-json:
        type: string
        required: false
        default: ""
      github-governance-receipt-json:
        type: string
        required: false
        default: ""
      publication-gate-aggregate-json:
        type: string
        required: false
        default: ""
      publication-expected-json:
        type: string
        required: false
        default: ""
      publication-used-nonces-json:
        default: "[]"
        type: string
        required: false
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  publication-authority:
    name: Seal binary release asset capability
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/.release-authority.yml
    secrets: inherit
    with:
      admission-json: ${{ inputs.publication-admission-json }}
      runner-provenance-json: ${{ inputs.publication-runner-provenance-json }}
      control-plane-audit-json: ${{ inputs.publication-control-plane-audit-json }}
      github-governance-receipt-json: ${{ inputs.github-governance-receipt-json }}
      gate-aggregate-json: ${{ inputs.publication-gate-aggregate-json }}
      expected-json: ${{ inputs.publication-expected-json }}
      used-nonces-json: ${{ inputs.publication-used-nonces-json }}
      auto-admission: ${{ inputs.auto-admission }}
      auto-admission-kind: binary-release-assets
      auto-no-gate: true
      source-sha: ${{ inputs.source-sha }}
      target-ref: ${{ inputs.target-ref }}
      required-status-check: check
      publisher-workflow-path: .github/workflows/.release-binary-assets.yml
      authority-workflow-path: .github/workflows/.release-binary-assets.yml
      product: Buildchain standalone binary
      publication-target: github-release:${{ github.repository }}@${{ inputs.release-tag }}
      publication-version: ${{ inputs.publication-version }}
      evidence-repository: ${{ github.repository }}
      evidence-run-id: ${{ inputs.evidence-run-id }}
      evidence-passport-artifact: buildchain-release-passport
      evidence-controller-artifact: buildchain-controller-binary-distribution
      runtime-selection: ${{ needs.execution-runtime.outputs.selection }}
    needs:
      - execution-runtime
  publish:
    name: Publish sealed binary release assets
    needs:
      - publication-authority
      - execution-runtime
    runs-on: ubuntu-24.04
    environment: buildchain-release-assets
    permissions:
      actions: read
      contents: write
      discussions: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.release-tag }}
          persist-credentials: false
        id: source-checkout
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
        if: ${{ always() }}
      - name: Publish sealed binary release assets
        id: node
        uses: ./.buildchain/runtime/actions/release/binary/publish
        with:
          request-json: ${{ toJSON(inputs) }}
          capability-json: ${{ needs.publication-authority.outputs.capability-json }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
