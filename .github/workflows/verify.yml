name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check inventory and structure
        run: npm run check

