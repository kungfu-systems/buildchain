name: Verify

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
      - publish-gate/major
      - major-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Projection authority: architecture/v4-platform-stage-checkpoints.json
  stage-capsule-checkpoints:
    name: Stage Capsule checkpoint (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Rehearse declared Stage Capsule checkpoint in clean processes
        run: >-
          node scripts/v4-platform-stage-checkpoint-rehearsal.mjs rehearse
          --work-root .buildchain/v4-stage-checkpoint
          --platform ${{ matrix.platform }}
          --stage build
          --recorded-at 2026-08-08T00:00:00.000Z
      - name: Rehearse deterministic Stage Capsule resume planning
        run: >-
          node scripts/v4-stage-capsule-resume-rehearsal.mjs
          --platform ${{ matrix.platform }}
      - name: Upload exact Stage Capsule checkpoint evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: v4-stage-checkpoint-${{ matrix.platform }}-${{ github.sha }}
          path: .buildchain/v4-stage-checkpoint/evidence.json
          if-no-files-found: error

  # Qualification authority: architecture/v4-stage-capsule-qualification.json
  stage-capsule-qualification:
    name: Stage Capsule qualification (${{ matrix.consumer }}, ${{ matrix.platform }})
    needs: stage-capsule-checkpoints
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            consumer: buildchain-self-dogfood
          - platform: macos-arm64
            runner: macos-15
            consumer: buildchain-self-dogfood
          - platform: windows-x64
            runner: windows-2025
            consumer: buildchain-self-dogfood
          - platform: linux-x64
            runner: ubuntu-24.04
            consumer: kungfu-shadow
          - platform: macos-arm64
            runner: macos-15
            consumer: kungfu-shadow
          - platform: windows-x64
            runner: windows-2025
            consumer: kungfu-shadow
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - uses: actions/setup-go@v6.5.0
        if: matrix.consumer == 'buildchain-self-dogfood'
        with:
          go-version: "1.25.x"
      - name: Enable package manager shims for real lifecycle dogfood
        if: matrix.consumer == 'buildchain-self-dogfood'
        run: |
          corepack prepare pnpm@11.7.0 --activate
          corepack enable
      - name: Bootstrap Buildchain runtime dependencies
        if: matrix.consumer == 'buildchain-self-dogfood'
        run: corepack pnpm@11.7.0 install --prod --frozen-lockfile --ignore-scripts
      - name: Run real declared install lifecycle
        if: matrix.consumer == 'buildchain-self-dogfood'
        run: >-
          node bin/buildchain.mjs lifecycle run install
          --cwd .
          --required
          --platform-id ${{ matrix.platform }}
          --artifact-name buildchain-v4-self-dogfood-install
          --artifact-path node_modules/.modules.yaml
          --manifest-path .buildchain/artifacts/v4-stage-capsule-self-dogfood/install-manifest.json
          --summary-path .buildchain/artifacts/v4-stage-capsule-self-dogfood/install-summary.json
      - name: Restore exact commit bytes for real lifecycle dogfood
        if: matrix.consumer == 'buildchain-self-dogfood' && runner.os == 'Windows'
        shell: bash
        run: git archive HEAD | tar -xf -
      - name: Run real declared verify lifecycle
        if: matrix.consumer == 'buildchain-self-dogfood'
        run: >-
          node bin/buildchain.mjs lifecycle run verify
          --cwd .
          --required
          --platform-id ${{ matrix.platform }}
          --artifact-name buildchain-v4-self-dogfood-verify
          --artifact-path dist/site
          --manifest-path .buildchain/artifacts/v4-stage-capsule-self-dogfood/verify-manifest.json
          --summary-path .buildchain/artifacts/v4-stage-capsule-self-dogfood/verify-summary.json
      - name: Run retained failure and clean-process resume campaign
        run: >-
          node scripts/v4-stage-capsule-qualification.mjs campaign
          --work-root .buildchain/v4-stage-qualification/${{ matrix.consumer }}-${{ matrix.platform }}
          --platform ${{ matrix.platform }}
          --consumer ${{ matrix.consumer }}
          --runtime-ref ${{ github.sha }}
          --consumer-source-revision ${{ matrix.consumer == 'kungfu-shadow' && '9ca8f445fd5d7921f480c47b059addb2f84f40db' || github.sha }}
          ${{ matrix.consumer == 'buildchain-self-dogfood' && '--lifecycle-evidence-root .buildchain/artifacts/v4-stage-capsule-self-dogfood' || '' }}
      - name: Upload exact Stage Capsule qualification evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: v4-stage-qualification-${{ matrix.consumer }}-${{ matrix.platform }}-${{ github.sha }}
          path: .buildchain/v4-stage-qualification/${{ matrix.consumer }}-${{ matrix.platform }}/*.json
          if-no-files-found: error

  stage-capsule-qualification-reconciliation:
    name: Stage Capsule qualification reconciliation
    needs: stage-capsule-qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Download exact platform and consumer qualification evidence
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: v4-stage-qualification-*-${{ github.sha }}
          path: .buildchain/v4-stage-qualification-inputs
      - name: Reconcile the complete three-platform consumer campaign
        run: >-
          node scripts/v4-stage-capsule-qualification.mjs aggregate
          --input-dir .buildchain/v4-stage-qualification-inputs
          --output .buildchain/v4-stage-qualification.json
      - name: Upload exact Stage Capsule qualification root
        uses: actions/upload-artifact@v7.0.1
        with:
          name: v4-stage-qualification-${{ github.sha }}
          path: .buildchain/v4-stage-qualification.json
          if-no-files-found: error

  check:
    needs: stage-capsule-qualification-reconciliation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .buildchain/runtime
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.25.x"
      - name: Enable package manager shims
        run: |
          corepack prepare pnpm@11.7.0 --activate
          corepack enable
          pnpm --version
      - name: Install Buildchain runtime dependencies
        run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts
      - name: Validate declared check lifecycle
        run: >-
          node .buildchain/runtime/bin/buildchain.mjs validate
          --cwd .
          --require-version-state
          --require-lifecycle-stages install,verify
      - name: Run declared install lifecycle
        run: >-
          node .buildchain/runtime/bin/buildchain.mjs lifecycle run install
          --cwd .
          --required
          --artifact-name buildchain-check-install
          --manifest-path .buildchain/artifacts/check-install-manifest.json
          --summary-path .buildchain/artifacts/check-install-summary.json
      - name: Run declared verify lifecycle
        run: >-
          node .buildchain/runtime/bin/buildchain.mjs lifecycle run verify
          --cwd .
          --required
          --artifact-name buildchain-check
          --manifest-path .buildchain/artifacts/check-manifest.json
          --summary-path .buildchain/artifacts/check-summary.json
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-check
          path: .buildchain/artifacts/
          if-no-files-found: error
