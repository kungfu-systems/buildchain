name: Buildchain Artifact Signing Authority
run-name: Sign ${{ inputs.source-repository }} run ${{ inputs.source-run-id }} (${{ inputs.correlation-id }})
on:
  workflow_dispatch:
    inputs:
      source-repository:
        description: Consumer owner/repository containing sealed request artifacts
        required: true
        type: string
      source-run-id:
        description: Consumer workflow run containing sealed request artifacts
        required: true
        type: string
      source-run-attempt:
        description: Exact consumer workflow attempt that sealed the request artifact
        required: true
        type: string
      request-artifact-pattern:
        description: Exact/pattern name of Buildchain-sealed request artifacts
        required: true
        type: string
      expected-request-root:
        description: Canonical sha256 root of the exact sealed request index
        required: true
        type: string
      result-artifact-name:
        description: Globally unique immutable result artifact name
        required: true
        type: string
      correlation-id:
        description: Consumer-generated non-secret correlation identifier
        required: true
        type: string
      expected-runtime-sha:
        description: Exact Buildchain runtime SHA embedded in every request
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: artifact-signing-${{ inputs.source-repository }}-${{ inputs.source-run-id }}-${{ inputs.source-run-attempt }}-${{ inputs.correlation-id }}
  cancel-in-progress: false
jobs:
  intake:
    name: Admit immutable signing requests
    runs-on: ubuntu-24.04
    outputs:
      detached-matrix: ${{ steps.node.outputs.detached-matrix }}
      macos-matrix: ${{ steps.node.outputs.macos-matrix }}
      windows-matrix: ${{ steps.node.outputs.windows-matrix }}
    steps:
      - name: Checkout exact Buildchain authority runtime
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Admit immutable signing requests
        id: node
        uses: ./.buildchain/workflow-shell/actions/release/signing-authority-intake
        with:
          secrets-buildchain-authority-token: ${{ secrets.BUILDCHAIN_AUTHORITY_TOKEN }}
          secrets-buildchain-promotion-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
          request-json: ${{ toJSON(inputs) }}
          matrix-json: ${{ toJSON(matrix) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  detached:
    name: Detached signature ${{ matrix.request.id }}
    needs: intake
    if: ${{ needs.intake.outputs.detached-matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        request: ${{ fromJSON(needs.intake.outputs.detached-matrix) }}
    runs-on: ubuntu-24.04
    environment: buildchain-artifact-signing
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Detached signature ${{ matrix.request.id }}
        id: node
        uses: ./.buildchain/workflow-shell/actions/release/signing-authority-detached
        with:
          request-json: ${{ toJSON(inputs) }}
          matrix-json: ${{ toJSON(matrix) }}
          secrets-buildchain-detached-private-key-pkcs8-base64: ${{ secrets.BUILDCHAIN_DETACHED_PRIVATE_KEY_PKCS8_BASE64 }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  macos:
    name: Developer ID ${{ matrix.request.id }}
    needs: intake
    if: ${{ needs.intake.outputs.macos-matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        request: ${{ fromJSON(needs.intake.outputs.macos-matrix) }}
    runs-on: macos-15
    environment: buildchain-artifact-signing
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Developer ID ${{ matrix.request.id }}
        id: node
        uses: ./.buildchain/workflow-shell/actions/release/signing-authority-macos
        with:
          request-json: ${{ toJSON(inputs) }}
          matrix-json: ${{ toJSON(matrix) }}
          secrets-buildchain-macos-certificate-p12-base64: ${{ secrets.BUILDCHAIN_MACOS_CERTIFICATE_P12_BASE64 }}
          secrets-buildchain-macos-certificate-password: ${{ secrets.BUILDCHAIN_MACOS_CERTIFICATE_PASSWORD }}
          secrets-buildchain-macos-notary-api-key-p8-base64: ${{ secrets.BUILDCHAIN_MACOS_NOTARY_API_KEY_P8_BASE64 }}
          secrets-buildchain-macos-notary-api-key-id: ${{ secrets.BUILDCHAIN_MACOS_NOTARY_API_KEY_ID }}
          secrets-buildchain-macos-notary-api-issuer: ${{ secrets.BUILDCHAIN_MACOS_NOTARY_API_ISSUER }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  windows:
    name: Authenticode ${{ matrix.request.id }}
    needs: intake
    if: ${{ needs.intake.outputs.windows-matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        request: ${{ fromJSON(needs.intake.outputs.windows-matrix) }}
    runs-on: windows-2025
    environment: buildchain-artifact-signing
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Authenticode ${{ matrix.request.id }}
        id: node
        uses: ./.buildchain/workflow-shell/actions/release/signing-authority-windows
        with:
          request-json: ${{ toJSON(inputs) }}
          matrix-json: ${{ toJSON(matrix) }}
          secrets-buildchain-windows-certificate-pfx-base64: ${{ secrets.BUILDCHAIN_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          secrets-buildchain-windows-certificate-password: ${{ secrets.BUILDCHAIN_WINDOWS_CERTIFICATE_PASSWORD }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  deliver:
    name: Publish immutable signed result set
    needs:
      - intake
      - detached
      - macos
      - windows
    if: ${{ always() && needs.intake.result == 'success' && (needs.detached.result == 'success' || needs.detached.result == 'skipped') && (needs.macos.result == 'success' || needs.macos.result == 'skipped') && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Publish immutable signed result set
        id: node
        uses: ./.buildchain/workflow-shell/actions/release/signing-authority-deliver
        with:
          request-json: ${{ toJSON(inputs) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
