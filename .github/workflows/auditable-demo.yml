name: Buildchain Declarative Demo Dogfood

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-alpha.*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the required Gate only, or Gate plus native media rendering"
        required: true
        default: full
        type: choice
        options:
          - gate-only
          - full
      materialize:
        description: "Open or update the protected README media pull request"
        required: true
        default: false
        type: boolean
      base-ref:
        description: "Target branch for the protected README media pull request"
        required: true
        default: dev/v3/v3.0
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: buildchain-declarative-demo-dogfood-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-binary:
    name: Build exact standalone Buildchain binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.identity.outputs.name }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          corepack prepare pnpm@11.7.0 --activate
          corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone binary
        run: pnpm binary:build -- --output-dir dist/auditable-demo-binary

      - name: Simulate artifact transport before upload
        run: >-
          node scripts/auditable-demo-transport-smoke.mjs
          --artifact-root dist/auditable-demo-binary
          --scenario .buildchain/auditable-demo.json

      - name: Bind artifact name
        id: identity
        shell: bash
        run: echo "name=buildchain-auditable-demo-binary-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload exact binary and metadata
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.name }}
          path: |
            dist/auditable-demo-binary/buildchain
            dist/auditable-demo-binary/buildchain-x86_64-unknown-linux-gnu.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

  dogfood:
    name: Recursively consume declarative demo platform
    needs: exact-binary
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/.declarative-auditable-demo.yml
    with:
      source-ref: ${{ github.sha }}
      binary-artifact-name: ${{ needs.exact-binary.outputs.artifact-name }}
      binary-artifact-digest: ${{ needs.exact-binary.outputs.artifact-digest }}
      scenario-path: .buildchain/auditable-demo.json
      renderer-image: ghcr.io/kungfu-systems/build-images/demo-renderer@sha256:32f5079f14ec0380c27f0df39448cb931e87fe744cc867fbd3d61cfd8a5e18de
      render-media: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
      media-profile: responsive-web-delivery-v1
      materialize: ${{ github.event_name != 'workflow_dispatch' || inputs.materialize }}
      materialize-base-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base-ref || 'dev/v3/v3.0' }}
      artifact-retention-days: 14
    secrets:
      DEMO_UPDATE_TOKEN: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
