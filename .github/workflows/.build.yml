name: Buildchain Build

on:
  workflow_call:
    inputs:
      buildchain-repository:
        default: "kungfu-systems/buildchain"
        type: string
        required: false
      buildchain-ref:
        default: "v2"
        type: string
        required: false
      working-directory:
        default: "."
        type: string
        required: false
      runner-preset:
        description: "Runner preset: github-hosted, kungfu-v4-self-hosted, or custom with platforms-json"
        default: "github-hosted"
        type: string
        required: false
      platforms-json:
        description: "Optional custom JSON array of platform objects: id, name, runner JSON string"
        default: ""
        type: string
        required: false
      require-trusted-event:
        default: true
        type: boolean
        required: false
      untrusted-policy:
        description: "fail or skip when an untrusted fork event asks for build execution"
        default: "fail"
        type: string
        required: false
      publish-channel:
        description: "Publish channel requested by the caller: none, alpha, release, major, or a custom channel from publish-refs-json"
        default: "none"
        type: string
        required: false
      publish-refs-json:
        description: "Optional JSON object mapping publish channels to allowed Git ref regular expressions"
        default: ""
        type: string
        required: false
      setup-node:
        default: true
        type: boolean
        required: false
      node-version:
        default: "24"
        type: string
        required: false
      install-command:
        default: ""
        type: string
        required: false
      build-command:
        default: ""
        type: string
        required: false
      verify-command:
        default: ""
        type: string
        required: false
      require-install:
        default: false
        type: boolean
        required: false
      require-build:
        default: true
        type: boolean
        required: false
      require-verify:
        default: false
        type: boolean
        required: false
      artifact-name:
        default: "buildchain-artifact"
        type: string
        required: false
      artifact-name-template:
        description: "Artifact name template with placeholders: {artifact}, {platform}, {sha}, {shortSha}, {runId}, {runAttempt}"
        default: "{artifact}-{platform}-{sha}"
        type: string
        required: false
      artifact-paths:
        default: |
          dist
          build/stage
        type: string
        required: false
      expected-artifacts-json:
        description: "Optional JSON expectation contract for final artifact files"
        default: ""
        type: string
        required: false
      artifact-retention-days:
        default: 14
        type: number
        required: false
    outputs:
      runner-preset:
        description: "Resolved runner preset name"
        value: ${{ jobs.resolve-contract.outputs.runner-preset }}
      platforms-json:
        description: "Resolved platform matrix JSON"
        value: ${{ jobs.resolve-contract.outputs.platforms-json }}
      platform-count:
        description: "Resolved platform count"
        value: ${{ jobs.resolve-contract.outputs.platform-count }}
      build-summary-artifact:
        description: "Uploaded aggregate build summary artifact name"
        value: ${{ jobs.summarize.outputs.summary-artifact-name }}
      build-summary-json:
        description: "Compact aggregate build summary JSON"
        value: ${{ jobs.summarize.outputs.artifact-summary-json }}
      trusted-event:
        description: "Whether the event is trusted enough to run build jobs"
        value: ${{ jobs.trust-gate.outputs.trusted-event }}
      publish-channel:
        description: "Resolved publish channel"
        value: ${{ jobs.trust-gate.outputs.publish-channel }}
      publish-allowed:
        description: "Whether this event/ref may publish after successful verification"
        value: ${{ jobs.trust-gate.outputs.publish-allowed }}
      publish-reason:
        description: "Human-readable publish gate reason"
        value: ${{ jobs.trust-gate.outputs.publish-reason }}

permissions:
  contents: read

jobs:
  trust-gate:
    name: Trust gate
    runs-on: ubuntu-24.04
    outputs:
      trusted: ${{ steps.trust.outputs.trusted }}
      trusted-event: ${{ steps.publish.outputs.trusted-event }}
      publish-channel: ${{ steps.publish.outputs.publish-channel }}
      publish-allowed: ${{ steps.publish.outputs.publish-allowed }}
      publish-reason: ${{ steps.publish.outputs.publish-reason }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Evaluate event trust
        id: trust
        shell: bash
        run: |
          trusted=true
          if [ "${{ inputs.require-trusted-event }}" = "true" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              trusted=false
            fi
          fi
          echo "trusted=${trusted}" >> "$GITHUB_OUTPUT"
          if [ "${trusted}" != "true" ]; then
            echo "::warning::Untrusted event is not allowed to reach Buildchain build runners."
          fi

      - name: Resolve publish gate
        id: publish
        run: node .buildchain/runtime/scripts/resolve-publish-gate.mjs
        env:
          BUILDCHAIN_TRUSTED_EVENT: ${{ steps.trust.outputs.trusted }}
          BUILDCHAIN_PUBLISH_CHANNEL: ${{ inputs.publish-channel }}
          BUILDCHAIN_PUBLISH_REFS_JSON: ${{ inputs.publish-refs-json }}

      - name: Reject untrusted event
        if: ${{ steps.trust.outputs.trusted != 'true' && inputs.untrusted-policy == 'fail' }}
        run: exit 1

  resolve-contract:
    name: Resolve reusable contract
    runs-on: ubuntu-24.04
    outputs:
      runner-preset: ${{ steps.runners.outputs.runner-preset }}
      platforms-json: ${{ steps.runners.outputs.platforms-json }}
      platform-count: ${{ steps.runners.outputs.platform-count }}
      platform-source: ${{ steps.runners.outputs.platform-source }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Resolve runner matrix
        id: runners
        run: node .buildchain/runtime/scripts/resolve-build-contract.mjs --mode runners
        env:
          BUILDCHAIN_RUNNER_PRESET: ${{ inputs.runner-preset }}
          BUILDCHAIN_PLATFORMS_JSON: ${{ inputs.platforms-json }}

  build:
    name: ${{ matrix.platform.name }}
    needs:
      - trust-gate
      - resolve-contract
    if: ${{ needs.trust-gate.outputs.trusted == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.resolve-contract.outputs.platforms-json) }}
    runs-on: ${{ fromJSON(matrix.platform.runner) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.0
        with:
          clean: true
          persist-credentials: false

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Resolve artifact contract
        id: artifact-contract
        run: node .buildchain/runtime/scripts/resolve-build-contract.mjs --mode artifact
        env:
          BUILDCHAIN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILDCHAIN_ARTIFACT_NAME_TEMPLATE: ${{ inputs.artifact-name-template }}
          BUILDCHAIN_PLATFORM_ID: ${{ matrix.platform.id }}
          BUILDCHAIN_PLATFORM_NAME: ${{ matrix.platform.name }}

      - name: Setup Node.js
        if: ${{ inputs.setup-node }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run install lifecycle
        uses: ./.buildchain/runtime/actions/run-lifecycle
        with:
          cwd: ${{ inputs.working-directory }}
          stage: install
          command: ${{ inputs.install-command }}
          required: ${{ inputs.require-install }}
          artifact-name: ${{ steps.artifact-contract.outputs.artifact-name }}
          platform-id: ${{ matrix.platform.id }}
          platform-name: ${{ matrix.platform.name }}
          artifact-paths: ${{ inputs.artifact-paths }}
          manifest-path: .buildchain/artifacts/${{ matrix.platform.id }}/manifest-install.json
          summary-path: .buildchain/artifacts/${{ matrix.platform.id }}/summary-install.json

      - name: Run build lifecycle
        uses: ./.buildchain/runtime/actions/run-lifecycle
        with:
          cwd: ${{ inputs.working-directory }}
          stage: build
          command: ${{ inputs.build-command }}
          required: ${{ inputs.require-build }}
          artifact-name: ${{ steps.artifact-contract.outputs.artifact-name }}
          platform-id: ${{ matrix.platform.id }}
          platform-name: ${{ matrix.platform.name }}
          artifact-paths: ${{ inputs.artifact-paths }}
          manifest-path: .buildchain/artifacts/${{ matrix.platform.id }}/manifest-build.json
          summary-path: .buildchain/artifacts/${{ matrix.platform.id }}/summary-build.json

      - name: Run verify lifecycle
        id: verify-lifecycle
        uses: ./.buildchain/runtime/actions/run-lifecycle
        with:
          cwd: ${{ inputs.working-directory }}
          stage: verify
          command: ${{ inputs.verify-command }}
          required: ${{ inputs.require-verify }}
          artifact-name: ${{ steps.artifact-contract.outputs.artifact-name }}
          platform-id: ${{ matrix.platform.id }}
          platform-name: ${{ matrix.platform.name }}
          artifact-paths: ${{ inputs.artifact-paths }}
          manifest-path: .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
          summary-path: .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
          expected-artifacts-json: ${{ inputs.expected-artifacts-json }}

      - name: Upload deterministic artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.artifact-contract.outputs.artifact-name }}
          path: |
            ${{ inputs.artifact-paths }}
            .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload artifact manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-manifest-${{ matrix.platform.id }}-${{ github.sha }}
          path: |
            .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  summarize:
    name: Summarize build contract
    needs:
      - trust-gate
      - resolve-contract
      - build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      summary-artifact-name: ${{ steps.names.outputs.summary-artifact-name }}
      summary-path: ${{ steps.summary.outputs.summary-path }}
      artifact-summary-json: ${{ steps.summary.outputs.artifact-summary-json }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Resolve summary artifact name
        id: names
        run: echo "summary-artifact-name=${BUILDCHAIN_SUMMARY_ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
        env:
          BUILDCHAIN_SUMMARY_ARTIFACT_NAME: ${{ inputs.artifact-name }}-summary-${{ github.sha }}

      - name: Download platform manifests
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: ${{ inputs.artifact-name }}-manifest-*-${{ github.sha }}
          path: .buildchain/downloaded-manifests
          merge-multiple: false

      - name: Aggregate artifact summary
        id: summary
        run: node .buildchain/runtime/scripts/aggregate-build-summary.mjs
        env:
          BUILDCHAIN_SUMMARY_INPUT: .buildchain/downloaded-manifests
          BUILDCHAIN_SUMMARY_OUTPUT: .buildchain/artifacts/build-summary.json
          BUILDCHAIN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILDCHAIN_PLATFORM_COUNT: ${{ needs.resolve-contract.outputs.platform-count }}
          BUILDCHAIN_TRUSTED_EVENT: ${{ needs.trust-gate.outputs.trusted-event }}
          BUILDCHAIN_PUBLISH_CHANNEL: ${{ needs.trust-gate.outputs.publish-channel }}
          BUILDCHAIN_PUBLISH_ALLOWED: ${{ needs.trust-gate.outputs.publish-allowed }}
          BUILDCHAIN_PUBLISH_REASON: ${{ needs.trust-gate.outputs.publish-reason }}

      - name: Upload aggregate build summary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.names.outputs.summary-artifact-name }}
          path: .buildchain/artifacts/build-summary.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
