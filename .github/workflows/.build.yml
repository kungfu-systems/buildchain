name: Buildchain Build

on:
  workflow_call:
    inputs:
      buildchain-repository:
        default: "kungfu-systems/buildchain"
        type: string
        required: false
      buildchain-ref:
        description: "Optional temporary Buildchain runtime ref for trusted manual validation. Empty uses the stable workflow runtime."
        default: ""
        type: string
        required: false
      buildchain-contract-lock-path:
        description: "Consumer-owned Buildchain contract lock path"
        default: "buildchain.contract-lock.json"
        type: string
        required: false
      buildchain-contract-compatibility-policy:
        description: "Contract compatibility policy: major-compatible, allow-additive, or exact"
        default: "major-compatible"
        type: string
        required: false
      buildchain-contract-drift-issue-mode:
        description: "Consumer issue behavior for Buildchain floating-ref contract drift: off, breaking-only, or compatible-and-breaking"
        default: "compatible-and-breaking"
        type: string
        required: false
      working-directory:
        default: "."
        type: string
        required: false
      runner-preset:
        description: "Runner preset: github-hosted, kungfu-v4-self-hosted, or custom with platforms-json"
        default: "github-hosted"
        type: string
        required: false
      platforms-json:
        description: "Optional custom JSON array of platform objects: id, name, runner JSON string"
        default: ""
        type: string
        required: false
      linux-container-preset:
        description: "Optional Linux job container preset: kungfu-verify, none, or custom with linux-container-image"
        default: ""
        type: string
        required: false
      linux-container-image:
        description: "Optional explicit Linux job container image, preferably pinned by digest"
        default: ""
        type: string
        required: false
      require-trusted-event:
        default: true
        type: boolean
        required: false
      untrusted-policy:
        description: "fail or skip when an untrusted fork event asks for build execution"
        default: "fail"
        type: string
        required: false
      publish-channel:
        description: "Publish channel requested by the caller: none, alpha, release, major, or a custom channel from publish-refs-json"
        default: "none"
        type: string
        required: false
      publish-refs-json:
        description: "Optional JSON object mapping publish channels to allowed Git ref regular expressions"
        default: ""
        type: string
        required: false
      publish-source-ref:
        description: "Optional source branch such as publish-gate/alpha/<line>/<version> to resolve and lock before build"
        default: ""
        type: string
        required: false
      publish-anchor-request-json:
        description: "Required JSON request when publish-source-ref resolves to publish-gate/anchor"
        default: ""
        type: string
        required: false
      publish-registry:
        description: "Registry recorded in the resolved publish source manifest"
        default: "https://registry.npmjs.org/"
        type: string
        required: false
      setup-node:
        default: true
        type: boolean
        required: false
      node-version:
        default: "24"
        type: string
        required: false
      install-command:
        default: ""
        type: string
        required: false
      build-command:
        default: ""
        type: string
        required: false
      verify-command:
        default: ""
        type: string
        required: false
      require-install:
        default: false
        type: boolean
        required: false
      require-build:
        default: true
        type: boolean
        required: false
      require-verify:
        default: false
        type: boolean
        required: false
      artifact-name:
        default: "buildchain-artifact"
        type: string
        required: false
      artifact-name-template:
        description: "Artifact name template with placeholders: {artifact}, {platform}, {sha}, {shortSha}, {runId}, {runAttempt}"
        default: "{artifact}-{platform}-{sha}"
        type: string
        required: false
      artifact-paths:
        default: |
          dist
          build/stage
        type: string
        required: false
      release-candidate:
        description: "Generate and upload a PR-stage release-candidate passport after the full platform matrix succeeds"
        default: false
        type: boolean
        required: false
      expected-artifacts-json:
        description: "Optional JSON expectation contract for final artifact files"
        default: ""
        type: string
        required: false
      process-summary-path:
        description: "Optional process sampler summary JSON path, relative to workspace, to embed in final diagnostics"
        default: ""
        type: string
        required: false
      sample-process-tree:
        description: "Wrap the build lifecycle with the process tree sampler"
        default: true
        type: boolean
        required: false
      process-sample-interval-ms:
        description: "Process sampler interval in milliseconds"
        default: 15000
        type: number
        required: false
      requested-parallelism:
        description: "Optional expected build parallelism recorded in process diagnostics"
        default: 0
        type: number
        required: false
      artifact-retention-days:
        default: 14
        type: number
        required: false
      artifact-transfer-mode:
        description: "Artifact transfer mode: github-artifacts or s3-to-github-artifacts"
        default: "github-artifacts"
        type: string
        required: false
      artifact-relay-s3-bucket:
        description: "Optional S3 bucket for artifact relay. Empty may use BUILDCHAIN_ARTIFACT_RELAY_S3_BUCKET repo/org variable."
        default: ""
        type: string
        required: false
      artifact-relay-s3-region:
        description: "Optional S3 region for artifact relay. Empty may use BUILDCHAIN_ARTIFACT_RELAY_S3_REGION repo/org variable."
        default: ""
        type: string
        required: false
      artifact-relay-s3-prefix:
        description: "Optional S3 key prefix for artifact relay. Empty may use BUILDCHAIN_ARTIFACT_RELAY_S3_PREFIX repo/org variable."
        default: ""
        type: string
        required: false
      artifact-relay-s3-role-arn:
        description: "Optional shared OIDC role ARN for S3 relay upload/download. Prefer repo/org variables or secrets."
        default: ""
        type: string
        required: false
      artifact-relay-s3-upload-role-arn:
        description: "Optional upload OIDC role ARN for self-hosted build runners."
        default: ""
        type: string
        required: false
      artifact-relay-s3-download-role-arn:
        description: "Optional download OIDC role ARN for the GitHub-hosted relay runner."
        default: ""
        type: string
        required: false
      artifact-relay-s3-oidc-audience:
        description: "Optional OIDC audience for S3 relay roles. Defaults to sts.amazonaws.com.cn for cn-* regions, otherwise sts.amazonaws.com."
        default: ""
        type: string
        required: false
    secrets:
      BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN:
        required: false
      BUILDCHAIN_ARTIFACT_RELAY_S3_UPLOAD_ROLE_ARN:
        required: false
      BUILDCHAIN_ARTIFACT_RELAY_S3_DOWNLOAD_ROLE_ARN:
        required: false
    outputs:
      runner-preset:
        description: "Resolved runner preset name"
        value: ${{ jobs.resolve-contract.outputs.runner-preset }}
      platforms-json:
        description: "Resolved platform matrix JSON"
        value: ${{ jobs.resolve-contract.outputs.platforms-json }}
      platform-count:
        description: "Resolved platform count"
        value: ${{ jobs.resolve-contract.outputs.platform-count }}
      linux-container-enabled:
        description: "Whether Linux build platforms are routed through a job container"
        value: ${{ jobs.resolve-contract.outputs.linux-container-enabled }}
      linux-container-image:
        description: "Resolved Linux job container image"
        value: ${{ jobs.resolve-contract.outputs.linux-container-image }}
      build-summary-artifact:
        description: "Uploaded aggregate build summary artifact name"
        value: ${{ jobs.summarize.outputs.summary-artifact-name }}
      build-diagnostics-summary-artifact:
        description: "Uploaded aggregate diagnostics summary artifact name"
        value: ${{ jobs.summarize.outputs.diagnostics-summary-artifact-name }}
      release-candidate-passport-artifact:
        description: "Uploaded release-candidate passport artifact name when release-candidate is enabled"
        value: ${{ jobs.summarize.outputs.release-candidate-passport-artifact-name }}
      release-candidate-artifact:
        description: "Uploaded release-candidate passport artifact name when release-candidate is enabled"
        value: ${{ jobs.summarize.outputs.release-candidate-passport-artifact-name }}
      release-candidate-passport-json:
        description: "Compact release-candidate passport JSON when release-candidate is enabled"
        value: ${{ jobs.summarize.outputs.release-candidate-passport-json }}
      build-summary-json:
        description: "Compact aggregate build summary JSON"
        value: ${{ jobs.summarize.outputs.artifact-summary-json }}
      build-diagnostics-summary-json:
        description: "Compact aggregate diagnostics summary JSON with lifecycle, diagnostics contract warning, and sidecar manifest warning totals"
        value: ${{ jobs.summarize.outputs.diagnostics-summary-json }}
      trusted-event:
        description: "Whether the event is trusted enough to run build jobs"
        value: ${{ jobs.trust-gate.outputs.trusted-event }}
      buildchain-runtime-ref:
        description: "Resolved Buildchain runtime ref"
        value: ${{ jobs.trust-gate.outputs.buildchain-runtime-ref }}
      buildchain-runtime-sha:
        description: "Resolved immutable Buildchain runtime SHA"
        value: ${{ jobs.trust-gate.outputs.buildchain-runtime-sha }}
      buildchain-runtime-class:
        description: "Runtime stability class: stable, alpha, train, exact-sha, or development"
        value: ${{ jobs.trust-gate.outputs.buildchain-runtime-class }}
      buildchain-runtime-override:
        description: "Whether a non-empty buildchain-ref override was used"
        value: ${{ jobs.trust-gate.outputs.buildchain-runtime-override }}
      buildchain-runtime-trust-decision:
        description: "Runtime override trust decision"
        value: ${{ jobs.trust-gate.outputs.buildchain-runtime-trust-decision }}
      buildchain-contract-lock-status:
        description: "Floating Buildchain runtime contract lock status"
        value: ${{ jobs.trust-gate.outputs.buildchain-contract-lock-status }}
      buildchain-contract-lock-drift:
        description: "Whether the floating Buildchain runtime SHA or contract digest drifted from the consumer lock"
        value: ${{ jobs.trust-gate.outputs.buildchain-contract-lock-drift }}
      buildchain-contract-digest:
        description: "Current Buildchain runtime contract digest"
        value: ${{ jobs.trust-gate.outputs.buildchain-contract-digest }}
      publish-channel:
        description: "Resolved publish channel"
        value: ${{ jobs.trust-gate.outputs.publish-channel }}
      publish-allowed:
        description: "Whether this event/ref may publish after successful verification"
        value: ${{ jobs.trust-gate.outputs.publish-allowed }}
      publish-reason:
        description: "Human-readable publish gate reason"
        value: ${{ jobs.trust-gate.outputs.publish-reason }}
      publish-source-ref:
        description: "Resolved publish source ref"
        value: ${{ jobs.trust-gate.outputs.publish-source-ref }}
      publish-source-sha:
        description: "Locked source SHA used for checkout/build/summary"
        value: ${{ jobs.trust-gate.outputs.publish-source-sha }}
      publish-source-tree-sha:
        description: "Git tree SHA for the locked source commit used by release-candidate promotion equivalence checks"
        value: ${{ jobs.resolve-source.outputs.publish-source-tree-sha }}
      publish-source-locked:
        description: "Whether a publish-gate source ref was explicitly locked"
        value: ${{ jobs.trust-gate.outputs.publish-source-locked }}
      publish-source-channel:
        description: "Channel parsed from the publish-gate source ref"
        value: ${{ jobs.trust-gate.outputs.publish-source-channel }}
      publish-source-line:
        description: "Line parsed from the publish-gate source ref"
        value: ${{ jobs.trust-gate.outputs.publish-source-line }}
      publish-source-consumer-version:
        description: "Consumer version parsed from the publish-gate source ref"
        value: ${{ jobs.trust-gate.outputs.publish-source-consumer-version }}
      release-manifest-json:
        description: "Resolved release manifest JSON"
        value: ${{ jobs.resolve-source.outputs.release-manifest-json }}

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  trust-gate:
    name: Trust gate
    runs-on: ubuntu-24.04
    outputs:
      trusted: ${{ steps.trust.outputs.trusted }}
      trusted-event: ${{ steps.publish.outputs.trusted-event }}
      publish-channel: ${{ steps.publish.outputs.publish-channel }}
      publish-allowed: ${{ steps.publish.outputs.publish-allowed }}
      publish-reason: ${{ steps.publish.outputs.publish-reason }}
      publish-source-ref: ${{ steps.source.outputs.publish-source-ref }}
      publish-source-full-ref: ${{ steps.source.outputs.publish-source-full-ref }}
      publish-source-sha: ${{ steps.source.outputs.publish-source-sha }}
      publish-source-locked: ${{ steps.source.outputs.publish-source-locked }}
      publish-source-channel: ${{ steps.source.outputs.publish-source-channel }}
      publish-source-line: ${{ steps.source.outputs.publish-source-line }}
      publish-source-consumer-version: ${{ steps.source.outputs.publish-source-consumer-version }}
      buildchain-runtime-ref: ${{ steps.runtime.outputs.runtime-ref }}
      buildchain-runtime-full-ref: ${{ steps.runtime.outputs.runtime-full-ref }}
      buildchain-runtime-sha: ${{ steps.runtime.outputs.runtime-sha }}
      buildchain-runtime-class: ${{ steps.runtime.outputs.runtime-class }}
      buildchain-runtime-override: ${{ steps.runtime.outputs.runtime-override }}
      buildchain-runtime-trust-decision: ${{ steps.runtime.outputs.runtime-trust-decision }}
      buildchain-workflow-shell-ref: ${{ steps.runtime.outputs.workflow-shell-ref }}
      buildchain-rollback-ref: ${{ steps.runtime.outputs.rollback-ref }}
      buildchain-contract-lock-status: ${{ steps.contract-lock.outputs.contract-lock-status }}
      buildchain-contract-lock-drift: ${{ steps.contract-lock.outputs.contract-lock-drift }}
      buildchain-contract-digest: ${{ steps.contract-lock.outputs.contract-digest }}
    steps:
      - name: Resolve Buildchain runtime
        id: runtime
        uses: actions/github-script@v8
        env:
          BUILDCHAIN_REPOSITORY: ${{ inputs.buildchain-repository }}
          BUILDCHAIN_REQUESTED_REF: ${{ inputs.buildchain-ref }}
          BUILDCHAIN_DEFAULT_REF: v2
        with:
          script: |
            const requested = (process.env.BUILDCHAIN_REQUESTED_REF || "").trim();
            const repository = (process.env.BUILDCHAIN_REPOSITORY || "kungfu-systems/buildchain").trim();
            const defaultRef = (process.env.BUILDCHAIN_DEFAULT_REF || "v2").trim();
            const [runtimeOwner, runtimeRepo] = repository.split("/");
            if (!runtimeOwner || !runtimeRepo) {
              throw new Error(`invalid buildchain repository: ${repository}`);
            }
            const exactSha = /^[0-9a-f]{40}$/i;
            const trainRef = /^train\/v\d+\/v\d+\.\d+\/[A-Za-z0-9._/-]+$/;
            const workflowRef = process.env.GITHUB_WORKFLOW_REF || "";
            const shellRef = workflowRef.startsWith(`${repository}/.github/workflows/`)
              ? (workflowRef.split("@").pop() || defaultRef).trim() || defaultRef
              : defaultRef;
            const normalizeClass = (ref) => {
              const value = String(ref || "").replace(/^refs\/heads\//, "").replace(/^refs\/tags\//, "");
              if (exactSha.test(value)) return "exact-sha";
              if (trainRef.test(value)) return "train";
              if (/^v\d+(?:\.\d+)?$/.test(value) || /^v\d+\.\d+\.\d+$/.test(value)) return "stable";
              if (/^v\d+(?:\.\d+)?-alpha$/.test(value) || /^v\d+\.\d+\.\d+-alpha\.\d+$/.test(value)) return "alpha";
              return "development";
            };
            let runtimeRef = requested || shellRef;
            let runtimeFullRef = runtimeRef;
            let runtimeClass = normalizeClass(runtimeRef);
            let runtimeOverride = requested !== "";
            let trustDecision = runtimeOverride ? "override-requested" : "stable-default";
            if (runtimeOverride) {
              if (context.eventName !== "workflow_dispatch") {
                throw new Error("buildchain-ref override is only allowed for trusted workflow_dispatch runs");
              }
              const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
              const actorPermission = permission.data.permission || "";
              if (!["admin", "maintain", "write"].includes(actorPermission)) {
                throw new Error(`buildchain-ref override requires write, maintain, or admin permission; actor has ${actorPermission || "none"}`);
              }
              if (exactSha.test(requested)) {
                runtimeRef = requested;
                runtimeFullRef = requested;
                runtimeClass = "exact-sha";
              } else {
                runtimeRef = requested.replace(/^refs\/heads\//, "");
                if (!trainRef.test(runtimeRef)) {
                  throw new Error("buildchain-ref override must be train/vN/vN.M/<capability>, refs/heads/train/vN/vN.M/<capability>, or an exact 40-character SHA");
                }
                runtimeFullRef = `refs/heads/${runtimeRef}`;
                runtimeClass = "train";
              }
              trustDecision = "override-accepted";
            }
            async function resolveRef(ref) {
              if (exactSha.test(ref)) return ref;
              const normalized = ref.replace(/^refs\/heads\//, "").replace(/^refs\/tags\//, "");
              const candidates = ref.startsWith("refs/")
                ? [ref.replace(/^refs\//, "")]
                : [`tags/${normalized}`, `heads/${normalized}`];
              for (const candidate of candidates) {
                try {
                  const response = await github.rest.git.getRef({
                    owner: runtimeOwner,
                    repo: runtimeRepo,
                    ref: candidate,
                  });
                  return response.data.object.sha;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              throw new Error(`unable to resolve Buildchain runtime ref: ${ref}`);
            }
            const runtimeSha = await resolveRef(runtimeFullRef);
            const outputs = {
              "runtime-ref": runtimeRef,
              "runtime-full-ref": runtimeFullRef,
              "runtime-sha": runtimeSha,
              "runtime-class": runtimeClass,
              "runtime-override": String(runtimeOverride),
              "runtime-trust-decision": trustDecision,
              "workflow-shell-ref": shellRef,
              "rollback-ref": shellRef,
            };
            for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
            await core.summary
              .addHeading("Buildchain runtime")
              .addRaw(`- workflow shell ref: \`${shellRef}\`\n`)
              .addRaw(`- requested runtime ref: \`${requested || "(default)"}\`\n`)
              .addRaw(`- resolved runtime ref: \`${runtimeRef}\`\n`)
              .addRaw(`- resolved runtime sha: \`${runtimeSha}\`\n`)
              .addRaw(`- stability: \`${runtimeClass}\`\n`)
              .addRaw(`- trust decision: \`${trustDecision}\`\n`)
              .addRaw(`- rollback ref: \`${shellRef}\`\n`)
              .write();

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ steps.runtime.outputs.runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Checkout consumer contract lock
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
          path: .buildchain/consumer

      - name: Check Buildchain contract lock
        id: contract-lock
        shell: bash
        run: |
          if [ -f .buildchain/runtime/scripts/buildchain-contract-lock.mjs ]; then
            node .buildchain/runtime/scripts/buildchain-contract-lock.mjs check
          else
            {
              echo "contract-lock-status=runtime-contract-unavailable"
              echo "contract-lock-compatible=true"
              echo "contract-lock-drift=false"
              echo "contract-lock-issue-needed=false"
              echo "contract-lock-issue-body-file="
              echo "contract-digest="
              echo "contract-compatibility-digest="
              echo "accepted-contract-digest="
              echo "accepted-buildchain-sha="
              echo "current-buildchain-sha=${BUILDCHAIN_RUNTIME_SHA}"
            } >> "${GITHUB_OUTPUT}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## Buildchain contract lock"
                echo
                echo "- Status: \`runtime-contract-unavailable\`"
                echo "- Runtime ref: \`${BUILDCHAIN_RUNTIME_REF}\`"
                echo "- Runtime SHA: \`${BUILDCHAIN_RUNTIME_SHA}\`"
                echo "- Note: the checked-out Buildchain runtime does not yet ship contract lock support."
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
          fi
        env:
          BUILDCHAIN_CONTRACT_LOCK_PATH: .buildchain/consumer/${{ inputs.buildchain-contract-lock-path }}
          BUILDCHAIN_CONTRACT_COMPATIBILITY_POLICY: ${{ inputs.buildchain-contract-compatibility-policy }}
          BUILDCHAIN_CONTRACT_DRIFT_ISSUE_MODE: ${{ inputs.buildchain-contract-drift-issue-mode }}
          BUILDCHAIN_RUNTIME_ROOT: .buildchain/runtime
          BUILDCHAIN_RUNTIME_REF: ${{ steps.runtime.outputs.runtime-ref }}
          BUILDCHAIN_RUNTIME_SHA: ${{ steps.runtime.outputs.runtime-sha }}
          BUILDCHAIN_RUNTIME_CLASS: ${{ steps.runtime.outputs.runtime-class }}
          BUILDCHAIN_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Report consumer Buildchain contract drift
        if: ${{ always() && steps.contract-lock.outputs.contract-lock-issue-needed == 'true' }}
        uses: ./.buildchain/runtime/actions/report-buildchain-issue
        with:
          token: ${{ github.token }}
          target-repository: ${{ github.repository }}
          title: "[Buildchain contract] ${{ github.repository }} drift on ${{ steps.runtime.outputs.runtime-ref }}"
          failure-code: buildchain-contract-${{ steps.contract-lock.outputs.contract-lock-status }}
          buildchain-ref: ${{ steps.runtime.outputs.runtime-ref }}
          buildchain-version: ${{ steps.contract-lock.outputs.contract-digest }}
          consumer-repository: ${{ github.repository }}
          consumer-ref: ${{ github.ref }}
          consumer-sha: ${{ github.sha }}
          workflow: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          summary: "Buildchain floating runtime contract drift: ${{ steps.contract-lock.outputs.contract-lock-status }}"
          body-file: ${{ steps.contract-lock.outputs.contract-lock-issue-body-file }}
          labels: "buildchain-contract-drift"
          comment-cooldown-hours: "24"
          fail-on-error: "false"

      - name: Evaluate event trust
        id: trust
        shell: bash
        run: |
          trusted=true
          if [ "${{ inputs.require-trusted-event }}" = "true" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              trusted=false
            fi
          fi
          echo "trusted=${trusted}" >> "$GITHUB_OUTPUT"
          if [ "${trusted}" != "true" ]; then
            echo "::warning::Untrusted event is not allowed to reach Buildchain build runners."
          fi

      - name: Resolve publish gate
        id: publish
        run: node .buildchain/runtime/scripts/resolve-publish-gate.mjs
        env:
          BUILDCHAIN_TRUSTED_EVENT: ${{ steps.trust.outputs.trusted }}
          BUILDCHAIN_PUBLISH_CHANNEL: ${{ inputs.publish-channel }}
          BUILDCHAIN_PUBLISH_REFS_JSON: ${{ inputs.publish-refs-json }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Resolve publish source lock
        id: source
        run: node .buildchain/runtime/scripts/resolve-publish-source.mjs --mode lock
        env:
          BUILDCHAIN_PUBLISH_SOURCE_REF: ${{ inputs.publish-source-ref }}
          BUILDCHAIN_SOURCE_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify publish target channel ref and PR lineage
        run: node .buildchain/runtime/scripts/verify-publish-channel-ref.mjs
        env:
          BUILDCHAIN_PUBLISH_SOURCE_REF: ${{ steps.source.outputs.publish-source-ref }}
          BUILDCHAIN_PUBLISH_SOURCE_SHA: ${{ steps.source.outputs.publish-source-sha }}
          BUILDCHAIN_SOURCE_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Reject untrusted event
        if: ${{ steps.trust.outputs.trusted != 'true' && inputs.untrusted-policy == 'fail' }}
        run: exit 1

  resolve-source:
    name: Resolve publish source
    runs-on: ubuntu-24.04
    needs:
      - trust-gate
    if: ${{ needs.trust-gate.outputs.trusted == 'true' }}
    outputs:
      publish-source-ref: ${{ steps.manifest.outputs.publish-source-ref }}
      publish-source-sha: ${{ steps.manifest.outputs.publish-source-sha }}
      publish-source-tree-sha: ${{ steps.source-tree.outputs.publish-source-tree-sha }}
      publish-source-locked: ${{ steps.manifest.outputs.publish-source-locked }}
      publish-source-channel: ${{ steps.manifest.outputs.publish-source-channel }}
      publish-source-line: ${{ steps.manifest.outputs.publish-source-line }}
      publish-source-consumer-version: ${{ steps.manifest.outputs.publish-source-consumer-version }}
      release-manifest-path: ${{ steps.manifest.outputs.release-manifest-path }}
      release-manifest-json: ${{ steps.manifest.outputs.release-manifest-json }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.trust-gate.outputs.publish-source-sha }}
          clean: true
          persist-credentials: false
          path: source

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.trust-gate.outputs.buildchain-runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Install Buildchain runtime dependencies
        run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts

      - name: Resolve release manifest
        id: manifest
        run: node .buildchain/runtime/scripts/resolve-publish-source.mjs --mode manifest
        env:
          BUILDCHAIN_SOURCE_CWD: source/${{ inputs.working-directory }}
          BUILDCHAIN_SOURCE_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_PUBLISH_SOURCE_REF: ${{ needs.trust-gate.outputs.publish-source-ref }}
          BUILDCHAIN_PUBLISH_SOURCE_SHA: ${{ needs.trust-gate.outputs.publish-source-sha }}
          BUILDCHAIN_PUBLISH_ANCHOR_REQUEST_JSON: ${{ inputs.publish-anchor-request-json }}
          BUILDCHAIN_PUBLISH_REGISTRY: ${{ inputs.publish-registry }}
          BUILDCHAIN_RELEASE_MANIFEST: .buildchain/artifacts/publish-source-manifest.json

      - name: Resolve source tree SHA
        id: source-tree
        shell: bash
        run: |
          tree_sha="$(git -C source rev-parse "HEAD^{tree}")"
          echo "publish-source-tree-sha=${tree_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload resolved release manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-publish-source-${{ needs.trust-gate.outputs.publish-source-sha }}
          path: .buildchain/artifacts/publish-source-manifest.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  resolve-contract:
    name: Resolve reusable contract
    runs-on: ubuntu-24.04
    needs:
      - trust-gate
    outputs:
      runner-preset: ${{ steps.runners.outputs.runner-preset }}
      platforms-json: ${{ steps.runners.outputs.platforms-json }}
      platform-count: ${{ steps.runners.outputs.platform-count }}
      platform-source: ${{ steps.runners.outputs.platform-source }}
      native-platforms-json: ${{ steps.runners.outputs.native-platforms-json }}
      native-platform-count: ${{ steps.runners.outputs.native-platform-count }}
      container-platforms-json: ${{ steps.runners.outputs.container-platforms-json }}
      container-platform-count: ${{ steps.runners.outputs.container-platform-count }}
      linux-container-enabled: ${{ steps.runners.outputs.linux-container-enabled }}
      linux-container-preset: ${{ steps.runners.outputs.linux-container-preset }}
      linux-container-image: ${{ steps.runners.outputs.linux-container-image }}
      linux-container-source: ${{ steps.runners.outputs.linux-container-source }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.trust-gate.outputs.buildchain-runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Resolve runner matrix
        id: runners
        run: node .buildchain/runtime/scripts/resolve-build-contract.mjs --mode runners
        env:
          BUILDCHAIN_RUNNER_PRESET: ${{ inputs.runner-preset }}
          BUILDCHAIN_PLATFORMS_JSON: ${{ inputs.platforms-json }}
          BUILDCHAIN_LINUX_CONTAINER_PRESET: ${{ inputs.linux-container-preset }}
          BUILDCHAIN_LINUX_CONTAINER_IMAGE: ${{ inputs.linux-container-image }}

  artifact-transfer:
    name: Resolve artifact transfer
    runs-on: ubuntu-24.04
    needs:
      - trust-gate
    if: ${{ needs.trust-gate.outputs.trusted == 'true' }}
    outputs:
      mode: ${{ steps.transfer.outputs.mode }}
      s3-bucket: ${{ steps.transfer.outputs.s3-bucket }}
      s3-region: ${{ steps.transfer.outputs.s3-region }}
      s3-prefix: ${{ steps.transfer.outputs.s3-prefix }}
      oidc-audience: ${{ steps.transfer.outputs.oidc-audience }}
    steps:
      - name: Resolve artifact transfer mode
        id: transfer
        shell: bash
        run: |
          mode="${INPUT_TRANSFER_MODE:-github-artifacts}"
          case "${mode}" in
            github-artifacts|s3-to-github-artifacts) ;;
            *)
              echo "::error::artifact-transfer-mode must be github-artifacts or s3-to-github-artifacts, got: ${mode}"
              exit 1
              ;;
          esac
          bucket="${INPUT_S3_BUCKET:-${VAR_S3_BUCKET:-}}"
          region="${INPUT_S3_REGION:-${VAR_S3_REGION:-}}"
          prefix="${INPUT_S3_PREFIX:-${VAR_S3_PREFIX:-buildchain-artifacts}}"
          audience="${INPUT_OIDC_AUDIENCE:-${VAR_OIDC_AUDIENCE:-}}"
          upload_role="${INPUT_S3_UPLOAD_ROLE_ARN:-${VAR_S3_UPLOAD_ROLE_ARN:-${SECRET_S3_UPLOAD_ROLE_ARN:-}}}"
          download_role="${INPUT_S3_DOWNLOAD_ROLE_ARN:-${VAR_S3_DOWNLOAD_ROLE_ARN:-${SECRET_S3_DOWNLOAD_ROLE_ARN:-}}}"
          shared_role="${INPUT_S3_ROLE_ARN:-${VAR_S3_ROLE_ARN:-${SECRET_S3_ROLE_ARN:-}}}"
          if [ "${mode}" = "s3-to-github-artifacts" ]; then
            if [ -z "${bucket}" ]; then
              echo "::error::artifact-transfer-mode=s3-to-github-artifacts requires artifact-relay-s3-bucket or BUILDCHAIN_ARTIFACT_RELAY_S3_BUCKET"
              exit 1
            fi
            if [ -z "${region}" ]; then
              echo "::error::artifact-transfer-mode=s3-to-github-artifacts requires artifact-relay-s3-region or BUILDCHAIN_ARTIFACT_RELAY_S3_REGION"
              exit 1
            fi
            if [ -z "${upload_role}${shared_role}" ]; then
              echo "::error::artifact-transfer-mode=s3-to-github-artifacts requires an upload role ARN input, variable, or secret"
              exit 1
            fi
            if [ -z "${download_role}${shared_role}" ]; then
              echo "::error::artifact-transfer-mode=s3-to-github-artifacts requires a download role ARN input, variable, or secret"
              exit 1
            fi
            if [ -z "${audience}" ]; then
              case "${region}" in
                cn-*) audience="sts.amazonaws.com.cn" ;;
                *) audience="sts.amazonaws.com" ;;
              esac
            fi
          else
            bucket=""
            region=""
            prefix=""
            audience=""
          fi
          {
            echo "mode=${mode}"
            echo "s3-bucket=${bucket}"
            echo "s3-region=${region}"
            echo "s3-prefix=${prefix}"
            echo "oidc-audience=${audience}"
          } >> "${GITHUB_OUTPUT}"
        env:
          INPUT_TRANSFER_MODE: ${{ inputs.artifact-transfer-mode }}
          INPUT_S3_BUCKET: ${{ inputs.artifact-relay-s3-bucket }}
          INPUT_S3_REGION: ${{ inputs.artifact-relay-s3-region }}
          INPUT_S3_PREFIX: ${{ inputs.artifact-relay-s3-prefix }}
          INPUT_S3_ROLE_ARN: ${{ inputs.artifact-relay-s3-role-arn }}
          INPUT_S3_UPLOAD_ROLE_ARN: ${{ inputs.artifact-relay-s3-upload-role-arn }}
          INPUT_S3_DOWNLOAD_ROLE_ARN: ${{ inputs.artifact-relay-s3-download-role-arn }}
          INPUT_OIDC_AUDIENCE: ${{ inputs.artifact-relay-s3-oidc-audience }}
          VAR_S3_BUCKET: ${{ vars.BUILDCHAIN_ARTIFACT_RELAY_S3_BUCKET }}
          VAR_S3_REGION: ${{ vars.BUILDCHAIN_ARTIFACT_RELAY_S3_REGION }}
          VAR_S3_PREFIX: ${{ vars.BUILDCHAIN_ARTIFACT_RELAY_S3_PREFIX }}
          VAR_S3_ROLE_ARN: ${{ vars.BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN }}
          VAR_S3_UPLOAD_ROLE_ARN: ${{ vars.BUILDCHAIN_ARTIFACT_RELAY_S3_UPLOAD_ROLE_ARN }}
          VAR_S3_DOWNLOAD_ROLE_ARN: ${{ vars.BUILDCHAIN_ARTIFACT_RELAY_S3_DOWNLOAD_ROLE_ARN }}
          VAR_OIDC_AUDIENCE: ${{ vars.BUILDCHAIN_ARTIFACT_RELAY_S3_OIDC_AUDIENCE }}
          SECRET_S3_ROLE_ARN: ${{ secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN }}
          SECRET_S3_UPLOAD_ROLE_ARN: ${{ secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_UPLOAD_ROLE_ARN }}
          SECRET_S3_DOWNLOAD_ROLE_ARN: ${{ secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_DOWNLOAD_ROLE_ARN }}

  build-native:
    name: ${{ matrix.platform.name }}
    needs:
      - trust-gate
      - resolve-contract
      - resolve-source
      - artifact-transfer
    if: ${{ needs.trust-gate.outputs.trusted == 'true' && needs.resolve-contract.outputs.native-platform-count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.resolve-contract.outputs.native-platforms-json) }}
    runs-on: ${{ fromJSON(matrix.platform.runner) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.resolve-source.outputs.publish-source-sha }}
          clean: true
          persist-credentials: false

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.trust-gate.outputs.buildchain-runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ inputs.setup-node }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Buildchain runtime dependencies
        run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts

      - name: Resolve artifact contract
        id: artifact-contract
        run: node .buildchain/runtime/scripts/resolve-build-contract.mjs --mode artifact
        env:
          BUILDCHAIN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILDCHAIN_ARTIFACT_NAME_TEMPLATE: ${{ inputs.artifact-name-template }}
          BUILDCHAIN_PLATFORM_ID: ${{ matrix.platform.id }}
          BUILDCHAIN_PLATFORM_NAME: ${{ matrix.platform.name }}
          BUILDCHAIN_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}

      - name: Run install lifecycle
        uses: ./.buildchain/runtime/actions/run-lifecycle
        env:
          BUILDCHAIN_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_SOURCE_REF: ${{ needs.resolve-source.outputs.publish-source-ref || github.ref }}
        with:
          cwd: ${{ inputs.working-directory }}
          stage: install
          command: ${{ inputs.install-command }}
          required: ${{ inputs.require-install }}
          artifact-name: ${{ steps.artifact-contract.outputs.artifact-name }}
          platform-id: ${{ matrix.platform.id }}
          platform-name: ${{ matrix.platform.name }}
          artifact-paths: ${{ inputs.artifact-paths }}
          manifest-path: .buildchain/artifacts/${{ matrix.platform.id }}/manifest-install.json
          summary-path: .buildchain/artifacts/${{ matrix.platform.id }}/summary-install.json

      - name: Run build lifecycle
        uses: ./.buildchain/runtime/actions/run-lifecycle
        env:
          BUILDCHAIN_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_SOURCE_REF: ${{ needs.resolve-source.outputs.publish-source-ref || github.ref }}
        with:
          cwd: ${{ inputs.working-directory }}
          stage: build
          command: ${{ inputs.build-command }}
          required: ${{ inputs.require-build }}
          artifact-name: ${{ steps.artifact-contract.outputs.artifact-name }}
          platform-id: ${{ matrix.platform.id }}
          platform-name: ${{ matrix.platform.name }}
          artifact-paths: ${{ inputs.artifact-paths }}
          manifest-path: .buildchain/artifacts/${{ matrix.platform.id }}/manifest-build.json
          summary-path: .buildchain/artifacts/${{ matrix.platform.id }}/summary-build.json
          process-summary-path: ${{ inputs.process-summary-path || (inputs.sample-process-tree && '.buildchain/diagnostics/process-summary.json') || '' }}
          process-samples-path: .buildchain/diagnostics/process-samples.jsonl
          sample-process-tree: ${{ inputs.sample-process-tree }}
          process-sample-interval-ms: ${{ inputs.process-sample-interval-ms }}
          requested-parallelism: ${{ inputs.requested-parallelism }}
          process-summary-required: ${{ inputs.require-build }}

      - name: Run verify lifecycle
        id: verify-lifecycle
        uses: ./.buildchain/runtime/actions/run-lifecycle
        env:
          BUILDCHAIN_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_SOURCE_REF: ${{ needs.resolve-source.outputs.publish-source-ref || github.ref }}
        with:
          cwd: ${{ inputs.working-directory }}
          stage: verify
          command: ${{ inputs.verify-command }}
          required: ${{ inputs.require-verify }}
          artifact-name: ${{ steps.artifact-contract.outputs.artifact-name }}
          manifest-artifact-name: ${{ inputs.artifact-name }}-manifest-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          diagnostics-artifact-name: ${{ inputs.artifact-name }}-diagnostics-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          platform-id: ${{ matrix.platform.id }}
          platform-name: ${{ matrix.platform.name }}
          artifact-paths: ${{ inputs.artifact-paths }}
          manifest-path: .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
          summary-path: .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
          expected-artifacts-json: ${{ inputs.expected-artifacts-json }}
          process-summary-path: ${{ inputs.process-summary-path || (inputs.sample-process-tree && '.buildchain/diagnostics/process-summary.json') || '' }}
          process-summary-required: ${{ inputs.process-summary-path != '' || inputs.require-build }}

      - name: Configure AWS credentials for artifact relay upload
        if: ${{ needs.artifact-transfer.outputs.mode == 's3-to-github-artifacts' }}
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ inputs.artifact-relay-s3-upload-role-arn || vars.BUILDCHAIN_ARTIFACT_RELAY_S3_UPLOAD_ROLE_ARN || secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_UPLOAD_ROLE_ARN || inputs.artifact-relay-s3-role-arn || vars.BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN || secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN }}
          aws-region: ${{ needs.artifact-transfer.outputs.s3-region }}
          audience: ${{ needs.artifact-transfer.outputs.oidc-audience }}

      - name: Upload payload to S3 artifact relay
        id: artifact-relay
        if: ${{ needs.artifact-transfer.outputs.mode == 's3-to-github-artifacts' }}
        run: node .buildchain/runtime/scripts/artifact-relay-s3.mjs upload
        env:
          BUILDCHAIN_ARTIFACT_RELAY_BUCKET: ${{ needs.artifact-transfer.outputs.s3-bucket }}
          BUILDCHAIN_ARTIFACT_RELAY_REGION: ${{ needs.artifact-transfer.outputs.s3-region }}
          BUILDCHAIN_ARTIFACT_RELAY_PREFIX: ${{ needs.artifact-transfer.outputs.s3-prefix }}
          BUILDCHAIN_ARTIFACT_RELAY_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_ARTIFACT_RELAY_PLATFORM_ID: ${{ matrix.platform.id }}
          BUILDCHAIN_ARTIFACT_RELAY_PLATFORM_NAME: ${{ matrix.platform.name }}
          BUILDCHAIN_ARTIFACT_RELAY_MANIFEST_PATH: .buildchain/artifacts/${{ matrix.platform.id }}/relay-manifest.json
          BUILDCHAIN_ARTIFACT_RELAY_PAYLOAD_ARTIFACT_NAME: ${{ steps.artifact-contract.outputs.artifact-name }}
          BUILDCHAIN_ARTIFACT_RELAY_PAYLOAD_PATHS: |
            ${{ inputs.artifact-paths }}
            .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
          BUILDCHAIN_ARTIFACT_RELAY_MANIFEST_ARTIFACT_NAME: ${{ inputs.artifact-name }}-manifest-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_ARTIFACT_RELAY_MANIFEST_PATHS: |
            .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
          BUILDCHAIN_ARTIFACT_RELAY_DIAGNOSTICS_ARTIFACT_NAME: ${{ inputs.artifact-name }}-diagnostics-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_ARTIFACT_RELAY_DIAGNOSTICS_PATHS: |
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics-manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/events.jsonl
            .buildchain/artifacts/${{ matrix.platform.id }}/process-summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/process-samples.jsonl

      - name: Upload artifact relay manifest
        if: ${{ needs.artifact-transfer.outputs.mode == 's3-to-github-artifacts' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-relay-manifest-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          path: .buildchain/artifacts/${{ matrix.platform.id }}/relay-manifest.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload deterministic artifact
        if: ${{ needs.artifact-transfer.outputs.mode == 'github-artifacts' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.artifact-contract.outputs.artifact-name }}
          path: |
            ${{ inputs.artifact-paths }}
            .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload artifact manifest
        if: ${{ needs.artifact-transfer.outputs.mode == 'github-artifacts' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-manifest-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          path: |
            .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload diagnostics artifact
        if: ${{ needs.artifact-transfer.outputs.mode == 'github-artifacts' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-diagnostics-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          path: |
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics-manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/events.jsonl
            .buildchain/artifacts/${{ matrix.platform.id }}/process-summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/process-samples.jsonl
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  build-linux-container:
    name: ${{ matrix.platform.name }} container
    needs:
      - trust-gate
      - resolve-contract
      - resolve-source
      - artifact-transfer
    if: ${{ needs.trust-gate.outputs.trusted == 'true' && needs.resolve-contract.outputs.container-platform-count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.resolve-contract.outputs.container-platforms-json) }}
    runs-on: ${{ fromJSON(matrix.platform.runner) }}
    container:
      image: ${{ needs.resolve-contract.outputs.linux-container-image }}
      options: --user root
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.resolve-source.outputs.publish-source-sha }}
          clean: true
          persist-credentials: false

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.trust-gate.outputs.buildchain-runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Setup Buildchain Node.js with fnm
        shell: bash
        run: |
          eval "$(fnm env --shell bash)"
          fnm install "${BUILDCHAIN_NODE_VERSION}"
          fnm use "${BUILDCHAIN_NODE_VERSION}"
          dirname "$(command -v node)" >> "${GITHUB_PATH}"
          node --version
          corepack enable
        env:
          BUILDCHAIN_NODE_VERSION: ${{ inputs.node-version }}

      - name: Install Buildchain runtime dependencies
        run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts

      - name: Resolve artifact contract
        id: artifact-contract
        run: node .buildchain/runtime/scripts/resolve-build-contract.mjs --mode artifact
        env:
          BUILDCHAIN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILDCHAIN_ARTIFACT_NAME_TEMPLATE: ${{ inputs.artifact-name-template }}
          BUILDCHAIN_PLATFORM_ID: ${{ matrix.platform.id }}
          BUILDCHAIN_PLATFORM_NAME: ${{ matrix.platform.name }}
          BUILDCHAIN_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}

      - name: Run install lifecycle
        uses: ./.buildchain/runtime/actions/run-lifecycle
        env:
          BUILDCHAIN_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_SOURCE_REF: ${{ needs.resolve-source.outputs.publish-source-ref || github.ref }}
        with:
          cwd: ${{ inputs.working-directory }}
          stage: install
          command: ${{ inputs.install-command }}
          required: ${{ inputs.require-install }}
          artifact-name: ${{ steps.artifact-contract.outputs.artifact-name }}
          platform-id: ${{ matrix.platform.id }}
          platform-name: ${{ matrix.platform.name }}
          artifact-paths: ${{ inputs.artifact-paths }}
          manifest-path: .buildchain/artifacts/${{ matrix.platform.id }}/manifest-install.json
          summary-path: .buildchain/artifacts/${{ matrix.platform.id }}/summary-install.json

      - name: Run build lifecycle
        uses: ./.buildchain/runtime/actions/run-lifecycle
        env:
          BUILDCHAIN_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_SOURCE_REF: ${{ needs.resolve-source.outputs.publish-source-ref || github.ref }}
        with:
          cwd: ${{ inputs.working-directory }}
          stage: build
          command: ${{ inputs.build-command }}
          required: ${{ inputs.require-build }}
          artifact-name: ${{ steps.artifact-contract.outputs.artifact-name }}
          platform-id: ${{ matrix.platform.id }}
          platform-name: ${{ matrix.platform.name }}
          artifact-paths: ${{ inputs.artifact-paths }}
          manifest-path: .buildchain/artifacts/${{ matrix.platform.id }}/manifest-build.json
          summary-path: .buildchain/artifacts/${{ matrix.platform.id }}/summary-build.json
          process-summary-path: ${{ inputs.process-summary-path || (inputs.sample-process-tree && '.buildchain/diagnostics/process-summary.json') || '' }}
          process-samples-path: .buildchain/diagnostics/process-samples.jsonl
          sample-process-tree: ${{ inputs.sample-process-tree }}
          process-sample-interval-ms: ${{ inputs.process-sample-interval-ms }}
          requested-parallelism: ${{ inputs.requested-parallelism }}
          process-summary-required: ${{ inputs.require-build }}

      - name: Run verify lifecycle
        id: verify-lifecycle
        uses: ./.buildchain/runtime/actions/run-lifecycle
        env:
          BUILDCHAIN_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_SOURCE_REF: ${{ needs.resolve-source.outputs.publish-source-ref || github.ref }}
        with:
          cwd: ${{ inputs.working-directory }}
          stage: verify
          command: ${{ inputs.verify-command }}
          required: ${{ inputs.require-verify }}
          artifact-name: ${{ steps.artifact-contract.outputs.artifact-name }}
          manifest-artifact-name: ${{ inputs.artifact-name }}-manifest-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          diagnostics-artifact-name: ${{ inputs.artifact-name }}-diagnostics-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          platform-id: ${{ matrix.platform.id }}
          platform-name: ${{ matrix.platform.name }}
          artifact-paths: ${{ inputs.artifact-paths }}
          manifest-path: .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
          summary-path: .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
          expected-artifacts-json: ${{ inputs.expected-artifacts-json }}
          process-summary-path: ${{ inputs.process-summary-path || (inputs.sample-process-tree && '.buildchain/diagnostics/process-summary.json') || '' }}
          process-summary-required: ${{ inputs.process-summary-path != '' || inputs.require-build }}

      - name: Configure AWS credentials for artifact relay upload
        if: ${{ needs.artifact-transfer.outputs.mode == 's3-to-github-artifacts' }}
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ inputs.artifact-relay-s3-upload-role-arn || vars.BUILDCHAIN_ARTIFACT_RELAY_S3_UPLOAD_ROLE_ARN || secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_UPLOAD_ROLE_ARN || inputs.artifact-relay-s3-role-arn || vars.BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN || secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN }}
          aws-region: ${{ needs.artifact-transfer.outputs.s3-region }}
          audience: ${{ needs.artifact-transfer.outputs.oidc-audience }}

      - name: Upload payload to S3 artifact relay
        id: artifact-relay
        if: ${{ needs.artifact-transfer.outputs.mode == 's3-to-github-artifacts' }}
        run: node .buildchain/runtime/scripts/artifact-relay-s3.mjs upload
        env:
          BUILDCHAIN_ARTIFACT_RELAY_BUCKET: ${{ needs.artifact-transfer.outputs.s3-bucket }}
          BUILDCHAIN_ARTIFACT_RELAY_REGION: ${{ needs.artifact-transfer.outputs.s3-region }}
          BUILDCHAIN_ARTIFACT_RELAY_PREFIX: ${{ needs.artifact-transfer.outputs.s3-prefix }}
          BUILDCHAIN_ARTIFACT_RELAY_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_ARTIFACT_RELAY_PLATFORM_ID: ${{ matrix.platform.id }}
          BUILDCHAIN_ARTIFACT_RELAY_PLATFORM_NAME: ${{ matrix.platform.name }}
          BUILDCHAIN_ARTIFACT_RELAY_MANIFEST_PATH: .buildchain/artifacts/${{ matrix.platform.id }}/relay-manifest.json
          BUILDCHAIN_ARTIFACT_RELAY_PAYLOAD_ARTIFACT_NAME: ${{ steps.artifact-contract.outputs.artifact-name }}
          BUILDCHAIN_ARTIFACT_RELAY_PAYLOAD_PATHS: |
            ${{ inputs.artifact-paths }}
            .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
          BUILDCHAIN_ARTIFACT_RELAY_MANIFEST_ARTIFACT_NAME: ${{ inputs.artifact-name }}-manifest-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_ARTIFACT_RELAY_MANIFEST_PATHS: |
            .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
          BUILDCHAIN_ARTIFACT_RELAY_DIAGNOSTICS_ARTIFACT_NAME: ${{ inputs.artifact-name }}-diagnostics-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_ARTIFACT_RELAY_DIAGNOSTICS_PATHS: |
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics-manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/events.jsonl
            .buildchain/artifacts/${{ matrix.platform.id }}/process-summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/process-samples.jsonl

      - name: Upload artifact relay manifest
        if: ${{ needs.artifact-transfer.outputs.mode == 's3-to-github-artifacts' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-relay-manifest-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          path: .buildchain/artifacts/${{ matrix.platform.id }}/relay-manifest.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload deterministic artifact
        if: ${{ needs.artifact-transfer.outputs.mode == 'github-artifacts' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.artifact-contract.outputs.artifact-name }}
          path: |
            ${{ inputs.artifact-paths }}
            .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload artifact manifest
        if: ${{ needs.artifact-transfer.outputs.mode == 'github-artifacts' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-manifest-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          path: |
            .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload diagnostics artifact
        if: ${{ needs.artifact-transfer.outputs.mode == 'github-artifacts' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-diagnostics-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          path: |
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics.json
            .buildchain/artifacts/${{ matrix.platform.id }}/diagnostics-manifest.json
            .buildchain/artifacts/${{ matrix.platform.id }}/events.jsonl
            .buildchain/artifacts/${{ matrix.platform.id }}/process-summary.json
            .buildchain/artifacts/${{ matrix.platform.id }}/process-samples.jsonl
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  relay-artifacts:
    name: Relay ${{ matrix.platform.name }} artifacts
    needs:
      - trust-gate
      - resolve-contract
      - resolve-source
      - artifact-transfer
      - build-native
      - build-linux-container
    if: ${{ always() && needs.artifact-transfer.outputs.mode == 's3-to-github-artifacts' && (needs.build-native.result == 'success' || needs.build-native.result == 'skipped') && (needs.build-linux-container.result == 'success' || needs.build-linux-container.result == 'skipped') && (needs.build-native.result == 'success' || needs.build-linux-container.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.resolve-contract.outputs.platforms-json) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.trust-gate.outputs.buildchain-runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Install Buildchain runtime dependencies
        run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts

      - name: Resolve artifact contract
        id: artifact-contract
        run: node .buildchain/runtime/scripts/resolve-build-contract.mjs --mode artifact
        env:
          BUILDCHAIN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILDCHAIN_ARTIFACT_NAME_TEMPLATE: ${{ inputs.artifact-name-template }}
          BUILDCHAIN_PLATFORM_ID: ${{ matrix.platform.id }}
          BUILDCHAIN_PLATFORM_NAME: ${{ matrix.platform.name }}
          BUILDCHAIN_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}

      - name: Download artifact relay manifest
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ inputs.artifact-name }}-relay-manifest-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          path: .buildchain/downloaded-relay-manifests/${{ matrix.platform.id }}

      - name: Configure AWS credentials for artifact relay download
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ inputs.artifact-relay-s3-download-role-arn || vars.BUILDCHAIN_ARTIFACT_RELAY_S3_DOWNLOAD_ROLE_ARN || secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_DOWNLOAD_ROLE_ARN || inputs.artifact-relay-s3-role-arn || vars.BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN || secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN }}
          aws-region: ${{ needs.artifact-transfer.outputs.s3-region }}
          audience: ${{ needs.artifact-transfer.outputs.oidc-audience }}

      - name: Download and verify S3 relay payload
        id: relay-download
        run: node .buildchain/runtime/scripts/artifact-relay-s3.mjs download
        env:
          BUILDCHAIN_ARTIFACT_RELAY_INPUT_ROOT: .buildchain/downloaded-relay-manifests/${{ matrix.platform.id }}
          BUILDCHAIN_ARTIFACT_RELAY_OUTPUT_ROOT: .buildchain/relayed-artifacts/${{ matrix.platform.id }}
          BUILDCHAIN_ARTIFACT_RELAY_REGION: ${{ needs.artifact-transfer.outputs.s3-region }}
          BUILDCHAIN_ARTIFACT_RELAY_PLATFORM_ID: ${{ matrix.platform.id }}

      - name: Upload deterministic artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.artifact-contract.outputs.artifact-name }}
          path: ${{ steps.relay-download.outputs.payload-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload artifact manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-manifest-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          path: ${{ steps.relay-download.outputs.manifest-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-diagnostics-${{ matrix.platform.id }}-${{ needs.resolve-source.outputs.publish-source-sha }}
          path: ${{ steps.relay-download.outputs.diagnostics-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Cleanup S3 artifact relay payload
        if: ${{ success() }}
        run: node .buildchain/runtime/scripts/artifact-relay-s3.mjs cleanup
        env:
          BUILDCHAIN_ARTIFACT_RELAY_INPUT_ROOT: .buildchain/downloaded-relay-manifests/${{ matrix.platform.id }}
          BUILDCHAIN_ARTIFACT_RELAY_REGION: ${{ needs.artifact-transfer.outputs.s3-region }}
          BUILDCHAIN_ARTIFACT_RELAY_PLATFORM_ID: ${{ matrix.platform.id }}

  summarize:
    name: Summarize build contract
    needs:
      - trust-gate
      - resolve-contract
      - resolve-source
      - artifact-transfer
      - build-native
      - build-linux-container
      - relay-artifacts
    if: ${{ always() && (needs.build-native.result == 'success' || needs.build-native.result == 'skipped') && (needs.build-linux-container.result == 'success' || needs.build-linux-container.result == 'skipped') && (needs.build-native.result == 'success' || needs.build-linux-container.result == 'success') && (needs.artifact-transfer.outputs.mode == 'github-artifacts' || needs.relay-artifacts.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      summary-artifact-name: ${{ steps.names.outputs.summary-artifact-name }}
      diagnostics-summary-artifact-name: ${{ steps.names.outputs.diagnostics-summary-artifact-name }}
      summary-path: ${{ steps.summary.outputs.summary-path }}
      artifact-summary-json: ${{ steps.summary.outputs.artifact-summary-json }}
      diagnostics-summary-path: ${{ steps.diagnostics.outputs.diagnostics-summary-path }}
      diagnostics-summary-json: ${{ steps.diagnostics.outputs.diagnostics-summary-json }}
      release-candidate-passport-artifact-name: ${{ steps.names.outputs.release-candidate-passport-artifact-name }}
      release-candidate-passport-json: ${{ steps.release-candidate.outputs.release-candidate-passport-json }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.trust-gate.outputs.buildchain-runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Install Buildchain runtime dependencies
        run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts

      - name: Resolve summary artifact name
        id: names
        run: |
          rc_target_channel="${BUILDCHAIN_RC_TARGET_CHANNEL}"
          if { [ -z "${rc_target_channel}" ] || [ "${rc_target_channel}" = "none" ]; } && [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            case "${BUILDCHAIN_RC_PR_BASE_REF}" in
              alpha/*)
                rc_target_channel="alpha"
                ;;
              release/*)
                rc_target_channel="release"
                ;;
              publish-gate/major|major-gate)
                rc_target_channel="major"
                ;;
            esac
          fi
          release_candidate_enabled=false
          if [ "${BUILDCHAIN_RC_REQUESTED}" = "true" ] && [ -n "${rc_target_channel}" ] && [ "${rc_target_channel}" != "none" ]; then
            release_candidate_enabled=true
          fi
          {
            echo "summary-artifact-name=${BUILDCHAIN_SUMMARY_ARTIFACT_NAME}"
            echo "diagnostics-summary-artifact-name=${BUILDCHAIN_DIAGNOSTICS_SUMMARY_ARTIFACT_NAME}"
            echo "release-candidate-enabled=${release_candidate_enabled}"
            echo "release-candidate-target-channel=${rc_target_channel}"
            if [ "${release_candidate_enabled}" = "true" ]; then
              echo "release-candidate-passport-artifact-name=${BUILDCHAIN_RC_PASSPORT_ARTIFACT_NAME}"
            else
              echo "release-candidate-passport-artifact-name="
            fi
          } >> "${GITHUB_OUTPUT}"
        env:
          BUILDCHAIN_SUMMARY_ARTIFACT_NAME: ${{ inputs.artifact-name }}-summary-${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_DIAGNOSTICS_SUMMARY_ARTIFACT_NAME: ${{ inputs.artifact-name }}-diagnostics-summary-${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_RC_PASSPORT_ARTIFACT_NAME: ${{ inputs.artifact-name }}-release-candidate-${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_RC_REQUESTED: ${{ inputs.release-candidate }}
          BUILDCHAIN_RC_TARGET_CHANNEL: ${{ needs.resolve-source.outputs.publish-source-channel || needs.trust-gate.outputs.publish-channel }}
          BUILDCHAIN_RC_PR_BASE_REF: ${{ github.base_ref || github.event.pull_request.base.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Download platform manifests
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: ${{ inputs.artifact-name }}-manifest-*-${{ needs.resolve-source.outputs.publish-source-sha }}
          path: .buildchain/downloaded-manifests
          merge-multiple: false

      - name: Download platform diagnostics
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: ${{ inputs.artifact-name }}-diagnostics-*-${{ needs.resolve-source.outputs.publish-source-sha }}
          path: .buildchain/downloaded-diagnostics
          merge-multiple: false

      - name: Aggregate artifact summary
        id: summary
        run: node .buildchain/runtime/scripts/aggregate-build-summary.mjs
        env:
          BUILDCHAIN_SUMMARY_INPUT: .buildchain/downloaded-manifests
          BUILDCHAIN_SUMMARY_OUTPUT: .buildchain/artifacts/build-summary.json
          BUILDCHAIN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILDCHAIN_PLATFORM_COUNT: ${{ needs.resolve-contract.outputs.platform-count }}
          BUILDCHAIN_TRUSTED_EVENT: ${{ needs.trust-gate.outputs.trusted-event }}
          BUILDCHAIN_PUBLISH_CHANNEL: ${{ needs.trust-gate.outputs.publish-channel }}
          BUILDCHAIN_PUBLISH_ALLOWED: ${{ needs.trust-gate.outputs.publish-allowed }}
          BUILDCHAIN_PUBLISH_REASON: ${{ needs.trust-gate.outputs.publish-reason }}
          BUILDCHAIN_PUBLISH_SOURCE_REF: ${{ needs.resolve-source.outputs.publish-source-ref }}
          BUILDCHAIN_PUBLISH_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_PUBLISH_SOURCE_LOCKED: ${{ needs.resolve-source.outputs.publish-source-locked }}
          BUILDCHAIN_PUBLISH_SOURCE_CHANNEL: ${{ needs.resolve-source.outputs.publish-source-channel }}
          BUILDCHAIN_PUBLISH_SOURCE_LINE: ${{ needs.resolve-source.outputs.publish-source-line }}
          BUILDCHAIN_PUBLISH_SOURCE_CONSUMER_VERSION: ${{ needs.resolve-source.outputs.publish-source-consumer-version }}
          BUILDCHAIN_RELEASE_MANIFEST_JSON: ${{ needs.resolve-source.outputs.release-manifest-json }}
          BUILDCHAIN_SOURCE_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_SOURCE_TREE_SHA: ${{ needs.resolve-source.outputs.publish-source-tree-sha }}
          BUILDCHAIN_SOURCE_REF: ${{ needs.resolve-source.outputs.publish-source-ref || github.ref }}
          BUILDCHAIN_RUNTIME_REQUESTED_REF: ${{ inputs.buildchain-ref }}
          BUILDCHAIN_RUNTIME_REF: ${{ needs.trust-gate.outputs.buildchain-runtime-ref }}
          BUILDCHAIN_RUNTIME_SHA: ${{ needs.trust-gate.outputs.buildchain-runtime-sha }}
          BUILDCHAIN_RUNTIME_CLASS: ${{ needs.trust-gate.outputs.buildchain-runtime-class }}
          BUILDCHAIN_RUNTIME_OVERRIDE: ${{ needs.trust-gate.outputs.buildchain-runtime-override }}
          BUILDCHAIN_RUNTIME_TRUST_DECISION: ${{ needs.trust-gate.outputs.buildchain-runtime-trust-decision }}
          BUILDCHAIN_WORKFLOW_SHELL_REF: ${{ needs.trust-gate.outputs.buildchain-workflow-shell-ref }}
          BUILDCHAIN_ROLLBACK_REF: ${{ needs.trust-gate.outputs.buildchain-rollback-ref }}

      - name: Aggregate diagnostics summary
        id: diagnostics
        run: node .buildchain/runtime/scripts/aggregate-diagnostics-summary.mjs
        env:
          BUILDCHAIN_DIAGNOSTICS_INPUT: .buildchain/downloaded-diagnostics
          BUILDCHAIN_DIAGNOSTICS_OUTPUT: .buildchain/artifacts/diagnostics-summary.json
          BUILDCHAIN_PLATFORM_COUNT: ${{ needs.resolve-contract.outputs.platform-count }}

      - name: Generate release candidate passport
        id: release-candidate
        if: ${{ steps.names.outputs.release-candidate-enabled == 'true' }}
        run: node .buildchain/runtime/scripts/generate-release-candidate-passport.mjs
        env:
          BUILDCHAIN_BUILD_SUMMARY_PATH: .buildchain/artifacts/build-summary.json
          BUILDCHAIN_RC_PASSPORT_PATH: .buildchain/artifacts/release-candidate-passport.json
          BUILDCHAIN_RC_TARGET_CHANNEL: ${{ steps.names.outputs.release-candidate-target-channel }}
          BUILDCHAIN_RC_VERSION: ${{ needs.resolve-source.outputs.publish-source-consumer-version }}
          BUILDCHAIN_RC_SOURCE_HEAD_SHA: ${{ needs.resolve-source.outputs.publish-source-sha }}
          BUILDCHAIN_RC_MERGE_REF_SHA: ${{ github.sha }}
          BUILDCHAIN_RC_SOURCE_TREE_HASH: ${{ needs.resolve-source.outputs.publish-source-tree-sha }}
          BUILDCHAIN_RUNTIME_REF: ${{ needs.trust-gate.outputs.buildchain-runtime-ref }}
          BUILDCHAIN_RUNTIME_SHA: ${{ needs.trust-gate.outputs.buildchain-runtime-sha }}
          BUILDCHAIN_WORKFLOW_SHELL_REF: ${{ needs.trust-gate.outputs.buildchain-workflow-shell-ref }}
          BUILDCHAIN_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILDCHAIN_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          BUILDCHAIN_PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
          BUILDCHAIN_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BUILDCHAIN_PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Upload aggregate build summary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.names.outputs.summary-artifact-name }}
          path: .buildchain/artifacts/build-summary.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload aggregate diagnostics summary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.names.outputs.diagnostics-summary-artifact-name }}
          path: .buildchain/artifacts/diagnostics-summary.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload release candidate passport
        if: ${{ steps.names.outputs.release-candidate-enabled == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.names.outputs.release-candidate-passport-artifact-name }}
          path: .buildchain/artifacts/release-candidate-passport.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
