name: Buildchain Build
on:
  workflow_call:
    inputs:
      config-path:
        description: Locate buildchain.toml when the project cannot be discovered.
        type: string
        required: false
        default: ''
    secrets:
      BUILDCHAIN_PROMOTION_TOKEN:
        required: false
      BUILDCHAIN_MACOS_CERTIFICATE_P12_BASE64:
        required: false
      BUILDCHAIN_MACOS_CERTIFICATE_PASSWORD:
        required: false
      BUILDCHAIN_MACOS_NOTARY_API_KEY_P8_BASE64:
        required: false
      BUILDCHAIN_MACOS_NOTARY_API_KEY_ID:
        required: false
      BUILDCHAIN_MACOS_NOTARY_API_ISSUER:
        required: false
    outputs:
      result:
        description: Rooted build result and exact artifact references.
        value: ${{ jobs.deliver.outputs.result }}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
    - name: Checkout exact workflow implementation
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ job.workflow_sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - name: Checkout exact consumer source
      uses: actions/checkout@v7.0.0
      with:
        ref: ${{ github.sha }}
        path: source
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.buildchain/runtime/actions/resolve-build-plan
      with:
        config-path: ${{ inputs.config-path }}
        workflow-ref: ${{ job.workflow_ref }}
        workflow-sha: ${{ job.workflow_sha }}
        control-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
      id: plan
  build-native:
    needs:
    - plan
    if: ${{ fromJSON(needs.plan.outputs.plan).matrix.native[0] != null }}
    strategy:
      fail-fast: ${{ fromJSON(needs.plan.outputs.plan).build.fail_fast }}
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.plan).matrix.native }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.plan).build.timeout_minutes }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
    - name: Checkout exact workflow implementation
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ job.workflow_sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - uses: ./.buildchain/runtime/actions/prepare-build-environment
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
        checkout-source: 'true'
        tools: 'true'
    - uses: ./.buildchain/runtime/actions/run-build-stage
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
        stage: install
    - uses: ./.buildchain/runtime/actions/run-build-stage
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
        stage: build
    - uses: ./.buildchain/runtime/actions/run-build-stage
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
        stage: verify
    - uses: ./.buildchain/runtime/actions/transfer-build-artifact
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
      if: ${{ always() }}
  build-container:
    needs:
    - plan
    if: ${{ fromJSON(needs.plan.outputs.plan).matrix.container[0] != null }}
    strategy:
      fail-fast: ${{ fromJSON(needs.plan.outputs.plan).build.fail_fast }}
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.plan).matrix.container }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.plan).build.timeout_minutes }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
    - name: Checkout exact workflow implementation
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ job.workflow_sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - uses: ./.buildchain/runtime/actions/prepare-build-environment
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
        checkout-source: 'true'
        tools: 'true'
    - uses: ./.buildchain/runtime/actions/run-build-stage
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
        stage: install
    - uses: ./.buildchain/runtime/actions/run-build-stage
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
        stage: build
    - uses: ./.buildchain/runtime/actions/run-build-stage
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
        stage: verify
    - uses: ./.buildchain/runtime/actions/transfer-build-artifact
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
      if: ${{ always() }}
    container:
      image: ${{ fromJSON(needs.plan.outputs.plan).container.image }}
      options: --user root
  sign:
    needs:
    - plan
    - build-native
    - build-container
    if: ${{ always() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.plan).matrix.sign }}
    runs-on: ${{ matrix.platform.runner }}
    environment:
      name: ${{ matrix.platform.environment }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
    - name: Checkout exact workflow implementation
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ job.workflow_sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - uses: ./.buildchain/runtime/actions/prepare-build-environment
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
        checkout-source: ${{ matrix.platform.kind == 'artifact' }}
        tools: 'false'
    - uses: ./.buildchain/runtime/actions/sign-build-artifact
      with:
        plan: ${{ needs.plan.outputs.plan }}
        platform: ${{ toJSON(matrix.platform) }}
        kind: ${{ matrix.platform.kind }}
        control-token: ${{ matrix.platform.kind == 'artifact' && secrets.BUILDCHAIN_PROMOTION_TOKEN || '' }}
        expected-team-id: ${{ vars.BUILDCHAIN_MACOS_EXPECTED_TEAM_ID }}
        certificate-sha1: ${{ vars.BUILDCHAIN_MACOS_CERTIFICATE_SHA1 }}
        certificate-p12-base64: ${{ matrix.platform.kind == 'credential' && secrets.BUILDCHAIN_MACOS_CERTIFICATE_P12_BASE64 || '' }}
        certificate-password: ${{ matrix.platform.kind == 'credential' && secrets.BUILDCHAIN_MACOS_CERTIFICATE_PASSWORD || '' }}
        notary-api-key-p8-base64: ${{ matrix.platform.kind == 'credential' && secrets.BUILDCHAIN_MACOS_NOTARY_API_KEY_P8_BASE64 || '' }}
        notary-api-key-id: ${{ matrix.platform.kind == 'credential' && secrets.BUILDCHAIN_MACOS_NOTARY_API_KEY_ID || '' }}
        notary-api-issuer: ${{ matrix.platform.kind == 'credential' && secrets.BUILDCHAIN_MACOS_NOTARY_API_ISSUER || '' }}
  attest:
    needs:
    - plan
    - sign
    if: ${{ always() && needs.sign.result == 'success' && fromJSON(needs.plan.outputs.plan).build.attestation.subject_path != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      artifact: ${{ steps.attest.outputs.artifact }}
    steps:
    - name: Checkout exact workflow implementation
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ job.workflow_sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - uses: ./.buildchain/runtime/actions/prepare-build-environment
      with:
        plan: ${{ needs.plan.outputs.plan }}
    - uses: ./.buildchain/runtime/actions/attest-build-artifact
      with:
        plan: ${{ needs.plan.outputs.plan }}
      id: attest
  deliver:
    needs:
    - plan
    - build-native
    - build-container
    - sign
    - attest
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      result: ${{ steps.final.outputs.result }}
    steps:
    - name: Checkout exact workflow implementation
      uses: actions/checkout@v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: ${{ job.workflow_sha }}
        path: .buildchain/runtime
        persist-credentials: false
    - uses: ./.buildchain/runtime/actions/prepare-build-environment
      with:
        plan: ${{ needs.plan.outputs.plan }}
    - uses: ./.buildchain/runtime/actions/finalize-build-result
      with:
        plan: ${{ needs.plan.outputs.plan }}
        jobs: ${{ toJSON(needs) }}
      id: final
