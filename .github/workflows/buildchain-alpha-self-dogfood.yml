name: Buildchain Alpha Self-Dogfood

run-name: Buildchain v3-alpha self-dogfood

on:
  workflow_run:
    workflows: ["Buildchain Ref Promotion"]
    types: [completed]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

concurrency:
  group: buildchain-release-promotion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  alpha-consumer:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v3-alpha
    permissions:
      actions: read
      contents: read
      issues: write
      id-token: write
    with:
      buildchain-channel: auto
      working-directory: fixtures/libnode-shaped
      buildchain-contract-drift-issue-mode: "off"
      runner-preset: custom
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","runner":"[\"ubuntu-24.04\"]"}]
      artifact-name: buildchain-v3-alpha-self-dogfood
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: fixtures/libnode-shaped/dist
      require-install: true
      require-verify: true
      artifact-retention-days: 7

  stable-consumer:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v3-alpha
    permissions:
      actions: read
      contents: read
      issues: write
      id-token: write
    with:
      buildchain-channel: stable
      working-directory: fixtures/libnode-shaped
      buildchain-contract-drift-issue-mode: "off"
      runner-preset: custom
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","runner":"[\"ubuntu-24.04\"]"}]
      artifact-name: buildchain-v3-stable-self-dogfood
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: fixtures/libnode-shaped/dist
      require-install: true
      require-verify: true
      artifact-retention-days: 7

  credential-island-consumer:
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && vars.BUILDCHAIN_MACOS_CREDENTIAL_ISLAND_ENVIRONMENT != '' }}
    uses: ./.github/workflows/.build.yml
    permissions:
      actions: read
      contents: read
    with:
      working-directory: fixtures/macos-credential-island-shaped
      buildchain-contract-drift-issue-mode: "off"
      runner-preset: custom
      platforms-json: >-
        [{"id":"macos-hosted","name":"macOS hosted credential-free build","runner":"[\"macos-15\"]"}]
      artifact-name: buildchain-v3-credential-island-self-dogfood
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: fixtures/macos-credential-island-shaped/dist
      credential-island-macos-app-path: fixtures/macos-credential-island-shaped/dist/Buildchain Credential Island.app
      credential-island-environment: ${{ vars.BUILDCHAIN_MACOS_CREDENTIAL_ISLAND_ENVIRONMENT }}
      credential-island-macos-platform-id: macos-hosted
      require-verify: true
      artifact-retention-days: 7

  verify-floating-refs:
    name: Verify floating refs
    needs:
      - alpha-consumer
      - stable-consumer
      - credential-island-consumer
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Buildchain source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Verify resolved runtime SHAs
        uses: actions/github-script@v8
        env:
          ALPHA_RUNTIME_REF: ${{ needs.alpha-consumer.outputs.buildchain-runtime-ref }}
          ALPHA_RUNTIME_SHA: ${{ needs.alpha-consumer.outputs.buildchain-runtime-sha }}
          ALPHA_RUNTIME_CLASS: ${{ needs.alpha-consumer.outputs.buildchain-runtime-class }}
          STABLE_RUNTIME_REF: ${{ needs.stable-consumer.outputs.buildchain-runtime-ref }}
          STABLE_RUNTIME_SHA: ${{ needs.stable-consumer.outputs.buildchain-runtime-sha }}
          STABLE_RUNTIME_CLASS: ${{ needs.stable-consumer.outputs.buildchain-runtime-class }}
        with:
          script: |
            const fs = require("node:fs");
            const alphaRef = "v3-alpha";
            const stableRef = "v3";
            const resolveTag = async (tag) => {
              const response = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              return response.data.object.sha;
            };
            const expectedAlphaSha = await resolveTag(alphaRef);
            const expectedStableSha = await resolveTag(stableRef);
            const observed = {
              alpha: {
                ref: process.env.ALPHA_RUNTIME_REF,
                sha: process.env.ALPHA_RUNTIME_SHA,
                class: process.env.ALPHA_RUNTIME_CLASS,
                expectedSha: expectedAlphaSha,
              },
              stable: {
                ref: process.env.STABLE_RUNTIME_REF,
                sha: process.env.STABLE_RUNTIME_SHA,
                class: process.env.STABLE_RUNTIME_CLASS,
                expectedSha: expectedStableSha,
              },
            };
            const failures = [];
            if (observed.alpha.ref !== alphaRef) failures.push(`alpha runtime ref: ${observed.alpha.ref}`);
            if (observed.alpha.class !== "alpha") failures.push(`alpha runtime class: ${observed.alpha.class}`);
            if (observed.alpha.sha !== expectedAlphaSha) failures.push(`alpha runtime sha: ${observed.alpha.sha}`);
            if (observed.stable.ref !== stableRef) failures.push(`stable runtime ref: ${observed.stable.ref}`);
            if (observed.stable.class !== "stable") failures.push(`stable runtime class: ${observed.stable.class}`);
            if (observed.stable.sha !== expectedStableSha) failures.push(`stable runtime sha: ${observed.stable.sha}`);
            const evidence = {
              schemaVersion: 1,
              contract: "kungfu-buildchain-alpha-self-dogfood",
              repository: context.repo.owner + "/" + context.repo.repo,
              callerSha: context.sha,
              checkedAt: new Date().toISOString(),
              status: failures.length === 0 ? "passed" : "failed",
              observed,
              failures,
            };
            fs.mkdirSync(".buildchain/self-dogfood", { recursive: true });
            fs.writeFileSync(
              ".buildchain/self-dogfood/evidence.json",
              JSON.stringify(evidence, null, 2) + "\n",
            );
            await core.summary
              .addHeading("Buildchain floating ref self-dogfood")
              .addRaw(`- v3-alpha: \`${observed.alpha.sha}\` (${observed.alpha.class})\n`)
              .addRaw(`- v3: \`${observed.stable.sha}\` (${observed.stable.class})\n`)
              .addRaw(`- status: \`${evidence.status}\`\n`)
              .write();
            if (failures.length > 0) {
              core.setFailed(`floating ref self-dogfood failed: ${failures.join(", ")}`);
            }

      - name: Download authoritative signed macOS payload
        if: ${{ always() && needs.credential-island-consumer.result == 'success' }}
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.credential-island-consumer.outputs.credential-island-macos-artifact }}
          path: .buildchain/self-dogfood/credential-payload

      - name: Download authoritative signed macOS manifest
        if: ${{ always() && needs.credential-island-consumer.result == 'success' }}
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.credential-island-consumer.outputs.credential-island-macos-manifest-artifact }}
          path: .buildchain/self-dogfood/credential-manifest

      - name: Verify retained credential-island evidence
        if: ${{ always() }}
        run: node scripts/verify-credential-island-self-dogfood.mjs
        env:
          BUILDCHAIN_CREDENTIAL_JOB_RESULT: ${{ needs.credential-island-consumer.result }}
          BUILDCHAIN_CREDENTIAL_PAYLOAD_ROOT: .buildchain/self-dogfood/credential-payload
          BUILDCHAIN_CREDENTIAL_MANIFEST_ROOT: .buildchain/self-dogfood/credential-manifest
          BUILDCHAIN_EXPECTED_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_EXPECTED_SOURCE_SHA: ${{ needs.credential-island-consumer.outputs.publish-source-sha }}
          BUILDCHAIN_EXPECTED_RUNTIME_SHA: ${{ needs.credential-island-consumer.outputs.buildchain-runtime-sha }}
          BUILDCHAIN_EXPECTED_ARTIFACT_NAME: ${{ needs.credential-island-consumer.outputs.credential-island-macos-artifact }}
          BUILDCHAIN_EXPECTED_MANIFEST_ARTIFACT_NAME: ${{ needs.credential-island-consumer.outputs.credential-island-macos-manifest-artifact }}
          BUILDCHAIN_SELF_DOGFOOD_OUTPUT: .buildchain/self-dogfood/credential-island.json

      - name: Upload self-dogfood evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-v3-alpha-self-dogfood-evidence
          path: .buildchain/self-dogfood/*.json
          if-no-files-found: error
          retention-days: 14
