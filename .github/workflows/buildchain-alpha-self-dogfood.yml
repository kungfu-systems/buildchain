name: Buildchain Alpha Self-Dogfood

run-name: Buildchain v3-alpha self-dogfood

on:
  workflow_run:
    workflows: ["Buildchain Ref Promotion"]
    types: [completed]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

concurrency:
  group: buildchain-release-promotion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  alpha-consumer:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v3-alpha
    permissions:
      actions: read
      contents: read
      issues: write
      id-token: write
    with:
      buildchain-channel: auto
      working-directory: fixtures/libnode-shaped
      buildchain-contract-drift-issue-mode: "off"
      runner-preset: custom
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","runner":"[\"ubuntu-24.04\"]"}]
      artifact-name: buildchain-v3-alpha-self-dogfood
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: fixtures/libnode-shaped/dist
      require-install: true
      require-verify: true
      artifact-retention-days: 7

  stable-consumer:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v3-alpha
    permissions:
      actions: read
      contents: read
      issues: write
      id-token: write
    with:
      buildchain-channel: stable
      working-directory: fixtures/libnode-shaped
      buildchain-contract-drift-issue-mode: "off"
      runner-preset: custom
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","runner":"[\"ubuntu-24.04\"]"}]
      artifact-name: buildchain-v3-stable-self-dogfood
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: fixtures/libnode-shaped/dist
      require-install: true
      require-verify: true
      artifact-retention-days: 7

  next-development-fault:
    name: Checkpoint post-Alpha fault
    needs: alpha-consumer
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Install exact self-dogfood runtime dependencies
        run: corepack pnpm@11.7.0 install --frozen-lockfile

      - name: Inject fault after durable materialization
        run: >-
          node scripts/next-development-self-dogfood.mjs checkpoint
          --repository "${{ github.repository }}"
          --runtime-ref "${{ needs.alpha-consumer.outputs.buildchain-runtime-ref }}"
          --runtime-sha "${{ needs.alpha-consumer.outputs.buildchain-runtime-sha }}"
          --contract-root "${{ needs.alpha-consumer.outputs.buildchain-contract-digest }}"
          --runner-id "${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}"
          --output .buildchain/next-development/checkpoint.json

      - name: Retain durable post-Alpha checkpoint
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-v3-next-development-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: .buildchain/next-development/checkpoint.json
          if-no-files-found: error
          retention-days: 14

  next-development-resume:
    name: Resume post-Alpha work on fresh runner
    needs: next-development-fault
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      transaction-root: ${{ steps.resume.outputs.transaction-root }}
      protected-dev-readback-root: ${{ steps.resume.outputs.protected-dev-readback-root }}
      evidence-root: ${{ steps.resume.outputs.evidence-root }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Install exact self-dogfood runtime dependencies
        run: corepack pnpm@11.7.0 install --frozen-lockfile

      - name: Restore durable post-Alpha checkpoint
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-v3-next-development-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: .buildchain/next-development

      - name: Resume both legal version models
        id: resume
        run: >-
          node scripts/next-development-self-dogfood.mjs resume
          --input .buildchain/next-development/checkpoint.json
          --runner-id "${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}"
          --output .buildchain/next-development/evidence.json

      - name: Retain fresh-runner recovery evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-v3-next-development-self-dogfood-${{ github.run_id }}-${{ github.run_attempt }}
          path: .buildchain/next-development/evidence.json
          if-no-files-found: error
          retention-days: 14

  verify-floating-refs:
    name: Verify floating refs
    needs:
      - alpha-consumer
      - stable-consumer
      - next-development-resume
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Install exact self-dogfood runtime dependencies
        run: corepack pnpm@11.7.0 install --frozen-lockfile

      - name: Download fresh-runner recovery evidence
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-v3-next-development-self-dogfood-${{ github.run_id }}-${{ github.run_attempt }}
          path: .buildchain/next-development

      - name: Read exact hosted refs and protected Dev state
        uses: actions/github-script@v8
        env:
          ALPHA_RUNTIME_REF: ${{ needs.alpha-consumer.outputs.buildchain-runtime-ref }}
          ALPHA_RUNTIME_SHA: ${{ needs.alpha-consumer.outputs.buildchain-runtime-sha }}
          ALPHA_RUNTIME_CLASS: ${{ needs.alpha-consumer.outputs.buildchain-runtime-class }}
          STABLE_RUNTIME_REF: ${{ needs.stable-consumer.outputs.buildchain-runtime-ref }}
          STABLE_RUNTIME_SHA: ${{ needs.stable-consumer.outputs.buildchain-runtime-sha }}
          STABLE_RUNTIME_CLASS: ${{ needs.stable-consumer.outputs.buildchain-runtime-class }}
        with:
          script: |
            const fs = require("node:fs");
            const alphaRef = "v3-alpha";
            const stableRef = "v3";
            const resolveTag = async (tag) => {
              const response = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              return response.data.object.sha;
            };
            const expectedAlphaSha = await resolveTag(alphaRef);
            const expectedStableSha = await resolveTag(stableRef);
            const protectedDevBranch = "dev/v3/v3.0";
            const protectedDevRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${protectedDevBranch}`,
            });
            const protectedDevSha = protectedDevRef.data.object.sha;
            const protectedDevCommit = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: protectedDevSha,
            });
            const protectedDevTreeSha = protectedDevCommit.data.tree.sha;
            const protectedVersionPaths = [
              ".buildchain/release-impact.json",
              "dist/site/buildchain-contract.json",
              "package.json",
            ];
            const protectedVersionRoots = await Promise.all(
              protectedVersionPaths.map(async (path) => {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: protectedDevSha,
                });
                if (Array.isArray(response.data) || response.data.type !== "file") {
                  throw new Error(`protected Dev path is not an exact file: ${path}`);
                }
                return { path, gitBlobSha: response.data.sha };
              }),
            );
            const protectedDevReadback = {
              repository: context.repo.owner + "/" + context.repo.repo,
              branch: protectedDevBranch,
              commitSha: protectedDevSha,
              treeSha: protectedDevTreeSha,
              versionRoots: protectedVersionRoots,
            };
            const observed = {
              alpha: {
                ref: process.env.ALPHA_RUNTIME_REF,
                sha: process.env.ALPHA_RUNTIME_SHA,
                class: process.env.ALPHA_RUNTIME_CLASS,
                expectedSha: expectedAlphaSha,
              },
              stable: {
                ref: process.env.STABLE_RUNTIME_REF,
                sha: process.env.STABLE_RUNTIME_SHA,
                class: process.env.STABLE_RUNTIME_CLASS,
                expectedSha: expectedStableSha,
              },
            };
            const observation = {
              repository: context.repo.owner + "/" + context.repo.repo,
              callerSha: context.sha,
              checkedAt: new Date().toISOString(),
              observed,
              protectedDevReadback,
            };
            fs.mkdirSync(".buildchain/self-dogfood", { recursive: true });
            fs.writeFileSync(
              ".buildchain/self-dogfood/hosted-observation.json",
              JSON.stringify(observation, null, 2) + "\n",
            );

      - name: Root hosted observation with controller evidence
        run: >-
          node scripts/next-development-self-dogfood.mjs attest-hosted
          --input .buildchain/next-development/evidence.json
          --observation .buildchain/self-dogfood/hosted-observation.json
          --output .buildchain/self-dogfood/evidence.json

      - name: Verify complete rooted self-dogfood evidence
        run: >-
          node scripts/next-development-self-dogfood.mjs verify-hosted
          --input .buildchain/self-dogfood/evidence.json

      - name: Upload self-dogfood evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-v3-alpha-self-dogfood-evidence
          path: .buildchain/self-dogfood/evidence.json
          if-no-files-found: error
          retention-days: 14
