name: Buildchain Ref Promotion Recovery
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact protected v4 channel commit that owns the recovery"
        required: true
      target-ref:
        description: "Exact protected v4 alpha or stable channel branch"
        required: true
        default: "alpha/v4/v4.0"
      dry-run:
        description: "Only print planned publication changes"
        required: true
        default: true
        type: boolean
      resume-candidate-repository:
        description: "Repository that owns the sealed candidate run; empty rematerializes a fresh candidate"
      resume-candidate-run-id:
        description: "Exact successful Build Surface Fixture run ID; empty rematerializes a fresh candidate"
      resume-expected-source-tree:
        description: "Exact Git tree recorded for the sealed candidate"
      resume-expected-candidate-root:
        { description: "Optional exact candidate root" }
      resume-expected-candidate-runtime-sha:
        description: "Exact Buildchain runtime SHA recorded by the candidate"
      resume-buildchain-runtime-ref:
        description: "Approved v4 channel, train, or authority ref containing the fresh recovery runtime"
        required: true
      resume-buildchain-runtime-sha:
        description: "Exact commit resolved from the fresh recovery runtime ref"
        required: true
      resume-transaction-id:
        description: "Exact durable publication transaction identity; required only when resuming a sealed candidate"
      release-passport-v4-runtime-resume-evidence-json:
        description: "Optional precomputed runtime A+B Stage Capsule resume evidence JSON"
permissions:
  contents: read
jobs:
  resume:
    name: Adapt recovery inputs into the canonical v4 publisher
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@v4-alpha
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      buildchain-repository: kungfu-systems/buildchain
      buildchain-ref: ${{ inputs['resume-buildchain-runtime-ref'] }}
      buildchain-channel: auto
      buildchain-contract-lock-path: ${{ startsWith(inputs['target-ref'], 'alpha/') && '.buildchain/alpha-contract-lock.json' || '.buildchain/contract-lock.json' }}
      target-ref: ${{ inputs['target-ref'] }}
      target-sha: ${{ inputs.sha }}
      package-manager: pnpm
      artifact-name: libnode-shaped
      release-candidate-workflow-file: build-surface-fixture.yml
      release-candidate-workflow-name: Build Surface Fixture
      resume-candidate-repository: ${{ inputs['resume-candidate-repository'] }}
      resume-candidate-run-id: ${{ inputs['resume-candidate-run-id'] }}
      resume-expected-workflow-file: build-surface-fixture.yml
      resume-expected-workflow-name: Build Surface Fixture
      resume-expected-source-tree: ${{ inputs['resume-expected-source-tree'] }}
      resume-expected-candidate-root: ${{ inputs['resume-expected-candidate-root'] }}
      resume-expected-candidate-runtime-sha: ${{ inputs['resume-expected-candidate-runtime-sha'] }}
      resume-buildchain-runtime-sha: ${{ inputs['resume-buildchain-runtime-sha'] }}
      resume-transaction-id: ${{ inputs['resume-transaction-id'] }}
      release-passport-v4-runtime-resume-evidence-json: ${{ inputs['release-passport-v4-runtime-resume-evidence-json'] }}
      github-release: true
      declarative-release-tail: true
      publish-rematerialize-on-resume: true
      publish-transaction-override: true
      required-status-check: check
      trusted-publishing: true
      release-passport: true
      release-passport-product-name: Buildchain
      release-passport-buildchain-self-kfd: true
      publication-auto-admission: true
      publication-auto-no-gate: true
      publication-publisher-workflow-path: .github/workflows/buildchain-ref-promotion-recovery.yml
      publication-authority-workflow-path: .github/workflows/.release-candidate-promote.yml
      publication-product: Buildchain
      publication-target: npm:@kungfu-tech/buildchain
      publication-package-name: "@kungfu-tech/buildchain"
      dry-run: ${{ inputs['dry-run'] }}
