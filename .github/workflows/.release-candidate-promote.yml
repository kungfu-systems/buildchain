        value: ${{ jobs.controller-plan.outputs.controller-plan-digest }}
      publication-capability-digest:
        description: "Sealed publication capability receipt digest"
        value: ${{ jobs.publication-authority.outputs.capability-digest }}
      github-artifact-attestation-id:
        description: "GitHub keyless attestation id for the declared Linux release artifact"
        value: ${{ jobs.github-artifact-attestation.outputs.attestation-id }}
      github-artifact-attestation-url:
        description: "GitHub keyless attestation URL"
        value: ${{ jobs.github-artifact-attestation.outputs.attestation-url }}
      github-artifact-attestation-evidence-root:
        description: "Verified Buildchain attestation evidence root published with the GitHub Release"
        value: ${{ jobs.publish-github-artifact-attestation-evidence.outputs.evidence-root }}
      github-artifact-attestation-publication-receipt-digest:
        description: "Read-back verified GitHub Release evidence publication receipt digest"
        value: ${{ jobs.publish-github-artifact-attestation-evidence.outputs.publication-receipt-digest }}
      release-tail-declaration-root:
        description: "Root of the declarative release-tail contract"
        value: ${{ jobs.promote.outputs.release-tail-declaration-root }}
      release-tail-transaction-state:
        description: "Final declarative release-tail transaction state"
        value: ${{ jobs.promote.outputs.release-tail-transaction-state }}
      release-tail-transaction-root:
        description: "Stable declarative release-tail transaction root"
        value: ${{ jobs.promote.outputs.release-tail-transaction-root }}
      release-tail-state-root:
        description: "Root of the final declarative release-tail transaction state"
        value: ${{ jobs.promote.outputs.release-tail-state-root }}
      release-tail-receipt-roots-json:
        description: "JSON array of standardized declarative release-tail receipt roots"
        value: ${{ jobs.promote.outputs.release-tail-receipt-roots-json }}
      controller-receipt-artifact:
        description: "Controller receipt artifact name"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-artifact }}
      controller-receipt-json:
        description: "Compact controller receipt JSON"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-json }}
      controller-receipt-digest:
        description: "Controller receipt digest"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-digest }}
      controller-receipt-status:
        description: "Controller receipt status"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-status }}

concurrency:
  group: buildchain-release-promotion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Revalidate promotion intent
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      action: ${{ steps.intent.outputs.action }}
      reason: ${{ steps.intent.outputs.reason }}
      channel: ${{ steps.intent.outputs.channel }}
      target-ref: ${{ steps.intent.outputs.target-ref }}
      requested-sha: ${{ steps.intent.outputs.requested-sha }}
      current-sha: ${{ steps.intent.outputs.current-sha }}
      comparison-status: ${{ steps.intent.outputs.comparison-status }}
    steps:
      - name: Validate GitHub artifact attestation topology
        if: ${{ inputs.github-artifact-attestation-policy-json != '' }}
        env:
          RELEASE_PASSPORT: ${{ inputs.release-passport }}
          GITHUB_RELEASE: ${{ inputs.github-release }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_PASSPORT" != "true" ] || [ "$GITHUB_RELEASE" != "true" ]; then
            echo "::error::GitHub artifact attestation requires release-passport=true and github-release=true"
            exit 1
          fi

      - name: Revalidate queued promotion intent
        id: intent
        uses: actions/github-script@v8
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_TARGET_REF: ${{ inputs.target-ref }}
          INPUT_TARGET_SHA: ${{ inputs.target-sha }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          INPUT_PUBLISH_TRANSACTION_OVERRIDE: ${{ inputs.publish-transaction-override }}
        with:
          script: |
            const targetRef = (process.env.INPUT_TARGET_REF || context.ref.replace(/^refs\/heads\//, ""))
              .replace(/^refs\/heads\//, "");
            const requestedSha = process.env.INPUT_TARGET_SHA || context.sha;
            if (!/^[0-9a-f]{40}$/i.test(requestedSha)) {
              throw new Error(`promotion target SHA must be a 40-character Git SHA, got '${requestedSha}'`);
            }
            let derivedChannel = "";
            if (/^alpha\/v\d+\/v\d+\.\d+$/.test(targetRef)) derivedChannel = "alpha";
            if (/^release\/v\d+\/v\d+\.\d+$/.test(targetRef)) derivedChannel = "release";
            if (targetRef === "publish-gate/major" || targetRef === "major-gate") derivedChannel = "major";
            if (!derivedChannel) {
              throw new Error(`unsupported promote target ref: ${targetRef}`);
            }
            const channel = process.env.INPUT_CHANNEL || derivedChannel;
            if (channel !== derivedChannel) {
              throw new Error(`promotion channel ${channel} does not match target ref ${targetRef} (${derivedChannel})`);
            }
            const current = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${targetRef}`,
            });
            const currentSha = current.data.object.sha;
            const dryRun = process.env.INPUT_DRY_RUN === "true";
            const durableRecovery = process.env.INPUT_PUBLISH_TRANSACTION_OVERRIDE === "true";
            let comparisonStatus = "identical";
            if (currentSha !== requestedSha) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${requestedSha}...${currentSha}`,
              });
              comparisonStatus = comparison.data.status;
            }
            const recoverableAdvance = durableRecovery && comparisonStatus === "ahead";
            const superseded = !dryRun && !recoverableAdvance && comparisonStatus === "ahead";
            if (!dryRun && currentSha !== requestedSha && !superseded && !recoverableAdvance) {
              throw new Error(
                `promotion target ${targetRef} moved incompatibly: requested ${requestedSha}, current ${currentSha}, comparison ${comparisonStatus}`,
              );
            }
            const action = superseded ? "noop" : "promote";
            const reason = superseded ? "target-ref-advanced" : recoverableAdvance ? "durable-transaction-recovery" : "target-ref-current";
            core.setOutput("action", action);
            core.setOutput("reason", reason);
            core.setOutput("channel", channel);
            core.setOutput("target-ref", targetRef);
            core.setOutput("requested-sha", requestedSha);
            core.setOutput("current-sha", currentSha);
            core.setOutput("comparison-status", comparisonStatus);

            if (superseded) {
              core.notice(`Promotion intent is superseded: ${targetRef} is ${currentSha}, requested ${requestedSha}.`);
            }
            await core.summary
              .addHeading("Buildchain promotion intent")
              .addRaw(`- Action: \`${action}\`\n`)
              .addRaw(`- Reason: \`${reason}\`\n`)
              .addRaw(`- Channel: \`${channel}\`\n`)
              .addRaw(`- Target ref: \`${targetRef}\`\n`)
              .addRaw(`- Requested SHA: \`${requestedSha}\`\n`)
              .addRaw(`- Current SHA: \`${currentSha}\`\n`)
              .addRaw(`- Comparison: \`${comparisonStatus}\`\n`)
              .write();

  controller-plan:
    name: Plan release-candidate promotion controller
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      controller-plan-artifact: buildchain-release-promotion-controller-plan-${{ needs.preflight.outputs.requested-sha }}
      controller-plan-json: ${{ steps.controller-plan.outputs.controller-plan-json }}
      controller-plan-digest: ${{ steps.controller-plan.outputs.controller-plan-digest }}
      runtime-sha: ${{ steps.controller-runtime.outputs.sha }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v3' }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Checkout selected promotion workflow shell
        if: ${{ inputs.promotion-shell-ref != '' }}
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.promotion-shell-sha }}
          path: .buildchain/promotion-shell
          persist-credentials: false

      - name: Checkout promotion router
        if: ${{ inputs.promotion-router-ref != '' }}
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.promotion-router-sha }}
          path: .buildchain/promotion-router
          persist-credentials: false

      - name: Checkout promotion source for contract-lock binding
        if: ${{ inputs.promotion-contract-lock-path != '' }}
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.requested-sha }}
          path: .buildchain/promotion-source
          persist-credentials: false

      - name: Resolve controller runtime identity
        id: controller-runtime
        shell: bash
        run: |
          runtime_sha="$(git -C .buildchain/runtime rev-parse HEAD)"
          contract_digest="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(".buildchain/runtime/dist/site/buildchain-contract.json","utf8")); process.stdout.write(value.contractDigest)')"
          {
            echo "sha=${runtime_sha}"
            echo "contract-digest=${contract_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify promotion router binding
        if: ${{ inputs.promotion-router-ref != '' || inputs.promotion-shell-ref != '' || inputs.promotion-runtime-ref != '' }}
        shell: bash
        env:
          ROUTER_REF: ${{ inputs.promotion-router-ref }}
          ROUTER_SHA: ${{ inputs.promotion-router-sha }}
          SHELL_REF: ${{ inputs.promotion-shell-ref }}
          SHELL_SHA: ${{ inputs.promotion-shell-sha }}
          RUNTIME_REF: ${{ inputs.promotion-runtime-ref }}
          RUNTIME_SHA: ${{ inputs.promotion-runtime-sha }}
          LOCK_PATH: ${{ inputs.promotion-contract-lock-path }}
          LOCK_DIGEST: ${{ inputs.promotion-contract-lock-digest }}
          PUBLICATION_CHANNEL: ${{ inputs.promotion-publication-channel }}
          ROUTED_TARGET_REF: ${{ inputs.promotion-target-ref }}
          ACTUAL_RUNTIME_SHA: ${{ inputs.buildchain-ref || 'v3' }}
          ACTUAL_LOCK_PATH: ${{ inputs.buildchain-contract-lock-path }}
          ACTUAL_CHANNEL: ${{ needs.preflight.outputs.channel }}
          ACTUAL_TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
          CALLED_WORKFLOW_REF: ${{ job.workflow_ref }}
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: bash .buildchain/promotion-shell/scripts/verify-promotion-router-binding.sh

      - name: Create release-candidate-promotion controller plan
        id: controller-plan
        run: node .buildchain/runtime/scripts/controller-evidence.mjs --mode plan
        env:
          BUILDCHAIN_CONTROLLER_ID: release-candidate-promotion
          BUILDCHAIN_CONTROLLER_SOURCE_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_CONTROLLER_SOURCE_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_CONTROLLER_RUNTIME_REF: ${{ inputs.promotion-runtime-ref || inputs.buildchain-ref || 'v3' }}
          BUILDCHAIN_CONTROLLER_RUNTIME_SHA: ${{ steps.controller-runtime.outputs.sha }}
          BUILDCHAIN_CONTROLLER_CONTRACT_DIGEST: ${{ steps.controller-runtime.outputs.contract-digest }}
          BUILDCHAIN_CONTROLLER_INPUTS_JSON: ${{ toJSON(inputs) }}
          BUILDCHAIN_CONTROLLER_INPUT_BOUNDARY: workflow-call
          BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json

      - name: Upload release-candidate-promotion controller plan
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-release-promotion-controller-plan-${{ needs.preflight.outputs.requested-sha }}
          path: .buildchain/controller/plan.json
          if-no-files-found: error

  release-candidate-preflight:
    name: Preflight PR-stage release candidate evidence
    needs: [preflight, controller-plan]
    if: ${{ needs.preflight.outputs.action == 'promote' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      evidence-run-id: ${{ steps.release-candidate.outputs.release-candidate-run-id }}
      source-sha: ${{ steps.release-candidate.outputs.release-candidate-source-sha }}
      version: ${{ steps.release-candidate.outputs.release-candidate-version }}
      passport-artifact: ${{ steps.release-candidate.outputs.release-candidate-artifact }}
      summary-artifact: ${{ steps.release-candidate.outputs.release-candidate-build-summary-artifact }}
      manifest-pattern: ${{ inputs.artifact-name }}-manifest-*-${{ steps.release-candidate.outputs.release-candidate-source-sha }}
      payload-pattern: ${{ inputs.artifact-name }}-*
    steps:
      - name: Checkout Buildchain release-candidate resolver
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v3' }}
          path: .buildchain/runtime
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Preflight PR-stage release candidate evidence
        id: release-candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${BUILDCHAIN_RESUME_CANDIDATE_RUN_ID}" ]; then
            if [ "${BUILDCHAIN_RESUME_RUNTIME_SHA}" != "${BUILDCHAIN_CURRENT_RUNTIME_SHA}" ]; then
              echo "::error::resume-buildchain-runtime-sha must equal the checked-out Buildchain runtime ${BUILDCHAIN_CURRENT_RUNTIME_SHA}"
              exit 1
            fi
            node .buildchain/runtime/scripts/resume-from-candidate-run.mjs
          else
            node .buildchain/runtime/scripts/release-candidate-resolver.mjs
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_SOURCE_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_TARGET_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
          BUILDCHAIN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILDCHAIN_ARTIFACT_PATTERNS: ${{ inputs.artifact-patterns }}
          BUILDCHAIN_RC_WORKFLOW_FILE: ${{ inputs.release-candidate-workflow-file }}
          BUILDCHAIN_RC_WORKFLOW_NAME: ${{ inputs.release-candidate-workflow-name }}
          BUILDCHAIN_RC_WAIT_SECONDS: ${{ inputs.release-candidate-wait-seconds }}
          BUILDCHAIN_REQUIRED_ARTIFACT_COUNT: ${{ inputs.required-artifact-count }}
          BUILDCHAIN_PUBLISH_ARTIFACT_KIND: ${{ inputs.publish-artifact-kind }}
          BUILDCHAIN_PUBLISH_PACKAGE_MAIN: ${{ inputs.publish-package-main }}
          BUILDCHAIN_RC_DOWNLOAD: "false"
          BUILDCHAIN_RC_OUTPUT_DIR: .buildchain/release-candidate-preflight
          BUILDCHAIN_RESUME_CANDIDATE_REPOSITORY: ${{ inputs.resume-candidate-repository }}
          BUILDCHAIN_RESUME_CANDIDATE_RUN_ID: ${{ inputs.resume-candidate-run-id }}
          BUILDCHAIN_RESUME_EXPECTED_WORKFLOW_FILE: ${{ inputs.resume-expected-workflow-file || inputs.release-candidate-workflow-file }}
          BUILDCHAIN_RESUME_EXPECTED_WORKFLOW_NAME: ${{ inputs.resume-expected-workflow-name || inputs.release-candidate-workflow-name }}
          BUILDCHAIN_RESUME_CHANNEL: ${{ needs.preflight.outputs.channel }}
          BUILDCHAIN_RESUME_TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
          BUILDCHAIN_RESUME_TARGET_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_RESUME_EXPECTED_SOURCE_TREE: ${{ inputs.resume-expected-source-tree }}
          BUILDCHAIN_RESUME_EXPECTED_CANDIDATE_ROOT: ${{ inputs.resume-expected-candidate-root }}
          BUILDCHAIN_RESUME_EXPECTED_CANDIDATE_RUNTIME_SHA: ${{ inputs.resume-expected-candidate-runtime-sha }}
          BUILDCHAIN_RESUME_RUNTIME_SHA: ${{ inputs.resume-buildchain-runtime-sha }}
          BUILDCHAIN_CURRENT_RUNTIME_SHA: ${{ needs.controller-plan.outputs.runtime-sha }}
          BUILDCHAIN_RESUME_TRANSACTION_ID: ${{ inputs.resume-transaction-id }}

  publication-plan:
    name: Plan exact publication version
    needs: [preflight, controller-plan, release-candidate-preflight]
    if: ${{ needs.preflight.outputs.action == 'promote' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.planned-publication-version || steps.recovery-plan.outputs.planned-publication-version }}
      exact-tag: ${{ steps.plan.outputs.planned-publication-exact-tag || steps.recovery-plan.outputs.planned-publication-exact-tag }}
      release-candidate-version: ${{ steps.plan.outputs.planned-release-candidate-version || steps.recovery-plan.outputs.planned-release-candidate-version }}
    steps:
      - name: Checkout promotion channel commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.requested-sha }}
          clean: true
          persist-credentials: false

      - name: Checkout exact Buildchain planner runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v3' }}
          path: .buildchain/runtime
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Validate consumer package manager contract
        if: ${{ inputs.resume-candidate-run-id == '' }}
        run: node .buildchain/runtime/scripts/validate-package-manager-contract.mjs
        env:
          BUILDCHAIN_EXPECTED_PACKAGE_MANAGER: ${{ inputs.package-manager }}

      - name: Install exact publication planning dependencies
        if: ${{ inputs.resume-candidate-run-id == '' }}
        shell: bash
        run: |
          case "${PACKAGE_MANAGER}" in
            pnpm)
              corepack enable
              corepack pnpm --version
              corepack pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable yarn
              yarn install --immutable || yarn install --frozen-lockfile
              ;;
            npm)
              if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                npm ci
              else
                npm install
              fi
              ;;
            custom)
              echo "::notice::Skipping dependency install for custom package manager."
              ;;
            *)
              echo "::error::Unsupported package-manager: ${PACKAGE_MANAGER}"
              exit 1
              ;;
          esac
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}

      - name: Resolve exact publication transaction version
        id: plan
        if: ${{ inputs.resume-candidate-run-id == '' }}
        uses: ./.buildchain/runtime/actions/promote-buildchain-ref
        with:
          token: ${{ github.token }}
          sha: ${{ needs.preflight.outputs.requested-sha }}
          target-ref: ${{ needs.preflight.outputs.target-ref }}
          dry-run: "true"
          require-governance: "false"
          require-version-state: "true"
          allow-repository: ${{ inputs.allow-repository || github.repository }}
          publish-transaction: "true"
          publish-transaction-override: ${{ inputs.publish-transaction-override }}
          release-passport: "false"

      - name: Reuse sealed candidate publication version
        id: recovery-plan
        if: ${{ inputs.resume-candidate-run-id != '' }}
        shell: bash
        env:
          BUILDCHAIN_RECOVERED_VERSION: ${{ needs.release-candidate-preflight.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${BUILDCHAIN_RECOVERED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::recovered candidate did not provide a valid exact publication version: ${BUILDCHAIN_RECOVERED_VERSION:-<empty>}"
            exit 1
          fi
          {
            echo "planned-publication-version=${BUILDCHAIN_RECOVERED_VERSION}"
            echo "planned-publication-exact-tag=v${BUILDCHAIN_RECOVERED_VERSION}"
            echo "planned-release-candidate-version=${BUILDCHAIN_RECOVERED_VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require an exact publication transaction version
        shell: bash
        env:
          BUILDCHAIN_PUBLICATION_VERSION: ${{ steps.plan.outputs.planned-publication-version || steps.recovery-plan.outputs.planned-publication-version }}
          BUILDCHAIN_PUBLICATION_EXACT_TAG: ${{ steps.plan.outputs.planned-publication-exact-tag || steps.recovery-plan.outputs.planned-publication-exact-tag }}
        run: |
          set -euo pipefail
          if [[ -z "$BUILDCHAIN_PUBLICATION_VERSION" || -z "$BUILDCHAIN_PUBLICATION_EXACT_TAG" ]]; then
            echo "::error::publication planning did not produce an exact version and tag"
            exit 1
          fi
          if [[ "v${BUILDCHAIN_PUBLICATION_VERSION}" != "$BUILDCHAIN_PUBLICATION_EXACT_TAG" ]]; then
            echo "::error::publication plan version/tag mismatch: ${BUILDCHAIN_PUBLICATION_VERSION} != ${BUILDCHAIN_PUBLICATION_EXACT_TAG}"
            exit 1
          fi

  publication-authority:
    name: Seal product publication capability
    needs: [preflight, controller-plan, release-candidate-preflight, publication-plan, qualification-plan]
    if: ${{ needs.preflight.outputs.action == 'promote' }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/.publication-authority.yml
    with:
      buildchain-repository: ${{ inputs.buildchain-repository }}
      buildchain-ref: ${{ needs.controller-plan.outputs.runtime-sha }}
      admission-json: ${{ inputs.publication-admission-json }}
      runner-provenance-json: ${{ inputs.publication-runner-provenance-json }}
      control-plane-audit-json: ${{ inputs.publication-control-plane-audit-json }}
      github-governance-receipt-json: ${{ inputs.github-governance-receipt-json }}
      gate-aggregate-json: ${{ inputs.publication-gate-aggregate-json }}
      consumer-gate-command: ${{ inputs.publication-gate-command }}
      consumer-gate-controller-sha: ${{ inputs.publication-gate-controller-sha }}
      consumer-gate-evidence-source-sha: ${{ inputs.resume-candidate-run-id != '' && needs.release-candidate-preflight.outputs.source-sha || '' }}
      consumer-gate-evidence-source-tree: ${{ inputs.resume-candidate-run-id != '' && inputs.resume-expected-source-tree || '' }}
      expected-json: ${{ inputs.publication-expected-json }}
      used-nonces-json: ${{ inputs.publication-used-nonces-json }}
      consumer-qualification-required: ${{ needs.qualification-plan.outputs.required == 'true' }}
      consumer-predicate-id: ${{ needs.qualification-plan.outputs.predicate-id }}
      consumer-predicate-digest: ${{ needs.qualification-plan.outputs.predicate-digest }}
      auto-admission: ${{ inputs.publication-auto-admission }}
      auto-no-gate: ${{ inputs.publication-auto-no-gate }}
      source-sha: ${{ needs.preflight.outputs.requested-sha }}
      target-ref: ${{ needs.preflight.outputs.target-ref }}
      required-status-check: ${{ inputs.required-status-check }}
      publisher-workflow-path: ${{ inputs.publication-publisher-workflow-path }}
      authority-workflow-path: ${{ inputs.publication-authority-workflow-path }}
      product: ${{ inputs.publication-product }}
      publication-target: ${{ inputs.publication-target }}
      publication-version: ${{ needs.publication-plan.outputs.version }}
      package-name: ${{ inputs.publication-package-name }}
      evidence-repository: ${{ github.repository }}
      evidence-run-id: ${{ needs.release-candidate-preflight.outputs.evidence-run-id }}
      evidence-passport-artifact: ${{ needs.release-candidate-preflight.outputs.passport-artifact }}
      evidence-summary-artifact: ${{ needs.release-candidate-preflight.outputs.summary-artifact }}
      evidence-manifest-pattern: ${{ needs.release-candidate-preflight.outputs.manifest-pattern }}
      evidence-payload-pattern: ${{ needs.release-candidate-preflight.outputs.payload-pattern }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  qualification-plan:
    name: Bind consumer publication predicate
    needs: [preflight]
    if: ${{ needs.preflight.outputs.action == 'promote' }}
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      required: ${{ steps.plan.outputs.required }}
      predicate-id: ${{ steps.plan.outputs.predicate-id }}
      predicate-digest: ${{ steps.plan.outputs.predicate-digest }}
      controller-sha: ${{ steps.plan.outputs.controller-sha }}
    steps:
      - name: Seal exact predicate identity
        id: plan
        shell: bash
        env:
          BUILDCHAIN_CONSUMER_PREDICATE_COMMAND: ${{ inputs.publication-consumer-qualification-command }}
          BUILDCHAIN_CONSUMER_QUALIFICATION_CONTROLLER_SHA: ${{ inputs.publication-consumer-qualification-controller-sha }}
          BUILDCHAIN_CONSUMER_GATE_CONTROLLER_SHA: ${{ inputs.publication-gate-controller-sha }}
          BUILDCHAIN_PUBLICATION_SOURCE_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_CONSUMER_PREDICATE_ID: ${{ inputs.publication-consumer-predicate-id }}
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const command = String(process.env.BUILDCHAIN_CONSUMER_PREDICATE_COMMAND || "");
          const explicitControllerSha = String(process.env.BUILDCHAIN_CONSUMER_QUALIFICATION_CONTROLLER_SHA || "").trim();
          const gateControllerSha = String(process.env.BUILDCHAIN_CONSUMER_GATE_CONTROLLER_SHA || "").trim();
          const sourceSha = String(process.env.BUILDCHAIN_PUBLICATION_SOURCE_SHA || "").trim();
          const controllerSha = explicitControllerSha || gateControllerSha || sourceSha;
          const predicateId = String(process.env.BUILDCHAIN_CONSUMER_PREDICATE_ID || "").trim();
          if (command && !predicateId) throw new Error("consumer qualification command requires publication-consumer-predicate-id");
          if (!command && predicateId) throw new Error("consumer predicate id requires publication-consumer-qualification-command");
          if (explicitControllerSha && !command) throw new Error("consumer qualification controller requires publication-consumer-qualification-command");
          if (command && !/^[0-9a-f]{40}$/.test(controllerSha)) throw new Error("consumer qualification command requires an exact controller SHA");
          const output = fs.createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
          output.write(`required=${command ? "true" : "false"}\n`);
          output.write(`predicate-id=${predicateId}\n`);
          output.write(`predicate-digest=${command ? crypto.createHash("sha256").update(`${command}\0${controllerSha}`).digest("hex") : ""}\n`);
          output.write(`controller-sha=${command ? controllerSha : ""}\n`);
          output.end();
          NODE

  publication-qualification:
    name: Run consumer publication predicate
    needs: [preflight, controller-plan, qualification-plan, publication-authority]
    if: ${{ needs.preflight.outputs.action == 'promote' && needs.publication-authority.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      required: ${{ needs.qualification-plan.outputs.required }}
      receipt-json: ${{ steps.result.outputs.receipt-json }}
      receipt-digest: ${{ steps.result.outputs.receipt-digest }}
    steps:
      - name: Checkout exact consumer source
        if: ${{ needs.qualification-plan.outputs.required == 'true' }}
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.qualification-plan.outputs.controller-sha }}
          persist-credentials: false

      - name: Checkout exact Buildchain qualification runtime
        if: ${{ needs.qualification-plan.outputs.required == 'true' }}
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.controller-plan.outputs.runtime-sha }}
          path: .buildchain/qualification-runtime
          persist-credentials: false

      - name: Materialize complete qualification handoff
        if: ${{ needs.qualification-plan.outputs.required == 'true' }}
        shell: bash
        env:
          BUILDCHAIN_PUBLICATION_CAPABILITY_JSON: ${{ needs.publication-authority.outputs.capability-json }}
          BUILDCHAIN_PUBLICATION_GATE_AGGREGATE_JSON: ${{ needs.publication-authority.outputs.gate-aggregate-json }}
        run: |
          set -euo pipefail
          mkdir -p .buildchain/publication-qualification
          printf '%s\n' "$BUILDCHAIN_PUBLICATION_CAPABILITY_JSON" > .buildchain/publication-qualification/capability.json
          printf '%s\n' "$BUILDCHAIN_PUBLICATION_GATE_AGGREGATE_JSON" > .buildchain/publication-qualification/gate-aggregate.json

      - name: Run consumer-owned qualification predicate
        if: ${{ needs.qualification-plan.outputs.required == 'true' }}
        shell: bash
        env:
          BUILDCHAIN_PUBLICATION_CAPABILITY_PATH: .buildchain/publication-qualification/capability.json
          BUILDCHAIN_PUBLICATION_GATE_AGGREGATE_PATH: .buildchain/publication-qualification/gate-aggregate.json
          BUILDCHAIN_PUBLICATION_QUALIFICATION_RESULT_PATH: .buildchain/publication-qualification/consumer-decision.json
          BUILDCHAIN_PUBLICATION_PREDICATE_ID: ${{ needs.qualification-plan.outputs.predicate-id }}
          BUILDCHAIN_PUBLICATION_PREDICATE_DIGEST: ${{ needs.qualification-plan.outputs.predicate-digest }}
        run: ${{ inputs.publication-consumer-qualification-command }}

      - name: Restore sealed handoff before receipt sealing
        if: ${{ needs.qualification-plan.outputs.required == 'true' }}
        shell: bash
        env:
          BUILDCHAIN_PUBLICATION_CAPABILITY_JSON: ${{ needs.publication-authority.outputs.capability-json }}
          BUILDCHAIN_PUBLICATION_GATE_AGGREGATE_JSON: ${{ needs.publication-authority.outputs.gate-aggregate-json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BUILDCHAIN_PUBLICATION_CAPABILITY_JSON" > .buildchain/publication-qualification/capability.json
          printf '%s\n' "$BUILDCHAIN_PUBLICATION_GATE_AGGREGATE_JSON" > .buildchain/publication-qualification/gate-aggregate.json

      - name: Seal deterministic qualification receipt
        if: ${{ needs.qualification-plan.outputs.required == 'true' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { createPublicationQualificationReceipt } from "./.buildchain/qualification-runtime/packages/core/publication-authority.js";
          const read = (file) => JSON.parse(fs.readFileSync(file, "utf8"));
          const receipt = createPublicationQualificationReceipt({
            capability: read(".buildchain/publication-qualification/capability.json"),
            gateAggregate: read(".buildchain/publication-qualification/gate-aggregate.json"),
            consumerDecision: read(".buildchain/publication-qualification/consumer-decision.json"),
          });
          fs.writeFileSync(".buildchain/publication-qualification/receipt.json", `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Export qualification result
        id: result
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = ".buildchain/publication-qualification/receipt.json";
          const receipt = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : null;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `receipt-json=${receipt ? JSON.stringify(receipt) : ""}\nreceipt-digest=${receipt?.receiptDigest || ""}\n`);
          NODE

      - name: Upload consumer qualification evidence
        if: ${{ needs.qualification-plan.outputs.required == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-publication-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .buildchain/publication-qualification/
          if-no-files-found: error

  promote:
    name: Promote release candidate
    needs: [preflight, controller-plan, release-candidate-preflight, publication-plan, publication-authority, publication-qualification]
    if: ${{ needs.preflight.outputs.action == 'promote' && needs.publication-authority.result == 'success' && needs.publication-qualification.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      checks: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    outputs:
      promoted-sha: ${{ needs.preflight.outputs.requested-sha }}
      built-source-sha: ${{ steps.rc.outputs.release-candidate-source-sha }}
      release-candidate-artifact: ${{ steps.rc.outputs.release-candidate-artifact }}
      release-candidate-action: ${{ steps.rc.outputs.release-candidate-action || 'discovered' }}
      release-candidate-recovery-root: ${{ steps.rc.outputs.release-candidate-recovery-root }}
      release-candidate-recovery-receipt-artifact: ${{ steps.recovery-receipt.outputs.artifact-id && format('buildchain-candidate-recovery-{0}-{1}', inputs.resume-candidate-run-id, github.run_id) || '' }}
      release-propagation-work-artifact: ${{ steps.capture-release-propagation.outputs.artifact-name }}
      release-candidate-outcome: ${{ steps.rc.outcome }}
      promotion-outcome: ${{ steps.promote.outcome }}
      finalization-needed: ${{ steps.promote.outputs.finalization-needed }}
      publication-commit-evidence-path: ${{ steps.publication-commit.outputs.evidence-path }}
      publication-commit-evidence-digest: ${{ steps.publication-commit.outputs.evidence-digest }}
      publication-commit-url: ${{ steps.publication-commit.outputs.public-url }}
      publication-commit-payload-root: ${{ steps.publication-commit.outputs.payload-root }}
      github-artifact-attestation-input-artifact: ${{ steps.attestation-input.outputs.input-artifact-name }}
      github-artifact-attestation-policy-json: ${{ steps.attestation-input.outputs.policy-json }}
      github-artifact-attestation-subject-relative-path: ${{ steps.attestation-input.outputs.subject-relative-path }}
      github-artifact-attestation-platform-manifest-relative-path: ${{ steps.attestation-input.outputs.platform-manifest-relative-path }}
      github-artifact-attestation-release-passport-relative-path: ${{ steps.attestation-input.outputs.release-passport-relative-path }}
      github-artifact-attestation-buildchain-ref: ${{ steps.buildchain-runtime.outputs.sha }}
      github-artifact-attestation-signer-ref: ${{ steps.attestation-input.outputs.signer-sha }}
      github-artifact-attestation-source-sha: ${{ steps.attestation-input.outputs.source-sha }}
      github-artifact-attestation-public-release-tag: ${{ steps.promote.outputs.public-release-tag }}
      github-artifact-attestation-github-release-url: ${{ steps.promote.outputs.github-release-url }}
      release-tail-declaration-root: ${{ steps.promote.outputs.release-tail-declaration-root }}
      release-tail-transaction-state: ${{ steps.promote.outputs.release-tail-transaction-state }}
      release-tail-transaction-root: ${{ steps.promote.outputs.release-tail-transaction-root }}
      release-tail-state-root: ${{ steps.promote.outputs.release-tail-state-root }}
      release-tail-receipt-roots-json: ${{ steps.promote.outputs.release-tail-receipt-roots-json }}
    steps:
      - name: Download release-candidate-promotion controller plan
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.controller-plan.outputs.controller-plan-artifact }}
          path: .buildchain/controller

      - name: Checkout promotion channel commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.requested-sha }}
          clean: true
          persist-credentials: false

      - name: Checkout exact consumer publication controller
        if: ${{ inputs.resume-candidate-run-id != '' && inputs.publication-gate-controller-sha != '' }}
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.publication-gate-controller-sha }}
          path: .buildchain/publication-controller
          clean: true
          persist-credentials: false

      - name: Checkout selected promotion workflow shell
        if: ${{ inputs.promotion-shell-ref != '' }}
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.promotion-shell-sha }}
          path: .buildchain/promotion-shell
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Install promotion dependencies
        if: ${{ inputs.resume-candidate-run-id == '' }}
        shell: bash
        run: |
          case "${PACKAGE_MANAGER}" in
            pnpm)
              corepack enable
              corepack pnpm --version
              corepack pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable yarn
              yarn install --immutable || yarn install --frozen-lockfile
              ;;
            npm)
              if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                npm ci
              else
                npm install
              fi
              ;;
            custom)
              echo "::notice::Skipping dependency install for custom package manager."
              ;;
            *)
              echo "::error::Unsupported package-manager: ${PACKAGE_MANAGER}"
              exit 1
              ;;
          esac
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}

      - name: Resolve post-release reconciliation checkout
        id: reconciliation
        if: ${{ needs.preflight.outputs.channel == 'release' }}
        shell: bash
        env:
          BUILDCHAIN_TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
        run: |
          if [[ ! "${BUILDCHAIN_TARGET_REF}" =~ ^release/v[0-9]+/v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release reconciliation requires a release/vN/vN.M target, got ${BUILDCHAIN_TARGET_REF}"
            exit 1
          fi
          echo "ref=${BUILDCHAIN_TARGET_REF/release\//dev/}" >> "${GITHUB_OUTPUT}"
          echo "workspace=.buildchain/reconciliation/dev" >> "${GITHUB_OUTPUT}"

      - name: Checkout current development channel for reconciliation
        if: ${{ steps.reconciliation.outputs.ref != '' }}
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.reconciliation.outputs.ref }}
          path: .buildchain/reconciliation/dev
          clean: true
          persist-credentials: false

      - name: Install reconciliation dependencies
        if: ${{ steps.reconciliation.outputs.workspace != '' && inputs.resume-candidate-run-id == '' }}
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          RECONCILIATION_WORKSPACE: ${{ steps.reconciliation.outputs.workspace }}
        run: |
          case "${PACKAGE_MANAGER}" in
            pnpm)
              (
                cd "${RECONCILIATION_WORKSPACE}"
                corepack pnpm --version
                corepack pnpm install --frozen-lockfile
              )
              ;;
            yarn)
              yarn --cwd "${RECONCILIATION_WORKSPACE}" install --immutable || yarn --cwd "${RECONCILIATION_WORKSPACE}" install --frozen-lockfile
              ;;
            npm)
              if [ -f "${RECONCILIATION_WORKSPACE}/package-lock.json" ] || [ -f "${RECONCILIATION_WORKSPACE}/npm-shrinkwrap.json" ]; then
                npm ci --prefix "${RECONCILIATION_WORKSPACE}"
              else
                npm install --prefix "${RECONCILIATION_WORKSPACE}"
              fi
              ;;
            custom)
              echo "::notice::Skipping reconciliation dependency install for custom package manager."
              ;;
            *)
              echo "::error::Unsupported package-manager: ${PACKAGE_MANAGER}"
              exit 1
              ;;
          esac

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v3' }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Resolve checked out Buildchain runtime
        id: buildchain-runtime
        shell: bash
        run: |
          runtime_ref="${INPUT_PROMOTION_RUNTIME_REF:-${INPUT_BUILDCHAIN_REF:-v3}}"
          runtime_sha="$(git -C .buildchain/runtime rev-parse HEAD)"
          runtime_class="development"
          if [[ "${runtime_ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            runtime_class="exact-sha"
          elif [[ "${runtime_ref}" =~ ^(refs/heads/)?train/v[0-9]+/v[0-9]+\.[0-9]+/.+ ]]; then
            runtime_class="train"
          elif [[ "${runtime_ref}" =~ ^v[0-9]+(\.[0-9]+)?$ || "${runtime_ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            runtime_class="stable"
          elif [[ "${runtime_ref}" =~ ^v[0-9]+(\.[0-9]+)?-alpha$ || "${runtime_ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            runtime_class="alpha"
          fi
          {
            echo "ref=${runtime_ref}"
            echo "sha=${runtime_sha}"
            echo "class=${runtime_class}"
          } >> "${GITHUB_OUTPUT}"
        env:
          INPUT_BUILDCHAIN_REF: ${{ inputs.buildchain-ref }}
          INPUT_PROMOTION_RUNTIME_REF: ${{ inputs.promotion-runtime-ref }}

      - name: Install Buildchain runtime dependencies
        run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts

      - name: Bridge Buildchain self-runtime dependencies
        if: ${{ inputs.resume-candidate-run-id != '' }}
        shell: bash
        run: |
          test ! -e node_modules
          mkdir -p .buildchain/runtime/node_modules/@kungfu-tech
          test ! -e .buildchain/runtime/node_modules/@kungfu-tech/buildchain-alpha
          test ! -e .buildchain/runtime/node_modules/@kungfu-tech/buildchain
          test ! -e .buildchain/runtime/node_modules/@kungfu-tech/kfx
          ln -s ../.. .buildchain/runtime/node_modules/@kungfu-tech/buildchain-alpha
          ln -s ../.. .buildchain/runtime/node_modules/@kungfu-tech/buildchain
          ln -s ../../../../framework/kfx .buildchain/runtime/node_modules/@kungfu-tech/kfx
          ln -s .buildchain/runtime/node_modules node_modules

      - name: Check Buildchain contract lock
        id: contract-lock
        shell: bash
        run: |
          if [ -f .buildchain/runtime/scripts/buildchain-contract-lock.mjs ]; then
            node .buildchain/runtime/scripts/buildchain-contract-lock.mjs check
          else
            {
              echo "contract-lock-status=runtime-contract-unavailable"
              echo "contract-lock-compatible=true"
              echo "contract-lock-drift=false"
              echo "contract-lock-issue-needed=false"
              echo "contract-lock-issue-body-file="
              echo "contract-digest="
              echo "contract-compatibility-digest="
              echo "accepted-contract-digest="
              echo "accepted-buildchain-sha="
              echo "current-buildchain-sha=${BUILDCHAIN_RUNTIME_SHA}"
            } >> "${GITHUB_OUTPUT}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## Buildchain contract lock"
                echo
                echo "- Status: \`runtime-contract-unavailable\`"
                echo "- Runtime ref: \`${BUILDCHAIN_RUNTIME_REF}\`"
                echo "- Runtime SHA: \`${BUILDCHAIN_RUNTIME_SHA}\`"
                echo "- Note: the checked-out Buildchain runtime does not yet ship contract lock support."
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
          fi
        env:
          BUILDCHAIN_CONTRACT_LOCK_PATH: ${{ inputs.buildchain-contract-lock-path }}
          BUILDCHAIN_CONTRACT_COMPATIBILITY_POLICY: ${{ inputs.buildchain-contract-compatibility-policy }}
          BUILDCHAIN_CONTRACT_DRIFT_ISSUE_MODE: ${{ inputs.buildchain-contract-drift-issue-mode }}
          BUILDCHAIN_RUNTIME_ROOT: .buildchain/runtime
          BUILDCHAIN_RUNTIME_REF: ${{ steps.buildchain-runtime.outputs.ref }}
          BUILDCHAIN_RUNTIME_SHA: ${{ steps.buildchain-runtime.outputs.sha }}
          BUILDCHAIN_RUNTIME_CLASS: ${{ steps.buildchain-runtime.outputs.class }}
          BUILDCHAIN_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Report consumer Buildchain contract drift
        if: ${{ always() && steps.contract-lock.outputs.contract-lock-issue-needed == 'true' }}
        uses: ./.buildchain/runtime/actions/report-buildchain-issue
        with:
          token: ${{ github.token }}
          target-repository: ${{ github.repository }}
          title: "[Buildchain contract] ${{ github.repository }} drift on ${{ steps.buildchain-runtime.outputs.ref }}"
          failure-code: buildchain-contract-${{ steps.contract-lock.outputs.contract-lock-status }}
          buildchain-ref: ${{ steps.buildchain-runtime.outputs.ref }}
          buildchain-version: ${{ steps.contract-lock.outputs.contract-digest }}
          consumer-repository: ${{ github.repository }}
          consumer-ref: ${{ github.ref }}
          consumer-sha: ${{ needs.preflight.outputs.requested-sha }}
          workflow: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          summary: "Buildchain floating runtime contract drift: ${{ steps.contract-lock.outputs.contract-lock-status }}"
          body-file: ${{ steps.contract-lock.outputs.contract-lock-issue-body-file }}
          labels: "buildchain-contract-drift"
          comment-cooldown-hours: "24"
          fail-on-error: "false"

      - name: Resolve PR-stage release candidate
        id: rc
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${BUILDCHAIN_RESUME_CANDIDATE_RUN_ID}" ]; then
            if [ "${BUILDCHAIN_RESUME_RUNTIME_SHA}" != "${BUILDCHAIN_CURRENT_RUNTIME_SHA}" ]; then
              echo "::error::resume-buildchain-runtime-sha must equal the checked-out Buildchain runtime ${BUILDCHAIN_CURRENT_RUNTIME_SHA}"
              exit 1
            fi
            node .buildchain/runtime/scripts/resume-from-candidate-run.mjs
          else
            node .buildchain/runtime/scripts/release-candidate-resolver.mjs
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_SOURCE_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_TARGET_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
          BUILDCHAIN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILDCHAIN_ARTIFACT_PATTERNS: ${{ inputs.artifact-patterns }}
          BUILDCHAIN_GITHUB_RELEASE_PAYLOAD_PATTERNS: ${{ inputs.github-release-payload-patterns }}
          BUILDCHAIN_RC_WORKFLOW_FILE: ${{ inputs.release-candidate-workflow-file }}
          BUILDCHAIN_RC_WORKFLOW_NAME: ${{ inputs.release-candidate-workflow-name }}
          BUILDCHAIN_RC_WAIT_SECONDS: ${{ inputs.release-candidate-wait-seconds }}
          BUILDCHAIN_REQUIRED_ARTIFACT_COUNT: ${{ inputs.required-artifact-count }}
          BUILDCHAIN_PUBLISH_ARTIFACT_KIND: ${{ inputs.publish-artifact-kind }}
          BUILDCHAIN_PUBLISH_PACKAGE_MAIN: ${{ inputs.publish-package-main }}
          BUILDCHAIN_RC_OUTPUT_DIR: .buildchain/release-candidate
          BUILDCHAIN_RESUME_CANDIDATE_REPOSITORY: ${{ inputs.resume-candidate-repository }}
          BUILDCHAIN_RESUME_CANDIDATE_RUN_ID: ${{ inputs.resume-candidate-run-id }}
          BUILDCHAIN_RESUME_EXPECTED_WORKFLOW_FILE: ${{ inputs.resume-expected-workflow-file || inputs.release-candidate-workflow-file }}
          BUILDCHAIN_RESUME_EXPECTED_WORKFLOW_NAME: ${{ inputs.resume-expected-workflow-name || inputs.release-candidate-workflow-name }}
          BUILDCHAIN_RESUME_CHANNEL: ${{ needs.preflight.outputs.channel }}
          BUILDCHAIN_RESUME_TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
          BUILDCHAIN_RESUME_TARGET_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_RESUME_EXPECTED_SOURCE_TREE: ${{ inputs.resume-expected-source-tree }}
          BUILDCHAIN_RESUME_EXPECTED_CANDIDATE_ROOT: ${{ inputs.resume-expected-candidate-root }}
          BUILDCHAIN_RESUME_EXPECTED_CANDIDATE_RUNTIME_SHA: ${{ inputs.resume-expected-candidate-runtime-sha }}
          BUILDCHAIN_RESUME_RUNTIME_SHA: ${{ inputs.resume-buildchain-runtime-sha }}
          BUILDCHAIN_CURRENT_RUNTIME_SHA: ${{ steps.buildchain-runtime.outputs.sha }}
          BUILDCHAIN_RESUME_TRANSACTION_ID: ${{ inputs.resume-transaction-id }}

      - name: Stage exact recovery receipt with Release Passport assets
        if: ${{ inputs.resume-candidate-run-id != '' }}
        shell: bash
        env:
          RECOVERY_RECEIPT: ${{ steps.rc.outputs.release-candidate-recovery-receipt-path }}
          RELEASE_PASSPORT_OUTPUT_DIR: ${{ inputs.release-passport-output-dir }}
        run: |
          set -euo pipefail
          test -f "${RECOVERY_RECEIPT}"
          mkdir -p "${RELEASE_PASSPORT_OUTPUT_DIR}"
          cp "${RECOVERY_RECEIPT}" "${RELEASE_PASSPORT_OUTPUT_DIR}/release-candidate-recovery-receipt.json"

      - name: Upload immutable candidate recovery receipt
        id: recovery-receipt
        if: ${{ inputs.resume-candidate-run-id != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-candidate-recovery-${{ inputs.resume-candidate-run-id }}-${{ github.run_id }}
          path: ${{ steps.rc.outputs.release-candidate-recovery-receipt-path }}
          if-no-files-found: error

      - name: Resolve GitHub artifact attestation policy
        id: attestation-policy
        if: ${{ inputs.github-artifact-attestation-policy-json != '' }}
        env:
          REQUESTED_POLICY: ${{ inputs.github-artifact-attestation-policy-json }}
          DISCOVERED_POLICIES: ${{ steps.rc.outputs.release-candidate-github-artifact-attestation-policy-paths }}
          DISCOVERED_POLICY_COUNT: ${{ steps.rc.outputs.release-candidate-github-artifact-attestation-policy-count }}
        shell: bash
        run: |
          set -euo pipefail
          policy="$REQUESTED_POLICY"
          if [ "$policy" = "auto" ]; then
            if [ "$DISCOVERED_POLICY_COUNT" != "1" ]; then
              echo "::error::github-artifact-attestation-policy-json=auto requires exactly one discovered policy, found ${DISCOVERED_POLICY_COUNT:-0}"
              exit 1
            fi
            policy="$DISCOVERED_POLICIES"
          fi
          if [ ! -f "$policy" ]; then
            echo "::error::GitHub artifact attestation policy is not a downloaded release-candidate file: $policy"
            exit 1
          fi
          echo "path=$policy" >> "$GITHUB_OUTPUT"

      - name: Record promotion routing evidence
        id: routing-evidence
        if: ${{ inputs.promotion-router-ref != '' }}
        shell: bash
        env:
          ROUTER_REF: ${{ inputs.promotion-router-ref }}
          ROUTER_SHA: ${{ inputs.promotion-router-sha }}
          SHELL_CHANNEL: ${{ inputs.promotion-publication-channel == 'alpha' && 'alpha' || 'stable' }}
          SHELL_REF: ${{ inputs.promotion-shell-ref }}
          SHELL_SHA: ${{ inputs.promotion-shell-sha }}
          RUNTIME_REF: ${{ inputs.promotion-runtime-ref }}
          RUNTIME_SHA: ${{ inputs.promotion-runtime-sha }}
          LOCK_PATH: ${{ inputs.promotion-contract-lock-path }}
          LOCK_DIGEST: ${{ inputs.promotion-contract-lock-digest }}
          PUBLICATION_CHANNEL: ${{ inputs.promotion-publication-channel }}
          TARGET_REF: ${{ inputs.promotion-target-ref }}
          OVERRIDE_USED: ${{ inputs.promotion-override-used }}
          RELEASE_CANDIDATE_PASSPORT: ${{ steps.rc.outputs.release-candidate-passport-path }}
        run: node .buildchain/promotion-shell/scripts/promotion-routing-evidence.mjs

      - name: Resolve Buildchain stable candidate alpha
        id: buildchain-stable-candidate
        if: ${{ needs.preflight.outputs.channel == 'release' && github.repository == 'kungfu-systems/buildchain' }}
        shell: bash
        env:
          BUILDCHAIN_RELEASE_CANDIDATE_VERSION: ${{ needs.publication-plan.outputs.release-candidate-version }}
          BUILDCHAIN_PUBLICATION_VERSION: ${{ needs.publication-plan.outputs.version }}
        run: |
          version="${BUILDCHAIN_RELEASE_CANDIDATE_VERSION}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "::error::Buildchain stable publication plan must bind an exact alpha candidate version, got ${version:-<empty>}"
            exit 1
          fi
          if [[ "${version%%-alpha.*}" != "${BUILDCHAIN_PUBLICATION_VERSION}" ]]; then
            echo "::error::Buildchain stable candidate ${version} does not match planned publication ${BUILDCHAIN_PUBLICATION_VERSION:-<empty>}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Enforce Buildchain stable release canary gate
        if: >-
          ${{
            needs.preflight.outputs.channel == 'release' &&
            github.repository == 'kungfu-systems/buildchain' &&
            vars.BUILDCHAIN_STABLE_RELEASE_NOW != steps.buildchain-stable-candidate.outputs.version
          }}
        shell: bash
        run: node .buildchain/runtime/scripts/stable-release-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_PROMOTION_CHANNEL: ${{ needs.preflight.outputs.channel }}
          BUILDCHAIN_RELEASE_CANDIDATE_VERSION: ${{ steps.buildchain-stable-candidate.outputs.version }}
          BUILDCHAIN_RELEASE_CANDIDATE_RUN_ID: ${{ steps.rc.outputs.release-candidate-run-id }}
          BUILDCHAIN_RELEASE_CANDIDATE_RUN_URL: ${{ steps.rc.outputs.release-candidate-run-url }}
          BUILDCHAIN_RELEASE_IMPACT: ${{ inputs.release-passport-impact-json }}
          BUILDCHAIN_STABLE_RELEASE_POLICY: .buildchain/stable-release-policy.json
          BUILDCHAIN_STABLE_RELEASE_GATE_OUTPUT: ${{ inputs.release-passport-output-dir }}/stable-release-gate.json

      - name: Record Buildchain immediate stable authority
        if: >-
          ${{
            needs.preflight.outputs.channel == 'release' &&
            github.repository == 'kungfu-systems/buildchain' &&
            vars.BUILDCHAIN_STABLE_RELEASE_NOW == steps.buildchain-stable-candidate.outputs.version
          }}
        shell: bash
        env:
          BUILDCHAIN_STABLE_RELEASE_NOW: ${{ vars.BUILDCHAIN_STABLE_RELEASE_NOW }}
          BUILDCHAIN_STABLE_RELEASE_REASON: ${{ vars.BUILDCHAIN_STABLE_RELEASE_REASON }}
        run: |
          echo "::notice::Immediate stable release authorized for ${BUILDCHAIN_STABLE_RELEASE_NOW}"
          if [ -n "${BUILDCHAIN_STABLE_RELEASE_REASON}" ]; then
            echo "::notice::Authority reason: ${BUILDCHAIN_STABLE_RELEASE_REASON}"
          fi

      - name: Validate final publication commit topology
        if: ${{ inputs.publication-commit-command != '' }}
        shell: bash
        env:
          BUILDCHAIN_GITHUB_RELEASE_ENABLED: ${{ inputs.github-release }}
          BUILDCHAIN_STANDALONE_DISTRIBUTION_ENABLED: ${{ inputs.standalone-binary-distribution }}
          BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE: ${{ inputs.publication-commit-evidence-path }}
        run: |
          set -euo pipefail
          if [ "${BUILDCHAIN_GITHUB_RELEASE_ENABLED}" != "true" ]; then
            echo "::error::publication-commit-command requires github-release=true so public artifacts and passport evidence are durable before authority moves"
            exit 1
          fi
          if [ "${BUILDCHAIN_STANDALONE_DISTRIBUTION_ENABLED}" = "true" ]; then
            echo "::error::publication-commit-command requires standalone-binary-distribution=false so no deferred product mutation can follow the final authority commit"
            exit 1
          fi
          if [[ "${BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE}" != .buildchain/* || "${BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE}" == *".."* ]]; then
            echo "::error::publication-commit-evidence-path must stay under .buildchain/"
            exit 1
          fi

      - name: Ensure publish-gate ref locks promotion commit
        id: publish-gate
        uses: actions/github-script@v8
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
          TARGET_SHA: ${{ needs.preflight.outputs.requested-sha }}
          PUBLICATION_VERSION: ${{ needs.publication-plan.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            const channel = process.env.CHANNEL;
            const targetRef = process.env.TARGET_REF;
            const targetSha = process.env.TARGET_SHA;
            const versionHint = process.env.PUBLICATION_VERSION;
            if (!versionHint) throw new Error("publish-gate lock requires the planned publication version");
            const dryRun = process.env.DRY_RUN === "true";
            const gateRef = channel === "major"
              ? "publish-gate/major"
              : `publish-gate/${channel}/${targetRef.replace(/^(alpha|release)\//, "")}/${versionHint}`;
            const ref = `heads/${gateRef}`;
            if (dryRun) {
              core.notice(`Dry-run would lock ${gateRef} to ${targetSha}`);
            } else {
              try {
                const current = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref });
                if (current.data.object.sha !== targetSha) {
                  await github.rest.git.updateRef({ owner: context.repo.owner, repo: context.repo.repo, ref, sha: targetSha, force: true });
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `refs/${ref}`, sha: targetSha });
              }
            }
            core.setOutput("ref", gateRef);
            core.setOutput("sha", targetSha);
            core.setOutput("locked", "true");

      - name: Validate release activation command chain
        if: ${{ inputs.release-activation-command != '' || inputs.release-passport-evidence-command != '' }}
        env:
          PUBLICATION_COMMIT_COMMAND: ${{ inputs.publication-commit-command }}
          RELEASE_ACTIVATION_COMMAND: ${{ inputs.release-activation-command }}
          RELEASE_EVIDENCE_COMMAND: ${{ inputs.release-passport-evidence-command }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PUBLICATION_COMMIT_COMMAND" ] || [ -z "$RELEASE_ACTIVATION_COMMAND" ] || [ -z "$RELEASE_EVIDENCE_COMMAND" ]; then
            echo "::error::publication commit, release activation, and receipt-only evidence synthesis must be configured together"
            exit 1
          fi

      - name: Promote-only publish
        id: promote
        env:
          BUILDCHAIN_EXPECTED_TRANSACTION_ID: ${{ inputs.resume-transaction-id }}
          BUILDCHAIN_RELEASE_CANDIDATE_RECOVERY_RECEIPT_PATH: ${{ steps.rc.outputs.release-candidate-recovery-receipt-path }}
          BUILDCHAIN_RELEASE_CANDIDATE_PAYLOAD_ROOT: ${{ steps.rc.outputs.release-candidate-payload-dir }}
        uses: ./.buildchain/runtime/actions/promote-buildchain-ref
        with:
          token: ${{ github.token }}
          sha: ${{ needs.preflight.outputs.requested-sha }}
          target-ref: ${{ needs.preflight.outputs.target-ref }}
          dry-run: ${{ inputs.dry-run }}
          require-governance: "true"
          require-version-state: "true"
          reconciliation-workspace: ${{ steps.reconciliation.outputs.workspace }}
          required-status-check: ${{ inputs.required-status-check }}
          generated-status-check-token: ${{ github.token }}
          generated-pull-request-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN || github.token }}
          generated-ref-update-token: ${{ github.token }}
          branch-protection-bypass-apps: ${{ inputs.branch-protection-bypass-apps }}
          branch-protection-bypass-users: ${{ inputs.branch-protection-bypass-users }}
          branch-protection-bypass-teams: ${{ inputs.branch-protection-bypass-teams }}
          allow-repository: ${{ inputs.allow-repository || github.repository }}
          publish-transaction: "true"
          publish-command: ${{ inputs.publish-command }}
          publish-sealed-bundle-root: ${{ steps.rc.outputs.publish-sealed-bundle-root }}
          publish-sealed-bundle-manifest: ${{ steps.rc.outputs.publish-sealed-bundle-manifest }}
          publish-transaction-override: ${{ inputs.publish-transaction-override }}
          publish-rematerialize-on-resume: ${{ inputs.publish-rematerialize-on-resume }}
          publish-required-artifacts-json: ${{ inputs.publish-required-artifacts-json }}
          publish-required-artifacts-path: ${{ inputs.publish-required-artifacts-json == '' && steps.rc.outputs.publish-required-artifacts-path || '' }}
          publish-mode: ${{ inputs.publish-mode }}
          publish-auth: ${{ inputs.trusted-publishing && 'trusted-publishing' || 'npm-token' }}
          publish-dist-tag: ${{ inputs.publish-dist-tag }}
          publish-package-set-order: ${{ inputs.publish-package-set-order }}
          publish-package-main: ${{ inputs.publish-package-main }}
          expected-publication-version: ${{ needs.publication-plan.outputs.version }}
          require-publication-qualification: ${{ needs.publication-qualification.outputs.required }}
          publication-capability-json: ${{ needs.publication-authority.outputs.capability-json }}
          publication-gate-aggregate-json: ${{ needs.publication-authority.outputs.gate-aggregate-json }}
          publication-qualification-receipt-json: ${{ needs.publication-qualification.outputs.receipt-json }}
          publication-used-qualification-nonces-json: ${{ inputs.publication-used-qualification-nonces-json }}
          require-publish-source-lock: "true"
          publish-source-ref: ${{ steps.publish-gate.outputs.ref }}
          publish-source-sha: ${{ steps.publish-gate.outputs.sha }}
          publish-source-locked: ${{ steps.publish-gate.outputs.locked }}
          release-passport: ${{ inputs.release-passport }}
          release-passport-output-dir: ${{ inputs.release-passport-output-dir }}
          release-passport-product-name: ${{ inputs.release-passport-product-name || inputs.artifact-name }}
          release-passport-build-summary-path: ${{ steps.rc.outputs.release-candidate-build-summary-path }}
          release-passport-platform-manifest-paths: ${{ inputs.release-passport-platform-manifest-paths || steps.rc.outputs.release-candidate-platform-manifest-paths }}
          release-passport-impact-json: ${{ inputs.release-passport-impact-json }}
          release-passport-promotion-routing-json: ${{ steps.routing-evidence.outputs.routing-path }}
          release-passport-kfd-1-witness-jsons: ${{ inputs.release-passport-kfd-1-witness-jsons }}
          release-passport-kfd-2-claim-jsons: ${{ inputs.release-passport-kfd-2-claim-jsons }}
          release-passport-kfd-3-prebuild-witness-jsons: ${{ inputs.release-passport-kfd-3-prebuild-witness-jsons }}
          release-passport-kfd-3-artifact-witness-jsons: ${{ inputs.release-passport-kfd-3-artifact-witness-jsons }}
          release-passport-kfd-3-artifact-verify-command: ${{ inputs.release-passport-kfd-3-artifact-verify-command }}
          release-passport-kfd-support-matrix-json: ${{ inputs.release-passport-kfd-support-matrix-json }}
          release-passport-kfd-product-gate-jsons: ${{ inputs.release-passport-kfd-product-gate-jsons }}
          release-passport-invariant-passport-jsons: ${{ inputs.release-passport-invariant-passport-jsons }}
          release-passport-invariant-passport-command: ${{ inputs.release-passport-invariant-passport-command }}
          release-passport-evidence-jsons: ${{ inputs.release-passport-evidence-jsons }}
          release-passport-attachment-command: ${{ inputs.release-passport-attachment-command }}
          release-passport-buildchain-self-kfd: ${{ inputs.release-passport-buildchain-self-kfd }}
          release-passport-github-artifact-attestation-policy-jsons: ${{ steps.attestation-policy.outputs.path }}
          github-release: ${{ inputs.github-release }}
          declarative-release-tail: ${{ inputs.declarative-release-tail }}
          github-release-artifact-paths: ${{ steps.rc.outputs.release-candidate-github-release-artifact-paths }}
          github-release-title: ${{ inputs.github-release-title }}
          github-release-notes: ${{ inputs.github-release-notes }}
          promote-only-release-candidate: "true"
          release-candidate-passport-path: ${{ steps.rc.outputs.release-candidate-passport-path }}
          release-candidate-build-summary-path: ${{ steps.rc.outputs.release-candidate-build-summary-path }}
          release-candidate-version: ${{ steps.rc.outputs.release-candidate-version }}
          release-candidate-family-evidence-required: ${{ inputs.release-candidate-family-evidence-required }}
          release-candidate-family-evidence-root: ${{ inputs.release-candidate-family-evidence-root }}
          release-candidate-family-initiative-id: ${{ inputs.release-candidate-family-initiative-id }}
          release-candidate-family-assignment-id: ${{ inputs.release-candidate-family-assignment-id }}

      - name: Retain declarative release-tail contract and transaction
        if: ${{ always() && inputs.declarative-release-tail && steps.promote.outputs.release-tail-state-path != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-release-tail-${{ needs.preflight.outputs.requested-sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ steps.promote.outputs.release-tail-declaration-path }}
            ${{ steps.promote.outputs.release-tail-state-path }}

      - name: Stage sealed GitHub artifact attestation inputs
        id: attestation-input
        if: ${{ inputs.github-artifact-attestation-policy-json != '' && !inputs.dry-run && steps.promote.outcome == 'success' }}
        env:
          ATTESTATION_POLICY: ${{ steps.attestation-policy.outputs.path }}
          ATTESTATION_SUBJECT_ROOTS: ${{ steps.rc.outputs.release-candidate-payload-dir }}
          ATTESTATION_PLATFORM_MANIFESTS: ${{ inputs.release-passport-platform-manifest-paths || steps.rc.outputs.release-candidate-platform-manifest-paths }}
          ATTESTATION_RELEASE_PASSPORT: ${{ steps.promote.outputs.release-passport-path }}
          ATTESTATION_OUTPUT_DIR: .buildchain/github-artifact-attestation-input
          ATTESTATION_INPUT_ARTIFACT: buildchain-github-attestation-input-${{ needs.preflight.outputs.requested-sha }}
        shell: bash
        run: |
          set -euo pipefail
          node .buildchain/runtime/scripts/stage-github-artifact-attestation-inputs.mjs \
            --policy "$ATTESTATION_POLICY" \
            --subject-roots "$ATTESTATION_SUBJECT_ROOTS" \
            --platform-manifests "$ATTESTATION_PLATFORM_MANIFESTS" \
            --release-passport "$ATTESTATION_RELEASE_PASSPORT" \
            --output-dir "$ATTESTATION_OUTPUT_DIR"
          echo "input-artifact-name=$ATTESTATION_INPUT_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload sealed GitHub artifact attestation inputs
        if: ${{ steps.attestation-input.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.attestation-input.outputs.input-artifact-name }}
          path: ${{ steps.attestation-input.outputs.input-dir }}/
          retention-days: ${{ inputs.github-artifact-attestation-retention-days }}
          if-no-files-found: error

      - name: Dispatch standalone binary distribution for the exact public tag
        if: ${{ inputs.standalone-binary-distribution && !inputs.dry-run && steps.promote.outcome == 'success' && steps.promote.outputs.finalization-needed != 'true' && steps.promote.outputs.public-release-tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.promote.outputs.public-release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]; then
            echo "::error::promotion produced an invalid standalone release tag: $RELEASE_TAG"
            exit 1
          fi
          workflow_probe="${RUNNER_TEMP}/binary-distribution-workflow.txt"
          if ! gh workflow view binary-distribution.yml \
            --repo "${{ github.repository }}" >"$workflow_probe" 2>&1; then
            if grep -q 'HTTP 404' "$workflow_probe"; then
              echo "::notice::Consumer has no binary-distribution.yml; standalone binary dispatch is not applicable."
              exit 0
            fi
            cat "$workflow_probe" >&2
            exit 1
          fi
          gh workflow run binary-distribution.yml \
            --repo "${{ github.repository }}" \
            --ref "$RELEASE_TAG" \
            -f tag="$RELEASE_TAG" \
            -f upload-release=false

      - name: Commit consumer publication authority last
        id: publication-commit
        if: ${{ inputs.publication-commit-command != '' && !inputs.dry-run && steps.promote.outcome == 'success' && steps.promote.outputs.finalization-needed != 'true' }}
        shell: bash
        env:
          BUILDCHAIN_PUBLICATION_COMMIT_COMMAND: ${{ inputs.publication-commit-command }}
          BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE: ${{ inputs.publication-commit-evidence-path }}
          BUILDCHAIN_PUBLICATION_COMMIT_TOKEN: ${{ secrets.BUILDCHAIN_PUBLICATION_COMMIT_TOKEN }}
          BUILDCHAIN_PUBLICATION_COMMIT_SIGNING_KEY: ${{ secrets.BUILDCHAIN_PUBLICATION_COMMIT_SIGNING_KEY }}
          BUILDCHAIN_PUBLICATION_COMMIT_SOURCE_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_PUBLICATION_COMMIT_CANDIDATE_SOURCE_SHA: ${{ steps.rc.outputs.release-candidate-source-sha || needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_PUBLICATION_COMMIT_RELEASE_SHA: ${{ steps.promote.outputs.transaction-release-sha }}
          BUILDCHAIN_PUBLICATION_COMMIT_RELEASE_TAG: ${{ steps.promote.outputs.public-release-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ${{ inputs.standalone-binary-distribution }}; then
            echo "::error::publication-commit-command requires standalone-binary-distribution=false so no deferred product mutation can follow the final authority commit"
            exit 1
          fi
          if [[ "${BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE}" != .buildchain/* || "${BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE}" == *".."* ]]; then
            echo "::error::publication-commit-evidence-path must stay under .buildchain/"
            exit 1
          fi
          if [ -e "${BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE}" ]; then
            echo "::error::refusing stale publication commit evidence at ${BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE}"
            exit 1
          fi
          export BUILDCHAIN_PUBLICATION_COMMIT_VERSION="${BUILDCHAIN_PUBLICATION_COMMIT_RELEASE_TAG#v}"
          export BUILDCHAIN_PUBLICATION_COMMIT_RELEASE_PASSPORT="${{ steps.promote.outputs.release-passport-path }}"
          export BUILDCHAIN_PUBLICATION_COMMIT_PAYLOAD_DIR="${{ steps.rc.outputs.release-candidate-payload-dir }}"
          mkdir -p "$(dirname "${BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE}")"
          bash -euo pipefail -c "${BUILDCHAIN_PUBLICATION_COMMIT_COMMAND}"
          result="$(
            node .buildchain/runtime/scripts/publication-commit-evidence.mjs \
              --evidence "${BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE}" \
              --version "${BUILDCHAIN_PUBLICATION_COMMIT_VERSION}" \
              --source-sha "${BUILDCHAIN_PUBLICATION_COMMIT_SOURCE_SHA}" \
              --candidate-source-sha "${BUILDCHAIN_PUBLICATION_COMMIT_CANDIDATE_SOURCE_SHA}" \
              --release-sha "${BUILDCHAIN_PUBLICATION_COMMIT_RELEASE_SHA}" \
              --release-tag "${BUILDCHAIN_PUBLICATION_COMMIT_RELEASE_TAG}"
          )"
          RESULT="${result}" EVIDENCE_PATH="${BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE}" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const result = JSON.parse(process.env.RESULT);
          const digest = crypto.createHash("sha256")
            .update(fs.readFileSync(process.env.EVIDENCE_PATH))
            .digest("hex");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `evidence-path=${process.env.EVIDENCE_PATH}`,
            `evidence-digest=sha256:${digest}`,
            `public-url=${result.publicUrl}`,
            `payload-root=${result.payloadRoot}`,
            "",
          ].join("\n"));
          NODE

      - name: Complete exact consumer release activation
        id: release-activation
        if: ${{ inputs.release-activation-command != '' && !inputs.dry-run && steps.publication-commit.outcome == 'success' }}
        shell: bash
        env:
          BUILDCHAIN_RELEASE_ACTIVATION_COMMAND: ${{ inputs.release-activation-command }}
          BUILDCHAIN_RELEASE_ACTIVATION_RECEIPTS: ${{ inputs.release-activation-receipt-set-path }}
          BUILDCHAIN_RELEASE_ACTIVATION_TOKEN: ${{ secrets.BUILDCHAIN_PUBLICATION_COMMIT_TOKEN }}
          BUILDCHAIN_RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_RELEASE_TAG: ${{ steps.promote.outputs.public-release-tag }}
          BUILDCHAIN_RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          BUILDCHAIN_RELEASE_PASSPORT: ${{ steps.promote.outputs.release-passport-path }}
          BUILDCHAIN_PUBLISH_EVIDENCE: ${{ steps.promote.outputs.publish-evidence-path }}
          BUILDCHAIN_RELEASE_CANDIDATE_PASSPORT: ${{ steps.rc.outputs.release-candidate-passport-path }}
          BUILDCHAIN_PUBLICATION_COMMIT_EVIDENCE: ${{ steps.publication-commit.outputs.evidence-path }}
          GH_TOKEN: ${{ secrets.BUILDCHAIN_PUBLICATION_COMMIT_TOKEN }}
        run: |
          set -euo pipefail
          receipt_set="${BUILDCHAIN_RELEASE_ACTIVATION_RECEIPTS}"
          if [[ "${receipt_set}" != .buildchain/* || "${receipt_set}" == *".."* ]]; then
            echo "::error::release-activation-receipt-set-path must stay under .buildchain/"
            exit 1
          fi
          if [ -e "${receipt_set}" ]; then
            echo "::error::refusing stale activation receipt set at ${receipt_set}"
            exit 1
          fi
          export BUILDCHAIN_RELEASE_VERSION="${BUILDCHAIN_RELEASE_TAG#v}"
          mkdir -p "$(dirname "${receipt_set}")"
          bash -euo pipefail -c "${BUILDCHAIN_RELEASE_ACTIVATION_COMMAND}"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { validateReleaseActivationReceiptSet } from "./.buildchain/runtime/packages/core/release-activation-transaction.js";
          const receiptSet = JSON.parse(fs.readFileSync(process.env.BUILDCHAIN_RELEASE_ACTIVATION_RECEIPTS, "utf8"));
          const result = validateReleaseActivationReceiptSet(receiptSet, { allowShadow: false });
          if (!result.valid) throw new Error(`activation receipt set is invalid: ${result.issues.join("; ")}`);
          NODE
          echo "receipt-set-path=${receipt_set}" >> "${GITHUB_OUTPUT}"

      - name: Synthesize consumer released evidence from receipts
        id: release-evidence
        if: ${{ inputs.release-passport-evidence-command != '' && !inputs.dry-run && steps.release-activation.outcome == 'success' }}
        shell: bash
        env:
          BUILDCHAIN_RELEASE_ACTIVATION_RECEIPTS: ${{ steps.release-activation.outputs.receipt-set-path }}
          BUILDCHAIN_RELEASE_EVIDENCE_PATH: ${{ inputs.release-passport-evidence-path }}
          BUILDCHAIN_RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_RELEASE_TAG: ${{ steps.promote.outputs.public-release-tag }}
          BUILDCHAIN_RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          set -euo pipefail
          export BUILDCHAIN_RELEASE_VERSION="${BUILDCHAIN_RELEASE_TAG#v}"
          if [[ "${BUILDCHAIN_RELEASE_EVIDENCE_PATH}" != .buildchain/* || "${BUILDCHAIN_RELEASE_EVIDENCE_PATH}" == *".."* ]]; then
            echo "::error::release-passport-evidence-path must stay under .buildchain/"
            exit 1
          fi
          if [ -e "${BUILDCHAIN_RELEASE_EVIDENCE_PATH}" ]; then
            echo "::error::refusing stale released evidence at ${BUILDCHAIN_RELEASE_EVIDENCE_PATH}"
            exit 1
          fi
          mkdir -p "$(dirname "${BUILDCHAIN_RELEASE_EVIDENCE_PATH}")"
          bash -euo pipefail -c "${{ inputs.release-passport-evidence-command }}"
          test -f "${BUILDCHAIN_RELEASE_EVIDENCE_PATH}"
          echo "evidence-path=${BUILDCHAIN_RELEASE_EVIDENCE_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Capture exact package release propagation work
        id: capture-release-propagation
        if: ${{ inputs.release-propagation-config-path != '' && !inputs.dry-run && steps.promote.outcome == 'success' && steps.promote.outputs.finalization-needed != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          output_dir=.buildchain/release-propagation-capture
          mkdir -p "$output_dir"
          node .buildchain/runtime/scripts/capture-package-release-propagation.mjs \
            --repository "${{ github.repository }}" \
            --channel "${{ needs.preflight.outputs.channel }}" \
            --source-sha "${{ steps.promote.outputs.transaction-release-sha }}" \
            --tag "${{ steps.promote.outputs.public-release-tag }}" \
            --config-path "${{ inputs.release-propagation-config-path }}" \
            --release-passport-path "${{ steps.promote.outputs.release-passport-path }}" \
            --output-dir "$output_dir" \
            > "$output_dir/capture-result.json"

      - name: Upload exact package release propagation work
        if: ${{ steps.capture-release-propagation.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.capture-release-propagation.outputs.artifact-name }}
          path: .buildchain/release-propagation-capture/
          if-no-files-found: error

      - name: Bundle release-candidate-promotion controller evidence
        id: controller-evidence
        if: ${{ always() && !inputs.dry-run && steps.promote.outcome == 'success' }}
        shell: bash
        env:
          RELEASE_CANDIDATE_PASSPORT: ${{ steps.routing-evidence.outputs.candidate-passport-path || steps.rc.outputs.release-candidate-passport-path }}
          PUBLISH_EVIDENCE: ${{ steps.promote.outputs.publish-evidence-path }}
          RELEASE_PASSPORT: ${{ steps.promote.outputs.release-passport-path }}
          FINALIZATION_NEEDED: ${{ steps.promote.outputs.finalization-needed }}
          PUBLICATION_COMMIT_ENABLED: ${{ inputs.publication-commit-command != '' }}
          PUBLICATION_COMMIT_EVIDENCE: ${{ steps.publication-commit.outputs.evidence-path }}
          RELEASE_ACTIVATION_RECEIPTS: ${{ steps.release-activation.outputs.receipt-set-path }}
          RELEASED_PRODUCT_EVIDENCE: ${{ steps.release-evidence.outputs.evidence-path }}
          RELEASE_PROPAGATION_CAPTURE: ${{ steps.capture-release-propagation.outcome == 'success' && '.buildchain/release-propagation-capture/capture-result.json' || '' }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const finalizationNeeded = process.env.FINALIZATION_NEEDED === "true";
          const files = [
            [process.env.RELEASE_CANDIDATE_PASSPORT, "release-candidate-passport.json"],
            [process.env.PUBLISH_EVIDENCE, "publish-evidence.json"],
          ];
          if (!finalizationNeeded) {
            files.push([process.env.RELEASE_PASSPORT, "release-passport.json"]);
          }
          if (process.env.PUBLICATION_COMMIT_ENABLED === "true" && !finalizationNeeded) {
            files.push([process.env.PUBLICATION_COMMIT_EVIDENCE, "publication-commit-evidence.json"]);
          }
          if (process.env.RELEASE_ACTIVATION_RECEIPTS && !finalizationNeeded) {
            files.push([process.env.RELEASE_ACTIVATION_RECEIPTS, "release-activation-receipt-set.json"]);
          }
          if (process.env.RELEASED_PRODUCT_EVIDENCE && !finalizationNeeded) {
            files.push([process.env.RELEASED_PRODUCT_EVIDENCE, "released-product-evidence.json"]);
          }
          if (process.env.RELEASE_PROPAGATION_CAPTURE && !finalizationNeeded) {
            files.push([process.env.RELEASE_PROPAGATION_CAPTURE, "release-propagation-capture.json"]);
          }
          fs.mkdirSync(".buildchain/controller/promotion-evidence", { recursive: true });
          for (const [source, name] of files) {
            if (!source || !fs.existsSync(source)) throw new Error(`promotion controller evidence is missing: ${source || name}`);
            fs.copyFileSync(source, path.join(".buildchain/controller/promotion-evidence", name));
          }
          NODE

      - name: Upload release-candidate-promotion controller evidence
        if: ${{ always() && steps.controller-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-release-promotion-controller-evidence-${{ needs.preflight.outputs.requested-sha }}
          path: .buildchain/controller/promotion-evidence/
          if-no-files-found: error

      - name: Classify Buildchain promotion friction
        id: friction
        if: ${{ failure() && !inputs.dry-run && steps.rc.outcome != '' }}
        shell: bash
        run: |
          stable_gate_report="${{ inputs.release-passport-output-dir }}/stable-release-gate.json"
          if [ -f "${stable_gate_report}" ]; then
            deferred="$(node - "${stable_gate_report}" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const deferrable = new Set(["stable.minimum_interval", "stable.canary_soak"]);
          const failedChecks = Array.isArray(report?.summary?.failedChecks)
            ? report.summary.failedChecks
            : [];
          process.stdout.write(
            failedChecks.length > 0 && failedChecks.every((id) => deferrable.has(id))
              ? "true"
              : "false",
          );
          NODE
            )"
            if [ "${deferred}" = "true" ]; then
              echo "report=false" >> "${GITHUB_OUTPUT}"
              echo "::notice::Stable promotion is intentionally deferred by its time gate; skipping workflow-friction reporting."
              exit 0
            fi
          fi
          echo "report=true" >> "${GITHUB_OUTPUT}"
          reporter=".buildchain/runtime/scripts/workflow-friction-report.mjs"
          if [ ! -f "${reporter}" ]; then
            reporter="scripts/workflow-friction-report.mjs"
          fi
          node "${reporter}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_SOURCE_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
          BUILDCHAIN_TARGET_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_WORKFLOW_NAME: ${{ github.workflow }}
          BUILDCHAIN_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILDCHAIN_RC_RESOLVE_OUTCOME: ${{ steps.rc.outcome }}
          BUILDCHAIN_RC_DIAGNOSIS: ${{ steps.rc.outputs.release-candidate-diagnosis }}
          BUILDCHAIN_PROMOTION_OUTCOME: ${{ steps.promote.outcome }}
          BUILDCHAIN_PROMOTION_DIAGNOSIS: ${{ steps.promote.outputs.failure-message }}
          BUILDCHAIN_BUILD_WORKFLOW_FILE: ${{ inputs.release-candidate-workflow-file }}
          BUILDCHAIN_BUILD_WORKFLOW_NAME: ${{ inputs.release-candidate-workflow-name }}

      - name: Resolve Buildchain issue token mode
        id: issue-token-mode
        if: ${{ failure() && steps.friction.outcome == 'success' && steps.friction.outputs.report != 'false' }}
        shell: bash
        run: |
          if [ -n "${DIRECT_TOKEN}" ]; then
            echo "create-app-token=false" >> "${GITHUB_OUTPUT}"
          elif [ -n "${APP_ID}" ] && [ -n "${APP_PRIVATE_KEY}" ]; then
            echo "create-app-token=true" >> "${GITHUB_OUTPUT}"
          else
            echo "create-app-token=false" >> "${GITHUB_OUTPUT}"
          fi
        env:
          DIRECT_TOKEN: ${{ secrets['buildchain-issue-token'] || secrets.BUILDCHAIN_ISSUE_TOKEN }}
          APP_ID: ${{ secrets['buildchain-issue-app-id'] || secrets.BUILDCHAIN_ISSUE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets['buildchain-issue-app-private-key'] || secrets.BUILDCHAIN_ISSUE_APP_PRIVATE_KEY }}

      - name: Create Buildchain issue token
        id: buildchain-issue-app-token
        if: ${{ failure() && steps.issue-token-mode.outputs.create-app-token == 'true' }}
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets['buildchain-issue-app-id'] || secrets.BUILDCHAIN_ISSUE_APP_ID }}
          private-key: ${{ secrets['buildchain-issue-app-private-key'] || secrets.BUILDCHAIN_ISSUE_APP_PRIVATE_KEY }}
          owner: kungfu-systems
          repositories: buildchain

      - name: Report Buildchain promotion friction
        if: ${{ failure() && steps.friction.outcome == 'success' && steps.friction.outputs.report != 'false' }}
        uses: ./.buildchain/runtime/actions/report-buildchain-issue
        with:
          token: ${{ steps.buildchain-issue-app-token.outputs.token || secrets['buildchain-issue-token'] || secrets.BUILDCHAIN_ISSUE_TOKEN || github.token }}
          report-kind: workflow-friction
          target-repository: ${{ inputs.buildchain-repository }}
          repository: ${{ github.repository }}
          workflow: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          channel: ${{ needs.preflight.outputs.target-ref }}
          source-ref: ${{ github.ref_name }}
          source-sha: ${{ needs.preflight.outputs.requested-sha }}
          pull-request: ${{ steps.friction.outputs.pull-request }}
          friction-class: ${{ steps.friction.outputs.friction-class }}
          summary: ${{ steps.friction.outputs.summary }}
          diagnosis: ${{ steps.friction.outputs.diagnosis }}
          next-action: ${{ steps.friction.outputs.next-action }}
          body-file: ${{ steps.friction.outputs.body-file }}
          related-runs-json: ${{ steps.friction.outputs.related-runs-json }}
          heavy-builds-json: ${{ steps.friction.outputs.heavy-builds-json }}
          labels: "buildchain-feedback,workflow-friction"
          comment-cooldown-hours: "24"
          fail-on-error: "false"

      - name: Upload Buildchain control-plane observability
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-control-plane-observability-${{ github.run_id }}-${{ github.run_attempt }}
          path: .buildchain/logs/events.jsonl
          include-hidden-files: true
          if-no-files-found: ignore

  github-artifact-attestation:
    name: Sign Linux release artifact with GitHub OIDC
    needs: [promote]
    if: ${{ inputs.github-artifact-attestation-policy-json != '' && !inputs.dry-run && needs.promote.result == 'success' }}
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: kungfu-systems/buildchain/.github/workflows/github-artifact-attestation.yml@375b2d4b8a904776453773a33b4c4e4556c8c999
    with:
      buildchain-ref: ${{ needs.promote.outputs.github-artifact-attestation-signer-ref }}
      evidence-run-id: ${{ github.run_id }}
      source-sha: ${{ needs.promote.outputs.github-artifact-attestation-source-sha }}
      subject-artifact-name: ${{ needs.promote.outputs.github-artifact-attestation-input-artifact }}
      subject-relative-path: ${{ needs.promote.outputs.github-artifact-attestation-subject-relative-path }}
      platform-manifest-artifact-name: ${{ needs.promote.outputs.github-artifact-attestation-input-artifact }}
      platform-manifest-relative-path: ${{ needs.promote.outputs.github-artifact-attestation-platform-manifest-relative-path }}
      release-passport-artifact-name: ${{ needs.promote.outputs.github-artifact-attestation-input-artifact }}
      release-passport-relative-path: ${{ needs.promote.outputs.github-artifact-attestation-release-passport-relative-path }}
      policy-json: ${{ needs.promote.outputs.github-artifact-attestation-policy-json }}
      evidence-artifact-name: buildchain-github-attestation-evidence-${{ needs.promote.outputs.github-artifact-attestation-source-sha }}
      environment: ${{ inputs.github-artifact-attestation-environment }}
      retention-days: ${{ inputs.github-artifact-attestation-retention-days }}

  publish-github-artifact-attestation-evidence:
    name: Publish verified attestation evidence to GitHub Release
    needs: [promote, github-artifact-attestation]
    if: ${{ inputs.github-artifact-attestation-policy-json != '' && !inputs.dry-run && needs.github-artifact-attestation.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.github-artifact-attestation-environment }}
    permissions:
      actions: read
      contents: write
    outputs:
      evidence-root: ${{ steps.publish.outputs.evidence-root }}
      publication-receipt-digest: ${{ steps.publish.outputs.publication-receipt-digest }}
      release-url: ${{ steps.publish.outputs.release-url }}
    steps:
      - name: Load exact Buildchain v3 evidence publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ needs.promote.outputs.github-artifact-attestation-buildchain-ref }}
          path: .buildchain/publisher-runtime
          persist-credentials: false
          sparse-checkout: |
            packages/core
            scripts/publish-github-artifact-attestation-evidence.mjs

      - name: Download sealed attestation inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.promote.outputs.github-artifact-attestation-input-artifact }}
          path: .buildchain/attestation-input

      - name: Download GitHub/Sigstore attestation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.github-artifact-attestation.outputs.evidence-artifact-name }}
          path: .buildchain/attestation-evidence

      - name: Verify and publish immutable evidence assets
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node .buildchain/publisher-runtime/scripts/publish-github-artifact-attestation-evidence.mjs \
            --repository "${{ github.repository }}" \
            --tag "${{ needs.promote.outputs.github-artifact-attestation-public-release-tag }}" \
            --subject ".buildchain/attestation-input/${{ needs.promote.outputs.github-artifact-attestation-subject-relative-path }}" \
            --manifest ".buildchain/attestation-input/${{ needs.promote.outputs.github-artifact-attestation-platform-manifest-relative-path }}" \
            --passport ".buildchain/attestation-input/${{ needs.promote.outputs.github-artifact-attestation-release-passport-relative-path }}" \
            --bundle .buildchain/attestation-evidence/sigstore-bundle.json \
            --evidence .buildchain/attestation-evidence/github-artifact-attestation-evidence.json \
            --predicate .buildchain/attestation-evidence/predicate.json \
            --provider-verification .buildchain/attestation-evidence/provider-verification.json \
            --receipt .buildchain/attestation-publication/publication.json

      - name: Retain attestation publication receipt
        if: ${{ always() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildchain-github-attestation-publication-${{ needs.promote.outputs.github-artifact-attestation-source-sha }}
          path: .buildchain/attestation-publication/publication.json
          retention-days: ${{ inputs.github-artifact-attestation-retention-days }}
          if-no-files-found: error

  controller-receipt:
    name: Record release-candidate promotion controller receipt
    needs: [preflight, controller-plan, release-candidate-preflight, publication-authority, promote, github-artifact-attestation, publish-github-artifact-attestation-evidence]
    if: ${{ always() && needs.controller-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      controller-receipt-artifact: buildchain-release-promotion-controller-receipt-${{ needs.preflight.outputs.requested-sha }}
      controller-receipt-json: ${{ steps.controller-receipt.outputs.controller-receipt-json }}
      controller-receipt-digest: ${{ steps.controller-receipt.outputs.controller-receipt-digest }}
      controller-receipt-status: ${{ steps.controller-receipt.outputs.controller-receipt-status }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v3' }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Download release-candidate-promotion controller plan
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.controller-plan.outputs.controller-plan-artifact }}
          path: .buildchain/controller

      - name: Download release-candidate-promotion controller evidence
        if: ${{ !inputs.dry-run && needs.promote.result == 'success' }}
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-release-promotion-controller-evidence-${{ needs.preflight.outputs.requested-sha }}
          path: .buildchain/controller/promotion-evidence

      - name: Download GitHub artifact attestation publication receipt
        if: ${{ inputs.github-artifact-attestation-policy-json != '' && needs.publish-github-artifact-attestation-evidence.result == 'success' }}
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-github-attestation-publication-${{ needs.promote.outputs.github-artifact-attestation-source-sha }}
          path: .buildchain/controller/attestation-publication

      - name: Create release-candidate-promotion controller receipt
        id: controller-receipt
        run: node .buildchain/runtime/scripts/controller-evidence.mjs --mode receipt
        env:
          BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
          BUILDCHAIN_CONTROLLER_STAGES_JSON: >-
            [{"id":"preflight","status":"${{ needs.preflight.result }}"},{"id":"admit-release-candidate","status":"${{ needs.release-candidate-preflight.result == 'success' && needs.promote.outputs.release-candidate-outcome || needs.release-candidate-preflight.result }}"},{"id":"publication-authority","status":"${{ needs.promote.result == 'success' && 'success' || needs.publication-authority.result }}"},{"id":"publish","status":"${{ inputs.dry-run && 'skipped' || needs.promote.outputs.finalization-needed == 'true' && 'partial' || needs.promote.outputs.promotion-outcome || needs.promote.result }}"},{"id":"passport","status":"${{ inputs.dry-run && 'skipped' || needs.promote.outputs.finalization-needed == 'true' && 'partial' || needs.promote.outputs.promotion-outcome || needs.promote.result }}"},{"id":"aggregate","status":"${{ needs.promote.outputs.finalization-needed == 'true' && 'partial' || needs.promote.result }}"}]
          BUILDCHAIN_CONTROLLER_EVIDENCE_FILES_JSON: ${{ !inputs.dry-run && needs.promote.result == 'success' && needs.promote.outputs.finalization-needed == 'true' && '[{"kind":"release-candidate-passport","path":".buildchain/controller/promotion-evidence/release-candidate-passport.json"},{"kind":"publish-evidence","path":".buildchain/controller/promotion-evidence/publish-evidence.json"}]' || !inputs.dry-run && needs.promote.result == 'success' && '[{"kind":"release-candidate-passport","path":".buildchain/controller/promotion-evidence/release-candidate-passport.json"},{"kind":"publish-evidence","path":".buildchain/controller/promotion-evidence/publish-evidence.json"},{"kind":"release-passport","path":".buildchain/controller/promotion-evidence/release-passport.json"}]' || '[]' }}
          BUILDCHAIN_CONTROLLER_REASON_CODE: ${{ inputs.dry-run && 'promotion-dry-run' || needs.promote.outputs.finalization-needed == 'true' && 'promotion-finalization-pending' || needs.promote.result == 'success' && '' || needs.preflight.outputs.action == 'noop' && 'promotion-superseded' || 'promotion-incomplete' }}
          BUILDCHAIN_CONTROLLER_REASON_SUMMARY: Release-candidate promotion did not complete successfully
          BUILDCHAIN_CONTROLLER_RECEIPT_ARTIFACT: buildchain-release-promotion-controller-receipt-${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json

      - name: Upload release-candidate-promotion controller receipt
        if: ${{ always() && steps.controller-receipt.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-release-promotion-controller-receipt-${{ needs.preflight.outputs.requested-sha }}
          path: .buildchain/controller/receipt.json
          if-no-files-found: error

      - name: Enforce qualifying release-candidate-promotion controller receipt
        if: ${{ always() && !inputs.dry-run && needs.preflight.outputs.action == 'promote' && needs.promote.outputs.finalization-needed != 'true' && steps.controller-receipt.outputs.controller-receipt-qualifying != 'true' }}
        run: |
          echo "::error::release-candidate-promotion controller receipt is not qualifying: ${{ steps.controller-receipt.outputs.controller-receipt-status }}"
          exit 1
