name: Buildchain Patrol

on:
  workflow_call:
    inputs:
      buildchain-repository:
        description: "Buildchain runtime repository"
        default: "kungfu-systems/buildchain"
        type: string
        required: false
      buildchain-ref:
        description: "Optional Buildchain runtime ref. Empty uses v2."
        default: "v2"
        type: string
        required: false
      cadence:
        description: "Patrol cadence: daily, weekly, or monthly"
        default: "daily"
        type: string
        required: false
      mode:
        description: "Patrol mode. cadence-default keeps the cadence wrapper stable while Buildchain grows capabilities."
        default: "cadence-default"
        type: string
        required: false
      capabilities:
        description: "Optional comma/newline separated capability override"
        default: ""
        type: string
        required: false
      target-branch:
        description: "Protected dev branch to inspect or maintain"
        default: ""
        type: string
        required: false
      required-status-checks:
        description: "Comma or newline separated required status/check-run name fragments"
        default: "Verify"
        type: string
        required: false
      ready-label:
        description: "Required label for PRs eligible to merge. Empty disables the label gate."
        default: "ready"
        type: string
        required: false
      block-labels:
        description: "Comma or newline separated labels that block merging"
        default: "blocked,do-not-merge,work-in-progress"
        type: string
        required: false
      allowed-head-prefixes:
        description: "Comma or newline separated allowed source branch prefixes"
        default: "feature/,fix/,chore/,docs/,ci/,refactor/"
        type: string
        required: false
      require-approval:
        description: "Require at least one current approval and no latest changes-requested review"
        default: true
        type: boolean
        required: false
      same-repository-only:
        description: "Reject fork/cross-repository PR heads by default"
        default: true
        type: boolean
        required: false
      max-actions:
        description: "Maximum actions to take in one run"
        default: 1
        type: number
        required: false
      merge-method:
        description: "GitHub merge method for ready dev PRs: merge, squash, or rebase"
        default: "merge"
        type: string
        required: false
      dry-run:
        description: "Plan only; do not mutate repository state"
        default: true
        type: boolean
        required: false
    secrets:
      github-token:
        description: "Optional token for repository inspection and maintenance. Defaults to github.token."
        required: false
    outputs:
      result-path:
        description: "Patrol result JSON path"
        value: ${{ jobs.patrol.outputs.result-path }}
      evaluated-count:
        description: "Number of PRs evaluated by enabled capabilities"
        value: ${{ jobs.patrol.outputs.evaluated-count }}
      action-count:
        description: "Number of actions taken, or planned in dry-run mode"
        value: ${{ jobs.patrol.outputs.action-count }}
      skipped-count:
        description: "Number of skipped PRs"
        value: ${{ jobs.patrol.outputs.skipped-count }}
      planned-count:
        description: "Number of stable-interface checks not yet implemented"
        value: ${{ jobs.patrol.outputs.planned-count }}

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  patrol:
    name: Patrol
    runs-on: ubuntu-24.04
    outputs:
      result-path: ${{ steps.patrol.outputs.result-path }}
      evaluated-count: ${{ steps.patrol.outputs.evaluated-count }}
      action-count: ${{ steps.patrol.outputs.action-count }}
      skipped-count: ${{ steps.patrol.outputs.skipped-count }}
      planned-count: ${{ steps.patrol.outputs.planned-count }}
    steps:
      - name: Resolve target branch
        id: target
        shell: bash
        run: |
          target_branch="${INPUT_TARGET_BRANCH:-${GITHUB_REF_NAME}}"
          case "${target_branch}" in
            dev/v*/v*) ;;
            *)
              echo "::error::target-branch must be a semver dev branch such as dev/v2/v2.5, got: ${target_branch}"
              exit 1
              ;;
          esac
          echo "branch=${target_branch}" >> "${GITHUB_OUTPUT}"
          echo "branch-artifact=${target_branch//\//-}" >> "${GITHUB_OUTPUT}"
        env:
          INPUT_TARGET_BRANCH: ${{ inputs.target-branch }}

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v2' }}
          path: .buildchain/runtime
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Run Buildchain patrol
        id: patrol
        run: node .buildchain/runtime/scripts/buildchain-patrol.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          BUILDCHAIN_PATROL_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_PATROL_TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          BUILDCHAIN_PATROL_CADENCE: ${{ inputs.cadence }}
          BUILDCHAIN_PATROL_MODE: ${{ inputs.mode }}
          BUILDCHAIN_PATROL_CAPABILITIES: ${{ inputs.capabilities }}
          BUILDCHAIN_PATROL_REQUIRED_CHECKS: ${{ inputs.required-status-checks }}
          BUILDCHAIN_PATROL_READY_LABEL: ${{ inputs.ready-label }}
          BUILDCHAIN_PATROL_BLOCK_LABELS: ${{ inputs.block-labels }}
          BUILDCHAIN_PATROL_ALLOWED_HEAD_PREFIXES: ${{ inputs.allowed-head-prefixes }}
          BUILDCHAIN_PATROL_REQUIRE_APPROVAL: ${{ inputs.require-approval }}
          BUILDCHAIN_PATROL_SAME_REPOSITORY_ONLY: ${{ inputs.same-repository-only }}
          BUILDCHAIN_PATROL_MAX_ACTIONS: ${{ inputs.max-actions }}
          BUILDCHAIN_PATROL_MERGE_METHOD: ${{ inputs.merge-method }}
          BUILDCHAIN_PATROL_DRY_RUN: ${{ inputs.dry-run }}
          BUILDCHAIN_PATROL_OUTPUT_PATH: .buildchain/patrol/result.json

      - name: Upload Buildchain patrol result
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-patrol-${{ inputs.cadence }}-${{ steps.target.outputs.branch-artifact }}
          path: ${{ steps.patrol.outputs.result-path }}
          if-no-files-found: error
