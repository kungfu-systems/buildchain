on:
  workflow_call:
    inputs:
      node-version:
          default: "24"
          type: string
          required: false
      aws-user-region:
          default: "cn-northwest-1"
          type: string
          required: false
      bucket-release:
          default: "kungfu-prebuilt"
          type: string
          required: false
      preview-files:
          default: ".*"
          type: string
          required: false
      max-preview-links:
          default: "32"
          type: string
          required: false
    secrets:
      NODE_AUTH_TOKEN:
        required: false
      AWS_USER_ACCESS_KEY_ID:
          required: false
      AWS_USER_SECRET_ACCESS_KEY:
          required: false

permissions: write-all

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Pull Request Title
        uses: kungfu-systems/buildchain/actions/bump-version@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          action: "verify"

  build:
      name: Build on ${{ matrix.os }} with Python ${{ matrix.python-version }}
      runs-on: ${{ matrix.os }}
      needs: prepare
      strategy:
          matrix:
              os: [macos-14, ubuntu-24.04, windows-2022]
              python-version: ['3.9', '3.10', '3.11']
      env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node.js environment
          uses: actions/setup-node@v6.4.0
          with:
            node-version: ${{ inputs.node-version }}
            registry-url: "https://npm.pkg.github.com"
            scope: "@kungfu-systems"
  
        - name: Setup Node.js registry scope
          uses: actions/setup-node@v6.4.0
          with:
            registry-url: "https://npm.pkg.github.com"
            scope: "@${{github.repository_owner}}"

        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@v5
          with:
              python-version: ${{ matrix.python-version }}
        
        - name: Setup MSVC environment
          uses: ilammy/msvc-dev-cmd@v1
          if: matrix.os == 'windows-2022'
          with:
            arch: x64

        - name: Install Pipenv
          run: |
                pip install pipx
                python -m pip install --upgrade pip
                pipx install pipenv==2023.9.1
                pipx install poetry==1.6.1

        - name: Install keyring
          run: |
              pipx install keyring==21.8.0

        - name: Install pip dependencies
          run: |
              pipenv install

        - name: Setup Build Environment
          uses: nick-fields/retry@v4.0.0
          with:
                timeout_minutes: 10
                max_attempts: 3
                command: yarn --network-timeout=1000000 install --frozen-lockfile
                new_command_on_retry: yarn --network-timeout=5000000 install --frozen-lockfile

        - name: Run yarn build
          run: yarn build
          continue-on-error: true
          env: 
              PYTHON_VERSION: ${{ matrix.python-version }}
      
        - name: Upload Prebuilt (without versions)
          uses: actions/upload-artifact@v4
          with:
              name: "Prebuilt-${{matrix.os}}-${{matrix.python-version}}-${{github.actor}}-${{github.sha}}"
              path: |
                **/build/stage/**/*.*
              if-no-files-found: ignore

        - name: Configure AWS Crendentials (User)
          uses: aws-actions/configure-aws-credentials@v6.2.1
          with:
              aws-access-key-id: ${{ secrets.AWS_USER_ACCESS_KEY_ID }}
              aws-secret-access-key: ${{ secrets.AWS_USER_SECRET_ACCESS_KEY }}
              aws-region: ${{ inputs.aws-user-region }}

        - name: Publish Prebuilt to AWS (User)
          uses: kungfu-systems/buildchain/actions/publish-prebuilt@v1
          with:
              token: ${{ secrets.GITHUB_TOKEN }}
              artifacts-path: "dist"
              bucket-release: ${{ inputs.bucket-release }}
              preview-files: ${{ inputs.preview-files }}
              max-preview-links: ${{ inputs.max-preview-links }}

  verify:
    if: ${{ always() }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump Version
        uses: kungfu-systems/buildchain/actions/bump-version@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          action: "prebuild"

      - name: Verify Version
        uses: kungfu-systems/buildchain/actions/bump-version@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          action: "verify"
