name: Buildchain Dogfood Patrol Daily

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      buildchain-ref:
        description: "Temporary Buildchain runtime ref for trusted manual validation"
        required: false
        default: ""
      dry-run:
        description: "Plan only; do not mutate repository state"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  patrol:
    uses: ./.github/workflows/patrol-daily.yml
    with:
      buildchain-ref: ${{ inputs.buildchain-ref || 'v2-alpha' }}
      required-status-checks: check
      landing-mode: queue
      dry-run: ${{ inputs.dry-run || false }}
      max-actions: 1
    secrets:
      github-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN || github.token }}
