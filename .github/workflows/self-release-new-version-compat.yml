name: Release - New Version

on:
  pull_request:
    types: [closed]
    branches:
      - alpha/v*/v*
      - release/v*/v*

permissions:
  contents: read

jobs:
  buildchain-self-release:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Buildchain self-release is handled by Buildchain Ref Promotion after Verify succeeds."
          echo "The reusable .release-new-version.yml workflow remains available for consumer repositories."
