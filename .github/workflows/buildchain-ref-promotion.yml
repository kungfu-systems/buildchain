name: Buildchain Ref Promotion

on:
  workflow_run:
    workflows: ["Verify"]
    branches:
      - "alpha/v*/v*"
      - "release/v*/v*"
      - "publish-gate/major"
      - "major-gate"
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Verified alpha/release commit to promote. Defaults to the current workflow ref SHA."
        required: false
        default: ""
      target-ref:
        description: "Buildchain channel branch to promote"
        required: true
        default: "alpha/v2/v2.2"
      dry-run:
        description: "Only print planned tag updates"
        required: true
        default: "true"

permissions:
  contents: write
  actions: read
  checks: write
  issues: write
  id-token: write

jobs:
  reject-manual-apply:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject manual apply
        run: |
          echo "::error::Manual buildchain ref promotion is limited to dry-run."
          echo "::error::Merge through alpha/release and let a successful Verify workflow_run promote refs."
          exit 1

  promote:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs['dry-run'] == 'true') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          !startsWith(github.event.workflow_run.display_title, 'Prepare v') &&
          !startsWith(github.event.workflow_run.display_title, 'chore(release): prepare v') &&
          !startsWith(github.event.workflow_run.display_title, 'chore(release): release v')
        )
      }}
    uses: ./.github/workflows/release-candidate-promote.yml
    secrets: inherit
    with:
      buildchain-repository: kungfu-systems/buildchain
      buildchain-ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      target-ref: ${{ github.event.workflow_run.head_branch || inputs['target-ref'] }}
      target-sha: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      package-manager: pnpm
      artifact-name: libnode-shaped
      release-candidate-workflow-file: build-surface-fixture.yml
      release-candidate-workflow-name: Build Surface Fixture
      github-release: true
      required-status-check: check
      branch-protection-bypass-apps: ${{ vars.BUILDCHAIN_PROMOTION_BYPASS_APPS || 'github-actions' }}
      branch-protection-bypass-users: ${{ vars.BUILDCHAIN_PROMOTION_BYPASS_USERS }}
      branch-protection-bypass-teams: ${{ vars.BUILDCHAIN_PROMOTION_BYPASS_TEAMS }}
      required-artifact-count: 0
      publish-required-artifacts-json: "[]"
      trusted-publishing: true
      release-passport: true
      release-passport-product-name: Buildchain
      release-passport-buildchain-self-kfd: true
      release-passport-impact-json: >-
        {"schemaVersion":1,"contract":"kungfu-buildchain-impact","versionImpact":{"final":"minor","source":"buildchain-release-governance","rationale":"Buildchain v2.9 adds Build Facts as a public contract, exposes managed trust badge bundle generation, and fixes web-surface multi-host directory index routing for S3/CloudFront deployments."},"surfaceImpacts":[{"id":"build-facts-contract","impact":"minor","class":"release-passport","rationale":"Adds public CLI and Node API build facts, module/product fact contracts, release-passport evidence, and Kungfu legacy buildinfo projection from the same source facts.","source":"buildchain-ref-promotion.yml"},{"id":"trust-badge-bundle","impact":"minor","class":"agent-facing-docs","rationale":"Adds a single managed badge bundle entrypoint for KFD-1, KFD-2, KFD-3, and Buildchain Release Passport status with machine-readable badge facts.","source":"buildchain-ref-promotion.yml"},{"id":"web-surface-directory-index-aliases","impact":"patch","class":"web-surface-deployment","rationale":"Fixes multi-surface preview and production hosts so root and nested directory requests resolve to the surface index.html through explicit S3 alias objects.","source":"buildchain-ref-promotion.yml"}],"classification":"minor","breaking":false,"security":false,"migrationRequired":false,"summary":"Buildchain v2.9 minor release line for Build Facts, trust badge bundles, and web-surface directory index routing."}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] == 'true' }}
