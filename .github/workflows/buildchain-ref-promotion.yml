name: Buildchain Ref Promotion

on:
  workflow_run:
    workflows: ["Verify"]
    branches:
      - "alpha/v*/v*"
      - "release/v*/v*"
      - "publish-gate/major"
      - "major-gate"
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Verified alpha/release commit to promote. Defaults to the current workflow ref SHA."
        required: false
        default: ""
      target-ref:
        description: "Buildchain channel branch to promote"
        required: true
        default: "alpha/v2/v2.2"
      dry-run:
        description: "Only print planned tag updates"
        required: true
        default: "true"

permissions:
  contents: write
  actions: read
  checks: write
  issues: write
  id-token: write

jobs:
  reject-manual-apply:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject manual apply
        run: |
          echo "::error::Manual buildchain ref promotion is limited to dry-run."
          echo "::error::Merge through alpha/release and let a successful Verify workflow_run promote refs."
          exit 1

  promote:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs['dry-run'] == 'true') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          !startsWith(github.event.workflow_run.display_title, 'chore(release): prepare v') &&
          !startsWith(github.event.workflow_run.display_title, 'chore(release): release v')
        )
      }}
    uses: ./.github/workflows/release-candidate-promote.yml
    secrets: inherit
    with:
      buildchain-repository: kungfu-systems/buildchain
      buildchain-ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      target-ref: ${{ github.event.workflow_run.head_branch || inputs['target-ref'] }}
      target-sha: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      package-manager: pnpm
      artifact-name: libnode-shaped
      release-candidate-workflow-file: build-surface-fixture.yml
      release-candidate-workflow-name: Build Surface Fixture
      github-release: true
      required-status-check: check
      branch-protection-bypass-apps: ${{ vars.BUILDCHAIN_PROMOTION_BYPASS_APPS || 'github-actions' }}
      branch-protection-bypass-users: ${{ vars.BUILDCHAIN_PROMOTION_BYPASS_USERS }}
      branch-protection-bypass-teams: ${{ vars.BUILDCHAIN_PROMOTION_BYPASS_TEAMS }}
      required-artifact-count: 0
      publish-required-artifacts-json: "[]"
      trusted-publishing: true
      release-passport: true
      release-passport-product-name: Buildchain
      release-passport-buildchain-self-kfd: true
      release-passport-impact-json: >-
        {"schemaVersion":1,"contract":"kungfu-buildchain-impact","versionImpact":{"final":"minor","source":"buildchain-release-governance","rationale":"Buildchain v2.8 promotes KFD self-verification, KFD-2 release trust passport audits, KFD-3 collaboration-interface trust proofs, publish source-lock enforcement, and GitHub Checks protected-channel governance as a minor runtime line."},"surfaceImpacts":[{"id":"kfd-1-contract-world-release-gate","impact":"minor","class":"release-passport","rationale":"Adds KFD-1 self contract verification with source/artifact hashes, schema IDs, self-hosting boundary, result, and responsibility state.","source":"buildchain-ref-promotion.yml"},{"id":"kfd-2-release-trust-passport-audit","impact":"minor","class":"release-passport","rationale":"Adds public release claim auditing that fails unbound claims and downgrades prose-only claims.","source":"buildchain-ref-promotion.yml"},{"id":"kfd-3-collaboration-interface-trust-proof","impact":"minor","class":"release-passport","rationale":"Adds KFD-3 self-verification for docs, schemas, standards metadata, package exports, site-consumption contracts, witness hashes, audit boundary, residual risk, and responsibility state.","source":"buildchain-ref-promotion.yml"},{"id":"publish-source-lock-enforcement","impact":"minor","class":"release-governance","rationale":"Forces release-candidate promote wrappers to pass publish-gate source-lock inputs into promote-buildchain-ref before publish side effects.","source":"buildchain-ref-promotion.yml"},{"id":"required-check-protection","impact":"minor","class":"release-governance","rationale":"Repairs managed protected channel branches to require GitHub Actions check runs instead of legacy commit status contexts.","source":"buildchain-ref-promotion.yml"}],"classification":"minor","breaking":false,"security":false,"migrationRequired":false,"summary":"Buildchain v2.8 minor release line for KFD release trust gates, publish source-lock enforcement, and protected check governance."}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] == 'true' }}
