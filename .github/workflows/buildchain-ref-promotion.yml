name: Buildchain Ref Promotion

on:
  workflow_run:
    workflows: ["Verify"]
    branches:
      - "alpha/v*/v*"
      - "release/v*/v*"
      - "publish-gate/major"
      - "major-gate"
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Verified alpha/release commit to promote. Defaults to the current workflow ref SHA."
        required: false
        default: ""
      target-ref:
        description: "Buildchain channel branch to promote"
        required: true
        default: "alpha/v2/v2.2"
      dry-run:
        description: "Only print planned tag updates"
        required: true
        default: "true"

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  promote:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject manual apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] != 'true' }}
        run: |
          echo "::error::Manual buildchain ref promotion is limited to dry-run."
          echo "::error::Merge through alpha/release and let a successful Verify workflow_run promote refs."
          exit 1

      - name: Resolve target SHA
        id: target
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          sha="${WORKFLOW_RUN_SHA:-${INPUT_SHA:-$FALLBACK_SHA}}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Resolve target ref
        id: target_ref
        env:
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TARGET_REF: ${{ inputs['target-ref'] }}
        run: |
          target_ref="${WORKFLOW_RUN_BRANCH:-$INPUT_TARGET_REF}"
          case "$target_ref" in
            alpha/v*/v*|release/v*/v*|publish-gate/major|major-gate) ;;
            *)
              echo "::error::unsupported target ref: $target_ref"
              exit 1
              ;;
          esac
          echo "target_ref=${target_ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout target commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Enable pnpm
        run: |
          corepack enable pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Promote buildchain refs
        uses: ./actions/promote-buildchain-ref
        with:
          token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN || github.token }}
          sha: ${{ steps.target.outputs.sha }}
          target-ref: ${{ steps.target_ref.outputs.target_ref }}
          dry-run: ${{ inputs['dry-run'] || 'false' }}
          require-governance: "true"
          require-version-state: "true"
          required-status-check: "check"
          publish-transaction: "true"

      - name: Report Buildchain promotion friction
        if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
        uses: ./actions/report-buildchain-issue
        with:
          token: ${{ github.token }}
          report-kind: workflow-friction
          target-repository: ${{ github.repository }}
          repository: ${{ github.repository }}
          workflow: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          channel: ${{ steps.target_ref.outputs.target_ref }}
          source-ref: ${{ github.event.workflow_run.head_branch }}
          source-sha: ${{ steps.target.outputs.sha }}
          friction-class: buildchain-ref-promotion-failed
          summary: "Buildchain ref promotion failed after a successful Verify workflow_run. This should be investigated as Buildchain workflow friction instead of requiring repeated manual reruns."
          diagnosis: "Promotion should be idempotent. If the root cause is duplicate PR, duplicate build, transient GitHub API, stale release-state, or missing RC evidence, keep the finding on this deduplicated issue."
          next-action: "Inspect the run logs and fix the Buildchain workflow contract so the next alpha/release promotion can complete without manual rerun."
          labels: "buildchain-feedback,workflow-friction"
          comment-cooldown-hours: "24"
          fail-on-error: "false"
