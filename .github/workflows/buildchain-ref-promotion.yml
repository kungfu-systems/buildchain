name: Buildchain Ref Promotion

on:
  workflow_run:
    workflows: ["Verify"]
    branches:
      - "alpha/v*/v*"
      - "release/v*/v*"
      - "publish-gate/major"
      - "major-gate"
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Verified alpha/release commit to promote. Defaults to the current workflow ref SHA."
        required: false
        default: ""
      target-ref:
        description: "Buildchain channel branch to promote"
        required: true
        default: "alpha/v4/v4.0"
      dry-run:
        description: "Only print planned tag updates"
        required: true
        default: "true"
      recover-durable-transaction:
        description: "Recover an existing durable transaction from its exact original source SHA using fresh GitHub-hosted admission"
        required: true
        default: false
        type: boolean
      publication-admission-json:
        description: "Fresh sealed admission JSON required for manual apply"
        required: false
        default: ""
      publication-runner-provenance-json:
        description: "Runner provenance receipt JSON bound by the admission"
        required: false
        default: ""
      publication-control-plane-audit-json:
        description: "Fresh external control-plane audit receipt JSON"
        required: false
        default: ""
      publication-gate-aggregate-json:
        description: "Qualifying Shifu Gate aggregate or explicit consumer-owned no-Gate decision"
        required: false
        default: ""
      publication-expected-json:
        description: "Independent exact publication bindings JSON"
        required: false
        default: ""
      publication-used-nonces-json:
        description: "JSON array of consumed admission nonces"
        required: false
        default: "[]"
      release-passport-v4-runtime-resume-evidence-json:
        description: "Verified runtime A+B Stage Capsule resume evidence JSON"
        required: false
        default: ""
      resume-candidate-repository:
        description: "Repository that owns the sealed candidate run"
        required: false
        default: ""
      resume-candidate-run-id:
        description: "Exact successful Build Surface Fixture run ID to recover"
        required: false
        default: ""
      resume-expected-source-tree:
        description: "Exact Git tree recorded for the candidate"
        required: false
        default: ""
      resume-expected-candidate-root:
        description: "Optional exact sha256 Release Candidate root"
        required: false
        default: ""
      resume-expected-candidate-runtime-sha:
        description: "Exact Buildchain runtime SHA recorded in the candidate Passport"
        required: false
        default: ""
      resume-buildchain-runtime-sha:
        description: "Exact current Buildchain tooling SHA used by this recovery run"
        required: false
        default: ""
      resume-buildchain-runtime-ref:
        description: "Approved v4 train or authority ref resolving to the recovery runtime SHA"
        required: false
        default: ""
      resume-transaction-id:
        description: "Optional existing durable transaction identity"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  reject-manual-apply:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] != 'true' && inputs['recover-durable-transaction'] != true && inputs['resume-candidate-run-id'] == '' && inputs['publication-admission-json'] == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Reject manual apply
        run: |
          echo "::error::Manual apply requires a fresh sealed publication admission."
          echo "::error::Provide admission, runner, control-plane audit, expected bindings, and used nonces JSON."
          exit 1

  reject-invalid-durable-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['recover-durable-transaction'] == true && inputs.sha == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require exact recovery SHA
        run: |
          echo "::error::Durable transaction recovery requires the exact original transaction source SHA."
          exit 1

  reject-invalid-candidate-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['resume-candidate-run-id'] != '' && (!startsWith(inputs['target-ref'], 'alpha/') || inputs.sha == '' || inputs['resume-candidate-repository'] == '' || inputs['resume-buildchain-runtime-ref'] == '' || inputs['resume-buildchain-runtime-sha'] == '' || inputs['resume-expected-candidate-runtime-sha'] == '' || (inputs['resume-expected-source-tree'] == '' && inputs['resume-expected-candidate-root'] == '')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require exact candidate recovery identity
        run: |
          echo "::error::Candidate recovery requires exact inputs and stable recovery must use buildchain-ref-promotion-recovery.yml."
          exit 1

  alpha-recovery-admission:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['resume-candidate-run-id'] != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      shell-sha: ${{ steps.identities.outputs.shell-sha }}
      runtime-sha: ${{ steps.identities.outputs.runtime-sha }}
      contract-lock-digest: ${{ steps.identities.outputs.contract-lock-digest }}
      runtime-authorization-json: ${{ steps.runtime-authority.outputs.runtime-authorization-json }}
      runtime-authorization-root: ${{ steps.runtime-authority.outputs.runtime-authorization-root }}
    steps:
      - name: Checkout exact recovered consumer source
        uses: actions/checkout@v7.0.0
        with: { ref: "${{ inputs.sha }}", path: .buildchain/consumer, persist-credentials: false }
      - name: Checkout exact recovery runtime
        uses: actions/checkout@v7.0.0
        with: { repository: kungfu-systems/buildchain, ref: "${{ inputs['resume-buildchain-runtime-sha'] }}", path: .buildchain/runtime, persist-credentials: false }
      - name: Resolve and bind immutable alpha recovery identities
        id: identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .buildchain/runtime/scripts/promotion-identity-resolver.mjs \
            --repository kungfu-systems/buildchain \
            --router-ref "${{ inputs['resume-buildchain-runtime-ref'] }}" \
            --router-sha "${{ inputs['resume-buildchain-runtime-sha'] }}" \
            --shell-ref v4-alpha --shell-call-ref v4-alpha \
            --runtime-ref "${{ inputs['resume-buildchain-runtime-ref'] }}"
          test "$(git -C .buildchain/runtime rev-parse HEAD)" = "${{ inputs['resume-buildchain-runtime-sha'] }}"
          echo "contract-lock-digest=sha256:$(shasum -a 256 .buildchain/consumer/.buildchain/alpha-contract-lock.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
      - name: Enforce the historical floating caller before runtime recovery
        id: policy
        env:
          BUILDCHAIN_CONSUMER_ROOT: .buildchain/consumer
          BUILDCHAIN_EXPECTED_INVOCATION_CHANNEL: alpha
          BUILDCHAIN_INVOKED_WORKFLOW: .github/workflows/.release-candidate-promote.yml
          BUILDCHAIN_INVOCATION_SOURCE_PATH: .github/workflows/buildchain-ref-promotion.yml
          BUILDCHAIN_WORKFLOW_SHA: ${{ steps.identities.outputs.shell-sha }}
          BUILDCHAIN_RUNTIME_SHA: ${{ steps.identities.outputs.runtime-sha }}
          BUILDCHAIN_V4_POLICY_RECEIPT_PATH: .buildchain/evidence/v4-consumer-policy-receipt.json
        run: >-
          node .buildchain/runtime/scripts/v4-consumer-policy.mjs scan
          --source-sha "${{ inputs.sha }}"
      - name: Authorize transient governed runtime selection
        id: runtime-authority
        uses: actions/github-script@v8
        env:
          BUILDCHAIN_RUNTIME_AUTHORIZATION_PATH: .buildchain/consumer/.buildchain/evidence/v4-runtime-authorization.json
        with:
          script: |
            const script = require(process.env.GITHUB_WORKSPACE + "/.buildchain/runtime/scripts/authorize-promotion-runtime-override.cjs");
            const result = await script.authorizePromotionRuntimeOverride({
              github, context,
              request: {
                consumerRoot: process.env.GITHUB_WORKSPACE + "/.buildchain/consumer",
                runtimeModulePath: process.env.GITHUB_WORKSPACE + "/.buildchain/runtime/packages/core/v4-runtime-ref-resume-authority.js",
                runtimeRepository: "kungfu-systems/buildchain",
                consumerPolicyReceiptPath: process.env.GITHUB_WORKSPACE + "/.buildchain/consumer/.buildchain/evidence/v4-consumer-policy-receipt.json",
                consumerPolicyReceiptRoot: "${{ steps.policy.outputs.v4-consumer-policy-receipt-root }}",
                sourceSha: "${{ inputs.sha }}", requestedRef: "${{ inputs['resume-buildchain-runtime-ref'] }}",
                resolvedRuntimeSha: "${{ steps.identities.outputs.runtime-sha }}", mode: "resume",
                reason: "bounded alpha candidate recovery ${{ inputs['resume-candidate-run-id'] }}",
                outputPath: process.env.BUILDCHAIN_RUNTIME_AUTHORIZATION_PATH,
              },
            });
            core.setOutput("runtime-authorization-json", JSON.stringify({ receipt: result.receipt, receiptRoot: result.receiptRoot }));
            core.setOutput("runtime-authorization-root", result.receiptRoot);

      - name: Upload rooted alpha recovery admission receipts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: v4-consumer-policy-buildchain-alpha-recovery-${{ github.run_id }}
          path: |
            .buildchain/consumer/.buildchain/evidence/v4-consumer-policy-receipt.json
            .buildchain/consumer/.buildchain/evidence/v4-runtime-authorization.json
          if-no-files-found: error

  promote-alpha:
    needs: alpha-recovery-admission
    if: >-
      ${{
        always() &&
        (
          (
            github.event_name == 'workflow_dispatch' &&
            startsWith(inputs['target-ref'], 'alpha/') &&
            (inputs['resume-candidate-run-id'] != '' || inputs['recover-durable-transaction'] == true) &&
            inputs.sha != '' &&
            (inputs['resume-candidate-run-id'] == '' || needs.alpha-recovery-admission.result == 'success')
          ) ||
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            startsWith(github.event.workflow_run.head_branch, 'alpha/') &&
            !startsWith(github.event.workflow_run.display_title, 'Prepare v') &&
            !startsWith(github.event.workflow_run.display_title, 'chore(release): prepare v') &&
            !startsWith(github.event.workflow_run.display_title, 'chore(release): release v')
          )
        )
      }}
    uses: kungfu-systems/buildchain/.github/workflows/.release-candidate-promote.yml@v4-alpha
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      buildchain-repository: kungfu-systems/buildchain
      buildchain-ref: ${{ inputs['resume-candidate-run-id'] != '' && needs.alpha-recovery-admission.outputs.runtime-sha || 'v4-alpha' }}
      buildchain-expected-channel: alpha
      buildchain-expected-major: "4"
      promotion-router-ref: ${{ inputs['resume-buildchain-runtime-ref'] }}
      promotion-router-sha: ${{ inputs['resume-buildchain-runtime-sha'] }}
      promotion-shell-ref: v4-alpha
      promotion-shell-sha: ${{ needs.alpha-recovery-admission.outputs.shell-sha }}
      promotion-runtime-ref: ${{ inputs['resume-buildchain-runtime-ref'] }}
      promotion-runtime-sha: ${{ needs.alpha-recovery-admission.outputs.runtime-sha }}
      promotion-contract-lock-path: .buildchain/alpha-contract-lock.json
      promotion-contract-lock-digest: ${{ needs.alpha-recovery-admission.outputs.contract-lock-digest }}
      promotion-publication-channel: ${{ inputs['resume-candidate-run-id'] != '' && 'alpha' || '' }}
      promotion-target-ref: ${{ inputs['resume-candidate-run-id'] != '' && inputs['target-ref'] || '' }}
      promotion-override-used: ${{ inputs['resume-candidate-run-id'] != '' }}
      promotion-runtime-authorization-json: ${{ needs.alpha-recovery-admission.outputs.runtime-authorization-json }}
      promotion-runtime-authorization-root: ${{ needs.alpha-recovery-admission.outputs.runtime-authorization-root }}
      buildchain-alpha-contract-lock-path: .buildchain/alpha-contract-lock.json
      buildchain-stable-contract-lock-path: .buildchain/contract-lock.json
      target-ref: ${{ github.event.workflow_run.head_branch || inputs['target-ref'] }}
      target-sha: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      package-manager: pnpm
      artifact-name: libnode-shaped
      release-candidate-workflow-file: build-surface-fixture.yml
      release-candidate-workflow-name: Build Surface Fixture
      resume-candidate-repository: ${{ inputs['resume-candidate-repository'] }}
      resume-candidate-run-id: ${{ inputs['resume-candidate-run-id'] }}
      resume-expected-workflow-file: build-surface-fixture.yml
      resume-expected-workflow-name: Build Surface Fixture
      resume-expected-source-tree: ${{ inputs['resume-expected-source-tree'] }}
      resume-expected-candidate-root: ${{ inputs['resume-expected-candidate-root'] }}
      resume-expected-candidate-runtime-sha: ${{ inputs['resume-expected-candidate-runtime-sha'] }}
      resume-buildchain-runtime-sha: ${{ inputs['resume-buildchain-runtime-sha'] }}
      resume-transaction-id: ${{ inputs['resume-transaction-id'] }}
      artifact-patterns: ${{ inputs['resume-candidate-run-id'] != '' && '' || 'buildchain-package-*' }}
      publish-rematerialize-on-resume: true
      github-release: true
      github-release-payload-patterns: ${{ inputs['resume-candidate-run-id'] != '' && '*.tgz' || '' }}
      standalone-binary-distribution: ${{ inputs['resume-candidate-run-id'] == '' }}
      required-status-check: check
      branch-protection-bypass-apps: ${{ vars.BUILDCHAIN_PROMOTION_BYPASS_APPS || 'github-actions' }}
      required-artifact-count: 0
      publish-transaction-override: ${{ inputs['recover-durable-transaction'] == true || inputs['resume-candidate-run-id'] != '' }}
      publish-required-artifacts-json: '[{"group":"node","kind":"npm","name":"@kungfu-tech/buildchain","ref_template":"{version}","role":"main","required":true}]'
      publish-package-main: "@kungfu-tech/buildchain"
      trusted-publishing: true
      release-passport: true
      release-passport-product-name: Buildchain
      release-passport-buildchain-self-kfd: true
      release-passport-impact-json: .buildchain/release-impact.json
      publication-auto-admission: true
      publication-auto-no-gate: true
      publication-publisher-workflow-path: .github/workflows/buildchain-ref-promotion.yml
      publication-product: Buildchain
      publication-target: npm:@kungfu-tech/buildchain
      publication-package-name: "@kungfu-tech/buildchain"
      dry-run: ${{ inputs['dry-run'] == 'true' }}

  promote-stable:
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          !startsWith(inputs['target-ref'], 'alpha/') &&
          (
            inputs['dry-run'] == 'true' ||
            inputs['publication-admission-json'] != '' ||
            (inputs['recover-durable-transaction'] == true && inputs.sha != '')
          )
        ) ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          !startsWith(github.event.workflow_run.head_branch, 'alpha/') &&
          !startsWith(github.event.workflow_run.display_title, 'Prepare v') &&
          !startsWith(github.event.workflow_run.display_title, 'chore(release): prepare v') &&
          !startsWith(github.event.workflow_run.display_title, 'chore(release): release v')
        )
      }}
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@v4
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      buildchain-repository: kungfu-systems/buildchain
      buildchain-ref: ${{ inputs['resume-candidate-run-id'] != '' && inputs['resume-buildchain-runtime-sha'] || inputs['recover-durable-transaction'] == true && github.sha || 'v4' }}
      buildchain-contract-lock-path: .buildchain/contract-lock.json
      target-ref: ${{ github.event.workflow_run.head_branch || inputs['target-ref'] }}
      target-sha: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      package-manager: pnpm
      artifact-name: libnode-shaped
      release-candidate-workflow-file: build-surface-fixture.yml
      release-candidate-workflow-name: Build Surface Fixture
      resume-candidate-repository: ${{ inputs['resume-candidate-repository'] }}
      resume-candidate-run-id: ${{ inputs['resume-candidate-run-id'] }}
      resume-expected-workflow-file: build-surface-fixture.yml
      resume-expected-workflow-name: Build Surface Fixture
      resume-expected-source-tree: ${{ inputs['resume-expected-source-tree'] }}
      resume-expected-candidate-root: ${{ inputs['resume-expected-candidate-root'] }}
      resume-expected-candidate-runtime-sha: ${{ inputs['resume-expected-candidate-runtime-sha'] }}
      resume-buildchain-runtime-sha: ${{ inputs['resume-buildchain-runtime-sha'] }}
      resume-transaction-id: ${{ inputs['resume-transaction-id'] }}
      artifact-patterns: ""
      publish-rematerialize-on-resume: ${{ startsWith(github.event.workflow_run.head_branch || inputs['target-ref'], 'release/') }}
      github-release: true
      github-release-payload-patterns: ${{ inputs['resume-candidate-run-id'] != '' && '*.tgz' || '' }}
      standalone-binary-distribution: ${{ inputs['resume-candidate-run-id'] == '' }}
      required-status-check: check
      branch-protection-bypass-apps: ${{ vars.BUILDCHAIN_PROMOTION_BYPASS_APPS || 'github-actions' }}
      required-artifact-count: 0
      publish-transaction-override: ${{ github.event_name == 'workflow_dispatch' && (inputs['recover-durable-transaction'] == true || inputs['resume-candidate-run-id'] != '') }}
      publish-required-artifacts-json: '[{"group":"node","kind":"npm","name":"@kungfu-tech/buildchain","ref_template":"{version}","role":"main","required":true}]'
      publish-package-main: "@kungfu-tech/buildchain"
      trusted-publishing: true
      release-passport: true
      release-passport-product-name: Buildchain
      release-passport-buildchain-self-kfd: true
      release-passport-impact-json: .buildchain/release-impact.json
      publication-admission-json: ${{ inputs['publication-admission-json'] || '' }}
      publication-runner-provenance-json: ${{ inputs['publication-runner-provenance-json'] || '' }}
      publication-control-plane-audit-json: ${{ inputs['publication-control-plane-audit-json'] || '' }}
      publication-gate-aggregate-json: ${{ inputs['publication-gate-aggregate-json'] || '' }}
      publication-expected-json: ${{ inputs['publication-expected-json'] || '' }}
      publication-used-nonces-json: ${{ inputs['publication-used-nonces-json'] || '[]' }}
      publication-auto-admission: ${{ github.event_name == 'workflow_run' || inputs['recover-durable-transaction'] == true || inputs['resume-candidate-run-id'] != '' }}
      publication-auto-no-gate: ${{ github.event_name == 'workflow_run' || inputs['recover-durable-transaction'] == true || inputs['resume-candidate-run-id'] != '' }}
      publication-publisher-workflow-path: .github/workflows/buildchain-ref-promotion.yml
      publication-product: Buildchain
      publication-target: npm:@kungfu-tech/buildchain
      publication-package-name: "@kungfu-tech/buildchain"
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] == 'true' }}
