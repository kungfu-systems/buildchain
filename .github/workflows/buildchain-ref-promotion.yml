name: Buildchain Ref Promotion

on:
  workflow_run:
    workflows: ["Verify"]
    branches:
      - "alpha/v*/v*"
      - "release/v*/v*"
      - "publish-gate/major"
      - "major-gate"
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Verified alpha/release commit to promote. Defaults to the current workflow ref SHA."
        required: false
        default: ""
      target-ref:
        description: "Buildchain channel branch to promote"
        required: true
        default: "alpha/v4/v4.0"
      dry-run:
        description: "Only print planned tag updates"
        required: true
        default: "true"
      recover-durable-transaction:
        description: "Recover an existing durable transaction from its exact original source SHA using fresh GitHub-hosted admission"
        required: true
        default: false
        type: boolean
      publication-admission-json:
        description: "Fresh sealed admission JSON required for manual apply"
        required: false
        default: ""
      publication-runner-provenance-json:
        description: "Runner provenance receipt JSON bound by the admission"
        required: false
        default: ""
      publication-control-plane-audit-json:
        description: "Fresh external control-plane audit receipt JSON"
        required: false
        default: ""
      publication-gate-aggregate-json:
        description: "Qualifying Shifu Gate aggregate or explicit consumer-owned no-Gate decision"
        required: false
        default: ""
      publication-expected-json:
        description: "Independent exact publication bindings JSON"
        required: false
        default: ""
      publication-used-nonces-json:
        description: "JSON array of consumed admission nonces"
        required: false
        default: "[]"
      release-passport-v4-runtime-resume-evidence-json:
        description: "Verified runtime A+B Stage Capsule resume evidence JSON"
        required: false
        default: ""
      resume-candidate-repository:
        description: "Repository that owns the sealed candidate run"
        required: false
        default: ""
      resume-candidate-run-id:
        description: "Exact successful Build Surface Fixture run ID to recover"
        required: false
        default: ""
      resume-expected-source-tree:
        description: "Exact Git tree recorded for the candidate"
        required: false
        default: ""
      resume-expected-candidate-root:
        description: "Optional exact sha256 Release Candidate root"
        required: false
        default: ""
      resume-expected-candidate-runtime-sha:
        description: "Exact Buildchain runtime SHA recorded in the candidate Passport"
        required: false
        default: ""
      resume-buildchain-runtime-sha:
        description: "Exact current Buildchain tooling SHA used by this recovery run"
        required: false
        default: ""
      resume-transaction-id:
        description: "Optional existing durable transaction identity"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  reject-manual-apply:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] != 'true' && inputs['recover-durable-transaction'] != true && inputs['resume-candidate-run-id'] == '' && inputs['publication-admission-json'] == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Reject manual apply
        run: |
          echo "::error::Manual apply requires a fresh sealed publication admission."
          echo "::error::Provide admission, runner, control-plane audit, expected bindings, and used nonces JSON."
          exit 1

  reject-invalid-durable-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['recover-durable-transaction'] == true && inputs.sha == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require exact recovery SHA
        run: |
          echo "::error::Durable transaction recovery requires the exact original transaction source SHA."
          exit 1

  reject-invalid-candidate-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['resume-candidate-run-id'] != '' && (inputs.sha == '' || inputs['resume-candidate-repository'] == '' || inputs['resume-buildchain-runtime-sha'] == '' || inputs['resume-expected-candidate-runtime-sha'] == '' || (inputs['resume-expected-source-tree'] == '' && inputs['resume-expected-candidate-root'] == '')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require exact candidate recovery identity
        run: |
          echo "::error::Candidate recovery requires sha, repository, current runtime SHA, candidate runtime SHA, and expected tree or candidate root."
          exit 1

  resolve-alpha-bootstrap:
    if: ${{ startsWith(github.event.workflow_run.head_branch || inputs['target-ref'], 'alpha/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      router-sha: ${{ steps.identities.outputs.router-sha }}
      shell-sha: ${{ steps.identities.outputs.shell-sha }}
      runtime-sha: ${{ steps.identities.outputs.runtime-sha }}
      contract-lock-digest: ${{ steps.lock.outputs.digest }}
    steps:
      - name: Checkout floating alpha runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: v4-alpha
          path: .buildchain/router
          persist-credentials: false
      - name: Resolve exact shell and runtime identities
        id: identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          router_sha="$(git -C .buildchain/router rev-parse HEAD)"
          node .buildchain/router/scripts/promotion-identity-resolver.mjs \
            --repository kungfu-systems/buildchain \
            --router-ref v4-alpha \
            --router-sha "${router_sha}" \
            --shell-ref v4-alpha \
            --shell-call-ref v4-alpha \
            --runtime-ref v4-alpha
          echo "router-sha=${router_sha}" >> "$GITHUB_OUTPUT"
      - name: Checkout exact promotion source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
          path: .buildchain/source
          persist-credentials: false
      - name: Bind alpha contract lock
        id: lock
        run: echo "digest=sha256:$(shasum -a 256 .buildchain/source/.buildchain/alpha-contract-lock.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  promote-alpha-bootstrap:
    needs: resolve-alpha-bootstrap
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'alpha/') &&
        !startsWith(github.event.workflow_run.display_title, 'Prepare v') &&
        !startsWith(github.event.workflow_run.display_title, 'chore(release): prepare v') &&
        !startsWith(github.event.workflow_run.display_title, 'chore(release): release v')
      }}
    # Bounded bootstrap: the old public v4-alpha wrapper cannot be parsed until this promotion moves the tag.
    uses: kungfu-systems/buildchain/.github/workflows/.release-candidate-promote.yml@v4-alpha
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      buildchain-ref: ${{ needs.resolve-alpha-bootstrap.outputs.runtime-sha }}
      buildchain-expected-channel: alpha
      buildchain-expected-major: "4"
      promotion-router-ref: v4-alpha
      promotion-router-sha: ${{ needs.resolve-alpha-bootstrap.outputs.router-sha }}
      promotion-shell-ref: v4-alpha
      promotion-shell-sha: ${{ needs.resolve-alpha-bootstrap.outputs.shell-sha }}
      promotion-runtime-ref: v4-alpha
      promotion-runtime-sha: ${{ needs.resolve-alpha-bootstrap.outputs.runtime-sha }}
      promotion-contract-lock-path: .buildchain/alpha-contract-lock.json
      promotion-contract-lock-digest: ${{ needs.resolve-alpha-bootstrap.outputs.contract-lock-digest }}
      promotion-publication-channel: alpha
      promotion-target-ref: ${{ github.event.workflow_run.head_branch || inputs['target-ref'] }}
      buildchain-contract-lock-path: .buildchain/alpha-contract-lock.json
      target-ref: ${{ github.event.workflow_run.head_branch || inputs['target-ref'] }}
      target-sha: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      package-manager: pnpm
      artifact-name: libnode-shaped
      release-candidate-workflow-file: build-surface-fixture.yml
      release-candidate-workflow-name: Build Surface Fixture
      artifact-patterns: buildchain-package-*
      publish-rematerialize-on-resume: true
      standalone-binary-distribution: true
      required-status-check: check
      required-artifact-count: 0
      publish-package-main: "@kungfu-tech/buildchain"
      release-passport-product-name: Buildchain
      release-passport-buildchain-self-kfd: true
      release-passport-impact-json: .buildchain/release-impact.json
      publication-auto-admission: true
      publication-auto-no-gate: true
      publication-publisher-workflow-path: .github/workflows/buildchain-ref-promotion.yml

  promote-stable:
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          !startsWith(inputs['target-ref'], 'alpha/') &&
          (
            inputs['dry-run'] == 'true' ||
            inputs['publication-admission-json'] != '' ||
            (inputs['recover-durable-transaction'] == true && inputs.sha != '') ||
            (inputs['resume-candidate-run-id'] != '' && inputs.sha != '')
          )
        ) ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          !startsWith(github.event.workflow_run.head_branch, 'alpha/') &&
          !startsWith(github.event.workflow_run.display_title, 'Prepare v') &&
          !startsWith(github.event.workflow_run.display_title, 'chore(release): prepare v') &&
          !startsWith(github.event.workflow_run.display_title, 'chore(release): release v')
        )
      }}
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@v4
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      buildchain-repository: kungfu-systems/buildchain
      buildchain-ref: ${{ inputs['resume-candidate-run-id'] != '' && inputs['resume-buildchain-runtime-sha'] || '' }}
      buildchain-contract-lock-path: .buildchain/contract-lock.json
      target-ref: ${{ github.event.workflow_run.head_branch || inputs['target-ref'] }}
      target-sha: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      package-manager: pnpm
      artifact-name: libnode-shaped
      release-candidate-workflow-file: build-surface-fixture.yml
      release-candidate-workflow-name: Build Surface Fixture
      resume-candidate-repository: ${{ inputs['resume-candidate-repository'] }}
      resume-candidate-run-id: ${{ inputs['resume-candidate-run-id'] }}
      resume-expected-workflow-file: build-surface-fixture.yml
      resume-expected-workflow-name: Build Surface Fixture
      resume-expected-source-tree: ${{ inputs['resume-expected-source-tree'] }}
      resume-expected-candidate-root: ${{ inputs['resume-expected-candidate-root'] }}
      resume-expected-candidate-runtime-sha: ${{ inputs['resume-expected-candidate-runtime-sha'] }}
      resume-buildchain-runtime-sha: ${{ inputs['resume-buildchain-runtime-sha'] }}
      resume-transaction-id: ${{ inputs['resume-transaction-id'] }}
      artifact-patterns: ""
      publish-rematerialize-on-resume: ${{ startsWith(github.event.workflow_run.head_branch || inputs['target-ref'], 'release/') }}
      github-release: true
      github-release-payload-patterns: ${{ inputs['resume-candidate-run-id'] != '' && '*.tgz' || '' }}
      standalone-binary-distribution: ${{ inputs['resume-candidate-run-id'] == '' }}
      required-status-check: check
      branch-protection-bypass-apps: ${{ vars.BUILDCHAIN_PROMOTION_BYPASS_APPS || 'github-actions' }}
      required-artifact-count: 0
      publish-transaction-override: ${{ github.event_name == 'workflow_dispatch' && (inputs['recover-durable-transaction'] == true || inputs['resume-candidate-run-id'] != '') }}
      publish-required-artifacts-json: '[{"group":"node","kind":"npm","name":"@kungfu-tech/buildchain","ref_template":"{version}","role":"main","required":true}]'
      publish-package-main: "@kungfu-tech/buildchain"
      trusted-publishing: true
      release-passport: true
      release-passport-product-name: Buildchain
      release-passport-buildchain-self-kfd: true
      release-passport-impact-json: .buildchain/release-impact.json
      publication-admission-json: ${{ inputs['publication-admission-json'] || '' }}
      publication-runner-provenance-json: ${{ inputs['publication-runner-provenance-json'] || '' }}
      publication-control-plane-audit-json: ${{ inputs['publication-control-plane-audit-json'] || '' }}
      publication-gate-aggregate-json: ${{ inputs['publication-gate-aggregate-json'] || '' }}
      publication-expected-json: ${{ inputs['publication-expected-json'] || '' }}
      publication-used-nonces-json: ${{ inputs['publication-used-nonces-json'] || '[]' }}
      publication-auto-admission: ${{ github.event_name == 'workflow_run' || inputs['recover-durable-transaction'] == true || inputs['resume-candidate-run-id'] != '' }}
      publication-auto-no-gate: ${{ github.event_name == 'workflow_run' || inputs['recover-durable-transaction'] == true || inputs['resume-candidate-run-id'] != '' }}
      publication-publisher-workflow-path: .github/workflows/buildchain-ref-promotion.yml
      publication-product: Buildchain
      publication-target: npm:@kungfu-tech/buildchain
      publication-package-name: "@kungfu-tech/buildchain"
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] == 'true' }}
