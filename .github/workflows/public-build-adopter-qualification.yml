name: V4 Adopter Delivery
on:
  workflow_dispatch:
    inputs:
      consumer:
        description: Stable lowercase public adopter identity
        required: false
        default: buildchain
        type: string
      input-path:
        description: Repository-relative public adopter delivery gate input
        required: false
        default: contracts/fixtures/v4-adopter-delivery-v1/gate-positive.json
        type: string
      consumer-repository:
        description: Exact external public adopter repository for candidate qualification
        required: false
        default: ""
        type: string
      consumer-ref:
        description: Exact external public adopter commit for candidate qualification
        required: false
        default: ""
        type: string
      invocation-source-path:
        description: Public floating caller path retained by the external adopter
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      consumer:
        description: Stable lowercase public adopter identity
        required: true
        type: string
      input-path:
        description: Repository-relative public adopter delivery gate input
        required: true
        type: string
      consumer-repository:
        description: Exact external public adopter repository for candidate qualification
        required: false
        default: ""
        type: string
      consumer-ref:
        description: Exact external public adopter commit for candidate qualification
        required: false
        default: ""
        type: string
      invocation-source-path:
        description: Public floating caller path retained by the external adopter
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  consumer-admission:
    name: Admit floating-only v4 adopter
    runs-on: ubuntu-24.04
    outputs:
      receipt-root: ${{ steps.node.outputs.receipt-root }}
      consumer-source-sha: ${{ steps.node.outputs.consumer-source-sha }}
    steps:
      - name: Load the exact workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Validate exact adopter selection and floating consumer policy.
        id: node
        uses: ./.buildchain/workflow-shell/actions/adoption/admit-adopter
        with:
          request-json: ${{ toJSON(inputs) }}
          workflow-sha: ${{ job.workflow_sha }}
  conformance:
    name: Public adopter delivery (${{ matrix.platform }})
    needs: consumer-admission
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Load the exact workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Execute current failure, retry, exact readback and independent driver verification.
        id: node
        uses: ./.buildchain/workflow-shell/actions/adoption/qualify-adopter
        with:
          request-json: ${{ toJSON(inputs) }}
          workflow-sha: ${{ job.workflow_sha }}
          consumer-sha: ${{ needs.consumer-admission.outputs.consumer-source-sha }}
          platform: ${{ matrix.platform }}
  qualification:
    name: Reconcile exact three-platform qualification
    needs: conformance
    runs-on: ubuntu-24.04
    steps:
      - name: Load the exact workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Require exactly one consistent report for every declared platform.
        id: node
        uses: ./.buildchain/workflow-shell/actions/adoption/reconcile-adopters
        with:
          request-json: ${{ toJSON(inputs) }}
          workflow-sha: ${{ job.workflow_sha }}
