name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to dry-run. Defaults to the selected workflow ref.
        required: false
        default: ""
      run-check:
        description: Run the full Buildchain check before npm publish dry-run.
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  dry-run:
    name: Dry-run npm publish
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout dry-run ref
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Dry-run npm publish
        id: node
        uses: ./.buildchain/workflow-shell/actions/publication/npm-dry-run
        with:
          request-json: ${{ toJSON(inputs) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
