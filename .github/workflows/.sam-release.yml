on:
  workflow_call:
    inputs:
      aws-root:
        default: "aws-cn"
        type: string
        required: false
      aws-role:
        default: "github-actions-role-dev"
        type: string
        required: false
      aws-region:
        default: "cn-northwest-1"
        type: string
        required: false
      bucket-release:
        default: "kungfu-releases"
        type: string
        required: false
    secrets:
      AWS_ACCOUNT_ID:
        required: true

permissions: write-all

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: SAM release workflow retired
        run: |
          echo "::error::The workflows v2 SAM release path is retired."
          echo "::error::Do not use .sam-release.yml; use a project lifecycle.publish command behind release-candidate-promote.yml@v2 so publish-gate source-lock enforcement applies."
          exit 1
