name: Buildchain Auditable Demo
on:
  workflow_call:
    inputs:
      source-ref:
        description: Optional immutable consumer source ref; defaults to the caller event SHA
        default: ""
        type: string
        required: false
      source-artifact-name:
        description: Exact GitHub Artifact produced earlier in this caller run
        type: string
        required: true
      source-artifact-digest:
        description: Exact sha256 digest returned by upload-artifact for source-artifact-name
        type: string
        required: true
      adapter-path:
        description: Executable project-relative adapter; receives --artifact-root, --output, and
          --source-coordinate
        type: string
        required: true
      adapter-arguments-json:
        description: Optional bounded JSON argv suffix passed literally to the checked-in adapter;
          coordinate flags are reserved
        default: "[]"
        type: string
        required: false
      renderer-image:
        description: Immutable demo renderer image@sha256:digest coordinate
        type: string
        required: true
      render-media:
        description: Render the complete qualified scene after the required Gate passes
        default: false
        type: boolean
        required: false
      media-profile:
        description: "Buildchain-owned qualification profile: archive-v1, web-delivery-v1,
          responsive-web-delivery-v1, or site-hero-v1"
        default: archive-v1
        type: string
        required: false
      artifact-retention-days:
        default: 14
        type: number
        required: false
      require-trusted-event:
        default: true
        type: boolean
        required: false
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
    outputs:
      source-sha:
        description: Exact consumer source SHA evaluated by the Gate
        value: ${{ jobs.gate.outputs.source-sha }}
      gate-artifact-name:
        description: Content-addressed qualified Gate bundle name
        value: ${{ jobs.gate.outputs.gate-artifact-name }}
      gate-artifact-id:
        description: GitHub Artifact id for the qualified Gate bundle
        value: ${{ jobs.gate.outputs.gate-artifact-id }}
      gate-artifact-digest:
        description: GitHub Artifact archive digest for the qualified Gate bundle
        value: ${{ jobs.gate.outputs.gate-artifact-digest }}
      gate-artifact-url:
        description: GitHub Artifact URL for the qualified Gate bundle
        value: ${{ jobs.gate.outputs.gate-artifact-url }}
      gate-root:
        description: Deterministic member root of the qualified Gate bundle
        value: ${{ jobs.gate.outputs.gate-root }}
      media-artifact-name:
        description: Content-addressed rendered media bundle name; empty when render-media is false
        value: ${{ jobs.render.outputs.media-artifact-name }}
      media-artifact-id:
        description: GitHub Artifact id for the rendered media bundle
        value: ${{ jobs.render.outputs.media-artifact-id }}
      media-artifact-digest:
        description: GitHub Artifact archive digest for the rendered media bundle
        value: ${{ jobs.render.outputs.media-artifact-digest }}
      media-artifact-url:
        description: GitHub Artifact URL for the rendered media bundle
        value: ${{ jobs.render.outputs.media-artifact-url }}
      media-root:
        description: Deterministic member root of the rendered media bundle
        value: ${{ jobs.render.outputs.media-root }}
      media-profile:
        description: Exact Buildchain media qualification profile applied to the rendered bundle
        value: ${{ jobs.render.outputs.media-profile }}
      media-qualification-root:
        description: Content root of independently verified rendition facts and role mappings
        value: ${{ jobs.render.outputs.media-qualification-root }}
permissions:
  actions: read
  contents: read
concurrency:
  group: auditable-demo-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{
    inputs.source-artifact-digest }}
  cancel-in-progress: false
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  gate:
    name: Auditable demo / required Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source-sha: ${{ steps.node.outputs.source-sha }}
      gate-artifact-name: ${{ steps.node.outputs.gate-artifact-name }}
      gate-artifact-id: ${{ steps.node.outputs.gate-artifact-id }}
      gate-artifact-digest: ${{ steps.node.outputs.gate-artifact-digest }}
      gate-artifact-url: ${{ steps.node.outputs.gate-artifact-url }}
      gate-root: ${{ steps.node.outputs.gate-root }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Auditable demo / required Gate
        id: node
        uses: ./.buildchain/runtime/actions/build/demo/adapter-gate
        with:
          request-json: ${{ toJSON(inputs) }}
          workflow-sha: ${{ job.workflow_sha }}
    needs:
      - execution-runtime
  render:
    name: Auditable demo / selective render
    if: ${{ (inputs.render-media) }}
    needs:
      - gate
      - execution-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      media-artifact-name: ${{ steps.node.outputs.media-artifact-name }}
      media-artifact-id: ${{ steps.node.outputs.media-artifact-id }}
      media-artifact-digest: ${{ steps.node.outputs.media-artifact-digest }}
      media-artifact-url: ${{ steps.node.outputs.media-artifact-url }}
      media-root: ${{ steps.node.outputs.media-root }}
      media-profile: ${{ steps.node.outputs.media-profile }}
      media-qualification-root: ${{ steps.node.outputs.media-qualification-root }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Auditable demo / selective render
        id: node
        uses: ./.buildchain/runtime/actions/build/demo/adapter-render
        with:
          request-json: ${{ toJSON(inputs) }}
          workflow-sha: ${{ job.workflow_sha }}
          gate-artifact-name: ${{ needs.gate.outputs.gate-artifact-name }}
          gate-root: ${{ needs.gate.outputs.gate-root }}
          source-sha: ${{ needs.gate.outputs.source-sha }}
