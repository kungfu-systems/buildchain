name: Universal Bootstrap Self-Dogfood

on:
  workflow_dispatch:
    inputs:
      request-json:
        description: "Versioned universal request envelope"
        required: true
        type: string

permissions:
  actions: write
  artifact-metadata: write
  attestations: write
  checks: write
  contents: write
  deployments: write
  id-token: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  security-events: write
  statuses: write

jobs:
  public-bootstrap:
    name: Exercise the public consumer contract
    uses: kungfu-systems/buildchain/.github/workflows/bootstrap.yml@v4-alpha
    with:
      request-json: ${{ inputs.request-json }}
    secrets: inherit
