name: Buildchain Stable Candidate Qualification

on:
  workflow_run:
    workflows: ["Buildchain Alpha Self-Dogfood"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: "Successful public zero-input build run to qualify"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: buildchain-stable-candidate-qualification-${{ github.event.workflow_run.id || inputs.run-id }}
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BUILDCHAIN_QUALIFICATION_RUN_ID: ${{ github.event.workflow_run.id || inputs.run-id }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Resolve exact successful public build run
        id: source
        run: node scripts/stable-candidate-qualification.mjs resolve-public-build

      - name: Download exact public build summary
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ steps.source.outputs.artifact-name }}
          path: .buildchain/qualification/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}

      - name: Qualify observed alpha runtime and three-platform artifacts
        run: node scripts/stable-candidate-qualification.mjs qualify-public-build

      - name: Retain public build qualification
        uses: actions/upload-artifact@v7.0.0
        with:
          name: buildchain-public-build-qualification-${{ github.event.workflow_run.id || inputs.run-id }}
          path: .buildchain/qualification/result.json
          if-no-files-found: error
