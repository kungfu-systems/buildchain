name: Buildchain Stable Candidate Qualification
on:
  workflow_run:
    workflows:
      - Buildchain Alpha Self-Dogfood
    types:
      - completed
  workflow_dispatch:
    inputs:
      run-id:
        description: Successful public zero-input build run to qualify
        required: true
        type: string
permissions:
  actions: read
  contents: read
  statuses: write
concurrency:
  group: buildchain-stable-candidate-qualification-${{ github.event.workflow_run.id || inputs.run-id }}
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Execute stable-candidate-qualification-qualify
        id: node
        uses: ./.buildchain/workflow-shell/actions/release/candidate/qualify-stable
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
