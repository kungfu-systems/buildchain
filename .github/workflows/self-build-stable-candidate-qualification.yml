name: Buildchain Stable Candidate Qualification
on:
  workflow_run:
    workflows:
      - Buildchain Alpha Self-Dogfood
    types:
      - completed
  workflow_dispatch:
    inputs:
      run-id:
        description: Successful public zero-input build run to qualify
        required: true
        type: string
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
permissions:
  actions: read
  contents: read
  statuses: write
concurrency:
  group: buildchain-stable-candidate-qualification-${{ github.event.workflow_run.id || inputs.run-id }}
  cancel-in-progress: false
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
    timeout-minutes: 5
  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion ==
      'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
        id: source-checkout
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
        if: ${{ always() }}
      - name: Execute stable-candidate-qualification-qualify
        id: node
        uses: ./.buildchain/runtime/actions/release/candidate/qualify-stable
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
    needs:
      - execution-runtime
