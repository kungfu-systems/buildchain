name: Declarative Release Tail

on:
  workflow_call:
    inputs:
      universal-request-json:
        description: "Versioned exact-candidate request envelope; empty preserves the compatibility path"
        default: ""
        required: false
        type: string
      buildchain-ref:
        description: "Exact Buildchain SHA or qualified train ref"
        type: string
        required: true
      capsule-contract:
        description: "Compatibility input: must name the current source-bound v4 rehearsal capsule contract"
        type: string
        default: ""
        required: false
      capsule-path:
        description: "Compatibility alias for rehearsal-capsule-path"
        type: string
        default: ""
        required: false
      capsule-root:
        description: "Compatibility alias for candidate-root"
        type: string
        default: ""
        required: false
      evidence-path:
        description: "Compatibility alias for rehearsal-evidence-path"
        type: string
        default: ""
        required: false
      declaration-path:
        description: "Versioned release-tail declaration in the caller checkout"
        type: string
        required: false
      provider-bindings-path:
        description: "Legacy release-tail bindings, or an optional exact canonical match for capsule-bound rehearsal bindings"
        type: string
        required: false
      rehearsal-capsule-path:
        description: "Optional v4 Publication Rehearsal Capsule in the caller checkout"
        type: string
        default: ""
        required: false
      candidate-root:
        description: "Caller-relative Publication Rehearsal candidate root"
        type: string
        default: ".buildchain/publication-rehearsal/candidate"
        required: false
      rehearsal-mode:
        description: "Publication rehearsal mode: simulate, replay, or provider"
        type: string
        default: "simulate"
        required: false
      rehearsal-authority-path:
        description: "Caller-relative exact rehearsal-only authority for provider mode"
        type: string
        default: ""
        required: false
      rehearsal-evidence-path:
        description: "Rooted Publication Rehearsal evidence path"
        type: string
        default: ".buildchain/publication-rehearsal/evidence.json"
        required: false
      state-path:
        description: "Durable release-tail transaction path"
        type: string
        default: ".buildchain/release-tail/state.json"
        required: false
      execute:
        description: "Execute provider effects; false only seals the plan"
        type: boolean
        default: true
        required: false
    secrets:
      http-token:
        description: "Optional bearer token for built-in HTTPS mutation adapters"
        required: false
    outputs:
      transaction-state:
        description: "Final transaction state"
        value: ${{ jobs.release-tail.outputs.transaction-state }}
      transaction-root:
        description: "Stable declared transaction root"
        value: ${{ jobs.release-tail.outputs.transaction-root }}
      state-root:
        description: "Root of the final durable state"
        value: ${{ jobs.release-tail.outputs.state-root }}
      rehearsal-evidence-root:
        description: "Root of non-authoritative Publication Rehearsal evidence"
        value: ${{ jobs.release-tail.outputs.rehearsal-evidence-root }}
      binding-root:
        description: "Compatibility output bound to the exact v4 capsule root"
        value: ${{ jobs.release-tail.outputs.binding-root }}
      evidence-root:
        description: "Compatibility alias for rehearsal-evidence-root"
        value: ${{ jobs.release-tail.outputs.evidence-root }}

# Permission-neutral: production callers grant provider authority explicitly.

jobs:
  universal-bootstrap:
    name: Universal exact-candidate execution
    if: ${{ inputs.universal-request-json != '' }}
    uses: kungfu-systems/buildchain/.github/workflows/bootstrap.yml@v4
    with:
      request-json: ${{ inputs.universal-request-json }}

  release-tail:
    if: ${{ inputs.universal-request-json == '' }}
    name: Execute Buildchain release tail
    runs-on: ubuntu-24.04
    outputs:
      transaction-state: ${{ steps.release-tail.outputs.transaction-state }}
      transaction-root: ${{ steps.release-tail.outputs.transaction-root }}
      state-root: ${{ steps.release-tail.outputs.state-root }}
      rehearsal-evidence-root: ${{ steps.release-tail.outputs.rehearsal-evidence-root }}
      binding-root: ${{ steps.release-tail.outputs.binding-root }}
      evidence-root: ${{ steps.release-tail.outputs.evidence-root }}
    steps:
      - name: Check out caller source
        uses: actions/checkout@v7.0.0

      - name: Check out exact Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ inputs.buildchain-ref }}
          path: .buildchain/release-tail-runtime
          persist-credentials: false

      - name: Execute the declarative provider plane
        id: release-tail
        uses: ./.buildchain/release-tail-runtime/actions/release-tail
        with:
          declaration: ${{ inputs.declaration-path }}
          provider-bindings: ${{ inputs.provider-bindings-path }}
          capsule-contract: ${{ inputs.capsule-contract }}
          rehearsal-capsule: ${{ inputs.rehearsal-capsule-path || inputs.capsule-path }}
          candidate-root: ${{ github.workspace }}/${{ inputs.candidate-root || inputs.capsule-root }}
          rehearsal-mode: ${{ inputs.rehearsal-mode }}
          rehearsal-authority: ${{ inputs.rehearsal-authority-path }}
          rehearsal-evidence-path: ${{ inputs.rehearsal-evidence-path || inputs.evidence-path }}
          state-path: ${{ inputs.state-path }}
          github-token: ${{ github.token }}
          http-token: ${{ secrets.http-token }}
          execute: ${{ inputs.execute }}

      - name: Retain the rooted transaction and receipts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-release-tail-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ inputs.state-path }}
            ${{ inputs.rehearsal-evidence-path || inputs.evidence-path }}
