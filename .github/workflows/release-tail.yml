name: Declarative Release Tail

on:
  workflow_call:
    inputs:
      buildchain-ref:
        description: "Exact Buildchain SHA or qualified train ref"
        type: string
        required: true
      capsule-contract:
        description: "Exact publication rehearsal capsule contract"
        type: string
        required: true
      capsule-path:
        description: "Content-addressed publication rehearsal capsule in the caller checkout"
        type: string
        required: true
      capsule-root:
        description: "Explicit repository-relative root containing capsule-bound files"
        type: string
        required: true
      state-path:
        description: "Durable release-tail transaction path"
        type: string
        default: ".buildchain/release-tail/state.json"
        required: false
      evidence-path:
        description: "Provider-recording rehearsal evidence path"
        type: string
        default: ".buildchain/publication/rehearsal-evidence.json"
        required: false
    secrets:
      http-token:
        description: "Optional bearer token for built-in HTTPS mutation adapters"
        required: false
    outputs:
      transaction-state:
        description: "Final transaction state"
        value: ${{ jobs.release-tail.outputs.transaction-state }}
      transaction-root:
        description: "Stable declared transaction root"
        value: ${{ jobs.release-tail.outputs.transaction-root }}
      state-root:
        description: "Root of the final durable state"
        value: ${{ jobs.release-tail.outputs.state-root }}
      binding-root:
        description: "Stable capsule and release-tail binding root"
        value: ${{ jobs.release-tail.outputs.binding-root }}
      evidence-root:
        description: "Stable provider-recording evidence root"
        value: ${{ jobs.release-tail.outputs.evidence-root }}

permissions:
  contents: write

jobs:
  release-tail:
    name: Execute Buildchain release tail
    runs-on: ubuntu-24.04
    outputs:
      transaction-state: ${{ steps.release-tail.outputs.transaction-state }}
      transaction-root: ${{ steps.release-tail.outputs.transaction-root }}
      state-root: ${{ steps.release-tail.outputs.state-root }}
      binding-root: ${{ steps.release-tail.outputs.binding-root }}
      evidence-root: ${{ steps.release-tail.outputs.evidence-root }}
    steps:
      - name: Check out caller source
        uses: actions/checkout@v7.0.0

      - name: Check out exact Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ inputs.buildchain-ref }}
          path: .buildchain/release-tail-runtime
          persist-credentials: false

      - name: Execute the declarative provider plane
        id: release-tail
        uses: ./.buildchain/release-tail-runtime/actions/release-tail
        with:
          capsule-contract: ${{ inputs.capsule-contract }}
          capsule: ${{ github.workspace }}/${{ inputs.capsule-path }}
          capsule-root: ${{ github.workspace }}/${{ inputs.capsule-root }}
          state-path: ${{ github.workspace }}/${{ inputs.state-path }}
          evidence-path: ${{ github.workspace }}/${{ inputs.evidence-path }}
          github-token: ${{ github.token }}
          http-token: ${{ secrets.http-token }}

      - name: Retain the rooted transaction and receipts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-release-tail-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ inputs.state-path }}
            ${{ inputs.evidence-path }}
