name: Buildchain Publication Artifact
on:
  workflow_call:
    inputs:
      buildchain-repository:
        default: kungfu-systems/buildchain
        type: string
        required: false
      buildchain-ref:
        description: Optional explicit runtime ref. Empty binds the defining workflow SHA.
        default: ""
        type: string
        required: false
      buildchain-contract-lock-path:
        description: Consumer-owned Buildchain contract lock path
        default: .buildchain/contract-lock.json
        type: string
        required: false
      buildchain-alpha-contract-lock-path:
        description: Consumer-owned alpha contract lock required by v4 consumer admission
        default: .buildchain/alpha-contract-lock.json
        type: string
        required: false
      buildchain-stable-contract-lock-path:
        description: Consumer-owned stable contract lock required by v4 consumer admission
        default: .buildchain/contract-lock.json
        type: string
        required: false
      buildchain-contract-compatibility-policy:
        description: "Contract compatibility policy: major-compatible, allow-additive, or exact"
        default: major-compatible
        type: string
        required: false
      buildchain-contract-drift-issue-mode:
        description: "Consumer issue behavior for Buildchain floating-ref contract drift: off, breaking-only, or compatible-and-breaking"
        default: compatible-and-breaking
        type: string
        required: false
      working-directory:
        default: .
        type: string
        required: false
      setup-node:
        default: true
        type: boolean
        required: false
      node-version:
        default: "24"
        type: string
        required: false
      build-command:
        default: make pdf
        type: string
        required: false
      toolchain-type:
        description: "Publication build toolchain: config, custom-command, or latex-docker. config reads [publication.toolchain]."
        default: config
        type: string
        required: false
      toolchain-image:
        description: Container image for latex-docker toolchain, without digest. Defaults to the Buildchain paper LaTeX builder.
        default: ghcr.io/kungfu-systems/build-images/latex-pdf-builder
        type: string
        required: false
      toolchain-digest:
        description: sha256:<digest> for the latex-docker toolchain image.
        default: sha256:c20f3809e96836c1c78e97c76939d12f1de3fed0ea9b7c40c43332ec2ea480f8
        type: string
        required: false
      toolchain-command:
        description: Command run by the declared publication toolchain. For custom-command this overrides build-command.
        default: ""
        type: string
        required: false
      verify-command:
        default: make check
        type: string
        required: false
      artifact-name:
        default: publication-artifact
        type: string
        required: false
      artifact-paths:
        default: |
          _build/main.pdf
          .buildchain/publication/publication-artifact.json
          .buildchain/publication/publication-artifact-passport.json
          .buildchain/publication/publication-registry.json
          .buildchain/publication/source.tar.gz
        type: string
        required: false
      artifact-retention-days:
        default: 30
        type: number
        required: false
      prepare-paper-package:
        description: Prepare the deterministic npm paper package inside the read-only publication candidate
        default: false
        type: boolean
        required: false
      package-name:
        description: Optional npm package name override
        default: ""
        type: string
        required: false
      publish-dist-tag:
        description: Expected npm distribution tag; empty derives alpha/latest from target-ref
        default: ""
        type: string
        required: false
      target-ref:
        description: Protected publication channel ref
        default: ""
        type: string
        required: false
    outputs:
      publication-artifact-name:
        description: Uploaded publication artifact name
        value: ${{ jobs.publication.outputs.publication-artifact-name }}
      publication-manifest-path:
        description: Generated publication manifest path
        value: ${{ jobs.publication.outputs.publication-manifest-path }}
      publication-passport-path:
        description: Generated publication passport path
        value: ${{ jobs.publication.outputs.publication-passport-path }}
      publication-registry-path:
        description: Generated publication archive registry path when archive config is present
        value: ${{ jobs.publication.outputs.publication-registry-path }}
      publication-manifest-json:
        description: Compact publication manifest JSON
        value: ${{ jobs.publication.outputs.publication-manifest-json }}
      controller-plan-artifact:
        description: Controller plan artifact name
        value: ${{ jobs.publication.outputs.controller-plan-artifact }}
      controller-plan-json:
        description: Compact controller plan JSON
        value: ${{ jobs.publication.outputs.controller-plan-json }}
      controller-plan-digest:
        description: Controller plan digest
        value: ${{ jobs.publication.outputs.controller-plan-digest }}
      controller-receipt-artifact:
        description: Controller receipt artifact name
        value: ${{ jobs.publication.outputs.controller-receipt-artifact }}
      controller-receipt-json:
        description: Compact controller receipt JSON
        value: ${{ jobs.publication.outputs.controller-receipt-json }}
      controller-receipt-digest:
        description: Controller receipt digest
        value: ${{ jobs.publication.outputs.controller-receipt-digest }}
      controller-receipt-status:
        description: Controller receipt status
        value: ${{ jobs.publication.outputs.controller-receipt-status }}
      runtime-sha:
        description: Exact resolved Buildchain runtime SHA
        value: ${{ jobs.publication.outputs.runtime-sha }}
      package-name:
        description: Prepared npm package name
        value: ${{ jobs.publication.outputs.package-name }}
      package-version:
        description: Prepared npm package version
        value: ${{ jobs.publication.outputs.package-version }}
      publish-dist-tag:
        description: Prepared npm distribution tag
        value: ${{ jobs.publication.outputs.publish-dist-tag }}
permissions:
  contents: read
  issues: write
jobs:
  publication:
    name: Build publication artifact
    runs-on: ubuntu-24.04
    outputs:
      publication-artifact-name: ${{ steps.collect-candidate.outputs.publication-artifact-name }}
      publication-manifest-path: ${{ steps.build-candidate.outputs.publication-manifest-path }}
      publication-passport-path: ${{ steps.build-candidate.outputs.publication-passport-path }}
      publication-registry-path: ${{ steps.build-candidate.outputs.publication-registry-path }}
      publication-manifest-json: ${{ steps.build-candidate.outputs.publication-manifest-json }}
      controller-plan-artifact: ${{ steps.plan-candidate.outputs.controller-plan-artifact }}
      controller-plan-json: ${{ steps.plan-candidate.outputs.controller-plan-json }}
      controller-plan-digest: ${{ steps.plan-candidate.outputs.controller-plan-digest }}
      controller-receipt-artifact: ${{ steps.plan-candidate.outputs.controller-receipt-artifact }}
      controller-receipt-json: ${{ steps.collect-candidate.outputs.controller-receipt-json }}
      controller-receipt-digest: ${{ steps.collect-candidate.outputs.controller-receipt-digest }}
      controller-receipt-status: ${{ steps.collect-candidate.outputs.controller-receipt-status }}
      runtime-sha: ${{ steps.plan-candidate.outputs.runtime-sha }}
      package-name: ${{ steps.build-candidate.outputs.package-name }}
      package-version: ${{ steps.build-candidate.outputs.package-version }}
      publish-dist-tag: ${{ steps.build-candidate.outputs.publish-dist-tag }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Admit publication runtime
        id: runtime
        uses: ./.buildchain/workflow-shell/actions/runtime/selection/admit
        with:
          purpose: publication
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref }}
          workflow-sha: ${{ job.workflow_sha }}
          workflow-ref: ${{ job.workflow_ref }}
          token: ${{ github.token }}
      - name: Checkout source
        id: source
        uses: actions/checkout@v7.0.0
        with:
          clean: true
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Publication plan candidate.
        id: plan-candidate
        uses: ./.buildchain/workflow-shell/actions/publication/candidate/plan
        with:
          request-json: ${{ toJSON(inputs) }}
          workflow-sha: ${{ job.workflow_sha }}
          workflow-ref: ${{ job.workflow_ref }}
          runtime-sha: ${{ steps.runtime.outputs.runtime-sha }}
          runtime-ref: ${{ steps.runtime.outputs.runtime-ref }}
          runtime-class: ${{ steps.runtime.outputs.runtime-class }}
          runtime-override: ${{ steps.runtime.outputs.runtime-override }}
          source-checkout-outcome: ${{ steps.source.outcome }}
        if: ${{ always() }}
      - name: Publication build candidate.
        id: build-candidate
        uses: ./.buildchain/workflow-shell/actions/publication/candidate/build
        with:
          request-json: ${{ toJSON(inputs) }}
          runtime-sha: ${{ steps.plan-candidate.outputs.runtime-sha }}
      - name: Publication collect candidate.
        id: collect-candidate
        uses: ./.buildchain/workflow-shell/actions/publication/candidate/collect
        with:
          request-json: ${{ toJSON(inputs) }}
          runtime-outcome: ${{ steps.runtime.outcome }}
          controller-plan-outcome: ${{ steps.plan-candidate.outputs.controller-plan-outcome }}
          runtime-checkout-outcome: ${{ steps.plan-candidate.outputs.runtime-checkout-outcome }}
          controller-identities-outcome: ${{ steps.plan-candidate.outputs.controller-identities-outcome }}
          outcomes-json: ${{ steps.build-candidate.outputs.outcomes-json }}
          manifest-path: ${{ steps.build-candidate.outputs.publication-manifest-path }}
          passport-path: ${{ steps.build-candidate.outputs.publication-passport-path }}
          source-sha: ${{ steps.plan-candidate.outputs.controller-identities-outputs-source-sha }}
          predecessors-ok: ${{ steps.plan-candidate.outcome == 'success' && steps.build-candidate.outcome == 'success' }}
        if: ${{ always() }}
