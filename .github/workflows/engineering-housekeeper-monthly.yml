name: Engineering Housekeeper Monthly

on:
  schedule:
    - cron: "31 4 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Report by default; apply also requires apply-enabled."
        type: choice
        options: [report, apply]
        default: report
      apply-enabled:
        description: "Explicit positive mutation gate."
        type: boolean
        default: false
      buildchain-ref:
        description: "Temporary runtime ref for trusted qualification."
        type: string
        default: ""

permissions: {}

jobs:
  invalid-apply-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && !inputs.apply-enabled }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: |
          echo "::error::apply mode requires apply-enabled=true"
          exit 1

  report:
    if: ${{ github.event_name == 'schedule' || inputs.mode != 'apply' }}
    uses: ./.github/workflows/engineering-housekeeper.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      target-branch: dev/v3/v3.0
      mode: report
      stale-days: 60
      max-actions: 50
      buildchain-ref: ${{ inputs.buildchain-ref || 'v3-alpha' }}

  apply:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.apply-enabled }}
    uses: ./.github/workflows/engineering-housekeeper.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      target-branch: dev/v3/v3.0
      mode: apply
      apply-enabled: true
      stale-days: 60
      max-actions: 50
      buildchain-ref: ${{ inputs.buildchain-ref || 'v3-alpha' }}
