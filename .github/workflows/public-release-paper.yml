name: Buildchain Paper Release
on:
  workflow_call:
    inputs:
      buildchain-repository:
        default: kungfu-systems/buildchain
        type: string
        required: false
      buildchain-ref:
        description: Optional explicit runtime ref. Empty binds the defining workflow SHA.
        default: ""
        type: string
        required: false
      buildchain-contract-lock-path:
        default: .buildchain/contract-lock.json
        type: string
        required: false
      working-directory:
        default: .
        type: string
        required: false
      toolchain-type:
        default: config
        type: string
        required: false
      verify-command:
        default: make check
        type: string
        required: false
      package-name:
        default: ""
        type: string
        required: false
      publish-dist-tag:
        default: ""
        type: string
        required: false
      target-ref:
        default: ""
        type: string
        required: false
      target-sha:
        default: ""
        type: string
        required: false
      publisher-workflow-path:
        description: Repository-local workflow path configured as the npm trusted publisher
        default: .github/workflows/public-release-paper.yml
        type: string
        required: false
      artifact-name:
        default: paper-publication
        type: string
        required: false
      artifact-paths:
        description: Declared release assets in addition to Buildchain publication evidence and npm package bytes
        default: _build/*.pdf
        type: string
        required: false
      artifact-retention-days:
        default: 30
        type: number
        required: false
      required-status-check:
        default: check / check
        type: string
        required: false
      branch-protection-bypass-apps:
        default: github-actions
        type: string
        required: false
      github-release:
        default: true
        type: boolean
        required: false
      release-passport-output-dir:
        default: .buildchain/release-passport
        type: string
        required: false
      release-passport-product-name:
        default: ""
        type: string
        required: false
      release-passport-impact-json:
        default: ""
        type: string
        required: false
      github-governance-receipt-json:
        description: Fresh qualifying governance receipt for the exact publication repository and target ref
        default: ""
        type: string
        required: false
      dry-run:
        default: false
        type: boolean
        required: false
    secrets:
      KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY:
        description: Private key for the dedicated read-only GitHub governance auditor App
        required: false
      BUILDCHAIN_GENERATED_WRITE_APP_CLIENT_ID:
        description: Preferred GitHub App client ID for generated repository writes
        required: false
      BUILDCHAIN_GENERATED_WRITE_APP_PRIVATE_KEY:
        description: Preferred GitHub App private key for generated repository writes
        required: false
      BUILDCHAIN_GENERATED_WRITE_TOKEN:
        description: Equivalent narrow token fallback for generated repository writes
        required: false
    outputs:
      package-name:
        value: ${{ jobs.publication-candidate.outputs.package-name }}
      package-version:
        value: ${{ jobs.publication-candidate.outputs.package-version }}
      public-release-tag:
        value: ${{ jobs.publish.outputs.public-release-tag }}
      release-passport-path:
        value: ${{ jobs.publish.outputs.release-passport-path }}
      github-release-url:
        value: ${{ jobs.publish.outputs.github-release-url }}
      upstream-release-json:
        description: Exact post-publication release envelope for downstream propagation
        value: ${{ jobs.publish.outputs.upstream-release-json }}
      propagation-work-artifact:
        description: Artifact containing one paused typed propagation work unit per configured downstream target
        value: ${{ jobs.publish.outputs.propagation-work-artifact }}
      controller-plan-json:
        description: Paper publication controller plan json
        value: ${{ jobs.publish.outputs.controller-plan-json }}
      controller-plan-digest:
        description: Paper publication controller plan digest
        value: ${{ jobs.publish.outputs.controller-plan-digest }}
      controller-plan-artifact:
        description: Paper publication controller plan artifact
        value: ${{ jobs.publish.outputs.controller-plan-artifact }}
      controller-receipt-json:
        description: Paper publication controller receipt json
        value: ${{ jobs.publish.outputs.controller-receipt-json }}
      controller-receipt-digest:
        description: Paper publication controller receipt digest
        value: ${{ jobs.publish.outputs.controller-receipt-digest }}
      controller-receipt-artifact:
        description: Paper publication controller receipt artifact
        value: ${{ jobs.publish.outputs.controller-receipt-artifact }}
      controller-receipt-status:
        description: Paper publication controller receipt status
        value: ${{ jobs.publish.outputs.controller-receipt-status }}
permissions:
  contents: read
jobs:
  publication-candidate:
    name: Build read-only paper publication candidate
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/public-build-publication.yml
    with:
      buildchain-repository: ${{ inputs.buildchain-repository }}
      buildchain-ref: ${{ inputs.buildchain-ref }}
      buildchain-contract-lock-path: ${{ inputs.buildchain-contract-lock-path }}
      working-directory: ${{ inputs.working-directory }}
      toolchain-type: ${{ inputs.toolchain-type }}
      verify-command: ${{ inputs.verify-command }}
      prepare-paper-package: true
      package-name: ${{ inputs.package-name }}
      publish-dist-tag: ${{ inputs.publish-dist-tag }}
      target-ref: ${{ inputs.target-ref || github.ref_name }}
      artifact-name: ${{ inputs.artifact-name }}
      artifact-paths: ${{ inputs.artifact-paths }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
  publication-authority:
    name: Seal exact paper publication capability
    needs: publication-candidate
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/.release-authority.yml
    with:
      buildchain-repository: ${{ inputs.buildchain-repository }}
      buildchain-ref: ${{ needs.publication-candidate.outputs.runtime-sha }}
      github-governance-receipt-json: ${{ inputs.github-governance-receipt-json }}
      auto-admission: true
      auto-admission-kind: publication-artifact
      authority-workflow-path: .github/workflows/public-release-paper.yml
      source-sha: ${{ inputs.target-sha || github.sha }}
      target-ref: ${{ inputs.target-ref || github.ref_name }}
      publisher-workflow-path: ${{ inputs.publisher-workflow-path }}
      required-status-check: ${{ inputs.required-status-check }}
      product: ${{ inputs.release-passport-product-name || needs.publication-candidate.outputs.package-name }}
      publication-target: npm:${{ needs.publication-candidate.outputs.package-name }}
      publication-version: ${{ needs.publication-candidate.outputs.package-version }}
      package-name: ${{ needs.publication-candidate.outputs.package-name }}
      evidence-repository: ${{ github.repository }}
      evidence-run-id: ${{ github.run_id }}
      evidence-publication-artifact: ${{ needs.publication-candidate.outputs.publication-artifact-name }}
      evidence-controller-artifact: ${{ needs.publication-candidate.outputs.controller-receipt-artifact }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
  publish:
    name: Publish admitted paper candidate
    needs:
      - publication-candidate
      - publication-authority
    if: ${{ !inputs.dry-run && needs.publication-authority.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    outputs:
      package-name: ${{ steps.admit-candidate.outputs.package-name }}
      package-version: ${{ steps.admit-candidate.outputs.package-version }}
      public-release-tag: ${{ steps.publish-candidate.outputs.public-release-tag }}
      release-passport-path: ${{ steps.publish-candidate.outputs.release-passport-path }}
      github-release-url: ${{ steps.publish-candidate.outputs.github-release-url }}
      upstream-release-json: ${{ steps.settle-publication.outputs.upstream-release-json }}
      propagation-work-artifact: ${{ steps.settle-publication.outputs.propagation-work-artifact }}
      controller-plan-json: ${{ steps.admit-candidate.outputs.controller-plan-json }}
      controller-plan-digest: ${{ steps.admit-candidate.outputs.controller-plan-digest }}
      controller-plan-artifact: ${{ steps.admit-candidate.outputs.controller-plan-artifact }}
      controller-receipt-json: ${{ steps.settle-publication.outputs.controller-receipt-json }}
      controller-receipt-digest: ${{ steps.settle-publication.outputs.controller-receipt-digest }}
      controller-receipt-artifact: ${{ steps.settle-publication.outputs.controller-receipt-artifact }}
      controller-receipt-status: ${{ steps.settle-publication.outputs.controller-receipt-status }}
    steps:
      - name: Checkout exact admitted source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          clean: true
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Paper admit candidate.
        id: admit-candidate
        uses: ./.buildchain/workflow-shell/actions/paper/admit-candidate
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-publication-candidate-outputs-runtime-sha: ${{ toJSON(needs.publication-candidate.outputs.runtime-sha) }}
          secrets-buildchain-generated-write-app-client-id: ${{ secrets.BUILDCHAIN_GENERATED_WRITE_APP_CLIENT_ID }}
          secrets-buildchain-generated-write-app-private-key: ${{ secrets.BUILDCHAIN_GENERATED_WRITE_APP_PRIVATE_KEY }}
          secrets-buildchain-generated-write-token: ${{ secrets.BUILDCHAIN_GENERATED_WRITE_TOKEN }}
          needs-publication-candidate-outputs-publication-artifact-name: ${{ toJSON(needs.publication-candidate.outputs.publication-artifact-name) }}
          needs-publication-candidate-outputs-controller-receipt-artifact: ${{ toJSON(needs.publication-candidate.outputs.controller-receipt-artifact) }}
          needs-publication-authority-outputs-capability-json: ${{ toJSON(needs.publication-authority.outputs.capability-json) }}
          needs-publication-candidate-outputs-package-name: ${{ toJSON(needs.publication-candidate.outputs.package-name) }}
          needs-publication-candidate-outputs-package-version: ${{ toJSON(needs.publication-candidate.outputs.package-version) }}
          needs-publication-candidate-outputs-publish-dist-tag: ${{ toJSON(needs.publication-candidate.outputs.publish-dist-tag) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
      - name: Paper publish candidate.
        id: publish-candidate
        uses: ./.buildchain/workflow-shell/actions/paper/publish-candidate
        with:
          request-json: ${{ toJSON(inputs) }}
          secrets-buildchain-generated-write-token: ${{ secrets.BUILDCHAIN_GENERATED_WRITE_TOKEN }}
          core-node-outputs-node-path: ${{ steps.admit-candidate.outputs.core-node-outputs-node-path }}
          generated-write-app-token-outputs-token: ${{ steps.admit-candidate.outputs.generated-write-app-token-outputs-token }}
          candidate-outputs-package-version: ${{ steps.admit-candidate.outputs.candidate-outputs-package-version }}
          candidate-outputs-exact-tag: ${{ steps.admit-candidate.outputs.candidate-outputs-exact-tag }}
          candidate-outputs-package-dir: ${{ steps.admit-candidate.outputs.candidate-outputs-package-dir }}
          candidate-outputs-sealed-bundle-root: ${{ steps.admit-candidate.outputs.candidate-outputs-sealed-bundle-root }}
          candidate-outputs-sealed-bundle-manifest: ${{ steps.admit-candidate.outputs.candidate-outputs-sealed-bundle-manifest }}
          candidate-outputs-required-artifacts-json: ${{ steps.admit-candidate.outputs.candidate-outputs-required-artifacts-json }}
          candidate-outputs-dist-tag: ${{ steps.admit-candidate.outputs.candidate-outputs-dist-tag }}
          candidate-outputs-package-name: ${{ steps.admit-candidate.outputs.candidate-outputs-package-name }}
          candidate-outputs-build-summary-path: ${{ steps.admit-candidate.outputs.candidate-outputs-build-summary-path }}
          candidate-outputs-manifest-path: ${{ steps.admit-candidate.outputs.candidate-outputs-manifest-path }}
          candidate-outputs-github-release-artifact-paths: ${{ steps.admit-candidate.outputs.candidate-outputs-github-release-artifact-paths }}
      - name: Paper settle publication.
        id: settle-publication
        uses: ./.buildchain/workflow-shell/actions/paper/settle-publication
        with:
          request-json: ${{ toJSON(inputs) }}
          secrets-buildchain-generated-write-token: ${{ secrets.BUILDCHAIN_GENERATED_WRITE_TOKEN }}
          promote-outcome: ${{ steps.publish-candidate.outputs.promote-outcome }}
          candidate-outputs-package-name: ${{ steps.admit-candidate.outputs.candidate-outputs-package-name }}
          candidate-outputs-package-version: ${{ steps.admit-candidate.outputs.candidate-outputs-package-version }}
          promote-outputs-public-release-tag: ${{ steps.publish-candidate.outputs.promote-outputs-public-release-tag }}
          target-outputs-sha: ${{ steps.publish-candidate.outputs.target-outputs-sha }}
          target-outputs-channel: ${{ steps.publish-candidate.outputs.target-outputs-channel }}
          promote-outputs-release-passport-path: ${{ steps.publish-candidate.outputs.promote-outputs-release-passport-path }}
          core-node-outputs-node-path: ${{ steps.admit-candidate.outputs.core-node-outputs-node-path }}
          controller-plan-outcome: ${{ steps.admit-candidate.outputs.controller-plan-outcome }}
          publish-outcome: ${{ steps.publish-candidate.outcome }}
          candidate-outputs-manifest-path: ${{ steps.admit-candidate.outputs.candidate-outputs-manifest-path }}
        if: ${{ always() }}
