name: Buildchain Stable Candidate Qualification

on:
  workflow_run:
    workflows: ["Buildchain Alpha Self-Dogfood"]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: "Exact alpha commit SHA to qualify"
        required: true
        type: string
      canary-ref:
        description: "Optional consumer branch or tag for outer-workflow bootstrap qualification"
        required: false
        default: ""
        type: string
      canary-sha:
        description: "Exact commit SHA that canary-ref must resolve to"
        required: false
        default: ""
        type: string
      dry-run:
        description: "Plan missing evidence without dispatch or attestation"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: buildchain-stable-candidate-qualification-${{ github.event.workflow_run.id || inputs.candidate-sha }}
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Download exact self-dogfood evidence
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-v3-alpha-self-dogfood-evidence
          path: .buildchain/qualification/self-dogfood
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Resolve exact alpha candidate
        id: candidate
        run: node scripts/stable-candidate-qualification.mjs
        env:
          BUILDCHAIN_QUALIFICATION_RESOLVE_CANDIDATE: "true"
          BUILDCHAIN_QUALIFICATION_EVENT_NAME: ${{ github.event_name }}
          BUILDCHAIN_QUALIFICATION_INPUT_CANDIDATE_SHA: ${{ inputs.candidate-sha || '' }}
          BUILDCHAIN_QUALIFICATION_SELF_DOGFOOD_EVIDENCE: .buildchain/qualification/self-dogfood/evidence.json

      - name: Produce exact-alpha qualification evidence
        run: node scripts/stable-candidate-qualification.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
          BUILDCHAIN_QUALIFICATION_ATTESTATION_TOKEN: ${{ github.token }}
          BUILDCHAIN_QUALIFICATION_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          BUILDCHAIN_QUALIFICATION_CANARY_REF: ${{ inputs.canary-ref || '' }}
          BUILDCHAIN_QUALIFICATION_CANARY_SHA: ${{ inputs.canary-sha || '' }}
          BUILDCHAIN_QUALIFICATION_DRY_RUN: ${{ inputs.dry-run || false }}
