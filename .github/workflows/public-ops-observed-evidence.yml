name: Patrol Observed Evidence
on:
  workflow_call:
    inputs:
      buildchain-ref:
        type: string
        default: ""
        required: false
        description: Optional explicit runtime ref. Empty binds the defining workflow SHA.
      build-command:
        type: string
        required: true
      verify-command:
        type: string
        required: true
      artifact-path:
        type: string
        required: true
      manifest-path:
        type: string
        required: true
      evidence-source-repository:
        type: string
        default: ""
        required: false
      evidence-source-ref:
        type: string
        default: ""
        required: false
      evidence-source-path:
        type: string
        default: .observed-evidence/source
        required: false
      production-aws-role-arn:
        type: string
        required: true
      production-bucket:
        type: string
        required: true
      cloudfront-distribution:
        type: string
        required: false
        default: ""
      production-environment:
        type: string
        required: false
        default: production
    outputs:
      receipt-path:
        value: ${{ jobs.publish.outputs.receipt-path }}
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.production-environment }}
    concurrency:
      group: observed-evidence-${{ github.repository }}-${{ inputs.production-bucket }}
      cancel-in-progress: false
    outputs:
      receipt-path: ${{ steps.node.outputs.receipt-path }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Admit evidence publisher
        uses: ./.buildchain/workflow-shell/actions/observability/admit-evidence-publisher
      - name: Checkout caller default branch
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Execute observed-evidence-publish
        id: node
        uses: ./.buildchain/workflow-shell/actions/observability/publish-evidence
        with:
          runtime-ref: ${{ inputs.buildchain-ref || job.workflow_sha }}
          request-json: ${{ toJSON(inputs) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
