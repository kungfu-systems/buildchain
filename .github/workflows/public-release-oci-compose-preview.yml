name: Buildchain OCI Compose Preview
on:
  workflow_call:
    secrets:
      BUILDCHAIN_PROMOTION_TOKEN:
        required: true
    inputs:
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: buildchain-oci-compose-preview-${{ github.repository }}
  cancel-in-progress: false
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  promote:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Execute oci-compose-preview-promote
        id: node
        uses: ./.buildchain/runtime/actions/publication/oci/promote-preview
        with:
          workflow-sha: ${{ job.workflow_sha }}
          promotion-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
    needs:
      - execution-runtime
