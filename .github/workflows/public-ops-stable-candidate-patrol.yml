name: Buildchain Stable Candidate Patrol
on:
  workflow_call:
    inputs:
      target-branch:
        description: Stable release branch. Empty maps the caller dev/vN/vN.M branch to release/vN/vN.M.
        default: ""
        type: string
        required: false
      ledger-ref:
        description: Durable machine branch for the candidate ledger. Empty derives it from the release line.
        default: ""
        type: string
        required: false
      minimum-soak-seconds:
        description: Minimum interval after the final required check
        default: 0
        type: number
        required: false
      required-checks:
        description: Comma/newline separated commit status contexts or check-run names; alpha-release is the
          prerelease publication fact
        default: ""
        type: string
        required: false
      revoked-versions:
        description: Exact alpha versions explicitly revoked by repository policy
        default: ""
        type: string
        required: false
      revoke-reason:
        description: Auditable reason applied to revoked versions
        default: repository-policy-revocation
        type: string
        required: false
      hold:
        description: Hold scheduled stable selection for the whole repository
        default: false
        type: boolean
        required: false
      hold-reason:
        description: Auditable repository hold reason
        default: ""
        type: string
        required: false
      release-now:
        description: Exact alpha version selected by explicit human authority; bypasses schedule/soak but
          not revocation or source identity
        default: ""
        type: string
        required: false
      auto-promote:
        description: Create the exact source-lock stable PR for the selected candidate
        default: false
        type: boolean
        required: false
      auto-merge:
        description: Enable GitHub auto-merge on the generated stable PR
        default: false
        type: boolean
        required: false
      merge-method:
        description: "GitHub auto-merge method: merge, squash, or rebase"
        default: merge
        type: string
        required: false
      auto-approve:
        description: Approve the generated PR with an independent approval token, or the caller github.token
          when repository policy permits
        default: false
        type: boolean
        required: false
      dry-run:
        description: Evaluate only; do not persist the ledger or create refs/PRs
        default: true
        type: boolean
        required: false
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
    secrets:
      promotion-token:
        description: Repository-owned token used for durable ledger, source-lock branch and PR writes
        required: false
      approval-token:
        description: Independent repository-owned token used only to approve the generated PR
        required: false
    outputs:
      result-path:
        value: ${{ jobs.patrol.outputs.result-path }}
      selected:
        value: ${{ jobs.patrol.outputs.selected }}
      selected-version:
        value: ${{ jobs.patrol.outputs.selected-version }}
      selected-sha:
        value: ${{ jobs.patrol.outputs.selected-sha }}
      stable-version:
        value: ${{ jobs.patrol.outputs.stable-version }}
      promotion-pr:
        value: ${{ jobs.patrol.outputs.promotion-pr }}
permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  statuses: read
concurrency:
  group: buildchain-stable-candidate-patrol-${{ github.repository }}-${{ inputs.target-branch ||
    github.ref_name }}
  cancel-in-progress: false
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  patrol:
    runs-on: ubuntu-24.04
    outputs:
      result-path: ${{ steps.node.outputs.result-path }}
      selected: ${{ steps.node.outputs.selected }}
      selected-version: ${{ steps.node.outputs.selected-version }}
      selected-sha: ${{ steps.node.outputs.selected-sha }}
      stable-version: ${{ steps.node.outputs.stable-version }}
      promotion-pr: ${{ steps.node.outputs.promotion-pr }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Execute stable-candidate-patrol
        id: node
        uses: ./.buildchain/runtime/actions/governance/stable-candidate/patrol
        with:
          runtime-ref: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
          runtime-repository: kungfu-systems/buildchain
          request-json: ${{ toJSON(inputs) }}
          secrets-promotion-token: ${{ secrets.promotion-token }}
          secrets-approval-token: ${{ secrets.approval-token }}
          policy-json: ${{ toJSON(vars) }}
    needs:
      - execution-runtime
