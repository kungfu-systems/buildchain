name: Binary Release Assets
on:
  workflow_dispatch:
    inputs:
      evidence-run-id:
        description: Successful Binary Distribution run id.
        required: true
      release-tag:
        description: Existing v* release tag.
        required: true
      publication-used-nonces-json:
        description: JSON array of already consumed admission nonces.
        required: true
        default: "[]"
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
    timeout-minutes: 5
  resolve:
    name: Resolve exact binary publication transaction
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      evidence-run-id: ${{ steps.node.outputs.evidence-run-id }}
      release-tag: ${{ steps.node.outputs.release-tag }}
      source-sha: ${{ steps.node.outputs.source-sha }}
      target-ref: ${{ steps.node.outputs.target-ref }}
      publication-version: ${{ steps.node.outputs.publication-version }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Resolve exact binary publication transaction
        id: node
        uses: ./.buildchain/runtime/actions/release/binary/coordinates
        with:
          request-json: ${{ toJSON(inputs) }}
          token: ${{ github.token }}
    needs:
      - execution-runtime
  publish:
    needs:
      - resolve
      - execution-runtime
    uses: ./.github/workflows/.release-binary-assets.yml
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
    secrets: inherit
    with:
      evidence-run-id: ${{ needs.resolve.outputs.evidence-run-id }}
      release-tag: ${{ needs.resolve.outputs.release-tag }}
      source-sha: ${{ needs.resolve.outputs.source-sha }}
      target-ref: ${{ needs.resolve.outputs.target-ref }}
      publication-version: ${{ needs.resolve.outputs.publication-version }}
      auto-admission: true
      publication-used-nonces-json: ${{ inputs.publication-used-nonces-json || '[]' }}
      runtime-selection: ${{ needs.execution-runtime.outputs.selection }}
