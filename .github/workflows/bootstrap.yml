name: Buildchain Universal Bootstrap

on:
  workflow_call:
    inputs:
      request-json:
        description: "Versioned exact-candidate request envelope"
        required: true
        type: string
    outputs:
      runtime-sha:
        description: "Exact admitted Buildchain runtime SHA"
        value: ${{ jobs.admit.outputs.runtime-sha }}
      request-root:
        description: "Canonical request root"
        value: ${{ jobs.admit.outputs.request-root }}
      admission-root:
        description: "Candidate-tree admission policy root"
        value: ${{ jobs.admit.outputs.admission-root }}
      result-root:
        description: "Candidate result root"
        value: ${{ jobs.execute.outputs.result-root }}
      result-json:
        description: "Rooted candidate result for schema-derived facade output projection"
        value: ${{ jobs.execute.outputs.result-json }}
      terminal-receipt-json:
        description: "Terminal receipt with exact runtime and review lineage"
        value: ${{ jobs.settle.outputs.terminal-receipt-json }}
      terminal-receipt-root:
        description: "Terminal receipt root"
        value: ${{ jobs.settle.outputs.terminal-receipt-root }}
      backflow-root:
        description: "Protected Train-to-dev backflow binding root"
        value: ${{ jobs.settle.outputs.backflow-root }}

permissions:
  contents: read

jobs:
  admit:
    name: Admit exact reviewed candidate
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      runtime-sha: ${{ steps.admit.outputs.runtime-sha }}
      request-root: ${{ steps.admit.outputs.request-root }}
      admission-root: ${{ steps.admit.outputs.admission-root }}
      admission-json: ${{ steps.admit.outputs.admission-json }}
    steps:
      - name: Checkout immutable Bootstrap shell
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ job.workflow_sha }}
          path: .buildchain/bootstrap
          persist-credentials: false

      - name: Inspect the closed request envelope
        id: inspect
        shell: bash
        env:
          BUILDCHAIN_UNIVERSAL_REQUEST_JSON: ${{ inputs.request-json }}
        run: |
          set -euo pipefail
          node .buildchain/bootstrap/scripts/v4-universal-workflow-engine.mjs inspect > .buildchain/request-inspection.json
          {
            echo "repository=$(jq -r '.candidate.repository' .buildchain/request-inspection.json)"
            echo "discovery-ref=$(jq -r '.candidate.discoveryRef' .buildchain/request-inspection.json)"
            echo "expected-sha=$(jq -r '.candidate.expectedSha' .buildchain/request-inspection.json)"
            echo "review-pr=$(jq -r '.candidate.reviewPullRequest' .buildchain/request-inspection.json)"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ steps.inspect.outputs.repository }}
          ref: ${{ steps.inspect.outputs.discovery-ref }}
          path: .buildchain/candidate
          persist-credentials: false

      - name: Read back independent review and exact-head checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REPOSITORY: ${{ steps.inspect.outputs.repository }}
          CANDIDATE_EXPECTED_SHA: ${{ steps.inspect.outputs.expected-sha }}
          CANDIDATE_REVIEW_PR: ${{ steps.inspect.outputs.review-pr }}
        run: |
          set -euo pipefail
          observed_sha="$(git -C .buildchain/candidate rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          test "${observed_sha}" = "${CANDIDATE_EXPECTED_SHA}"
          gh api "repos/${CANDIDATE_REPOSITORY}/pulls/${CANDIDATE_REVIEW_PR}" > .buildchain/pr.json
          gh api --paginate "repos/${CANDIDATE_REPOSITORY}/pulls/${CANDIDATE_REVIEW_PR}/reviews" \
            | jq -s 'add' > .buildchain/reviews.json
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "repos/${CANDIDATE_REPOSITORY}/commits/${CANDIDATE_EXPECTED_SHA}/check-runs?per_page=100" \
            | jq -s '[.[].check_runs[]]' > .buildchain/checks.json
          jq -e --arg repository "${CANDIDATE_REPOSITORY}" \
            --arg expected "${CANDIDATE_EXPECTED_SHA}" \
            --argjson number "${CANDIDATE_REVIEW_PR}" '
              .head.repo.full_name == $repository and
              .head.sha == $expected and
              .number == $number and
              .base.ref == "dev/v4/v4.0"
            ' .buildchain/pr.json > /dev/null
          jq -e --arg expected "${CANDIDATE_EXPECTED_SHA}" '
            any(.[]; .state == "APPROVED" and .commit_id == $expected and (.user.login | ascii_downcase) == "kungfu-origin")
          ' .buildchain/reviews.json > /dev/null
          jq -e '
            any(.[]; .name == "check" and .status == "completed" and .conclusion == "success")
          ' .buildchain/checks.json > /dev/null
          observed_at="$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')"
          jq -n --arg repository "${CANDIDATE_REPOSITORY}" \
            --arg expected "${CANDIDATE_EXPECTED_SHA}" \
            --arg observed_at "${observed_at}" \
            --argjson pull_request "${CANDIDATE_REVIEW_PR}" \
            --slurpfile pr .buildchain/pr.json \
            --slurpfile reviews .buildchain/reviews.json \
            --slurpfile checks .buildchain/checks.json '
              {
                repository: $repository,
                pullRequest: $pull_request,
                headSha: $expected,
                baseRef: $pr[0].base.ref,
                approvals: ($reviews[0]
                  | map(select(.state == "APPROVED" and .commit_id == $expected))
                  | map({
                      reviewer: (.user.login | ascii_downcase),
                      commitSha: .commit_id,
                      submittedAt: (.submitted_at | fromdateiso8601 | strftime("%Y-%m-%dT%H:%M:%S.000Z"))
                    })),
                checks: ($checks[0] | map({name, status, conclusion})),
                observedAt: $observed_at
              }
            ' > .buildchain/review-evidence.json

      - name: Admit the exact reviewed candidate
        id: admit
        shell: bash
        env:
          BUILDCHAIN_UNIVERSAL_REQUEST_JSON: ${{ inputs.request-json }}
          BUILDCHAIN_UNIVERSAL_CONSUMER_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_UNIVERSAL_CONSUMER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILDCHAIN_UNIVERSAL_ADMISSION_POLICY_JSON="$(jq -c '.' .buildchain/candidate/architecture/v4-universal-workflow-train-admission.json)"
          BUILDCHAIN_UNIVERSAL_REVIEW_EVIDENCE_JSON="$(jq -c '.' .buildchain/review-evidence.json)"
          BUILDCHAIN_UNIVERSAL_OBSERVED_SHA="$(git -C .buildchain/candidate rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          BUILDCHAIN_UNIVERSAL_OBSERVED_AT="$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')"
          export BUILDCHAIN_UNIVERSAL_ADMISSION_POLICY_JSON BUILDCHAIN_UNIVERSAL_REVIEW_EVIDENCE_JSON
          export BUILDCHAIN_UNIVERSAL_OBSERVED_SHA BUILDCHAIN_UNIVERSAL_OBSERVED_AT
          node .buildchain/bootstrap/scripts/v4-universal-workflow-engine.mjs admit > .buildchain/admission.json
          {
            echo "runtime-sha=$(jq -r '.runtime.sha' .buildchain/admission.json)"
            echo "request-root=$(jq -r '.requestRoot' .buildchain/admission.json)"
            echo "admission-root=$(jq -r '.admissionRoot' .buildchain/admission.json)"
            echo "admission-json=$(jq -c '.' .buildchain/admission.json)"
          } >> "${GITHUB_OUTPUT}"

  execute:
    name: Execute exact admitted candidate
    needs: admit
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      checks: write
      contents: write
      deployments: write
      id-token: write
      issues: write
      packages: write
      pages: write
      pull-requests: write
      security-events: write
      statuses: write
    outputs:
      result-json: ${{ steps.execute.outputs.result-json }}
      result-root: ${{ steps.execute.outputs.result-root }}
    steps:
      - name: Checkout unchanged consumer source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout exact admitted candidate
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ needs.admit.outputs.runtime-sha }}
          path: .buildchain/candidate
          persist-credentials: false

      - name: Execute candidate engine
        id: execute
        shell: bash
        env:
          BUILDCHAIN_UNIVERSAL_REQUEST_JSON: ${{ inputs.request-json }}
          BUILDCHAIN_UNIVERSAL_ADMISSION_JSON: ${{ needs.admit.outputs.admission-json }}
          BUILDCHAIN_UNIVERSAL_ENGINE_SHA: ${{ needs.admit.outputs.runtime-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .buildchain/candidate/scripts/v4-universal-workflow-engine.mjs execute > .buildchain/result.json
          {
            echo "result-json=$(jq -c '.' .buildchain/result.json)"
            echo "result-root=$(jq -r '.resultRoot' .buildchain/result.json)"
          } >> "${GITHUB_OUTPUT}"

  settle:
    name: Seal terminal receipt outside candidate authority
    needs: [admit, execute]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      terminal-receipt-json: ${{ steps.settle.outputs.terminal-receipt-json }}
      terminal-receipt-root: ${{ steps.settle.outputs.terminal-receipt-root }}
      backflow-root: ${{ steps.backflow.outputs.backflow-root }}
    steps:
      - name: Checkout immutable Bootstrap shell
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ job.workflow_sha }}
          path: .buildchain/bootstrap
          persist-credentials: false

      - name: Seal terminal receipt
        id: settle
        shell: bash
        env:
          BUILDCHAIN_UNIVERSAL_ADMISSION_JSON: ${{ needs.admit.outputs.admission-json }}
          BUILDCHAIN_UNIVERSAL_RESULT_JSON: ${{ needs.execute.outputs.result-json }}
        run: |
          set -euo pipefail
          node .buildchain/bootstrap/scripts/v4-universal-workflow-engine.mjs terminal > .buildchain/terminal-receipt.json
          {
            echo "terminal-receipt-json=$(jq -c '.' .buildchain/terminal-receipt.json)"
            echo "terminal-receipt-root=$(jq -r '.receiptRoot' .buildchain/terminal-receipt.json)"
          } >> "${GITHUB_OUTPUT}"
          test "$(jq -r '.status' <<< "${BUILDCHAIN_UNIVERSAL_RESULT_JSON}")" = "succeeded"

      - name: Bind successful delivery to protected backflow
        id: backflow
        shell: bash
        env:
          BUILDCHAIN_UNIVERSAL_REQUEST_JSON: ${{ inputs.request-json }}
          BUILDCHAIN_UNIVERSAL_TERMINAL_RECEIPT_JSON: ${{ steps.settle.outputs.terminal-receipt-json }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .buildchain/bootstrap/scripts/v4-universal-workflow-backflow.mjs > .buildchain/backflow.json
          echo "backflow-root=$(jq -r '.backflowRoot' .buildchain/backflow.json)" >> "${GITHUB_OUTPUT}"
