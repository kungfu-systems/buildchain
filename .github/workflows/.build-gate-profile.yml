name: Buildchain Shifu Gate Profile
on:
  workflow_call:
    inputs:
      buildchain-repository:
        default: kungfu-systems/buildchain
        type: string
        required: false
      buildchain-ref:
        description: Optional explicit runtime ref. Empty binds the defining workflow SHA.
        default: ""
        type: string
        required: false
      source-ref:
        description: Optional immutable consumer source ref; defaults to the caller event SHA
        default: ""
        type: string
        required: false
      working-directory:
        default: .
        type: string
        required: false
      gate-profile:
        description: Consumer-owned Shifu Gate profile id
        type: string
        required: true
      gate-command-json:
        description: Project-owned Shifu execution argv by platform; Buildchain never evaluates a shell string
        default: '{"linux":["./shifu"],"macos":["./shifu"],"windows":["./shifu.cmd"]}'
        type: string
        required: false
      gate-plan-command-json:
        description: Optional lightweight Shifu planning argv by platform; defaults to gate-command-json
        default: ""
        type: string
        required: false
      gate-registry:
        description: Optional project-relative Shifu Gate registry path
        default: ""
        type: string
        required: false
      gate-environment-json:
        description: Optional non-sensitive project environment passed to Shifu as a JSON object
        default: "{}"
        type: string
        required: false
      shifu-cache-profile-ref:
        description: Opaque trusted Shifu cache profile reference passed without interpretation
        default: ""
        type: string
        required: false
      shifu-cache-profile-digest:
        description: Opaque expected Shifu cache profile digest passed without interpretation
        default: ""
        type: string
        required: false
      include-advisory:
        default: false
        type: boolean
        required: false
      runner-preset:
        description: "Runner preset: github-hosted, kungfu-v4-self-hosted, or custom with platforms-json"
        default: github-hosted
        type: string
        required: false
      platforms-json:
        description:
          "Optional runner objects: id, name, platform, runner JSON string, capabilities, non-sensitive scalar
          environment, and optional required=false"
        default: ""
        type: string
        required: false
      artifact-name:
        default: buildchain-gates
        type: string
        required: false
      artifact-retention-days:
        default: 14
        type: number
        required: false
      checkout-cache-mode:
        description: "Locked source checkout cache mode: off, auto, or require"
        default: off
        type: string
        required: false
      checkout-cache-mirror-url-template:
        description: Trusted local/LAN Git mirror URL template. Supports {owner}, {repo}, {repository}, {repositorySlug}, and {sha}.
        default: ""
        type: string
        required: false
      checkout-cache-reference-repository-template:
        description:
          Trusted runner-local bare reference repository template. Supports {owner}, {repo}, {repository},
          {repositorySlug}, and {sha}.
        default: ""
        type: string
        required: false
      checkout-cache-fallback:
        description: "Fallback when checkout cache misses: github or fail"
        default: github
        type: string
        required: false
      checkout-cache-timeout-seconds:
        description: Timeout for each trusted cache transport attempt
        default: 60
        type: number
        required: false
      checkout-cache-github-timeout-seconds:
        description: Timeout for each GitHub fallback fetch attempt
        default: 600
        type: number
        required: false
      checkout-cache-fetch-attempts:
        description: Maximum bounded attempts for retryable GitHub fallback fetch failures
        default: 3
        type: number
        required: false
      node-version:
        default: "24"
        type: string
        required: false
      rust-toolchain:
        description: Rust toolchain provisioned when a runner declares the rust capability
        default: stable
        type: string
        required: false
      rustup-dist-server:
        description: Optional rustup distribution mirror; empty uses the official Rust server
        default: ""
        type: string
        required: false
      rustup-update-root:
        description: Optional rustup self-update mirror; empty uses the official Rust server
        default: ""
        type: string
        required: false
      cargo-registry-index:
        description: Optional crates.io-compatible Cargo registry index; empty uses the Cargo default
        default: ""
        type: string
        required: false
      require-trusted-event:
        default: true
        type: boolean
        required: false
      untrusted-policy:
        description: fail or skip when an untrusted fork event asks for Gate execution
        default: fail
        type: string
        required: false
    outputs:
      source-sha:
        description: Immutable consumer source SHA bound into every Shifu receipt
        value: ${{ jobs.plan.outputs.source-sha }}
      buildchain-runtime-sha:
        description: Immutable Buildchain runtime SHA used for planning and aggregation
        value: ${{ jobs.plan.outputs.buildchain-runtime-sha }}
      gate-matrix-digest:
        description: Deterministic Buildchain runner matrix digest
        value: ${{ jobs.plan.outputs.gate-matrix-digest }}
      gate-aggregate-artifact:
        description: Uploaded Shifu Gate aggregate artifact name
        value: ${{ jobs.aggregate.outputs.gate-aggregate-artifact }}
      gate-aggregate-json:
        description: Compact Shifu Gate aggregate JSON for release-candidate evidence binding
        value: ${{ jobs.aggregate.outputs.gate-aggregate-json }}
      gate-aggregate-digest:
        description: Shifu Gate aggregate digest
        value: ${{ jobs.aggregate.outputs.gate-aggregate-digest }}
      gate-aggregate-status:
        description: pass or fail
        value: ${{ jobs.aggregate.outputs.gate-aggregate-status }}
      controller-plan-artifact:
        description: Uploaded Shifu profile envelope controller plan artifact name
        value: ${{ jobs.plan.outputs.controller-plan-artifact }}
      controller-plan-json:
        description: Compact source/runtime-bound Shifu profile envelope plan
        value: ${{ jobs.plan.outputs.controller-plan-json }}
      controller-plan-digest:
        description: Digest of the Shifu profile envelope controller plan
        value: ${{ jobs.plan.outputs.controller-plan-digest }}
      controller-receipt-artifact:
        description: Uploaded Shifu profile envelope controller receipt artifact name
        value: ${{ jobs.aggregate.outputs.controller-receipt-artifact }}
      controller-receipt-json:
        description: Compact Shifu profile envelope controller receipt
        value: ${{ jobs.aggregate.outputs.controller-receipt-json }}
      controller-receipt-digest:
        description: Digest of the Shifu profile envelope controller receipt
        value: ${{ jobs.aggregate.outputs.controller-receipt-digest }}
      controller-receipt-status:
        description: Final Shifu profile envelope controller status
        value: ${{ jobs.aggregate.outputs.controller-receipt-status }}
permissions:
  contents: read
jobs:
  plan:
    name: Gate profile / plan
    runs-on: ubuntu-24.04
    outputs:
      trusted: ${{ steps.node.outputs.trusted }}
      source-sha: ${{ steps.node.outputs.source-sha }}
      buildchain-runtime-ref: ${{ steps.node.outputs.buildchain-runtime-ref }}
      buildchain-runtime-sha: ${{ steps.node.outputs.buildchain-runtime-sha }}
      gate-matrix-json: ${{ steps.node.outputs.gate-matrix-json }}
      gate-matrix-digest: ${{ steps.node.outputs.gate-matrix-digest }}
      gate-matrix-artifact: ${{ steps.node.outputs.gate-matrix-artifact }}
      controller-plan-artifact: ${{ steps.node.outputs.controller-plan-artifact }}
      controller-plan-json: ${{ steps.node.outputs.controller-plan-json }}
      controller-plan-digest: ${{ steps.node.outputs.controller-plan-digest }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Gate profile / plan
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/gate/plan
        with:
          request-json: ${{ toJSON(inputs) }}
          workflow-sha: ${{ job.workflow_sha }}
  run-gates:
    name: Gate profile / ${{ matrix.gate.name }}
    needs: plan
    if: ${{ (needs.plan.outputs.trusted == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.plan.outputs.gate-matrix-json) }}
    runs-on: ${{ fromJSON(matrix.gate.runner) }}
    timeout-minutes: ${{ matrix.gate.timeoutMinutes }}
    env:
      CARGO_REGISTRIES_CRATES_IO_INDEX: ${{ inputs.cargo-registry-index }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Gate profile / ${{ matrix.gate.name }}
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/gate/execute
        with:
          request-json: ${{ toJSON(inputs) }}
          matrix-json: ${{ toJSON(matrix) }}
          runtime-sha: ${{ needs.plan.outputs.buildchain-runtime-sha }}
          source-sha: ${{ needs.plan.outputs.source-sha }}
          runtime-ref: ${{ needs.plan.outputs.buildchain-runtime-ref }}
          plan-artifact: ${{ needs.plan.outputs.gate-matrix-artifact }}
  aggregate:
    name: Gate profile / aggregate
    needs:
      - plan
      - run-gates
    if: ${{ (always() && needs.plan.outputs.trusted == 'true') }}
    runs-on: ubuntu-24.04
    outputs:
      gate-aggregate-artifact: ${{ steps.node.outputs.gate-aggregate-artifact }}
      gate-aggregate-json: ${{ steps.node.outputs.gate-aggregate-json }}
      gate-aggregate-digest: ${{ steps.node.outputs.gate-aggregate-digest }}
      gate-aggregate-status: ${{ steps.node.outputs.gate-aggregate-status }}
      controller-receipt-artifact: ${{ steps.node.outputs.controller-receipt-artifact }}
      controller-receipt-json: ${{ steps.node.outputs.controller-receipt-json }}
      controller-receipt-digest: ${{ steps.node.outputs.controller-receipt-digest }}
      controller-receipt-status: ${{ steps.node.outputs.controller-receipt-status }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Gate profile / aggregate
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/gate/aggregate
        with:
          request-json: ${{ toJSON(inputs) }}
          runtime-sha: ${{ needs.plan.outputs.buildchain-runtime-sha }}
          plan-artifact: ${{ needs.plan.outputs.gate-matrix-artifact }}
          controller-plan-artifact: ${{ needs.plan.outputs.controller-plan-artifact }}
          source-sha: ${{ needs.plan.outputs.source-sha }}
          plan-result: ${{ needs.plan.result }}
          execution-result: ${{ needs.run-gates.result }}
