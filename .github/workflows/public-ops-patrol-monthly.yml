name: Buildchain Patrol Monthly
on:
  workflow_call:
    inputs:
      target-branch:
        description: Protected dev branch to inspect
        default: ""
        type: string
        required: false
      dry-run:
        description: Plan only; do not mutate repository state
        default: true
        type: boolean
        required: false
      runtime-ref:
        description: Runtime entry selection parameter.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Runtime entry selection parameter.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Runtime entry selection parameter.
        type: string
        required: false
        default: ""
    secrets:
      github-token:
        description: Optional token for repository inspection. Defaults to github.token.
        required: false
    outputs:
      result-path:
        description: Patrol result JSON path
        value: ${{ jobs.patrol.outputs.result-path }}
      evaluated-count:
        description: Number of PRs evaluated by enabled capabilities
        value: ${{ jobs.patrol.outputs.evaluated-count }}
      action-count:
        description: Number of actions taken, or planned in dry-run mode
        value: ${{ jobs.patrol.outputs.action-count }}
      skipped-count:
        description: Number of skipped PRs
        value: ${{ jobs.patrol.outputs.skipped-count }}
      planned-count:
        description: Number of stable-interface checks not yet implemented
        value: ${{ jobs.patrol.outputs.planned-count }}
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
jobs:
  patrol:
    uses: ./.github/workflows/public-ops-patrol.yml
    with:
      cadence: monthly
      mode: cadence-default
      target-branch: ${{ inputs.target-branch }}
      dry-run: ${{ inputs.dry-run }}
      runtime-ref: ${{ inputs.runtime-ref }}
      contract-lock: ${{ inputs.contract-lock }}
      runtime-selection: ${{ inputs.runtime-selection }}
    secrets:
      github-token: ${{ secrets.github-token }}
