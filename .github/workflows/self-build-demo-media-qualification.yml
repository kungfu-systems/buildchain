name: Auditable Demo Media Profile Qualification
on:
  pull_request:
    paths:
      - .github/workflows/.build-demo-adapter.yml
      - .github/workflows/self-build-demo-media-qualification.yml
      - contracts/auditable-demo-media-profiles-v1.json
      - contracts/evidence/auditable-demo-web-delivery-v1.json
      - contracts/evidence/auditable-demo-responsive-web-delivery-v1.json
      - contracts/fixtures/auditable-demo-web-delivery-v1/**
      - contracts/fixtures/auditable-demo-responsive-web-delivery-v1/**
      - packages/core/build/commands/auditable-demo.mjs
  push:
    branches:
      - dev/v*/v*
    paths:
      - .github/workflows/.build-demo-adapter.yml
      - .github/workflows/self-build-demo-media-qualification.yml
      - contracts/auditable-demo-media-profiles-v1.json
      - contracts/evidence/auditable-demo-web-delivery-v1.json
      - contracts/evidence/auditable-demo-responsive-web-delivery-v1.json
      - contracts/fixtures/auditable-demo-web-delivery-v1/**
      - contracts/fixtures/auditable-demo-responsive-web-delivery-v1/**
      - packages/core/build/commands/auditable-demo.mjs
  workflow_dispatch:
    inputs:
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
    timeout-minutes: 5
  qualify:
    name: qualify-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: web-delivery-v1
            fixture: auditable-demo-web-delivery-v1
            evidence: auditable-demo-web-delivery-v1.json
            artifactName: auditable-demo-web-delivery-v1
            rendererImage: ghcr.io/kungfu-systems/build-images/demo-renderer@sha256:cb5e1dec368d21c7d4e8baded99ac75f12f7eff0d19505751888cf974086efa6
            rendererSourceRef: refs/tags/v1.3.0-alpha.16
            rendererSourceSha: 999b370743f3e64e4f0b634d5131bd1d3d6b83ba
          - profile: responsive-web-delivery-v1
            fixture: auditable-demo-responsive-web-delivery-v1
            evidence: auditable-demo-responsive-web-delivery-v1.json
            artifactName: auditable-demo-responsive-web-delivery-v1
            rendererImage: ghcr.io/kungfu-systems/build-images/demo-renderer@sha256:b70a2f5631665f685280bc9d7434c5ed5cf48b760b728873734d0c47bff72b25
            rendererSourceRef: refs/tags/v1.3.0-alpha.20
            rendererSourceSha: b3cebc2deb5f140af74db24b1b45233ac6733ef1
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
        id: source-checkout
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
        if: ${{ always() }}
      - name: qualify-${{ matrix.profile }}
        id: node
        uses: ./.buildchain/runtime/actions/build/demo/qualify-media
        with:
          matrix-json: ${{ toJSON(matrix) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
    needs:
      - execution-runtime
