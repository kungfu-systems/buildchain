permissions:
  actions: read
  checks: write
  contents: write
  id-token: write
  issues: write

jobs:
  resolve-promotion:
    name: Resolve promotion workflow shell and runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.route.outputs.channel }}
      publication-channel: ${{ steps.route.outputs.publication-channel }}
      target-ref: ${{ steps.route.outputs.target-ref }}
      router-ref: ${{ steps.router.outputs.ref }}
      router-sha: ${{ steps.identities.outputs.router-sha }}
      shell-ref: ${{ steps.route.outputs.shell-ref }}
      shell-sha: ${{ steps.identities.outputs.shell-sha }}
      runtime-ref: ${{ steps.route.outputs.runtime-ref }}
      runtime-sha: ${{ steps.identities.outputs.runtime-sha }}
      contract-lock-path: ${{ steps.lock.outputs.path }}
      contract-lock-digest: ${{ steps.lock.outputs.digest }}
      override-used: ${{ steps.route.outputs.override-used }}
      selection-source: ${{ steps.route.outputs.selection-source }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - name: Resolve promotion router source
        id: router
        shell: bash
        env:
          BUILDCHAIN_ROUTER_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          workflow_ref="${BUILDCHAIN_ROUTER_WORKFLOW_REF}"
          repository="${workflow_ref%%/.github/workflows/*}"
          ref="${workflow_ref##*@}"
          ref="${ref#refs/heads/}"
          ref="${ref#refs/tags/}"
          if [[ -z "${repository}" || "${repository}" = "${workflow_ref}" || -z "${ref}" ]]; then
            echo "::error::Unable to resolve promotion router source from job.workflow_ref=${workflow_ref}"
            exit 1
          fi
          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout promotion router
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ steps.router.outputs.repository }}
          ref: ${{ steps.router.outputs.ref }}
          path: .buildchain/router
          persist-credentials: false

      - name: Resolve promotion channel
        id: route
        shell: bash
        run: >-
          node .buildchain/router/scripts/promotion-channel-router.mjs
          --cwd .buildchain/router
          --channel "${{ inputs.buildchain-channel }}"
          --buildchain-ref "${{ inputs.buildchain-ref }}"
          --publication-channel "${{ inputs.channel }}"
          --target-ref "${{ inputs.target-ref || github.ref_name }}"
          --router-ref "${{ steps.router.outputs.ref }}"

      - name: Authorize trusted runtime override
        if: ${{ steps.route.outputs.override-used == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== "workflow_dispatch") {
              throw new Error("promotion runtime override is only allowed for trusted workflow_dispatch runs");
            }
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const level = permission.data.user?.permissions || permission.data.permission || "none";
            if (!["write", "maintain", "admin"].includes(level)) {
              throw new Error(`promotion runtime override requires write, maintain, or admin permission; actor has ${level}`);
            }

      - name: Checkout selected promotion workflow shell
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ steps.router.outputs.repository }}
          ref: ${{ steps.route.outputs.shell-ref }}
          path: .buildchain/shell
          persist-credentials: false

      - name: Checkout selected Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ steps.router.outputs.repository }}
          ref: ${{ steps.route.outputs.runtime-ref }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Checkout promotion source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          path: .buildchain/source
          persist-credentials: false

      - name: Select and verify consumer contract lock
        id: lock
        shell: bash
        env:
          EXPLICIT_PATH: ${{ inputs.buildchain-contract-lock-path }}
          ALPHA_PATH: ${{ inputs.buildchain-alpha-contract-lock-path }}
          STABLE_PATH: ${{ inputs.buildchain-stable-contract-lock-path }}
          CHANNEL: ${{ steps.route.outputs.channel }}
        run: |
          set -euo pipefail
          path="${EXPLICIT_PATH}"
          if [[ -z "${path}" ]]; then
            if [[ "${CHANNEL}" = "alpha" ]]; then path="${ALPHA_PATH}"; else path="${STABLE_PATH}"; fi
          fi
          if [[ -z "${path}" || ! -f ".buildchain/source/${path}" ]]; then
            echo "::error::Selected promotion contract lock is missing: ${path:-<empty>}"
            exit 1
          fi
          digest="sha256:$(shasum -a 256 ".buildchain/source/${path}" | awk '{print $1}')"
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Resolve immutable promotion identities
        id: identities
        shell: bash
        env:
          CHANNEL: ${{ steps.route.outputs.channel }}
          SELECTED_SHELL_REF: ${{ steps.route.outputs.shell-ref }}
          ALPHA_SHELL_REF: v2-alpha
          ALPHA_SHELL_CALL_REF: v2-alpha
          ALPHA_SHELL_WORKFLOW_PATH: .github/workflows/.release-candidate-promote.yml
          STABLE_SHELL_REF: v2
          STABLE_SHELL_CALL_REF: c95f9fc36b0ac8fb4ff6400189850c4ae683f3ea
          STABLE_SHELL_WORKFLOW_PATH: .github/workflows/release-candidate-promote.yml
        run: |
          set -euo pipefail
          if [[ "${CHANNEL}" = "alpha" ]]; then
            expected_ref="${ALPHA_SHELL_REF}"
            call_ref="${ALPHA_SHELL_CALL_REF}"
            workflow_path="${ALPHA_SHELL_WORKFLOW_PATH}"
          else
            expected_ref="${STABLE_SHELL_REF}"
            call_ref="${STABLE_SHELL_CALL_REF}"
            workflow_path="${STABLE_SHELL_WORKFLOW_PATH}"
          fi
          if [[ "${SELECTED_SHELL_REF}" != "${expected_ref}" ]]; then
            echo "::error::Selected promotion shell ref ${SELECTED_SHELL_REF} does not match configured ${expected_ref}"
            exit 1
          fi
          test -f ".buildchain/shell/${workflow_path}"
          shell_sha="$(git -C .buildchain/shell rev-parse HEAD)"
          if [[ "${call_ref}" =~ ^[0-9a-f]{40}$ && "${shell_sha}" != "${call_ref}" ]]; then
            echo "::error::Pinned promotion shell ${call_ref} does not match selected ${shell_sha}"
            exit 1
          fi
          {
            echo "router-sha=$(git -C .buildchain/router rev-parse HEAD)"
            echo "shell-sha=${shell_sha}"
            echo "runtime-sha=$(git -C .buildchain/runtime rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

  alpha:
    name: Promote with alpha workflow shell
    needs: resolve-promotion
    if: ${{ needs.resolve-promotion.outputs.channel == 'alpha' }}
    uses: kungfu-systems/buildchain/.github/workflows/.release-candidate-promote.yml@v2-alpha
    permissions:
      actions: read
      checks: write
      contents: write
      id-token: write
      issues: write
    with:
      buildchain-repository: ${{ inputs.buildchain-repository }}
      buildchain-ref: ${{ needs.resolve-promotion.outputs.runtime-ref }}
      promotion-router-ref: ${{ needs.resolve-promotion.outputs.router-ref }}
      promotion-router-sha: ${{ needs.resolve-promotion.outputs.router-sha }}
      promotion-shell-ref: ${{ needs.resolve-promotion.outputs.shell-ref }}
      promotion-shell-sha: ${{ needs.resolve-promotion.outputs.shell-sha }}
      promotion-runtime-ref: ${{ needs.resolve-promotion.outputs.runtime-ref }}
      promotion-runtime-sha: ${{ needs.resolve-promotion.outputs.runtime-sha }}
      promotion-contract-lock-path: ${{ needs.resolve-promotion.outputs.contract-lock-path }}
      promotion-contract-lock-digest: ${{ needs.resolve-promotion.outputs.contract-lock-digest }}
      promotion-publication-channel: ${{ needs.resolve-promotion.outputs.publication-channel }}
      promotion-target-ref: ${{ needs.resolve-promotion.outputs.target-ref }}
      promotion-override-used: ${{ needs.resolve-promotion.outputs.override-used }}
      buildchain-contract-lock-path: ${{ needs.resolve-promotion.outputs.contract-lock-path }}
      buildchain-contract-compatibility-policy: ${{ inputs.buildchain-contract-compatibility-policy }}
      buildchain-contract-drift-issue-mode: ${{ inputs.buildchain-contract-drift-issue-mode }}
      allow-repository: ${{ inputs.allow-repository }}
      channel: ${{ needs.resolve-promotion.outputs.publication-channel }}
      target-ref: ${{ needs.resolve-promotion.outputs.target-ref }}
      target-sha: ${{ inputs.target-sha }}
      package-manager: ${{ inputs.package-manager }}
      artifact-name: ${{ inputs.artifact-name }}
      release-candidate-workflow-file: ${{ inputs.release-candidate-workflow-file }}
      release-candidate-workflow-name: ${{ inputs.release-candidate-workflow-name }}
      artifact-patterns: ${{ inputs.artifact-patterns }}
      required-status-check: ${{ inputs.required-status-check }}
      branch-protection-bypass-apps: ${{ inputs.branch-protection-bypass-apps }}
      branch-protection-bypass-users: ${{ inputs.branch-protection-bypass-users }}
      branch-protection-bypass-teams: ${{ inputs.branch-protection-bypass-teams }}
      publish-target: ${{ inputs.publish-target }}
      github-release: ${{ inputs.github-release }}
      github-release-title: ${{ inputs.github-release-title }}
      github-release-notes: ${{ inputs.github-release-notes }}
      runner-preset: ${{ inputs.runner-preset }}
      trusted-publishing: ${{ inputs.trusted-publishing }}
      publish-command: ${{ inputs.publish-command }}
      publish-required-artifacts-json: ${{ inputs.publish-required-artifacts-json }}
      publish-artifact-kind: ${{ inputs.publish-artifact-kind }}
      publish-mode: ${{ inputs.publish-mode }}
      publish-dist-tag: ${{ inputs.publish-dist-tag }}
      publish-package-set-order: ${{ inputs.publish-package-set-order }}
      publish-package-main: ${{ inputs.publish-package-main }}
      release-passport: ${{ inputs.release-passport }}
      release-passport-output-dir: ${{ inputs.release-passport-output-dir }}
      release-passport-product-name: ${{ inputs.release-passport-product-name }}
      release-passport-impact-json: ${{ inputs.release-passport-impact-json }}
      release-passport-kfd-1-witness-jsons: ${{ inputs.release-passport-kfd-1-witness-jsons }}
      release-passport-kfd-2-claim-jsons: ${{ inputs.release-passport-kfd-2-claim-jsons }}
      release-passport-kfd-3-prebuild-witness-jsons: ${{ inputs.release-passport-kfd-3-prebuild-witness-jsons }}
      release-passport-kfd-3-artifact-witness-jsons: ${{ inputs.release-passport-kfd-3-artifact-witness-jsons }}
      release-passport-kfd-3-artifact-verify-command: ${{ inputs.release-passport-kfd-3-artifact-verify-command }}
      release-passport-buildchain-self-kfd: ${{ inputs.release-passport-buildchain-self-kfd }}
      release-passport-platform-manifest-paths: ${{ inputs.release-passport-platform-manifest-paths }}
