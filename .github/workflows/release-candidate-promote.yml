name: Release Candidate Promote

on:
  workflow_call:
    inputs:
      buildchain-repository:
        default: "kungfu-systems/buildchain"
        type: string
        required: false
      buildchain-ref:
        description: "Optional Buildchain runtime ref. Empty uses the workflow shell ref."
        default: ""
        type: string
        required: false
      buildchain-contract-lock-path:
        description: "Consumer-owned Buildchain contract lock path"
        default: ".buildchain/contract-lock.json"
        type: string
        required: false
      buildchain-contract-compatibility-policy:
        description: "Contract compatibility policy: major-compatible, allow-additive, or exact"
        default: "major-compatible"
        type: string
        required: false
      buildchain-contract-drift-issue-mode:
        description: "Consumer issue behavior for Buildchain floating-ref contract drift: off, breaking-only, or compatible-and-breaking"
        default: "compatible-and-breaking"
        type: string
        required: false
      allow-repository:
        description: "Repository allowed to promote. Empty defaults to the caller repository."
        default: ""
        type: string
        required: false
      channel:
        description: "Promotion channel: alpha, release, or major. Empty derives from target-ref."
        default: ""
        type: string
        required: false
      target-ref:
        description: "Channel ref to promote. Defaults to the current ref name."
        default: ""
        type: string
        required: false
      target-sha:
        description: "Channel commit SHA to promote. Defaults to the current workflow SHA."
        default: ""
        type: string
        required: false
      package-manager:
        description: "Package manager recorded for audit: npm, pnpm, yarn, or custom"
        default: "npm"
        type: string
        required: false
      artifact-name:
        description: "Base artifact name used by the PR-stage reusable build"
        default: "buildchain-artifact"
        type: string
        required: false
      release-candidate-workflow-file:
        description: "PR-stage release-candidate workflow file name"
        default: "build.yml"
        type: string
        required: false
      release-candidate-workflow-name:
        description: "PR-stage release-candidate workflow display name"
        default: "Build"
        type: string
        required: false
      artifact-patterns:
        description: "Newline-separated payload artifact patterns expected from the RC bundle"
        default: ""
        type: string
        required: false
      required-status-check:
        description: "Exact required protected-branch status check context"
        default: "check / check"
        type: string
        required: false
      branch-protection-bypass-apps:
        description: "GitHub App slugs allowed to bypass pull-request review for Buildchain-managed generated channel ref updates"
        default: "github-actions"
        type: string
        required: false
      branch-protection-bypass-users:
        description: "GitHub users allowed to bypass pull-request review for Buildchain-managed generated channel ref updates"
        default: ""
        type: string
        required: false
      branch-protection-bypass-teams:
        description: "GitHub team slugs allowed to bypass pull-request review for Buildchain-managed generated channel ref updates"
        default: ""
        type: string
        required: false
      publish-target:
        description: "Publish target recorded for audit: npm, github-release, custom"
        default: "npm"
        type: string
        required: false
      github-release:
        description: "Create/update the public GitHub Release and upload Buildchain release passport/evidence assets after a complete release transaction"
        default: true
        type: boolean
        required: false
      github-release-title:
        description: "Optional GitHub Release title. Empty defaults to the public release tag."
        default: ""
        type: string
        required: false
      github-release-notes:
        description: "Optional GitHub Release notes. Empty uses a Buildchain release-passport asset note."
        default: ""
        type: string
        required: false
      runner-preset:
        description: "Runner preset recorded for audit"
        default: "github-hosted"
        type: string
        required: false
      trusted-publishing:
        description: "Whether the publish target uses GitHub OIDC trusted publishing"
        default: true
        type: boolean
        required: false
      publish-command:
        description: "Optional publish command. Defaults to lifecycle.publish from buildchain.toml."
        default: ""
        type: string
        required: false
      publish-required-artifacts-json:
        description: "Required publish artifacts JSON passed to the promotion action; ref_template may contain one {version} placeholder"
        default: ""
        type: string
        required: false
      publish-artifact-kind:
        description: "Artifact kind used when generating publish-required-artifacts-json from downloaded payloads"
        default: "npm"
        type: string
        required: false
      publish-mode:
        description: "Publish mode passed to promote-buildchain-ref"
        default: ""
        type: string
        required: false
      publish-dist-tag:
        description: "Expected dist-tag passed to promote-buildchain-ref"
        default: ""
        type: string
        required: false
      publish-package-set-order:
        description: "Package-set ordering passed to promote-buildchain-ref"
        default: "as-provided"
        type: string
        required: false
      publish-package-main:
        description: "Main package name for package-set ordering"
        default: ""
        type: string
        required: false
      release-passport:
        description: "Generate and persist the release passport after publish finalization"
        default: true
        type: boolean
        required: false
      release-passport-output-dir:
        description: "Release passport output directory"
        default: ".buildchain/release-passport"
        type: string
        required: false
      release-passport-product-name:
        description: "Product name recorded in buildchain.release.json"
        default: ""
        type: string
        required: false
      release-passport-impact-json:
        description: "Surface-aware release impact JSON or path passed to the release passport collector"
        default: ""
        type: string
        required: false
      release-passport-kfd-1-witness-jsons:
        description: "Newline- or comma-separated KFD-1 contract-world witness JSON paths passed to the release passport collector"
        default: ""
        type: string
        required: false
      release-passport-kfd-2-claim-jsons:
        description: "Newline- or comma-separated KFD-2 public release trust claim JSON paths passed to the release passport collector"
        default: ""
        type: string
        required: false
      release-passport-kfd-3-prebuild-witness-jsons:
        description: "Newline- or comma-separated KFD-3 collaboration-interface pre-build witness JSON paths passed to the release passport collector"
        default: ""
        type: string
        required: false
      release-passport-kfd-3-artifact-witness-jsons:
        description: "Newline- or comma-separated KFD-3 artifact-side collaboration-interface witness JSON paths passed to the release passport collector"
        default: ""
        type: string
        required: false
      release-passport-kfd-3-artifact-verify-command:
        description: "Product-owned command that emits KFD-3 artifact-side collaboration-interface witness JSON"
        default: ""
        type: string
        required: false
      release-passport-buildchain-self-kfd:
        description: "Generate Buildchain-owned KFD-1/2/3 self witnesses and claims from the checked-out package source before release passport finalization"
        default: false
        type: boolean
        required: false
      release-passport-platform-manifest-paths:
        description: "Optional platform manifest paths for release passport; defaults to downloaded PR-stage payload manifests"
        default: ""
        type: string
        required: false
      required-artifact-count:
        description: "Minimum downloaded payload count required before publish; npm counts package tarballs"
        default: 3
        type: number
        required: false
      publication-admission-json:
        description: "Fresh sealed publication admission JSON; required for non-dry-run publication"
        default: ""
        type: string
        required: false
      publication-runner-provenance-json:
        description: "Runner provenance receipt bound by the admission"
        default: ""
        type: string
        required: false
      publication-control-plane-audit-json:
        description: "Fresh external control-plane audit receipt bound by the admission"
        default: ""
        type: string
        required: false
      publication-gate-aggregate-json:
        description: "Qualifying Shifu Gate aggregate or explicit consumer-owned no-Gate decision"
        default: ""
        type: string
        required: false
      publication-expected-json:
        description: "Independent exact source/runtime/product/channel/artifact bindings"
        default: ""
        type: string
        required: false
      publication-used-nonces-json:
        description: "JSON array of already consumed admission nonces"
        default: "[]"
        type: string
        required: false
      publication-auto-admission:
        description: "Assemble sealed evidence for Buildchain self-publication only"
        default: false
        type: boolean
        required: false
      publication-publisher-workflow-path:
        description: "Caller workflow path bound by the provider trusted-publisher policy"
        default: ""
        type: string
        required: false
      publication-product:
        default: "Buildchain"
        type: string
        required: false
      publication-target:
        default: "npm:@kungfu-tech/buildchain"
        type: string
        required: false
      publication-package-name:
        default: "@kungfu-tech/buildchain"
        type: string
        required: false
      dry-run:
        description: "Plan only; do not publish or move refs"
        default: false
        type: boolean
        required: false
    secrets:
      BUILDCHAIN_PROMOTION_TOKEN:
        description: "Optional bypass-capable token used only for generated protected ref updates"
        required: false
      buildchain-issue-token:
        description: "Optional token with issues:write on the Buildchain repository for workflow-friction reports"
        required: false
      BUILDCHAIN_ISSUE_TOKEN:
        description: "Optional token with issues:write on the Buildchain repository for workflow-friction reports"
        required: false
      buildchain-issue-app-id:
        description: "Optional GitHub App ID used to mint a Buildchain issue-report token"
        required: false
      BUILDCHAIN_ISSUE_APP_ID:
        description: "Optional GitHub App ID used to mint a Buildchain issue-report token"
        required: false
      buildchain-issue-app-private-key:
        description: "Optional GitHub App private key used to mint a Buildchain issue-report token"
        required: false
      BUILDCHAIN_ISSUE_APP_PRIVATE_KEY:
        description: "Optional GitHub App private key used to mint a Buildchain issue-report token"
        required: false
    outputs:
      promoted-sha:
        description: "Promoted channel SHA"
        value: ${{ jobs.promote.outputs.promoted-sha || jobs.preflight.outputs.current-sha }}
      built-source-sha:
        description: "PR-stage built source SHA"
        value: ${{ jobs.promote.outputs.built-source-sha }}
      release-candidate-artifact:
        description: "Resolved release-candidate artifact name"
        value: ${{ jobs.promote.outputs.release-candidate-artifact }}
      controller-plan-artifact:
        description: "Controller plan artifact name"
        value: ${{ jobs.controller-plan.outputs.controller-plan-artifact }}
      controller-plan-json:
        description: "Compact controller plan JSON"
        value: ${{ jobs.controller-plan.outputs.controller-plan-json }}
      controller-plan-digest:
        description: "Controller plan digest"
        value: ${{ jobs.controller-plan.outputs.controller-plan-digest }}
      publication-capability-digest:
        description: "Sealed publication capability receipt digest"
        value: ${{ jobs.publication-authority.outputs.capability-digest }}
      controller-receipt-artifact:
        description: "Controller receipt artifact name"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-artifact }}
      controller-receipt-json:
        description: "Compact controller receipt JSON"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-json }}
      controller-receipt-digest:
        description: "Controller receipt digest"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-digest }}
      controller-receipt-status:
        description: "Controller receipt status"
        value: ${{ jobs.controller-receipt.outputs.controller-receipt-status }}

concurrency:
  group: buildchain-release-promotion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Revalidate promotion intent
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      action: ${{ steps.intent.outputs.action }}
      reason: ${{ steps.intent.outputs.reason }}
      channel: ${{ steps.intent.outputs.channel }}
      target-ref: ${{ steps.intent.outputs.target-ref }}
      requested-sha: ${{ steps.intent.outputs.requested-sha }}
      current-sha: ${{ steps.intent.outputs.current-sha }}
      comparison-status: ${{ steps.intent.outputs.comparison-status }}
    steps:
      - name: Revalidate queued promotion intent
        id: intent
        uses: actions/github-script@v8
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_TARGET_REF: ${{ inputs.target-ref }}
          INPUT_TARGET_SHA: ${{ inputs.target-sha }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            const targetRef = (process.env.INPUT_TARGET_REF || context.ref.replace(/^refs\/heads\//, ""))
              .replace(/^refs\/heads\//, "");
            const requestedSha = process.env.INPUT_TARGET_SHA || context.sha;
            if (!/^[0-9a-f]{40}$/i.test(requestedSha)) {
              throw new Error(`promotion target SHA must be a 40-character Git SHA, got '${requestedSha}'`);
            }

            let derivedChannel = "";
            if (/^alpha\/v\d+\/v\d+\.\d+$/.test(targetRef)) derivedChannel = "alpha";
            if (/^release\/v\d+\/v\d+\.\d+$/.test(targetRef)) derivedChannel = "release";
            if (targetRef === "publish-gate/major" || targetRef === "major-gate") derivedChannel = "major";
            if (!derivedChannel) {
              throw new Error(`unsupported promote target ref: ${targetRef}`);
            }
            const channel = process.env.INPUT_CHANNEL || derivedChannel;
            if (channel !== derivedChannel) {
              throw new Error(`promotion channel ${channel} does not match target ref ${targetRef} (${derivedChannel})`);
            }

            const current = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${targetRef}`,
            });
            const currentSha = current.data.object.sha;
            const dryRun = process.env.INPUT_DRY_RUN === "true";
            let comparisonStatus = "identical";
            if (currentSha !== requestedSha) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${requestedSha}...${currentSha}`,
              });
              comparisonStatus = comparison.data.status;
            }
            const superseded = !dryRun && comparisonStatus === "ahead";
            if (!dryRun && currentSha !== requestedSha && !superseded) {
              throw new Error(
                `promotion target ${targetRef} moved incompatibly: requested ${requestedSha}, current ${currentSha}, comparison ${comparisonStatus}`,
              );
            }
            const action = superseded ? "noop" : "promote";
            const reason = superseded ? "target-ref-advanced" : "target-ref-current";

            core.setOutput("action", action);
            core.setOutput("reason", reason);
            core.setOutput("channel", channel);
            core.setOutput("target-ref", targetRef);
            core.setOutput("requested-sha", requestedSha);
            core.setOutput("current-sha", currentSha);
            core.setOutput("comparison-status", comparisonStatus);

            if (superseded) {
              core.notice(`Promotion intent is superseded: ${targetRef} is ${currentSha}, requested ${requestedSha}.`);
            }
            await core.summary
              .addHeading("Buildchain promotion intent")
              .addRaw(`- Action: \`${action}\`\n`)
              .addRaw(`- Reason: \`${reason}\`\n`)
              .addRaw(`- Channel: \`${channel}\`\n`)
              .addRaw(`- Target ref: \`${targetRef}\`\n`)
              .addRaw(`- Requested SHA: \`${requestedSha}\`\n`)
              .addRaw(`- Current SHA: \`${currentSha}\`\n`)
              .addRaw(`- Comparison: \`${comparisonStatus}\`\n`)
              .write();

  controller-plan:
    name: Plan release-candidate promotion controller
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      controller-plan-artifact: buildchain-release-promotion-controller-plan-${{ needs.preflight.outputs.requested-sha }}
      controller-plan-json: ${{ steps.controller-plan.outputs.controller-plan-json }}
      controller-plan-digest: ${{ steps.controller-plan.outputs.controller-plan-digest }}
      runtime-sha: ${{ steps.controller-runtime.outputs.sha }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v2' }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Resolve controller runtime identity
        id: controller-runtime
        shell: bash
        run: |
          runtime_sha="$(git -C .buildchain/runtime rev-parse HEAD)"
          contract_digest="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(".buildchain/runtime/dist/site/buildchain-contract.json","utf8")); process.stdout.write(value.contractDigest)')"
          {
            echo "sha=${runtime_sha}"
            echo "contract-digest=${contract_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Create release-candidate-promotion controller plan
        id: controller-plan
        run: node .buildchain/runtime/scripts/controller-evidence.mjs --mode plan
        env:
          BUILDCHAIN_CONTROLLER_ID: release-candidate-promotion
          BUILDCHAIN_CONTROLLER_SOURCE_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_CONTROLLER_SOURCE_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_CONTROLLER_RUNTIME_REF: ${{ inputs.buildchain-ref || 'v2' }}
          BUILDCHAIN_CONTROLLER_RUNTIME_SHA: ${{ steps.controller-runtime.outputs.sha }}
          BUILDCHAIN_CONTROLLER_CONTRACT_DIGEST: ${{ steps.controller-runtime.outputs.contract-digest }}
          BUILDCHAIN_CONTROLLER_INPUTS_JSON: ${{ toJSON(inputs) }}
          BUILDCHAIN_CONTROLLER_INPUT_BOUNDARY: workflow-call
          BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json

      - name: Upload release-candidate-promotion controller plan
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-release-promotion-controller-plan-${{ needs.preflight.outputs.requested-sha }}
          path: .buildchain/controller/plan.json
          if-no-files-found: error

  release-candidate-preflight:
    name: Preflight PR-stage release candidate evidence
    needs: [preflight, controller-plan]
    if: ${{ needs.preflight.outputs.action == 'promote' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      evidence-run-id: ${{ steps.release-candidate.outputs.release-candidate-run-id }}
      passport-artifact: ${{ steps.release-candidate.outputs.release-candidate-artifact }}
      summary-artifact: ${{ steps.release-candidate.outputs.release-candidate-build-summary-artifact }}
      manifest-pattern: ${{ inputs.artifact-name }}-manifest-*-${{ steps.release-candidate.outputs.release-candidate-source-sha }}
      payload-pattern: ${{ inputs.artifact-name }}-*
    steps:
      - name: Checkout Buildchain release-candidate resolver
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v2' }}
          path: .buildchain/runtime
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Preflight PR-stage release candidate evidence
        id: release-candidate
        run: node .buildchain/runtime/scripts/release-candidate-resolver.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_SOURCE_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_TARGET_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
          BUILDCHAIN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILDCHAIN_ARTIFACT_PATTERNS: ${{ inputs.artifact-patterns }}
          BUILDCHAIN_RC_WORKFLOW_FILE: ${{ inputs.release-candidate-workflow-file }}
          BUILDCHAIN_RC_WORKFLOW_NAME: ${{ inputs.release-candidate-workflow-name }}
          BUILDCHAIN_REQUIRED_ARTIFACT_COUNT: ${{ inputs.required-artifact-count }}
          BUILDCHAIN_PUBLISH_ARTIFACT_KIND: ${{ inputs.publish-artifact-kind }}
          BUILDCHAIN_PUBLISH_PACKAGE_MAIN: ${{ inputs.publish-package-main }}
          BUILDCHAIN_RC_DOWNLOAD: "false"

  publication-plan:
    name: Plan exact publication version
    needs: [preflight, controller-plan]
    if: ${{ needs.preflight.outputs.action == 'promote' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.planned-publication-version }}
      exact-tag: ${{ steps.plan.outputs.planned-publication-exact-tag }}
    steps:
      - name: Checkout promotion channel commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.requested-sha }}
          clean: true
          persist-credentials: false

      - name: Checkout exact Buildchain planner runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v2' }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Resolve exact publication transaction version
        id: plan
        uses: ./.buildchain/runtime/actions/promote-buildchain-ref
        with:
          token: ${{ github.token }}
          sha: ${{ needs.preflight.outputs.requested-sha }}
          target-ref: ${{ needs.preflight.outputs.target-ref }}
          dry-run: "true"
          require-governance: "false"
          require-version-state: "true"
          allow-repository: ${{ inputs.allow-repository || github.repository }}
          publish-transaction: "true"
          release-passport: "false"

      - name: Require an exact publication transaction version
        shell: bash
        env:
          BUILDCHAIN_PUBLICATION_VERSION: ${{ steps.plan.outputs.planned-publication-version }}
          BUILDCHAIN_PUBLICATION_EXACT_TAG: ${{ steps.plan.outputs.planned-publication-exact-tag }}
        run: |
          set -euo pipefail
          if [[ -z "$BUILDCHAIN_PUBLICATION_VERSION" || -z "$BUILDCHAIN_PUBLICATION_EXACT_TAG" ]]; then
            echo "::error::publication planning did not produce an exact version and tag"
            exit 1
          fi
          if [[ "v${BUILDCHAIN_PUBLICATION_VERSION}" != "$BUILDCHAIN_PUBLICATION_EXACT_TAG" ]]; then
            echo "::error::publication plan version/tag mismatch: ${BUILDCHAIN_PUBLICATION_VERSION} != ${BUILDCHAIN_PUBLICATION_EXACT_TAG}"
            exit 1
          fi

  publication-authority:
    name: Seal product publication capability
    needs: [preflight, controller-plan, release-candidate-preflight, publication-plan]
    if: ${{ needs.preflight.outputs.action == 'promote' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/.publication-authority.yml
    with:
      buildchain-repository: ${{ inputs.buildchain-repository }}
      buildchain-ref: ${{ needs.controller-plan.outputs.runtime-sha }}
      admission-json: ${{ inputs.publication-admission-json }}
      runner-provenance-json: ${{ inputs.publication-runner-provenance-json }}
      control-plane-audit-json: ${{ inputs.publication-control-plane-audit-json }}
      gate-aggregate-json: ${{ inputs.publication-gate-aggregate-json }}
      expected-json: ${{ inputs.publication-expected-json }}
      used-nonces-json: ${{ inputs.publication-used-nonces-json }}
      auto-admission: ${{ inputs.publication-auto-admission }}
      source-sha: ${{ needs.preflight.outputs.requested-sha }}
      target-ref: ${{ needs.preflight.outputs.target-ref }}
      publisher-workflow-path: ${{ inputs.publication-publisher-workflow-path }}
      product: ${{ inputs.publication-product }}
      publication-target: ${{ inputs.publication-target }}
      publication-version: ${{ needs.publication-plan.outputs.version }}
      package-name: ${{ inputs.publication-package-name }}
      evidence-repository: ${{ github.repository }}
      evidence-run-id: ${{ needs.release-candidate-preflight.outputs.evidence-run-id }}
      evidence-passport-artifact: ${{ needs.release-candidate-preflight.outputs.passport-artifact }}
      evidence-summary-artifact: ${{ needs.release-candidate-preflight.outputs.summary-artifact }}
      evidence-manifest-pattern: ${{ needs.release-candidate-preflight.outputs.manifest-pattern }}
      evidence-payload-pattern: ${{ needs.release-candidate-preflight.outputs.payload-pattern }}
      dry-run: ${{ inputs.dry-run }}

  promote:
    name: Promote release candidate
    needs: [preflight, controller-plan, release-candidate-preflight, publication-plan, publication-authority]
    if: ${{ needs.preflight.outputs.action == 'promote' && needs.publication-authority.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: write
      contents: write
      id-token: write
      issues: write
    outputs:
      promoted-sha: ${{ needs.preflight.outputs.requested-sha }}
      built-source-sha: ${{ steps.rc.outputs.release-candidate-source-sha }}
      release-candidate-artifact: ${{ steps.rc.outputs.release-candidate-artifact }}
      release-candidate-outcome: ${{ steps.rc.outcome }}
      promotion-outcome: ${{ steps.promote.outcome }}
    steps:
      - name: Download release-candidate-promotion controller plan
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.controller-plan.outputs.controller-plan-artifact }}
          path: .buildchain/controller

      - name: Checkout promotion channel commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.requested-sha }}
          clean: true
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Install promotion dependencies
        shell: bash
        run: |
          case "${PACKAGE_MANAGER}" in
            pnpm)
              corepack prepare pnpm@11.7.0 --activate
              corepack enable
              pnpm --version
              corepack pnpm@11.7.0 install --frozen-lockfile
              ;;
            yarn)
              corepack enable yarn
              yarn install --immutable || yarn install --frozen-lockfile
              ;;
            npm)
              if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                npm ci
              else
                npm install
              fi
              ;;
            custom)
              echo "::notice::Skipping dependency install for custom package manager."
              ;;
            *)
              echo "::error::Unsupported package-manager: ${PACKAGE_MANAGER}"
              exit 1
              ;;
          esac
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}

      - name: Resolve post-release reconciliation checkout
        id: reconciliation
        if: ${{ needs.preflight.outputs.channel == 'release' }}
        shell: bash
        env:
          BUILDCHAIN_TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
        run: |
          if [[ ! "${BUILDCHAIN_TARGET_REF}" =~ ^release/v[0-9]+/v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release reconciliation requires a release/vN/vN.M target, got ${BUILDCHAIN_TARGET_REF}"
            exit 1
          fi
          echo "ref=${BUILDCHAIN_TARGET_REF/release\//dev/}" >> "${GITHUB_OUTPUT}"
          echo "workspace=.buildchain/reconciliation/dev" >> "${GITHUB_OUTPUT}"

      - name: Checkout current development channel for reconciliation
        if: ${{ steps.reconciliation.outputs.ref != '' }}
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.reconciliation.outputs.ref }}
          path: .buildchain/reconciliation/dev
          clean: true
          persist-credentials: false

      - name: Install reconciliation dependencies
        if: ${{ steps.reconciliation.outputs.workspace != '' }}
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          RECONCILIATION_WORKSPACE: ${{ steps.reconciliation.outputs.workspace }}
        run: |
          case "${PACKAGE_MANAGER}" in
            pnpm)
              corepack pnpm@11.7.0 install --dir "${RECONCILIATION_WORKSPACE}" --frozen-lockfile
              ;;
            yarn)
              yarn --cwd "${RECONCILIATION_WORKSPACE}" install --immutable || yarn --cwd "${RECONCILIATION_WORKSPACE}" install --frozen-lockfile
              ;;
            npm)
              if [ -f "${RECONCILIATION_WORKSPACE}/package-lock.json" ] || [ -f "${RECONCILIATION_WORKSPACE}/npm-shrinkwrap.json" ]; then
                npm ci --prefix "${RECONCILIATION_WORKSPACE}"
              else
                npm install --prefix "${RECONCILIATION_WORKSPACE}"
              fi
              ;;
            custom)
              echo "::notice::Skipping reconciliation dependency install for custom package manager."
              ;;
            *)
              echo "::error::Unsupported package-manager: ${PACKAGE_MANAGER}"
              exit 1
              ;;
          esac

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v2' }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Resolve checked out Buildchain runtime
        id: buildchain-runtime
        shell: bash
        run: |
          runtime_ref="${INPUT_BUILDCHAIN_REF:-v2}"
          runtime_sha="$(git -C .buildchain/runtime rev-parse HEAD)"
          runtime_class="development"
          if [[ "${runtime_ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            runtime_class="exact-sha"
          elif [[ "${runtime_ref}" =~ ^(refs/heads/)?train/v[0-9]+/v[0-9]+\.[0-9]+/.+ ]]; then
            runtime_class="train"
          elif [[ "${runtime_ref}" =~ ^v[0-9]+(\.[0-9]+)?$ || "${runtime_ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            runtime_class="stable"
          elif [[ "${runtime_ref}" =~ ^v[0-9]+(\.[0-9]+)?-alpha$ || "${runtime_ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            runtime_class="alpha"
          fi
          {
            echo "ref=${runtime_ref}"
            echo "sha=${runtime_sha}"
            echo "class=${runtime_class}"
          } >> "${GITHUB_OUTPUT}"
        env:
          INPUT_BUILDCHAIN_REF: ${{ inputs.buildchain-ref }}

      - name: Install Buildchain runtime dependencies
        run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts

      - name: Check Buildchain contract lock
        id: contract-lock
        shell: bash
        run: |
          if [ -f .buildchain/runtime/scripts/buildchain-contract-lock.mjs ]; then
            node .buildchain/runtime/scripts/buildchain-contract-lock.mjs check
          else
            {
              echo "contract-lock-status=runtime-contract-unavailable"
              echo "contract-lock-compatible=true"
              echo "contract-lock-drift=false"
              echo "contract-lock-issue-needed=false"
              echo "contract-lock-issue-body-file="
              echo "contract-digest="
              echo "contract-compatibility-digest="
              echo "accepted-contract-digest="
              echo "accepted-buildchain-sha="
              echo "current-buildchain-sha=${BUILDCHAIN_RUNTIME_SHA}"
            } >> "${GITHUB_OUTPUT}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## Buildchain contract lock"
                echo
                echo "- Status: \`runtime-contract-unavailable\`"
                echo "- Runtime ref: \`${BUILDCHAIN_RUNTIME_REF}\`"
                echo "- Runtime SHA: \`${BUILDCHAIN_RUNTIME_SHA}\`"
                echo "- Note: the checked-out Buildchain runtime does not yet ship contract lock support."
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
          fi
        env:
          BUILDCHAIN_CONTRACT_LOCK_PATH: ${{ inputs.buildchain-contract-lock-path }}
          BUILDCHAIN_CONTRACT_COMPATIBILITY_POLICY: ${{ inputs.buildchain-contract-compatibility-policy }}
          BUILDCHAIN_CONTRACT_DRIFT_ISSUE_MODE: ${{ inputs.buildchain-contract-drift-issue-mode }}
          BUILDCHAIN_RUNTIME_ROOT: .buildchain/runtime
          BUILDCHAIN_RUNTIME_REF: ${{ steps.buildchain-runtime.outputs.ref }}
          BUILDCHAIN_RUNTIME_SHA: ${{ steps.buildchain-runtime.outputs.sha }}
          BUILDCHAIN_RUNTIME_CLASS: ${{ steps.buildchain-runtime.outputs.class }}
          BUILDCHAIN_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Report consumer Buildchain contract drift
        if: ${{ always() && steps.contract-lock.outputs.contract-lock-issue-needed == 'true' }}
        uses: ./.buildchain/runtime/actions/report-buildchain-issue
        with:
          token: ${{ github.token }}
          target-repository: ${{ github.repository }}
          title: "[Buildchain contract] ${{ github.repository }} drift on ${{ steps.buildchain-runtime.outputs.ref }}"
          failure-code: buildchain-contract-${{ steps.contract-lock.outputs.contract-lock-status }}
          buildchain-ref: ${{ steps.buildchain-runtime.outputs.ref }}
          buildchain-version: ${{ steps.contract-lock.outputs.contract-digest }}
          consumer-repository: ${{ github.repository }}
          consumer-ref: ${{ github.ref }}
          consumer-sha: ${{ needs.preflight.outputs.requested-sha }}
          workflow: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          summary: "Buildchain floating runtime contract drift: ${{ steps.contract-lock.outputs.contract-lock-status }}"
          body-file: ${{ steps.contract-lock.outputs.contract-lock-issue-body-file }}
          labels: "buildchain-contract-drift"
          comment-cooldown-hours: "24"
          fail-on-error: "false"

      - name: Resolve PR-stage release candidate
        id: rc
        run: node .buildchain/runtime/scripts/release-candidate-resolver.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_SOURCE_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_TARGET_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
          BUILDCHAIN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILDCHAIN_ARTIFACT_PATTERNS: ${{ inputs.artifact-patterns }}
          BUILDCHAIN_RC_WORKFLOW_FILE: ${{ inputs.release-candidate-workflow-file }}
          BUILDCHAIN_RC_WORKFLOW_NAME: ${{ inputs.release-candidate-workflow-name }}
          BUILDCHAIN_REQUIRED_ARTIFACT_COUNT: ${{ inputs.required-artifact-count }}
          BUILDCHAIN_PUBLISH_ARTIFACT_KIND: ${{ inputs.publish-artifact-kind }}
          BUILDCHAIN_PUBLISH_PACKAGE_MAIN: ${{ inputs.publish-package-main }}
          BUILDCHAIN_RC_OUTPUT_DIR: .buildchain/release-candidate

      - name: Resolve Buildchain stable candidate alpha
        id: buildchain-stable-candidate
        if: ${{ needs.preflight.outputs.channel == 'release' && github.repository == 'kungfu-systems/buildchain' }}
        shell: bash
        run: |
          version="$(node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync("package.json", "utf8")); process.stdout.write(String(manifest.version || ""));')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "::error::Buildchain stable candidate must declare an exact alpha version, got ${version:-<empty>}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Enforce Buildchain stable release canary gate
        if: >-
          ${{
            needs.preflight.outputs.channel == 'release' &&
            github.repository == 'kungfu-systems/buildchain' &&
            vars.BUILDCHAIN_STABLE_RELEASE_NOW != steps.buildchain-stable-candidate.outputs.version
          }}
        shell: bash
        run: node .buildchain/runtime/scripts/stable-release-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_PROMOTION_CHANNEL: ${{ needs.preflight.outputs.channel }}
          BUILDCHAIN_RELEASE_CANDIDATE_VERSION: ${{ steps.buildchain-stable-candidate.outputs.version }}
          BUILDCHAIN_RELEASE_CANDIDATE_RUN_ID: ${{ steps.rc.outputs.release-candidate-run-id }}
          BUILDCHAIN_RELEASE_CANDIDATE_RUN_URL: ${{ steps.rc.outputs.release-candidate-run-url }}
          BUILDCHAIN_RELEASE_IMPACT: ${{ inputs.release-passport-impact-json }}
          BUILDCHAIN_STABLE_RELEASE_POLICY: .buildchain/stable-release-policy.json
          BUILDCHAIN_STABLE_RELEASE_GATE_OUTPUT: ${{ inputs.release-passport-output-dir }}/stable-release-gate.json

      - name: Record Buildchain immediate stable authority
        if: >-
          ${{
            needs.preflight.outputs.channel == 'release' &&
            github.repository == 'kungfu-systems/buildchain' &&
            vars.BUILDCHAIN_STABLE_RELEASE_NOW == steps.buildchain-stable-candidate.outputs.version
          }}
        shell: bash
        env:
          BUILDCHAIN_STABLE_RELEASE_NOW: ${{ vars.BUILDCHAIN_STABLE_RELEASE_NOW }}
          BUILDCHAIN_STABLE_RELEASE_REASON: ${{ vars.BUILDCHAIN_STABLE_RELEASE_REASON }}
        run: |
          echo "::notice::Immediate stable release authorized for ${BUILDCHAIN_STABLE_RELEASE_NOW}"
          if [ -n "${BUILDCHAIN_STABLE_RELEASE_REASON}" ]; then
            echo "::notice::Authority reason: ${BUILDCHAIN_STABLE_RELEASE_REASON}"
          fi

      - name: Ensure publish-gate ref locks promotion commit
        id: publish-gate
        uses: actions/github-script@v8
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
          TARGET_SHA: ${{ needs.preflight.outputs.requested-sha }}
          PUBLICATION_VERSION: ${{ needs.publication-plan.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            const channel = process.env.CHANNEL;
            const targetRef = process.env.TARGET_REF;
            const targetSha = process.env.TARGET_SHA;
            const versionHint = process.env.PUBLICATION_VERSION;
            if (!versionHint) throw new Error("publish-gate lock requires the planned publication version");
            const dryRun = process.env.DRY_RUN === "true";
            const gateRef = channel === "major"
              ? "publish-gate/major"
              : `publish-gate/${channel}/${targetRef.replace(/^(alpha|release)\//, "")}/${versionHint}`;
            const ref = `heads/${gateRef}`;
            if (dryRun) {
              core.notice(`Dry-run would lock ${gateRef} to ${targetSha}`);
            } else {
              try {
                const current = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref });
                if (current.data.object.sha !== targetSha) {
                  await github.rest.git.updateRef({ owner: context.repo.owner, repo: context.repo.repo, ref, sha: targetSha, force: true });
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `refs/${ref}`, sha: targetSha });
              }
            }
            core.setOutput("ref", gateRef);
            core.setOutput("sha", targetSha);
            core.setOutput("locked", "true");

      - name: Promote-only publish
        id: promote
        uses: ./.buildchain/runtime/actions/promote-buildchain-ref
        with:
          token: ${{ github.token }}
          sha: ${{ needs.preflight.outputs.requested-sha }}
          target-ref: ${{ needs.preflight.outputs.target-ref }}
          dry-run: ${{ inputs.dry-run }}
          require-governance: "true"
          require-version-state: "true"
          reconciliation-workspace: ${{ steps.reconciliation.outputs.workspace }}
          required-status-check: ${{ inputs.required-status-check }}
          generated-status-check-token: ${{ github.token }}
          generated-ref-update-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN || github.token }}
          branch-protection-bypass-apps: ${{ inputs.branch-protection-bypass-apps }}
          branch-protection-bypass-users: ${{ inputs.branch-protection-bypass-users }}
          branch-protection-bypass-teams: ${{ inputs.branch-protection-bypass-teams }}
          allow-repository: ${{ inputs.allow-repository || github.repository }}
          publish-transaction: "true"
          publish-command: ${{ inputs.publish-command }}
          publish-required-artifacts-json: ${{ inputs.publish-required-artifacts-json || steps.rc.outputs.publish-required-artifacts-json }}
          publish-mode: ${{ inputs.publish-mode }}
          publish-auth: ${{ inputs.trusted-publishing && 'trusted-publishing' || 'npm-token' }}
          publish-dist-tag: ${{ inputs.publish-dist-tag }}
          publish-package-set-order: ${{ inputs.publish-package-set-order }}
          publish-package-main: ${{ inputs.publish-package-main }}
          expected-publication-version: ${{ needs.publication-plan.outputs.version }}
          require-publish-source-lock: "true"
          publish-source-ref: ${{ steps.publish-gate.outputs.ref }}
          publish-source-sha: ${{ steps.publish-gate.outputs.sha }}
          publish-source-locked: ${{ steps.publish-gate.outputs.locked }}
          release-passport: ${{ inputs.release-passport }}
          release-passport-output-dir: ${{ inputs.release-passport-output-dir }}
          release-passport-product-name: ${{ inputs.release-passport-product-name || inputs.artifact-name }}
          release-passport-build-summary-path: ${{ steps.rc.outputs.release-candidate-build-summary-path }}
          release-passport-platform-manifest-paths: ${{ inputs.release-passport-platform-manifest-paths || steps.rc.outputs.release-candidate-platform-manifest-paths }}
          release-passport-impact-json: ${{ inputs.release-passport-impact-json }}
          release-passport-kfd-1-witness-jsons: ${{ inputs.release-passport-kfd-1-witness-jsons }}
          release-passport-kfd-2-claim-jsons: ${{ inputs.release-passport-kfd-2-claim-jsons }}
          release-passport-kfd-3-prebuild-witness-jsons: ${{ inputs.release-passport-kfd-3-prebuild-witness-jsons }}
          release-passport-kfd-3-artifact-witness-jsons: ${{ inputs.release-passport-kfd-3-artifact-witness-jsons }}
          release-passport-kfd-3-artifact-verify-command: ${{ inputs.release-passport-kfd-3-artifact-verify-command }}
          release-passport-buildchain-self-kfd: ${{ inputs.release-passport-buildchain-self-kfd }}
          github-release: ${{ inputs.github-release }}
          github-release-title: ${{ inputs.github-release-title }}
          github-release-notes: ${{ inputs.github-release-notes }}
          promote-only-release-candidate: "true"
          release-candidate-passport-path: ${{ steps.rc.outputs.release-candidate-passport-path }}
          release-candidate-build-summary-path: ${{ steps.rc.outputs.release-candidate-build-summary-path }}
          release-candidate-version: ${{ steps.rc.outputs.release-candidate-version }}

      - name: Bundle release-candidate-promotion controller evidence
        id: controller-evidence
        if: ${{ always() && !inputs.dry-run && steps.promote.outcome == 'success' }}
        shell: bash
        env:
          RELEASE_CANDIDATE_PASSPORT: ${{ steps.rc.outputs.release-candidate-passport-path }}
          PUBLISH_EVIDENCE: ${{ steps.promote.outputs.publish-evidence-path }}
          RELEASE_PASSPORT: ${{ steps.promote.outputs.release-passport-path }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const files = [
            [process.env.RELEASE_CANDIDATE_PASSPORT, "release-candidate-passport.json"],
            [process.env.PUBLISH_EVIDENCE, "publish-evidence.json"],
            [process.env.RELEASE_PASSPORT, "release-passport.json"],
          ];
          fs.mkdirSync(".buildchain/controller/promotion-evidence", { recursive: true });
          for (const [source, name] of files) {
            if (!source || !fs.existsSync(source)) throw new Error(`promotion controller evidence is missing: ${source || name}`);
            fs.copyFileSync(source, path.join(".buildchain/controller/promotion-evidence", name));
          }
          NODE

      - name: Upload release-candidate-promotion controller evidence
        if: ${{ always() && steps.controller-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-release-promotion-controller-evidence-${{ needs.preflight.outputs.requested-sha }}
          path: .buildchain/controller/promotion-evidence/
          if-no-files-found: error

      - name: Classify Buildchain promotion friction
        id: friction
        if: ${{ failure() && !inputs.dry-run && steps.rc.outcome != '' }}
        shell: bash
        run: |
          reporter=".buildchain/runtime/scripts/workflow-friction-report.mjs"
          if [ ! -f "${reporter}" ]; then
            reporter="scripts/workflow-friction-report.mjs"
          fi
          node "${reporter}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDCHAIN_SOURCE_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_TARGET_REF: ${{ needs.preflight.outputs.target-ref }}
          BUILDCHAIN_TARGET_SHA: ${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_WORKFLOW_NAME: ${{ github.workflow }}
          BUILDCHAIN_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILDCHAIN_RC_RESOLVE_OUTCOME: ${{ steps.rc.outcome }}
          BUILDCHAIN_RC_DIAGNOSIS: ${{ steps.rc.outputs.release-candidate-diagnosis }}
          BUILDCHAIN_PROMOTION_OUTCOME: ${{ steps.promote.outcome }}
          BUILDCHAIN_PROMOTION_DIAGNOSIS: ${{ steps.promote.outputs.failure-message }}
          BUILDCHAIN_BUILD_WORKFLOW_FILE: ${{ inputs.release-candidate-workflow-file }}
          BUILDCHAIN_BUILD_WORKFLOW_NAME: ${{ inputs.release-candidate-workflow-name }}

      - name: Resolve Buildchain issue token mode
        id: issue-token-mode
        if: ${{ failure() && steps.friction.outcome == 'success' }}
        shell: bash
        run: |
          if [ -n "${DIRECT_TOKEN}" ]; then
            echo "create-app-token=false" >> "${GITHUB_OUTPUT}"
          elif [ -n "${APP_ID}" ] && [ -n "${APP_PRIVATE_KEY}" ]; then
            echo "create-app-token=true" >> "${GITHUB_OUTPUT}"
          else
            echo "create-app-token=false" >> "${GITHUB_OUTPUT}"
          fi
        env:
          DIRECT_TOKEN: ${{ secrets['buildchain-issue-token'] || secrets.BUILDCHAIN_ISSUE_TOKEN }}
          APP_ID: ${{ secrets['buildchain-issue-app-id'] || secrets.BUILDCHAIN_ISSUE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets['buildchain-issue-app-private-key'] || secrets.BUILDCHAIN_ISSUE_APP_PRIVATE_KEY }}

      - name: Create Buildchain issue token
        id: buildchain-issue-app-token
        if: ${{ failure() && steps.issue-token-mode.outputs.create-app-token == 'true' }}
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets['buildchain-issue-app-id'] || secrets.BUILDCHAIN_ISSUE_APP_ID }}
          private-key: ${{ secrets['buildchain-issue-app-private-key'] || secrets.BUILDCHAIN_ISSUE_APP_PRIVATE_KEY }}
          owner: kungfu-systems
          repositories: buildchain

      - name: Report Buildchain promotion friction
        if: ${{ failure() && steps.friction.outcome == 'success' }}
        uses: ./.buildchain/runtime/actions/report-buildchain-issue
        with:
          token: ${{ steps.buildchain-issue-app-token.outputs.token || secrets['buildchain-issue-token'] || secrets.BUILDCHAIN_ISSUE_TOKEN || github.token }}
          report-kind: workflow-friction
          target-repository: ${{ inputs.buildchain-repository }}
          repository: ${{ github.repository }}
          workflow: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          channel: ${{ needs.preflight.outputs.target-ref }}
          source-ref: ${{ github.ref_name }}
          source-sha: ${{ needs.preflight.outputs.requested-sha }}
          pull-request: ${{ steps.friction.outputs.pull-request }}
          friction-class: ${{ steps.friction.outputs.friction-class }}
          summary: ${{ steps.friction.outputs.summary }}
          diagnosis: ${{ steps.friction.outputs.diagnosis }}
          next-action: ${{ steps.friction.outputs.next-action }}
          body-file: ${{ steps.friction.outputs.body-file }}
          related-runs-json: ${{ steps.friction.outputs.related-runs-json }}
          heavy-builds-json: ${{ steps.friction.outputs.heavy-builds-json }}
          labels: "buildchain-feedback,workflow-friction"
          comment-cooldown-hours: "24"
          fail-on-error: "false"

  controller-receipt:
    name: Record release-candidate promotion controller receipt
    needs: [preflight, controller-plan, release-candidate-preflight, publication-authority, promote]
    if: ${{ always() && needs.controller-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      controller-receipt-artifact: buildchain-release-promotion-controller-receipt-${{ needs.preflight.outputs.requested-sha }}
      controller-receipt-json: ${{ steps.controller-receipt.outputs.controller-receipt-json }}
      controller-receipt-digest: ${{ steps.controller-receipt.outputs.controller-receipt-digest }}
      controller-receipt-status: ${{ steps.controller-receipt.outputs.controller-receipt-status }}
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v2' }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Download release-candidate-promotion controller plan
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.controller-plan.outputs.controller-plan-artifact }}
          path: .buildchain/controller

      - name: Download release-candidate-promotion controller evidence
        if: ${{ !inputs.dry-run && needs.promote.result == 'success' }}
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-release-promotion-controller-evidence-${{ needs.preflight.outputs.requested-sha }}
          path: .buildchain/controller/promotion-evidence

      - name: Create release-candidate-promotion controller receipt
        id: controller-receipt
        run: node .buildchain/runtime/scripts/controller-evidence.mjs --mode receipt
        env:
          BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
          BUILDCHAIN_CONTROLLER_STAGES_JSON: >-
            [{"id":"preflight","status":"${{ needs.preflight.result }}"},{"id":"admit-release-candidate","status":"${{ needs.release-candidate-preflight.result == 'success' && needs.promote.outputs.release-candidate-outcome || needs.release-candidate-preflight.result }}"},{"id":"publication-authority","status":"${{ needs.promote.result == 'success' && 'success' || needs.publication-authority.result }}"},{"id":"publish","status":"${{ inputs.dry-run && 'skipped' || needs.promote.outputs.promotion-outcome || needs.promote.result }}"},{"id":"passport","status":"${{ inputs.dry-run && 'skipped' || needs.promote.outputs.promotion-outcome || needs.promote.result }}"},{"id":"aggregate","status":"${{ needs.promote.result }}"}]
          BUILDCHAIN_CONTROLLER_EVIDENCE_FILES_JSON: ${{ !inputs.dry-run && needs.promote.result == 'success' && '[{"kind":"release-candidate-passport","path":".buildchain/controller/promotion-evidence/release-candidate-passport.json"},{"kind":"publish-evidence","path":".buildchain/controller/promotion-evidence/publish-evidence.json"},{"kind":"release-passport","path":".buildchain/controller/promotion-evidence/release-passport.json"}]' || '[]' }}
          BUILDCHAIN_CONTROLLER_REASON_CODE: ${{ inputs.dry-run && 'promotion-dry-run' || needs.promote.result == 'success' && '' || needs.preflight.outputs.action == 'noop' && 'promotion-superseded' || 'promotion-incomplete' }}
          BUILDCHAIN_CONTROLLER_REASON_SUMMARY: Release-candidate promotion did not complete successfully
          BUILDCHAIN_CONTROLLER_RECEIPT_ARTIFACT: buildchain-release-promotion-controller-receipt-${{ needs.preflight.outputs.requested-sha }}
          BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json

      - name: Upload release-candidate-promotion controller receipt
        if: ${{ always() && steps.controller-receipt.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-release-promotion-controller-receipt-${{ needs.preflight.outputs.requested-sha }}
          path: .buildchain/controller/receipt.json
          if-no-files-found: error

      - name: Enforce qualifying release-candidate-promotion controller receipt
        if: ${{ always() && !inputs.dry-run && needs.preflight.outputs.action == 'promote' && steps.controller-receipt.outputs.controller-receipt-qualifying != 'true' }}
        run: |
          echo "::error::release-candidate-promotion controller receipt is not qualifying: ${{ steps.controller-receipt.outputs.controller-receipt-status }}"
          exit 1
