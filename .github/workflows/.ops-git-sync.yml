on:
  workflow_call:
    inputs:
      remote-host:
        default: git-codecommit.cn-northwest-1.amazonaws.com.cn
        type: string
        required: false
      remote-path:
        default: v1/repos
        type: string
        required: false
      remote-repo:
        type: string
        required: true
      force:
        default: false
        type: boolean
        required: false
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
    secrets:
      REMOTE_USER:
        required: false
      REMOTE_CREDENTIAL:
        required: false
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source history
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Synchronize requested ref
        uses: ./.buildchain/runtime/actions/providers/git/sync
        with:
          remote-host: ${{ inputs.remote-host }}
          remote-path: ${{ inputs.remote-path }}
          remote-repo: ${{ inputs.remote-repo }}
          source-ref: ${{ github.ref_name }}
          force: ${{ inputs.force }}
          remote-user: ${{ secrets.REMOTE_USER }}
          remote-credential: ${{ secrets.REMOTE_CREDENTIAL }}
    needs:
      - execution-runtime
