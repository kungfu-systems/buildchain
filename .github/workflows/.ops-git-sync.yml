on:
  workflow_call:
    inputs:
      remote-host:
        default: "git-codecommit.cn-northwest-1.amazonaws.com.cn"
        type: string
        required: false
      remote-path:
        default: "v1/repos"
        type: string
        required: false
      remote-repo:
        type: string
        required: true
      force:
        default: false
        type: boolean
        required: false
    secrets:
      REMOTE_USER:
        required: false
      REMOTE_CREDENTIAL:
        # HTTPS credential URL, used only by the bounded transfer process.
        required: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source history
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Synchronize requested ref
        uses: ./.buildchain/workflow-shell/actions/providers/sync-git
        with:
          remote-host: ${{ inputs.remote-host }}
          remote-path: ${{ inputs.remote-path }}
          remote-repo: ${{ inputs.remote-repo }}
          source-ref: ${{ github.ref_name }}
          force: ${{ inputs.force }}
          remote-user: ${{ secrets.REMOTE_USER }}
          remote-credential: ${{ secrets.REMOTE_CREDENTIAL }}
