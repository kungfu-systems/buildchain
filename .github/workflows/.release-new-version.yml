on:
  workflow_call:
    inputs:
      node-version:
        default: "24"
        type: string
        required: false
      protect-dev-branches:
        default: false
        type: boolean
        required: false
      publish-github-npm:
        default: true
        type: boolean
        required: false
      publish-npmjs:
        default: false
        type: boolean
        required: false
      publish-aws-ci:
        default: true
        type: boolean
        required: false
      publish-aws-user:
        default: true
        type: boolean
        required: false
      aws-ci-region:
        default: "us-east-1"
        type: string
        required: false
      aws-user-region:
        default: "cn-northwest-1"
        type: string
        required: false
      bucket-staging-ci:
        default: "kungfu-prebuilt-staging"
        type: string
        required: false
      bucket-staging-user:
        default: "kungfu-prebuilt-staging"
        type: string
        required: false
      bucket-release-ci:
        default: "kungfu-prebuilt"
        type: string
        required: false
      bucket-release-user:
        default: "kungfu-prebuilt"
        type: string
        required: false
      clean-release-ci:
        default: false
        type: boolean
        required: false
      clean-release-user:
        default: false
        type: boolean
        required: false
      cloudfront-id-ci:
        default: ""
        type: string
        required: false
      cloudfront-id-user:
        default: ""
        type: string
        required: false
      cloudfront-paths-ci:
        default: "/*"
        type: string
        required: false
      cloudfront-paths-user:
        default: "/*"
        type: string
        required: false
      need-qa-automated:
        default: false
        type: boolean
        required: false
      close-issues:
        default: false
        type: boolean
        required: false
      create-release-note:
        default: false
        type: boolean
        required: false
      publish-release-note:
        default: false
        type: boolean
        required: false
      sync-extensions-version:
        default: false
        type: boolean
        required: false
      max-preview-links:
        default: "32"
        type: string
        required: false
      action-bump-version-repository:
        default: "kungfu-systems/buildchain"
        type: string
        required: false
      action-bump-version-ref:
        default: "v2"
        type: string
        required: false
      action-bump-version-path:
        default: "actions/bump-version"
        type: string
        required: false
    secrets:
      GITHUB_PUSH_TOKEN:
        required: false
      NPM_PUSH_TOKEN:
        required: false
      AWS_CI_ACCESS_KEY_ID:
        required: false
      AWS_CI_SECRET_ACCESS_KEY:
        required: false
      AWS_USER_ACCESS_KEY_ID:
        required: false
      AWS_USER_SECRET_ACCESS_KEY:
        required: false
      MONDAY_API_KEY:
        required: false
      AIRTABLE_API_KEY:
        required: false

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Legacy release workflow retired
        run: |
          echo "::error::The legacy .release-new-version.yml release path is retired."
          echo "::error::Use release-candidate-promote.yml@v2 with lifecycle.publish and publish-gate source-lock enforcement."
          exit 1
