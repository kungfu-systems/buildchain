name: Dev PR Auto Merge

on:
  workflow_call:
    inputs:
      buildchain-repository:
        description: "Buildchain runtime repository"
        default: "kungfu-systems/buildchain"
        type: string
        required: false
      buildchain-ref:
        description: "Explicit Buildchain v4 runtime ref; empty and v3 selectors are rejected."
        default: "v4"
        type: string
        required: false
      target-branch:
        description: "Protected dev branch to merge ready PRs into"
        default: ""
        type: string
        required: false
      expected-pr-number:
        description: "Optional exact PR number for targeted Agent admission; requires expected-head-sha"
        default: 0
        type: number
        required: false
      expected-head-sha:
        description: "Exact 40-character PR head required for targeted Agent admission"
        default: ""
        type: string
        required: false
      source-workflow-run-id:
        description: "Exact successful source workflow run retained for immediate Warrant handoff"
        default: 0
        type: number
        required: false
      handoff-workflow-id:
        description: "Optional consumer workflow file to dispatch when another candidate owns the active Warrant"
        default: ""
        type: string
        required: false
      source-workflow-id:
        description: "Optional consumer source workflow file used to recover a legacy active candidate's exact successful run"
        default: ""
        type: string
        required: false
      legacy-active-owner-binding-json:
        description: "Explicit legacy-safe handoff path carrying the exact phase-less queue root, fence, and generation"
        default: ""
        type: string
        required: false
      diagnostic-context:
        description: "Commit-status context used for PR-visible targeted admission state"
        default: "Buildchain delivery intent"
        type: string
        required: false
      delivery-warrant-mode:
        description: "Delivery Warrant rollout: off, shadow (read-only queue plan), or required"
        default: "off"
        type: string
        required: false
      assignment-root:
        {
          description: "Exact native Assignment content root",
          default: "",
          type: string,
          required: false,
        }
      initiative-root:
        {
          description: "Exact parent Initiative content root",
          default: "",
          type: string,
          required: false,
        }
      source-identity-root:
        {
          description: "Immutable semantic source identity root",
          default: "",
          type: string,
          required: false,
        }
      source-patch-root:
        {
          description: "Immutable source patch or tree-intent root",
          default: "",
          type: string,
          required: false,
        }
      project-cut-proof-json:
        {
          description: "Optional exact rooted Project Cut replay proof required when GitHub reports the PR behind the current protected base",
          default: "",
          type: string,
          required: false,
        }
      plan-root:
        {
          description: "Exact qualification plan root",
          default: "",
          type: string,
          required: false,
        }
      closure-root:
        {
          description: "Exact affected-closure root",
          default: "",
          type: string,
          required: false,
        }
      dependency-root:
        {
          description: "Exact dependency-graph root",
          default: "",
          type: string,
          required: false,
        }
      toolchain-root:
        {
          description: "Exact qualification toolchain root",
          default: "",
          type: string,
          required: false,
        }
      environment-root:
        {
          description: "Exact native execution environment contract root; required for required native qualification",
          default: "",
          type: string,
          required: false,
        }
      affected-paths-json:
        {
          description: "JSON array of paths covered by source qualification",
          default: "[]",
          type: string,
          required: false,
        }
      shard-evidence-roots-json:
        {
          description: "JSON array of additional native-shard evidence roots",
          default: "[]",
          type: string,
          required: false,
        }
      native-proof-json:
        {
          description: "Optional reusable semantic native proof; base-only drift is classified before use",
          default: "",
          type: string,
          required: false,
        }
      native-command:
        {
          description: "Native qualification command run after provisional Warrant selection when proof reuse is unavailable",
          default: "",
          type: string,
          required: false,
        }
      native-command-root:
        {
          description: "Optional exact root of native-command; when supplied it must match before admission or spawn",
          default: "",
          type: string,
          required: false,
        }
      release-blocker-priority-json:
        {
          description: "Optional exact rooted release-blocker priority claim",
          default: "",
          type: string,
          required: false,
        }
      native-heartbeat-seconds:
        {
          description: "Heartbeat cadence while native qualification is running",
          default: 300,
          type: number,
          required: false,
        }
      delivery-class:
        {
          description: "Bounded delivery class",
          default: "native-proof-required",
          type: string,
          required: false,
        }
      delivery-priority:
        {
          description: "Reviewed priority: ordinary, expedited, or emergency",
          default: "ordinary",
          type: string,
          required: false,
        }
      warrant-lease-seconds:
        {
          description: "Delivery Warrant lease TTL",
          default: 3600,
          type: number,
          required: false,
        }
      required-status-checks:
        {
          description: "Comma or newline separated required status/check-run name fragments",
          default: "check / check",
          type: string,
          required: false,
        }
      queue-admission-context:
        {
          description: "Exact-head status written and read back before native queue admission; required in Warrant mode",
          default: "",
          type: string,
          required: false,
        }
      active-lease-context:
        {
          description: "Exact-head lease status written and read back as pending before enqueue; required in Warrant mode",
          default: "",
          type: string,
          required: false,
        }
      ready-label:
        description: "Required label for PRs eligible to merge. Empty disables the label gate."
        default: "ready"
        type: string
        required: false
      block-labels:
        description: "Comma or newline separated labels that block merging"
        default: "blocked,do-not-merge,work-in-progress"
        type: string
        required: false
      allowed-head-prefixes:
        description: "Comma or newline separated allowed source branch prefixes"
        default: "feature/,fix/,chore/,docs/,ci/,refactor/"
        type: string
        required: false
      require-approval:
        description: "Require at least one current approval and no latest changes-requested review"
        default: true
        type: boolean
        required: false
      same-repository-only:
        description: "Reject fork/cross-repository PR heads by default"
        default: true
        type: boolean
        required: false
      max-merges:
        description: "Maximum PRs to merge in one run"
        default: 1
        type: number
        required: false
      merge-method:
        description: "GitHub merge method: merge, squash, or rebase"
        default: "merge"
        type: string
        required: false
      landing-mode:
        description: "Landing mode: auto selects native queue when enabled; queue fails closed without one"
        default: "auto"
        type: string
        required: false
      defer-landing:
        description: "Qualify the exact required Warrant and publish its evidence without landing the PR"
        default: false
        type: boolean
        required: false
      dry-run:
        description: "Plan only; do not merge PRs"
        default: true
        type: boolean
        required: false
    secrets:
      github-token:
        description: "Optional token for reading and merging PRs. Defaults to github.token."
        required: false
    outputs:
      evaluated-count:
        description: "Number of PRs evaluated"
        value: ${{ jobs.merge-dev-prs.outputs.evaluated-count }}
      merged-count:
        description: "Number of PRs directly merged, or directly eligible in dry-run mode"
        value: ${{ jobs.merge-dev-prs.outputs.merged-count }}
      enqueued-count:
        description: "Number of PRs admitted into the native merge queue"
        value: ${{ jobs.merge-dev-prs.outputs.enqueued-count }}
      action-count:
        description: "Number of direct merges, queue admissions, or planned actions"
        value: ${{ jobs.merge-dev-prs.outputs.action-count }}
      skipped-count:
        description: "Number of PRs skipped"
        value: ${{ jobs.merge-dev-prs.outputs.skipped-count }}
      final-base-sha:
        description: "Final target branch SHA after the run"
        value: ${{ jobs.merge-dev-prs.outputs.final-base-sha }}
      admission-state:
        description: "Typed targeted admission state; empty for cadence patrol"
        value: ${{ jobs.merge-dev-prs.outputs.admission-state }}
      admission-receipt-root:
        description: "Content root of the targeted exact-head admission receipt"
        value: ${{ jobs.merge-dev-prs.outputs.admission-receipt-root }}
      source-proof-root:
        description: "Content root of the reusable Source Qualification Proof"
        value: ${{ jobs.merge-dev-prs.outputs.source-proof-root }}
      warrant-receipt-root:
        description: "Content root of the selected Delivery Warrant receipt"
        value: ${{ jobs.merge-dev-prs.outputs.warrant-receipt-root }}
      warrant-state-root:
        description: "Exact readback root of the durable Warrant queue"
        value: ${{ jobs.merge-dev-prs.outputs.warrant-state-root }}
      warrant-state-commit:
        description: "Immutable queue commit containing the active Warrant readback"
        value: ${{ jobs.merge-dev-prs.outputs.warrant-state-commit }}
      project-cut-proof-root:
        description: "Verified exact Project Cut replay proof root, when supplied"
        value: ${{ jobs.merge-dev-prs.outputs.project-cut-proof-root }}
      native-proof-root:
        description: "Fresh or reused semantic native proof root"
        value: ${{ jobs.merge-dev-prs.outputs.native-proof-root }}
      native-reuse-decision-root:
        description: "Rooted fail-closed native proof reuse decision"
        value: ${{ jobs.merge-dev-prs.outputs.native-reuse-decision-root }}
      qualified-warrant-receipt-root:
        description: "Atomic provisional-to-qualified Warrant receipt root"
        value: ${{ jobs.merge-dev-prs.outputs.qualified-warrant-receipt-root }}
      native-execution-transfer-root:
        description: "Content root of the cross-job native proof and state transfer"
        value: ${{ jobs.merge-dev-prs.outputs.native-execution-transfer-root }}
      provider-finalizer-boundary-root:
        description: "Live provider readback root proving pairwise-distinct hosted native, seal, and finalizer domains"
        value: ${{ jobs.merge-dev-prs.outputs.provider-finalizer-boundary-root }}
      provider-heartbeat-receipt-root:
        description: "Rooted independent durable heartbeat continuity receipt"
        value: ${{ jobs.merge-dev-prs.outputs.provider-heartbeat-receipt-root }}

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  statuses: write

concurrency:
  group: buildchain-dev-pr-admission-${{ github.repository }}-${{ inputs.target-branch || github.ref_name }}-${{ inputs.expected-pr-number || github.run_id }}
  cancel-in-progress: false

jobs:
  admission:
    name: Reserve exact delivery candidate
    runs-on: ubuntu-24.04
    outputs:
      runtime-sha: ${{ steps.runtime.outputs.sha }}
      runtime-selection-root: ${{ steps.runtime.outputs.root }}
      target-branch: ${{ steps.target.outputs.branch }}
      branch-artifact: ${{ steps.target.outputs.branch-artifact }}
      source-proof-root: ${{ steps.proof.outputs.source-proof-root }}
      warrant-receipt-root: ${{ steps.warrant.outputs.warrant-receipt-root }}
      warrant-state-root: ${{ steps.warrant.outputs.warrant-state-root }}
      warrant-state-commit: ${{ steps.warrant.outputs.warrant-state-commit }}
      project-cut-proof-root: ${{ steps.project-cut.outputs.proof-root }}
      native-proof-root: ${{ steps.warrant.outputs.native-proof-root }}
      native-reuse-decision-root: ${{ steps.warrant.outputs.decision-root }}
      qualified-warrant-receipt-root: ${{ steps.warrant.outputs.qualification-receipt-root }}
      handoff-required: ${{ steps.warrant.outputs.handoff-required }}
      handoff-dispatched: ${{ steps.warrant.outputs.handoff-dispatched }}
      already-qualified: ${{ steps.warrant.outputs.already-qualified }}
      run-native: ${{ inputs.delivery-warrant-mode == 'required' && steps.warrant.outcome == 'success' && steps.warrant.outputs.handoff-required != 'true' && steps.warrant.outputs.already-qualified != 'true' }}
    steps:
      - name: Resolve target branch
        id: target
        shell: bash
        run: |
          target_branch="${INPUT_TARGET_BRANCH:-${GITHUB_REF_NAME}}"
          case "${target_branch}" in
            dev/v*/v*) ;;
            *)
              echo "::error::target-branch must be a semver dev branch such as dev/v4/v4.N, got: ${target_branch}"
              exit 1
              ;;
          esac
          echo "branch=${target_branch}" >> "${GITHUB_OUTPUT}"
          echo "branch-artifact=${target_branch//\//-}" >> "${GITHUB_OUTPUT}"
          case "${WARRANT_MODE}" in
            off|shadow|required) ;;
            *)
              echo "::error::delivery-warrant-mode must be off, shadow, or required"
              exit 1
              ;;
          esac
          if [ "${WARRANT_MODE}" != "off" ] && { [ "${EXPECTED_PR}" = "0" ] || [ -z "${EXPECTED_HEAD}" ]; }; then
            echo "::error::delivery Warrant rollout requires an exact PR number and head"
            exit 1
          fi
          if [ "${WARRANT_MODE}" = "required" ] && [ "${DRY_RUN}" = "true" ]; then
            echo "::error::required delivery Warrant mode cannot be combined with dry-run"
            exit 1
          fi
        env:
          INPUT_TARGET_BRANCH: ${{ inputs.target-branch }}
          WARRANT_MODE: ${{ inputs.delivery-warrant-mode }}
          EXPECTED_PR: ${{ inputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ inputs.expected-head-sha }}
          DRY_RUN: ${{ inputs.dry-run }}

      - name: Validate native qualification contract before Warrant admission
        if: inputs.delivery-warrant-mode == 'required'
        shell: bash
        run: |
          case "${DELIVERY_CLASS}" in
            native-proof-required|cross-platform|release)
              if [[ ! "${ENVIRONMENT_ROOT}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::environment-root must be an exact sha256 content root before required native Warrant admission"
                exit 1
              fi
              ;;
            non-native-fast) ;;
            *)
              echo "::error::unsupported delivery-class ${DELIVERY_CLASS}"
              exit 1
              ;;
          esac
        env:
          DELIVERY_CLASS: ${{ inputs.delivery-class }}
          ENVIRONMENT_ROOT: ${{ inputs.environment-root }}

      - name: Require explicit v4 delivery runtime authority
        shell: bash
        run: |
          case "${BUILDCHAIN_REF}" in
            v4|v4-alpha) ;;
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            train/v4/v4.0/*)
              if [[ ! "${BUILDCHAIN_REF}" =~ ^train/v4/v4\.0/[a-z0-9][a-z0-9._-]*$ ]]; then
                echo "::error::trusted v4 train selector has an invalid capability component"
                exit 1
              fi
              ;;
            *) [[ "${BUILDCHAIN_REF}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::buildchain-ref must be an exact immutable SHA, v4, v4-alpha, or train/v4/v4.0/<capability>"; exit 1; } ;;
          esac
        env:
          BUILDCHAIN_REF: ${{ inputs.buildchain-ref }}

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Root the once-resolved Buildchain runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_sha="$(git -C .buildchain/runtime rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "${runtime_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::resolved Buildchain runtime is not an exact commit SHA"
            exit 1
          fi
          if [[ "${BUILDCHAIN_REF}" =~ ^[0-9a-f]{40}$ && "${runtime_sha}" != "${BUILDCHAIN_REF}" ]]; then echo "::error::resolved Buildchain runtime SHA does not match the immutable selector"; exit 1; fi
          mkdir -p .buildchain/dev-delivery
          jq -n \
            --arg repository "${BUILDCHAIN_REPOSITORY}" \
            --arg selector "${BUILDCHAIN_REF}" \
            --arg sha "${runtime_sha}" \
            '{schema:"kungfu.buildchain.dev-delivery-runtime-selection/v1",repository:$repository,selector:$selector,resolvedSha:$sha}' \
            > .buildchain/dev-delivery/runtime-selection.json
          runtime_root="sha256:$(sha256sum .buildchain/dev-delivery/runtime-selection.json | cut -d' ' -f1)"
          {
            echo "sha=${runtime_sha}"
            echo "root=${runtime_root}"
          } >> "${GITHUB_OUTPUT}"
        env:
          BUILDCHAIN_REPOSITORY: ${{ inputs.buildchain-repository }}
          BUILDCHAIN_REF: ${{ inputs.buildchain-ref }}

      - name: Reject a locked protected branch before Warrant selection
        if: inputs.delivery-warrant-mode == 'required'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.github-token || github.token }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          encoded_branch="${TARGET_BRANCH//\//%2F}"
          protection_error="$(mktemp)"
          if protection="$(gh api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch/protection" 2>"$protection_error")"; then
            locked="$(jq -r '.lock_branch.enabled // false' <<<"$protection")"
          elif grep -q 'HTTP 404' "$protection_error"; then
            locked=false
          else
            cat "$protection_error" >&2
            exit 1
          fi
          rm -f "$protection_error"
          applied_rules="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$encoded_branch")"
          if jq -e 'any(.[]?; .type == "update")' <<<"$applied_rules" >/dev/null; then
            locked=true
          fi
          if [ "$locked" = "true" ]; then
            echo "::error::Protected branch $TARGET_BRANCH is locked by classic protection or an applied update rule; native merge queue admission cannot change a locked branch"
            exit 1
          fi

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Verify optional exact Project Cut replay proof
        id: project-cut
        if: inputs.project-cut-proof-json != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .buildchain/dev-delivery
          printf '%s\n' "${PROJECT_CUT_PROOF_JSON}" > .buildchain/dev-delivery/project-cut-proof.json
          node .buildchain/runtime/scripts/dev-delivery-proof.mjs verify-replay \
            --source-proof .buildchain/dev-delivery/project-cut-proof.json \
            --output .buildchain/dev-delivery/project-cut-verification.json
          jq -e '.ok == true and .reason == "exact-project-cut-replay"' \
            .buildchain/dev-delivery/project-cut-verification.json >/dev/null
          echo "path=.buildchain/dev-delivery/project-cut-proof.json" >> "${GITHUB_OUTPUT}"
          echo "proof-root=$(jq -er '.proofRoot' .buildchain/dev-delivery/project-cut-proof.json)" >> "${GITHUB_OUTPUT}"
        env:
          PROJECT_CUT_PROOF_JSON: ${{ inputs.project-cut-proof-json }}

      - name: Qualify exact source before scheduling
        id: qualify
        if: inputs.delivery-warrant-mode != 'off'
        continue-on-error: true
        shell: bash
        run: |
          args=(
            --repository "${GITHUB_REPOSITORY}"
            --branch "${TARGET_BRANCH}"
            --pull-request "${EXPECTED_PR}"
            --expected-head "${EXPECTED_HEAD}"
            --landing-mode queue
            --qualification-only
            --source-patch-root "${SOURCE_PATCH_ROOT}"
            --output .buildchain/dev-delivery/source-admission.json
          )
          if [ -n "${PROJECT_CUT_PROOF_PATH}" ]; then
            args+=(--project-cut-proof "${PROJECT_CUT_PROOF_PATH}")
          fi
          if [ "${WARRANT_MODE}" = "required" ] || { [ "${WARRANT_MODE}" = "shadow" ] && [ "${DRY_RUN}" != "true" ]; }; then
            args+=(--execute)
          fi
          node .buildchain/runtime/scripts/dev-pr-auto-merge.mjs "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          EXPECTED_PR: ${{ inputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ inputs.expected-head-sha }}
          WARRANT_MODE: ${{ inputs.delivery-warrant-mode }}
          BUILDCHAIN_DEV_PR_WARRANT_MODE: ${{ inputs.delivery-warrant-mode == 'required' && 'required' || 'off' }}
          DRY_RUN: ${{ inputs.dry-run }}
          SOURCE_PATCH_ROOT: ${{ inputs.source-patch-root }}
          PROJECT_CUT_PROOF_PATH: ${{ steps.project-cut.outputs.path }}
          BUILDCHAIN_DEV_PR_DIAGNOSTIC_CONTEXT: ${{ inputs.diagnostic-context }}
          BUILDCHAIN_DEV_PR_REQUIRED_CHECKS: ${{ inputs.required-status-checks }}
          BUILDCHAIN_DEV_PR_READY_LABEL: ${{ inputs.ready-label }}
          BUILDCHAIN_DEV_PR_BLOCK_LABELS: ${{ inputs.block-labels }}
          BUILDCHAIN_DEV_PR_ALLOWED_HEAD_PREFIXES: ${{ inputs.allowed-head-prefixes }}
          BUILDCHAIN_DEV_PR_REQUIRE_APPROVAL: ${{ inputs.require-approval }}
          BUILDCHAIN_DEV_PR_SAME_REPOSITORY_ONLY: ${{ inputs.same-repository-only }}
          BUILDCHAIN_DEV_PR_QUEUE_ADMISSION_CONTEXT: ${{ inputs.queue-admission-context }}

      - name: Seal Source Qualification Proof
        id: proof
        if: inputs.delivery-warrant-mode != 'off' && steps.qualify.outcome == 'success'
        shell: bash
        run: |
          receipt_root="$(jq -er '.receiptRoot' .buildchain/dev-delivery/source-admission.json)"
          evidence_roots="$(jq -cn --arg root "${receipt_root}" '[$root]')"
          node .buildchain/runtime/scripts/dev-delivery-proof.mjs source \
            --repository "${GITHUB_REPOSITORY}" \
            --branch "${TARGET_BRANCH}" \
            --source-identity-root "${SOURCE_IDENTITY_ROOT}" \
            --source-head "${EXPECTED_HEAD}" \
            --source-patch-root "${SOURCE_PATCH_ROOT}" \
            --plan-root "${PLAN_ROOT}" \
            --closure-root "${CLOSURE_ROOT}" \
            --dependency-root "${DEPENDENCY_ROOT}" \
            --toolchain-root "${TOOLCHAIN_ROOT}" \
            --affected-paths-json "${AFFECTED_PATHS}" \
            --shard-evidence-roots-json "${evidence_roots}" \
            --qualified-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output .buildchain/dev-delivery/source-proof.json
          echo "source-proof-root=$(jq -er '.proofRoot' .buildchain/dev-delivery/source-proof.json)" >> "${GITHUB_OUTPUT}"
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected-head-sha }}
          SOURCE_IDENTITY_ROOT: ${{ inputs.source-identity-root }}
          SOURCE_PATCH_ROOT: ${{ inputs.source-patch-root }}
          PLAN_ROOT: ${{ inputs.plan-root }}
          CLOSURE_ROOT: ${{ inputs.closure-root }}
          DEPENDENCY_ROOT: ${{ inputs.dependency-root }}
          TOOLCHAIN_ROOT: ${{ inputs.toolchain-root }}
          AFFECTED_PATHS: ${{ inputs.affected-paths-json }}

      - name: Submit qualified delivery candidate
        id: submit
        if: inputs.delivery-warrant-mode != 'off' && steps.proof.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          args=(
            submit
            --repository "${GITHUB_REPOSITORY}"
            --branch "${TARGET_BRANCH}"
            --pull-request "${EXPECTED_PR}"
            --source-head "${EXPECTED_HEAD}"
            --assignment-root "${ASSIGNMENT_ROOT}"
            --initiative-root "${INITIATIVE_ROOT}"
            --source-identity-root "${SOURCE_IDENTITY_ROOT}"
            --source-patch-root "${SOURCE_PATCH_ROOT}"
            --source-proof-root "${SOURCE_PROOF_ROOT}"
            --plan-root "${PLAN_ROOT}"
            --closure-root "${CLOSURE_ROOT}"
            --dependency-root "${DEPENDENCY_ROOT}"
            --toolchain-root "${TOOLCHAIN_ROOT}"
            --affected-paths-json "${AFFECTED_PATHS}"
            --shard-evidence-roots-json "${SHARD_ROOTS}"
            --delivery-class "${DELIVERY_CLASS}"
            --priority "${DELIVERY_PRIORITY}"
            --output .buildchain/dev-delivery/submission.json
          )
          if [ -n "${ENVIRONMENT_ROOT}" ]; then
            args+=(--environment-root "${ENVIRONMENT_ROOT}" --native-command "${NATIVE_COMMAND}")
          elif [ -n "${NATIVE_COMMAND}" ]; then
            echo "::error::Native command requires an exact environment root"
            exit 1
          fi
          if [ -n "${NATIVE_COMMAND_ROOT}" ]; then
            args+=(--native-command-root "${NATIVE_COMMAND_ROOT}")
          fi
          if [ -n "${RELEASE_BLOCKER_PRIORITY}" ]; then
            args+=(--release-blocker-priority-json "${RELEASE_BLOCKER_PRIORITY}")
          fi
          if [ "${SOURCE_WORKFLOW_RUN_ID}" -gt 0 ]; then
            args+=(--source-workflow-run-id "${SOURCE_WORKFLOW_RUN_ID}")
          fi
          if [ "${WARRANT_MODE}" = "required" ]; then
            args+=(--execute)
          fi
          node .buildchain/runtime/scripts/dev-delivery-warrant.mjs "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          EXPECTED_PR: ${{ inputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ inputs.expected-head-sha }}
          ASSIGNMENT_ROOT: ${{ inputs.assignment-root }}
          INITIATIVE_ROOT: ${{ inputs.initiative-root }}
          SOURCE_IDENTITY_ROOT: ${{ inputs.source-identity-root }}
          SOURCE_PATCH_ROOT: ${{ inputs.source-patch-root }}
          SOURCE_PROOF_ROOT: ${{ steps.proof.outputs.source-proof-root }}
          SOURCE_WORKFLOW_RUN_ID: ${{ inputs.source-workflow-run-id }}
          PLAN_ROOT: ${{ inputs.plan-root }}
          CLOSURE_ROOT: ${{ inputs.closure-root }}
          DEPENDENCY_ROOT: ${{ inputs.dependency-root }}
          TOOLCHAIN_ROOT: ${{ inputs.toolchain-root }}
          ENVIRONMENT_ROOT: ${{ inputs.environment-root }}
          AFFECTED_PATHS: ${{ inputs.affected-paths-json }}
          SHARD_ROOTS: ${{ inputs.shard-evidence-roots-json }}
          NATIVE_COMMAND: ${{ inputs.native-command }}
          NATIVE_COMMAND_ROOT: ${{ inputs.native-command-root }}
          RELEASE_BLOCKER_PRIORITY: ${{ inputs.release-blocker-priority-json }}
          DELIVERY_CLASS: ${{ inputs.delivery-class }}
          DELIVERY_PRIORITY: ${{ inputs.delivery-priority }}
          WARRANT_MODE: ${{ inputs.delivery-warrant-mode }}

      - name: Select exact Delivery Warrant
        id: warrant
        if: inputs.delivery-warrant-mode == 'required' && steps.submit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          node .buildchain/runtime/scripts/dev-delivery-warrant.mjs select \
            --repository "${GITHUB_REPOSITORY}" \
            --branch "${TARGET_BRANCH}" \
            --lease-seconds "${LEASE_SECONDS}" \
            --execute \
            --output .buildchain/dev-delivery/warrant.json
          selected_pr="$(jq -er '.observation.activeWarrant.pullRequestNumber' .buildchain/dev-delivery/warrant.json)"
          selected_head="$(jq -er '.observation.activeWarrant.sourceHead' .buildchain/dev-delivery/warrant.json)"
          selected_phase="$(jq -r '.observation.activeWarrant.phase // "legacy-active"' .buildchain/dev-delivery/warrant.json)"
          if [ "$selected_pr" != "$EXPECTED_PR" ] || [ "$selected_head" != "$EXPECTED_HEAD" ]; then
            if [ -z "$HANDOFF_WORKFLOW_ID" ]; then
              echo "::error::Active Warrant belongs to PR #$selected_pr, but no immediate handoff workflow was configured"
              exit 1
            fi
            source_run_id="$(jq -r '.observation.activeWarrant.sourceWorkflowRunId // 0' .buildchain/dev-delivery/warrant.json)"
            if [ "$source_run_id" -eq 0 ]; then
              if [ -z "$SOURCE_WORKFLOW_ID" ]; then
                echo "::error::Legacy active Warrant for PR #$selected_pr has no source run and no source workflow was configured"
                exit 1
              fi
              source_runs="$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$SOURCE_WORKFLOW_ID/runs" \
                -f head_sha="$selected_head" \
                -f event=pull_request \
                -f status=completed \
                -f per_page=100)"
              source_run_candidates="$(jq --argjson pr "$selected_pr" --arg head "$selected_head" '[.workflow_runs[] | select(.conclusion == "success" and .head_sha == $head and any(.pull_requests[]?; .number == $pr))] | sort_by(.id)' <<<"$source_runs")"
              if [ "$(jq 'length' <<<"$source_run_candidates")" -eq 0 ]; then
                echo "::error::Legacy active Warrant source recovery requires a successful $SOURCE_WORKFLOW_ID run for PR #$selected_pr at $selected_head; found none"
                exit 1
              fi
              source_run_id="$(jq -er 'last | .id' <<<"$source_run_candidates")"
            fi
            handoff_args=(
              -f "target-branch=$TARGET_BRANCH"
              -f "expected-pr-number=$selected_pr"
              -f "expected-head-sha=$selected_head"
              -f "source-workflow-run-id=$source_run_id"
              -f "assignment-root=$(jq -er '.observation.activeWarrant.assignmentRoot' .buildchain/dev-delivery/warrant.json)"
              -f "initiative-root=$(jq -er '.observation.activeWarrant.initiativeRoot' .buildchain/dev-delivery/warrant.json)"
              -f "source-identity-root=$(jq -er '.observation.activeWarrant.sourceIdentityRoot' .buildchain/dev-delivery/warrant.json)"
              -f "source-patch-root=$(jq -er '.observation.activeWarrant.sourcePatchRoot' .buildchain/dev-delivery/warrant.json)"
              -f "plan-root=$(jq -er '.observation.activeWarrant.planRoot' .buildchain/dev-delivery/warrant.json)"
              -f "closure-root=$(jq -er '.observation.activeWarrant.closureRoot' .buildchain/dev-delivery/warrant.json)"
              -f "dependency-root=$(jq -er '.observation.activeWarrant.dependencyRoot' .buildchain/dev-delivery/warrant.json)"
              -f "toolchain-root=$(jq -er '.observation.activeWarrant.toolchainRoot' .buildchain/dev-delivery/warrant.json)"
              -f "affected-paths-json=$(jq -c '.observation.activeWarrant.affectedPaths // []' .buildchain/dev-delivery/warrant.json)"
              -f "shard-evidence-roots-json=$(jq -c '.observation.activeWarrant.shardEvidenceRoots // []' .buildchain/dev-delivery/warrant.json)"
              -f "release-blocker-priority-json=$(jq -c '.observation.activeWarrant.releaseBlockerPriority // empty' .buildchain/dev-delivery/warrant.json)"
              -f "delivery-class=$(jq -er '.observation.activeWarrant.deliveryClass' .buildchain/dev-delivery/warrant.json)"
              -f "delivery-priority=$(jq -r '.observation.activeWarrant.priority // "ordinary"' .buildchain/dev-delivery/warrant.json)"
              -f dry-run=false
            )
            if [ "$selected_phase" = "legacy-active" ]; then
              handoff_args+=(
                -f "legacy-active-owner-binding-json=$(jq -c '{schema:"kungfu.buildchain.legacy-active-owner-binding/v1",stateRoot:.observation.stateRoot,fencingToken:.observation.activeWarrant.fencingToken,generation:.observation.activeWarrant.generation}' .buildchain/dev-delivery/warrant.json)"
              )
            else
              handoff_args+=(
                -f "environment-root=$(jq -er '.observation.activeWarrant.environmentRoot' .buildchain/dev-delivery/warrant.json)"
                -f "native-command=$(jq -er '.observation.activeWarrant.nativeCommandContract.command' .buildchain/dev-delivery/warrant.json)"
                -f "native-command-root=$(jq -er '.observation.activeWarrant.nativeCommandContract.commandRoot' .buildchain/dev-delivery/warrant.json)"
                -f "native-heartbeat-seconds=$HEARTBEAT_SECONDS"
              )
            fi
            gh workflow run "$HANDOFF_WORKFLOW_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$TARGET_BRANCH" \
              "${handoff_args[@]}"
            mkdir -p .buildchain/dev-pr-auto-merge
            jq -n \
              --argjson requestedPr "$EXPECTED_PR" \
              --arg requestedHead "$EXPECTED_HEAD" \
              --argjson activePr "$selected_pr" \
              --arg activeHead "$selected_head" \
              --argjson sourceRunId "$source_run_id" \
              --arg commandPath "$selected_phase" \
              --arg stateRoot "$(jq -er '.observation.stateRoot' .buildchain/dev-delivery/warrant.json)" \
              --arg fencingToken "$(jq -er '.observation.activeWarrant.fencingToken' .buildchain/dev-delivery/warrant.json)" \
              --argjson generation "$(jq -er '.observation.activeWarrant.generation' .buildchain/dev-delivery/warrant.json)" \
              '{schema:"kungfu.buildchain.dev-warrant-handoff/v1",ok:true,outcome:"active-warrant-handoff-dispatched",commandPath:(if $commandPath == "legacy-active" then "legacy-phase-less-active-owner" else "standard" end),requested:{pullRequestNumber:$requestedPr,sourceHead:$requestedHead},active:{pullRequestNumber:$activePr,sourceHead:$activeHead,sourceWorkflowRunId:$sourceRunId,stateRoot:$stateRoot,fencingToken:$fencingToken,generation:$generation}}' \
              > .buildchain/dev-pr-auto-merge/result.json
            {
              echo "handoff-required=true"
              echo "handoff-dispatched=true"
              echo "active-pr-number=$selected_pr"
              echo "active-head-sha=$selected_head"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "handoff-required=false" >> "$GITHUB_OUTPUT"
          case "$selected_phase" in
            provisional)
              echo "already-qualified=false" >> "$GITHUB_OUTPUT"
              ;;
            qualified)
              echo "already-qualified=true" >> "$GITHUB_OUTPUT"
              {
                echo "native-proof-root=$(jq -er '.observation.activeWarrant.nativeProofRoot' .buildchain/dev-delivery/warrant.json)"
                echo "decision-root=$(jq -er '.observation.activeWarrant.nativeProofReuseRoot' .buildchain/dev-delivery/warrant.json)"
                echo "qualification-receipt-root=$(jq -er '.observation.activeWarrant.qualificationReceiptRoot' .buildchain/dev-delivery/warrant.json)"
              } >> "$GITHUB_OUTPUT"
              ;;
            legacy-active)
              if [ -z "$LEGACY_ACTIVE_OWNER_BINDING" ]; then
                echo "::error::Phase-less active Warrant requires the explicit legacy-safe active-owner command path"
                exit 1
              fi
              echo "already-qualified=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Active Warrant has unsupported phase $selected_phase"
              exit 1
              ;;
          esac
          jq -e \
            --argjson pr "${EXPECTED_PR}" \
            --arg head "${EXPECTED_HEAD}" \
            --arg phase "$selected_phase" \
            --arg legacyOwnerStateRoot "$(jq -er '.receipt.expectedOldStateRoot' .buildchain/dev-delivery/submission.json)" \
            --argjson legacyBinding "${LEGACY_ACTIVE_OWNER_BINDING:-null}" \
            '.schema == "kungfu.buildchain.dev-delivery-command-result/v1"
             and .mode == "execute"
             and (.after.commitSha | test("^[0-9a-f]{40}$"))
             and (.after.stateRoot == .observation.stateRoot)
             and (.warrant == .observation.activeWarrant)
             and (($phase == "legacy-active" and (.observation.activeWarrant | has("phase") | not)
                   and .observation.activeCandidate.deliveryClass == "non-native-fast"
                   and (.observation.activeCandidate | has("environmentRoot") | not)
                   and $legacyBinding.schema == "kungfu.buildchain.legacy-active-owner-binding/v1"
                   and $legacyBinding.stateRoot == $legacyOwnerStateRoot
                   and $legacyBinding.fencingToken == .observation.activeWarrant.fencingToken
                   and $legacyBinding.generation == .observation.activeWarrant.generation)
                  or .observation.activeWarrant.phase == $phase)
             and (.observation.activeWarrant.pullRequestNumber == $pr)
             and (.observation.activeWarrant.sourceHead == $head)
             and (.observation.activeCandidate.pullRequestNumber == $pr)
             and (.observation.activeCandidate.sourceHead == $head)
             and (.observation.activeCandidate.candidateId == .observation.activeWarrant.candidateId)
             and ($phase != "qualified" or
               ((.observation.activeWarrant.nativeProofRoot | test("^sha256:[0-9a-f]{64}$"))
                and (.observation.activeWarrant.nativeProofReuseRoot | test("^sha256:[0-9a-f]{64}$"))
                and .observation.activeCandidate.status == "qualified"))' \
            .buildchain/dev-delivery/warrant.json >/dev/null
          {
            echo "warrant-receipt-root=$(jq -er '.receiptRoot' .buildchain/dev-delivery/warrant.json)"
            echo "warrant-state-root=$(jq -er '.after.stateRoot' .buildchain/dev-delivery/warrant.json)"
            echo "warrant-state-commit=$(jq -er '.after.commitSha' .buildchain/dev-delivery/warrant.json)"
          } >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          LEASE_SECONDS: ${{ inputs.warrant-lease-seconds }}
          EXPECTED_PR: ${{ inputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ inputs.expected-head-sha }}
          HANDOFF_WORKFLOW_ID: ${{ inputs.handoff-workflow-id }}
          SOURCE_WORKFLOW_ID: ${{ inputs.source-workflow-id }}
          LEGACY_ACTIVE_OWNER_BINDING: ${{ inputs.legacy-active-owner-binding-json }}
          NATIVE_COMMAND: ${{ inputs.native-command }}
          HEARTBEAT_SECONDS: ${{ inputs.native-heartbeat-seconds }}

      - name: Upload immutable admission state for native execution
        if: inputs.delivery-warrant-mode == 'required' && steps.warrant.outcome == 'success' && steps.warrant.outputs.handoff-required != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-dev-delivery-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.expected-pr-number }}
          path: .buildchain/dev-delivery/
          if-no-files-found: error
          retention-days: 1

      - name: Enforce reservation result
        if: always()
        shell: bash
        run: |
          if [ "${WARRANT_MODE}" != "off" ] && [ "${QUALIFY_OUTCOME}" != "success" ]; then
            echo "::error::Exact source qualification failed before Warrant scheduling"
            exit 1
          fi
          if [ "${WARRANT_MODE}" != "off" ] && [ "${SUBMIT_OUTCOME}" != "success" ]; then
            echo "::error::Delivery candidate submission failed"
            exit 1
          fi
          if [ "${WARRANT_MODE}" = "required" ] && [ "${WARRANT_OUTCOME}" != "success" ]; then
            echo "::error::Exact Delivery Warrant selection failed"
            exit 1
          fi
          if [ "${HANDOFF_REQUIRED}" = "true" ] && [ "${HANDOFF_DISPATCHED}" != "true" ]; then
            echo "::error::Active Warrant handoff was not dispatched"
            exit 1
          fi
        env:
          WARRANT_MODE: ${{ inputs.delivery-warrant-mode }}
          QUALIFY_OUTCOME: ${{ steps.qualify.outcome }}
          SUBMIT_OUTCOME: ${{ steps.submit.outcome }}
          WARRANT_OUTCOME: ${{ steps.warrant.outcome }}
          HANDOFF_REQUIRED: ${{ steps.warrant.outputs.handoff-required }}
          HANDOFF_DISPATCHED: ${{ steps.warrant.outputs.handoff-dispatched }}

  native-execution:
    name: Credentialless native execution
    needs: admission
    if: needs.admission.outputs.run-native == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Buildchain runtime without persisted credentials
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.admission.outputs.runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Verify exact admitted Buildchain runtime
        shell: bash
        run: |
          test "$(git -C .buildchain/runtime rev-parse --verify 'HEAD^{commit}')" = "${ADMITTED_RUNTIME_SHA}"
        env:
          ADMITTED_RUNTIME_SHA: ${{ needs.admission.outputs.runtime-sha }}

      - name: Download immutable admission state
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-dev-delivery-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.expected-pr-number }}
          path: .buildchain/dev-delivery

      - name: Verify rooted runtime selection readback
        shell: bash
        run: |
          test "$(jq -er '.resolvedSha' .buildchain/dev-delivery/runtime-selection.json)" = "${ADMITTED_RUNTIME_SHA}"
          test "sha256:$(sha256sum .buildchain/dev-delivery/runtime-selection.json | cut -d' ' -f1)" = "${ADMITTED_RUNTIME_ROOT}"
        env:
          ADMITTED_RUNTIME_SHA: ${{ needs.admission.outputs.runtime-sha }}
          ADMITTED_RUNTIME_ROOT: ${{ needs.admission.outputs.runtime-selection-root }}

      - name: Checkout exact candidate for native qualification
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.expected-head-sha }}
          fetch-depth: 0
          path: .buildchain/candidate
          persist-credentials: false

      - name: Materialize optional reusable native proof
        id: native-input
        if: inputs.native-proof-json != ''
        shell: bash
        run: |
          printf '%s\n' "${NATIVE_PROOF_JSON}" > .buildchain/dev-delivery/reusable-native-proof.json
          node .buildchain/runtime/scripts/dev-delivery-proof.mjs verify-native \
            --source-proof .buildchain/dev-delivery/reusable-native-proof.json \
            --output .buildchain/dev-delivery/reusable-native-proof-verification.json
          jq -e '.ok == true and .reason == "exact-native-proof"' \
            .buildchain/dev-delivery/reusable-native-proof-verification.json >/dev/null
          echo "path=.buildchain/dev-delivery/reusable-native-proof.json" >> "${GITHUB_OUTPUT}"
        env:
          NATIVE_PROOF_JSON: ${{ inputs.native-proof-json }}

      - name: Run or reuse native proof without provider credentials
        id: native-run
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repository "${GITHUB_REPOSITORY}"
            --branch "${TARGET_BRANCH}"
            --pull-request "${EXPECTED_PR}"
            --expected-head "${EXPECTED_HEAD}"
            --source-identity-root "${SOURCE_IDENTITY_ROOT}"
            --source-patch-root "${SOURCE_PATCH_ROOT}"
            --plan-root "${PLAN_ROOT}"
            --closure-root "${CLOSURE_ROOT}"
            --dependency-root "${DEPENDENCY_ROOT}"
            --toolchain-root "${TOOLCHAIN_ROOT}"
            --environment-root "${ENVIRONMENT_ROOT}"
            --affected-paths-json "${AFFECTED_PATHS}"
            --shard-evidence-roots-json "${SHARD_ROOTS}"
            --native-command "${NATIVE_COMMAND}"
            --warrant-result .buildchain/dev-delivery/warrant.json
            --candidate-directory .buildchain/candidate
            --evidence-directory .buildchain/dev-delivery
            --lease-seconds "${LEASE_SECONDS}"
            --heartbeat-seconds "${HEARTBEAT_SECONDS}"
            --native-only
          )
          if [ -n "${NATIVE_PROOF_PATH}" ]; then
            args+=(--native-proof "${NATIVE_PROOF_PATH}")
          fi
          node .buildchain/runtime/scripts/dev-delivery-two-phase.mjs "${args[@]}"
          jq -e \
            --argjson pr "${EXPECTED_PR}" \
            --arg head "${EXPECTED_HEAD}" \
            '.ok == true
             and .outcome == "native-proof-ready"
             and .qualifiedWarrant.phase == "provisional"
             and .qualifiedWarrant.pullRequestNumber == $pr
             and .qualifiedWarrant.sourceHead == $head
             and (.nativeProofRoot | test("^sha256:[0-9a-f]{64}$"))
             and (.nativeReuseDecisionRoot | test("^sha256:[0-9a-f]{64}$"))' \
            .buildchain/dev-delivery/two-phase-native-result.json >/dev/null
          {
            echo "native-proof-root=$(jq -er '.nativeProofRoot' .buildchain/dev-delivery/two-phase-native-result.json)"
            echo "decision-root=$(jq -er '.nativeReuseDecisionRoot' .buildchain/dev-delivery/two-phase-native-result.json)"
          } >> "${GITHUB_OUTPUT}"
        env:
          TARGET_BRANCH: ${{ needs.admission.outputs.target-branch }}
          EXPECTED_PR: ${{ inputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ inputs.expected-head-sha }}
          SOURCE_IDENTITY_ROOT: ${{ inputs.source-identity-root }}
          SOURCE_PATCH_ROOT: ${{ inputs.source-patch-root }}
          PLAN_ROOT: ${{ inputs.plan-root }}
          CLOSURE_ROOT: ${{ inputs.closure-root }}
          DEPENDENCY_ROOT: ${{ inputs.dependency-root }}
          TOOLCHAIN_ROOT: ${{ inputs.toolchain-root }}
          ENVIRONMENT_ROOT: ${{ inputs.environment-root }}
          AFFECTED_PATHS: ${{ inputs.affected-paths-json }}
          SHARD_ROOTS: ${{ inputs.shard-evidence-roots-json }}
          NATIVE_COMMAND: ${{ inputs.native-command }}
          NATIVE_PROOF_PATH: ${{ steps.native-input.outputs.path }}
          LEASE_SECONDS: ${{ inputs.warrant-lease-seconds }}
          HEARTBEAT_SECONDS: ${{ inputs.native-heartbeat-seconds }}
          BUILDCHAIN_CREDENTIAL_ANCESTRY_BOUNDARY: github-actions-runner-worker/v1

      - name: Record credentialless native job context
        if: always()
        shell: bash
        run: |
          outcome=failed
          if [ "${NATIVE_STEP_OUTCOME}" = "success" ]; then
            outcome=succeeded
          fi
          node .buildchain/runtime/scripts/dev-delivery-process-boundary.mjs record-native \
            --job native-execution \
            --outcome "${outcome}" \
            --output .buildchain/dev-delivery/native-job-context.json
        env:
          BUILDCHAIN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          NATIVE_STEP_OUTCOME: ${{ steps.native-run.outcome }}

      - name: Upload raw native execution output
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-dev-delivery-native-raw-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.expected-pr-number }}
          path: .buildchain/dev-delivery/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve native execution outcome for provider settlement
        if: always() && steps.native-run.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Native execution failed; the fresh provider finalizer must settle the retained fence"
          exit 1

  seal-native-execution:
    name: Credentialless native evidence seal
    needs:
      - admission
      - native-execution
    if: always() && needs.admission.result == 'success' && needs.admission.outputs.run-native == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      transfer-root: ${{ steps.transfer.outputs.root }}
      native-outcome: ${{ steps.transfer.outputs.native-outcome }}
    steps:
      - name: Checkout exact admitted Buildchain seal runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.admission.outputs.runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Verify exact admitted Buildchain seal runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .buildchain/runtime rev-parse --verify 'HEAD^{commit}')" = "${ADMITTED_RUNTIME_SHA}"
        env:
          ADMITTED_RUNTIME_SHA: ${{ needs.admission.outputs.runtime-sha }}

      - name: Download raw native execution output
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-dev-delivery-native-raw-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.expected-pr-number }}
          path: .buildchain/native-raw

      - name: Independently validate and seal exact native transfer
        id: transfer
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          node .buildchain/runtime/scripts/dev-delivery-process-boundary.mjs seal \
            --directory .buildchain/native-raw \
            --staging-directory .buildchain/native-transfer-staging \
            --seal-job seal-native-execution \
            --runtime-selection-root "${ADMITTED_RUNTIME_ROOT}" \
            --output execution-transfer.json
          {
            echo "root=$(jq -er '.transferRoot' .buildchain/native-transfer-staging/execution-transfer.json)"
            echo "native-outcome=$(jq -er '.outcome' .buildchain/native-transfer-staging/execution-transfer.json)"
          } >> "${GITHUB_OUTPUT}"
        env:
          BUILDCHAIN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ADMITTED_RUNTIME_ROOT: ${{ needs.admission.outputs.runtime-selection-root }}

      - name: Upload canonical closed native execution transfer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-dev-delivery-native-sealed-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.expected-pr-number }}
          path: .buildchain/native-transfer-staging/
          if-no-files-found: error
          retention-days: 30

  delivery-heartbeat:
    name: Credentialed independent Warrant heartbeat
    needs: admission
    if: needs.admission.outputs.run-native == 'true'
    runs-on: macos-15
    permissions:
      actions: read
      contents: write
    outputs:
      receipt-root: ${{ steps.heartbeat.outputs.receipt-root }}
    steps:
      - name: Checkout trusted heartbeat runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.admission.outputs.runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Verify exact admitted heartbeat runtime
        shell: bash
        run: |
          test "$(git -C .buildchain/runtime rev-parse --verify 'HEAD^{commit}')" = "${ADMITTED_RUNTIME_SHA}"
        env:
          ADMITTED_RUNTIME_SHA: ${{ needs.admission.outputs.runtime-sha }}

      - name: Download immutable admitted Warrant
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-dev-delivery-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.expected-pr-number }}
          path: .buildchain/dev-delivery

      - name: Durably heartbeat until native and seal are provider-terminal
        id: heartbeat
        shell: bash
        run: |
          set -euo pipefail
          node .buildchain/runtime/scripts/dev-delivery-provider-heartbeat.mjs run \
            --repository "${GITHUB_REPOSITORY}" \
            --branch "${TARGET_BRANCH}" \
            --admission .buildchain/dev-delivery/warrant.json \
            --lease-seconds "${LEASE_SECONDS}" \
            --heartbeat-seconds "${HEARTBEAT_SECONDS}" \
            --output .buildchain/provider-heartbeat-receipt.json
          echo "receipt-root=$(jq -er '.receiptRoot' .buildchain/provider-heartbeat-receipt.json)" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          TARGET_BRANCH: ${{ needs.admission.outputs.target-branch }}
          LEASE_SECONDS: ${{ inputs.warrant-lease-seconds }}
          HEARTBEAT_SECONDS: ${{ inputs.native-heartbeat-seconds }}

      - name: Upload rooted provider heartbeat receipt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-dev-delivery-heartbeat-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.expected-pr-number }}
          path: .buildchain/provider-heartbeat-receipt.json
          if-no-files-found: error
          retention-days: 30

  merge-dev-prs:
    name: Credentialed provider finalizer
    needs:
      - admission
      - native-execution
      - seal-native-execution
      - delivery-heartbeat
    if: always() && needs.admission.result == 'success' && needs.admission.outputs.handoff-required != 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
      checks: read
      statuses: write
    outputs:
      evaluated-count: ${{ steps.merge.outputs.evaluated-count }}
      merged-count: ${{ steps.merge.outputs.merged-count }}
      enqueued-count: ${{ steps.merge.outputs.enqueued-count }}
      action-count: ${{ steps.merge.outputs.action-count }}
      skipped-count: ${{ steps.merge.outputs.skipped-count }}
      final-base-sha: ${{ steps.merge.outputs.final-base-sha }}
      admission-state: ${{ steps.merge.outputs.admission-state }}
      admission-receipt-root: ${{ steps.merge.outputs.receipt-root }}
      source-proof-root: ${{ needs.admission.outputs.source-proof-root }}
      warrant-receipt-root: ${{ needs.admission.outputs.warrant-receipt-root }}
      warrant-state-root: ${{ needs.admission.outputs.warrant-state-root }}
      warrant-state-commit: ${{ needs.admission.outputs.warrant-state-commit }}
      project-cut-proof-root: ${{ needs.admission.outputs.project-cut-proof-root }}
      native-proof-root: ${{ steps.native-final.outputs.native-proof-root || needs.admission.outputs.native-proof-root }}
      native-reuse-decision-root: ${{ steps.native-final.outputs.decision-root || needs.admission.outputs.native-reuse-decision-root }}
      qualified-warrant-receipt-root: ${{ steps.native-final.outputs.qualification-receipt-root || needs.admission.outputs.qualified-warrant-receipt-root }}
      native-execution-transfer-root: ${{ steps.boundary.outputs.transfer-root }}
      provider-finalizer-boundary-root: ${{ steps.boundary.outputs.boundary-root }}
      provider-heartbeat-receipt-root: ${{ needs.delivery-heartbeat.outputs.receipt-root }}
    steps:
      - name: Checkout trusted Buildchain finalizer runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ needs.admission.outputs.runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Verify exact admitted Buildchain finalizer runtime
        shell: bash
        run: |
          test "$(git -C .buildchain/runtime rev-parse --verify 'HEAD^{commit}')" = "${ADMITTED_RUNTIME_SHA}"
        env:
          ADMITTED_RUNTIME_SHA: ${{ needs.admission.outputs.runtime-sha }}

      - name: Download immutable admission state
        if: inputs.delivery-warrant-mode == 'required' && needs.admission.outputs.handoff-required != 'true'
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-dev-delivery-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.expected-pr-number }}
          path: .buildchain/dev-delivery

      - name: Download native execution transfer
        if: needs.admission.outputs.run-native == 'true'
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-dev-delivery-native-sealed-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.expected-pr-number }}
          path: .buildchain/native-transfer

      - name: Download independent provider heartbeat receipt
        if: needs.admission.outputs.run-native == 'true'
        uses: actions/download-artifact@v7.0.0
        with:
          name: buildchain-dev-delivery-heartbeat-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.expected-pr-number }}
          path: .buildchain

      - name: Prove fresh provider finalizer job and runner boundary
        id: boundary
        if: needs.admission.outputs.run-native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            > .buildchain/provider-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" \
            > .buildchain/provider-pull-request.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" \
            > .buildchain/provider-base-ref.json
          node .buildchain/runtime/scripts/dev-delivery-provider-heartbeat.mjs verify \
            --repository "${GITHUB_REPOSITORY}" \
            --branch "${TARGET_BRANCH}" \
            --admission .buildchain/dev-delivery/warrant.json \
            --receipt .buildchain/provider-heartbeat-receipt.json \
            --jobs-readback .buildchain/provider-jobs.json \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --admission-job-name "Reserve exact delivery candidate" \
            --heartbeat-job-name "Credentialed independent Warrant heartbeat" \
            --finalizer-job-name "Credentialed provider finalizer" \
            --output .buildchain/provider-heartbeat-verification.json
          node .buildchain/runtime/scripts/dev-delivery-process-boundary.mjs verify \
            --directory .buildchain/native-transfer \
            --jobs-readback .buildchain/provider-jobs.json \
            --pull-request-readback .buildchain/provider-pull-request.json \
            --base-ref-readback .buildchain/provider-base-ref.json \
            --native-job native-execution \
            --native-job-name "Credentialless native execution" \
            --seal-job-name "Credentialless native evidence seal" \
            --finalizer-job-name "Credentialed provider finalizer" \
            --pull-request "${EXPECTED_PR}" \
            --source-head "${EXPECTED_HEAD}" \
            --runtime-sha "${ADMITTED_RUNTIME_SHA}" \
            --runtime-selection-root "${ADMITTED_RUNTIME_ROOT}" \
            --output .buildchain/provider-finalizer-boundary.json
          {
            echo "transfer-root=$(jq -er '.transferRoot' .buildchain/provider-finalizer-boundary.json)"
            echo "boundary-root=$(jq -er '.boundaryRoot' .buildchain/provider-finalizer-boundary.json)"
            echo "native-outcome=$(jq -er '.nativeJob.conclusion' .buildchain/provider-finalizer-boundary.json)"
            echo "native-job-id=$(jq -er '.nativeJob.id' .buildchain/provider-finalizer-boundary.json)"
            echo "seal-job-id=$(jq -er '.sealJob.id' .buildchain/provider-finalizer-boundary.json)"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.github-token || github.token }}
          BUILDCHAIN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_PR: ${{ inputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ inputs.expected-head-sha }}
          TARGET_BRANCH: ${{ needs.admission.outputs.target-branch }}
          ADMITTED_RUNTIME_SHA: ${{ needs.admission.outputs.runtime-sha }}
          ADMITTED_RUNTIME_ROOT: ${{ needs.admission.outputs.runtime-selection-root }}

      - name: Verify transferred native proof before provider mutation
        id: proof-verification
        if: needs.admission.outputs.run-native == 'true' && steps.boundary.outcome == 'success' && steps.boundary.outputs.native-outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node .buildchain/runtime/scripts/dev-delivery-proof.mjs verify-native \
            --source-proof .buildchain/native-transfer/native-proof.json \
            --output .buildchain/provider-native-proof-verification.json
          jq -e '.ok == true and .reason == "exact-native-proof"' \
            .buildchain/provider-native-proof-verification.json >/dev/null

      - name: Independently recheck and atomically qualify native proof
        id: native-final
        if: needs.admission.outputs.run-native == 'true' && steps.boundary.outcome == 'success' && steps.boundary.outputs.native-outcome == 'success' && steps.proof-verification.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repository "${GITHUB_REPOSITORY}" \
            --branch "${TARGET_BRANCH}" \
            --pull-request "${EXPECTED_PR}" \
            --expected-head "${EXPECTED_HEAD}" \
            --source-identity-root "${SOURCE_IDENTITY_ROOT}" \
            --source-patch-root "${SOURCE_PATCH_ROOT}" \
            --plan-root "${PLAN_ROOT}" \
            --closure-root "${CLOSURE_ROOT}" \
            --dependency-root "${DEPENDENCY_ROOT}" \
            --toolchain-root "${TOOLCHAIN_ROOT}" \
            --environment-root "${ENVIRONMENT_ROOT}" \
            --affected-paths-json "${AFFECTED_PATHS}" \
            --shard-evidence-roots-json "${SHARD_ROOTS}" \
            --native-command "${NATIVE_COMMAND}" \
            --warrant-result .buildchain/dev-delivery/warrant.json \
            --candidate-directory .buildchain/runtime \
            --evidence-directory .buildchain/finalizer-evidence \
            --lease-seconds "${LEASE_SECONDS}" \
            --heartbeat-seconds "${HEARTBEAT_SECONDS}" \
            --finalize-only
          )
          if [ -f .buildchain/native-transfer/native-proof.json ]; then
            args+=(--native-proof .buildchain/native-transfer/native-proof.json)
          fi
          node .buildchain/runtime/scripts/dev-delivery-two-phase.mjs "${args[@]}"
          jq -e \
            --argjson pr "${EXPECTED_PR}" \
            --arg head "${EXPECTED_HEAD}" \
            '.ok == true
             and .outcome == "qualified-warrant"
             and .qualifiedWarrant.phase == "qualified"
             and .qualifiedWarrant.pullRequestNumber == $pr
             and .qualifiedWarrant.sourceHead == $head
             and (.nativeProofRoot | test("^sha256:[0-9a-f]{64}$"))
             and (.nativeReuseDecisionRoot | test("^sha256:[0-9a-f]{64}$"))' \
            .buildchain/finalizer-evidence/two-phase-result.json >/dev/null
          cp .buildchain/finalizer-evidence/qualified-warrant.json .buildchain/dev-delivery/warrant.json
          {
            echo "native-proof-root=$(jq -er '.nativeProofRoot' .buildchain/finalizer-evidence/two-phase-result.json)"
            echo "decision-root=$(jq -er '.nativeReuseDecisionRoot' .buildchain/finalizer-evidence/two-phase-result.json)"
            echo "qualification-receipt-root=$(jq -er '.qualificationReceiptRoot' .buildchain/finalizer-evidence/two-phase-result.json)"
          } >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          TARGET_BRANCH: ${{ needs.admission.outputs.target-branch }}
          EXPECTED_PR: ${{ inputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ inputs.expected-head-sha }}
          SOURCE_IDENTITY_ROOT: ${{ inputs.source-identity-root }}
          SOURCE_PATCH_ROOT: ${{ inputs.source-patch-root }}
          PLAN_ROOT: ${{ inputs.plan-root }}
          CLOSURE_ROOT: ${{ inputs.closure-root }}
          DEPENDENCY_ROOT: ${{ inputs.dependency-root }}
          TOOLCHAIN_ROOT: ${{ inputs.toolchain-root }}
          ENVIRONMENT_ROOT: ${{ inputs.environment-root }}
          AFFECTED_PATHS: ${{ inputs.affected-paths-json }}
          SHARD_ROOTS: ${{ inputs.shard-evidence-roots-json }}
          NATIVE_COMMAND: ${{ inputs.native-command }}
          LEASE_SECONDS: ${{ inputs.warrant-lease-seconds }}
          HEARTBEAT_SECONDS: ${{ inputs.native-heartbeat-seconds }}

      - name: Settle the exact independently verified native failure
        id: failure-final
        if: needs.admission.outputs.run-native == 'true' && steps.boundary.outcome == 'success' && steps.boundary.outputs.native-outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          settlement=.buildchain/provider-failure-settlement.json
          settlement_state="$(jq -er '.latestStateRoot' .buildchain/provider-heartbeat-verification.json)"
          node .buildchain/runtime/scripts/dev-delivery-warrant.mjs settle \
            --repository "${GITHUB_REPOSITORY}" \
            --branch "${TARGET_BRANCH}" \
            --expected-old "${settlement_state}" \
            --pull-request "$(jq -er '.pullRequestNumber' "$settlement")" \
            --expected-source-head "$(jq -er '.sourceHead' "$settlement")" \
            --fencing-token "$(jq -er '.fencingToken' "$settlement")" \
            --lease-generation "$(jq -er '.leaseGeneration' "$settlement")" \
            --outcome terminal-failure \
            --evidence-root "$(jq -er '.evidenceRoot' "$settlement")" \
            --reason "$(jq -er '.reason' "$settlement")" \
            --transfer-root "$(jq -er '.transferRoot' "$settlement")" \
            --finalizer-boundary-root "$(jq -er '.finalizerBoundaryRoot' "$settlement")" \
            --native-job-id "$(jq -er '.nativeJobId' "$settlement")" \
            --seal-job-id "$(jq -er '.sealJobId' "$settlement")" \
            --execute \
            --output .buildchain/finalizer-evidence/failure-settlement-result.json
          jq -e \
            --arg evidenceRoot "$(jq -er '.evidenceRoot' "$settlement")" \
            --arg stateRoot "${settlement_state}" \
            --arg transferRoot "$(jq -er '.transferRoot' "$settlement")" \
            --arg boundaryRoot "$(jq -er '.finalizerBoundaryRoot' "$settlement")" \
            --argjson nativeJobId "$(jq -er '.nativeJobId' "$settlement")" \
            --argjson sealJobId "$(jq -er '.sealJobId' "$settlement")" \
            '.ok == true
             and .receipt.outcome == "terminal-failure"
             and .receipt.evidenceRoot == $evidenceRoot
             and .receipt.expectedOldStateRoot == $stateRoot
             and .receipt.transferRoot == $transferRoot
             and .receipt.finalizerBoundaryRoot == $boundaryRoot
             and .receipt.nativeJobId == $nativeJobId
             and .receipt.sealJobId == $sealJobId
             and .observation.candidates[-1].terminal.transferRoot == $transferRoot
             and .observation.candidates[-1].terminal.finalizerBoundaryRoot == $boundaryRoot
             and .observation.candidates[-1].terminal.nativeJobId == $nativeJobId
             and .observation.candidates[-1].terminal.sealJobId == $sealJobId
             and .observation.activeWarrant == null' \
            .buildchain/finalizer-evidence/failure-settlement-result.json >/dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          TARGET_BRANCH: ${{ needs.admission.outputs.target-branch }}

      - name: Run Buildchain dev PR auto-merge
        id: merge
        if: inputs.defer-landing != true && needs.admission.outputs.handoff-required != 'true' && (inputs.delivery-warrant-mode != 'required' || needs.admission.outputs.already-qualified == 'true' || steps.native-final.outcome == 'success')
        continue-on-error: true
        run: node .buildchain/runtime/scripts/dev-pr-auto-merge.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          BUILDCHAIN_DEV_PR_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_DEV_PR_TARGET_BRANCH: ${{ needs.admission.outputs.target-branch }}
          BUILDCHAIN_DEV_PR_EXPECTED_PR_NUMBER: ${{ inputs.expected-pr-number }}
          BUILDCHAIN_DEV_PR_EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
          BUILDCHAIN_DEV_PR_DIAGNOSTIC_CONTEXT: ${{ inputs.diagnostic-context }}
          BUILDCHAIN_DEV_PR_WARRANT_MODE: ${{ inputs.delivery-warrant-mode == 'required' && 'required' || 'off' }}
          BUILDCHAIN_DEV_PR_WARRANT_RESULT_PATH: .buildchain/dev-delivery/warrant.json
          BUILDCHAIN_DEV_PR_PROJECT_CUT_PROOF_PATH: ${{ needs.admission.outputs.project-cut-proof-root != '' && '.buildchain/dev-delivery/project-cut-proof.json' || '' }}
          BUILDCHAIN_DEV_PR_SOURCE_PATCH_ROOT: ${{ inputs.source-patch-root }}
          BUILDCHAIN_DEV_PR_REQUIRED_CHECKS: ${{ inputs.required-status-checks }}
          BUILDCHAIN_DEV_PR_QUEUE_ADMISSION_CONTEXT: ${{ inputs.queue-admission-context }}
          BUILDCHAIN_DEV_PR_ACTIVE_LEASE_CONTEXT: ${{ inputs.active-lease-context }}
          BUILDCHAIN_DEV_PR_READY_LABEL: ${{ inputs.ready-label }}
          BUILDCHAIN_DEV_PR_BLOCK_LABELS: ${{ inputs.block-labels }}
          BUILDCHAIN_DEV_PR_ALLOWED_HEAD_PREFIXES: ${{ inputs.allowed-head-prefixes }}
          BUILDCHAIN_DEV_PR_REQUIRE_APPROVAL: ${{ inputs.require-approval }}
          BUILDCHAIN_DEV_PR_SAME_REPOSITORY_ONLY: ${{ inputs.same-repository-only }}
          BUILDCHAIN_DEV_PR_MAX_MERGES: ${{ inputs.max-merges }}
          BUILDCHAIN_DEV_PR_MERGE_METHOD: ${{ inputs.merge-method }}
          BUILDCHAIN_DEV_PR_LANDING_MODE: ${{ inputs.landing-mode }}
          BUILDCHAIN_DEV_PR_DRY_RUN: ${{ inputs.dry-run }}
          BUILDCHAIN_DEV_PR_OUTPUT_PATH: .buildchain/dev-pr-auto-merge/result.json

      - name: Upload dev PR auto-merge plan
        if: always() && inputs.defer-landing != true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-dev-pr-auto-merge-${{ needs.admission.outputs.branch-artifact }}
          path: .buildchain/dev-pr-auto-merge/result.json
          if-no-files-found: error

      - name: Upload Dev Delivery Warrant evidence
        if: always() && inputs.delivery-warrant-mode != 'off'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-dev-delivery-warrant-${{ needs.admission.outputs.branch-artifact }}-${{ inputs.expected-pr-number }}
          path: |
            .buildchain/dev-delivery/
            .buildchain/native-transfer/
            .buildchain/finalizer-evidence/
            .buildchain/provider-finalizer-boundary.json
            .buildchain/provider-failure-settlement.json
            .buildchain/provider-heartbeat-receipt.json
            .buildchain/provider-heartbeat-verification.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Enforce targeted admission result
        if: always()
        shell: bash
        run: |
          if [ "${DEFER_LANDING}" = "true" ]; then
            if [ "${WARRANT_MODE}" != "required" ]; then
              echo "::error::defer-landing requires delivery-warrant-mode required"
              exit 1
            fi
            if [ "${ALREADY_QUALIFIED}" != "true" ] && { [ "${BOUNDARY_OUTCOME}" != "success" ] || [ "${NATIVE_OUTCOME}" != "success" ]; }; then
              echo "::error::defer-landing requires exact native Warrant qualification"
              exit 1
            fi
            echo "Exact required Warrant qualified; landing is explicitly deferred."
            exit 0
          fi
          if [ "${NATIVE_JOB_OUTCOME}" = "failure" ]; then
            if [ "${FAILURE_FINAL_OUTCOME}" != "success" ]; then
              echo "::error::Exact independently verified native failure did not settle its retained fence"
              exit 1
            fi
            echo "::error::Native execution failed; its exact verified failure root settled the retained fence"
            exit 1
          fi
          if [ "${RUN_NATIVE}" = "true" ] && [ "${SEAL_JOB_OUTCOME}" != "success" ]; then
            echo "::error::Fresh credentialless native evidence seal did not complete"
            exit 1
          fi
          if [ "${RUN_NATIVE}" = "true" ] && [ "${HEARTBEAT_JOB_OUTCOME}" != "success" ]; then
            echo "::error::Independent credentialed Warrant heartbeat did not prove continuity through provider-terminal native and seal jobs; authority remains retained"
            exit 1
          fi
          if [ "${MERGE_STEP_OUTCOME}" != "success" ]; then
            echo "::error::Buildchain dev PR controller failed; inspect the uploaded receipt"
            exit 1
          fi
          if [ "${WARRANT_MODE}" = "required" ] && [ "${ALREADY_QUALIFIED}" != "true" ] && { [ "${BOUNDARY_OUTCOME}" != "success" ] || [ "${NATIVE_OUTCOME}" != "success" ]; }; then
            echo "::error::Provisional Warrant did not atomically upgrade with an exact native proof"
            exit 1
          fi
          if [ "${TARGETED}" = "true" ] && [ "${TARGETED_OK}" != "true" ]; then
            echo "::error::Targeted PR was not admitted at its expected head"
            exit 1
          fi
        env:
          MERGE_STEP_OUTCOME: ${{ steps.merge.outcome }}
          DEFER_LANDING: ${{ inputs.defer-landing }}
          TARGETED: ${{ steps.merge.outputs.targeted }}
          TARGETED_OK: ${{ steps.merge.outputs.targeted-ok }}
          WARRANT_MODE: ${{ inputs.delivery-warrant-mode }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
          NATIVE_OUTCOME: ${{ steps.native-final.outcome }}
          NATIVE_JOB_OUTCOME: ${{ steps.boundary.outputs.native-outcome }}
          SEAL_JOB_OUTCOME: ${{ needs.seal-native-execution.result }}
          HEARTBEAT_JOB_OUTCOME: ${{ needs.delivery-heartbeat.result }}
          RUN_NATIVE: ${{ needs.admission.outputs.run-native }}
          FAILURE_FINAL_OUTCOME: ${{ steps.failure-final.outcome }}
          ALREADY_QUALIFIED: ${{ needs.admission.outputs.already-qualified }}
