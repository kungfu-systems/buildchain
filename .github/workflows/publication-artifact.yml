name: Buildchain Publication Artifact

on:
  workflow_call:
    inputs:
      buildchain-repository:
        default: "kungfu-systems/buildchain"
        type: string
        required: false
      buildchain-ref:
        description: "Official floating Buildchain channel, or a temporary train/SHA for trusted manual validation."
        default: ""
        type: string
        required: false
      buildchain-contract-lock-path:
        description: "Consumer-owned Buildchain contract lock path"
        default: ".buildchain/contract-lock.json"
        type: string
        required: false
      buildchain-contract-compatibility-policy:
        description: "Contract compatibility policy: major-compatible, allow-additive, or exact"
        default: "major-compatible"
        type: string
        required: false
      buildchain-contract-drift-issue-mode:
        description: "Consumer issue behavior for Buildchain floating-ref contract drift: off, breaking-only, or compatible-and-breaking"
        default: "compatible-and-breaking"
        type: string
        required: false
      working-directory:
        default: "."
        type: string
        required: false
      setup-node:
        default: true
        type: boolean
        required: false
      node-version:
        default: "24"
        type: string
        required: false
      build-command:
        default: "make pdf"
        type: string
        required: false
      toolchain-type:
        description: "Publication build toolchain: config, custom-command, or latex-docker. config reads [publication.toolchain]."
        default: "config"
        type: string
        required: false
      toolchain-image:
        description: "Container image for latex-docker toolchain, without digest. Defaults to the Buildchain paper LaTeX builder."
        default: "ghcr.io/kungfu-systems/build-images/latex-pdf-builder"
        type: string
        required: false
      toolchain-digest:
        description: "sha256:<digest> for the latex-docker toolchain image."
        default: "sha256:c20f3809e96836c1c78e97c76939d12f1de3fed0ea9b7c40c43332ec2ea480f8"
        type: string
        required: false
      toolchain-command:
        description: "Command run by the declared publication toolchain. For custom-command this overrides build-command."
        default: ""
        type: string
        required: false
      verify-command:
        default: "make check"
        type: string
        required: false
      artifact-name:
        default: "publication-artifact"
        type: string
        required: false
      artifact-paths:
        default: |
          _build/main.pdf
          .buildchain/publication/publication-artifact.json
          .buildchain/publication/publication-artifact-passport.json
          .buildchain/publication/publication-registry.json
          .buildchain/publication/source.tar.gz
        type: string
        required: false
      artifact-retention-days:
        default: 30
        type: number
        required: false
    outputs:
      publication-artifact-name:
        description: "Uploaded publication artifact name"
        value: ${{ jobs.publication.outputs.publication-artifact-name }}
      publication-manifest-path:
        description: "Generated publication manifest path"
        value: ${{ jobs.publication.outputs.publication-manifest-path }}
      publication-passport-path:
        description: "Generated publication passport path"
        value: ${{ jobs.publication.outputs.publication-passport-path }}
      publication-registry-path:
        description: "Generated publication archive registry path when archive config is present"
        value: ${{ jobs.publication.outputs.publication-registry-path }}
      publication-manifest-json:
        description: "Compact publication manifest JSON"
        value: ${{ jobs.publication.outputs.publication-manifest-json }}

permissions:
  contents: read
  issues: write

jobs:
  publication:
    name: Build publication artifact
    runs-on: ubuntu-24.04
    outputs:
      publication-artifact-name: ${{ steps.names.outputs.artifact-name }}
      publication-manifest-path: ${{ steps.manifest.outputs.manifest-path }}
      publication-passport-path: ${{ steps.manifest.outputs.passport-path }}
      publication-registry-path: ${{ steps.manifest.outputs.registry-path }}
      publication-manifest-json: ${{ steps.manifest.outputs.manifest-json }}
    steps:
      - name: Resolve Buildchain runtime
        id: runtime
        uses: actions/github-script@v8
        env:
          BUILDCHAIN_REPOSITORY: ${{ inputs.buildchain-repository }}
          BUILDCHAIN_REQUESTED_REF: ${{ inputs.buildchain-ref }}
          BUILDCHAIN_DEFAULT_REF: v2
        with:
          script: |
            const requested = (process.env.BUILDCHAIN_REQUESTED_REF || "").trim();
            const repository = (process.env.BUILDCHAIN_REPOSITORY || "kungfu-systems/buildchain").trim();
            const defaultRef = (process.env.BUILDCHAIN_DEFAULT_REF || "v2").trim();
            const [runtimeOwner, runtimeRepo] = repository.split("/");
            if (!runtimeOwner || !runtimeRepo) throw new Error(`invalid buildchain repository: ${repository}`);
            const exactSha = /^[0-9a-f]{40}$/i;
            const trainRef = /^train\/v\d+\/v\d+\.\d+\/[A-Za-z0-9._/-]+$/;
            const officialChannelRef = /^v\d+(?:\.\d+)?(?:-alpha)?$/;
            const workflowRef = process.env.GITHUB_WORKFLOW_REF || "";
            const shellRef = workflowRef.startsWith(`${repository}/.github/workflows/`)
              ? (workflowRef.split("@").pop() || defaultRef).trim() || defaultRef
              : defaultRef;
            const normalizeClass = (ref) => {
              const value = String(ref || "").replace(/^refs\/heads\//, "").replace(/^refs\/tags\//, "");
              if (exactSha.test(value)) return "exact-sha";
              if (trainRef.test(value)) return "train";
              if (/^v\d+(?:\.\d+)?$/.test(value) || /^v\d+\.\d+\.\d+$/.test(value)) return "stable";
              if (/^v\d+(?:\.\d+)?-alpha$/.test(value) || /^v\d+\.\d+\.\d+-alpha\.\d+$/.test(value)) return "alpha";
              return "development";
            };
            let runtimeRef = requested || shellRef;
            let runtimeFullRef = runtimeRef;
            let runtimeClass = normalizeClass(runtimeRef);
            const officialChannel = officialChannelRef.test(requested);
            let runtimeOverride = requested !== "" && !officialChannel;
            let trustDecision = officialChannel
              ? "official-channel"
              : runtimeOverride
                ? "override-requested"
                : "stable-default";
            if (runtimeOverride) {
              if (context.eventName !== "workflow_dispatch") {
                throw new Error("buildchain-ref override is only allowed for trusted workflow_dispatch runs");
              }
              const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
              const actorPermission = permission.data.permission || "";
              if (!["admin", "maintain", "write"].includes(actorPermission)) {
                throw new Error(`buildchain-ref override requires write, maintain, or admin permission; actor has ${actorPermission || "none"}`);
              }
              if (exactSha.test(requested)) {
                runtimeRef = requested;
                runtimeFullRef = requested;
                runtimeClass = "exact-sha";
              } else {
                runtimeRef = requested.replace(/^refs\/heads\//, "");
                if (!trainRef.test(runtimeRef)) {
                  throw new Error("buildchain-ref override must be train/vN/vN.M/<capability>, refs/heads/train/vN/vN.M/<capability>, or an exact 40-character SHA");
                }
                runtimeFullRef = `refs/heads/${runtimeRef}`;
                runtimeClass = "train";
              }
              trustDecision = "override-accepted";
            }
            async function resolveRef(ref) {
              if (exactSha.test(ref)) return ref;
              const normalized = ref.replace(/^refs\/heads\//, "").replace(/^refs\/tags\//, "");
              const candidates = ref.startsWith("refs/")
                ? [ref.replace(/^refs\//, "")]
                : [`tags/${normalized}`, `heads/${normalized}`];
              for (const candidate of candidates) {
                try {
                  const response = await github.rest.git.getRef({ owner: runtimeOwner, repo: runtimeRepo, ref: candidate });
                  return response.data.object.sha;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              throw new Error(`unable to resolve Buildchain runtime ref: ${ref}`);
            }
            const runtimeSha = await resolveRef(runtimeFullRef);
            core.setOutput("runtime-ref", runtimeRef);
            core.setOutput("runtime-full-ref", runtimeFullRef);
            core.setOutput("runtime-sha", runtimeSha);
            core.setOutput("runtime-class", runtimeClass);
            core.setOutput("runtime-override", String(runtimeOverride));
            core.setOutput("runtime-trust-decision", trustDecision);
            core.setOutput("workflow-shell-ref", shellRef);
            core.setOutput("rollback-ref", shellRef);
            await core.summary
              .addHeading("Buildchain runtime")
              .addRaw(`- workflow shell ref: \`${shellRef}\`\n`)
              .addRaw(`- requested runtime ref: \`${requested || "(default)"}\`\n`)
              .addRaw(`- resolved runtime ref: \`${runtimeRef}\`\n`)
              .addRaw(`- resolved runtime sha: \`${runtimeSha}\`\n`)
              .addRaw(`- runtime class: \`${runtimeClass}\`\n`)
              .addRaw(`- trust decision: \`${trustDecision}\`\n`)
              .write();

      - name: Checkout source
        uses: actions/checkout@v7.0.0
        with:
          clean: true
          persist-credentials: false

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ steps.runtime.outputs.runtime-sha }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Check Buildchain contract lock
        id: contract-lock
        shell: bash
        run: node .buildchain/runtime/scripts/buildchain-contract-lock.mjs check
        env:
          BUILDCHAIN_CONTRACT_LOCK_PATH: ${{ inputs.buildchain-contract-lock-path }}
          BUILDCHAIN_CONTRACT_COMPATIBILITY_POLICY: ${{ inputs.buildchain-contract-compatibility-policy }}
          BUILDCHAIN_CONTRACT_DRIFT_ISSUE_MODE: ${{ inputs.buildchain-contract-drift-issue-mode }}
          BUILDCHAIN_RUNTIME_ROOT: .buildchain/runtime
          BUILDCHAIN_RUNTIME_REF: ${{ steps.runtime.outputs.runtime-ref }}
          BUILDCHAIN_RUNTIME_SHA: ${{ steps.runtime.outputs.runtime-sha }}
          BUILDCHAIN_RUNTIME_CLASS: ${{ steps.runtime.outputs.runtime-class }}
          BUILDCHAIN_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Report consumer Buildchain contract drift
        if: ${{ always() && steps.contract-lock.outputs.contract-lock-issue-needed == 'true' }}
        uses: ./.buildchain/runtime/actions/report-buildchain-issue
        with:
          token: ${{ github.token }}
          target-repository: ${{ github.repository }}
          title: "[Buildchain contract] ${{ github.repository }} publication artifact drift on ${{ steps.runtime.outputs.runtime-ref }}"
          failure-code: buildchain-contract-${{ steps.contract-lock.outputs.contract-lock-status }}
          buildchain-ref: ${{ steps.runtime.outputs.runtime-ref }}
          buildchain-version: ${{ steps.contract-lock.outputs.contract-digest }}
          consumer-repository: ${{ github.repository }}
          consumer-ref: ${{ github.ref }}
          consumer-sha: ${{ github.sha }}
          workflow: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          summary: "Buildchain floating runtime contract drift: ${{ steps.contract-lock.outputs.contract-lock-status }}"
          body-file: ${{ steps.contract-lock.outputs.contract-lock-issue-body-file }}
          labels: "buildchain-contract-drift"
          comment-cooldown-hours: "24"
          fail-on-error: "false"

      - name: Setup Buildchain Node.js
        if: ${{ inputs.setup-node }}
        uses: actions/setup-node@v6.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Buildchain runtime dependencies
        shell: bash
        run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts

      - name: Resolve publication toolchain
        id: toolchain
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUT_TOOLCHAIN_TYPE: ${{ inputs.toolchain-type }}
          INPUT_TOOLCHAIN_IMAGE: ${{ inputs.toolchain-image }}
          INPUT_TOOLCHAIN_DIGEST: ${{ inputs.toolchain-digest }}
          INPUT_TOOLCHAIN_COMMAND: ${{ inputs.toolchain-command }}
          INPUT_BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          const runtimeConfigModule = pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, ".buildchain/runtime/packages/core/buildchain-config.js")).href;
          const { loadBuildchainConfig } = await import(runtimeConfigModule);
          const defaultLatexDockerCommand = "latexmk -pdf -outdir=_build paper/main.tex";

          const cwd = process.cwd();
          const inputType = (process.env.INPUT_TOOLCHAIN_TYPE || "config").trim();
          const inputToolchain = {
            type: inputType,
            image: process.env.INPUT_TOOLCHAIN_IMAGE || "",
            digest: process.env.INPUT_TOOLCHAIN_DIGEST || "",
            command: process.env.INPUT_TOOLCHAIN_COMMAND || "",
          };
          const configToolchain = loadBuildchainConfig(cwd)?.config?.publication?.toolchain || {};
          const resolved = inputType && inputType !== "config"
            ? inputToolchain
            : { type: configToolchain.type || "custom-command", image: configToolchain.image || "", digest: configToolchain.digest || "", command: configToolchain.command || "" };
          if (resolved.type === "custom-command" && !resolved.command) {
            resolved.command = process.env.INPUT_BUILD_COMMAND || "";
          }
          if (!["custom-command", "latex-docker"].includes(resolved.type)) {
            throw new Error(`unsupported publication toolchain: ${resolved.type}`);
          }
          if (resolved.type === "latex-docker") {
            if (!resolved.command) {
              resolved.command = defaultLatexDockerCommand;
            }
            if (!resolved.image) throw new Error("latex-docker publication toolchain requires toolchain-image or publication.toolchain.image");
            if (!/^sha256:[0-9a-f]{64}$/i.test(resolved.digest || "")) {
              throw new Error("latex-docker publication toolchain requires toolchain-digest or publication.toolchain.digest as sha256:<64 hex>");
            }
            if (!resolved.command) throw new Error("latex-docker publication toolchain requires toolchain-command or publication.toolchain.command");
          }
          const output = process.env.GITHUB_OUTPUT;
          function writeOutput(name, value) {
            const text = String(value || "");
            if (text.includes("\n")) {
              const marker = `EOF_${name}_${Date.now()}`;
              fs.appendFileSync(output, `${name}<<${marker}\n${text}\n${marker}\n`);
            } else {
              fs.appendFileSync(output, `${name}=${text}\n`);
            }
          }
          writeOutput("type", resolved.type);
          writeOutput("image", resolved.image || "");
          writeOutput("digest", resolved.digest || "");
          writeOutput("command", resolved.command || "");
          writeOutput("image-ref", resolved.image && resolved.digest ? `${resolved.image}@${resolved.digest}` : "");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "## Publication toolchain",
            "",
            `- type: \`${resolved.type}\``,
            `- image: \`${resolved.image || "(none)"}\``,
            `- digest: \`${resolved.digest || "(none)"}\``,
            "",
          ].join("\n"));
          NODE

      - name: Build publication
        if: ${{ steps.toolchain.outputs.command != '' }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILDCHAIN_PUBLICATION_TOOLCHAIN_TYPE: ${{ steps.toolchain.outputs.type }}
          BUILDCHAIN_PUBLICATION_TOOLCHAIN_IMAGE: ${{ steps.toolchain.outputs.image }}
          BUILDCHAIN_PUBLICATION_TOOLCHAIN_DIGEST: ${{ steps.toolchain.outputs.digest }}
          BUILDCHAIN_PUBLICATION_TOOLCHAIN_COMMAND: ${{ steps.toolchain.outputs.command }}
          BUILDCHAIN_PUBLICATION_TOOLCHAIN_IMAGE_REF: ${{ steps.toolchain.outputs.image-ref }}
        run: |
          set -euo pipefail
          if [ "$BUILDCHAIN_PUBLICATION_TOOLCHAIN_TYPE" = "latex-docker" ]; then
            docker pull "$BUILDCHAIN_PUBLICATION_TOOLCHAIN_IMAGE_REF"
            workspace_rel="${PWD#"$GITHUB_WORKSPACE"}"
            workspace_rel="${workspace_rel#/}"
            docker_workdir="/workspace"
            if [ -n "$workspace_rel" ]; then
              docker_workdir="/workspace/$workspace_rel"
            fi
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w "$docker_workdir" \
              "$BUILDCHAIN_PUBLICATION_TOOLCHAIN_IMAGE_REF" \
              bash -lc "$BUILDCHAIN_PUBLICATION_TOOLCHAIN_COMMAND"
          elif [ "$BUILDCHAIN_PUBLICATION_TOOLCHAIN_TYPE" = "custom-command" ]; then
            bash -lc "$BUILDCHAIN_PUBLICATION_TOOLCHAIN_COMMAND"
          else
            echo "::error::unsupported publication toolchain: $BUILDCHAIN_PUBLICATION_TOOLCHAIN_TYPE"
            exit 1
          fi

      - name: Verify publication
        if: ${{ inputs.verify-command != '' }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.verify-command }}

      - name: Collect publication artifact manifest
        id: manifest
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILDCHAIN_PUBLICATION_TOOLCHAIN_TYPE: ${{ steps.toolchain.outputs.type }}
          BUILDCHAIN_PUBLICATION_TOOLCHAIN_IMAGE: ${{ steps.toolchain.outputs.image }}
          BUILDCHAIN_PUBLICATION_TOOLCHAIN_DIGEST: ${{ steps.toolchain.outputs.digest }}
          BUILDCHAIN_PUBLICATION_TOOLCHAIN_COMMAND: ${{ steps.toolchain.outputs.command }}
        run: |
          node "${GITHUB_WORKSPACE}/.buildchain/runtime/bin/buildchain.mjs" publication-artifact manifest \
            --cwd . \
            --source-sha "${GITHUB_SHA}" \
            --json > "${GITHUB_WORKSPACE}/.buildchain/publication-result.json"
          node <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/.buildchain/publication-result.json`, "utf8"));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest-path=${result.manifestPath}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `passport-path=${result.passportPath}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `registry-path=${result.registryPath || ""}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest-json=${JSON.stringify(result.manifest)}\n`);
          NODE

      - name: Resolve artifact name
        id: names
        shell: bash
        run: echo "artifact-name=${{ inputs.artifact-name }}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload publication artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ steps.names.outputs.artifact-name }}
          path: ${{ inputs.artifact-paths }}
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error
