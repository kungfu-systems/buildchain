name: Release Governance Reconcile
on:
  workflow_call:
    inputs:
      branch:
        description: Managed dev/alpha/release branch whose required checks will be inspected
        required: true
        type: string
      candidate-sha:
        description: Already-tested pull request head SHA used to derive the emitted aggregate check
        required: true
        type: string
      apply:
        description: Replace stale Buildchain aggregate contexts while preserving all other required checks
        default: false
        required: false
        type: boolean
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
    secrets:
      governance-token:
        description: Token with read access to checks and administration access to branch protection
        required: false
      BUILDCHAIN_PROMOTION_TOKEN:
        description: Repository promotion token used by direct workflow dispatch
        required: false
  workflow_dispatch:
    inputs:
      branch:
        description: Managed dev/alpha/release branch whose required checks will be inspected
        required: true
        type: string
      candidate-sha:
        description: Already-tested pull request head SHA used to derive the emitted aggregate check
        required: true
        type: string
      apply:
        description: Replace stale Buildchain aggregate contexts while preserving all other required checks
        default: false
        required: false
        type: boolean
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  reconcile:
    name: Reconcile required build aggregate
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Reconcile required build aggregate
        id: node
        uses: ./.buildchain/runtime/actions/governance/release/reconcile
        with:
          runtime-ref: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
          request-json: ${{ toJSON(inputs) }}
          token: ${{ secrets['governance-token'] || secrets.BUILDCHAIN_PROMOTION_TOKEN || github.token }}
    needs:
      - execution-runtime
