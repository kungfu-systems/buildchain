on:
    workflow_call:
      inputs:
        aws-user-region:
          default: "cn-northwest-1"
          type: string
          required: false
        aws-region:
          default: "cn-northwest-1"
          type: string
          required: false
        bucket-release:
          default: "kungfu-releases"
          type: string
          required: false
      secrets:
        AWS_USER_ACCESS_KEY_ID:
          required: false
        AWS_USER_SECRET_ACCESS_KEY:
          required: false
  
permissions:
  contents: read
  
jobs:
    retired:
      runs-on: ubuntu-24.04
      steps:
        - name: Wheel release workflow retired
          run: |
            echo "::error::The workflows v2 wheel release path is retired."
            echo "::error::Do not use .wheel-release.yml; use a project lifecycle.publish command behind release-candidate-promote.yml@v2 so publish-gate source-lock enforcement applies."
            exit 1
  
