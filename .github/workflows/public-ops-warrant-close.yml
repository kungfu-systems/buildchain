name: Dev Delivery Warrant Close
on:
  workflow_call:
    inputs:
      target-branch:
        description: Protected dev branch
        type: string
        required: true
      expected-pr-number:
        description: Exact PR holding the active Warrant
        type: number
        required: true
      expected-head-sha:
        description: Exact immutable PR head
        type: string
        required: true
      outcome:
        description: merged, terminal-failure, dequeued, or cancelled
        type: string
        required: true
      current-base-sha:
        description: Exact latest dev base used by integration
        default: ""
        type: string
        required: false
      replay-tree-sha:
        description: Exact replayed Project Cut tree
        default: ""
        type: string
        required: false
      merge-group-head-sha:
        description: Exact GitHub merge_group candidate head
        default: ""
        type: string
        required: false
      merge-group-tree-sha:
        description: Exact GitHub merge_group candidate tree
        default: ""
        type: string
        required: false
      required-context-roots-json:
        description: Non-empty JSON array of exact final check roots
        default: "[]"
        type: string
        required: false
      terminal-evidence-root:
        description: Required evidence root for non-merged terminal outcomes
        default: ""
        type: string
        required: false
      reason:
        description: Visible terminal reason
        default: ""
        type: string
        required: false
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
    secrets:
      github-token:
        description: Token permitted to advance the Buildchain Warrant state ref
        required: false
    outputs:
      integration-proof-root:
        value: ${{ jobs.close.outputs.integration-proof-root }}
      close-receipt-root:
        value: ${{ jobs.close.outputs.close-receipt-root }}
      final-state-root:
        value: ${{ jobs.close.outputs.final-state-root }}
      successor-wake-json:
        value: ${{ jobs.close.outputs.successor-wake-json }}
permissions:
  contents: write
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  close:
    name: Close exact fenced delivery attempt
    runs-on: ubuntu-24.04
    outputs:
      integration-proof-root: ${{ steps.settle.outputs.evidence-integration-proof-root }}
      close-receipt-root: ${{ steps.settle.outputs.close-receipt-root }}
      final-state-root: ${{ steps.settle.outputs.close-final-state-root }}
      successor-wake-json: ${{ steps.settle.outputs.close-successor-wake-json }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Settle terminal delivery
        id: settle
        uses: ./.buildchain/runtime/actions/dev-delivery/warrant/settle
        with:
          request-json: ${{ toJSON(inputs) }}
          runtime-ref: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
          github-token: ${{ secrets.github-token || github.token }}
    needs:
      - execution-runtime
