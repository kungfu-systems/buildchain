name: V4 Stage Capsule Canary

on:
  workflow_call:
    inputs:
      consumer:
        description: Stable lowercase consumer identity used in exact evidence roots
        required: true
        type: string
      node-version:
        description: Node.js version used by the declared consumer lifecycle
        required: false
        default: "24"
        type: string
      install-artifact-path:
        description: Real output path produced by lifecycle.install
        required: true
        type: string
      build-artifact-path:
        description: Real output path produced by lifecycle.build
        required: true
        type: string
      verify-artifact-path:
        description: Real output path produced by lifecycle.verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Real lifecycle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact consumer source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Resolve exact called-workflow runtime
        id: runtime
        shell: bash
        env:
          BUILDCHAIN_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "${BUILDCHAIN_WORKFLOW_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::job.workflow_sha is not an exact commit SHA"
            exit 1
          fi
          echo "sha=${BUILDCHAIN_WORKFLOW_SHA,,}" >> "${GITHUB_OUTPUT}"
      - name: Checkout the exact Buildchain workflow runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ steps.runtime.outputs.sha }}
          path: .buildchain/v4-runtime
          persist-credentials: false
      - name: Verify exact runtime binding
        shell: bash
        run: test "$(git -C .buildchain/v4-runtime rev-parse HEAD)" = "${{ steps.runtime.outputs.sha }}"
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Bootstrap Buildchain runtime dependencies
        shell: bash
        run: |
          corepack prepare pnpm@11.7.0 --activate
          corepack pnpm@11.7.0 install --dir .buildchain/v4-runtime --prod --frozen-lockfile --ignore-scripts
      - name: Run declared install lifecycle
        env:
          BUILDCHAIN_SOURCE_SHA: ${{ github.sha }}
          CANARY_ARTIFACT_PATH: ${{ inputs.install-artifact-path }}
          CANARY_CONSUMER: ${{ inputs.consumer }}
          CANARY_PLATFORM: ${{ matrix.platform }}
        run: >-
          node .buildchain/v4-runtime/bin/buildchain.mjs lifecycle run install
          --cwd .
          --required
          --platform-id "${CANARY_PLATFORM}"
          --artifact-name "${CANARY_CONSUMER}-v4-canary-install"
          --artifact-path "${CANARY_ARTIFACT_PATH}"
          --manifest-path .buildchain/artifacts/v4-stage-capsule-canary/install-manifest.json
          --summary-path .buildchain/artifacts/v4-stage-capsule-canary/install-summary.json
      - name: Run declared build lifecycle
        env:
          BUILDCHAIN_SOURCE_SHA: ${{ github.sha }}
          CANARY_ARTIFACT_PATH: ${{ inputs.build-artifact-path }}
          CANARY_CONSUMER: ${{ inputs.consumer }}
          CANARY_PLATFORM: ${{ matrix.platform }}
        run: >-
          node .buildchain/v4-runtime/bin/buildchain.mjs lifecycle run build
          --cwd .
          --required
          --platform-id "${CANARY_PLATFORM}"
          --artifact-name "${CANARY_CONSUMER}-v4-canary-build"
          --artifact-path "${CANARY_ARTIFACT_PATH}"
          --manifest-path .buildchain/artifacts/v4-stage-capsule-canary/build-manifest.json
          --summary-path .buildchain/artifacts/v4-stage-capsule-canary/build-summary.json
      - name: Run declared verify lifecycle
        env:
          BUILDCHAIN_SOURCE_SHA: ${{ github.sha }}
          CANARY_ARTIFACT_PATH: ${{ inputs.verify-artifact-path }}
          CANARY_CONSUMER: ${{ inputs.consumer }}
          CANARY_PLATFORM: ${{ matrix.platform }}
        run: >-
          node .buildchain/v4-runtime/bin/buildchain.mjs lifecycle run verify
          --cwd .
          --required
          --platform-id "${CANARY_PLATFORM}"
          --artifact-name "${CANARY_CONSUMER}-v4-canary-verify"
          --artifact-path "${CANARY_ARTIFACT_PATH}"
          --manifest-path .buildchain/artifacts/v4-stage-capsule-canary/verify-manifest.json
          --summary-path .buildchain/artifacts/v4-stage-capsule-canary/verify-summary.json
      - name: Run retained-failure and clean-process resume campaign
        env:
          BUILDCHAIN_RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
          CANARY_CONSUMER: ${{ inputs.consumer }}
          CANARY_PLATFORM: ${{ matrix.platform }}
          CONSUMER_SOURCE_SHA: ${{ github.sha }}
        run: >-
          node .buildchain/v4-runtime/scripts/v4-stage-capsule-qualification.mjs campaign
          --work-root ".buildchain/v4-stage-capsule-canary/${CANARY_PLATFORM}"
          --platform "${CANARY_PLATFORM}"
          --consumer "${CANARY_CONSUMER}"
          --runtime-ref "${BUILDCHAIN_RUNTIME_SHA}"
          --consumer-source-revision "${CONSUMER_SOURCE_SHA}"
          --consumer-root .
          --lifecycle-evidence-root .buildchain/artifacts/v4-stage-capsule-canary
      - name: Upload exact platform evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: v4-stage-capsule-canary-${{ inputs.consumer }}-${{ matrix.platform }}-${{ github.sha }}
          path: |
            .buildchain/artifacts/v4-stage-capsule-canary/*.json
            .buildchain/v4-stage-capsule-canary/${{ matrix.platform }}/*.json
          if-no-files-found: error

  reconcile:
    name: Reconcile exact three-platform evidence
    needs: qualify
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve exact called-workflow runtime
        id: runtime
        shell: bash
        env:
          BUILDCHAIN_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "${BUILDCHAIN_WORKFLOW_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::job.workflow_sha is not an exact commit SHA"
            exit 1
          fi
          echo "sha=${BUILDCHAIN_WORKFLOW_SHA,,}" >> "${GITHUB_OUTPUT}"
      - name: Checkout the exact Buildchain workflow runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ steps.runtime.outputs.sha }}
          path: .buildchain/v4-runtime
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Download exact platform evidence
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: v4-stage-capsule-canary-${{ inputs.consumer }}-*-${{ github.sha }}
          path: .buildchain/v4-stage-capsule-canary-inputs
      - name: Reconcile the consumer campaign
        env:
          CANARY_CONSUMER: ${{ inputs.consumer }}
        run: >-
          node .buildchain/v4-runtime/scripts/v4-stage-capsule-qualification.mjs aggregate
          --input-dir .buildchain/v4-stage-capsule-canary-inputs
          --expected-consumers "${CANARY_CONSUMER}"
          --output .buildchain/v4-stage-capsule-canary-qualification.json
      - name: Upload qualification and immutable authority contract
        uses: actions/upload-artifact@v7.0.1
        with:
          name: v4-stage-capsule-canary-${{ inputs.consumer }}-${{ github.sha }}
          path: |
            .buildchain/v4-stage-capsule-canary-qualification.json
            .buildchain/v4-runtime/architecture/v4-stage-capsule-qualification.json
          if-no-files-found: error
