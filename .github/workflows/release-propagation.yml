name: Release Propagation

on:
  workflow_call:
    inputs:
      buildchain-repository:
        description: "Buildchain runtime repository"
        default: "kungfu-systems/buildchain"
        required: false
        type: string
      buildchain-ref:
        description: "Optional Buildchain runtime ref. Empty uses v2."
        default: "v2"
        required: false
        type: string
      graph-json:
        description: "Release propagation graph JSON"
        required: true
        type: string
      upstream-release-json:
        description: "Finalized upstream release envelope JSON"
        required: true
        type: string
      source-node:
        description: "Optional source node id; inferred from repository/package when omitted"
        default: ""
        required: false
        type: string
      downstream-target:
        description: "Target downstream node id or owner/repo"
        required: true
        type: string
      downstream-repository:
        description: "Downstream owner/repo to checkout and update"
        required: true
        type: string
      downstream-base-ref:
        description: "Downstream PR base branch"
        required: true
        type: string
      downstream-branch:
        description: "Downstream update branch"
        default: "buildchain/release-propagation"
        required: false
        type: string
      lock-path:
        description: "Optional downstream lock path override"
        default: ""
        required: false
        type: string
      pr-title:
        description: "Downstream PR title"
        default: "chore: consume upstream release"
        required: false
        type: string
      pr-body:
        description: "Additional downstream PR body"
        default: ""
        required: false
        type: string
      dry-run:
        description: "Plan and write lock without pushing a PR"
        default: true
        required: false
        type: boolean
    secrets:
      propagation-token:
        description: "Token with contents:write and pull-requests:write on the downstream repository"
        required: false
    outputs:
      controller-plan-artifact:
        description: "Controller plan artifact name"
        value: ${{ jobs.propagate.outputs.controller-plan-artifact }}
      controller-plan-json:
        description: "Compact controller plan JSON"
        value: ${{ jobs.propagate.outputs.controller-plan-json }}
      controller-plan-digest:
        description: "Controller plan digest"
        value: ${{ jobs.propagate.outputs.controller-plan-digest }}
      controller-receipt-artifact:
        description: "Controller receipt artifact name"
        value: ${{ jobs.propagate.outputs.controller-receipt-artifact }}
      controller-receipt-json:
        description: "Compact controller receipt JSON"
        value: ${{ jobs.propagate.outputs.controller-receipt-json }}
      controller-receipt-digest:
        description: "Controller receipt digest"
        value: ${{ jobs.propagate.outputs.controller-receipt-digest }}
      controller-receipt-status:
        description: "Controller receipt status"
        value: ${{ jobs.propagate.outputs.controller-receipt-status }}

permissions:
  contents: write
  pull-requests: write

jobs:
  propagate:
    name: Create downstream release propagation PR
    runs-on: ubuntu-24.04
    outputs:
      controller-plan-artifact: buildchain-release-propagation-controller-plan-${{ github.sha }}
      controller-plan-json: ${{ steps.controller-plan.outputs.controller-plan-json }}
      controller-plan-digest: ${{ steps.controller-plan.outputs.controller-plan-digest }}
      controller-receipt-artifact: buildchain-release-propagation-controller-receipt-${{ github.sha }}
      controller-receipt-json: ${{ steps.controller-receipt.outputs.controller-receipt-json }}
      controller-receipt-digest: ${{ steps.controller-receipt.outputs.controller-receipt-digest }}
      controller-receipt-status: ${{ steps.controller-receipt.outputs.controller-receipt-status }}
    steps:
      - name: Checkout Buildchain runtime
        id: runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.buildchain-repository }}
          ref: ${{ inputs.buildchain-ref || 'v2' }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Resolve controller identities
        id: controller-identities
        shell: bash
        run: |
          runtime_sha="$(git -C .buildchain/runtime rev-parse HEAD)"
          contract_digest="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(".buildchain/runtime/dist/site/buildchain-contract.json","utf8")); process.stdout.write(value.contractDigest)')"
          {
            echo "runtime-sha=${runtime_sha}"
            echo "contract-digest=${contract_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Create release-propagation controller plan
        id: controller-plan
        run: node .buildchain/runtime/scripts/controller-evidence.mjs --mode plan
        env:
          BUILDCHAIN_CONTROLLER_ID: release-propagation
          BUILDCHAIN_CONTROLLER_SOURCE_REPOSITORY: ${{ github.repository }}
          BUILDCHAIN_CONTROLLER_SOURCE_SHA: ${{ github.sha }}
          BUILDCHAIN_CONTROLLER_RUNTIME_REF: ${{ inputs.buildchain-ref || 'v2' }}
          BUILDCHAIN_CONTROLLER_RUNTIME_SHA: ${{ steps.controller-identities.outputs.runtime-sha }}
          BUILDCHAIN_CONTROLLER_CONTRACT_DIGEST: ${{ steps.controller-identities.outputs.contract-digest }}
          BUILDCHAIN_CONTROLLER_INPUTS_JSON: ${{ toJSON(inputs) }}
          BUILDCHAIN_CONTROLLER_INPUT_BOUNDARY: workflow-call
          BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json

      - name: Upload release-propagation controller plan
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-release-propagation-controller-plan-${{ github.sha }}
          path: .buildchain/controller/plan.json
          if-no-files-found: error

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Enable package manager shims
        run: |
          corepack prepare pnpm@11.7.0 --activate
          corepack enable
          pnpm --version

      - name: Install Buildchain runtime dependencies
        run: corepack pnpm@11.7.0 install --dir .buildchain/runtime --prod --frozen-lockfile --ignore-scripts

      - name: Write propagation inputs
        shell: bash
        env:
          GRAPH_JSON: ${{ inputs.graph-json }}
          UPSTREAM_RELEASE_JSON: ${{ inputs.upstream-release-json }}
        run: |
          mkdir -p .buildchain/release-propagation
          node <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(".buildchain/release-propagation/graph.json", `${process.env.GRAPH_JSON}\n`);
          fs.writeFileSync(".buildchain/release-propagation/upstream-release.json", `${process.env.UPSTREAM_RELEASE_JSON}\n`);
          NODE

      - name: Plan release propagation
        id: plan
        shell: bash
        run: |
          node .buildchain/runtime/bin/buildchain.mjs release-propagation plan \
            --graph .buildchain/release-propagation/graph.json \
            --upstream-release .buildchain/release-propagation/upstream-release.json \
            --source-node "${{ inputs.source-node }}" \
            --output .buildchain/release-propagation/plan.json \
            --json
          node <<'NODE'
            const fs = require("fs");
            const plan = JSON.parse(fs.readFileSync(".buildchain/release-propagation/plan.json", "utf8"));
            const target = plan.targets.find((entry) => entry.target === process.env.TARGET || entry.repository === process.env.TARGET);
            if (!target) throw new Error(`no propagation target matched ${process.env.TARGET}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `target=${target.target}\nrepository=${target.repository}\nchannel=${target.channel}\nlock_path=${target.lockPath}\nlock_sha=${target.lock.lockSha256}\n`);
          NODE
        env:
          TARGET: ${{ inputs.downstream-target }}

      - name: Checkout downstream repository
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.downstream-repository }}
          token: ${{ secrets['propagation-token'] || github.token }}
          path: downstream
          ref: ${{ inputs.downstream-base-ref }}

      - name: Write downstream release lock
        id: lock
        shell: bash
        run: |
          node .buildchain/runtime/bin/buildchain.mjs release-propagation write-lock \
            --plan .buildchain/release-propagation/plan.json \
            --target "${{ inputs.downstream-target }}" \
            --cwd downstream \
            --output "${{ inputs.lock-path }}" \
            --json > .buildchain/release-propagation/write-lock.json
          node <<'NODE'
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync(".buildchain/release-propagation/write-lock.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${result.path}\nlock_sha=${result.lockSha256}\n`);
          NODE

      - name: Summarize release propagation
        id: summarize
        shell: bash
        run: |
          {
            echo "## Release propagation"
            echo
            echo "- Downstream: \`${{ steps.plan.outputs.repository }}\`"
            echo "- Channel: \`${{ steps.plan.outputs.channel }}\`"
            echo "- Lock path: \`${{ steps.plan.outputs.lock_path }}\`"
            echo "- Lock SHA-256: \`${{ steps.lock.outputs.lock_sha }}\`"
            echo "- Dry run: \`${{ inputs.dry-run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update downstream PR
        id: open-pr
        if: ${{ !inputs.dry-run }}
        shell: bash
        working-directory: downstream
        env:
          GH_TOKEN: ${{ secrets['propagation-token'] || github.token }}
          BRANCH: ${{ inputs.downstream-branch }}
          BASE: ${{ inputs.downstream-base-ref }}
          TITLE: ${{ inputs.pr-title }}
          BODY: ${{ inputs.pr-body }}
          PLAN_PATH: ../.buildchain/release-propagation/plan.json
          LOCK_PATH: ${{ steps.plan.outputs.lock_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "$LOCK_PATH"
          if git diff --cached --quiet -- "$LOCK_PATH"; then
            echo "No downstream lock changes."
            exit 0
          fi
          git commit -m "$TITLE"
          git push origin "HEAD:$BRANCH"
          {
            echo "$BODY"
            echo
            echo "Buildchain release propagation plan:"
            echo
            echo '```json'
            cat "$PLAN_PATH"
            echo '```'
          } > ../.buildchain/release-propagation/pr-body.md
          gh pr create \
            --repo "${{ inputs.downstream-repository }}" \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file ../.buildchain/release-propagation/pr-body.md || \
          gh pr edit "$BRANCH" \
            --repo "${{ inputs.downstream-repository }}" \
            --title "$TITLE" \
            --body-file ../.buildchain/release-propagation/pr-body.md

      - name: Upload propagation plan
        id: propagation-upload
        uses: actions/upload-artifact@v4
        with:
          name: buildchain-release-propagation-plan
          path: .buildchain/release-propagation/*

      - name: Create release-propagation controller receipt
        id: controller-receipt
        if: ${{ always() && steps.controller-plan.outcome == 'success' }}
        run: node .buildchain/runtime/scripts/controller-evidence.mjs --mode receipt
        env:
          BUILDCHAIN_CONTROLLER_PLAN_PATH: .buildchain/controller/plan.json
          BUILDCHAIN_CONTROLLER_STAGES_JSON: >-
            [{"id":"resolve-runtime","status":"${{ steps.runtime.outcome == 'success' && steps.controller-identities.outcome == 'success' && 'success' || steps.runtime.outcome == 'failure' && 'failure' || steps.controller-identities.outcome }}"},{"id":"plan","status":"${{ steps.plan.outcome }}"},{"id":"write-lock","status":"${{ steps.lock.outcome }}"},{"id":"open-pr","status":"${{ steps.open-pr.outcome }}"},{"id":"aggregate","status":"${{ (steps.summarize.outcome == 'failure' || steps.propagation-upload.outcome == 'failure') && 'failure' || (steps.summarize.outcome == 'success' && steps.propagation-upload.outcome == 'success') && 'success' || 'skipped' }}"}]
          BUILDCHAIN_CONTROLLER_EVIDENCE_FILES_JSON: ${{ steps.plan.outcome == 'success' && steps.lock.outcome == 'success' && '[{"kind":"propagation-plan","path":".buildchain/release-propagation/plan.json"},{"kind":"propagation-lock","path":".buildchain/release-propagation/write-lock.json"}]' || '[]' }}
          BUILDCHAIN_CONTROLLER_REASON_CODE: ${{ steps.plan.outcome == 'success' && steps.lock.outcome == 'success' && '' || 'propagation-incomplete' }}
          BUILDCHAIN_CONTROLLER_REASON_SUMMARY: Release propagation did not complete successfully
          BUILDCHAIN_CONTROLLER_RECEIPT_ARTIFACT: buildchain-release-propagation-controller-receipt-${{ github.sha }}
          BUILDCHAIN_CONTROLLER_RECEIPT_PATH: .buildchain/controller/receipt.json

      - name: Upload release-propagation controller receipt
        if: ${{ always() && steps.controller-receipt.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: buildchain-release-propagation-controller-receipt-${{ github.sha }}
          path: .buildchain/controller/receipt.json
          if-no-files-found: error

      - name: Enforce qualifying release-propagation controller receipt
        if: ${{ always() && steps.controller-plan.outcome == 'success' && steps.controller-receipt.outputs.controller-receipt-qualifying != 'true' }}
        run: |
          echo "::error::release-propagation controller receipt is not qualifying: ${{ steps.controller-receipt.outputs.controller-receipt-status }}"
          exit 1
