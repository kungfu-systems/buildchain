name: Buildchain Sealed Publication Authority
on:
  workflow_call:
    inputs:
      buildchain-repository:
        default: kungfu-systems/buildchain
        type: string
        required: false
      buildchain-ref:
        description: Exact Buildchain runtime SHA that owns the authority registry and verifier
        type: string
        required: true
      admission-json:
        description: Fresh sealed publication admission JSON
        type: string
        required: false
        default: ""
      runner-provenance-json:
        description: Runner provenance receipt JSON
        type: string
        required: false
        default: ""
      control-plane-audit-json:
        description: Fresh external control-plane audit receipt JSON
        type: string
        required: false
        default: ""
      github-governance-receipt-json:
        description: Optional prior governance receipt for diagnostics; non-dry-run authority always recollects live GitHub state with the dedicated auditor App
        type: string
        required: false
        default: ""
      gate-aggregate-json:
        description: Qualifying Shifu Gate aggregate or explicit consumer-owned no-Gate decision
        type: string
        required: false
        default: ""
      consumer-gate-command:
        description: Consumer-owned read-only command that assembles a qualifying Gate aggregate from the downloaded exact release-candidate evidence
        type: string
        required: false
        default: ""
      consumer-gate-controller-sha:
        description: Exact caller-repository commit that owns the consumer Gate command; empty uses source-sha
        type: string
        required: false
        default: ""
      consumer-gate-evidence-source-sha:
        description: Original candidate source SHA used only to validate a reused candidate Gate; empty uses source-sha
        type: string
        required: false
        default: ""
      consumer-gate-evidence-source-tree:
        description: Exact tree shared by the reused candidate source and current publication source
        type: string
        required: false
        default: ""
      expected-json:
        description: Independent exact publication bindings JSON
        type: string
        required: false
        default: ""
      used-nonces-json:
        description: JSON array of already consumed admission nonces
        type: string
        required: false
        default: "[]"
      consumer-qualification-required:
        description: Require a consumer-owned predicate receipt before provider mutation
        type: boolean
        required: false
        default: false
      consumer-predicate-id:
        description: Stable consumer-owned predicate identifier
        type: string
        required: false
        default: ""
      consumer-predicate-digest:
        description: SHA-256 digest of the exact consumer predicate command
        type: string
        required: false
        default: ""
      auto-admission:
        description: Assemble sealed evidence from an exact managed publication candidate
        type: boolean
        required: false
        default: false
      auto-admission-kind:
        description: "Managed evidence kind: release-candidate, publication-artifact, or binary-release-assets"
        type: string
        required: false
        default: release-candidate
      auto-no-gate:
        description: Explicit caller decision that a managed release-candidate publication has no Shifu Gate registry
        type: boolean
        required: false
        default: false
      source-sha:
        description: Exact caller channel commit admitted by managed publication assembly
        type: string
        required: false
        default: ""
      target-ref:
        description: Protected Buildchain channel ref audited by self-publication assembly
        type: string
        required: false
        default: ""
      required-status-check:
        description: Exact protected-branch status check context admitted by the authority
        type: string
        required: false
        default: check
      publisher-workflow-path:
        description: Caller workflow filename bound by the npm trusted publisher
        type: string
        required: false
        default: ""
      authority-workflow-path:
        description: Buildchain product-publication workflow path bound by the admission
        type: string
        required: false
        default: ""
      product:
        type: string
        required: false
        default: Buildchain
      publication-target:
        type: string
        required: false
        default: npm:@kungfu-tech/buildchain
      publication-version:
        description: Exact version selected by the read-only publication plan
        type: string
        required: false
        default: ""
      package-name:
        type: string
        required: false
        default: "@kungfu-tech/buildchain"
      evidence-repository:
        description: Consumer repository whose exact Actions run owns the independent evidence
        type: string
        required: false
        default: ""
      evidence-run-id:
        description: Exact successful Actions run containing the RC passport and controller/artifact evidence
        type: string
        required: false
        default: ""
      evidence-passport-artifact:
        description: Exact release-candidate passport artifact name
        type: string
        required: false
        default: ""
      evidence-summary-artifact:
        description: Exact build-summary artifact name
        type: string
        required: false
        default: ""
      evidence-manifest-pattern:
        description: Artifact-name pattern selecting the exact run's platform manifests
        type: string
        required: false
        default: ""
      evidence-payload-pattern:
        description: Artifact-name pattern selecting the exact run's candidate payloads
        type: string
        required: false
        default: ""
      evidence-publication-artifact:
        description: Exact publication candidate artifact name
        type: string
        required: false
        default: ""
      evidence-controller-artifact:
        description: Exact publication-artifact controller receipt artifact name
        type: string
        required: false
        default: ""
      dry-run:
        type: boolean
        required: false
        default: false
    outputs:
      capability-json:
        description: Compact publication capability receipt JSON; dry-run is not a publication capability
        value: ${{ jobs.verify.outputs.capability-json }}
      capability-digest:
        description: Publication capability receipt digest
        value: ${{ jobs.verify.outputs.capability-digest }}
      capability-artifact:
        description: Publication capability receipt artifact
        value: ${{ jobs.verify.outputs.capability-artifact }}
      gate-aggregate-json:
        description: Complete Gate aggregate transported without summary reduction
        value: ${{ jobs.verify.outputs.gate-aggregate-json }}
      gate-aggregate-digest:
        description: Canonical digest of the transported Gate aggregate
        value: ${{ jobs.verify.outputs.gate-aggregate-digest }}
    secrets:
      KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY:
        description: Private key for the dedicated read-only GitHub governance auditor App
        required: false
      BUILDCHAIN_GOVERNANCE_READ_TOKEN:
        description: Optional consumer-owned token used as the live governance read fallback
        required: false
permissions:
  contents: read
jobs:
  verify:
    name: Independently verify publication admission
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      capability-json: ${{ steps.authority-verify.outputs.capability-json }}
      capability-digest: ${{ steps.authority-verify.outputs.capability-digest }}
      capability-artifact: ${{ steps.authority-verify.outputs.capability-artifact }}
      gate-aggregate-json: ${{ steps.authority-verify.outputs.gate-aggregate-json }}
      gate-aggregate-digest: ${{ steps.authority-verify.outputs.gate-aggregate-digest }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: "Publication authority: admit."
        id: authority-admit
        uses: ./.buildchain/workflow-shell/actions/publication/authority/admit
        with:
          runtime-ref: ${{ inputs.buildchain-ref || job.workflow_sha }}
          runtime-repository: ${{ inputs.buildchain-repository || job.workflow_repository }}
          request-json: ${{ toJSON(inputs) }}
          auditor-private-key: ${{ secrets.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY }}
          auditor-app-id: ${{ vars.KUNGFU_GOVERNANCE_AUDITOR_APP_ID }}
          governance-read-token: ${{ secrets.BUILDCHAIN_GOVERNANCE_READ_TOKEN }}
      - name: "Publication authority: candidate evidence."
        id: authority-candidate-evidence
        uses: ./.buildchain/workflow-shell/actions/publication/authority/candidate-evidence
        with:
          request-json: ${{ toJSON(inputs) }}
      - name: "Publication authority: artifact evidence."
        uses: ./.buildchain/workflow-shell/actions/publication/authority/artifact-evidence
        with:
          request-json: ${{ toJSON(inputs) }}
      - name: "Publication authority: assemble."
        id: authority-assemble
        uses: ./.buildchain/workflow-shell/actions/publication/authority/assemble
        with:
          request-json: ${{ toJSON(inputs) }}
          governance-token: ${{ steps.authority-admit.outputs.governance-auditor-token || secrets.BUILDCHAIN_GOVERNANCE_READ_TOKEN || github.token }}
          token: ${{ github.token }}
          consumer-gate-json: ${{ steps.authority-candidate-evidence.outputs.consumer-gate-json }}
      - name: "Publication authority: verify."
        id: authority-verify
        uses: ./.buildchain/workflow-shell/actions/publication/authority/verify
        with:
          request-json: ${{ toJSON(inputs) }}
          admission-bundle-json: ${{ steps.authority-assemble.outputs.admission-bundle-json }}
          consumer-gate-json: ${{ steps.authority-candidate-evidence.outputs.consumer-gate-json }}
