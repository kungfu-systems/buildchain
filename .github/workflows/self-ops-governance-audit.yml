name: GitHub Governance Authority Audit
on:
  pull_request: null
  merge_group: null
  schedule:
    - cron: 41 3 * * *
  workflow_dispatch:
    inputs:
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
permissions:
  contents: read
  issues: write
concurrency:
  group: github-governance-authority-audit
  cancel-in-progress: false
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
    timeout-minutes: 5
  audit:
    name: Governance receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Audit managed-zone governance
        uses: ./.buildchain/runtime/actions/governance/repository/audit
        with:
          auditor-app-id: ${{ vars.KUNGFU_GOVERNANCE_AUDITOR_APP_ID }}
          auditor-private-key: ${{ secrets.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY }}
          governance-read-token: ${{ secrets.BUILDCHAIN_GOVERNANCE_READ_TOKEN }}
    needs:
      - execution-runtime
