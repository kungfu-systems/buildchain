name: GitHub Governance Authority Audit

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: github-governance-authority-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Governance receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Audit managed-zone governance
        uses: ./.buildchain/workflow-shell/actions/governance/repository/audit
        with:
          auditor-app-id: ${{ vars.KUNGFU_GOVERNANCE_AUDITOR_APP_ID }}
          auditor-private-key: ${{ secrets.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY }}
          governance-read-token: ${{ secrets.BUILDCHAIN_GOVERNANCE_READ_TOKEN }}
