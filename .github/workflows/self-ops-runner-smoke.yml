name: Self-hosted Runner Smoke
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  smoke:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kungfu-build-v4-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Execute runner-smoke
        id: node
        uses: ./.buildchain/workflow-shell/actions/governance/runner-smoke
        if: ${{ always() }}
        with:
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
