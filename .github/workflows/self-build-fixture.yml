name: Build Surface Fixture
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch: null
permissions:
  actions: read
  contents: read
  issues: write
  id-token: write
  attestations: write
jobs:
  libnode-shaped:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v4-alpha
    secrets: inherit
    with:
      config-path: fixtures/libnode-shaped/buildchain.toml
  buildchain-package-candidate:
    name: Seal Buildchain npm product payload
    needs:
      - libnode-shaped
    if:
      ${{ needs.libnode-shaped.result == 'success' && ((github.event_name == 'pull_request' &&
      (startsWith(github.base_ref, 'alpha/') || startsWith(github.base_ref, 'release/'))) || github.event_name ==
      'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Seal Buildchain npm product payload
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/artifact/package
        with:
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
          passport-artifact: ${{ needs.libnode-shaped.outputs.release-candidate-artifact }}
        if: ${{ always() }}
