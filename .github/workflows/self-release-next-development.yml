name: Next Development Review
on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed
permissions:
  contents: read
concurrency:
  group: next-development-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  review:
    if: |-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (startsWith(github.event.workflow_run.head_branch, 'chore/next-development/') ||
           startsWith(github.event.workflow_run.head_branch, 'chore/v4-product-pr/release-')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Checkout protected default branch runtime
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Execute next-development-review
        id: node
        uses: ./.buildchain/workflow-shell/actions/release/next-development-review
        with:
          secrets-buildchain-approval-token: ${{ secrets.BUILDCHAIN_APPROVAL_TOKEN }}
          secrets-buildchain-promotion-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
