name: V4 Public Consumer Dogfood

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogfood:
    uses: kungfu-systems/buildchain/.github/workflows/v4-stage-capsule-canary.yml@train/v4/v4.0/public-consumer-self-dogfood
    with:
      consumer: buildchain
      node-version: "24"
      go-version: "1.25.x"
      install-artifact-path: node_modules/.modules.yaml
      build-artifact-path: actions/run-lifecycle/dist/index.js
      verify-artifact-path: dist/site
