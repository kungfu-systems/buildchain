on:
  workflow_call:
    secrets:
      GITHUB_PUSH_TOKEN:
        required: true

jobs:
  bump:
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Bump Version
        if: ${{ github.event.pull_request.merged }}
        uses: kungfu-systems/buildchain/actions/bump-version@v2
        with:
          token: ${{ secrets.GITHUB_PUSH_TOKEN }}