name: Build Surface Fixture

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev/v*/v*.*
      - alpha/v*/v*.*
      - release/v*/v*.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libnode-shaped:
    uses: ./.github/workflows/.build.yml
    with:
      working-directory: fixtures/libnode-shaped
      runner-preset: github-hosted
      linux-container-preset: kungfu-verify
      artifact-name: libnode-shaped
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: |
        fixtures/libnode-shaped/dist
        .buildchain/artifacts
      release-candidate: true
      expected-artifacts-json: >-
        {"minFiles":2,"requiredPaths":["fixtures/libnode-shaped/dist/install.txt","fixtures/libnode-shaped/dist/libnode-shaped.txt"]}
