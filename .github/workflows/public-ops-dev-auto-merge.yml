name: Dev PR Auto Merge
on:
  workflow_call:
    inputs:
      target-branch:
        description: Protected dev branch to merge ready PRs into
        default: ""
        type: string
        required: false
      expected-pr-number:
        description: Optional exact PR number for targeted Agent admission; requires expected-head-sha
        default: 0
        type: number
        required: false
      expected-head-sha:
        description: Exact 40-character PR head required for targeted Agent admission
        default: ""
        type: string
        required: false
      source-workflow-run-id:
        description: Exact successful source workflow run retained for immediate Warrant handoff
        default: 0
        type: number
        required: false
      handoff-workflow-id:
        description: Optional consumer workflow file to dispatch when another candidate owns the active Warrant
        default: ""
        type: string
        required: false
      diagnostic-context:
        description: Commit-status context used for PR-visible targeted admission state
        default: Buildchain delivery intent
        type: string
        required: false
      delivery-warrant-mode:
        description: "Delivery Warrant rollout: off, shadow (read-only queue plan), or required"
        default: off
        type: string
        required: false
      source-identity-root:
        description: Immutable semantic source identity root
        default: ""
        type: string
        required: false
      source-patch-root:
        description: Immutable source patch or tree-intent root
        default: ""
        type: string
        required: false
      project-cut-proof-json:
        description: Optional exact rooted Project Cut replay proof required when GitHub reports the PR
          behind the current protected base
        default: ""
        type: string
        required: false
      plan-root:
        description: Exact qualification plan root
        default: ""
        type: string
        required: false
      closure-root:
        description: Exact affected-closure root
        default: ""
        type: string
        required: false
      dependency-root:
        description: Exact dependency-graph root
        default: ""
        type: string
        required: false
      toolchain-root:
        description: Exact qualification toolchain root
        default: ""
        type: string
        required: false
      environment-root:
        description: Exact native execution environment contract root; required for required native
          qualification
        default: ""
        type: string
        required: false
      affected-paths-json:
        description: JSON array of covered paths; an empty array reconstructs paths from the exact
          successful source workflow run
        default: "[]"
        type: string
        required: false
      shard-evidence-roots-json:
        description: JSON array of additional native-shard evidence roots
        default: "[]"
        type: string
        required: false
      native-proof-json:
        description: Optional reusable semantic native proof; base-only drift is classified before use
        default: ""
        type: string
        required: false
      native-command:
        description: Native qualification command run after provisional Warrant selection when proof reuse
          is unavailable
        default: ""
        type: string
        required: false
      native-command-root:
        description: Optional exact root of native-command; when supplied it must match before admission or
          spawn
        default: ""
        type: string
        required: false
      release-blocker-priority-json:
        description: Optional exact rooted release-blocker priority claim
        default: ""
        type: string
        required: false
      native-heartbeat-seconds:
        description: Heartbeat cadence while native qualification is running
        default: 300
        type: number
        required: false
      delivery-class:
        description: Bounded delivery class
        default: native-proof-required
        type: string
        required: false
      delivery-priority:
        description: "Reviewed priority: ordinary, expedited, or emergency"
        default: ordinary
        type: string
        required: false
      warrant-lease-seconds:
        description: Delivery Warrant lease TTL
        default: 3600
        type: number
        required: false
      required-status-checks:
        description: Comma or newline separated required status/check-run name fragments
        default: check / check
        type: string
        required: false
      queue-admission-context:
        description: Exact-head status written and read back before native queue admission; required in
          Warrant mode
        default: ""
        type: string
        required: false
      active-lease-context:
        description: Exact-head lease status written and read back as pending before enqueue; required in
          Warrant mode
        default: ""
        type: string
        required: false
      ready-label:
        description: Required label for PRs eligible to merge. Empty disables the label gate.
        default: ready
        type: string
        required: false
      block-labels:
        description: Comma or newline separated labels that block merging
        default: blocked,do-not-merge,work-in-progress
        type: string
        required: false
      allowed-head-prefixes:
        description: Comma or newline separated allowed source branch prefixes
        default: feature/,fix/,chore/,docs/,ci/,refactor/
        type: string
        required: false
      require-approval:
        description: Require at least one current approval and no latest changes-requested review
        default: true
        type: boolean
        required: false
      same-repository-only:
        description: Reject fork/cross-repository PR heads by default
        default: true
        type: boolean
        required: false
      max-merges:
        description: Maximum PRs to merge in one run
        default: 1
        type: number
        required: false
      merge-method:
        description: "GitHub merge method: merge, squash, or rebase"
        default: merge
        type: string
        required: false
      landing-mode:
        description: "Landing mode: auto selects native queue when enabled; queue fails closed without one"
        default: auto
        type: string
        required: false
      defer-landing:
        description: Qualify the exact required Warrant and publish its evidence without landing the PR
        default: false
        type: boolean
        required: false
      dry-run:
        description: Plan only; do not merge PRs
        default: true
        type: boolean
        required: false
      source-root:
        description: Canonical Work source root required for Warrant submission.
        type: string
        default: ""
        required: false
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
    secrets:
      github-token:
        description: Optional token for reading and merging PRs. Defaults to github.token.
        required: false
    outputs:
      evaluated-count:
        description: Number of PRs evaluated
        value: ${{ jobs.merge-dev-prs.outputs.evaluated-count }}
      merged-count:
        description: Number of PRs directly merged, or directly eligible in dry-run mode
        value: ${{ jobs.merge-dev-prs.outputs.merged-count }}
      enqueued-count:
        description: Number of PRs admitted into the native merge queue
        value: ${{ jobs.merge-dev-prs.outputs.enqueued-count }}
      action-count:
        description: Number of direct merges, queue admissions, or planned actions
        value: ${{ jobs.merge-dev-prs.outputs.action-count }}
      skipped-count:
        description: Number of PRs skipped
        value: ${{ jobs.merge-dev-prs.outputs.skipped-count }}
      final-base-sha:
        description: Final target branch SHA after the run
        value: ${{ jobs.merge-dev-prs.outputs.final-base-sha }}
      admission-state:
        description: Typed targeted admission state; empty for cadence patrol
        value: ${{ jobs.merge-dev-prs.outputs.admission-state }}
      admission-receipt-root:
        description: Content root of the targeted exact-head admission receipt
        value: ${{ jobs.merge-dev-prs.outputs.admission-receipt-root }}
      source-proof-root:
        description: Content root of the reusable Source Qualification Proof
        value: ${{ jobs.merge-dev-prs.outputs.source-proof-root }}
      warrant-receipt-root:
        description: Content root of the selected Delivery Warrant receipt
        value: ${{ jobs.merge-dev-prs.outputs.warrant-receipt-root }}
      warrant-state-root:
        description: Exact readback root of the durable Warrant queue
        value: ${{ jobs.merge-dev-prs.outputs.warrant-state-root }}
      warrant-state-commit:
        description: Immutable queue commit containing the active Warrant readback
        value: ${{ jobs.merge-dev-prs.outputs.warrant-state-commit }}
      project-cut-proof-root:
        description: Verified exact Project Cut replay proof root, when supplied
        value: ${{ jobs.merge-dev-prs.outputs.project-cut-proof-root }}
      native-proof-root:
        description: Fresh or reused semantic native proof root
        value: ${{ jobs.merge-dev-prs.outputs.native-proof-root }}
      native-reuse-decision-root:
        description: Rooted fail-closed native proof reuse decision
        value: ${{ jobs.merge-dev-prs.outputs.native-reuse-decision-root }}
      qualified-warrant-receipt-root:
        description: Atomic provisional-to-qualified Warrant receipt root
        value: ${{ jobs.merge-dev-prs.outputs.qualified-warrant-receipt-root }}
      native-execution-transfer-root:
        description: Content root of the cross-job native proof and state transfer
        value: ${{ jobs.merge-dev-prs.outputs.native-execution-transfer-root }}
      provider-finalizer-boundary-root:
        description: Live provider readback root proving pairwise-distinct hosted native, seal, and
          finalizer domains
        value: ${{ jobs.merge-dev-prs.outputs.provider-finalizer-boundary-root }}
      provider-heartbeat-receipt-root:
        description: Rooted independent durable heartbeat continuity receipt
        value: ${{ jobs.merge-dev-prs.outputs.provider-heartbeat-receipt-root }}
permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  statuses: write
concurrency:
  group: buildchain-dev-pr-admission-${{ github.repository }}-${{ inputs.target-branch ||
    github.ref_name }}-${{ inputs.expected-pr-number || github.run_id }}
  cancel-in-progress: false
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  admission:
    name: Reserve exact delivery candidate
    runs-on: ubuntu-24.04
    outputs:
      runtime-sha: ${{ steps.source.outputs.runtime-sha }}
      runtime-selection-root: ${{ steps.source.outputs.runtime-root }}
      target-branch: ${{ steps.source.outputs.target-branch }}
      branch-artifact: ${{ steps.source.outputs.target-branch-artifact }}
      source-proof-root: ${{ steps.source.outputs.proof-source-proof-root }}
      warrant-receipt-root: ${{ steps.reserve.outputs.warrant-receipt-root }}
      warrant-state-root: ${{ steps.reserve.outputs.warrant-state-root }}
      warrant-state-commit: ${{ steps.reserve.outputs.warrant-state-commit }}
      project-cut-proof-root: ${{ steps.source.outputs.project-cut-proof-root }}
      native-proof-root: ${{ steps.reserve.outputs.warrant-native-proof-root }}
      native-reuse-decision-root: ${{ steps.reserve.outputs.warrant-decision-root }}
      qualified-warrant-receipt-root: ${{ steps.reserve.outputs.warrant-qualification-receipt-root }}
      handoff-required: ${{ steps.reserve.outputs.warrant-handoff-required }}
      handoff-dispatched: ${{ steps.reserve.outputs.warrant-handoff-dispatched }}
      already-qualified: ${{ steps.reserve.outputs.warrant-already-qualified }}
      run-native: ${{ inputs.delivery-warrant-mode == 'required' && steps.reserve.outputs.warrant-outcome
        == 'success' && steps.reserve.outputs.warrant-handoff-required != 'true' &&
        steps.reserve.outputs.warrant-already-qualified != 'true' }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Admit exact source
        id: source
        uses: ./.buildchain/runtime/actions/dev-delivery/candidate/admit
        with:
          request-json: ${{ toJSON(inputs) }}
          github-token: ${{ secrets.github-token || github.token }}
      - name: Reserve delivery turn
        id: reserve
        if: always()
        uses: ./.buildchain/runtime/actions/dev-delivery/candidate/reserve
        with:
          request-json: ${{ toJSON(inputs) }}
          github-token: ${{ secrets.github-token || github.token }}
          predecessors-ok: ${{ job.status == 'success' }}
          proof-outcome: ${{ steps.source.outputs.proof-outcome }}
          target-branch: ${{ steps.source.outputs.target-branch }}
          proof-source-proof-root: ${{ steps.source.outputs.proof-source-proof-root }}
          qualify-outcome: ${{ steps.source.outputs.qualify-outcome }}
          runtime-sha: ${{ steps.source.outputs.runtime-sha }}
    needs:
      - execution-runtime
  native-execution:
    name: Credentialless native execution
    needs:
      - admission
      - execution-runtime
    if: ${{ (needs.admission.outputs.run-native == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Verify native execution
        id: native
        uses: ./.buildchain/runtime/actions/dev-delivery/native/execute
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-json: ${{ toJSON(needs) }}
  seal-native-execution:
    name: Credentialless native evidence seal
    needs:
      - admission
      - native-execution
      - execution-runtime
    if: ${{ (always() && needs.admission.result == 'success' && needs.admission.outputs.run-native ==
      'true') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      transfer-root: ${{ steps.native.outputs.transfer-root }}
      native-outcome: ${{ steps.native.outputs.transfer-native-outcome }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Verify native execution
        id: native
        uses: ./.buildchain/runtime/actions/dev-delivery/native/seal
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-json: ${{ toJSON(needs) }}
  delivery-heartbeat:
    name: Credentialed independent Warrant heartbeat
    needs:
      - admission
      - execution-runtime
    if: ${{ (needs.admission.outputs.run-native == 'true') }}
    runs-on: macos-15
    permissions:
      actions: read
      contents: write
    outputs:
      receipt-root: ${{ steps.native.outputs.heartbeat-receipt-root }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Verify native execution
        id: native
        uses: ./.buildchain/runtime/actions/dev-delivery/native/heartbeat
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-json: ${{ toJSON(needs) }}
          github-token: ${{ secrets.github-token || github.token }}
  merge-dev-prs:
    name: Credentialed provider finalizer
    needs:
      - admission
      - native-execution
      - seal-native-execution
      - delivery-heartbeat
      - execution-runtime
    if: ${{ (always() && needs.admission.result == 'success' && needs.admission.outputs.handoff-required
      != 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
      checks: read
      statuses: write
    outputs:
      evaluated-count: ${{ steps.land.outputs.merge-evaluated-count }}
      merged-count: ${{ steps.land.outputs.merge-merged-count }}
      enqueued-count: ${{ steps.land.outputs.merge-enqueued-count }}
      action-count: ${{ steps.land.outputs.merge-action-count }}
      skipped-count: ${{ steps.land.outputs.merge-skipped-count }}
      final-base-sha: ${{ steps.land.outputs.merge-final-base-sha }}
      admission-state: ${{ steps.land.outputs.merge-admission-state }}
      admission-receipt-root: ${{ steps.land.outputs.merge-receipt-root }}
      source-proof-root: ${{ needs.admission.outputs.source-proof-root }}
      warrant-receipt-root: ${{ needs.admission.outputs.warrant-receipt-root }}
      warrant-state-root: ${{ needs.admission.outputs.warrant-state-root }}
      warrant-state-commit: ${{ needs.admission.outputs.warrant-state-commit }}
      project-cut-proof-root: ${{ needs.admission.outputs.project-cut-proof-root }}
      native-proof-root: ${{ steps.qualify.outputs.native-final-native-proof-root ||
        needs.admission.outputs.native-proof-root }}
      native-reuse-decision-root: ${{ steps.qualify.outputs.native-final-decision-root ||
        needs.admission.outputs.native-reuse-decision-root }}
      qualified-warrant-receipt-root: ${{ steps.qualify.outputs.native-final-qualification-receipt-root ||
        needs.admission.outputs.qualified-warrant-receipt-root }}
      native-execution-transfer-root: ${{ steps.qualify.outputs.boundary-transfer-root }}
      provider-finalizer-boundary-root: ${{ steps.qualify.outputs.boundary-root }}
      provider-heartbeat-receipt-root: ${{ needs.delivery-heartbeat.outputs.receipt-root }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Qualify delivery evidence
        id: qualify
        uses: ./.buildchain/runtime/actions/dev-delivery/candidate/qualify
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-json: ${{ toJSON(needs) }}
          github-token: ${{ secrets.github-token || github.token }}
      - name: Settle terminal delivery
        id: settle
        uses: ./.buildchain/runtime/actions/dev-delivery/warrant/settle-native-failure
        with:
          runtime-sha: ${{ needs.admission.outputs.runtime-sha }}
          branch: ${{ needs.admission.outputs.target-branch }}
          token: ${{ secrets.github-token || github.token }}
        if: ${{ success() && needs.admission.outputs.run-native == 'true' &&
          steps.qualify.outputs.boundary-outcome == 'success' &&
          steps.qualify.outputs.boundary-native-outcome == 'failure' }}
      - name: Land protected dev PR
        id: land
        if: always()
        uses: ./.buildchain/runtime/actions/dev-delivery/queue/land
        with:
          request-json: ${{ toJSON(inputs) }}
          needs-json: ${{ toJSON(needs) }}
          github-token: ${{ secrets.github-token || github.token }}
          native-final-outcome: ${{ steps.qualify.outputs.native-final-outcome }}
          boundary-outcome: ${{ steps.qualify.outputs.boundary-outcome }}
          boundary-native-outcome: ${{ steps.qualify.outputs.boundary-native-outcome }}
          failure-final-outcome: ${{ steps.settle.outcome }}
          predecessors-ok: ${{ job.status == 'success' }}
