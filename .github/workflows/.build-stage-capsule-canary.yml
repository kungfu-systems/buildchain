name: V4 Stage Capsule Canary
on:
  workflow_call:
    inputs:
      consumer:
        description: Stable lowercase consumer identity used in exact evidence roots
        required: true
        type: string
      node-version:
        description: Node.js version used by the declared consumer lifecycle
        required: false
        default: "24"
        type: string
      go-version:
        description: Optional Go version required by the declared consumer lifecycle
        required: false
        default: ""
        type: string
      install-artifact-path:
        description: Real output path produced by lifecycle.install
        required: true
        type: string
      build-artifact-path:
        description: Real output path produced by lifecycle.build
        required: true
        type: string
      verify-artifact-path:
        description: Real output path produced by lifecycle.verify
        required: true
        type: string
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  consumer-admission:
    name: Admit floating-only v4 consumer source
    runs-on: ubuntu-24.04
    outputs:
      receipt-root: ${{ steps.node.outputs.receipt-root }}
      scanner-root: ${{ steps.node.outputs.scanner-root }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Admit floating-only v4 consumer source
        id: node
        uses: ./.buildchain/runtime/actions/build/stage-capsule/admit-consumer
        with:
          request-json: ${{ toJSON(inputs) }}
          workflow-sha: ${{ job.workflow_sha }}
    needs:
      - execution-runtime
  qualify:
    name: Real lifecycle (${{ matrix.platform }})
    needs:
      - consumer-admission
      - execution-runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact consumer source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
        id: source-checkout
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
        if: ${{ always() }}
      - name: Real lifecycle (${{ matrix.platform }})
        id: node
        uses: ./.buildchain/runtime/actions/build/stage-capsule/qualify
        with:
          request-json: ${{ toJSON(inputs) }}
          matrix-json: ${{ toJSON(matrix) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
          workflow-sha: ${{ job.workflow_sha }}
        if: ${{ always() }}
  reconcile:
    name: Reconcile exact three-platform evidence
    needs:
      - consumer-admission
      - qualify
      - execution-runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Reconcile exact three-platform evidence
        id: node
        uses: ./.buildchain/runtime/actions/build/stage-capsule/reconcile
        with:
          request-json: ${{ toJSON(inputs) }}
          workflow-sha: ${{ job.workflow_sha }}
