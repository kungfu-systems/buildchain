name: Buildchain Patrol
on:
  workflow_call:
    inputs:
      cadence:
        description: "Patrol cadence: daily, weekly, or monthly"
        default: daily
        type: string
        required: false
      mode:
        description: Patrol mode. cadence-default keeps the cadence wrapper stable while Buildchain grows
          capabilities.
        default: cadence-default
        type: string
        required: false
      capabilities:
        description: Optional comma/newline separated capability override
        default: ""
        type: string
        required: false
      target-branch:
        description: Protected dev branch to inspect or maintain
        default: ""
        type: string
        required: false
      required-status-checks:
        description: Comma or newline separated required status/check-run name fragments
        default: check / check
        type: string
        required: false
      ready-label:
        description: Required label for PRs eligible to merge. Empty disables the label gate.
        default: ready
        type: string
        required: false
      block-labels:
        description: Comma or newline separated labels that block merging
        default: blocked,do-not-merge,work-in-progress
        type: string
        required: false
      allowed-head-prefixes:
        description: Comma or newline separated allowed source branch prefixes
        default: feature/,fix/,chore/,docs/,ci/,refactor/
        type: string
        required: false
      require-approval:
        description: Require at least one current approval and no latest changes-requested review
        default: true
        type: boolean
        required: false
      same-repository-only:
        description: Reject fork/cross-repository PR heads by default
        default: true
        type: boolean
        required: false
      max-actions:
        description: Maximum actions to take in one run
        default: 1
        type: number
        required: false
      merge-method:
        description: "GitHub merge method for ready dev PRs: merge, squash, or rebase"
        default: merge
        type: string
        required: false
      landing-mode:
        description: "Landing mode for ready dev PRs: auto, direct, or queue"
        default: auto
        type: string
        required: false
      dry-run:
        description: Plan only; do not mutate repository state
        default: true
        type: boolean
        required: false
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      runtime-selection:
        description: Entry-resolved runtime transport for nested workflow jobs.
        type: string
        required: false
        default: ""
    secrets:
      github-token:
        description: Optional token for repository inspection and maintenance. Defaults to github.token.
        required: false
    outputs:
      result-path:
        description: Patrol result JSON path
        value: ${{ jobs.patrol.outputs.result-path }}
      evaluated-count:
        description: Number of PRs evaluated by enabled capabilities
        value: ${{ jobs.patrol.outputs.evaluated-count }}
      action-count:
        description: Number of actions taken, or planned in dry-run mode
        value: ${{ jobs.patrol.outputs.action-count }}
      skipped-count:
        description: Number of skipped PRs
        value: ${{ jobs.patrol.outputs.skipped-count }}
      planned-count:
        description: Number of stable-interface checks not yet implemented
        value: ${{ jobs.patrol.outputs.planned-count }}
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
concurrency:
  group: buildchain-patrol-${{ github.repository }}-${{ inputs.target-branch || github.ref_name }}
  cancel-in-progress: false
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
          selection: ${{ inputs.runtime-selection }}
    timeout-minutes: 5
  patrol:
    name: Patrol
    runs-on: ubuntu-24.04
    outputs:
      result-path: ${{ steps.patrol.outputs.result-path }}
      evaluated-count: ${{ steps.patrol.outputs.evaluated-count }}
      action-count: ${{ steps.patrol.outputs.action-count }}
      skipped-count: ${{ steps.patrol.outputs.skipped-count }}
      planned-count: ${{ steps.patrol.outputs.planned-count }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Patrol protected development
        id: patrol
        uses: ./.buildchain/runtime/actions/governance/repository/patrol
        with:
          request-json: ${{ toJSON(inputs) }}
          runtime-repository: kungfu-systems/buildchain
          runtime-ref: ${{ env.BUILDCHAIN_RUNTIME_SHA }}
          github-token: ${{ secrets.github-token || github.token }}
    needs:
      - execution-runtime
