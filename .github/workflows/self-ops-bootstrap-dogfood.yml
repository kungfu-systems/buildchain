name: Universal Bootstrap Exact-Candidate Self-Dogfood

on:
  pull_request:
    branches:
      - dev/v4/v4.1
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: "Exact candidate SHA"
        required: true
        type: string
      pull-request:
        description: "Same-repository candidate-to-dev review PR"
        required: true
        type: number
      consumer-sha:
        description: "Exact unchanged Buildchain consumer SHA"
        required: true
        type: string

permissions:
  actions: write
  artifact-metadata: write
  attestations: write
  checks: write
  contents: write
  deployments: write
  id-token: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  security-events: write
  statuses: write

jobs:
  prepare:
    name: Prepare exact candidate requests
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.node.outputs.ready }}
      candidate-sha: ${{ steps.node.outputs.candidate-sha }}
      conformance-request: ${{ steps.node.outputs.conformance-request }}
      alpha-request: ${{ steps.node.outputs.alpha-request }}
      stable-request: ${{ steps.node.outputs.stable-request }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Prepare exact candidate requests
        id: node
        uses: ./.buildchain/workflow-shell/actions/workflow/bootstrap-dogfood-prepare
        with:
          request-json: ${{ toJSON(inputs) }}

  primary-conformance:
    name: Candidate Bootstrap candidate-engine conformance
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    uses: ./.github/workflows/public-ops-bootstrap.yml
    with:
      request-json: ${{ needs.prepare.outputs.conformance-request }}
    secrets: inherit

  recovery-conformance:
    name: Consumer recovery candidate-engine conformance
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    uses: ./.github/workflows/public-ops-bootstrap-recovery.yml
    with:
      request-json: ${{ needs.prepare.outputs.conformance-request }}
    secrets: inherit

  primary-alpha:
    name: Candidate Bootstrap Alpha-shaped rehearsal
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    uses: ./.github/workflows/public-ops-bootstrap.yml
    with:
      request-json: ${{ needs.prepare.outputs.alpha-request }}
    secrets: inherit

  recovery-alpha:
    name: Consumer recovery Alpha-shaped rehearsal
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    uses: ./.github/workflows/public-ops-bootstrap-recovery.yml
    with:
      request-json: ${{ needs.prepare.outputs.alpha-request }}
    secrets: inherit

  primary-stable:
    name: Candidate Bootstrap stable-shaped rehearsal
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    uses: ./.github/workflows/public-ops-bootstrap.yml
    with:
      request-json: ${{ needs.prepare.outputs.stable-request }}
    secrets: inherit

  recovery-stable:
    name: Consumer recovery stable-shaped rehearsal
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    uses: ./.github/workflows/public-ops-bootstrap-recovery.yml
    with:
      request-json: ${{ needs.prepare.outputs.stable-request }}
    secrets: inherit

  reconcile:
    name: Prove primary and recovery semantic equivalence
    needs:
      - prepare
      - primary-conformance
      - recovery-conformance
      - primary-alpha
      - recovery-alpha
      - primary-stable
      - recovery-stable
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Prove primary and recovery semantic equivalence
        id: node
        uses: ./.buildchain/workflow-shell/actions/workflow/bootstrap-dogfood-reconcile
        with:
          needs-prepare-outputs-candidate-sha: ${{ toJSON(needs.prepare.outputs.candidate-sha) }}
          needs-primary-conformance-outputs-result-json: ${{ toJSON(needs.primary-conformance.outputs.result-json) }}
          needs-recovery-conformance-outputs-result-json: ${{ toJSON(needs.recovery-conformance.outputs.result-json) }}
          needs-primary-alpha-outputs-result-json: ${{ toJSON(needs.primary-alpha.outputs.result-json) }}
          needs-recovery-alpha-outputs-result-json: ${{ toJSON(needs.recovery-alpha.outputs.result-json) }}
          needs-primary-stable-outputs-result-json: ${{ toJSON(needs.primary-stable.outputs.result-json) }}
          needs-recovery-stable-outputs-result-json: ${{ toJSON(needs.recovery-stable.outputs.result-json) }}
