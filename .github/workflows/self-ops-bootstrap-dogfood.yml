name: Universal Bootstrap Exact-Candidate Self-Dogfood
on:
  pull_request:
    branches:
      - dev/v4/v4.1
  workflow_dispatch:
    inputs:
      request-json:
        description: Optional typed request passed through the public Bootstrap API.
        required: false
        default: ""
        type: string
      candidate-sha:
        description: Exact candidate SHA
        required: true
        type: string
      pull-request:
        description: Same-repository candidate-to-dev review PR
        required: true
        type: number
      consumer-sha:
        description: Exact unchanged Buildchain consumer SHA
        required: true
        type: string
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
      recovery-runtime-ref:
        description: Transient repaired runtime used through the same public entry.
        required: false
        type: string
        default: ""
permissions:
  actions: write
  artifact-metadata: write
  attestations: write
  checks: write
  contents: write
  discussions: write
  deployments: write
  id-token: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  security-events: write
  statuses: write
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
    timeout-minutes: 5
  prepare:
    if: ${{ !inputs.request-json }}
    name: Prepare exact candidate requests
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.node.outputs.ready }}
      candidate-sha: ${{ steps.node.outputs.candidate-sha }}
      conformance-request: ${{ steps.node.outputs.conformance-request }}
      alpha-request: ${{ steps.node.outputs.alpha-request }}
      stable-request: ${{ steps.node.outputs.stable-request }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Prepare exact candidate requests
        id: node
        uses: ./.buildchain/runtime/actions/workflow/dogfood/prepare
        with:
          request-json: ${{ toJSON(inputs) }}
    needs:
      - execution-runtime
  primary-conformance:
    name: Candidate Bootstrap candidate-engine conformance
    needs:
      - prepare
      - execution-runtime
    if: ${{ always() && needs.execution-runtime.result == 'success' && (inputs.request-json != '' || needs.prepare.outputs.ready == 'true') }}
    uses: kungfu-systems/buildchain/.github/workflows/public-ops-bootstrap.yml@v4
    with:
      request-json: ${{ inputs.request-json || needs.prepare.outputs.conformance-request }}
      runtime-ref: ${{ inputs.runtime-ref }}
    secrets: inherit
  recovery-conformance:
    name: Consumer recovery candidate-engine conformance
    needs:
      - prepare
      - execution-runtime
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    uses: kungfu-systems/buildchain/.github/workflows/public-ops-bootstrap.yml@v4
    with:
      request-json: ${{ needs.prepare.outputs.conformance-request }}
      runtime-ref: ${{ inputs.recovery-runtime-ref }}
    secrets: inherit
  primary-alpha:
    name: Candidate Bootstrap Alpha-shaped rehearsal
    needs:
      - prepare
      - execution-runtime
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    uses: kungfu-systems/buildchain/.github/workflows/public-ops-bootstrap.yml@v4
    with:
      request-json: ${{ needs.prepare.outputs.alpha-request }}
      runtime-ref: ${{ inputs.runtime-ref }}
    secrets: inherit
  recovery-alpha:
    name: Consumer recovery Alpha-shaped rehearsal
    needs:
      - prepare
      - execution-runtime
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    uses: kungfu-systems/buildchain/.github/workflows/public-ops-bootstrap.yml@v4
    with:
      request-json: ${{ needs.prepare.outputs.alpha-request }}
      runtime-ref: ${{ inputs.recovery-runtime-ref }}
    secrets: inherit
  primary-stable:
    name: Candidate Bootstrap stable-shaped rehearsal
    needs:
      - prepare
      - execution-runtime
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    uses: kungfu-systems/buildchain/.github/workflows/public-ops-bootstrap.yml@v4
    with:
      request-json: ${{ needs.prepare.outputs.stable-request }}
      runtime-ref: ${{ inputs.runtime-ref }}
    secrets: inherit
  recovery-stable:
    name: Consumer recovery stable-shaped rehearsal
    needs:
      - prepare
      - execution-runtime
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    uses: kungfu-systems/buildchain/.github/workflows/public-ops-bootstrap.yml@v4
    with:
      request-json: ${{ needs.prepare.outputs.stable-request }}
      runtime-ref: ${{ inputs.recovery-runtime-ref }}
    secrets: inherit
  reconcile:
    name: Prove primary and recovery semantic equivalence
    needs:
      - prepare
      - primary-conformance
      - recovery-conformance
      - primary-alpha
      - recovery-alpha
      - primary-stable
      - recovery-stable
      - execution-runtime
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Prove primary and recovery semantic equivalence
        id: node
        uses: ./.buildchain/runtime/actions/workflow/dogfood/reconcile
        with:
          candidate-sha: ${{ needs.prepare.outputs.candidate-sha }}
          observations-json: ${{ toJSON(needs) }}
