name: V4 Retained Candidate Tail Reseal

on:
  workflow_call:
    inputs:
      universal-request-json:
        description: "Versioned exact-candidate request envelope; empty preserves the compatibility path"
        default: ""
        required: false
        type: string
      request-json:
        description: Exact rooted v4 tail-reseal request JSON
        required: true
        type: string
      consumer-policy-receipt-json:
        description: Original candidate floating-consumer policy receipt JSON
        required: true
        type: string
      macos-finalization-command:
        description: Reviewed macOS signing-finalization command that emits provider readbacks
        required: true
        type: string
      artifact-retention-days:
        description: Retention window for resealed candidate evidence
        required: false
        default: 7
        type: number
    secrets:
      BUILDCHAIN_EVIDENCE_READ_TOKEN:
        description: Read-only token for cross-repository run and artifact evidence
        required: true
      BUILDCHAIN_SIGNING_TOKEN:
        description: Credential-island token available only to macOS finalization
        required: true
    outputs:
      release-candidate-passport-json:
        description: Standard v4 candidate Release Passport summary
        value: ${{ jobs.seal.outputs.release-candidate-passport-json }}
      tail-reseal-receipt-root:
        description: Root of the independently read-back tail-reseal receipt
        value: ${{ jobs.seal.outputs.tail-reseal-receipt-root }}

permissions:
  actions: read
  contents: read

jobs:
  universal-bootstrap:
    name: Universal exact-candidate execution
    if: ${{ inputs.universal-request-json != '' }}
    uses: ./.github/workflows/bootstrap.yml
    with:
      request-json: ${{ inputs.universal-request-json }}

  plan:
    if: ${{ inputs.universal-request-json == '' }}
    name: Admit exact retained candidate
    runs-on: ubuntu-24.04
    outputs:
      request-artifact: ${{ steps.names.outputs.request-artifact }}
      platforms-json: ${{ steps.plan.outputs.platforms-json }}
      source-run-id: ${{ steps.plan.outputs.source-run-id }}
      source-run-attempt: ${{ steps.plan.outputs.source-run-attempt }}
      source-sha: ${{ steps.plan.outputs.source-sha }}
      source-tree-sha: ${{ steps.plan.outputs.source-tree-sha }}
      runtime-sha: ${{ steps.plan.outputs.runtime-sha }}
      consumer-policy-receipt-root: ${{ steps.plan.outputs.consumer-policy-receipt-root }}
      warrant-readback-root: ${{ steps.plan.outputs.warrant-readback-root }}
      signing-provider-readback-root: ${{ steps.plan.outputs.signing-provider-readback-root }}
      release-tail-provider-readback-root: ${{ steps.plan.outputs.release-tail-provider-readback-root }}
      signing-authority-repository: ${{ steps.plan.outputs.signing-authority-repository }}
      signing-authority-run-id: ${{ steps.plan.outputs.signing-authority-run-id }}
      signing-result-artifact: ${{ steps.plan.outputs.signing-result-artifact }}
      target-version: ${{ steps.plan.outputs.target-version }}
      plan-root: ${{ steps.plan.outputs.plan-root }}
      admission-root: ${{ steps.admit.outputs.admission-root }}
    steps:
      - name: Resolve exact called-workflow runtime
        id: runtime
        shell: bash
        env:
          BUILDCHAIN_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${BUILDCHAIN_WORKFLOW_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::job.workflow_sha is not an exact commit SHA"
            exit 1
          fi
          printf 'sha=%s\n' "$(printf '%s' "${BUILDCHAIN_WORKFLOW_SHA}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"
      - name: Checkout exact Buildchain tail runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ steps.runtime.outputs.sha }}
          path: .buildchain/v4-runtime
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Materialize data-only recovery inputs
        env:
          BUILDCHAIN_TAIL_RESEAL_REQUEST_JSON: ${{ inputs.request-json }}
          BUILDCHAIN_CONSUMER_POLICY_RECEIPT_JSON: ${{ inputs.consumer-policy-receipt-json }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          fs.mkdirSync(".buildchain/tail-reseal", { recursive: true });
          for (const [name, value] of [
            ["request.json", process.env.BUILDCHAIN_TAIL_RESEAL_REQUEST_JSON],
            ["consumer-policy-receipt.json", process.env.BUILDCHAIN_CONSUMER_POLICY_RECEIPT_JSON],
          ]) {
            const parsed = JSON.parse(value);
            fs.writeFileSync(`.buildchain/tail-reseal/${name}`, `${JSON.stringify(parsed, null, 2)}\n`);
          }
          NODE
      - name: Plan effect-pure reuse and explicit macOS tail
        id: plan
        run: >-
          node .buildchain/v4-runtime/bin/buildchain.mjs tail-reseal plan
          --request .buildchain/tail-reseal/request.json
          --output .buildchain/tail-reseal/plan.json
      - name: Verify runtime, source event, and original consumer policy bindings
        env:
          BUILDCHAIN_RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
          BUILDCHAIN_SOURCE_SHA: ${{ github.sha }}
          BUILDCHAIN_POLICY_ROOT: ${{ steps.plan.outputs.consumer-policy-receipt-root }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { verifyV4FloatingConsumerPolicyReceipt } from "./.buildchain/v4-runtime/packages/core/v4-floating-consumer-policy.js";
          const request = JSON.parse(fs.readFileSync(".buildchain/tail-reseal/request.json", "utf8"));
          const receipt = JSON.parse(fs.readFileSync(".buildchain/tail-reseal/consumer-policy-receipt.json", "utf8"));
          if (request.runtime.sha !== process.env.BUILDCHAIN_RUNTIME_SHA) throw new Error("tail runtime differs from job.workflow_sha");
          if (request.source.sha !== process.env.BUILDCHAIN_SOURCE_SHA) throw new Error("tail source differs from the fresh workflow source");
          const result = verifyV4FloatingConsumerPolicyReceipt({
            receipt,
            receiptRoot: process.env.BUILDCHAIN_POLICY_ROOT,
            repository: request.repository,
            sourceSha: request.source.sha,
            resolvedRuntimeSha: request.runtime.sha,
          });
          if (!result.ok) throw new Error(`consumer policy receipt invalid: ${result.failures.map(({ code }) => code).join(", ")}`);
          NODE
      - name: Read back failed run, retained archives, and signing authority
        id: admit
        env:
          GITHUB_TOKEN: ${{ secrets.BUILDCHAIN_EVIDENCE_READ_TOKEN }}
        run: >-
          node .buildchain/v4-runtime/bin/buildchain.mjs tail-reseal admit
          --request .buildchain/tail-reseal/request.json
          --output .buildchain/tail-reseal/admission.json
      - name: Name retained request evidence
        id: names
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.source-sha }}
        run: echo "request-artifact=v4-tail-reseal-request-${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Upload exact request, policy, admission, and plan
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.names.outputs.request-artifact }}
          path: .buildchain/tail-reseal/*.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  platforms:
    if: ${{ inputs.universal-request-json == '' }}
    name: Retain or reseal ${{ matrix.platform.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms-json) }}
    runs-on: ${{ fromJSON(matrix.platform.runner) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          persist-credentials: false
      - name: Checkout exact Buildchain tail runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ needs.plan.outputs.runtime-sha }}
          path: .buildchain/v4-runtime
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Download exact tail plan
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.plan.outputs.request-artifact }}
          path: .buildchain/tail-reseal
      - name: Download retained platform payload
        uses: actions/download-artifact@v7.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.plan.outputs.source-run-id }}
          name: ${{ matrix.platform.artifactName }}
          path: .
      - name: Download retained platform manifest
        uses: actions/download-artifact@v7.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.plan.outputs.source-run-id }}
          name: ${{ matrix.platform.manifestArtifactName }}
          path: .buildchain/artifacts/${{ matrix.platform.id }}
      - name: Verify exact retained bytes before any effect
        run: >-
          node .buildchain/v4-runtime/bin/buildchain.mjs tail-reseal verify-platform
          --request .buildchain/tail-reseal/request.json
          --platform "${{ matrix.platform.id }}"
          --artifact-root .
          --mode retained
          --output ".buildchain/tail-reseal/${{ matrix.platform.id }}-readback.json"
      - name: Download immutable signing authority result
        if: matrix.platform.id == 'macos-arm64'
        uses: actions/download-artifact@v7.0.0
        with:
          github-token: ${{ secrets.BUILDCHAIN_EVIDENCE_READ_TOKEN }}
          repository: ${{ needs.plan.outputs.signing-authority-repository }}
          run-id: ${{ needs.plan.outputs.signing-authority-run-id }}
          name: ${{ needs.plan.outputs.signing-result-artifact }}
          path: .buildchain/tail-reseal/signing-result
      - name: Execute fenced macOS signing-finalization tail
        if: matrix.platform.id == 'macos-arm64'
        env:
          BUILDCHAIN_SIGNING_TOKEN: ${{ secrets.BUILDCHAIN_SIGNING_TOKEN }}
          BUILDCHAIN_TAIL_RESEAL_COMMAND: ${{ inputs.macos-finalization-command }}
          BUILDCHAIN_TAIL_RESEAL_REQUEST_PATH: .buildchain/tail-reseal/request.json
          BUILDCHAIN_TAIL_RESEAL_SIGNING_RESULT_ROOT: .buildchain/tail-reseal/signing-result
        run: bash -euo pipefail -c "${BUILDCHAIN_TAIL_RESEAL_COMMAND}"
      - name: Verify independent signing and release-tail readbacks
        if: matrix.platform.id == 'macos-arm64'
        env:
          EXPECTED_SIGNING_ROOT: ${{ needs.plan.outputs.signing-provider-readback-root }}
          EXPECTED_RELEASE_TAIL_ROOT: ${{ needs.plan.outputs.release-tail-provider-readback-root }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          for (const [file, expected] of [
            [".buildchain/tail-reseal/signing-provider-readback.json", process.env.EXPECTED_SIGNING_ROOT],
            [".buildchain/tail-reseal/release-tail-provider-readback.json", process.env.EXPECTED_RELEASE_TAIL_ROOT],
          ]) {
            const actual = `sha256:${crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex")}`;
            if (actual !== expected) throw new Error(`${file} root mismatch`);
          }
          NODE
      - name: Verify resealed macOS bytes and provider evidence
        if: matrix.platform.id == 'macos-arm64'
        run: >-
          node .buildchain/v4-runtime/bin/buildchain.mjs tail-reseal verify-platform
          --request .buildchain/tail-reseal/request.json
          --platform macos-arm64
          --artifact-root .
          --mode resealed
          --provider-readback-root "${{ needs.plan.outputs.signing-provider-readback-root }}"
          --output .buildchain/tail-reseal/macos-arm64-readback.json
      - name: Upload retained or resealed platform payload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.platform.artifactName }}
          path: |
            ${{ matrix.platform.artifactPaths[0] }}
            ${{ matrix.platform.artifactPaths[1] }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
          compression-level: 0
      - name: Upload platform manifest and readback
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.platform.manifestArtifactName }}
          path: |
            .buildchain/artifacts/${{ matrix.platform.id }}/manifest.json
            .buildchain/tail-reseal/${{ matrix.platform.id }}-readback.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  seal:
    if: ${{ inputs.universal-request-json == '' }}
    name: Seal standard candidate Passport
    needs: [plan, platforms]
    runs-on: ubuntu-24.04
    outputs:
      release-candidate-passport-json: ${{ steps.passport.outputs.release-candidate-passport-json }}
      tail-reseal-receipt-root: ${{ steps.receipt.outputs.receipt-root }}
    steps:
      - name: Checkout exact Buildchain tail runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ needs.plan.outputs.runtime-sha }}
          path: .buildchain/v4-runtime
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Download exact tail plan
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.plan.outputs.request-artifact }}
          path: .buildchain/tail-reseal
      - name: Download platform manifests and readbacks
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: "*-manifest-*"
          path: .buildchain/tail-reseal/platforms
      - name: Aggregate exact retained platform summary
        id: summary
        env:
          BUILDCHAIN_SUMMARY_INPUT: .buildchain/tail-reseal/platforms
          BUILDCHAIN_SUMMARY_OUTPUT: .buildchain/tail-reseal/build-summary.json
          BUILDCHAIN_ARTIFACT_NAME: v4-tail-reseal
          BUILDCHAIN_PLATFORM_COUNT: 4
          BUILDCHAIN_EXPECTED_PLATFORMS_JSON: ${{ needs.plan.outputs.platforms-json }}
          BUILDCHAIN_TRUSTED_EVENT: "true"
          BUILDCHAIN_PUBLISH_CHANNEL: alpha
          BUILDCHAIN_PUBLISH_ALLOWED: "true"
          BUILDCHAIN_PUBLISH_REASON: exact-v4-tail-reseal
          BUILDCHAIN_PUBLISH_SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          BUILDCHAIN_PUBLISH_SOURCE_LOCKED: "true"
          BUILDCHAIN_PUBLISH_SOURCE_CHANNEL: alpha
          BUILDCHAIN_PUBLISH_SOURCE_LINE: alpha/v4/v4.0
          BUILDCHAIN_PUBLISH_SOURCE_CONSUMER_VERSION: ${{ needs.plan.outputs.target-version }}
          BUILDCHAIN_SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          BUILDCHAIN_SOURCE_TREE_SHA: ${{ needs.plan.outputs.source-tree-sha }}
          BUILDCHAIN_RUNTIME_REF: v4-alpha
          BUILDCHAIN_RUNTIME_SHA: ${{ needs.plan.outputs.runtime-sha }}
          BUILDCHAIN_RUNTIME_CLASS: alpha
          BUILDCHAIN_RUNTIME_OVERRIDE: "false"
          BUILDCHAIN_WORKFLOW_SHELL_REF: v4-alpha
        run: node .buildchain/v4-runtime/scripts/aggregate-build-summary.mjs
      - name: Generate standard v4 candidate Release Passport
        id: passport
        env:
          BUILDCHAIN_BUILD_SUMMARY_PATH: .buildchain/tail-reseal/build-summary.json
          BUILDCHAIN_RC_PASSPORT_PATH: .buildchain/tail-reseal/release-candidate-passport.json
          BUILDCHAIN_RC_TARGET_CHANNEL: alpha
          BUILDCHAIN_RC_VERSION: ${{ needs.plan.outputs.target-version }}
          BUILDCHAIN_RC_SOURCE_HEAD_SHA: ${{ needs.plan.outputs.source-sha }}
          BUILDCHAIN_RC_MERGE_REF_SHA: ${{ needs.plan.outputs.source-sha }}
          BUILDCHAIN_RC_SOURCE_TREE_HASH: ${{ needs.plan.outputs.source-tree-sha }}
          BUILDCHAIN_RUNTIME_REF: v4-alpha
          BUILDCHAIN_RUNTIME_SHA: ${{ needs.plan.outputs.runtime-sha }}
          BUILDCHAIN_WORKFLOW_SHELL_REF: v4-alpha
          BUILDCHAIN_V4_POLICY_RECEIPT_JSON: ${{ inputs.consumer-policy-receipt-json }}
          BUILDCHAIN_V4_POLICY_RECEIPT_ROOT: ${{ needs.plan.outputs.consumer-policy-receipt-root }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node .buildchain/v4-runtime/scripts/generate-release-candidate-passport.mjs
      - name: Seal tail receipt after all provider readbacks
        id: receipt
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          node .buildchain/v4-runtime/bin/buildchain.mjs tail-reseal seal
          --request .buildchain/tail-reseal/request.json
          --plan .buildchain/tail-reseal/plan.json
          --readbacks .buildchain/tail-reseal/platforms
          --passport .buildchain/tail-reseal/release-candidate-passport.json
          --protected-readback-root "${{ needs.plan.outputs.warrant-readback-root }}"
          --output .buildchain/tail-reseal/receipt.json
      - name: Upload standard candidate and rooted tail evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: v4-tail-reseal-${{ needs.plan.outputs.source-sha }}
          path: |
            .buildchain/tail-reseal/admission.json
            .buildchain/tail-reseal/plan.json
            .buildchain/tail-reseal/build-summary.json
            .buildchain/tail-reseal/release-candidate-passport.json
            .buildchain/tail-reseal/receipt.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
