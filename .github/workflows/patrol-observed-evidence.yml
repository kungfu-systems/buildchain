name: Patrol Observed Evidence

on:
  workflow_call:
    inputs:
      buildchain-ref:
        type: string
        default: v2
        required: false
      build-command:
        type: string
        required: true
      verify-command:
        type: string
        required: true
      artifact-path:
        type: string
        required: true
      manifest-path:
        type: string
        required: true
      evidence-source-repository:
        type: string
        default: ""
        required: false
      evidence-source-ref:
        type: string
        default: ""
        required: false
      evidence-source-path:
        type: string
        default: .observed-evidence/source
        required: false
      production-aws-role-arn:
        type: string
        required: true
      production-bucket:
        type: string
        required: true
      cloudfront-distribution:
        type: string
        required: false
        default: ""
      production-environment:
        type: string
        required: false
        default: production
    outputs:
      receipt-path:
        value: ${{ jobs.publish.outputs.receipt-path }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.production-environment }}
    concurrency:
      group: observed-evidence-${{ github.repository }}-${{ inputs.production-bucket }}
      cancel-in-progress: false
    outputs:
      receipt-path: ${{ steps.publish.outputs.receipt-path }}
    steps:
      - name: Admit trusted default-branch caller
        shell: bash
        run: |
          expected="refs/heads/${{ github.event.repository.default_branch }}"
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "::error::observed evidence publication only admits schedule or workflow_dispatch callers"
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "${expected}" ]]; then
            echo "::error::observed evidence publication requires the caller default branch: ${expected}"
            exit 1
          fi

      - name: Checkout caller default branch
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ inputs.buildchain-ref }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Checkout public evidence source
        if: ${{ inputs.evidence-source-repository != '' }}
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.evidence-source-repository }}
          ref: ${{ inputs.evidence-source-ref }}
          path: ${{ inputs.evidence-source-path }}
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Generate observed evidence bundle
        shell: bash
        run: ${{ inputs.build-command }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify caller evidence semantics
        shell: bash
        run: ${{ inputs.verify-command }}

      - name: Verify Buildchain bundle contract
        run: node .buildchain/runtime/scripts/observed-evidence.mjs --manifest "${{ inputs.manifest-path }}" --artifact-root "${{ inputs.artifact-path }}" --bucket "${{ inputs.production-bucket }}"

      - name: Configure scoped production authority
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ inputs.production-aws-role-arn }}
          aws-region: us-east-1

      - name: Publish immutable snapshot then latest
        id: publish
        shell: bash
        run: |
          receipt=".buildchain/observed-evidence/receipt.json"
          mkdir -p "$(dirname "${receipt}")"
          node .buildchain/runtime/scripts/observed-evidence.mjs \
            --manifest "${{ inputs.manifest-path }}" \
            --artifact-root "${{ inputs.artifact-path }}" \
            --bucket "${{ inputs.production-bucket }}" \
            --distribution-id "${{ inputs.cloudfront-distribution }}" \
            --execute true \
            --output "${receipt}"
          echo "receipt-path=${receipt}" >> "${GITHUB_OUTPUT}"

      - name: Upload publication receipt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: observed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.publish.outputs.receipt-path }}
          if-no-files-found: error
