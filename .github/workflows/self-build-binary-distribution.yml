name: Binary Distribution
on:
  push:
    tags:
      - v4.*.*
      - v4.*.*-alpha.*
  workflow_dispatch:
    inputs:
      tag:
        description: Exact v4 release tag; dispatch this workflow at the same tag.
        required: true
permissions:
  contents: read
jobs:
  preflight:
    name: Binary distribution preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Binary distribution preflight
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/binary-distribution-preflight
        with:
          request-json: ${{ toJSON(inputs) }}
  binary:
    name: Build ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      BUILDCHAIN_LOG_PATH: .buildchain/logs/events-${{ matrix.platform }}.jsonl
      BUILDCHAIN_LOG_RUN_ID: binary-${{ github.run_id }}-${{ matrix.platform }}
      BUILDCHAIN_PLATFORM: ${{ matrix.platform }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: darwin-arm64
            os: macos-latest
          - platform: windows-x64
            os: windows-2022
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Build ${{ matrix.platform }}
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/binary-distribution-binary
        with:
          matrix-json: ${{ toJSON(matrix) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  passport:
    name: Collect release passport
    timeout-minutes: 45
    needs:
      - preflight
      - binary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BUILDCHAIN_LOG_PATH: .buildchain/logs/passport.jsonl
      BUILDCHAIN_LOG_RUN_ID: passport-${{ github.run_id }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Collect release passport
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/binary-distribution-passport
        with:
          request-json: ${{ toJSON(inputs) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  dispatch-publication:
    name: Dispatch sealed binary asset publication
    needs: passport
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Dispatch sealed binary asset publication
        id: node
        uses: ./.buildchain/workflow-shell/actions/build/binary-distribution-dispatch-publication
