name: Binary Distribution
on:
  push:
    tags:
      - v4.*.*
      - v4.*.*-alpha.*
  workflow_dispatch:
    inputs:
      tag:
        description: Exact v4 release tag; dispatch this workflow at the same tag.
        required: true
      runtime-ref:
        description: Transient execution runtime; empty selects the consumer lock.
        type: string
        required: false
        default: ""
      contract-lock:
        description: Optional consumer runtime lock path.
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  execution-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - id: select
        uses: $/actions/runtime/selection/resolve
        with:
          runtime-ref: ${{ inputs.runtime-ref }}
          contract-lock: ${{ inputs.contract-lock }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          token: ${{ github.token }}
    timeout-minutes: 5
  preflight:
    name: Binary distribution preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Binary distribution preflight
        id: node
        uses: ./.buildchain/runtime/actions/build/binary/preflight
        with:
          request-json: ${{ toJSON(inputs) }}
    needs:
      - execution-runtime
  binary:
    name: Build ${{ matrix.platform }}
    needs:
      - preflight
      - execution-runtime
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      BUILDCHAIN_LOG_PATH: .buildchain/logs/events-${{ matrix.platform }}.jsonl
      BUILDCHAIN_LOG_RUN_ID: binary-${{ github.run_id }}-${{ matrix.platform }}
      BUILDCHAIN_PLATFORM: ${{ matrix.platform }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: darwin-arm64
            os: macos-latest
          - platform: windows-x64
            os: windows-2022
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        id: source-checkout
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
        if: ${{ always() }}
      - name: Build ${{ matrix.platform }}
        id: node
        uses: ./.buildchain/runtime/actions/build/binary/build
        with:
          matrix-json: ${{ toJSON(matrix) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  passport:
    name: Collect release passport
    timeout-minutes: 45
    needs:
      - preflight
      - binary
      - execution-runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BUILDCHAIN_LOG_PATH: .buildchain/logs/passport.jsonl
      BUILDCHAIN_LOG_RUN_ID: passport-${{ github.run_id }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        id: source-checkout
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
        if: ${{ always() }}
      - name: Collect release passport
        id: node
        uses: ./.buildchain/runtime/actions/build/binary/passport
        with:
          request-json: ${{ toJSON(inputs) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  dispatch-publication:
    name: Dispatch sealed binary asset publication
    needs:
      - passport
      - execution-runtime
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Prepare selected execution runtime
        uses: $/actions/runtime/environment/prepare
        with:
          selection: ${{ needs.execution-runtime.outputs.selection }}
          token: ${{ github.token }}
      - name: Dispatch sealed binary asset publication
        id: node
        uses: ./.buildchain/runtime/actions/build/binary/dispatch-publication
