name: Buildchain Dev Delivery

run-name: "Buildchain PR #${{ github.event.client_payload.pullRequestNumber || inputs.expected-pr-number }} · two-phase Delivery Warrant"

on:
  workflow_dispatch:
    inputs:
      expected-pr-number:
        description: "Exact Buildchain PR number"
        type: number
        required: true
      expected-head-sha:
        description: "Exact 40-character PR head"
        type: string
        required: true
      native-roots-json:
        description: "JSON object containing exact assignmentRoot and initiativeRoot"
        type: string
        required: true
      source-identity-root:
        description: "Immutable semantic source identity root"
        type: string
        required: true
      source-patch-root:
        description: "Immutable source patch or tree-intent root"
        type: string
        required: true
      plan-root:
        description: "Exact qualification plan root"
        type: string
        required: true
      closure-root:
        description: "Exact affected-closure root"
        type: string
        required: true
      dependency-root:
        description: "Exact dependency-graph root"
        type: string
        required: true
      toolchain-root:
        description: "Exact qualification toolchain root"
        type: string
        required: true
      affected-paths-json:
        description: "JSON array of paths covered by source qualification"
        type: string
        required: true
      native-proof-json:
        description: "Optional reusable semantic native proof"
        type: string
        required: false
        default: ""
      native-command:
        description: "Slow native qualification command run under provisional lease"
        type: string
        required: false
        default: "node --test tests/dev-delivery-two-phase.test.mjs tests/dev-delivery-native-run.test.mjs"
      native-heartbeat-seconds:
        description: "Heartbeat cadence while native qualification runs"
        type: number
        required: false
        default: 30
  repository_dispatch:
    types: [buildchain-dev-delivery-wake]
permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  statuses: write

jobs:
  deliver:
    uses: ./.github/workflows/dev-pr-auto-merge.yml
    with:
      buildchain-repository: kungfu-systems/buildchain
      buildchain-ref: ${{ github.sha }}
      target-branch: ${{ github.event.client_payload.targetBranch || 'dev/v3/v3.0' }}
      expected-pr-number: ${{ github.event.client_payload.pullRequestNumber || fromJSON(github.event.inputs.expected-pr-number) }}
      expected-head-sha: ${{ github.event.client_payload.sourceHead || github.event.inputs.expected-head-sha }}
      source-workflow-run-id: ${{ github.event.client_payload.sourceWorkflowRunId || fromJSON(github.run_id) }}
      delivery-warrant-mode: required
      assignment-root: ${{ github.event.client_payload.assignmentRoot || fromJSON(github.event.inputs.native-roots-json).assignmentRoot }}
      initiative-root: ${{ github.event.client_payload.initiativeRoot || fromJSON(github.event.inputs.native-roots-json).initiativeRoot }}
      source-identity-root: ${{ github.event.client_payload.sourceIdentityRoot || github.event.inputs.source-identity-root }}
      source-patch-root: ${{ github.event.client_payload.sourcePatchRoot || github.event.inputs.source-patch-root }}
      plan-root: ${{ github.event.client_payload.planRoot || github.event.inputs.plan-root }}
      closure-root: ${{ github.event.client_payload.closureRoot || github.event.inputs.closure-root }}
      dependency-root: ${{ github.event.client_payload.dependencyRoot || github.event.inputs.dependency-root }}
      toolchain-root: ${{ github.event.client_payload.toolchainRoot || github.event.inputs.toolchain-root }}
      affected-paths-json: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.affectedPaths) || github.event.inputs.affected-paths-json }}
      native-proof-json: ${{ github.event.inputs.native-proof-json || '' }}
      native-command: ${{ github.event.inputs.native-command || 'node --test tests/dev-delivery-two-phase.test.mjs tests/dev-delivery-native-run.test.mjs' }}
      native-heartbeat-seconds: ${{ github.event.inputs.native-heartbeat-seconds && fromJSON(github.event.inputs.native-heartbeat-seconds) || 30 }}
      delivery-class: ${{ github.event.client_payload.deliveryClass || 'native-proof-required' }}
      delivery-priority: ${{ github.event.client_payload.priority || 'ordinary' }}
      required-status-checks: check
      ready-label: ready
      block-labels: blocked,do-not-merge,work-in-progress
      allowed-head-prefixes: feature/,fix/,chore/,docs/,ci/,refactor/,automation/auditable-demo-
      landing-mode: queue
      dry-run: false
    secrets:
      github-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
