name: V4 Declarative Release Tail Dogfood
on:
  workflow_dispatch:
    inputs:
      target-sha:
        description: Exact protected alpha/v4/v4.1 candidate SHA
        required: true
        type: string
      failure-after-capability:
        description: Checkpointed capability after which the first provider invocation is interrupted
        default: artifact.publish
        required: false
        type: string
permissions:
  actions: write
  checks: write
  contents: write
  id-token: write
  pull-requests: write
jobs:
  publish:
    uses: kungfu-systems/buildchain/.github/workflows/public-release-promote.yml@v4
    with:
      request-json: |-
        {
          "schema": "buildchain.promotion-request/v1",
          "allow-repository": "kungfu-systems/buildchain",
          "channel": "alpha",
          "target-ref": "alpha/v4/v4.1",
          "target-sha": ${{ toJSON(inputs.target-sha) }},
          "package-manager": "pnpm",
          "artifact-name": "buildchain-package",
          "release-candidate-workflow-file": "build.yml",
          "release-candidate-workflow-name": "Build",
          "publish-target": "github-release",
          "github-release": true,
          "provider-failure-after-capability": ${{ toJSON(inputs.failure-after-capability) }},
          "publish-artifact-kind": "npm",
          "publish-package-main": "@kungfu-systems/buildchain",
          "release-passport": true,
          "release-passport-product-name": "Buildchain",
          "dry-run": false
        }
    secrets: inherit
