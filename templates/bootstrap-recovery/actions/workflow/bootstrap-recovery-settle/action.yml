name: bootstrap-recovery-settle
description: Execute the bootstrap-recovery recovery-settle capability within its caller job boundary.
inputs:
  needs-recovery-admit-outputs-admission-json:
    description: Caller needs.recovery-admit.outputs.admission-json value.
    required: true
  needs-recovery-execute-outputs-result-json:
    description: Caller needs.recovery-execute.outputs.result-json value.
    required: true
  needs-recovery-admit-outputs-runtime-sha:
    description: Caller needs.recovery-admit.outputs.runtime-sha value.
    required: true
  request-json:
    description: Typed public workflow request.
    required: true
outputs:
  terminal-receipt-json:
    description: terminal-receipt-json node result.
    value: ${{ steps.settle.outputs.terminal-receipt-json }}
  terminal-receipt-root:
    description: terminal-receipt-root node result.
    value: ${{ steps.settle.outputs.terminal-receipt-root }}
  backflow-root:
    description: backflow-root node result.
    value: ${{ steps.backflow.outputs.backflow-root }}
runs:
  using: composite
  steps:
  - uses: actions/setup-node@v6.4.0
    with:
      node-version: '24'
  - name: Seal receipt outside candidate authority
    id: settle
    shell: bash
    env:
      BUILDCHAIN_UNIVERSAL_ADMISSION_JSON: ${{ fromJSON(inputs.needs-recovery-admit-outputs-admission-json) }}
      BUILDCHAIN_UNIVERSAL_RESULT_JSON: ${{ fromJSON(inputs.needs-recovery-execute-outputs-result-json) }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/workflow/nodes/bootstrap-recovery.mjs" terminal
  - name: Checkout exact reviewed backflow coordinator
    uses: actions/checkout@v7.0.0
    with:
      repository: kungfu-systems/buildchain
      ref: ${{ fromJSON(inputs.needs-recovery-admit-outputs-runtime-sha) }}
      path: .buildchain/candidate
      persist-credentials: false
  - uses: ./.buildchain/workflow-shell/.buildchain/bootstrap-recovery/actions/runtime/prepare
    with:
      directory: .buildchain/candidate
  - name: Bind successful delivery to protected backflow
    id: backflow
    shell: bash
    env:
      BUILDCHAIN_UNIVERSAL_REQUEST_JSON: ${{ fromJSON(inputs.request-json).request-json }}
      BUILDCHAIN_UNIVERSAL_TERMINAL_RECEIPT_JSON: ${{ steps.settle.outputs.terminal-receipt-json }}
      GH_TOKEN: ${{ github.token }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/workflow/nodes/bootstrap-recovery.mjs" backflow
