name: bootstrap-recovery-admit
description: Execute the bootstrap-recovery recovery-admit capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
outputs:
  runtime-sha:
    description: runtime-sha node result.
    value: ${{ steps.admit.outputs.runtime-sha }}
  admission-json:
    description: admission-json node result.
    value: ${{ steps.admit.outputs.admission-json }}
runs:
  using: composite
  steps:
  - uses: actions/setup-node@v6.4.0
    with:
      node-version: '24'
  - name: Parse recovery coordinates before candidate code
    id: request
    shell: bash
    env:
      REQUEST_JSON: ${{ fromJSON(inputs.request-json).request-json }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/workflow/nodes/bootstrap-recovery.mjs" request
  - name: Checkout exact Train candidate without persisted credentials
    uses: actions/checkout@v7.0.0
    with:
      repository: ${{ steps.request.outputs.repository }}
      ref: ${{ steps.request.outputs.ref }}
      path: .buildchain/candidate
      persist-credentials: false
  - name: Prove exact independent review before candidate code runs
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ steps.request.outputs.sha }}
      REVIEW_PR: ${{ steps.request.outputs.pr }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/workflow/nodes/bootstrap-recovery.mjs" review
  - uses: ./.buildchain/workflow-shell/.buildchain/bootstrap-recovery/actions/runtime/prepare
    with:
      directory: .buildchain/candidate
  - name: Admit candidate policy and exact-head checks
    id: admit
    shell: bash
    env:
      BUILDCHAIN_UNIVERSAL_REQUEST_JSON: ${{ fromJSON(inputs.request-json).request-json }}
      BUILDCHAIN_UNIVERSAL_CONSUMER_REPOSITORY: ${{ github.repository }}
      BUILDCHAIN_UNIVERSAL_CONSUMER_SHA: ${{ github.sha }}
      BUILDCHAIN_UNIVERSAL_CONSUMER_WORKFLOW_REF: ${{ github.workflow_ref }}
      EXPECTED_SHA: ${{ steps.request.outputs.sha }}
      REVIEW_PR: ${{ steps.request.outputs.pr }}
    run: node "$GITHUB_ACTION_PATH/../../../packages/core/workflow/nodes/bootstrap-recovery.mjs" admit
