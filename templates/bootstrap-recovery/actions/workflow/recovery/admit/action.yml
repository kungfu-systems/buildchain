name: bootstrap-recovery-admit
description: Execute the bootstrap-recovery recovery-admit capability within its caller job boundary.
inputs:
  request-json:
    description: Typed public workflow request.
    required: true
outputs:
  runtime-sha:
    description: runtime-sha node result.
    value: ${{ steps.admit.outputs.runtime-sha }}
  admission-json:
    description: admission-json node result.
    value: ${{ steps.admit.outputs.admission-json }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Parse recovery coordinates before candidate code
      id: request
      uses: ./.buildchain/workflow-shell/.buildchain/bootstrap-recovery/actions/workflow/admission/inspect
      with:
        request-json: ${{ fromJSON(inputs.request-json).request-json }}
        recovery: "true"
    - name: Checkout exact Train candidate without persisted credentials
      uses: actions/checkout@v7.0.0
      with:
        repository: ${{ steps.request.outputs.repository }}
        ref: ${{ steps.request.outputs.discovery-ref }}
        path: .buildchain/candidate
        persist-credentials: false
    - name: Prove exact independent review before candidate code runs
      id: review
      uses: ./.buildchain/workflow-shell/.buildchain/bootstrap-recovery/actions/workflow/admission/review
      with:
        request-json: ${{ fromJSON(inputs.request-json).request-json }}
        token: ${{ github.token }}
    - uses: ./.buildchain/workflow-shell/.buildchain/bootstrap-recovery/actions/runtime/environment/prepare
      with:
        directory: .buildchain/candidate
    - name: Admit candidate policy and exact-head checks
      id: admit
      uses: ./.buildchain/candidate/actions/workflow/admission/admit
      with:
        request-json: ${{ fromJSON(inputs.request-json).request-json }}
        review-json: ${{ steps.review.outputs.review-json }}
