name: Prepare the exact Buildchain runtime
description: Install the runtime's locked production dependencies on Node 24.
inputs:
  directory:
    description: Checked-out Buildchain runtime directory.
    default: .buildchain/workflow-shell
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: "24"
    - name: Prepare locked runtime dependencies
      id: dependencies
      uses: ./.buildchain/workflow-shell/.buildchain/bootstrap-recovery/actions/runtime/dependencies/install
      with:
        directory: ${{ inputs.directory }}
outputs:
  node-path:
    description: Exact Node 24 executable for Buildchain after the caller selects its own toolchain.
    value: ${{ steps.dependencies.outputs.node-path }}
