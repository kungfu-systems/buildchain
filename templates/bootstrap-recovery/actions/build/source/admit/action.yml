name: Admit source checkout
description: Reject failed checkout and optionally verify the admitted immutable source commit.
inputs:
  source-checkout-outcome:
    description: Actual checkout outcome.
    required: true
  directory:
    description: Source checkout directory.
    default: .
  expected-sha:
    description: Optional admitted immutable source commit.
outputs:
  sha:
    description: Verified immutable source commit, when requested.
runs:
  using: node24
  main: dist/index.js
