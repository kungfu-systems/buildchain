name: Buildchain Universal Bootstrap

on:
  workflow_dispatch:
    inputs:
      request-json:
        description: "Versioned Buildchain request envelope"
        required: true
        type: string

permissions:
  actions: write
  artifact-metadata: write
  attestations: write
  checks: write
  contents: write
  deployments: write
  id-token: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  security-events: write
  statuses: write

jobs:
  buildchain:
    name: Execute an exact admitted Buildchain runtime
    uses: kungfu-systems/buildchain/.github/workflows/bootstrap.yml@v4
    with:
      request-json: ${{ inputs.request-json }}
    secrets: inherit
