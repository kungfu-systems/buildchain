name: Universal Buildchain Bootstrap Recovery
on:
  workflow_call:
    inputs:
      request-json:
        description: Versioned exact-candidate request envelope
        required: true
        type: string
    outputs:
      runtime-sha:
        value: ${{ jobs.recovery-admit.outputs.runtime-sha }}
      result-json:
        value: ${{ jobs.recovery-execute.outputs.result-json }}
      terminal-receipt-json:
        value: ${{ jobs.recovery-settle.outputs.terminal-receipt-json }}
      terminal-receipt-root:
        value: ${{ jobs.recovery-settle.outputs.terminal-receipt-root }}
      backflow-root:
        value: ${{ jobs.recovery-settle.outputs.backflow-root }}
permissions:
  contents: read
jobs:
  recovery-admit:
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      runtime-sha: ${{ steps.node.outputs.runtime-sha }}
      admission-json: ${{ steps.node.outputs.admission-json }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Execute bootstrap-recovery-admit
        id: node
        uses: ./.buildchain/workflow-shell/.buildchain/bootstrap-recovery/actions/workflow/bootstrap-recovery-admit
        with:
          request-json: ${{ toJSON(inputs) }}
  recovery-execute:
    needs: recovery-admit
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      checks: write
      contents: write
      deployments: write
      id-token: write
      issues: write
      packages: write
      pages: write
      pull-requests: write
      security-events: write
      statuses: write
    outputs:
      result-json: ${{ steps.node.outputs.result-json }}
    steps:
      - name: Checkout unchanged consumer source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
        id: source-checkout
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
        if: ${{ always() }}
      - name: Execute bootstrap-recovery-execute
        id: node
        uses: ./.buildchain/workflow-shell/.buildchain/bootstrap-recovery/actions/workflow/bootstrap-recovery-execute
        with:
          needs-recovery-admit-outputs-runtime-sha: ${{ toJSON(needs.recovery-admit.outputs.runtime-sha) }}
          request-json: ${{ toJSON(inputs) }}
          needs-recovery-admit-outputs-admission-json: ${{ toJSON(needs.recovery-admit.outputs.admission-json) }}
          source-checkout-outcome: ${{ steps.source-checkout.outcome }}
        if: ${{ always() }}
  recovery-settle:
    needs:
      - recovery-admit
      - recovery-execute
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      terminal-receipt-json: ${{ steps.node.outputs.terminal-receipt-json }}
      terminal-receipt-root: ${{ steps.node.outputs.terminal-receipt-root }}
      backflow-root: ${{ steps.node.outputs.backflow-root }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .buildchain/workflow-shell
          persist-credentials: false
      - name: Execute bootstrap-recovery-settle
        id: node
        uses: ./.buildchain/workflow-shell/.buildchain/bootstrap-recovery/actions/workflow/bootstrap-recovery-settle
        with:
          needs-recovery-admit-outputs-admission-json: ${{ toJSON(needs.recovery-admit.outputs.admission-json) }}
          needs-recovery-execute-outputs-result-json: ${{ toJSON(needs.recovery-execute.outputs.result-json) }}
          needs-recovery-admit-outputs-runtime-sha: ${{ toJSON(needs.recovery-admit.outputs.runtime-sha) }}
          request-json: ${{ toJSON(inputs) }}
