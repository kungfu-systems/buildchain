name: Buildchain Candidate Recovery Dogfood Startup Failure

on:
  workflow_dispatch:
    inputs:
      candidate-run-id:
        description: "Successful candidate run retained for the subsequent recovery dispatch"
        required: true
        type: string

# This fixture deliberately resolves a nonexistent nested reusable workflow at
# a valid protected Buildchain ref. It exists only to prove that a fresh
# resume-from-candidate-run event can recover after GitHub never creates the
# original promotion job graph.
jobs:
  deterministic-startup-router-failure:
    uses: kungfu-systems/buildchain/.github/workflows/__candidate-recovery-dogfood-missing.yml@v3-alpha
    with:
      candidate-run-id: ${{ inputs.candidate-run-id }}
