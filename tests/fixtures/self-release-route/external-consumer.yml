name: Representative external Buildchain release consumer

on:
  workflow_dispatch:

jobs:
  promote:
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@5a6a93ca1064a0df58bd2fa59ef8c523f832882b
    permissions:
      actions: write
      contents: write
      id-token: write
    secrets: inherit
    with:
      buildchain-channel: auto
      buildchain-ref: 5a6a93ca1064a0df58bd2fa59ef8c523f832882b
      target-ref: alpha/v1/v1.0
      target-sha: ${{ github.sha }}
      declarative-release-tail: true
      dry-run: false
