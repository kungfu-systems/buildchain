name: Representative external Buildchain release consumer

on:
  workflow_dispatch:

jobs:
  promote:
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@9a0cdf8d84aacf8c7daaac82efa43d1b34696a03
    permissions:
      actions: write
      contents: write
      id-token: write
    secrets: inherit
    with:
      buildchain-channel: auto
      buildchain-ref: 9a0cdf8d84aacf8c7daaac82efa43d1b34696a03
      target-ref: alpha/v1/v1.0
      target-sha: ${{ github.sha }}
      declarative-release-tail: true
      dry-run: false
