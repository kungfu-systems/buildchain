name: Representative external Buildchain release consumer

on:
  workflow_dispatch:

jobs:
  promote:
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@f28ce21efd8d05b25969ef708edc678d17619b6e
    permissions:
      actions: write
      contents: write
      id-token: write
    secrets: inherit
    with:
      buildchain-channel: auto
      buildchain-ref: f28ce21efd8d05b25969ef708edc678d17619b6e
      target-ref: alpha/v1/v1.0
      target-sha: ${{ github.sha }}
      declarative-release-tail: true
      dry-run: false
