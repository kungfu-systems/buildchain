name: Representative external Buildchain release consumer

on:
  workflow_dispatch:

jobs:
  promote:
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@train/v3/v3.0/consumer-equivalent-self-dogfood
    permissions:
      actions: write
      contents: write
      id-token: write
    secrets: inherit
    with:
      buildchain-channel: auto
      buildchain-ref: train/v3/v3.0/consumer-equivalent-self-dogfood
      target-ref: alpha/v1/v1.0
      target-sha: ${{ github.sha }}
      declarative-release-tail: true
      dry-run: false
