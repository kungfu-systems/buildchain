AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Provider-wide, tag-filtered AWS Budget guard for the zero-warm-capacity
  Windows EC2 JIT runner plane.

Parameters:
  BudgetName:
    Type: String
    Default: kungfu-buildchain-windows-jit-actual-spend
    AllowedPattern: "^[A-Za-z0-9_.-]{1,100}$"
  BudgetLimitUsd:
    Type: Number
    Default: 110
    MinValue: 1
    MaxValue: 110
  ProviderTagKey:
    Type: String
    Default: kungfu:provider
    AllowedValues:
      - kungfu:provider
  ProviderTagValue:
    Type: String
    Default: windows-ec2-jit
    AllowedValues:
      - windows-ec2-jit
  KillParameterName:
    Type: String
    Default: /kungfu/burst/windows/provider-budget-killed
    AllowedPattern: "^/kungfu/burst/windows/[A-Za-z0-9._/-]+$"

Resources:
  KillSwitchTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: kungfu:owner
          Value: buildchain
        - Key: kungfu:plane
          Value: aws-us-elastic-runner-burst
        - Key: kungfu:provider
          Value: windows-ec2-jit

  KillSwitchTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref KillSwitchTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBudgets
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref KillSwitchTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  GuardRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: stop-only-windows-jit-provider-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:ResourceTag/kungfu:plane: aws-us-elastic-runner-burst
                    ec2:ResourceTag/kungfu:provider: windows-ec2-jit
              - Effect: Allow
                Action:
                  - ssm:DescribeParameters
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:DeleteParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kungfu/burst/windows/*"

  GuardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/kungfu/buildchain/aws-us-windows-jit/budget-guard/${AWS::StackName}"
      RetentionInDays: 30

  Guard:
    Type: AWS::Lambda::Function
    DependsOn:
      - GuardLogGroup
    Properties:
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt GuardRole.Arn
      Timeout: 60
      Environment:
        Variables:
          KILL_PARAMETER_NAME: !Ref KillParameterName
          PARAMETER_PREFIX: /kungfu/burst/windows/
      Code:
        ZipFile: |
          import datetime
          import json
          import os
          import boto3

          ec2 = boto3.client("ec2")
          ssm = boto3.client("ssm")
          KILL_PARAMETER_NAME = os.environ["KILL_PARAMETER_NAME"]
          PARAMETER_PREFIX = os.environ["PARAMETER_PREFIX"]

          def handler(event, context):
              now = datetime.datetime.now(datetime.timezone.utc).isoformat()
              paginator = ec2.get_paginator("describe_instances")
              victims = [
                  instance["InstanceId"]
                  for page in paginator.paginate(Filters=[
                      {"Name": "tag:kungfu:plane", "Values": ["aws-us-elastic-runner-burst"]},
                      {"Name": "tag:kungfu:provider", "Values": ["windows-ec2-jit"]},
                      {"Name": "instance-state-name", "Values": ["pending", "running", "stopping", "stopped"]},
                  ])
                  for reservation in page.get("Reservations", [])
                  for instance in reservation.get("Instances", [])
              ]
              ssm.put_parameter(
                  Name=KILL_PARAMETER_NAME,
                  Type="String",
                  Overwrite=True,
                  Value=json.dumps({
                      "state": "KILLED",
                      "reason": "aws-tag-filtered-budget-notification",
                      "observedAt": now,
                  }, separators=(",", ":")),
              )
              if victims:
                  ec2.terminate_instances(InstanceIds=victims)
              parameters = []
              paginator = ssm.get_paginator("describe_parameters")
              for page in paginator.paginate(
                  ParameterFilters=[{
                      "Key": "Name",
                      "Option": "BeginsWith",
                      "Values": [PARAMETER_PREFIX],
                  }]
              ):
                  parameters.extend(
                      row["Name"]
                      for row in page.get("Parameters", [])
                      if row.get("Name") != KILL_PARAMETER_NAME
                  )
              for parameter in sorted(set(parameters)):
                  try:
                      ssm.delete_parameter(Name=parameter)
                  except ssm.exceptions.ParameterNotFound:
                      pass
              result = {
                  "state": "KILLED",
                  "terminatedInstances": victims,
                  "deletedJitParameters": len(set(parameters)),
              }
              print(result)
              return result
      Tags:
        - Key: kungfu:owner
          Value: buildchain
        - Key: kungfu:plane
          Value: aws-us-elastic-runner-burst
        - Key: kungfu:provider
          Value: windows-ec2-jit

  GuardSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      TopicArn: !Ref KillSwitchTopic
      Endpoint: !GetAtt Guard.Arn

  GuardPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Guard
      Principal: sns.amazonaws.com
      SourceArn: !Ref KillSwitchTopic

  ProviderBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Ref BudgetName
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters:
          TagKeyValue:
            - !Sub "user:${ProviderTagKey}$${ProviderTagValue}"
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref KillSwitchTopic
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 95
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref KillSwitchTopic

Outputs:
  BudgetName:
    Value: !Ref BudgetName
  BudgetTagFilter:
    Value: !Sub "user:${ProviderTagKey}$${ProviderTagValue}"
  KillSwitchTopic:
    Value: !Ref KillSwitchTopic
  GuardFunction:
    Value: !Ref Guard
  KillParameterName:
    Value: !Ref KillParameterName
