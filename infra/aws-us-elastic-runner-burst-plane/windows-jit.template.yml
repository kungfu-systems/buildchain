AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Bounded zero-warm-capacity Windows EC2 one-job JIT runner control plane for
  trusted kungfu-systems/kungfu qualification dispatches.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:oidc-provider/token\\.actions\\.githubusercontent\\.com$"
  Repository:
    Type: String
    Default: kungfu-systems/kungfu
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  TrustedRef:
    Type: String
    Default: refs/heads/dev/v4/v4.0
    AllowedPattern: "^refs/heads/[A-Za-z0-9._/-]+$"
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  BudgetLimitUsd:
    Type: Number
    Default: 80
    MinValue: 1
    MaxValue: 80
  MaximumInstanceLifetimeMinutes:
    Type: Number
    Default: 180
    MinValue: 30
    MaxValue: 180
  EnableTagFilteredBudget:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

Conditions:
  TagFilteredBudgetConfirmed: !Equals [!Ref EnableTagFilteredBudget, "true"]

Resources:
  CampaignState:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: kungfu:owner
          Value: buildchain
        - Key: kungfu:plane
          Value: aws-us-elastic-runner-burst
        - Key: kungfu:provider
          Value: windows-ec2-jit

  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only AWS Windows JIT runner
      VpcId: !Ref VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Outbound package, GitHub Actions, and AWS API access
      Tags:
        - Key: Name
          Value: kungfu-buildchain-windows-jit
        - Key: kungfu:owner
          Value: buildchain
        - Key: kungfu:plane
          Value: aws-us-elastic-runner-burst
        - Key: kungfu:provider
          Value: windows-ec2-jit

  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-runner-diagnostics
            Status: Enabled
            ExpirationInDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: kungfu:owner
          Value: buildchain
        - Key: kungfu:plane
          Value: aws-us-elastic-runner-burst
        - Key: kungfu:provider
          Value: windows-ec2-jit

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub "${EvidenceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  RunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: consume-one-jit-config
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kungfu/burst/windows/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${EvidenceBucket.Arn}/windows/*"
      Tags:
        - Key: kungfu:owner
          Value: buildchain
        - Key: kungfu:plane
          Value: aws-us-elastic-runner-burst
        - Key: kungfu:provider
          Value: windows-ec2-jit

  RunnerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref RunnerInstanceRole

  GitHubProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${Repository}:ref:${TrustedRef}"
      Policies:
        - PolicyName: launch-and-clean-card-owned-windows-jit
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/kungfu:plane: aws-us-elastic-runner-burst
                    aws:RequestTag/kungfu:provider: windows-ec2-jit
              - Effect: Allow
                Action:
                  - ec2:TerminateInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:ResourceTag/kungfu:plane: aws-us-elastic-runner-burst
                    ec2:ResourceTag/kungfu:provider: windows-ec2-jit
              - Effect: Allow
                Action:
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeVolumes
                  - ec2:DescribeTags
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kungfu/burst/windows/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource: !GetAtt CampaignState.Arn
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RunnerInstanceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
      Tags:
        - Key: kungfu:owner
          Value: buildchain
        - Key: kungfu:plane
          Value: aws-us-elastic-runner-burst
        - Key: kungfu:provider
          Value: windows-ec2-jit

  ReaperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: reap-only-card-owned-windows-jit
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                Resource: "*"
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:ResourceTag/kungfu:plane: aws-us-elastic-runner-burst
                    ec2:ResourceTag/kungfu:provider: windows-ec2-jit
              - Effect: Allow
                Action: ssm:DeleteParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kungfu/burst/windows/*"
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt CampaignState.Arn

  ReaperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /kungfu/buildchain/aws-us-windows-jit/reaper
      RetentionInDays: 30

  Reaper:
    Type: AWS::Lambda::Function
    DependsOn:
      - ReaperLogGroup
    Properties:
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt ReaperRole.Arn
      Timeout: 60
      Environment:
        Variables:
          MAXIMUM_LIFETIME_MINUTES: !Ref MaximumInstanceLifetimeMinutes
          PARAMETER_PREFIX: /kungfu/burst/windows/
          STATE_TABLE: !Ref CampaignState
      Code:
        ZipFile: |
          import datetime
          import os
          import boto3

          ec2 = boto3.client("ec2")
          ssm = boto3.client("ssm")
          dynamodb = boto3.client("dynamodb")
          MAX_AGE = int(os.environ["MAXIMUM_LIFETIME_MINUTES"]) * 60
          PREFIX = os.environ["PARAMETER_PREFIX"]
          STATE_TABLE = os.environ["STATE_TABLE"]

          def kill_campaign(reason, now):
              dynamodb.update_item(
                  TableName=STATE_TABLE,
                  Key={"pk": {"S": "CONTROL"}},
                  UpdateExpression="SET #state = :killed, reason = :reason, killed_at = :now",
                  ExpressionAttributeNames={"#state": "state"},
                  ExpressionAttributeValues={
                      ":killed": {"S": "KILLED"},
                      ":reason": {"S": reason},
                      ":now": {"N": str(int(now.timestamp()))},
                  },
              )

          def tags(instance):
              return {row["Key"]: row["Value"] for row in instance.get("Tags", [])}

          def handler(event, context):
              now = datetime.datetime.now(datetime.timezone.utc)
              kill_all = bool(event.get("Records"))
              response = ec2.describe_instances(Filters=[
                  {"Name": "tag:kungfu:plane", "Values": ["aws-us-elastic-runner-burst"]},
                  {"Name": "tag:kungfu:provider", "Values": ["windows-ec2-jit"]},
                  {"Name": "instance-state-name", "Values": ["pending", "running", "stopping", "stopped"]},
              ])
              instances = [
                  instance
                  for reservation in response.get("Reservations", [])
                  for instance in reservation.get("Instances", [])
              ]
              victims = []
              parameters = []
              for instance in instances:
                  instance_tags = tags(instance)
                  expired = (now - instance["LaunchTime"]).total_seconds() >= MAX_AGE
                  if kill_all or expired or instance["State"]["Name"] == "stopped":
                      victims.append(instance["InstanceId"])
                      parameter = instance_tags.get("kungfu:jit-parameter", "")
                      if parameter.startswith(PREFIX):
                          parameters.append(parameter)
              if kill_all or victims:
                  kill_campaign(
                      "aws-budget-notification" if kill_all else "runner-lifetime-violation",
                      now,
                  )
              if victims:
                  ec2.terminate_instances(InstanceIds=victims)
              for parameter in sorted(set(parameters)):
                  try:
                      ssm.delete_parameter(Name=parameter)
                  except ssm.exceptions.ParameterNotFound:
                      pass
              print({
                  "killAll": kill_all,
                  "observedInstances": len(instances),
                  "terminatedInstances": victims,
                  "deletedJitParameters": len(set(parameters)),
              })
              return {"terminatedInstances": victims}
      Tags:
        - Key: kungfu:owner
          Value: buildchain
        - Key: kungfu:plane
          Value: aws-us-elastic-runner-burst
        - Key: kungfu:provider
          Value: windows-ec2-jit

  ReaperSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt Reaper.Arn
          Id: reap-expired-windows-jit

  ReaperSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Reaper
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReaperSchedule.Arn

  KillSwitchTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: kungfu:owner
          Value: buildchain
        - Key: kungfu:plane
          Value: aws-us-elastic-runner-burst
        - Key: kungfu:provider
          Value: windows-ec2-jit

  KillSwitchSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      TopicArn: !Ref KillSwitchTopic
      Endpoint: !GetAtt Reaper.Arn

  KillSwitchPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Reaper
      Principal: sns.amazonaws.com
      SourceArn: !Ref KillSwitchTopic

  KillSwitchTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref KillSwitchTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBudgets
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref KillSwitchTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  BurstBudget:
    Type: AWS::Budgets::Budget
    Condition: TagFilteredBudgetConfirmed
    Properties:
      Budget:
        BudgetName: kungfu-buildchain-windows-jit-actual-spend
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters:
          TagKeyValue:
            - user:kungfu:provider$windows-ec2-jit
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref KillSwitchTopic
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 95
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref KillSwitchTopic

Outputs:
  SubnetId:
    Value: !Ref SubnetId
  SecurityGroupId:
    Value: !Ref RunnerSecurityGroup
  InstanceProfileArn:
    Value: !GetAtt RunnerInstanceProfile.Arn
  InstanceProfileName:
    Value: !Ref RunnerInstanceProfile
  InstanceRoleArn:
    Value: !GetAtt RunnerInstanceRole.Arn
  GitHubProvisionerRoleArn:
    Value: !GetAtt GitHubProvisionerRole.Arn
  EvidenceBucket:
    Value: !Ref EvidenceBucket
  CampaignStateTable:
    Value: !Ref CampaignState
  ReaperFunction:
    Value: !Ref Reaper
  KillSwitchTopic:
    Value: !Ref KillSwitchTopic
  TagFilteredBudgetStatus:
    Value: !If
      - TagFilteredBudgetConfirmed
      - enabled-after-management-account-confirmation
      - disabled-until-cost-allocation-tag-is-active
